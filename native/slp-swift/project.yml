# XcodeGen spec for Sona for SLPs (the SwiftUI app). On the Mac:
#   brew install xcodegen
#   cd native/slp-swift && xcodegen
#   open SonaSLP.xcodeproj
# The generated .xcodeproj is not committed (it is rebuilt from this file).
name: SonaSLP
options:
  bundleIdPrefix: com.speaksona
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # pick your team in Xcode › Signing & Capabilities
targets:
  SonaSLP:
    type: application
    platform: iOS
    sources:
      - SonaSLP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaksona.slp
        PRODUCT_NAME: SonaSLP
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Sona for SLPs"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
