<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Watch &amp; Repeat</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    :root{--blue:#1cb0f6;--blue-d:#1597d4;--green:#58cc02;--green-d:#46a302;--ink:#16384f;--muted:#6b86a3;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;}
    body{background:linear-gradient(180deg,#eaf6ff,#dff1ff 60%,#eafbe4);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink);}
    /* hidden until a real clip is confirmed — otherwise we skip straight to the game */
    #app{display:none;width:100%;max-width:430px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;flex-direction:column;align-items:center;}
    #app.show{display:flex;}
    .leo{font-size:54px;line-height:1;animation:bob 2.6s ease-in-out infinite;}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    h1{font-family:"Baloo 2";font-weight:800;font-size:23px;margin-top:8px;line-height:1.2;}
    .vidwrap{position:relative;margin-top:16px;width:100%;border-radius:22px;overflow:hidden;background:#cfe8fb;box-shadow:0 14px 32px -16px rgba(20,90,160,.6);aspect-ratio:1/1;}
    .vidwrap video{width:100%;height:100%;object-fit:cover;display:block;}
    .taphint{position:absolute;left:0;right:0;bottom:8px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none;}
    .btn{margin-top:18px;width:100%;border:none;border-radius:16px;padding:16px;font-family:"Baloo 2";font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;color:#fff;background:var(--green);box-shadow:0 6px 0 0 var(--green-d);cursor:pointer;}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--green-d);}
    .skip{margin-top:12px;background:none;border:none;color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;}
  </style>
</head>
<body>
  <div id="app">
    <div class="leo">🦁</div>
    <h1 id="prompt">Watch how to say it 👀</h1>
    <div class="vidwrap"><video id="vid" playsinline muted loop preload="auto"></video><div class="taphint">tap to hear 🔊</div></div>
    <button class="btn" id="ready">I'm ready! →</button>
    <button class="skip" id="skip">Skip →</button>
  </div>

  <script>
    var Q = new URLSearchParams(location.search);
    var sound = (Q.get("sound") || "").toUpperCase().replace(/[^A-Z]/g, "");
    var word = (Q.get("word") || "").toLowerCase().replace(/[^a-z]/g, "");
    var next = Q.get("next") || "/map.html";
    function go(){ location.replace(next); }

    // Where modeling clips live (drop-in; invisible until they exist):
    //   per word:  /coach/models/<SOUND>/<word>.mp4   (most specific)
    //   per sound: /coach/models/<SOUND>.mp4
    var srcs = [];
    if (sound && word) srcs.push("/coach/models/" + sound + "/" + word + ".mp4");
    if (sound) srcs.push("/coach/models/" + sound + ".mp4");

    if (!srcs.length) { go(); }
    else {
      var vid = document.getElementById("vid"), i = 0, shown = false;
      function tryNext(){ if (i >= srcs.length) { if(!shown) go(); return; } vid.src = srcs[i++]; vid.load(); }
      vid.onerror = tryNext;
      vid.oncanplay = function(){
        if (shown) return; shown = true;
        document.getElementById("app").classList.add("show");
        document.getElementById("prompt").textContent = "Watch how to say " + (word || ("the " + sound + " sound")) + " 👀";
        vid.play().catch(function(){});
      };
      // tap the video to hear it with sound (replays from start, unmuted)
      vid.addEventListener("click", function(){ vid.muted = !vid.muted; vid.currentTime = 0; vid.play().catch(function(){}); });
      document.getElementById("ready").onclick = go;
      document.getElementById("skip").onclick = go;
      // safety: if no clip resolves quickly, just go to the game (true placeholder)
      setTimeout(function(){ if (!shown) go(); }, 1800);
      tryNext();
    }
  </script>
</body>
</html>
