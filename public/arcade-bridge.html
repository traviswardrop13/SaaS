<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Puzzle Bridge</title>
  <link href="/fonts.css" rel="stylesheet">
  <link href="/action.css" rel="stylesheet">
  <link href="/sayplay.css" rel="stylesheet">
  <meta name="theme-color" content="#9fd8ef" />
  <!--
    Puzzle Bridge: the game inside Day 3 of the daily story, "The Puzzle
    Bridge" (STORY1, 22 Oct 2026). Say the word two times and a stone floats
    up out of Rumble River; tap it to turn it the right way up and slide it
    into its hole; eight stones and the bridge to Blossom Island is whole
    (ages 3-4: six stones, no turning, the hole with the same shape). Written
    by hand: the canyon and the bridge are drawn and played in /bridge.js,
    and every word turn, the mic and its quiet rules are /sayplay.js's. It is
    only ever reached from the story, and hands back to the story's ending
    ("See what happens!"), never to Play again.
  -->
  <link href="/bridge.css" rel="stylesheet">
</head>
<body data-phase="boot">
  <div id="app">
    <canvas id="bridgeCanvas" role="img" aria-label="A river canyon on a spring morning, and an old stone bridge with holes where its stones fell out. Say your word to call a stone up, then turn it and slide it into its hole."></canvas>
    <img id="brEcho" src="/assets/crafted/echo-welcome.webp" alt="" aria-hidden="true" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
    <img id="brBuddy" alt="" aria-hidden="true" />
    <button id="brStone" type="button" aria-label="The stone. Arrow keys slide it. Space turns it. Enter lets go."></button>
    <button id="brTurn" class="cream-pill" type="button" hidden aria-label="Turn the stone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.6 3.6v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="top">
      <button id="close" type="button" aria-label="Back home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <span class="hudpill"><span id="ttl">Puzzle Bridge</span></span>
      <span id="spacer"></span>
      <span class="hudpill" id="dots" role="img" aria-label="0 of 8"></span>
    </div>
    <div id="brRow">
      <div id="brBanner" role="status" aria-live="polite">Say the word to call a stone up</div>
    </div>
    <div id="brControls">
      <button id="brHearStep" class="cream-pill" type="button" disabled aria-label="Hear what to do"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Zm12 0a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="brHelp" class="act-pill" type="button" disabled aria-label="Calm river: extra help, if you want it. Say your word again and the water goes still."><img src="/assets/crafted/echo-wave.webp" alt="" onerror="this.style.display='none'"><span class="br-help-label"><span>Calm river</span><span id="brPower" hidden><i id="brPowerFill"></i></span></span></button>
    </div>
    <div id="turnPanel" aria-live="polite">
      <div id="picBox"><span id="pic"></span></div>
      <div id="word"></div>
      <button id="hear" aria-label="Hear it again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Zm12 0a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Hear it</span></button>
      <div id="listenRow">
        <span id="echoWrap"><img id="echoFace" src="/assets/crafted/echo-welcome.webp" alt="Echo" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" /></span>
        <span id="micState"></span>
        <span id="cheer"></span>
        <button id="micBtn" hidden aria-label="Listen again"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <div class="ovl" id="startOvl">
    <div class="ovlCard">
      <img class="br-intro" src="/assets/crafted/home-bridge.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0){this.src='/assets/crafted/echo-welcome.webp';this.className='br-intro fallback';}" />
      <h2 id="startTitle">Puzzle Bridge</h2>
      <p id="startLine">Say each word two times to call a stone up. Then turn it and slide it into its hole.</p>
      <p class="small" id="startSound"></p>
      <button id="startBtn" class="act-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z" fill="#fff"/></svg><span>Let's play</span></button>
    </div>
  </div>
  <div class="ovl" id="primer">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-listen.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2>Let Echo hear you!</h2>
      <p>Say each word two times to call a stone up.</p>
      <p class="small" id="micPromise"></p>
      <button class="btn" id="primerYes">Turn on Echo's ears</button>
      <button class="ghost" id="primerNo">Not now</button>
    </div>
  </div>
  <div class="ovl" id="pauseOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-think.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2>A little bridge break</h2><p>The stones will wait right here.</p>
      <button class="btn" id="resume">Keep playing</button>
    </div>
  </div>
  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <img class="ovlEcho endStar" src="/assets/crafted/echo-cheer.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2 id="endTitle"></h2>
      <p id="endSub"></p>
      <button class="btn" id="again">Play again</button>
      <button class="ghost" id="goHome">Back home</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script src="/crafted-buddies.js"></script>
  <script src="/crafted-words.js"></script>
  <script src="/sayplay.js"></script>
  <script src="/bridge.js"></script>
  <script>
  (function () {
    var S = window.Sona;
    // ONE GAME, BOTH AGES: ages 3-4 (Sona's "simple" play) fit six stones that
    // come up the right way round into a low, short bridge, two holes open at
    // a time; ages 5-8 turn and fit eight along the arch, the river rising at
    // word 5.
    var little = !!(S && S.playStyle && S.playStyle() === "simple");
    if (window.Bridge && Bridge.setLittle) Bridge.setLittle(little);

    // THE CANYON'S OWN SOUNDS (a stone's hum and splash, a turn's whoosh and
    // knock, the thunk of a fit, a soft bonk, the river's roar, the calm, the
    // finale's sparkle), made on the phone and played through the engine, so
    // each waits for a closed mic like every chime. In the iPhone app they are
    // media, as Bubble Pop's pops are: a thunk comes seconds after the mic
    // closes, when an iPhone plays Web Audio as a quiet phone call. A browser
    // keeps Web Audio; a refused element falls back to it, never to silence.
    // MEDIA_PEAK was set without a phone to listen on.
    var RATE = 24000, MEDIA_PEAK = 0.4, WEB_GAIN = 0.16;
    var waves = {}, bufs = {}, players = {}, mediaBroken = false;
    // a sound is a few parts: a tone that slides from f0 to f1, or a puff of
    // noise, each starting at `at` and dying away over `dur` seconds (every
    // sound a different length, so a test can tell them apart)
    var RECIPES = {
      rise: { secs: 0.6, level: 0.7, parts: [{ f0: 196, f1: 262, dur: 0.55, gain: 0.7, fall: 0.8 }, { noise: true, f0: 800, f1: 2400, dur: 0.3, gain: 0.8, fall: 1.6, at: 0.25 }] },
      turn: { secs: 0.28, level: 0.75, parts: [{ noise: true, f0: 400, f1: 1600, dur: 0.16, gain: 0.8, fall: 1.2 }, { f0: 160, f1: 90, dur: 0.12, gain: 1, fall: 2.5, at: 0.14 }] },
      thunk: { secs: 0.32, level: 0.85, parts: [{ f0: 120, f1: 60, dur: 0.26, gain: 1, fall: 2 }, { noise: true, f0: 300, f1: 200, dur: 0.22, gain: 0.5, fall: 1.8, at: 0.02 }] },
      bonk: { secs: 0.3, level: 0.6, parts: [{ f0: 330, f1: 220, dur: 0.22, gain: 1, fall: 1.5 }, { f0: 247, dur: 0.2, gain: 0.5, at: 0.08 }] },
      roar: { secs: 1.0, level: 0.7, parts: [{ noise: true, f0: 140, f1: 420, dur: 0.95, gain: 1, fall: 0.6 }, { f0: 70, dur: 0.9, gain: 0.4, fall: 0.7 }] },
      calm: { secs: 0.65, level: 0.6, parts: [{ f0: 784, dur: 0.5, gain: 0.6, fall: 1.2 }, { f0: 659, dur: 0.45, gain: 0.5, at: 0.12 }, { f0: 523, dur: 0.4, gain: 0.5, at: 0.24 }] },
      sparkle: { secs: 0.8, level: 0.6, parts: [{ f0: 784, dur: 0.3, gain: 0.6 }, { f0: 988, dur: 0.3, gain: 0.6, at: 0.12 }, { f0: 1175, dur: 0.3, gain: 0.6, at: 0.24 }, { f0: 1568, dur: 0.4, gain: 0.6, at: 0.36 }] }
    };
    function wave(name) {
      if (waves[name]) return waves[name];
      var r = RECIPES[name], n = Math.round(RATE * r.secs), a = new Float32Array(n), peak = 0, i, p;
      for (p = 0; p < r.parts.length; p++) {
        var q = r.parts[p], i0 = Math.round((q.at || 0) * RATE), m = Math.round(q.dur * RATE), ph = 0, seed = 7654321 + p * 7919;
        for (i = 0; i < m && i0 + i < n; i++) {
          var t = i / m, f = q.f1 ? q.f0 * Math.pow(q.f1 / q.f0, t) : q.f0, v;
          ph += 6.283185307 * f / RATE;
          if (q.noise) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; v = (seed / 0x3fffffff - 1) * 0.55 + Math.sin(ph) * 0.45; }
          else v = Math.sin(ph);
          a[i0 + i] += v * q.gain * Math.min(1, i / (RATE * 0.004)) * Math.pow(1 - t, q.fall || 1.6);
        }
      }
      for (i = 0; i < n; i++) if (Math.abs(a[i]) > peak) peak = Math.abs(a[i]);
      for (i = 0; i < n; i++) a[i] = a[i] / (peak || 1) * r.level;
      return (waves[name] = a);
    }
    function playWeb(name, ctx, vol) {
      var b = bufs[name];
      if (!b) { var w = wave(name); b = ctx.createBuffer(1, w.length, RATE); b.getChannelData(0).set(w); bufs[name] = b; }
      var src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = b; g.gain.value = WEB_GAIN * vol; src.connect(g); g.connect(ctx.destination); src.start(0);
    }
    function asMedia() { return !mediaBroken && !!(S && S.pcmWave && S.voiceAsMedia && S.voiceAsMedia()); }
    function playMedia(name, ctx, vol) {
      try {
        var p = players[name];
        if (!p) {
          var w = wave(name), bytes = new Uint8Array(w.length * 2), dv = new DataView(bytes.buffer), i;
          for (i = 0; i < w.length; i++) dv.setInt16(i * 2, Math.round(w[i] * MEDIA_PEAK * 32767), true);
          p = new Audio(URL.createObjectURL(S.pcmWave(bytes))); p.preload = "auto";
          p.onerror = function () { mediaBroken = true; };
          players[name] = p;
        }
        try { if (p.currentTime) p.currentTime = 0; } catch (e) {}
        var r = p.play();
        if (r && r.then) r.then(null, function () { mediaBroken = true; try { playWeb(name, ctx, vol); } catch (e) {} });
      } catch (e) { mediaBroken = true; playWeb(name, ctx, vol); }
    }
    // (a level of zero is Sona's own mute: the media path has no volume to
    // turn down, so it must not play at all)
    function sound(name) { return function (ctx, vol) { if (!vol) return; if (asMedia()) playMedia(name, ctx, vol); else playWeb(name, ctx, vol); }; }

    // PLAY AS YOUR BUDDY (BUDDY2): the child's own buddy stands on the near
    // bank opposite Echo (its rest pose, else its badge, else its sticker)
    // and cheers each fit with its own picture, never Echo's.
    (function () {
      var B = window.SonaCraftedBuddies, el = document.getElementById("brBuddy");
      if (!el || !B || !B.stand) return;
      var id = (S && S.buddyId) ? S.buddyId() : "fox";
      var pics = B.stand(el, id, function () { if (window.Bridge && Bridge.setBuddy) Bridge.setBuddy(null); });
      if (pics && window.Bridge && Bridge.setBuddy) Bridge.setBuddy(pics);
    })();

    // the start card says what to do, for this child's age
    var line = little ? "Say each word two times to call a stone up. Then slide it into the hole with the same shape."
      : "Say each word two times to call a stone up. Then turn it and slide it into its hole. Tap Calm river for extra help.";
    try { document.getElementById("startLine").textContent = line; } catch (e) {}
    try { document.getElementById("dots").setAttribute("aria-label", "0 of " + (little ? 6 : 8)); } catch (e) {}
    try { if (little) document.getElementById("brStone").setAttribute("aria-label", "The stone. Arrow keys slide it. Enter lets go."); } catch (e) {}
    // FOUND1: Home's row plays a found game once more (?again=1): Play again
    // and Back home, no hand-back (its story is over), and its round
    // finishes nothing (questEnd answers only today's open story). A replay
    // address of a story not finished yet goes Home: that game is still the
    // story's surprise.
    var replay = location.search === "?again=1";
    // a page brought back from the browser's cache asks again who may be
    // here (another child may be on the phone now, and Play again ends a day)
    window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
    if (replay && !(window.Sona && Sona.storyReplay && Sona.storyReplay("bridge"))) { document.body.hidden = true; location.replace("/today.html"); return; }
    SayPlay.start({
      key: "bridge", title: "Puzzle Bridge",
      intro: little ? "Say each word two times to call a stone up. Then slide it into the hole with the same shape." : "Say each word two times to call a stone up. Then turn it and slide it into its hole. Tap Calm river for extra help.",
      steps: little ? [[], [], [], [], [], []] : [[], [], [], [], [], [], [], []], finale: [],
      done: { title: "The bridge is whole again!", sub: "Every stone is back where it belongs." },
      // STORY1: the end card's one button opens the story's ending; there is
      // no Play again (the day is finished when this round ends)
      exit: replay ? undefined : { href: "/adventure.html?part=end&story=bridge", label: "See what happens!" },
      again: replay ? undefined : false,
      play: window.Bridge,
      sounds: { rise: sound("rise"), turn: sound("turn"), thunk: sound("thunk"), bonk: sound("bonk"), roar: sound("roar"), calm: sound("calm"), sparkle: sound("sparkle") },
      soundMs: { rise: 620, turn: 300, thunk: 340, bonk: 320, roar: 1020, calm: 670, sparkle: 820 }
    });
    // "game opened": the game key only, never the child (a bounced page is hidden)
    if (!document.body.hidden) { try { Sona.track(replay ? "story game replayed" : "game opened", { game: "bridge" }); } catch (e) {} }
  })();
  </script>
</body>
</html>
