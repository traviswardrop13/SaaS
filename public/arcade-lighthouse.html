<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Light the Way</title>
  <link href="/fonts.css" rel="stylesheet">
  <link href="/action.css" rel="stylesheet">
  <link href="/sayplay.css" rel="stylesheet">
  <meta name="theme-color" content="#1b1f4a" />
  <!--
    Light the Way: the game inside Day 1 of the daily story, "The Lighthouse
    Sneeze" (STORY1, 22 Oct 2026). Say the word two times and the lamp
    lights; move the pool of light over the foggy sea and hold it on the lost
    boat; seven boats home, then light up every window in the town (ages
    3-4: five boats and six windows). Written by hand: the sea is drawn and
    played in /lighthouse.js, and every word turn, the mic and its quiet rules
    are /sayplay.js's. It is only ever reached from the story, and hands back
    to the story's ending ("See what happens!"), never to Play again.
  -->
  <link href="/lighthouse.css" rel="stylesheet">
</head>
<body data-phase="boot">
  <div id="app">
    <canvas id="seaCanvas" role="img" aria-label="A dark, foggy sea at night, seen from the lighthouse. Say your word to light the lamp, then move the light to find the lost boat and hold it there."></canvas>
    <img id="lhEcho" src="/assets/crafted/echo-welcome.webp" alt="" aria-hidden="true" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
    <img id="lhBuddy" alt="" aria-hidden="true" />
    <button id="lhLight" type="button" aria-label="The light. Arrow keys move it. Hold Space to shine it on a boat."></button>
    <div id="top">
      <button id="close" type="button" aria-label="Back home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <span class="hudpill"><span id="ttl">Light the Way</span></span>
      <span id="spacer"></span>
      <span class="hudpill" id="dots" role="img" aria-label="0 of 8"></span>
    </div>
    <div id="lhRow">
      <div id="lostCard" role="img" aria-label="Lost boat"><canvas id="lostPic" aria-hidden="true"></canvas><span id="lostLabel">Lost boat</span></div>
      <div id="lhBanner" role="status" aria-live="polite">Say the word to light the lamp</div>
    </div>
    <div id="lhControls">
      <button id="lhHearStep" class="cream-pill" type="button" disabled aria-label="Hear what to do"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Zm12 0a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="lhHelp" class="act-pill" type="button" disabled aria-label="Bright beam: extra help, if you want it. Say your word again for a bigger light."><img src="/assets/crafted/echo-wave.webp" alt="" onerror="this.style.display='none'"><span class="lh-help-label"><span>Bright beam</span><span id="lhPower" hidden><i id="lhPowerFill"></i></span></span></button>
    </div>
    <div id="turnPanel" aria-live="polite">
      <div id="picBox"><span id="pic"></span></div>
      <div id="word"></div>
      <button id="hear" aria-label="Hear it again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Zm12 0a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Hear it</span></button>
      <div id="listenRow">
        <span id="echoWrap"><img id="echoFace" src="/assets/crafted/echo-welcome.webp" alt="Echo" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" /></span>
        <span id="micState"></span>
        <span id="cheer"></span>
        <button id="micBtn" hidden aria-label="Listen again"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <div class="ovl" id="startOvl">
    <div class="ovlCard">
      <img class="lh-intro" src="/assets/crafted/home-lighthouse.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0){this.src='/assets/crafted/echo-welcome.webp';this.className='lh-intro fallback';}" />
      <h2 id="startTitle">Light the Way</h2>
      <p id="startLine">Say each word two times to light the lamp. Then move the light to find a lost boat.</p>
      <p class="small" id="startSound"></p>
      <button id="startBtn" class="act-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z" fill="#fff"/></svg><span>Let's play</span></button>
    </div>
  </div>
  <div class="ovl" id="primer">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-listen.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2>Let Echo hear you!</h2>
      <p>Say each word two times to light the lamp.</p>
      <p class="small" id="micPromise"></p>
      <button class="btn" id="primerYes">Turn on Echo's ears</button>
      <button class="ghost" id="primerNo">Not now</button>
    </div>
  </div>
  <div class="ovl" id="pauseOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-think.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2>A little lighthouse break</h2><p>The boats will wait right here.</p>
      <button class="btn" id="resume">Keep playing</button>
    </div>
  </div>
  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <img class="ovlEcho endStar" src="/assets/crafted/echo-cheer.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2 id="endTitle"></h2>
      <p id="endSub"></p>
      <button class="btn" id="again">Play again</button>
      <button class="ghost" id="goHome">Back home</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script src="/crafted-buddies.js"></script>
  <script src="/crafted-words.js"></script>
  <script src="/sayplay.js"></script>
  <script src="/lighthouse.js"></script>
  <script>
  (function () {
    var S = window.Sona;
    // ONE GAME, BOTH AGES: ages 3-4 (Sona's "simple" play) find five boats and
    // light six windows on a still, lighter sea; ages 5-8 find seven and light
    // twelve, with drifting boats, decoys and the cloud at word 5.
    var little = !!(S && S.playStyle && S.playStyle() === "simple");
    if (window.Lighthouse && Lighthouse.setLittle) Lighthouse.setLittle(little);

    // THE SEA'S OWN SOUNDS (the lamp's whoosh, a boat's toot, the whale's
    // spout, a window's ding), made on the phone and played through the
    // engine, so each waits for a closed mic like every chime. In the iPhone
    // app they are media, as Bubble Pop's pops are: a toot comes seconds
    // after the mic closes, when an iPhone plays Web Audio as a quiet phone
    // call. A browser keeps Web Audio; a refused element falls back to it,
    // never to silence. MEDIA_PEAK was set without a phone to listen on.
    var RATE = 24000, MEDIA_PEAK = 0.4, WEB_GAIN = 0.16;
    var waves = {}, bufs = {}, players = {}, mediaBroken = false;
    // a sound is a few parts: a tone that slides from f0 to f1, or a puff of
    // noise, each starting at `at` and dying away over `dur` seconds
    var RECIPES = {
      whoosh: { secs: 0.6, level: 0.7, parts: [{ noise: true, f0: 300, f1: 1800, dur: 0.55, gain: 1, fall: 1.1 }, { f0: 220, f1: 440, dur: 0.5, gain: 0.25 }] },
      toot: { secs: 0.52, level: 0.8, parts: [{ f0: 233, dur: 0.48, gain: 1, fall: 0.5 }, { f0: 349, dur: 0.48, gain: 0.55, fall: 0.5 }, { f0: 466, dur: 0.46, gain: 0.3, fall: 0.6 }] },
      spout: { secs: 0.5, level: 0.7, parts: [{ noise: true, f0: 1200, f1: 3000, dur: 0.4, gain: 1, fall: 1.4 }, { f0: 500, f1: 900, dur: 0.25, gain: 0.4, at: 0.05 }] },
      ding: { secs: 0.38, level: 0.7, parts: [{ f0: 1318.5, dur: 0.36, gain: 1, fall: 2 }, { f0: 2637, dur: 0.24, gain: 0.3, fall: 2.4 }] },
      plip: { secs: 0.16, level: 0.8, parts: [{ f0: 700, f1: 1100, dur: 0.14, gain: 1 }] }
    };
    function wave(name) {
      if (waves[name]) return waves[name];
      var r = RECIPES[name], n = Math.round(RATE * r.secs), a = new Float32Array(n), peak = 0, i, p;
      for (p = 0; p < r.parts.length; p++) {
        var q = r.parts[p], i0 = Math.round((q.at || 0) * RATE), m = Math.round(q.dur * RATE), ph = 0, seed = 7654321 + p * 7919;
        for (i = 0; i < m && i0 + i < n; i++) {
          var t = i / m, f = q.f1 ? q.f0 * Math.pow(q.f1 / q.f0, t) : q.f0, v;
          ph += 6.283185307 * f / RATE;
          if (q.noise) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; v = (seed / 0x3fffffff - 1) * 0.55 + Math.sin(ph) * 0.45; }
          else v = Math.sin(ph);
          a[i0 + i] += v * q.gain * Math.min(1, i / (RATE * 0.004)) * Math.pow(1 - t, q.fall || 1.6);
        }
      }
      for (i = 0; i < n; i++) if (Math.abs(a[i]) > peak) peak = Math.abs(a[i]);
      for (i = 0; i < n; i++) a[i] = a[i] / (peak || 1) * r.level;
      return (waves[name] = a);
    }
    function playWeb(name, ctx, vol) {
      var b = bufs[name];
      if (!b) { var w = wave(name); b = ctx.createBuffer(1, w.length, RATE); b.getChannelData(0).set(w); bufs[name] = b; }
      var src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = b; g.gain.value = WEB_GAIN * vol; src.connect(g); g.connect(ctx.destination); src.start(0);
    }
    function asMedia() { return !mediaBroken && !!(S && S.pcmWave && S.voiceAsMedia && S.voiceAsMedia()); }
    function playMedia(name, ctx, vol) {
      try {
        var p = players[name];
        if (!p) {
          var w = wave(name), bytes = new Uint8Array(w.length * 2), dv = new DataView(bytes.buffer), i;
          for (i = 0; i < w.length; i++) dv.setInt16(i * 2, Math.round(w[i] * MEDIA_PEAK * 32767), true);
          p = new Audio(URL.createObjectURL(S.pcmWave(bytes))); p.preload = "auto";
          p.onerror = function () { mediaBroken = true; };
          players[name] = p;
        }
        try { if (p.currentTime) p.currentTime = 0; } catch (e) {}
        var r = p.play();
        if (r && r.then) r.then(null, function () { mediaBroken = true; try { playWeb(name, ctx, vol); } catch (e) {} });
      } catch (e) { mediaBroken = true; playWeb(name, ctx, vol); }
    }
    // (a level of zero is Sona's own mute: the media path has no volume to
    // turn down, so it must not play at all)
    function sound(name) { return function (ctx, vol) { if (!vol) return; if (asMedia()) playMedia(name, ctx, vol); else playWeb(name, ctx, vol); }; }

    // PLAY AS YOUR BUDDY (BUDDY2): the child's own buddy stands on the
    // ledge opposite Echo (its rest pose, else its badge, else its sticker)
    // and cheers each find with its own picture, never Echo's.
    (function () {
      var B = window.SonaCraftedBuddies, el = document.getElementById("lhBuddy");
      if (!el || !B || !B.stand) return;
      var id = (S && S.buddyId) ? S.buddyId() : "fox";
      var pics = B.stand(el, id, function () { if (window.Lighthouse && Lighthouse.setBuddy) Lighthouse.setBuddy(null); });
      if (pics && window.Lighthouse && Lighthouse.setBuddy) Lighthouse.setBuddy(pics);
    })();

    // the start card says what to do, for this child's age
    var line = little ? "Say each word two times to light the lamp. Then touch the glowing boat with the light."
      : "Say each word two times to light the lamp. Then move the light to find a lost boat. Tap Bright beam for extra help.";
    try { document.getElementById("startLine").textContent = line; } catch (e) {}
    try { document.getElementById("dots").setAttribute("aria-label", "0 of " + (little ? 6 : 8)); } catch (e) {}
    // FOUND1: Home's row plays a found game once more (?again=1): Play again
    // and Back home, no hand-back (its story is over), and its round
    // finishes nothing (questEnd answers only today's open story). A replay
    // address of a story not finished yet goes Home: that game is still the
    // story's surprise.
    var replay = location.search === "?again=1";
    if (replay && !(window.Sona && Sona.storyReplay && Sona.storyReplay("lighthouse"))) { document.body.hidden = true; location.replace("/today.html"); return; }
    SayPlay.start({
      key: "lighthouse", title: "Light the Way",
      intro: little ? "Say each word two times to light the lamp. Then touch the glowing boat with the light." : "Say each word two times to light the lamp. Then move the light to find a lost boat. Tap Bright beam for extra help.",
      steps: little ? [[], [], [], [], [], []] : [[], [], [], [], [], [], [], []], finale: [],
      done: { title: "Every boat is home!", sub: "You lit the way through the fog." },
      // STORY1: the end card's one button opens the story's ending; there is
      // no Play again (the day is finished when this round ends)
      exit: replay ? undefined : { href: "/adventure.html?part=end&story=lighthouse", label: "See what happens!" },
      again: replay ? undefined : false,
      play: window.Lighthouse,
      sounds: { whoosh: sound("whoosh"), toot: sound("toot"), spout: sound("spout"), ding: sound("ding"), plip: sound("plip") },
      soundMs: { whoosh: 620, toot: 540, spout: 520, ding: 400, plip: 180 }
    });
    // "game opened": the game key only, never the child (a bounced page is hidden)
    if (!document.body.hidden) { try { Sona.track(replay ? "story game replayed" : "game opened", { game: "lighthouse" }); } catch (e) {} }
  })();
  </script>
</body>
</html>
