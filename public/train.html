<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Story Train</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2ec4d6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --teal:#2ec4d6; --teal-d:#1fa9ba; --green:#58cc02; --green-d:#46a302; --ink:#13414a; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:
        radial-gradient(80% 50% at 78% 6%, rgba(255,239,196,.85), rgba(255,239,196,0) 58%),
        radial-gradient(70% 44% at 14% 0%, rgba(255,196,150,.30), rgba(255,196,150,0) 55%),
        linear-gradient(180deg,#dff7fc 0%,#cdeffa 40%,#bfeaf6 64%,#bfe7c6 78%,#a9dca0 100%);
      color:var(--ink);}
    #app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;z-index:6;}
    #close{border:none;background:rgba(255,255,255,.6);color:#4f9aa6;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--teal-d);}
    .stat.count{margin-left:auto;}
    #stage{flex:1;position:relative;overflow:hidden;}
    #hills{position:absolute;left:0;right:0;bottom:64px;height:120px;background:radial-gradient(120px 80px at 20% 100%,#bfe39a 60%,transparent 61%),radial-gradient(160px 95px at 60% 100%,#a9d985 60%,transparent 61%),radial-gradient(130px 85px at 95% 100%,#bfe39a 60%,transparent 61%);}
    #track{position:absolute;left:0;right:0;bottom:54px;height:8px;background:#6b5b73;}
    #track:before{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(90deg,#5a4b62 0 10px,transparent 10px 26px);}
    #station{position:absolute;right:5%;bottom:62px;width:54px;height:48px;}
    #station .roof{position:absolute;top:0;left:-4px;right:-4px;height:16px;background:#ef6f6f;border-radius:7px 7px 3px 3px;}
    #station .wall{position:absolute;top:13px;left:3px;right:3px;bottom:0;background:#ffe1b0;border-radius:3px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06);}
    #station .door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:16px;height:24px;background:#8a6038;border-radius:6px 6px 0 0;}
    #train{position:absolute;bottom:58px;left:6%;transition:left 1s cubic-bezier(.3,.7,.4,1);}
    #train .loco{position:relative;display:block;width:62px;height:40px;}
    #train.chug .loco{animation:chug .2s linear infinite;}
    @keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    #train .cab{position:absolute;left:0;bottom:6px;width:30px;height:30px;background:linear-gradient(180deg,#ff8a8a,#e8484a);border-radius:8px 8px 4px 4px;}
    #train .cab:before{content:"";position:absolute;top:6px;left:6px;width:15px;height:11px;background:#dff3ff;border-radius:3px;}
    #train .nose{position:absolute;left:26px;bottom:6px;width:30px;height:20px;background:linear-gradient(180deg,#ffab5e,#ef7a2a);border-radius:5px 10px 4px 4px;}
    #train .stack{position:absolute;left:47px;bottom:24px;width:9px;height:14px;background:#5b4b62;border-radius:3px;}
    #train .wheel{position:absolute;bottom:-3px;width:16px;height:16px;border-radius:50%;background:#333;box-shadow:inset 0 0 0 4px #888;}
    #train .wheel.a{left:3px;} #train .wheel.b{left:23px;} #train .wheel.c{left:41px;}
    #smoke{position:absolute;bottom:100px;left:9%;width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0;transition:left 1s,opacity .3s;box-shadow:7px -9px 0 -2px rgba(255,255,255,.72),14px -20px 0 -4px rgba(255,255,255,.55);}
    #leoWrap{position:absolute;left:8px;top:8px;width:74px;z-index:4;pointer-events:none;} #leoWrap.react{animation:lpop .55s ease;}
    #leo{width:100%;filter:drop-shadow(0 6px 8px rgba(20,110,120,.25));} @keyframes lpop{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-8px)}100%{transform:scale(1)}}
    #bottom{padding:8px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:9px;background:linear-gradient(180deg,rgba(216,246,251,0),rgba(216,246,251,.75));z-index:6;}
    #sentCard{background:#fff;border-radius:20px;padding:14px 20px;box-shadow:0 8px 20px rgba(20,140,160,.14);max-width:420px;text-align:center;}
    #sentCard b{font-family:"Baloo 2";font-weight:800;font-size:23px;color:var(--teal-d);line-height:1.25;} #sentCard .hl{color:#ef5da8;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--teal-d);min-height:18px;text-align:center;}
    #hearRow{display:flex;gap:10px;} #hear{border:2px solid #b8e3ea;background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;color:var(--teal-d);cursor:pointer;font-size:14px;}
    .mic{width:88px;height:88px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 30%,#5cc6ff,#1cb0f6 60%,#1597d4);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);} .mic.rec{animation:mpulse 1.4s infinite;} .mic svg{width:38px;height:38px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:38px;max-height:38px;overflow:hidden;} .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes mpulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 16px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}
    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#d8f6fb,#a9e6f2);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;} #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(20,110,120,.25));animation:lpop .6s ease;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--teal-d);margin-top:10px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--teal-d);margin-top:18px;box-shadow:0 6px 16px rgba(20,140,160,.14);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:#5f9aa3;text-transform:uppercase;}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);} #win a{margin-top:14px;color:#5f9aa3;font-weight:800;font-size:14px;text-decoration:none;}

    /* ═══════════════════════════════════════════════════════════════════
       VISUAL POLISH LAYER — additive, CSS-only. Mirrors the shared Sona
       design system (sona-drift / sona-floatY / glow look) so Story Train
       speaks the same visual language as the app. Animates transform/opacity
       (box-shadow sparingly); never touches game logic or the DOM. Depth is
       painted on ::before/::after + background layers of existing nodes.
       NOTE: JS may set #stage's background-IMAGE inline when art exists — we
       never fight that; all scenery rides on #stage's pseudo-elements.
       ═══════════════════════════════════════════════════════════════════ */

    /* Reused scenery keyframes (same names/values as /public/sona.css) */
    @keyframes sona-drift{from{transform:translateX(0)}to{transform:translateX(-130vw)}}
    @keyframes sona-floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes sona-twinkle{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}

    /* ── DRIFTING CLOUDS ── a soft parallax sky layer the train rolls past.
       Painted on #stage::before so it sits behind every scene sibling and
       never disturbs an art-drop background-image on #stage itself. The wide
       band + sona-drift gives slow, premium left-ward motion; it loops. */
    #stage::before{
      content:"";position:absolute;top:0;left:0;width:260vw;height:55%;z-index:0;pointer-events:none;opacity:.85;
      background:
        radial-gradient(46px 20px at 10% 26%, #fff 0 60%, rgba(255,255,255,0) 64%),
        radial-gradient(66px 27px at 26% 48%, rgba(255,255,255,.95) 0 60%, rgba(255,255,255,0) 64%),
        radial-gradient(38px 17px at 44% 20%, rgba(255,255,255,.85) 0 60%, rgba(255,255,255,0) 64%),
        radial-gradient(72px 29px at 64% 40%, #fff 0 60%, rgba(255,255,255,0) 64%),
        radial-gradient(50px 21px at 84% 24%, rgba(255,255,255,.9) 0 60%, rgba(255,255,255,0) 64%);
      animation:sona-drift 60s linear infinite;will-change:transform;
    }
    /* ── WARM SUN ── a single gentle glowing sun, high in the corner, with a
       slow breathing twinkle. On #stage::after, kept fully behind the train
       (tree order) and non-interactive. */
    #stage::after{
      content:"";position:absolute;top:7%;right:9%;width:58px;height:58px;border-radius:50%;z-index:0;pointer-events:none;
      background:radial-gradient(circle at 50% 50%, #fff3c4 0 32%, #ffe08a 52%, rgba(255,224,138,0) 72%);
      animation:sona-twinkle 5.5s ease-in-out infinite;will-change:opacity,transform;
    }
    /* Keep the scene (and Leo/controls) above the ambient sky pseudo-layers.
       #stage::after (sun) is last in tree order, so without these the sun would
       paint over the scene — these small z-indexes guarantee correct depth:
       sky(0) < hills(1) < station(2) < train(3) < Leo(4) < bottom(6). */
    #hills{z-index:1;} #track{z-index:1;} #station{z-index:2;} #smoke{z-index:3;} #train{z-index:3;}
    #leoWrap{z-index:4;} #bottom{z-index:6;}

    /* ── ROLLING HILLS ── give the distant hills a touch of depth (soft top
       light + grounding shadow) and a very gentle floaty breathing so the
       countryside feels alive. transform-only → never shifts its layout. */
    #hills{filter:drop-shadow(0 -1px 0 rgba(255,255,255,.4)) drop-shadow(0 6px 8px rgba(60,120,90,.12));
      animation:sona-floatY 9s ease-in-out infinite;will-change:transform;}

    /* ── SMOKESTACK PUFF ── a faint extra wisp above the stack so an idle
       train still reads as "alive" (the JS #smoke handles the moving burst).
       Pure opacity loop on the existing .stack via its ::before. */
    #train .stack::before{
      content:"";position:absolute;left:-2px;top:-12px;width:11px;height:11px;border-radius:50%;
      background:rgba(255,255,255,.7);pointer-events:none;
      animation:puff 2.6s ease-in-out infinite;will-change:transform,opacity;
    }
    @keyframes puff{0%{opacity:0;transform:translateY(2px) scale(.6)}40%{opacity:.7}100%{opacity:0;transform:translateY(-12px) scale(1.15)}}

    /* ── SCORE / PROGRESS PILL ── the sentences counter gets a soft gradient
       fill + a crisp inner highlight (stays pill-rounded). Reads as a small
       premium progress badge to match the rest of the app. */
    .stat.count{
      background:linear-gradient(180deg,#5cd6e6,var(--teal));color:#fff;
      box-shadow:0 3px 9px rgba(31,169,186,.30),inset 0 1px 0 rgba(255,255,255,.45);
    }
    .stat.count #count{font-size:16px;}

    /* ── SENTENCE CARD ── a second, tighter shadow + a faint top sheen for
       real elevation (mirrors the shared .card depth). */
    #sentCard{box-shadow:0 10px 26px rgba(20,140,160,.16),0 2px 6px rgba(20,140,160,.10);
      background:linear-gradient(180deg,#ffffff,#f4fcfe);}

    /* ── MIC ── a calm breathing glow while idle so it invites a tap, exactly
       like the shared glow-pulse look on the other games. Every keyframe
       preserves the chunky 3D base shadow + inner highlight. .rec keeps its
       stronger mpulse (defined later/with the class → wins), and :active still
       presses cleanly because that shadow is also defined above. */
    .mic{animation:micBreath 2.6s ease-in-out infinite;will-change:box-shadow;}
    @keyframes micBreath{
      0%,100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45)}
      50%{box-shadow:0 0 0 9px rgba(28,176,246,.16),0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45)}
    }
    .mic.rec{animation:mpulse 1.4s infinite;}
    .mic:active{box-shadow:0 2px 0 0 var(--blue-d);}

    /* ── SUCCESS, JUICIER ── Leo's existing react pop gets a little more bounce
       and overshoot so a correct sentence feels rewarding (still transform-only,
       same .react trigger the JS already toggles). */
    #leoWrap.react{animation:lpop .6s cubic-bezier(.2,1.5,.35,1);}
    @keyframes lpop{0%{transform:scale(1)}28%{transform:scale(1.2) translateY(-12px)}55%{transform:scale(.96) translateY(0)}100%{transform:scale(1)}}

    /* ── WIN SCREEN ── a soft celebratory radial wash behind the content, a
       bouncier Leo entrance, and gentle glow on the reward chips. */
    #win{background:
        radial-gradient(60% 45% at 50% 28%, rgba(255,224,138,.5), rgba(255,224,138,0) 70%),
        linear-gradient(180deg,#dff7fc,#bfeaf6 60%,#a9dca0);}
    #win .leoWin{animation:winPop .7s cubic-bezier(.2,1.4,.35,1) both;will-change:transform;}
    @keyframes winPop{0%{transform:scale(.6) translateY(10px);opacity:0}60%{transform:scale(1.08) translateY(0);opacity:1}100%{transform:scale(1)}}
    #win .reward{box-shadow:0 6px 16px rgba(20,140,160,.16),0 0 0 3px rgba(255,255,255,.5);}

    /* Accessibility: calm every loop for reduced-motion users. */
    @media (prefers-reduced-motion: reduce){
      #stage::before,#stage::after,#hills,#train .stack::before,.mic,#leoWrap.react,#win .leoWin{animation:none !important;}
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat" id="rungBadge">Sentences</span>
      <span class="stat count"><span id="count">0</span>/<span id="goal">5</span></span>
    </div>
    <div id="stage">
      <div id="leoWrap"><img id="leo" src="/coach/echo/echo-idle.svg" alt="Echo" /></div>
      <div id="hills"></div><div id="track"></div>
      <div id="station"><span class="roof"></span><span class="wall"></span><span class="door"></span></div>
      <span id="smoke"></span>
      <div id="train"><span class="loco"><span class="cab"></span><span class="nose"></span><span class="stack"></span><span class="wheel a"></span><span class="wheel b"></span><span class="wheel c"></span></span></div>
    </div>
    <div id="bottom">
      <div id="sentCard"><b id="sentText">I see a rabbit.</b></div>
      <div id="prompt">Say the sentence to roll the train!</div>
      <div id="hearRow"><button id="hear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;margin-right:5px;"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Hear it</button></div>
      <button class="mic" id="micBtn" title="Say it"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div id="win">
    <img class="leoWin" src="/coach/echo/echo-celebrate.svg" alt="Echo" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
    <h1>All aboard — you made it!</h1>
    <div class="reward"><span id="winCount">0</span><small>sentences said</small></div>
    <div class="reward" id="winUnlock" style="background:#fff7df;color:#e08600;"></div>
    <button class="btn" id="again">Ride again</button><a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var profile=(window.Sona?Sona.getProfile():{focusSounds:["R"],voiceId:"",volume:0.8});
    var SOUND=(new URLSearchParams(location.search).get("sound")||(profile.focusSounds&&profile.focusSounds[0])||"R").toUpperCase();
    if(!(window.Sona&&Sona.WORDS&&Sona.WORDS[SOUND])) SOUND="R";
    /* ── SLP CONTENT LADDER ──
       Serve the child's CURRENT rung for this sound (isolation→…→sentence) instead
       of always practicing at sentence level. Arcade can't do "conversation", so
       cap/fall back to "sentence". If the ladder yields nothing, fall back to the
       old word pool so the game always has content. */
    var RUNG=(window.Sona&&Sona.rungOf)?Sona.rungOf(SOUND):2; if(RUNG>5)RUNG=5;
    var ITEMS=(window.Sona&&Sona.ladderContent)?Sona.ladderContent(SOUND,RUNG):[];
    if(RUNG>=5 && (!ITEMS.length || (ITEMS[0]&&ITEMS[0].q))){ RUNG=4; ITEMS=Sona.ladderContent(SOUND,4); }
    if(!ITEMS.length){ ITEMS=((window.Sona&&Sona.wordsFor)?Sona.wordsFor(SOUND):[]).map(function(w){return {t:w.w,say:w.w,display:w.w,e:w.e,word:w.w,level:"word",mode:"full"};}); }
    if(!ITEMS.length){ ITEMS=(window.SonaContent?SonaContent.sentences(SOUND):[{t:"I see a rabbit.",say:"I see a rabbit",word:"rabbit",level:"sentence",mode:"full"}]); }
    var LIST=ITEMS;
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    /* ── 10 LEVELS ── a train journey: village → countryside → forest → mountains →
       tunnel → snow pass → coast → desert → night express → grand station.
       KNOB: rounds = how many sentences carry the train to the station (the old GOAL).
       Gentle (3) at L1, climbing monotonically to a fair 12 at the boss. SCENE: bg
       paints #stage, accent recolors the teal UI, props are ambient emoji for the sky. */
    var LEVELS=[
      {name:"Village",      bg:"linear-gradient(180deg,#dff7fc 0%,#cdeffa 42%,#bfeaf6 66%,#bfe7c6 80%,#a9dca0 100%)", accent:"#2ec4d6", props:["🏡","🌤️"],      rounds:3},
      {name:"Countryside",  bg:"linear-gradient(180deg,#e3f8ff 0%,#cdefff 40%,#c6ecd0 70%,#a9dc8f 100%)",            accent:"#3bbf78", props:["🌻","🐄"],      rounds:4},
      {name:"Greenwood",    bg:"linear-gradient(180deg,#d6f3e4 0%,#bfe9c8 44%,#9fd6a0 74%,#7bbf78 100%)",            accent:"#3aa86a", props:["🌲","🦋"],      rounds:5},
      {name:"Mountains",    bg:"linear-gradient(180deg,#dcefff 0%,#c2dcf2 42%,#a9c2d6 72%,#cfd6dd 100%)",            accent:"#5b86b0", props:["⛰️","🦅"],      rounds:6},
      {name:"Tunnel",       bg:"linear-gradient(180deg,#3a4658 0%,#2c3445 48%,#1f2636 100%)",                       accent:"#7fa6c8", props:["🚇","💡"],      rounds:7},
      {name:"Snow Pass",    bg:"linear-gradient(180deg,#eef6ff 0%,#dce9f5 44%,#cfdcec 72%,#eaf2fb 100%)",            accent:"#6fa8d6", props:["❄️","🏔️"],      rounds:8},
      {name:"Sunny Coast",  bg:"linear-gradient(180deg,#bff0ff 0%,#8fd9f2 42%,#7fd0e6 66%,#ffe7a8 100%)",            accent:"#1c9fd0", props:["🌊","⛵"],      rounds:9},
      {name:"Desert Run",   bg:"linear-gradient(180deg,#ffe7b0 0%,#ffd28a 44%,#f5b86a 74%,#e8a25a 100%)",            accent:"#e08f3a", props:["🌵","☀️"],      rounds:10},
      {name:"Night Express",bg:"linear-gradient(180deg,#1b2350 0%,#26306b 44%,#3a2c66 74%,#4a2f5e 100%)",            accent:"#9b8cf0", props:["🌙","⭐"],      rounds:11},
      {name:"Grand Station",bg:"radial-gradient(70% 50% at 50% 30%,rgba(255,224,138,.55),rgba(255,224,138,0) 70%),linear-gradient(180deg,#fff2cf 0%,#ffe08a 40%,#ffc36a 72%,#ff9e6a 100%)", accent:"#e0820a", props:["🏆","🎆","✨"], rounds:12}
    ];
    var L=LEVELS[Math.min(9,Math.max(0,DIFF-1))];
    var GOAL=L.rounds;

    var audioCtx=null; function getCtx(){if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();}if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx;}
    function playPCM(b){return new Promise(function(res){try{var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength);for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768;var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start();}catch(e){res();}});}
    var speaking=false; function say(t){return new Promise(function(res){if(!t||speaking)return res();speaking=true;fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){return b?playPCM(new Uint8Array(b)):null;}).catch(function(){}).finally(function(){speaking=false;res();});});}
    var LEO={idle:"/coach/echo/echo-idle.svg",cheer:"/coach/echo/echo-celebrate.svg",listen:"/coach/echo/echo-listening.svg"};
    Object.keys(LEO).forEach(function(k){var im=new Image();im.src=LEO[k];});
    function setLeo(s){var el=$("leo");if(el&&LEO[s])el.src=LEO[s];}
    function leoReact(){var w=$("leoWrap");if(!w)return;w.classList.remove("react");void w.offsetWidth;w.classList.add("react");}

    var micStream=null, useSpeechAce=false;
    function recordTurn(maxMs){ if(window.Sona&&Sona.hasNativeAudio&&Sona.hasNativeAudio())return Sona.captureClip({maxMs:(maxMs||6000)}); maxMs=maxMs||9000; return new Promise(function(resolve){
      var done=false,chunks=[],rec=null,sr=null,transcript="",spoke=false,lastV=0,raf=null,src=null,bars=null,micBtn=$("micBtn"),ico=micBtn.querySelector("svg");
      function finish(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} micBtn.classList.remove("rec");micBtn.onclick=null; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} if(bars)bars.remove(); if(ico)ico.style.display=""; setTimeout(function(){resolve({transcript:transcript,blob:chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null,spoke:spoke});},120); }
      try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
      try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; finish();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
      micBtn.classList.add("rec"); micBtn.onclick=finish;
      try{ if(micStream){ var ctx=getCtx();src=ctx.createMediaStreamSource(micStream);var an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
        var fd=new Uint8Array(an.frequencyBinCount),td=new Uint8Array(an.fftSize);bars=document.createElement("div");bars.className="wavebars";for(var b=0;b<7;b++)bars.appendChild(document.createElement("i"));if(ico)ico.style.display="none";micBtn.appendChild(bars);
        var t0=performance.now(),nS=0,nN=0,thr=0,v=0;
        (function tick(){ if(done)return; an.getByteFrequencyData(fd);[].forEach.call(bars.children,function(el,k){el.style.height=(8+fd[2+k*3]/255*30)+"px";});
          an.getByteTimeDomainData(td);var sum=0;for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;}var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<300){nS+=rms;nN++;}else{if(!thr)thr=Math.min(0.1,Math.max(0.014,(nS/Math.max(1,nN))*2.6));if(rms>thr){v++;lastV=now;if(v>=2)spoke=true;}else if(rms<thr*0.7)v=0;if(spoke&&now-lastV>=1300){finish();return;}}
          raf=requestAnimationFrame(tick);})();
      } }catch(e){}
      setTimeout(function(){ if(!done)finish(); }, maxMs);
    }); }
    async function scoreUtterance(res,text,mode){
      if(!res.spoke && !res.transcript && !res.blob) return {pass:false};
      if(useSpeechAce && res.blob){ try{ var fd=new FormData(); fd.append("audio",new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"})); fd.append("text",text); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode",mode||"full"); var r=await fetch("/api/score",{method:"POST",body:fd}); var j=await r.json(); if(j&&j.ok&&j.rating) return {pass:j.rating!=="tryAgain"}; }catch(e){} }
      if(res.transcript) return {pass:true};
      return {pass:!!res.spoke};
    }

    var queue=[], qi=0, done2=0, busy=false, correct=0, total=0;
    function carPct(n){ return 6 + (n/GOAL)*78; }
    function isSound(it){ return it && (it.level==="isolation"||it.level==="syllable"); }
    function promptFor(it){ return isSound(it)?"Say the sound":(it&&(it.level==="phrase"||it.level==="word"))?"Say it":"Say the sentence"; }
    /* Speak an item: at isolation/syllable keep modeling the sound (action/repeat cue),
       at word+ just present the word/phrase/sentence via the existing say(). */
    function sayItem(it){ if(!it)return Promise.resolve();
      var t=(it.say!=null&&it.say!=="")?it.say:it.t;
      if(isSound(it)&&window.Sona){ var cue=Sona.repeatCue?Sona.repeatCue(SOUND):t; return say(cue); }
      return say(t);
    }
    function showSent(it){
      var disp = (it.display!=null && it.display!=="") ? it.display : it.t;
      var h = (it.word && disp.indexOf(it.word)>=0) ? disp.replace(it.word,'<span class="hl">'+it.word+'</span>') : disp;
      $("sentText").innerHTML=h;
    }
    async function turn(){
      if(busy) return; busy=true; $("micBtn").onclick=null;
      var it=queue[qi%queue.length];
      setLeo("listen"); $("prompt").textContent=promptFor(it);
      var res=await recordTurn(); var sa=await scoreUtterance(res, it.t, it.mode);
      total++;
      if(window.Sona&&Sona.logAttempt)Sona.logAttempt({game:"train",sound:SOUND,pass:sa.pass});
      if(sa.pass){
        correct++;
        if(window.Sona&&Sona.sfx&&Sona.sfx.correct)Sona.sfx.correct();
        setLeo("cheer"); leoReact(); $("prompt").textContent="Nice one!";
        if(window.Sona&&Sona.praiseLine)await say(Sona.praiseLine());
        done2++; qi++; $("count").textContent=done2;
        var tr=$("train"); tr.classList.add("chug"); var pos=carPct(done2); tr.style.left=pos+"%"; $("smoke").style.left=(pos+1)+"%"; $("smoke").style.opacity="1";
        await new Promise(function(r){setTimeout(r,1050);}); tr.classList.remove("chug"); $("smoke").style.opacity="0";
        setLeo("idle"); busy=false;
        if(done2>=GOAL) return finishGame();
        var nx=queue[qi%queue.length]; showSent(nx); $("micBtn").onclick=turn; $("prompt").textContent=promptFor(nx)+" to roll the train!"; sayItem(nx);
      } else {
        if(window.Sona&&Sona.sfx&&Sona.sfx.tap)Sona.sfx.tap();
        setLeo("idle"); $("prompt").textContent="Not quite — try again!";
        await new Promise(function(r){setTimeout(r,650);}); busy=false; $("micBtn").onclick=turn; sayItem(it);
      }
    }
    function finishGame(){
      if(window.Sona&&Sona.recordRung)Sona.recordRung(SOUND,RUNG,correct/Math.max(1,total));
      var earned=22; if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}");GS[SOUND]=GS[SOUND]||{};GS[SOUND].train={done:true};GS.lastPlayDay=new Date().toISOString().slice(0,10);localStorage.setItem("sona.games.v1",JSON.stringify(GS));}catch(e){}
      $("winCount").textContent=done2; $("winUnlock").textContent="+"+earned+" 🪙"; $("win").classList.add("show");
      if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win"));
      if(window.Sona){Sona.confetti&&Sona.confetti();Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete();Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin();}
    }
    function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
    function startGame(){ $("win").classList.remove("show"); done2=0; qi=0; busy=false; correct=0; total=0; $("count").textContent="0"; $("goal").textContent=GOAL;
      $("train").style.left=carPct(0)+"%"; queue=shuffle(LIST); setLeo("idle"); showSent(queue[0]); $("micBtn").onclick=turn; $("prompt").textContent=promptFor(queue[0])+" to roll the train!"; sayItem(queue[0]);
    }
    (async function(){ try{var r=await fetch("/api/score");var j=await r.json();useSpeechAce=!!(j&&j.hasKey);}catch(e){useSpeechAce=false;}
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){micStream=null;}
      var rb=$("rungBadge"); if(rb)rb.textContent="Practicing: "+((window.Sona&&Sona.rungLabel)?Sona.rungLabel(RUNG):"Sentences");
      $("hear").onclick=function(){ sayItem(queue[qi%queue.length]); }; $("again").onclick=startGame;
      if(window.Sona&&Sona.music)Sona.music.start(); startGame();
    })();
    (function(){ var lad="/map.html"; var c=$("close"); if(c)c.onclick=function(){location.href=lad;}; Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){a.setAttribute("href",lad);}); })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  
    /* ── APPLY CHOSEN LEVEL'S SCENE ──
       Paint L.bg on the real scene element (#stage), recolor the teal accent UI to
       L.accent, and float L.props as faint ambient emoji in the sky. Then try a
       per-level art-drop "/coach/train/lvl<DIFF>.png" (cover); if that's missing,
       fall back to the original "/coach/train/bg.png" art. Real art wins over CSS. */
    (function(){
      var stage=document.getElementById("stage")||document.body;
      if(L.bg){ stage.style.background=L.bg; }
      if(L.accent){
        try{ var rs=document.documentElement.style;
          rs.setProperty("--teal",L.accent); rs.setProperty("--teal-d",L.accent); }catch(e){}
      }
      if(L.props&&L.props.length&&stage){
        var amb=document.createElement("div");
        amb.style.cssText="position:absolute;left:0;right:0;top:0;height:46%;z-index:0;pointer-events:none;font-size:26px;opacity:.5;";
        for(var i=0;i<L.props.length;i++){
          var sp=document.createElement("span");
          sp.textContent=L.props[i];
          sp.style.cssText="position:absolute;top:"+(8+i*11)+"%;left:"+(12+i*30)+"%;animation:sona-floatY "+(7+i*1.6)+"s ease-in-out infinite;will-change:transform;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12));";
          amb.appendChild(sp);
        }
        stage.appendChild(amb);
      }
      function applyArt(src){ var s=document.getElementById("stage"); if(s){ s.style.backgroundImage="url("+src+")"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center"; } }
      var lvlIm=new Image();
      lvlIm.onload=function(){ applyArt(lvlIm.src); };
      lvlIm.onerror=function(){ var bgIm=new Image(); bgIm.onload=function(){ applyArt("/coach/train/bg.png"); }; bgIm.src="/coach/train/bg.png"; };
      lvlIm.src="/coach/train/lvl"+DIFF+".png";
    })();
</script>
