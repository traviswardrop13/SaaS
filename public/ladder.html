<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Sound Ladder</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sona" />
  <style>
    :root{ --ink:#3c3c3c; --muted:#8a93a0; --line:#e8edf2; --paper:#fff; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;}
    body{background:linear-gradient(180deg,#f6fbff 0%,#eef6ff 50%,#f3fbf0 100%);color:var(--ink);min-height:100vh;min-height:100dvh;}
    #app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

    /* ---- header ---- */
    header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
      padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(0,0,0,.04);}
    .iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
      box-shadow:0 2px 8px rgba(20,60,110,.10);transition:transform .06s;}
    .iconbtn:active{transform:scale(.92);}
    .iconbtn svg{width:24px;height:24px;}
    .hdr-sound{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1;}
    .hdr-sound .g{font-family:"Baloo 2";font-weight:800;font-size:30px;letter-spacing:.01em;}
    .hdr-sound .ipa{font-family:"Baloo 2";font-weight:700;font-size:14px;margin-top:2px;opacity:.85;}
    .tipbtn{background:#ffc800;box-shadow:0 4px 0 0 #e0a800;}
    .tipbtn:active{transform:translateY(3px);box-shadow:0 1px 0 0 #e0a800;}
    .tipbtn svg{stroke:#7a5a00;}

    /* ---- path ---- */
    main{flex:1;padding:18px 18px 40px;}
    .intro{text-align:center;margin:2px 0 18px;}
    .intro h1{font-family:"Baloo 2";font-weight:800;font-size:21px;}
    .intro p{color:var(--muted);font-weight:700;font-size:13.5px;margin-top:3px;}

    .path{position:relative;display:flex;flex-direction:column;align-items:center;}
    .rung{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;}
    /* gentle wind: alternate the nodes left / center / right */
    .rung:nth-child(6n+1){align-items:center;}
    .rung:nth-child(6n+2){align-items:flex-end;padding-right:14%;}
    .rung:nth-child(6n+3){align-items:flex-end;padding-right:4%;}
    .rung:nth-child(6n+4){align-items:center;}
    .rung:nth-child(6n+5){align-items:flex-start;padding-left:4%;}
    .rung:nth-child(6n+6){align-items:flex-start;padding-left:14%;}
    .node{display:flex;flex-direction:column;align-items:center;gap:7px;border:none;background:none;cursor:pointer;}
    .disc{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .07s;}
    .node:active .disc{transform:translateY(4px);}
    .disc svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
    .node.soon{cursor:default;}
    .node.soon .disc{background:#dde4ec !important;box-shadow:0 7px 0 0 #c3ccd6 !important;}
    .node.soon .disc svg{stroke:#aab4c0;}
    .node.soon:active .disc{transform:none;}
    .node.cur .disc{animation:bob 2.1s ease-in-out infinite;}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .badge{position:absolute;right:-3px;bottom:-3px;width:30px;height:30px;border-radius:50%;background:#fff;
      display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.16);}
    .badge svg{width:17px;height:17px;stroke-width:3;}
    .label{font-family:"Baloo 2";font-weight:800;font-size:15px;background:#fff;border-radius:99px;padding:6px 16px;box-shadow:0 3px 9px rgba(20,80,140,.10);}
    .node.soon .label{color:var(--muted);background:#eef2f6;box-shadow:none;}
    .sub{font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
    .start{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff;font-family:"Baloo 2";font-weight:800;
      font-size:12px;padding:4px 13px;border-radius:99px;box-shadow:0 3px 10px rgba(20,90,160,.18);white-space:nowrap;animation:nod 1.5s ease-in-out infinite;}
    .start:after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:#fff;}
    @keyframes nod{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
    .connector{width:6px;height:30px;border-radius:3px;background:repeating-linear-gradient(180deg,#cfddea 0 8px,transparent 8px 16px);margin:4px 0;}

    /* ---- bottom sheet ---- */
    #scrim{position:fixed;inset:0;z-index:40;background:rgba(20,40,70,.34);opacity:0;pointer-events:none;transition:opacity .22s ease;}
    #scrim.show{opacity:1;pointer-events:auto;}
    #sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:#fff;
      border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .26s cubic-bezier(.22,1,.36,1);
      box-shadow:0 -10px 40px rgba(20,50,90,.18);}
    #sheet.show{transform:translateY(0);}
    .grip{width:42px;height:5px;border-radius:99px;background:#e2e8ef;margin:4px auto 12px;}
    .sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .sheet-chip{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .sheet-chip svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
    .sheet-head h2{font-family:"Baloo 2";font-weight:800;font-size:20px;line-height:1.05;}
    .sheet-head p{color:var(--muted);font-weight:700;font-size:13px;}
    .acts{margin-top:12px;display:flex;flex-direction:column;gap:10px;}
    .act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;text-decoration:none;color:inherit;cursor:pointer;
      background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:13px 15px;transition:transform .06s;}
    .act:active{transform:translateY(2px);border-bottom-width:2px;}
    .act .ai{width:48px;height:48px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
    .act .ai svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
    .act b{font-family:"Baloo 2";font-weight:800;font-size:16px;display:block;}
    .act .as{color:var(--muted);font-weight:700;font-size:12.5px;}
    .act .chev{margin-left:auto;color:#c2ccd6;font-size:22px;font-weight:800;}
    .soonmsg{margin:14px 4px 6px;color:var(--muted);font-weight:700;font-size:14px;line-height:1.5;}
    .tipbody{margin:8px 2px 4px;font-weight:700;font-size:16px;line-height:1.55;color:var(--ink);}
    .tipbody .lead{display:block;font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <button class="iconbtn" id="back" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5b6b7b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="hdr-sound"><span class="g" id="hg">r</span><span class="ipa" id="hipa">/ɹ/</span></div>
      <button class="iconbtn tipbtn" id="tips" title="How to make this sound" aria-label="Tips">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 3.7 10.7c-.7.6-1.2 1.4-1.2 2.3H9.5c0-.9-.5-1.7-1.2-2.3A6 6 0 0 1 12 3Z"/></svg>
      </button>
    </header>

    <main>
      <div class="intro">
        <h1 id="introTitle">Climb the ladder</h1>
        <p>Start with the sound on its own, then build all the way to talking.</p>
      </div>
      <div class="path" id="path"></div>
    </main>
  </div>

  <div id="scrim"></div>
  <div id="sheet">
    <div class="grip"></div>
    <div id="sheetContent"></div>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $ = function(id){ return document.getElementById(id); };
    var profile = (window.Sona ? Sona.getProfile() : { focusSounds:["R"] });
    var params = new URLSearchParams(location.search);
    var SOUND = (params.get("sound") || (profile.focusSounds && profile.focusSounds[0]) || "R").toUpperCase();
    if(!(window.Sona && Sona.WORDS && Sona.WORDS[SOUND])) SOUND="R";

    /* ---- clean inline icons (no emoji) ---- */
    var IC = {
      drop:'<svg viewBox="0 0 24 24"><path d="M12 3s-6.5 7-6.5 11a6.5 6.5 0 0 0 13 0C18.5 10 12 3 12 3Z"/></svg>',
      beads:'<svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.3"/><circle cx="16" cy="12" r="3.3"/></svg>',
      tag:'<svg viewBox="0 0 24 24"><path d="M3 12l6.2-6.2A2 2 0 0 1 10.6 5H18a2 2 0 0 1 2 2v7.4a2 2 0 0 1-.6 1.4L13 22 3 12Z"/><circle cx="15.5" cy="8.5" r="1.4"/></svg>',
      lines2:'<svg viewBox="0 0 24 24"><path d="M5 9h14"/><path d="M5 15h9"/></svg>',
      lines3:'<svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M5 12h14"/><path d="M5 17h8"/></svg>',
      book:'<svg viewBox="0 0 24 24"><path d="M12 6c-1.6-1.2-3.6-2-6-2H4v14h2c2.4 0 4.4.8 6 2 1.6-1.2 3.6-2 6-2h2V4h-2c-2.4 0-4.4.8-6 2Z"/><path d="M12 6v14"/></svg>',
      chat:'<svg viewBox="0 0 24 24"><path d="M7.5 16H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/><path d="M11 11h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1v3l-4-3h-2a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Z"/></svg>',
      mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>',
      cup:'<svg viewBox="0 0 24 24"><path d="M7 5h10l-1.3 14.2a1 1 0 0 1-1 .8H9.3a1 1 0 0 1-1-.8L7 5Z"/><path d="M6.6 5h10.8"/></svg>',
      car:'<svg viewBox="0 0 24 24"><path d="M4 14l1.4-4.2A2 2 0 0 1 7.3 8.5h9.4a2 2 0 0 1 1.9 1.3L20 14v3a1 1 0 0 1-1 1h-1.5"/><path d="M4 14v3a1 1 0 0 0 1 1h1.5"/><path d="M4 14h16"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>',
      cards:'<svg viewBox="0 0 24 24"><rect x="4" y="6" width="10" height="13" rx="2"/><path d="M9 6l2.5-1.3a2 2 0 0 1 2.7.9L19 14"/></svg>',
      star:'<svg viewBox="0 0 24 24"><path d="M12 4l2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 16.9 7.4 18.3l.9-5.2L4.5 9.5l5.2-.7L12 4Z"/></svg>',
      check:'<svg viewBox="0 0 24 24" fill="none" stroke="#46a302" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
      lock:'<svg viewBox="0 0 24 24" fill="none" stroke="#aab4c0" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
      rocket:'<svg viewBox="0 0 24 24"><path d="M12 3c3 1.6 4.5 4.6 4.5 8 0 2-.6 3.6-1.2 4.6H8.7C8.1 14.6 7.5 13 7.5 11c0-3.4 1.5-6.4 4.5-8Z"/><circle cx="12" cy="9.5" r="1.5"/><path d="M9 16l-2.3 3.2L9 18.4M15 16l2.3 3.2L15 18.4"/></svg>'
    };

    /* ---- per-sound info (cue powers the lightbulb) ---- */
    var SOUND_META = {
      R:{g:"r",ipa:"/ɹ/",cue:"Pull your tongue back and up like a little growl — “rrr.” Keep your lips a touch round."},
      S:{g:"s",ipa:"/s/",cue:"Smile, teeth almost together, and let a thin stream of air hiss out — “sss.”"},
      L:{g:"l",ipa:"/l/",cue:"Tip of the tongue up behind your top teeth, voice on — “lll.”"},
      K:{g:"k",ipa:"/k/",cue:"The back of the tongue pops up to the roof of your mouth — “k, k, k.”"},
      SH:{g:"sh",ipa:"/ʃ/",cue:"Round your lips and quietly hush a baby — “shhh.”"},
      CH:{g:"ch",ipa:"/tʃ/",cue:"Pop it like a tiny sneeze — “ch, ch.” Lips a little round."},
      TH:{g:"th",ipa:"/θ/",cue:"Let your tongue peek between your teeth and blow softly — “th.”"},
      G:{g:"g",ipa:"/ɡ/",cue:"Back of the tongue up, turn your voice on — “g, g.”"},
      F:{g:"f",ipa:"/f/",cue:"Top teeth gently on your bottom lip, blow air — “fff.”"}
    };
    var META = SOUND_META[SOUND] || {g:SOUND.toLowerCase(),ipa:"/"+SOUND.toLowerCase()+"/",cue:"Listen to Leo, then copy the sound."};

    /* ---- the articulation ladder (the curriculum spine) ---- */
    var RUNGS = [
      {id:"isolation",  label:"Isolation",    sub:"The sound by itself", color:"#46c6b8", dark:"#2fa99c", icon:IC.drop,   live:true},
      {id:"syllables",  label:"Syllables",    sub:"Sound + a vowel",     color:"#ffc107", dark:"#e0a800", icon:IC.beads,  live:true},
      {id:"words",      label:"Words",        sub:"Say whole words",     color:"#ff6b6b", dark:"#e85555", icon:IC.tag,    live:true},
      {id:"phrases",    label:"Phrases",      sub:"Two words together",  color:"#2ec4d6", dark:"#1fa9ba", icon:IC.lines2, live:true},
      {id:"sentences",  label:"Sentences",    sub:"Full sentences",      color:"#1cb0f6", dark:"#1597d4", icon:IC.lines3, live:true},
      {id:"stories",    label:"Stories",      sub:"Read-along stories",  color:"#7cc40a", dark:"#66a406", icon:IC.book,   live:true},
      {id:"conversation",label:"Conversation",sub:"Talk it out",         color:"#9b7bff", dark:"#8260f0", icon:IC.chat,   live:true}
    ];

    /* ---- activities per live rung (the games are the activities) ---- */
    var q = "?sound="+SOUND;
    var ACTS = {
      isolation: [
        {name:"Sound Rocket", sub:"Say the sound to launch the rocket", href:"/rocket.html"+q, color:"#46c6b8", icon:IC.rocket}
      ],
      syllables: [
        {name:"Bubble Pop", sub:"Pop the syllables you say", href:"/bubble.html"+q, color:"#ffc107", icon:IC.beads}
      ],
      words: [
        {name:"Cup Stack",  sub:"Stack a cup for every clean word", href:"/cupstack.html"+q, color:"#ff7a6e", icon:IC.cup},
        {name:"Rev Racer",  sub:"Say words to win the race",        href:"/racer.html"+q,    color:"#1cb0f6", icon:IC.car},
        {name:"Match-Up",   sub:"Find the matching pairs",          href:"/match.html"+q,    color:"#9b7bff", icon:IC.cards},
        {name:"Pop-a-Word", sub:"Pop every word you say",           href:"/whack.html"+q,    color:"#ffb02e", icon:IC.star}
      ],
      phrases: [
        {name:"Grocery Grab", sub:"Say the phrase to grab it", href:"/grocery.html"+q, color:"#2ec4d6", icon:IC.lines2}
      ],
      sentences: [
        {name:"Story Train", sub:"Say the sentence to roll on", href:"/train.html"+q, color:"#1cb0f6", icon:IC.lines3}
      ],
      stories: [
        {name:"Story Time", sub:"Read along with Leo", href:"/story.html"+q, color:"#7cc40a", icon:IC.book}
      ],
      conversation: [
        {name:"Chat with Leo", sub:"Answer Leo out loud", href:"/chat.html"+q, color:"#9b7bff", icon:IC.chat}
      ]
    };

    /* ---- progress (read the shared game state) ---- */
    var GS={}; try{ GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}"); }catch(e){}
    var W = GS[SOUND] || {};
    var WORD_GAME_IDS = ["cupstack","racer","match","whack"];
    function wordsDoneCount(){ return WORD_GAME_IDS.filter(function(id){ return W[id]&&W[id].done; }).length; }
    function rungDone(id){
      if(id==="words") return wordsDoneCount() >= WORD_GAME_IDS.length;
      if(id==="isolation") return !!(W.rocket && W.rocket.done);
      if(id==="syllables") return !!(W.bubble && W.bubble.done);
      if(id==="phrases") return !!(W.grocery && W.grocery.done);
      if(id==="sentences") return !!(W.train && W.train.done);
      if(id==="stories") return !!(W.story && W.story.done);
      if(id==="conversation") return !!(W.chat && W.chat.done);
      return false;
    }

    /* ---- paint header ---- */
    $("hg").textContent = META.g;
    $("hipa").textContent = META.ipa;
    $("hg").style.color = RUNGS[2].color; // word-rung color as the sound accent
    $("hipa").style.color = RUNGS[2].color;

    /* ---- build the path ---- */
    var path = $("path");
    var firstAvailable = true;
    RUNGS.forEach(function(r, i){
      if(i>0){ var c=document.createElement("div"); c.className="connector"; path.appendChild(c); }
      var wrap=document.createElement("div"); wrap.className="rung";
      var done = r.live && rungDone(r.id);
      var isCur = r.live && !done && firstAvailable; if(r.live && !done) firstAvailable=false;
      var cls = "node"+(r.live?"":" soon")+(isCur?" cur":"");
      var el = document.createElement(r.live?"button":"div"); el.className=cls;

      var discBg = done ? "background:#ffc800;box-shadow:0 7px 0 0 #e0a800;" : "background:"+r.color+";box-shadow:0 7px 0 0 "+r.dark+";";
      var badge = "";
      if(done) badge='<span class="badge">'+IC.check+'</span>';
      else if(!r.live) badge='<span class="badge">'+IC.lock+'</span>';

      var subLine = r.live ? '' : '<span class="sub">Soon</span>';
      var progLine = (r.id==="words" && r.live && !done && wordsDoneCount()>0) ? '<span class="sub">'+wordsDoneCount()+'/'+WORD_GAME_IDS.length+'</span>' : subLine;

      el.innerHTML =
        (isCur?'<span class="start">START</span>':'')+
        '<span class="disc" style="'+discBg+'">'+r.icon+badge+'</span>'+
        '<span class="label">'+r.label+'</span>'+
        progLine;
      if(r.live) el.onclick=function(){ openRung(r); };
      wrap.appendChild(el);
      path.appendChild(wrap);
    });

    /* ---- bottom sheet ---- */
    var scrim=$("scrim"), sheet=$("sheet"), sc=$("sheetContent");
    function showSheet(html){ sc.innerHTML=html; scrim.classList.add("show"); sheet.classList.add("show"); if(window.Sona&&Sona.sfx&&Sona.sfx.tap)Sona.sfx.tap(); }
    function hideSheet(){ scrim.classList.remove("show"); sheet.classList.remove("show"); }
    scrim.onclick=hideSheet;

    function openRung(r){
      var acts = ACTS[r.id] || [];
      var head =
        '<div class="sheet-head">'+
          '<span class="sheet-chip" style="background:'+r.color+'">'+r.icon+'</span>'+
          '<div><h2>'+r.label+'</h2><p>'+r.sub+' · '+META.g+' '+META.ipa+'</p></div>'+
        '</div>';
      if(!acts.length){
        showSheet(head+'<p class="soonmsg">New activities for this level are coming soon. Keep climbing the rungs that are open!</p>');
        return;
      }
      var rows = acts.map(function(a){
        return '<a class="act" href="'+a.href+'">'+
          '<span class="ai" style="background:'+a.color+'">'+a.icon+'</span>'+
          '<span><b>'+a.name+'</b><span class="as">'+a.sub+'</span></span>'+
          '<span class="chev">›</span>'+
        '</a>';
      }).join("");
      showSheet(head+'<div class="acts">'+rows+'</div>');
    }

    /* ---- tips (lightbulb) ---- */
    $("tips").onclick=function(){
      showSheet(
        '<div class="sheet-head">'+
          '<span class="sheet-chip tipbtn" style="background:#ffc800;box-shadow:none;">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="#7a5a00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 3.7 10.7c-.7.6-1.2 1.4-1.2 2.3H9.5c0-.9-.5-1.7-1.2-2.3A6 6 0 0 1 12 3Z"/></svg>'+
          '</span>'+
          '<div><h2>How to make '+META.g+'</h2><p>'+META.ipa+'</p></div>'+
        '</div>'+
        '<p class="tipbody"><span class="lead">Coach tip</span>'+META.cue+'</p>'
      );
    };

    /* ---- back ---- */
    $("back").onclick=function(){ if(history.length>1) history.back(); else location.href="/play.html"; };

    if(window.Sona && Sona.music) Sona.music.start();
  </script>
</body>
</html>
