<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Peekaboo</title>
  <link href="/fonts.css" rel="stylesheet">
  <link href="/action.css" rel="stylesheet">
  <link href="/sayplay.css" rel="stylesheet">
  <meta name="theme-color" content="#e4ecd4" />
  <!--
    Peekaboo (ages 3-4), on the Say & Play engine since 17 Oct 2026, as Bubble
    Pop is. Say the word two times and its picture peeks out of a door and
    hides; the doors trade places; tap the door it went behind. Five finds
    end the round. The doors are drawn and moved in /peekaboo.js; every word
    turn, the mic and its quiet rules are /sayplay.js's. It ran on
    /simple-play.js before, where the word moved nothing.
  -->
  <link href="/peekaboo.css" rel="stylesheet">
</head>
<body data-phase="boot">
  <div id="app">
    <canvas id="peekCanvas" role="img" aria-label="A little cottage with three doors. Say the word two times, then find your picture."></canvas>
    <div id="top">
      <button id="close" type="button" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <span class="hudpill"><span id="ttl">Peekaboo</span></span>
      <span id="spacer"></span>
      <span class="hudpill" id="dots" role="img" aria-label="0 of 5"></span>
    </div>
    <div id="peekBanner" role="status" aria-live="polite">Say the word two times!</div>
    <button id="peekDoor0" class="peek-door" type="button" disabled aria-label="The left door."><span class="peek-interior"><span id="peekObject0" class="peek-object"></span></span><span id="peekLeaf0" class="peek-leaf"></span></button>
    <button id="peekDoor1" class="peek-door" type="button" disabled aria-label="The middle door."><span class="peek-interior"><span id="peekObject1" class="peek-object"></span></span><span id="peekLeaf1" class="peek-leaf"></span></button>
    <button id="peekDoor2" class="peek-door" type="button" disabled aria-label="The right door."><span class="peek-interior"><span id="peekObject2" class="peek-object"></span></span><span id="peekLeaf2" class="peek-leaf"></span></button>
    <div id="peekArrow" hidden aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21 3.5 11H9V3h6v8h5.5Z" fill="currentColor" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
    <div id="peekFinds" role="img" aria-label="0 of 5 pictures found"></div>
    <div id="peekControls">
      <button id="peekHearStep" class="cream-pill" type="button" disabled aria-label="Hear what to do"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Zm12 0a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="peekHelp" class="act-pill" type="button" disabled aria-label="Echo's clue, if you want it: say your word two times and the right door glows"><img src="/assets/crafted/echo-wave.webp" alt=""><span class="peek-help-label">Echo's clue</span></button>
    </div>
    <div id="turnPanel" aria-live="polite">
      <div id="picBox"><span id="pic"></span></div>
      <div id="word"></div>
      <button id="hear" aria-label="Hear it again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="#1cb0f6"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1cb0f6" stroke-width="2.2" stroke-linecap="round"/></svg><span>Hear it</span></button>
      <div id="listenRow">
        <span id="echoWrap"><img id="echoFace" src="/assets/crafted/echo-welcome.webp" alt="Echo" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" /></span>
        <span id="micState"></span>
        <span id="cheer"></span>
        <button id="micBtn" hidden aria-label="Listen again"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <div class="ovl" id="startOvl">
    <div class="ovlCard">
      <img class="peek-intro" src="/assets/crafted/home-peekaboo.webp" alt="Echo and a little painted cottage">
      <h2 id="startTitle">Peekaboo</h2>
      <p>Say each word two times to hide a picture. Then find it!</p>
      <p class="small" id="startSound"></p>
      <button id="startBtn" class="act-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z" fill="#fff"/></svg><span>Let's play</span></button>
    </div>
  </div>
  <div class="ovl" id="primer">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-listen.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2>Let Echo hear you!</h2>
      <p>Say each word two times to hide a picture.</p>
      <p class="small" id="micPromise"></p>
      <button class="btn" id="primerYes">Turn on Echo's ears</button>
      <button class="ghost" id="primerNo">Not now</button>
    </div>
  </div>
  <div class="ovl" id="pauseOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-think.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2>A little break</h2><p>Your picture is waiting right here.</p>
      <button class="btn" id="resume">Keep playing</button>
    </div>
  </div>
  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <img class="ovlEcho endStar" src="/assets/crafted/echo-cheer.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2 id="endTitle"></h2>
      <p id="endSub"></p>
      <button class="btn" id="again">Play again</button>
      <button class="ghost" id="goHome">Back home</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script src="/crafted-words.js"></script>
  <script src="/sayplay.js"></script>
  <script src="/peekaboo.js"></script>
  <script>
  (function () {
    var S = window.Sona;
    // TWO TIMES: the engine's own number, as in the other games for ages 3-4
    // on it except Bubble Pop. Whether a three-year-old says a word once or
    // twice is Rachel's call (Bubble Pop's page passes sayTimes: 1).
    SayPlay.start({
      key: "peekaboo", title: "Peekaboo", intro: "Say each word two times to hide a picture.",
      steps: [[], [], [], [], []], finale: [],
      done: { title: "Five discoveries!", sub: "You found all five pictures!" },
      play: window.Peekaboo,
    });
    // "game opened": the game key only, never the child; a bounced page is hidden
    if (!document.body.hidden) { try { S.track("game opened", { game: "peekaboo" }); } catch (e) {} }
    // THE OLD FIVE-ROUND ADVENTURE for little kids (charge.html?daily=1) deals
    // Peekaboo once it is open, as it deals Bubble Pop: a finished round is
    // banked here and the end card's button goes back to the adventure. The
    // engine knows nothing of it, so the click is taken before "Play again".
    var daily = false;
    if (S && S.simpleAdventure && window.Peekaboo) {
      window.Peekaboo.onFinale = function () {
        daily = !!S.simpleAdventure("peekaboo", true);
        if (daily) document.getElementById("again").textContent = "Keep going →";
      };
      document.addEventListener("click", function (e) {
        var t = e.target && e.target.closest ? e.target.closest("#again") : null;
        if (!t || !daily || !S.simpleAdventure("peekaboo", false)) return;
        e.stopPropagation(); e.preventDefault();
        location.href = "/charge.html?daily=1&banked=0";
      }, true);
    }
  })();
  </script>
</body>
</html>
