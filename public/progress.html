<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link href="/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/sona.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#fff6e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    /* PROGRESS, ONE SCREEN (Travis, 5 Nov 2026: "simplify drastically ...
       just have that be on one page"). Three cards: the week's practice days,
       accuracy by sound (coming soon), and each sound's practice level. The
       goal pickers, saved tries, the summary box, "How scoring works", the
       review ask, Firsts and Recent practice went. Nothing here writes. */
    .week{display:flex;gap:8px;margin-top:12px;}
    .day{flex:1;text-align:center;}
    .day .d{position:relative;width:34px;height:34px;margin:0 auto 5px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:0;background:#fff;border:2px solid #e3ecf8;color:transparent;box-shadow:none;}
    .day .d::before{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#f6f9ff,#eef3fb);}
    .day .d.on{background:linear-gradient(160deg,#ffb072,var(--orange));border-color:transparent;box-shadow:0 4px 0 0 var(--orange-d);}
    .day .d.on::before{content:"";position:absolute;inset:auto;left:11px;top:7px;width:7px;height:13px;
      border:solid #fff;border-width:0 3px 3px 0;border-radius:1px;transform:rotate(45deg);background:none;}
    .day .lbl{font-size:11px;font-weight:800;color:var(--muted);}
    #wkDays{flex:none;font-weight:800;font-size:13px;}
    #volReps{font-family:"Baloo 2";font-weight:800;}
    .soon-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .soon-row h2{font-size:18px;}
    .soon-tag{flex:none;font-weight:800;font-size:12px;border-radius:99px;padding:5px 11px;background:#f8efdf;border:1px solid var(--line);color:var(--muted);}
    .levelrow{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-weight:800;font-size:14px;}
    .levelrow:first-child{border-top:none;}
    .levelrow .lvl{margin-left:auto;color:var(--family-teal-dark,#065e66);}
    .levelrow .n{font-size:12px;color:var(--muted);}
    .levels-empty{margin-top:6px;font-size:13px;font-weight:700;color:var(--muted);}
    #sendProg{margin-top:12px;width:auto;padding:12px 20px;}
    #shareStatus{font-size:13px;line-height:1.5;margin-top:6px;}
    #shareStatus:empty{display:none;}
    .progress-foot{margin:10px 4px 0;font-size:11.5px;font-weight:700;line-height:1.45;}
    /* body.-prefixed: /crafted-family.css loads after this block */
    body.family-progress .wrap{padding-bottom:calc(8px + env(safe-area-inset-bottom));}
    body.family-progress .card{padding:14px 18px;}
    body.family-progress .card h2{font-size:18px;}
    body.family-progress .card+.card{margin-top:10px;}
    body.family-progress .family-pagehead{margin-bottom:10px;}
    body.family-progress .week{margin-top:12px;}
    @media print{ header.app,.noprint{display:none!important;} body{background:#fff;} .card{box-shadow:none!important;} }
  </style>
  <script>
    // Parent gate, inline and dependency-free: runs before first paint and
    // still protects this page if /sona.js ever fails to load. It mirrors
    // Sona.requireGate(): the grown-ups gate (today.html) stores the pass
    // timestamp in sessionStorage under "sona.gate.v1", valid for 10 quiet
    // minutes, refreshed on every gated page load. No fresh pass → hidden
    // page + straight back to the home screen with the gate open (never a
    // scary error). Sona.requireGate() still runs later as belt-and-braces.
    (function () {
      function pass() {
        try {
          var t = parseInt(sessionStorage.getItem("sona.gate.v1"), 10);
          var age = Date.now() - t;
          return !!t && age >= 0 && age < 600000; // same 10-min TTL as sona.js
        } catch (e) { return false; }
      }
      function check() {
        document.documentElement.style.visibility = "hidden";
        if (pass()) {
          try { sessionStorage.setItem("sona.gate.v1", String(Date.now())); } catch (e) {}
          document.documentElement.style.visibility = "";
        } else {
          // Carry where they were going. This guard runs BEFORE sona.js (that
          // is the point of it — no flash of a parent page), so it cannot call
          // Sona.gateDest; it names its own page literally instead. today.html
          // re-checks ?to= against the allowlist on arrival, which is the side
          // that reads an untrusted URL.
          try { location.replace("/today.html?gate=1&to=" + encodeURIComponent("/progress.html")); } catch (e) {}
        }
      }
      check();
      // a back-swipe can restore this page from the bfcache without re-running
      // scripts — re-check on pageshow so the inline guard holds on its own.
      window.addEventListener("pageshow", function (ev) { if (ev.persisted) check(); });
    })();
  </script>
  <link rel="stylesheet" href="/crafted-family.css" />
</head>
<body class="crafted-family family-progress">
  <div class="wrap">
    <header class="app family-header">
      <a class="brand" href="/today.html" aria-label="Sona Home"><span class="leo"><img src="/assets/crafted/echo-welcome.webp" alt="" /></span> Sona</a>
      <a class="family-back" href="/today.html"><svg class="family-symbol" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10c2 0 3 2 3.5 4l1 5c.4 2-1.5 3-3 1.5L16 15H8l-2.5 2.5C4 19 2 18 2.5 16l1-5C4 9 5 7 7 7Z"/><path d="M7 9.5v5M4.5 12h5"/><circle cx="15.5" cy="10.5" r=".7" fill="currentColor" stroke="none"/><circle cx="18" cy="13" r=".7" fill="currentColor" stroke="none"/></svg> Back to play</a>
    </header>
    <nav class="family-tabs" aria-label="Grown-ups">
      <a href="/progress.html" data-tab="progress" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16"/><path d="m5 15 4-4.5 3.5 3L19 6.5"/><path d="M14.5 6.5H19V11"/></svg>Progress</a>
      <a href="/settings.html" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>Settings</a>
      <a href="/talk.html" data-tab="talk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-11 6.6L4 19.5l1.4-4.3A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8.8 10h6.4M8.8 13.3h4"/></svg>Talk to us</a>
    </nav>
    <div class="family-pagehead"><img src="/assets/crafted/echo-welcome.webp" alt="" /><div><h1 id="title">Progress</h1></div></div>

    <!-- The week's practice days, and nothing to set (Travis, 5 Nov 2026:
         "show the bubbles of how many practices they've had in the week, but
         take out the ability to change from 3 days a week"; setup's goal is
         minutes a day now). A bubble is a day with practice, not a day at a
         goal. -->
    <div class="card" id="weekCard">
      <div class="soon-row"><h2>Practice this week</h2><span id="wkDays" class="muted"></span></div>
      <div class="week-totals"><span><span id="volReps">0</span> <b>tries this week</b></span>
      <span id="volLast" class="muted"></span></div>
      <p id="volGames" class="muted" style="font-size:12.5px;font-weight:800;margin-top:4px;" hidden></p>
      <div class="week" id="week"></div>
    </div>

    <!-- "for accuracy by sound, just put coming soon" (Travis, 5 Nov 2026).
         No percentage appears anywhere on this page until it is back. -->
    <div class="card soon-row" id="accCard">
      <h2>Accuracy by sound</h2>
      <span class="soon-tag">Coming soon</span>
    </div>

    <!-- One of "Practice levels" or "Recent practice" stays, "whatever is the
         most helpful": the level says where each sound is now. -->
    <div class="card" id="levelsCard">
      <h2>Practice levels</h2>
      <div id="bysound" style="margin-top:4px;"></div>
      <button class="btn noprint" id="sendProg" style="display:none;">Send progress to my SLP</button>
      <p id="shareStatus" class="muted noprint" role="status" aria-live="polite"></p>
    </div>

    <p class="muted progress-foot">A practice snapshot, not a clinical assessment. Built with Rachel, MS, CF-SLP, a pediatric speech-language pathologist in her clinical fellowship.</p>
  </div>

  <script src="/sona.js"></script>
  <script>
    // Parent-only page: a child arriving by direct URL or back-swipe (no fresh
    // pass of the home screen's grown-ups gate) is sent back to the gate.
    if (window.Sona && Sona.requireGate) Sona.requireGate();
    // back-swipe can restore this page from the bfcache without re-running
    // scripts — re-check the gate whenever the page is shown again.
    window.addEventListener("pageshow", function (e) { if (e.persisted && window.Sona && Sona.requireGate) Sona.requireGate(); });
    // THE PAGE BELONGS TO ONE CHILD: a back-swipe can bring it back from the
    // bfcache after Settings switched child, so it reloads rather than show
    // one child's week under another's name.
    function activeSlot() { try { var k = Sona.activeKid && Sona.activeKid(); return k ? k.slot : ""; } catch (e) { return ""; } }
    var loadSlot = activeSlot();
    window.addEventListener("pageshow", function (e) { if (e.persisted && activeSlot() !== loadSlot) location.reload(); });
    var p = Sona.getProfile();
    var name = (p.childName || "").trim();
    document.getElementById("title").textContent = name ? (name + "'s progress") : "Progress";
    function count(value) { return Math.max(0, Math.floor(Number(value) || 0)); }
    function triesOf(o) { return o ? count(typeof o.tries === "number" ? o.tries : o.attempts) : 0; }
    function soundLabel(k) { return Sona.soundLabel ? Sona.soundLabel(k) : k; }
    var out = (Sona.outcomes ? Sona.outcomes() : {}) || {};
    var keys = Object.keys(out).filter(function (k) { return triesOf(out[k]) > 0; });

    // Tries are the practice page's alone (GAMEREPS1); sounds said in games
    // and books get their own line, so the week still adds up to every rep.
    var thisWeekTries = Sona.weekReps ? Sona.weekReps(0, null, true) : 0;
    var lastWeekTries = Sona.weekReps ? Sona.weekReps(-1, null, true) : 0;
    var gameWeek = Sona.weekReps ? Sona.weekReps(0) - thisWeekTries : 0;
    document.getElementById("volReps").textContent = thisWeekTries;
    if (gameWeek > 0) { var vg = document.getElementById("volGames"); vg.hidden = false; vg.textContent = "Plus " + gameWeek + (gameWeek === 1 ? " sound" : " sounds") + " said out loud in games and books: " + (thisWeekTries + gameWeek) + " reps in all."; }
    document.getElementById("volLast").textContent = lastWeekTries > 0 && thisWeekTries > lastWeekTries
      ? "Up from " + lastWeekTries + " tries last week" : "Last week: " + lastWeekTries + " tries";

    // The bubbles: one per day, Monday first, filled on a day with practice.
    (function () {
      var w = Sona.momWeek(), wk = document.getElementById("week"), L = ["M", "T", "W", "T", "F", "S", "S"];
      for (var i = 0; i < 7; i++) {
        var on = !!w.days[i], isT = i === w.todayIx;
        var cell = document.createElement("div"); cell.className = "day";
        cell.innerHTML = '<div class="d' + (on ? ' on' : '') + '"' + (isT && !on ? ' style="box-shadow:inset 0 0 0 2px #ff8a3d;"' : '') + '>' + (on ? '✓' : '·') + '</div><div class="lbl">' + L[i] + '</div>';
        wk.appendChild(cell);
      }
      document.getElementById("wkDays").textContent = w.done + (w.done === 1 ? " day" : " days") + " practiced";
    })();

    // Each sound's level on the practice ladder, most-practiced first.
    var bs = document.getElementById("bysound");
    if (!keys.length) bs.innerHTML = '<p class="levels-empty">Sounds appear here after sound practice.</p>';
    keys.sort(function (a, b) { return triesOf(out[b]) - triesOf(out[a]); }).forEach(function (k) {
      var row = document.createElement("div"), n = triesOf(out[k]); row.className = "levelrow";
      var nm = document.createElement("span"); nm.textContent = soundLabel(k) + " sound"; row.appendChild(nm);
      var tr = document.createElement("span"); tr.className = "n"; tr.textContent = n + (n === 1 ? " try" : " tries"); row.appendChild(tr);
      var lv = document.createElement("span"); lv.className = "lvl"; lv.textContent = Sona.rungLabel ? Sona.rungLabel(Sona.rungOf(k)) : "Sound practice"; row.appendChild(lv);
      bs.appendChild(row);
    });

    // The pilot send button is available only with both consent and a verified
    // clinician connection, exactly like the shared sendProgress function.
    try {
      if (Sona.isPilot && Sona.isPilot() && Sona.pilotInfo().consentAt && localStorage.getItem("sona.slpticket")) {
        var pilotButton = document.getElementById("sendProg"); pilotButton.style.display = "";
        pilotButton.onclick = function () { Sona.sendProgress("manual"); document.getElementById("shareStatus").textContent = "Progress sharing requested for your connected speech-language pathologist."; };
      }
    } catch (e) {}
  </script>
</body>
</html>
