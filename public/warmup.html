<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Warm up</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --ink:#16384f; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;}
    html,body{height:100%;}
    body{background:radial-gradient(circle at 50% 18%,#dff4ff,#bfe3ff 55%,#a9d8ff);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    #app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));box-sizing:border-box;text-align:center;}
    .badge{font-family:"Baloo 2";font-weight:800;font-size:13px;color:var(--blue-d);text-transform:uppercase;letter-spacing:.08em;}
    h1{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--ink);margin-top:6px;line-height:1.1;}
    .say{font-family:"Baloo 2";font-weight:800;font-size:74px;color:var(--blue-d);margin:6px 0 2px;text-shadow:0 4px 0 rgba(28,176,246,.18);}
    #leo{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(20,90,160,.28));animation:bob 2.6s ease-in-out infinite;}
    @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
    #leo.pulse{animation:pop .3s ease;}
    @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.12);}100%{transform:scale(1);}}
    .barwrap{width:100%;max-width:320px;margin-top:18px;}
    .pips{display:flex;gap:6px;justify-content:center;margin-bottom:10px;}
    .pip{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.12);transition:transform .2s,background .2s;}
    .pip.on{background:var(--green);transform:scale(1.15);box-shadow:0 3px 8px rgba(70,160,0,.4);}
    .bar{height:18px;border-radius:99px;background:#fff;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.12);}
    .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad131,var(--green));border-radius:99px;transition:width .3s;}
    .hint{font-weight:800;font-size:15px;color:var(--ink);margin-top:16px;min-height:22px;}
    .mic{margin-top:16px;width:78px;height:78px;border-radius:50%;border:none;background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d);cursor:pointer;font-size:34px;display:flex;align-items:center;justify-content:center;}
    .mic.live{animation:mglow 1.2s ease-in-out infinite;}
    @keyframes mglow{0%,100%{box-shadow:0 6px 0 var(--blue-d),0 0 0 0 rgba(28,176,246,.5);}50%{box-shadow:0 6px 0 var(--blue-d),0 0 0 16px rgba(28,176,246,0);}}
    .skip{margin-top:14px;background:none;border:none;color:#5a86a6;font-weight:800;font-size:13px;cursor:pointer;}
  </style>
</head>
<body>
  <div id="app">
    <div class="badge">Warm up 🎙️</div>
    <h1 id="title">Say it to start!</h1>
    <div class="say" id="say">rrr</div>
    <img id="leo" src="/coach/echo/echo-idle.svg" alt="Echo" onerror="this.style.display='none';" />
    <div class="barwrap">
      <div class="pips" id="pips"></div>
      <div class="bar"><span id="fill"></span></div>
    </div>
    <div class="hint" id="hint">Tap the mic and say it!</div>
    <button class="mic" id="mic" title="Say it">🎤</button>
    <button class="skip" id="skip">Skip warm-up →</button>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var qp=new URLSearchParams(location.search);
    var S=window.Sona||null;
    var profile=S?S.getProfile():{voiceId:"",volume:0.8};
    var SOUND=(qp.get("sound")||((profile.focusSounds&&profile.focusSounds[0])||"R")).toUpperCase();
    if(!(S&&S.WORDS&&S.WORDS[SOUND])) SOUND="R";
    var LEVEL=parseInt(qp.get("level"),10)||1;
    var SAY=window.Sona.soundSay(SOUND);
    $("say").textContent=SAY;
    var GOAL=4, reps=0;

    // pips
    var pips=$("pips"); for(var i=0;i<GOAL;i++){ var p=document.createElement("div"); p.className="pip"; pips.appendChild(p); }
    function paint(){ $("fill").style.width=Math.min(100,reps/GOAL*100)+"%"; var kids=pips.children; for(var i=0;i<kids.length;i++) kids[i].className="pip"+(i<reps?" on":""); }

    // audio (Leo models the sound)
    var audioCtx=null,speaking=false;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    function playPCM(b){ return new Promise(function(res){ try{ var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(S&&S.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start(); }catch(e){res();} }); }
    function say(t){ return new Promise(function(res){ if(!t||speaking||profile.voiceOn===false)return res(); speaking=true; fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){return b?playPCM(new Uint8Array(b)):null;}).catch(function(){}).finally(function(){speaking=false;res();}); }); }
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }

    function addRep(){
      if(reps>=GOAL) return; reps++; paint();
      sfx("tap"); var l=$("leo"); l.classList.remove("pulse"); void l.offsetWidth; l.classList.add("pulse");
      if(reps>=GOAL){ done(); }
      else if(reps===Math.ceil(GOAL/2)){ $("hint").textContent="Halfway — keep going!"; }
    }
    var finished=false;
    function done(){
      if(finished)return; finished=true;
      $("hint").textContent="Blast off! 🚀"; sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      // warmed up → straight into the Charge & Play daily session
      setTimeout(function(){
        location.href="/charge.html?session=1&sound="+encodeURIComponent(SOUND)+"&level="+LEVEL;
      }, 650);
    }

    // mic: each rep is a real recorded attempt, SCORED — saying the sound (not
    // noise or a tap) is what fills the gauge. Escape hatch after enough tries so
    // a kid is never hard-stuck (held isolated sounds aren't perfectly scoreable).
    var micStream=null, useSpeechAce=true;
    (function(){ try{ fetch("/api/score").then(function(r){return r.json();}).then(function(j){ useSpeechAce=!!(j&&j.hasKey); }).catch(function(){ useSpeechAce=false; }); }catch(e){ useSpeechAce=false; } })();
    function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
    function recordRep(){ if(window.Sona&&Sona.hasNativeAudio&&Sona.hasNativeAudio())return Sona.captureClip({maxMs:6000});
      return new Promise(function(resolve){
        var done2=false,chunks=[],rec=null,sr=null,transcript="",micBtn=$("mic");
        function fin(){ if(done2)return; done2=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} micBtn.classList.remove("live"); setTimeout(function(){ resolve({blob:chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null, transcript:transcript}); },120); }
        try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
        try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; fin();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
        try{ if(micStream){ var ctx=getCtx(); var msrc=ctx.createMediaStreamSource(micStream); var an=ctx.createAnalyser(); an.fftSize=512; msrc.connect(an); var td=new Uint8Array(an.fftSize); var t0=performance.now(),nS=0,nN=0,thr=0,spoke=false,lastV=0;
          (function tick(){ if(done2)return; an.getByteTimeDomainData(td); var sum=0; for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;} var rms=Math.sqrt(sum/td.length),now=performance.now();
            if(now-t0<300){nS+=rms;nN++;} else { if(!thr)thr=Math.max(0.03,(nS/Math.max(1,nN))*2.6); if(rms>thr){spoke=true;lastV=now;} if(spoke&&now-lastV>=900){fin();return;} }
            requestAnimationFrame(tick); })();
        } }catch(e){}
        micBtn.classList.add("live"); micBtn.onclick=fin;
        setTimeout(function(){ if(!done2)fin(); }, 6000);
      });
    }
    async function scoreRep(res){
      if(useSpeechAce && res.blob){ try{ var fd=new FormData(); fd.append("audio",new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"})); fd.append("text",SAY); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode","phoneme"); var r=await fetch("/api/score",{method:"POST",body:fd}); var j=await r.json(); if(j&&j.ok)return (j.rating!=="tryAgain")||(typeof j.score==="number"&&j.score>=50); }catch(e){} }
      return !!(norm(res.transcript) || (res.blob&&res.blob.size>1500)); // no scorer: a genuine spoken attempt counts
    }
    (async function(){
      try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      if(!micStream){ $("hint").textContent="No mic — tap Skip to start playing!"; return; }
      await say(window.Sona.actionCue(SOUND,GOAL,"warm up and blast off"));
      var tries=0;
      while(reps<GOAL && tries<GOAL*3 && !finished){
        tries++;
        $("hint").textContent="Say "+SAY+"!";
        var res=await recordRep();
        var ok=await scoreRep(res);
        if(ok){ addRep(); } else { $("hint").textContent="I need to hear your "+SAY+" — try again!"; await new Promise(function(r){setTimeout(r,250);}); }
      }
      if(!finished) done();
    })();
    $("skip").onclick=function(){ done(); };
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  </script>
</body>
</html>
