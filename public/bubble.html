<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Bubble Pop</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --ink:#16384f; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;}
    html,body{height:100%;overflow:hidden;} body{background:
        radial-gradient(120% 70% at 50% -8%, rgba(255,255,255,.85), rgba(255,255,255,0) 55%),
        radial-gradient(80% 50% at 85% 8%, rgba(120,206,255,.30), rgba(120,206,255,0) 60%),
        linear-gradient(180deg,#e0f4ff 0%,#c9ebff 42%,#a7d8fb 78%,#8ec9f4 100%);color:var(--ink);}
    #app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;z-index:6;}
    #close{border:none;background:rgba(255,255,255,.5);color:#5b89a8;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--blue-d);}
    .stat.count{margin-left:auto;}
    #stage{flex:1;position:relative;overflow:hidden;}
    .bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Baloo 2";font-weight:800;color:#fff;
      background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(150,210,255,.65) 45%,rgba(80,170,240,.5));
      box-shadow:inset 0 -6px 12px rgba(0,80,150,.18),0 6px 16px rgba(20,120,200,.2);font-size:26px;animation:float 4s ease-in-out infinite;}
    .bubble.target{outline:4px solid #ffd23d;outline-offset:3px;animation:float 4s ease-in-out infinite, pulse 1.1s ease-in-out infinite;}
    .bubble.pop{animation:pop .34s cubic-bezier(.3,.7,.4,1) forwards;}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes pulse{0%,100%{box-shadow:inset 0 -6px 12px rgba(0,80,150,.18),0 0 0 0 rgba(255,210,61,.6)}50%{box-shadow:inset 0 -6px 12px rgba(0,80,150,.18),0 0 0 14px rgba(255,210,61,0)}}
    /* a real burst: expand fast + vanish (not shrink away) */
    @keyframes pop{0%{transform:scale(1);opacity:1;filter:blur(0)}22%{transform:scale(1.18);opacity:1}100%{transform:scale(1.55);opacity:0;filter:blur(1.5px)}}
    .popring{position:absolute;border:3px solid rgba(255,255,255,.92);border-radius:50%;pointer-events:none;z-index:3;animation:popring .42s ease-out forwards;}
    @keyframes popring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}
    .drop{position:absolute;border-radius:50%;pointer-events:none;z-index:3;background:radial-gradient(circle at 35% 30%,#ffffff,#bfe6ff 72%);box-shadow:0 1px 3px rgba(20,120,200,.25);}
    #leoWrap{position:absolute;left:8px;bottom:6px;width:80px;z-index:4;pointer-events:none;} #leoWrap.react{animation:lpop .55s ease;}
    #leo{width:100%;filter:drop-shadow(0 6px 8px rgba(20,90,160,.25));} @keyframes lpop{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-8px)}100%{transform:scale(1)}}
    #bottom{padding:8px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.6));z-index:6;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--blue-d);min-height:20px;text-align:center;}
    #sayCard{background:#fff;border-radius:18px;padding:8px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(20,120,200,.12);}
    #sayCard b{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--blue-d);} #hear{border:none;background:none;cursor:pointer;font-size:22px;}
    .mic{width:90px;height:90px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 30%,#5cc6ff,#1cb0f6 60%,#1597d4);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);} .mic.rec{animation:mpulse 1.4s infinite;} .mic svg{width:40px;height:40px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:40px;max-height:40px;overflow:hidden;} .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes mpulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 16px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}
    #win{position:fixed;inset:0;z-index:50;background:
        radial-gradient(90% 60% at 50% 0%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%),
        linear-gradient(180deg,#e0f4ff,#a7d8fb);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;} #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(20,90,160,.25));animation:lpop .6s ease;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--blue-d);margin-top:10px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--blue-d);margin-top:18px;box-shadow:0 6px 16px rgba(20,120,200,.12);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:#6b86a3;text-transform:uppercase;}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);} #win a{margin-top:14px;color:#6b86a3;font-weight:800;font-size:14px;text-decoration:none;}

    /* ═══════════════════════════════════════════════════════════════════
       VISUAL POLISH LAYER — additive, CSS-only. Mirrors the shared Sona
       design system (sona-drift / sona-floatY / sona-twinkle / glow-pulse)
       so Bubble Pop speaks the same visual language as the rest of the app.
       Animates transform/opacity (box-shadow sparingly); never touches the
       game logic or the DOM. All depth rides on ::before/::after + extra
       background layers on existing nodes.
       NOTE: a script may set #stage's background-image inline when
       /coach/bubble/bg.png exists — our scenery lives on #stage's own
       background + pseudo-elements, so we never overwrite that art hook.
       ═══════════════════════════════════════════════════════════════════ */

    /* Reused scenery keyframes (same names/values as /public/sona.css) */
    @keyframes sona-drift{from{transform:translateX(0)}to{transform:translateX(-130vw)}}
    @keyframes sona-floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes sona-twinkle{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:.85;transform:scale(1.1)}}

    /* ── UNDERWATER / SKY STAGE ── a soft sunlit caustic wash painted into
       #stage's own background (sits *under* any drop-in art bg-image and
       under every real child: leo + the bubbles). Gives the play area depth
       even before any bubble is drawn. */
    #stage{background:
        radial-gradient(70% 45% at 50% -10%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
        radial-gradient(40% 60% at 12% 8%, rgba(110,200,255,.22), rgba(110,200,255,0) 70%),
        radial-gradient(46% 70% at 90% 4%, rgba(150,225,255,.20), rgba(150,225,255,0) 72%),
        linear-gradient(180deg, rgba(224,244,255,.0) 0%, rgba(150,206,250,.28) 100%);}

    /* ── DRIFTING LIGHT RAYS ── a slow, very soft diagonal shimmer layer
       (z-index:0 → tree order keeps it behind leo + the bubbles). Wide so it
       can drift fully off-screen and loop seamlessly. */
    #stage::before{
      content:"";position:absolute;top:0;left:0;width:240vw;height:100%;z-index:0;pointer-events:none;opacity:.5;
      background:
        linear-gradient(74deg, transparent 0 18%, rgba(255,255,255,.16) 20%, transparent 24% 40%,
          rgba(255,255,255,.10) 43%, transparent 47% 70%, rgba(255,255,255,.14) 73%, transparent 78%);
      animation:sona-drift 60s linear infinite;will-change:transform;
    }
    /* ── AMBIENT BUBBLES ── a scatter of tiny idle bubbles gently bobbing in
       the background via sona-floatY, plus a couple of twinkling sparkles.
       Pure CSS gradient dots on #stage::after (behind the real bubbles). */
    #stage::after{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%) 14% 78%/14px 14px no-repeat,
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.8), rgba(255,255,255,0) 70%) 82% 86%/20px 20px no-repeat,
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%) 60% 70%/10px 10px no-repeat,
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,0) 70%) 8% 50%/8px 8px no-repeat,
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.8), rgba(255,255,255,0) 70%) 92% 60%/12px 12px no-repeat;
      animation:sona-floatY 5.5s ease-in-out infinite;will-change:transform;
    }

    /* ── PROGRESS PILL ── the count/goal stat gets a soft blue gradient fill
       + brighter type, so it reads as a live score chip (stays fully rounded). */
    .stat.count{background:linear-gradient(180deg,#eaf7ff,#cfecff);box-shadow:inset 0 1px 2px rgba(255,255,255,.8),0 2px 6px rgba(20,120,200,.12);}
    .stat.count #count{color:var(--blue-d);}

    /* ── TARGET BUBBLE ── keep the existing golden outline + box-shadow pulse;
       add a warm halo via filter (composes independently of the animated
       box-shadow) so the "say this one" bubble feels invitingly alive. */
    .bubble.target{filter:drop-shadow(0 0 10px rgba(255,210,61,.6));}

    /* ── JUICIER POP ── a brief soft white bloom layered into the burst so a
       correct answer feels rewarding (scale already handled by @keyframes pop). */
    .bubble.pop{box-shadow:inset 0 -6px 12px rgba(0,80,150,.10),0 0 26px 8px rgba(255,255,255,.75);}
    .popring{box-shadow:0 0 14px 2px rgba(255,255,255,.6);}

    /* ── MIC ── a gentle breathing glow while idle (mirrors shared sona-glow /
       glow-pulse), preserving the chunky 3D base shadow + inset highlight so
       the button keeps its depth. .rec keeps its stronger recording pulse. */
    .mic{animation:micBreath 2.4s ease-in-out infinite;will-change:box-shadow;}
    @keyframes micBreath{
      0%,100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45)}
      50%{box-shadow:0 0 0 9px rgba(28,176,246,.16),0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45)}
    }
    .mic.rec{animation:mpulse 1.4s infinite;} /* recording pulse wins over idle breath */

    /* ── WIN SCREEN ── a soft celebratory radial wash behind the content. */
    #win::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(60% 45% at 50% 32%, rgba(255,255,255,.6), rgba(170,220,255,0) 70%);}
    #win > *{position:relative;}

    /* Accessibility: calm every loop for reduced-motion users. */
    @media (prefers-reduced-motion: reduce){
      #stage::before,#stage::after,.mic{animation:none !important;}
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat" id="rungBadge">Syllables</span>
      <span class="stat count"><span id="count">0</span>/<span id="goal">8</span></span>
    </div>
    <div id="stage"><div id="leoWrap"><img id="leo" src="/coach/echo/echo-idle.svg" alt="Echo" /></div></div>
    <div id="bottom">
      <div id="prompt">Say it to pop the bubble!</div>
      <div id="sayCard"><b id="sayText">rah</b><button id="hear" title="Hear it"><svg viewBox="0 0 24 24" fill="none" stroke="#1597d4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;display:block;"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
      <button class="mic" id="micBtn" title="Say it"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div id="win">
    <img class="leoWin" src="/coach/echo/echo-celebrate.svg" alt="Echo" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
    <h1>Pop pop pop! 🫧</h1>
    <div class="reward"><span id="winCount">0</span><small>bubbles popped</small></div>
    <div class="reward" id="winUnlock" style="background:#fff7df;color:#e08600;"></div>
    <button class="btn" id="again">Play again</button><a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var profile=(window.Sona?Sona.getProfile():{focusSounds:["R"],voiceId:"",volume:0.8});
    var SOUND=(new URLSearchParams(location.search).get("sound")||(profile.focusSounds&&profile.focusSounds[0])||"R").toUpperCase();
    if(!(window.Sona&&Sona.WORDS&&Sona.WORDS[SOUND])) SOUND="R";
    /* ── SLP CONTENT LADDER ──────────────────────────────────────────────
       Serve the child's CURRENT rung for this sound (isolation→…→sentence)
       instead of always practicing at word/syllable level. Computed ONCE. */
    var RUNG=(window.Sona&&Sona.rungOf)?Sona.rungOf(SOUND):2; if(RUNG>5)RUNG=5;
    var ITEMS=(window.Sona&&Sona.ladderContent)?Sona.ladderContent(SOUND,RUNG):[];
    if(RUNG>=5 && (!ITEMS.length || (ITEMS[0]&&ITEMS[0].q))){ RUNG=4; ITEMS=Sona.ladderContent(SOUND,4); } // arcade can't do conversation -> sentences
    if(!ITEMS.length){ ITEMS=((window.Sona&&Sona.wordsFor)?Sona.wordsFor(SOUND):[]).map(function(w){return {t:w.w,say:w.w,display:w.w,e:w.e,word:w.w,level:"word",mode:"full"};}); }
    if(!ITEMS.length){ ITEMS=[{t:"rah",say:"rah",display:"rah",level:"syllable",mode:"phoneme"}]; }
    /* SYL kept as the game's content list (now = ladder ITEMS) so existing mechanic is untouched */
    var SYL=ITEMS;
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    /* ── 10 LEVELS: a journey through Bubble Bay 🫧 ──
       Knobs: goal (# of bubbles to pop = length), float (bob-animation seconds;
       lower = faster, livelier bubbles). Scenery: bg gradient on #stage,
       accent color, ambient props. Gentle at L1 → special boss at L10.
       Replaces the old GOAL=min(18,6+DIFF*2). */
    var LEVELS=[
      {name:"Shallows",     bg:"linear-gradient(180deg,#eafaff 0%,#c9f0ff 55%,#a9e4fb 100%)", accent:"#1cb0f6", props:["🫧","🐚"],            goal:5,  float:4.6},
      {name:"Coral Reef",   bg:"linear-gradient(180deg,#dff7ff 0%,#ffd9ec 55%,#ffb3d6 100%)", accent:"#ff7eb6", props:["🐠","🪸"],            goal:6,  float:4.3},
      {name:"Kelp Forest",  bg:"linear-gradient(180deg,#d6f5e8 0%,#9fe0bf 55%,#5bbf8f 100%)", accent:"#2fae74", props:["🌿","🐡"],            goal:7,  float:4.0},
      {name:"Shipwreck",    bg:"linear-gradient(180deg,#cfe3ef 0%,#8fa9b8 55%,#5e7585 100%)", accent:"#7e96a6", props:["⚓","🪵"],            goal:8,  float:3.7},
      {name:"Deep Trench",  bg:"linear-gradient(180deg,#9fc4e0 0%,#3f6e96 55%,#1f3d5c 100%)", accent:"#2f6e9e", props:["🌊","🐙"],            goal:9,  float:3.4},
      {name:"Sea Cave",     bg:"linear-gradient(180deg,#9aa7c4 0%,#5a4f7a 55%,#2e2746 100%)", accent:"#8a7ec0", props:["🦑","🪨"],            goal:10, float:3.2},
      {name:"Arctic Sea",   bg:"linear-gradient(180deg,#eafcff 0%,#bfe9f5 55%,#8ec9e8 100%)", accent:"#6fb7d6", props:["🧊","🐋"],            goal:11, float:3.0},
      {name:"Tropical Lagoon",bg:"linear-gradient(180deg,#defcff 0%,#7ff0d8 55%,#34c6b0 100%)", accent:"#19c2a6", props:["🏝️","🐢"],          goal:12, float:2.8},
      {name:"Glowing Deep", bg:"linear-gradient(180deg,#1a2750 0%,#283a86 50%,#5b3fa0 100%)", accent:"#9b7bff", props:["✨","🪼"],            goal:14, float:2.6},
      {name:"Treasure Cove",bg:"linear-gradient(180deg,#0e1b3a 0%,#1f3c78 45%,#caa23a 100%)", accent:"#ffcf3d", props:["🏆","💎","🫧"],       goal:16, float:2.4}
    ];
    var L=LEVELS[Math.min(9,Math.max(0,DIFF-1))];
    var GOAL=L.goal, COLORS=["#7fd0ff","#9ad0ff","#8fd9c2","#ffb6c8","#c9b3ff"];
    /* paint this level's scene onto the real scene element (#stage) */
    (function(){ var stage=document.getElementById("stage")||document.body;
      if(L.bg)stage.style.background=L.bg;
      if(L.accent){ try{ document.documentElement.style.setProperty("--blue",L.accent); }catch(e){} }
      /* faint ambient props for this level's world (behind the real bubbles + leo) */
      if(L.props&&L.props.length){ var amb=document.createElement("div"); amb.setAttribute("aria-hidden","true");
        amb.style.cssText="position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;";
        var spots=[[12,68],[78,30],[55,82],[30,22],[88,72]];
        for(var p=0;p<5;p++){ var e=document.createElement("span"); e.textContent=L.props[p%L.props.length];
          e.style.cssText="position:absolute;left:"+spots[p][0]+"%;top:"+spots[p][1]+"%;font-size:"+(30+(p%3)*10)+"px;opacity:.22;animation:sona-floatY "+(5+p*0.6)+"s ease-in-out infinite;animation-delay:"+(p*0.4)+"s;";
          amb.appendChild(e); }
        stage.appendChild(amb);
      }
      /* per-level art-drop override: /coach/bubble/lvlN.png replaces the CSS scene if it exists */
      var im=new Image(); im.onload=function(){ stage.style.backgroundImage="url("+im.src+")"; stage.style.backgroundSize="cover"; stage.style.backgroundPosition="center"; }; im.src="/coach/bubble/lvl"+DIFF+".png";
    })();

    /* rung badge: show which level of the ladder the child is practicing */
    (function(){ var rb=$("rungBadge"); if(rb)rb.textContent="Practicing: "+((window.Sona&&Sona.rungLabel)?Sona.rungLabel(RUNG):""); })();

    var audioCtx=null; function getCtx(){if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();}if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx;}
    function playPCM(b){return new Promise(function(res){try{var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength);for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768;var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start();}catch(e){res();}});}
    var speaking=false; function say(t){return new Promise(function(res){if(!t||speaking)return res();speaking=true;fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){return b?playPCM(new Uint8Array(b)):null;}).catch(function(){}).finally(function(){speaking=false;res();});});}
    var LEO={idle:"/coach/echo/echo-idle.svg",cheer:"/coach/echo/echo-celebrate.svg",listen:"/coach/echo/echo-listening.svg"};
    Object.keys(LEO).forEach(function(k){var im=new Image();im.src=LEO[k];});
    function setLeo(s){var el=$("leo");if(el&&LEO[s])el.src=LEO[s];}
    function leoReact(){var w=$("leoWrap");if(!w)return;w.classList.remove("react");void w.offsetWidth;w.classList.add("react");}
    // bubble burst: a "ploop" + a splash ring + droplets flying out
    function popSound(){ try{ var ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain(); o.type="sine"; o.frequency.setValueAtTime(740,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(170,ctx.currentTime+0.12); g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime((profile.volume!=null?profile.volume:0.8)*0.5,ctx.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.16); o.connect(g);g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.18); }catch(e){} }
    function popFx(bub){ try{ var stage=$("stage"), cx=bub.offsetLeft+bub.offsetWidth/2, cy=bub.offsetTop+bub.offsetHeight/2, rs=bub.offsetWidth;
      var ring=document.createElement("div"); ring.className="popring"; ring.style.width=rs+"px"; ring.style.height=rs+"px"; ring.style.left=(cx-rs/2)+"px"; ring.style.top=(cy-rs/2)+"px"; stage.appendChild(ring); setTimeout(function(){ring.remove();},460);
      var N=9; for(var i=0;i<N;i++){ var d=document.createElement("div"); d.className="drop"; var sz=6+Math.random()*9; d.style.width=sz+"px"; d.style.height=sz+"px"; d.style.left=(cx-sz/2)+"px"; d.style.top=(cy-sz/2)+"px"; stage.appendChild(d);
        var ang=(Math.PI*2*i/N)+Math.random()*0.5, dist=38+Math.random()*48, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
        if(d.animate){ d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+dx+"px,"+(dy+22)+"px) scale(.35)",opacity:0}],{duration:480+Math.random()*180,easing:"cubic-bezier(.3,.6,.5,1)"}); }
        (function(el){ setTimeout(function(){el.remove();},740); })(d);
      }
      popSound();
    }catch(e){} }

    var micStream=null, useSpeechAce=false;
    function norm(s){return (s||"").toLowerCase().replace(/[^a-z]/g,"");}
    function matchSyl(t,w){t=norm(t);w=norm(w);return !!t && (t.indexOf(w)>=0 || w.indexOf(t)>=0);}
    // record the attempt (audio for SpeechAce + transcript + a voice-activity auto-stop)
    function recordTurn(maxMs){ if(window.Sona&&Sona.hasNativeAudio&&Sona.hasNativeAudio())return Sona.captureClip({maxMs:(maxMs||6000)}); maxMs=maxMs||7000; return new Promise(function(resolve){
      var done=false,chunks=[],rec=null,sr=null,transcript="",spoke=false,lastV=0,raf=null,src=null,bars=null,micBtn=$("micBtn"),ico=micBtn.querySelector("svg");
      function finish(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} micBtn.classList.remove("rec");micBtn.onclick=null; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} if(bars)bars.remove(); if(ico)ico.style.display=""; setTimeout(function(){resolve({transcript:transcript,blob:chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null,spoke:spoke});},120); }
      try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
      try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; finish();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
      micBtn.classList.add("rec"); micBtn.onclick=finish;
      try{ if(micStream){ var ctx=getCtx();src=ctx.createMediaStreamSource(micStream);var an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
        var fd=new Uint8Array(an.frequencyBinCount),td=new Uint8Array(an.fftSize);bars=document.createElement("div");bars.className="wavebars";for(var b=0;b<7;b++)bars.appendChild(document.createElement("i"));if(ico)ico.style.display="none";micBtn.appendChild(bars);
        var t0=performance.now(),nS=0,nN=0,thr=0,vms=0,lt=0;
        (function tick(){ if(done)return; an.getByteFrequencyData(fd);[].forEach.call(bars.children,function(el,k){el.style.height=(8+fd[2+k*3]/255*30)+"px";});
          an.getByteTimeDomainData(td);var sum=0;for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;}var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<450){nS+=rms;nN++;lt=now;}else{if(!thr)thr=Math.max(0.05,(nS/Math.max(1,nN))*3.2);var dt=now-lt;lt=now;if(rms>thr){vms+=dt;lastV=now;if(vms>=250)spoke=true;}else if(rms<thr*0.65)vms=Math.max(0,vms-dt*0.5);if(spoke&&now-lastV>=850){finish();return;}}
          raf=requestAnimationFrame(tick);})();
      } }catch(e){}
      setTimeout(function(){ if(!done)finish(); }, maxMs);
    }); }
    // honest scoring: SpeechAce is the judge — a wrong syllable or silence → try again
    async function scoreSyllable(res,text,mode){
      mode=mode||"full";
      if(useSpeechAce && res.blob){ try{ var fd=new FormData(); fd.append("audio",new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"})); fd.append("text",text); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode",mode); var r=await fetch("/api/score",{method:"POST",body:fd}); var j=await r.json(); if(j&&j.ok&&j.rating) return {pass:j.rating!=="tryAgain"}; }catch(e){} }
      if(res.transcript) return {pass:matchSyl(res.transcript,text)};
      return {pass:false};
    }

    var queue=[], qi=0, popped=0, bubbleEls=[], roundCorrect=0, roundTotal=0;
    function layoutBubbles(){
      var stage=$("stage"); bubbleEls=[];
      SYL.forEach(function(s,i){
        var el=document.createElement("div"); el.className="bubble"; var sz=84+ (i%2?10:0);
        el.style.width=sz+"px"; el.style.height=sz+"px"; el.textContent=(s.e||s.display||s.t);
        if(s.e)el.style.fontSize="34px"; else if((s.display||s.t).length>6)el.style.fontSize="16px"; else if((s.display||s.t).length>3)el.style.fontSize="20px";
        el.style.background="radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),"+COLORS[i%COLORS.length]+" 60%,rgba(80,170,240,.5))";
        el.style.left=(8+i*18 + (i%2?6:0))+"%"; el.style.top=(16+(i%3)*22)+"%"; el.style.animationDelay=(i*0.3)+"s";
        el.style.animationDuration=(L.float)+"s, 1.1s"; /* float bob speed scales with level (2nd value keeps target pulse intact) */
        el.dataset.syl=s.t; $("stage").appendChild(el); bubbleEls.push(el);
      });
    }
    function bubbleFor(syl){ for(var i=0;i<bubbleEls.length;i++){ if(bubbleEls[i].dataset.syl===syl && !bubbleEls[i].classList.contains("pop")) return bubbleEls[i]; }
      // all of that syllable already popped -> respawn one
      for(var k=0;k<bubbleEls.length;k++){ if(bubbleEls[k].dataset.syl===syl){ bubbleEls[k].classList.remove("pop"); return bubbleEls[k]; } } return bubbleEls[0]; }

    function clearTarget(){ bubbleEls.forEach(function(b){b.classList.remove("target");}); }

    var stepTries=0; // fail-forward: attempts on the current bubble
    async function step(){
      if(popped>=GOAL) return finishGame();
      var s=queue[qi%queue.length];
      var disp=(s.display||s.t), spk=(s.say||s.t);
      $("sayText").textContent=disp;
      var bub=bubbleFor(s.t); clearTarget(); if(bub){ bub.classList.add("target"); }
      setLeo("listen"); $("prompt").textContent="Listen…";
      // sound-coaching at isolation/syllable: still model the sound itself
      if((s.level==="isolation"||s.level==="syllable") && window.Sona){
        if(s.level==="isolation"&&Sona.repeatCue){ await say(Sona.repeatCue(SOUND)); }
        else { await say(spk); }
      } else { await say(spk); }
      $("prompt").textContent="Say “"+disp+"” to pop it!";
      var res=await recordTurn(); roundTotal++; var sa=await scoreSyllable(res, s.t, s.mode);
      if(window.Sona&&Sona.logAttempt)Sona.logAttempt({game:"bubble",sound:SOUND,pass:sa.pass});
      if(sa.pass){
        stepTries=0; roundCorrect++;
        if(window.Sona&&Sona.sfx&&Sona.sfx.correct)Sona.sfx.correct();
        setLeo("cheer"); leoReact(); if(bub){ bub.classList.remove("target"); bub.classList.add("pop"); popFx(bub); }
        popped++; qi++; $("count").textContent=popped; $("prompt").textContent="Nice one!";
        if(window.Sona&&Sona.praiseLine)await say(Sona.praiseLine());
        await new Promise(function(r){setTimeout(r,520);});
        setLeo("idle"); step();
      } else if(++stepTries<3){
        if(window.Sona&&Sona.sfx&&Sona.sfx.tap)Sona.sfx.tap();
        setLeo("idle"); $("prompt").textContent="Not quite — try again!"; await say(spk);
        await new Promise(function(r){setTimeout(r,320);});
        step();
      } else {
        // fail-forward: don't trap the kid on one bubble — pop it (logged as a
        // miss above) and move on after 3 tries.
        stepTries=0;
        if(window.Sona&&Sona.sfx&&Sona.sfx.correct)Sona.sfx.correct();
        setLeo("cheer"); if(bub){ bub.classList.remove("target"); bub.classList.add("pop"); popFx(bub); }
        popped++; qi++; $("count").textContent=popped; $("prompt").textContent="Good trying! 🫧";
        await say("Good trying! Here comes the next one.");
        await new Promise(function(r){setTimeout(r,520);});
        setLeo("idle"); step();
      }
    }

    function finishGame(){
      // record mastery for this rung so the ladder can advance (gates ~80%)
      if(window.Sona&&Sona.recordRung)Sona.recordRung(SOUND,RUNG,roundCorrect/Math.max(1,roundTotal));
      var earned=15; if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}");GS[SOUND]=GS[SOUND]||{};GS[SOUND].bubble={done:true};GS.lastPlayDay=(window.Sona&&Sona.localDay?Sona.localDay():new Date().toISOString().slice(0,10));localStorage.setItem("sona.games.v1",JSON.stringify(GS));}catch(e){}
      $("winCount").textContent=popped; $("winUnlock").textContent="+"+earned+" 🪙"; $("win").classList.add("show");
      if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win"));
      if(window.Sona){Sona.confetti&&Sona.confetti();Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete();Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin();}
    }
    function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
    function startGame(){ $("win").classList.remove("show"); $("stage").querySelectorAll(".bubble").forEach(function(b){b.remove();});
      popped=0; qi=0; roundCorrect=0; roundTotal=0; $("count").textContent="0"; $("goal").textContent=GOAL; layoutBubbles();
      // queue = each syllable cycled to reach GOAL
      queue=[]; while(queue.length<GOAL){ queue=queue.concat(shuffle(SYL)); } queue=queue.slice(0,GOAL);
      setLeo("idle"); step();
    }
    (async function(){ try{var r=await fetch("/api/score");var j=await r.json();useSpeechAce=!!(j&&j.hasKey);}catch(e){useSpeechAce=false;}
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){micStream=null;}
      $("hear").onclick=function(){ var c=queue[qi%queue.length]; say(c?(c.say||c.t):$("sayText").textContent); }; $("again").onclick=startGame;
      if(window.Sona&&Sona.music)Sona.music.start(); startGame();
    })();
    (function(){ var lad="/map.html"; var c=$("close"); if(c)c.onclick=function(){location.href=lad;}; Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){a.setAttribute("href",lad);}); })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  
    /* art drop-in FALLBACK: a generic /coach/bubble/bg.png swaps in only when no
       per-level lvlN.png art has been applied (the level scene/art-drop wins). */
    (function(){var im=new Image();im.onload=function(){var s=document.getElementById("stage");if(s&&!/lvl\d+\.png/.test(s.style.backgroundImage||"")){s.style.backgroundImage="url(/coach/bubble/bg.png)";s.style.backgroundSize="cover";s.style.backgroundPosition="center";}};im.src="/coach/bubble/bg.png";})();
</script>
