<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e9">
  <title>Sona — Bubble Pop</title>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/simple-play.css">
</head>
<body data-simple-game="bubbles" data-phase="intro">
  <div class="game-shell">
    <header class="game-header">
      <a class="back-link" id="backLibrary" href="/activities.html" aria-label="Back to play library"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m4 13 10-9 10 9M7 11v13h5v-7h4v7h5V11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Library</span></a>
      <a class="sona-brand" id="homeLink" href="/today.html" aria-label="Sona home"><img src="/coach/echo/echo-idle.svg" alt=""> Sona</a>
      <button class="pause-button" id="pauseGame" type="button" aria-label="Pause game" hidden><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3v12M13 3v12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg><span class="sr-only">Pause</span></button>
    </header>

    <main>
      <section class="start-panel" id="startPanel" aria-labelledby="gameTitle">
        <h1 id="gameTitle">Bubble Pop</h1>
        <div class="intro-art" aria-hidden="true"><div class="intro-bubbles"><span class="bubble bubble-small"></span><span class="bubble bubble-main"><img src="/coach/echo/echo-celebrate.svg" alt=""></span><span class="bubble bubble-tiny"></span><span class="bubble bubble-back"></span></div><span class="intro-spark spark-a"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 2 5 12 13 6-13 5-5 13-6-13L2 20l12-6Z" fill="currentColor"/></svg></span><span class="intro-spark spark-b"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 2 5 12 13 6-13 5-5 13-6-13L2 20l12-6Z" fill="currentColor"/></svg></span></div>
        <div class="start-actions"><button class="primary" id="startGame" type="button"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 5.5v21L27 16Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><span>Play</span></button></div>
      </section>

      <section class="play-panel" id="playPanel" aria-label="Bubble Pop game" hidden>
        <div class="round-top"><p class="eyebrow">Bubble Pop</p><p class="sr-only" id="progressText">Surprise 1 of 5</p></div>
        <div class="progress-dots" id="progressDots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="prompt"><h1 id="promptTitle" tabindex="-1">Pop a bubble</h1><p class="sr-only" id="promptHint" aria-live="polite">A little surprise is waiting.</p></div>
        <div class="play-stage" id="playStage"><span class="scene-bubble scene-bubble-a" aria-hidden="true"></span><span class="scene-bubble scene-bubble-b" aria-hidden="true"></span><button class="bubble" id="revealButton" type="button" aria-label="Pop the bubble"><span class="bubble-surprise" aria-hidden="true"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 2 5 12 13 6-13 5-5 13-6-13L2 20l12-6Z" fill="currentColor"/></svg></span></button><span class="tap-cue" aria-hidden="true"><svg viewBox="0 0 80 94"><g fill="none" stroke="#29b5c2" stroke-width="4" stroke-linecap="round"><path d="M22 13 18 7M12 24 5 23M37 10l2-7"/></g><path d="M28 69 17 49c-4-8 6-12 11-4l4 6V24c0-9 13-9 13 0v20c1-8 13-7 13 1 3-7 14-4 13 5 9-2 13 5 10 15l-4 13c-2 9-9 13-19 13H49c-9 0-15-9-21-22Z" transform="translate(-3 -1)" fill="#fff" stroke="#795c3c" stroke-width="3.5" stroke-linejoin="round"/><path d="M43 45v13M55 47v13M66 53v10" stroke="#eadac5" stroke-width="3" stroke-linecap="round"/></svg></span><div class="word-discovery"><div id="wordPicture" aria-hidden="true"></div><p id="wordLabel"></p></div><span class="reveal-spark reveal-spark-a" aria-hidden="true"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 2 5 12 13 6-13 5-5 13-6-13L2 20l12-6Z" fill="currentColor"/></svg></span><span class="reveal-spark reveal-spark-b" aria-hidden="true"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 2 5 12 13 6-13 5-5 13-6-13L2 20l12-6Z" fill="currentColor"/></svg></span></div>
        <div class="play-controls"><p class="heard-message" id="heardMessage" role="status"></p><div class="turn-buttons"><button class="secondary" id="hearWord" type="button" aria-label="Hear the word again" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12h6l7-6v20l-7-6H4Z" fill="currentColor"/><path d="M22 11q5 5 0 10M26 6q10 10 0 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span class="sr-only">Hear it</span></button><button class="primary" id="nextTurn" type="button" aria-label="Next surprise" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h22M18 7l9 9-9 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr-only">Next</span></button></div></div>
      </section>

      <section class="pause-panel message-panel" id="pausePanel" aria-labelledby="pauseTitle" hidden><div class="rest-art" aria-hidden="true"><img src="/coach/echo/echo-idle.svg" alt=""></div><h1 id="pauseTitle">A little break</h1><button class="primary" id="resumeGame" type="button"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 5.5v21L27 16Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><span>Play</span></button><a class="text-link" href="/activities.html">Back to the play library</a></section>

      <section class="finish-panel message-panel" id="finishPanel" aria-labelledby="finishTitle" hidden><div class="finish-art" aria-hidden="true"><span><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 2 5 12 13 6-13 5-5 13-6-13L2 20l12-6Z" fill="currentColor"/></svg></span><img src="/coach/echo/echo-celebrate.svg" alt=""><span><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 2 5 12 13 6-13 5-5 13-6-13L2 20l12-6Z" fill="currentColor"/></svg></span></div><h1 id="finishTitle" tabindex="-1">You found them all!</h1><p id="finishCopy">That was fun. Let’s play again!</p><button class="primary" id="playAgain" type="button">Play again <span aria-hidden="true">↻</span></button><a class="text-link" href="/activities.html">Choose another game <span aria-hidden="true">→</span></a></section>
    </main>
    
  </div>
  <script src="/sona.js"></script>
  <script src="/simple-play.js"></script>
</body>
</html>
