<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sona" />
  <style>
    :root{
      --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302;
      --red:#ff4b4b; --red-d:#e63a3a; --orange:#ff9600; --orange-d:#e08600;
      --ink:#3c3c3c; --muted:#777; --line:#e5e5e5; --bg:#fff;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
      font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);}
    #app{height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;}

    /* top bar */
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;}
    #close{border:none;background:none;color:#afafaf;font-size:24px;font-weight:800;cursor:pointer;line-height:1;}
    #track{flex:1;height:16px;background:#e5e5e5;border-radius:99px;overflow:hidden;}
    #fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s ease;}
    #coins{display:flex;align-items:center;gap:5px;font-family:"Baloo 2";font-weight:800;color:var(--orange-d);font-size:17px;}

    /* activity area */
    #act{flex:1;overflow-y:auto;padding:14px 18px 8px;display:flex;flex-direction:column;}
    .qtitle{font-family:"Baloo 2";font-weight:800;font-size:22px;margin:6px 0 6px;}
    .qsub{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:8px;}

    /* big audio button */
    .audiorow{display:flex;align-items:center;gap:16px;margin:10px 0 6px;}
    .audiobtn{flex:0 0 auto;width:80px;height:80px;border-radius:20px;border:none;background:var(--blue);
      box-shadow:0 5px 0 0 var(--blue-d);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .05s;}
    .audiobtn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--blue-d);}
    .audiobtn svg{width:38px;height:38px;fill:#fff;}
    .audiobtn.sm{width:56px;height:56px;border-radius:16px;}
    .audiobtn.sm svg{width:26px;height:26px;}
    .wave{flex:1;height:3px;background:repeating-linear-gradient(90deg,#cde9ff 0 6px,transparent 6px 12px);border-radius:2px;}

    /* image choice cards */
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
    .card{aspect-ratio:1/1;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:#fff;
      cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:64px;transition:transform .05s,border-color .12s,background .12s;}
    .card:active{transform:translateY(1px);}
    .card.sel{border-color:var(--blue);background:#ddf4ff;}
    .card.right{border-color:var(--green);background:#d7ffb8;}
    .card.wrong{border-color:var(--red);background:#ffdfe0;}

    /* say-it */
    .saywrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-top:4px;}
    .leobubble{display:flex;align-items:flex-end;gap:10px;}
    .leobubble img{width:74px;height:74px;object-fit:contain;}
    .bub{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;
      font-family:"Baloo 2";font-weight:800;font-size:26px;color:var(--blue-d);}
    .bub:before{content:"";position:absolute;left:-9px;bottom:14px;width:15px;height:15px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);}
    .bigword{font-family:"Baloo 2";font-weight:800;font-size:clamp(44px,16vw,84px);color:var(--blue-d);line-height:1;margin:6px 0;}
    .bigpic{font-size:clamp(72px,26vw,128px);line-height:1;}
    #mouthCue{width:120px;height:116px;margin:2px auto;}
    #mouthCue .mc{width:100%;height:100%;display:block;}
    .cue{color:var(--muted);font-weight:700;font-size:14px;max-width:240px;}
    .mic{width:92px;height:92px;border-radius:50%;border:none;background:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;
      box-shadow:0 6px 0 0 var(--blue-d);margin-top:6px;transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);}
    .mic.rec{background:var(--red);box-shadow:0 6px 0 0 var(--red-d);animation:pulse 1.3s infinite;}
    .mic svg{width:40px;height:40px;fill:#fff;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,75,75,.5),0 6px 0 0 var(--red-d)}70%{box-shadow:0 0 0 20px rgba(255,75,75,0),0 6px 0 0 var(--red-d)}100%{box-shadow:0 0 0 0 rgba(255,75,75,0),0 6px 0 0 var(--red-d)}}
    .skip{background:none;border:none;color:#afafaf;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;margin-top:6px;}

    /* bottom action (check) */
    #action{padding:12px 18px calc(16px + env(safe-area-inset-bottom));}
    .btn{width:100%;border:none;border-radius:16px;padding:15px;font-family:"Baloo 2";font-weight:800;font-size:17px;
      text-transform:uppercase;letter-spacing:.04em;color:#fff;cursor:pointer;transition:transform .05s;}
    .btn.green{background:var(--green);box-shadow:0 5px 0 0 var(--green-d);} .btn.green:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .btn.disabled{background:#e5e5e5;color:#afafaf;box-shadow:none;cursor:default;pointer-events:none;}

    /* feedback sheet */
    #fb{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .25s ease;}
    #fb.show{transform:translateY(0);}
    #fbInner{max-width:560px;margin:0 auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;}
    #fb.good #fbInner{background:#d7ffb8;} #fb.bad #fbInner{background:#ffdfe0;}
    .fbhead{display:flex;align-items:center;gap:12px;}
    .fbicon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;}
    #fb.good .fbicon{background:#58cc02;color:#fff;} #fb.bad .fbicon{background:#ff4b4b;color:#fff;}
    #fbTitle{font-family:"Baloo 2";font-weight:800;font-size:22px;} #fb.good #fbTitle{color:var(--green-d);} #fb.bad #fbTitle{color:var(--red-d);}
    #fbSub{font-weight:700;font-size:14px;margin-top:2px;} #fb.good #fbSub{color:var(--green-d);} #fb.bad #fbSub{color:var(--red-d);}
    #fbBtn{margin-top:14px;}
    #fb.good #fbBtn{background:var(--green);box-shadow:0 5px 0 0 var(--green-d);} #fb.bad #fbBtn{background:var(--red);box-shadow:0 5px 0 0 var(--red-d);}

    /* combo popup */
    #combo{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%) scale(.4);z-index:50;pointer-events:none;opacity:0;
      font-family:"Baloo 2";font-weight:800;font-size:54px;color:var(--orange);text-shadow:0 3px 0 #fff,0 4px 8px rgba(0,0,0,.15);}
    #combo.pop{animation:combopop 1s ease-out;}
    @keyframes combopop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-6deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(1) rotate(-6deg)}}

    /* screens */
    .screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:#fff;}
    .screen.hidden{display:none;}
    .bigorb{width:140px;height:140px;display:flex;align-items:center;justify-content:center;font-size:96px;}
    .bigorb img{width:100%;height:100%;object-fit:contain;}
    .screen h1{font-family:"Baloo 2";font-weight:800;font-size:clamp(26px,5vw,38px);margin-top:14px;}
    .screen p{color:var(--muted);font-weight:700;margin-top:8px;max-width:340px;}
    .cta{margin-top:22px;border:none;border-radius:16px;padding:16px 42px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;text-decoration:none;}
    .cta:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .doneStars{font-size:34px;letter-spacing:6px;color:var(--orange);margin-top:8px;}
    .rewards{display:flex;gap:14px;margin-top:16px;}
    .reward{background:#f7f7f7;border-radius:16px;padding:12px 18px;font-family:"Baloo 2";font-weight:800;font-size:20px;}
    .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
    .againlink{margin-top:14px;background:none;border:none;color:var(--blue-d);font-weight:800;font-size:14px;cursor:pointer;}
    #err{margin-top:14px;max-width:420px;background:#fff0f0;border:1px solid #ffd2d2;border-radius:12px;padding:10px 12px;color:#b42323;font-size:13px;display:none;}
    #err.show{display:block;}
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" title="Close">&#10005;</button>
      <div id="track"><div id="fill"></div></div>
      <div id="coins">🪙 <span id="coinCount">0</span></div>
    </div>
    <div id="act"></div>
    <div id="action"><button id="checkBtn" class="btn disabled">Check</button></div>
  </div>

  <div id="combo"></div>

  <div id="fb">
    <div id="fbInner">
      <div class="fbhead"><div class="fbicon" id="fbIcon">✓</div><div><div id="fbTitle">Nice job!</div><div id="fbSub"></div></div></div>
      <button class="btn green" id="fbBtn">Continue</button>
    </div>
  </div>

  <!-- START -->
  <div id="start" class="screen">
    <div class="bigorb"><img id="startPic" alt="Leo" src="/coach/leo.png" /></div>
    <h1 id="startTitle">Let's practice!</h1>
    <p>Tap below — Leo will say each one, then it's your turn. Allow the mic so he can hear you!</p>
    <button class="cta" id="startBtn">Start</button>
    <div id="err"></div>
  </div>

  <!-- DONE -->
  <div id="done" class="screen hidden">
    <div class="bigorb">🎉</div>
    <h1>Great job!</h1>
    <div class="doneStars" id="doneStars">★★★</div>
    <p id="doneSub">You practiced so well today.</p>
    <div class="rewards">
      <div class="reward" id="xpReward">+0<small>XP</small></div>
      <div class="reward" id="coinReward">+0<small>🪙 coins</small></div>
    </div>
    <a class="cta" id="doneBtn" href="/home.html">Keep going →</a>
    <button class="againlink" id="againBtn">Practice again</button>
  </div>

  <script src="/sona.js"></script>
  <script src="/mouthcue.js"></script>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const profile = (window.Sona ? Sona.getProfile() : { childName:"", focusSounds:[], voiceOn:true, cloudScoring:true, voiceId:"" });
    const CHILD = params.get("name") || profile.childName || "friend";
    const VOICE_ON = profile.voiceOn !== false;
    const CLOUD = profile.cloudScoring !== false;
    let useSpeechAce = false;

    const SOUND_PLAN = {
      R: { isolation:{ display:"R", say:"Let's make a big R sound. Pull your tongue back and turn your voice on — rrrr. Now you try!", scoreText:"rah" },
        syllables:[ {display:"rah",scoreText:"rah"},{display:"ray",scoreText:"ray"},{display:"roo",scoreText:"roo"} ],
        words:[ {display:"rabbit",emoji:"🐰",scoreText:"rabbit"},{display:"rocket",emoji:"🚀",scoreText:"rocket"},{display:"ring",emoji:"💍",scoreText:"ring"} ] },
      S: { isolation:{ display:"S", say:"Let's make a quiet snake sound. Teeth together and smile — ssss. Your turn!", scoreText:"sah" },
        syllables:[ {display:"sah",scoreText:"sah"},{display:"see",scoreText:"see"},{display:"so",scoreText:"so"} ],
        words:[ {display:"sun",emoji:"☀️",scoreText:"sun"},{display:"snake",emoji:"🐍",scoreText:"snake"},{display:"soap",emoji:"🧼",scoreText:"soap"} ] },
      L: { isolation:{ display:"L", say:"Let's make the L sound. Tongue tip up behind your teeth — llll. Now you!", scoreText:"lah" },
        syllables:[ {display:"lah",scoreText:"lah"},{display:"lee",scoreText:"lee"},{display:"low",scoreText:"low"} ],
        words:[ {display:"lion",emoji:"🦁",scoreText:"lion"},{display:"leaf",emoji:"🍃",scoreText:"leaf"},{display:"ball",emoji:"⚽",scoreText:"ball"} ] },
      K: { isolation:{ display:"K", say:"Let's make the K sound. Lift the back of your tongue — k! k! Now you!", scoreText:"kah" },
        syllables:[ {display:"kah",scoreText:"kah"},{display:"key",scoreText:"key"},{display:"ko",scoreText:"ko"} ],
        words:[ {display:"cat",emoji:"🐱",scoreText:"cat"},{display:"key",emoji:"🔑",scoreText:"key"},{display:"cake",emoji:"🍰",scoreText:"cake"} ] },
    };
    const CUE = { R:"Tongue back, voice on — rrr", S:"Teeth together, smile — sss", L:"Tongue tip up — lll", K:"Back of tongue up — k!" };
    const EXTRA = ["🐶","🐟","⭐","🍎","🚗","🎩","📖","🌳","🦆","🚌","🥛","👟","🥁","🪁","🐸","🐻","🌙","🥚","🍌","🐝"];

    const focus = (profile.focusSounds || []);
    const TARGET = (params.get("sound") || focus[0] || "R").toUpperCase();
    const SOUND = SOUND_PLAN[TARGET] ? TARGET : "R";
    const PLAN = SOUND_PLAN[SOUND];
    let STAGE = params.has("stage") ? parseInt(params.get("stage"),10) : (window.Sona ? Sona.stageOf(SOUND) : 0);
    if (isNaN(STAGE) || STAGE < 0) STAGE = 0;
    if (STAGE > 2) STAGE = 2;

    const BUDDY = (window.Sona ? Sona.characterById(profile.character) : { img:"/coach/leo.png", emoji:"🦁" });
    const ISO_AGAIN = ["Again — say it!","One more big "+SOUND+"!","Nice — again!","Keep going!","One more time!","Last one!"];
    const PRAISE = ["Nice job!","Great!","Awesome!","Perfect!","You got it!","Woohoo!"];
    const TRYAGAIN = ["Good try!","Almost!","Keep going!","Nice effort!"];

    const $ = (id)=>document.getElementById(id);
    const pick = (a)=>a[Math.floor(Math.random()*a.length)];
    const shuffle = (a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};

    function otherWords(){ const o=[]; Object.keys(SOUND_PLAN).forEach(k=>{ if(k!==SOUND) SOUND_PLAN[k].words.forEach(w=>o.push(w.emoji)); }); return o; }
    function distractors(exclude, n){
      const pool = shuffle(PLAN.words.map(w=>w.emoji).concat(otherWords()).concat(EXTRA).filter(e=>e!==exclude));
      const out=[]; for(const e of pool){ if(out.indexOf(e)===-1){ out.push(e); if(out.length>=n) break; } } return out;
    }

    function buildQueue(stage){
      let q=[];
      if(stage===0){
        for(let k=0;k<5;k++) q.push({type:"say",text:PLAN.isolation.scoreText,label:PLAN.isolation.display,level:"isolation",mode:"phoneme",isLetter:true,say:k===0?PLAN.isolation.say:pick(ISO_AGAIN)});
        q.push({type:"findSound"});
        return q;
      }
      if(stage===1){
        PLAN.syllables.forEach(s=>q.push({type:"say",text:s.scoreText,label:s.display,level:"syllable",mode:"phoneme",isLetter:true}));
        PLAN.syllables.forEach(s=>q.push({type:"say",text:s.scoreText,label:s.display,level:"syllable",mode:"phoneme",isLetter:true}));
        q.push({type:"findSound"});
        return shuffle(q).slice(0,7);
      }
      PLAN.words.forEach(w=>q.push({type:"say",text:w.scoreText,label:w.display,emoji:w.emoji,level:"word",mode:"full"}));
      q.push({type:"pick"}); q.push({type:"pick"}); q.push({type:"findSound"});
      return shuffle(q).slice(0,8);
    }
    const QUEUE = buildQueue(STAGE);

    /* ---- audio ---- */
    let audioCtx=null;
    function getCtx(){ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; audioCtx=new AC(); } if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
    function playPCM(bytes){ return new Promise((res)=>{ try{ const ctx=getCtx(); const n=bytes.byteLength>>1; const ab=ctx.createBuffer(1,n,24000); const ch=ab.getChannelData(0); const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); for(let i=0;i<n;i++) ch[i]=dv.getInt16(i*2,true)/32768; const s=ctx.createBufferSource(); s.buffer=ab; s.connect(ctx.destination); s.onended=res; s.start(); }catch(e){ res(); } }); }
    let speaking=false;
    async function say(text){ if(!text||!VOICE_ON) return; if(speaking) return; speaking=true;
      try{ const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,voice:profile.voiceId||""})}); if(r.ok) await playPCM(new Uint8Array(await r.arrayBuffer())); }catch(e){} finally{ speaking=false; } }

    /* ---- mic + scoring ---- */
    let micStream=null;
    async function detectScorer(){ if(!CLOUD){ useSpeechAce=false; return; } try{ const r=await fetch("/api/score"); const j=await r.json(); useSpeechAce=!!(j&&j.hasKey); }catch{ useSpeechAce=false; } }
    function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
    function matchText(t,w){ t=norm(t); w=norm(w); if(!t) return false; if(t.includes(w)||w.includes(t)) return true; let i=0; while(i<Math.min(t.length,w.length)&&t[i]===w[i]) i++; return i>=3; }
    function recordTurn(micBtn,maxMs=6000){
      return new Promise((resolve)=>{
        let done=false,chunks=[],rec=null,sr=null,transcript="";
        const finish=()=>{ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch{} try{sr&&sr.stop();}catch{} micBtn.classList.remove("rec"); setTimeout(()=>{ const blob=chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null; resolve({transcript,blob}); },150); };
        try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; rec.start(); } }catch(e){}
        try{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=(ev)=>{ for(const r of ev.results){ for(let i=0;i<r.length;i++) transcript+=" "+r[i].transcript; } finish(); }; sr.onerror=()=>{}; sr.start(); } }catch(e){}
        micBtn.classList.add("rec"); micBtn.onclick=finish; setTimeout(finish,maxMs);
      });
    }
    async function scoreSay(a,blob,transcript){
      if(useSpeechAce && blob){ try{ const fd=new FormData(); fd.append("audio",new File([blob],"a.webm",{type:blob.type||"audio/webm"})); fd.append("text",a.text); fd.append("targetSound",SOUND); fd.append("userId",CHILD||"child"); fd.append("mode",a.mode||"full"); const r=await fetch("/api/score",{method:"POST",body:fd}); const j=await r.json(); if(j&&j.ok) return j.rating!=="tryAgain"; }catch(e){} }
      return matchText(transcript,a.text);
    }

    /* ---- engine ---- */
    let i=0, combo=0, xp=0, coins=0; const results=[];
    const act=$("act"), checkBtn=$("checkBtn"), fb=$("fb");
    function setProgress(){ $("fill").style.width = Math.round(i/QUEUE.length*100)+"%"; }
    function setCoins(){ $("coinCount").textContent = coins; }
    function audioSVG(){ return '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.6 7-8.8s-3-7.8-7-8.8z"/></svg>'; }
    function micSVG(){ return '<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'; }

    function showCombo(n){ const c=$("combo"); c.textContent="COMBO x"+n; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
    function hideCheck(){ checkBtn.classList.add("disabled"); checkBtn.onclick=null; }

    function answer(ok, sub){
      results.push({ word: (QUEUE[i].label||SOUND), sound: SOUND, level:(QUEUE[i].level||"word"), ok });
      if(ok){ combo++; const bonus=combo>=3?1:0; xp+=10; coins+=2+bonus; if(window.Sona){Sona.sfx.correct(); Sona.pop("+"+(2+bonus)+" 🪙",{color:"#ff9600",y:window.innerHeight*0.28});} if(combo>=2) showCombo(combo); }
      else { combo=0; if(window.Sona) Sona.sfx.wrong(); }
      setCoins();
      fb.className = ok?"show good":"show bad";
      $("fbIcon").textContent = ok?"✓":"✕";
      $("fbTitle").textContent = ok?pick(PRAISE):pick(TRYAGAIN);
      $("fbSub").textContent = sub||"";
      $("fbBtn").onclick = ()=>{ fb.className=""; i++; setProgress(); next(); };
    }

    function next(){ if(i>=QUEUE.length){ finish(); return; } render(QUEUE[i]); }

    function render(a){
      act.innerHTML=""; hideCheck(); fb.className="";
      if(a.type==="say") return renderSay(a);
      if(a.type==="pick") return renderPick(a);
      if(a.type==="findSound") return renderFind(a);
    }

    /* SAY IT */
    function renderSay(a){
      const wrap=document.createElement("div"); wrap.className="saywrap";
      const showPic = a.level==="word" && a.emoji;
      wrap.innerHTML =
        '<div class="leobubble"><img src="'+(BUDDY.img||"/coach/leo.png")+'" alt="Leo"/><div class="bub">'+a.label+'</div></div>'+
        (showPic ? '<div class="bigpic">'+a.emoji+'</div>' : '<div class="bigword">'+a.label+'</div>')+
        (a.isLetter && window.Mouth ? '<div id="mouthCue">'+Mouth.svg(SOUND)+'</div>' : '')+
        '<div class="cue">'+(window.Mouth?Mouth.hint(SOUND):(CUE[SOUND]||""))+'</div>'+
        '<button class="audiobtn sm" id="replay" title="Hear it">'+audioSVG()+'</button>'+
        '<button class="mic" id="micBtn" title="Say it">'+micSVG()+'</button>'+
        '<button class="skip" id="skipBtn">Can’t say it now</button>';
      act.appendChild(wrap);
      $("replay").onclick=()=>say(a.text);
      $("skipBtn").onclick=()=>answer(true,"Skipped — that’s okay!");
      $("micBtn").onclick=async()=>{ if(speaking) return; const mb=$("micBtn"); mb.onclick=null;
        const res=await recordTurn(mb); const ok=await scoreSay(a,res.blob,res.transcript); answer(ok, ok?("You said “"+a.label+"”"):("Try “"+a.label+"” again")); };
      setTimeout(()=>say(a.text), 250);
    }

    /* PICK THE PICTURE (hear word -> tap emoji) */
    function renderPick(a){
      const w=pick(PLAN.words);
      const opts=shuffle([{e:w.emoji,ok:true}].concat(distractors(w.emoji,3).map(e=>({e,ok:false}))));
      const head=document.createElement("div");
      head.innerHTML='<div class="qtitle">Tap what you hear</div><div class="audiorow"><button class="audiobtn" id="play">'+audioSVG()+'</button><div class="wave"></div></div>';
      act.appendChild(head);
      const grid=document.createElement("div"); grid.className="cards";
      let sel=null;
      opts.forEach(o=>{ const c=document.createElement("div"); c.className="card"; c.textContent=o.e; c.onclick=()=>{ if(window.Sona)Sona.sfx.tap(); grid.querySelectorAll(".card").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); sel=o; armCheck(); }; grid.appendChild(c); });
      act.appendChild(grid);
      $("play").onclick=()=>say(w.scoreText);
      function armCheck(){ checkBtn.classList.remove("disabled"); checkBtn.onclick=()=>{ hideCheck(); const cards=[...grid.children]; cards.forEach((c,k)=>{ if(opts[k].ok)c.classList.add("right"); }); if(!sel.ok){ const idx=opts.indexOf(sel); cards[idx].classList.add("wrong"); } answer(!!sel.ok, sel.ok?("That’s "+w.display+"!"):("It was "+w.display)); }; }
      setTimeout(()=>say(w.scoreText), 250);
    }

    /* FIND THE SOUND (tap all pictures with the target sound) */
    function renderFind(a){
      const tgs=shuffle(PLAN.words).slice(0,2).map(w=>({e:w.emoji,ok:true}));
      const others=shuffle(otherWords()).slice(0,2).map(e=>({e,ok:false}));
      const opts=shuffle(tgs.concat(others));
      const head=document.createElement("div");
      head.innerHTML='<div class="qtitle">Tap the '+SOUND+' pictures</div><div class="qsub">Pick every picture that starts with the '+SOUND+' sound.</div><div class="audiorow"><button class="audiobtn sm" id="play">'+audioSVG()+'</button><div class="wave"></div></div>';
      act.appendChild(head);
      const grid=document.createElement("div"); grid.className="cards";
      const chosen=new Set();
      opts.forEach((o,k)=>{ const c=document.createElement("div"); c.className="card"; c.textContent=o.e; c.onclick=()=>{ if(window.Sona)Sona.sfx.tap(); if(chosen.has(k)){chosen.delete(k);c.classList.remove("sel");}else{chosen.add(k);c.classList.add("sel");} const has=chosen.size>0; checkBtn.classList.toggle("disabled",!has); checkBtn.onclick=has?doCheck:null; }; grid.appendChild(c); });
      act.appendChild(grid);
      $("play").onclick=()=>say(PLAN.isolation.scoreText);
      function doCheck(){ hideCheck(); const cards=[...grid.children]; let allRight=true; opts.forEach((o,k)=>{ if(o.ok){ cards[k].classList.add("right"); if(!chosen.has(k)) allRight=false; } else if(chosen.has(k)){ cards[k].classList.add("wrong"); allRight=false; } }); answer(allRight, allRight?"You found them all!":("Those are the "+SOUND+" sounds")); }
      setTimeout(()=>say(PLAN.isolation.scoreText), 250);
    }

    /* ---- finish ---- */
    function finish(){
      const correct=results.filter(r=>r.ok).length;
      const stars=Math.max(1,Math.min(3,Math.round(correct/Math.max(1,results.length)*3)));
      const passed=correct>=Math.ceil(results.length*0.5);
      coins+=10; setCoins();
      if(window.Sona){ Sona.recordSession({words:results}); Sona.completeStage(SOUND,STAGE,passed); Sona.addCoins(coins); }
      $("doneStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);
      const NEXT=["the letter","syllables","words"];
      $("doneSub").textContent = passed&&STAGE<2 ? ("Next up: "+NEXT[STAGE+1]+"! 🎉") : passed ? ("You finished the "+SOUND+" sound! 🏆") : ("Let’s practice this one again. 💪");
      $("xpReward").innerHTML="+"+xp+"<small>XP</small>";
      $("coinReward").innerHTML="+"+coins+"<small>🪙 coins</small>";
      $("done").classList.remove("hidden");
      if(window.Sona){ Sona.confetti(); Sona.sfx.complete(); setTimeout(()=>Sona.sfx.star(),500); }
      try{ micStream&&micStream.getTracks().forEach(t=>t.stop()); }catch{}
    }

    /* ---- start ---- */
    async function start(){
      $("startBtn").disabled=true; $("err").classList.remove("show");
      getCtx();
      try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      $("start").classList.add("hidden");
      try{ await detectScorer(); }catch(e){}
      setProgress(); setCoins(); next();
    }
    function leave(){ try{ micStream&&micStream.getTracks().forEach(t=>t.stop()); }catch{} location.href="/home.html"; }

    const TITLES=["Warm up the "+SOUND+" sound!", SOUND+" syllables!", SOUND+" words!"];
    $("startTitle").textContent=TITLES[STAGE]||("Practice "+SOUND+"!");
    if(BUDDY.img){ $("startPic").src=BUDDY.img; }
    $("startBtn").onclick=start;
    $("close").onclick=leave;
    $("doneBtn").onclick=(e)=>{ e.preventDefault(); leave(); };
    $("againBtn").onclick=()=>{ location.href="/lesson.html?sound="+encodeURIComponent(SOUND)+"&stage="+STAGE+(CHILD?("&name="+encodeURIComponent(CHILD)):""); };
    window.addEventListener("pagehide",()=>{ try{ micStream&&micStream.getTracks().forEach(t=>t.stop()); }catch{} });
    console.log("lesson ready ·",SOUND,"stage",STAGE,"·",QUEUE.length,"activities");
  </script>
</body>
