<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sona" />
  <style>
    :root{
      --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302;
      --red:#ff4b4b; --red-d:#e63a3a; --orange:#ff9600; --orange-d:#e08600;
      --ink:#3c3c3c; --muted:#777; --line:#e5e5e5; --bg:#fff;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
      font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);}
    #app{height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;}

    /* top bar */
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;}
    #close{border:none;background:none;color:#afafaf;font-size:24px;font-weight:800;cursor:pointer;line-height:1;}
    #track{flex:1;height:16px;background:#e5e5e5;border-radius:99px;overflow:hidden;}
    #fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s ease;}
    #coins{display:flex;align-items:center;gap:5px;font-family:"Baloo 2";font-weight:800;color:var(--orange-d);font-size:17px;}

    /* activity area */
    #act{flex:1;overflow-y:auto;padding:14px 18px 8px;display:flex;flex-direction:column;}
    .qtitle{font-family:"Baloo 2";font-weight:800;font-size:22px;margin:6px 0 6px;}
    .qsub{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:8px;}

    /* big audio button */
    .audiorow{display:flex;align-items:center;gap:16px;margin:10px 0 6px;}
    .audiobtn{flex:0 0 auto;width:80px;height:80px;border-radius:20px;border:none;background:var(--blue);
      box-shadow:0 5px 0 0 var(--blue-d);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .05s;}
    .audiobtn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--blue-d);}
    .audiobtn svg{width:38px;height:38px;fill:#fff;}
    .audiobtn.sm{width:56px;height:56px;border-radius:16px;}
    .audiobtn.sm svg{width:26px;height:26px;}
    .wave{flex:1;height:3px;background:repeating-linear-gradient(90deg,#cde9ff 0 6px,transparent 6px 12px);border-radius:2px;}

    /* image choice cards */
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
    .card{aspect-ratio:1/1;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:#fff;
      cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:64px;transition:transform .05s,border-color .12s,background .12s;}
    .card:active{transform:translateY(1px);}
    .card.sel{border-color:var(--blue);background:#ddf4ff;}
    .card.right{border-color:var(--blue);background:#ddf4ff;}
    .card.wrong{border-color:#d7dee8;background:#f3f6fa;opacity:.85;}

    /* say-it */
    .saywrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-top:4px;}
    .leobubble{display:flex;align-items:flex-end;gap:10px;}
    .leobubble img{width:74px;height:74px;object-fit:contain;}
    .leobubble img.hop{animation:leohop .55s ease;}
    .leobubble img.cheer{animation:leocheer .7s ease;}
    @keyframes leohop{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px) rotate(-4deg)}65%{transform:translateY(-4px) rotate(3deg)}}
    @keyframes leocheer{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.06)}60%{transform:rotate(5deg) scale(1.04)}}
    .bub{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;
      font-family:"Baloo 2";font-weight:800;font-size:26px;color:var(--blue-d);}
    .bub:before{content:"";position:absolute;left:-9px;bottom:14px;width:15px;height:15px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);}
    .bigword{font-family:"Baloo 2";font-weight:800;font-size:clamp(44px,16vw,84px);color:var(--blue-d);line-height:1;margin:6px 0;}
    .bigpic{font-size:clamp(72px,26vw,128px);line-height:1;}
    .mouthImg{width:132px;height:auto;border-radius:18px;margin:2px auto;display:block;}
    .cue{color:var(--muted);font-weight:700;font-size:14px;max-width:240px;}
    .mic{width:92px;height:92px;border-radius:50%;border:none;background:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;
      box-shadow:0 6px 0 0 var(--blue-d);margin-top:6px;transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);}
    .mic.rec{background:var(--blue);box-shadow:0 6px 0 0 var(--blue-d);animation:pulse 1.6s infinite;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:40px;}
    .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    .micstate{margin-top:8px;font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--blue-d);min-height:20px;}
    .mic svg{width:40px;height:40px;fill:#fff;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 18px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}
    .skip{background:none;border:none;color:#afafaf;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;margin-top:6px;}

    /* bottom action (check) */
    #action{padding:12px 18px calc(16px + env(safe-area-inset-bottom));}
    .btn{width:100%;border:none;border-radius:16px;padding:15px;font-family:"Baloo 2";font-weight:800;font-size:17px;
      text-transform:uppercase;letter-spacing:.04em;color:#fff;cursor:pointer;transition:transform .05s;}
    .btn.green{background:var(--green);box-shadow:0 5px 0 0 var(--green-d);} .btn.green:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .btn.disabled{background:#e5e5e5;color:#afafaf;box-shadow:none;cursor:default;pointer-events:none;}
    /* armed Check = unmistakably pressable */
    #checkBtn{background:var(--blue);box-shadow:0 5px 0 0 var(--blue-d);}
    #checkBtn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--blue-d);}
    #checkBtn.disabled{background:#e5e5e5;color:#afafaf;box-shadow:none;}

    /* feedback sheet */
    #fb{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .25s ease;}
    #fb.show{transform:translateY(0);}
    #fbInner{max-width:560px;margin:0 auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;}
    #fbInner{background:#ddf4ff;}
    .fbhead{display:flex;align-items:center;gap:12px;}
    .fbicon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;}
    .fbicon{background:var(--blue);color:#fff;}
    #fbTitle{font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--blue-d);}
    #fbSub{font-weight:700;font-size:14px;margin-top:2px;color:var(--blue-d);}
    #fbBtn{margin-top:14px;}
    #fbBtn{background:var(--blue);box-shadow:0 5px 0 0 var(--blue-d);}

    /* combo popup */
    #combo{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%) scale(.4);z-index:50;pointer-events:none;opacity:0;
      font-family:"Baloo 2";font-weight:800;font-size:54px;color:var(--orange);text-shadow:0 3px 0 #fff,0 4px 8px rgba(0,0,0,.15);}
    #combo.pop{animation:combopop 1s ease-out;}
    @keyframes combopop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-6deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(1) rotate(-6deg)}}

    /* screens */
    .screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:#fff;}
    .screen.hidden{display:none;}
    .bigorb{width:140px;height:140px;display:flex;align-items:center;justify-content:center;font-size:96px;}
    .bigorb img{width:100%;height:100%;object-fit:contain;}
    .screen h1{font-family:"Baloo 2";font-weight:800;font-size:clamp(26px,5vw,38px);margin-top:14px;}
    .screen p{color:var(--muted);font-weight:700;margin-top:8px;max-width:340px;}
    .cta{margin-top:22px;border:none;border-radius:16px;padding:16px 42px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;text-decoration:none;}
    .cta:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .doneStars{font-size:34px;letter-spacing:6px;color:var(--orange);margin-top:8px;}
    .rewards{display:flex;gap:14px;margin-top:16px;}
    .reward{background:#f7f7f7;border-radius:16px;padding:12px 18px;font-family:"Baloo 2";font-weight:800;font-size:20px;}
    .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
    .againlink{margin-top:14px;background:none;border:none;color:var(--blue-d);font-weight:800;font-size:14px;cursor:pointer;}
    #err{margin-top:14px;max-width:420px;background:#fff0f0;border:1px solid #ffd2d2;border-radius:12px;padding:10px 12px;color:#b42323;font-size:13px;display:none;}
    #err.show{display:block;}
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" title="Close">&#10005;</button>
      <div id="track"><div id="fill"></div></div>

    </div>
    <div id="act"></div>
    <div id="action"><button id="checkBtn" class="btn disabled">Check</button></div>
  </div>

  <div id="combo"></div>

  <div id="fb">
    <div id="fbInner">
      <div class="fbhead"><div class="fbicon" id="fbIcon">✓</div><div><div id="fbTitle">Nice job!</div><div id="fbSub"></div></div></div>
      <button class="btn green" id="fbBtn">Continue</button>
    </div>
  </div>

  <!-- START -->
  <div id="start" class="screen">
    <div class="bigorb"><img id="startPic" alt="Leo" src="/coach/leo.png" /></div>
    <h1 id="startTitle">Let's practice!</h1>
    <div id="themeTag" style="margin-top:10px;font-family:'Baloo 2';font-weight:800;font-size:14px;color:#e08600;background:#fff3df;border-radius:99px;padding:7px 16px;">⭐ Practice Day</div>
    <button class="cta" id="startBtn">Start</button>
    <div id="err"></div>
  </div>

  <!-- DONE -->
  <div id="done" class="screen hidden">
    <div class="bigorb">🎉</div>
    <h1>Great job!</h1>
    <div class="doneStars" id="doneStars">★★★</div>
    <p id="doneSub">You practiced so well today.</p>
    <div class="rewards">
      <div class="reward" id="xpReward">+0<small>XP</small></div>

    </div>
    <a class="cta" id="doneBtn" href="/home.html">Keep going →</a>
    <button class="againlink" id="againBtn">Practice again</button>
  </div>

  <script src="/sona.js"></script>
  <script src="/mouthcue.js"></script>
  <script type="module">
    const params = new URLSearchParams(location.search);
    if (window.Sona && Sona.gated && Sona.gated()) location.replace("/trial.html");
    const profile = (window.Sona ? Sona.getProfile() : { childName:"", focusSounds:[], voiceOn:true, cloudScoring:true, voiceId:"" });
    const CHILD = params.get("name") || profile.childName || "friend";
    const VOICE_ON = profile.voiceOn !== false;
    const CLOUD = profile.cloudScoring !== false;
    let useSpeechAce = false;

    const SOUND_PLAN = {
      R: { isolation:{ display:"R", say:"Let's make a big R sound. Pull your tongue back and turn your voice on — rrrr. Now you try.", scoreText:"rah" },
        syllables:[ {display:"rah",scoreText:"rah"},{display:"ray",scoreText:"ray"},{display:"roo",scoreText:"roo"} ],
        words:[ {display:"rabbit",emoji:"🐰",scoreText:"rabbit"},{display:"rocket",emoji:"🚀",scoreText:"rocket"},{display:"ring",emoji:"💍",scoreText:"ring"} ] },
      S: { isolation:{ display:"S", say:"Let's make a quiet snake sound. Teeth together and smile — ssss. Your turn.", scoreText:"sah" },
        syllables:[ {display:"sah",scoreText:"sah"},{display:"see",scoreText:"see"},{display:"so",scoreText:"so"} ],
        words:[ {display:"sun",emoji:"☀️",scoreText:"sun"},{display:"snake",emoji:"🐍",scoreText:"snake"},{display:"soap",emoji:"🧼",scoreText:"soap"} ] },
      L: { isolation:{ display:"L", say:"Let's make the L sound. Tongue tip up behind your teeth — llll. Now you.", scoreText:"lah" },
        syllables:[ {display:"lah",scoreText:"lah"},{display:"lee",scoreText:"lee"},{display:"low",scoreText:"low"} ],
        words:[ {display:"lion",emoji:"🦁",scoreText:"lion"},{display:"leaf",emoji:"🍃",scoreText:"leaf"},{display:"ball",emoji:"⚽",scoreText:"ball"} ] },
      G: { isolation:{ display:"G", say:"Let's make the G sound. Lift the back of your tongue and turn your voice on — g! g! Now you.", scoreText:"gah" },
        syllables:[ {display:"gah",scoreText:"gah"},{display:"go",scoreText:"go"},{display:"gee",scoreText:"gee"} ],
        words:[ {display:"goat",emoji:"🐐",scoreText:"goat"},{display:"gift",emoji:"🎁",scoreText:"gift"},{display:"dog",emoji:"🐶",scoreText:"dog"} ] },
      F: { isolation:{ display:"F", say:"Let's make the F sound. Gently rest your top teeth on your bottom lip and blow — fff. Your turn.", scoreText:"fah" },
        syllables:[ {display:"fah",scoreText:"fah"},{display:"fee",scoreText:"fee"},{display:"foe",scoreText:"foe"} ],
        words:[ {display:"fish",emoji:"🐟",scoreText:"fish"},{display:"fox",emoji:"🦊",scoreText:"fox"},{display:"leaf",emoji:"🍂",scoreText:"leaf"} ] },
      SH: { isolation:{ display:"SH", say:"Let's make the quiet sound. Round your lips and blow soft air — shhh. Now you.", scoreText:"shah" },
        syllables:[ {display:"shah",scoreText:"shah"},{display:"she",scoreText:"she"},{display:"show",scoreText:"show"} ],
        words:[ {display:"shoe",emoji:"👟",scoreText:"shoe"},{display:"shark",emoji:"🦈",scoreText:"shark"},{display:"fish",emoji:"🐠",scoreText:"fish"} ] },
      CH: { isolation:{ display:"CH", say:"Let's make the choo-choo sound. Round your lips and pop — ch! ch! Your turn.", scoreText:"chah" },
        syllables:[ {display:"chah",scoreText:"chah"},{display:"chee",scoreText:"chee"},{display:"choo",scoreText:"choo"} ],
        words:[ {display:"cheese",emoji:"🧀",scoreText:"cheese"},{display:"chair",emoji:"🪑",scoreText:"chair"},{display:"peach",emoji:"🍑",scoreText:"peach"} ] },
      TH: { isolation:{ display:"TH", say:"Let's make the TH sound. Peek your tongue between your teeth and blow — th, th. Now you.", scoreText:"thah" },
        syllables:[ {display:"thah",scoreText:"thah"},{display:"thee",scoreText:"thee"},{display:"thaw",scoreText:"thaw"} ],
        words:[ {display:"thumb",emoji:"👍",scoreText:"thumb"},{display:"bath",emoji:"🛁",scoreText:"bath"},{display:"tooth",emoji:"🦷",scoreText:"tooth"} ] },
      K: { isolation:{ display:"K", say:"Let's make the K sound. Lift the back of your tongue — k! k! Now you.", scoreText:"kah" },
        syllables:[ {display:"kah",scoreText:"kah"},{display:"key",scoreText:"key"},{display:"ko",scoreText:"ko"} ],
        words:[ {display:"cat",emoji:"🐱",scoreText:"cat"},{display:"key",emoji:"🔑",scoreText:"key"},{display:"cake",emoji:"🍰",scoreText:"cake"} ] },
    };
    const CUE = { R:"Tongue back, voice on — rrr", S:"Teeth together, smile — sss", L:"Tongue tip up — lll", K:"Back of tongue up — k!" };
    const EXTRA = ["🐶","🐟","⭐","🍎","🚗","🎩","📖","🌳","🦆","🚌","🥛","👟","🥁","🪁","🐸","🐻","🌙","🥚","🍌","🐝"];

    const focus = (profile.focusSounds || []);
    const TARGET = (params.get("sound") || focus[0] || "R").toUpperCase();
    const SOUND = SOUND_PLAN[TARGET] ? TARGET : "R";
    const PLAN = SOUND_PLAN[SOUND];
    let STAGE = params.has("stage") ? parseInt(params.get("stage"),10) : (window.Sona && Sona.rungOf ? Sona.rungOf(SOUND) : 0);
    if (isNaN(STAGE) || STAGE < 0) STAGE = 0;
    if (STAGE > 5) STAGE = 5;   // 6 SLP rungs (isolation..conversation); conversation runs as sentences in this say-queue
    // daily mode: one time-budgeted session across every focus sound
    const DAILY = params.get("daily") === "1";
    const RETRY = params.get("retry") === "1";
    const MINUTES = Math.max(3, parseInt(profile.dailyMinutes, 10) || 5);

    // daily variety: a fresh pick from the sound's word pool + theme of the day
    const POOL = (window.Sona && Sona.WORDS && Sona.WORDS[SOUND]) ? Sona.WORDS[SOUND] : PLAN.words.map(w=>({w:w.display,e:w.emoji}));
    const DAYWORDS = (window.Sona && Sona.dailyPick) ? Sona.dailyPick(POOL, 4, SOUND.charCodeAt(0)) : POOL.slice(0,4);
    const THEME = (window.Sona && Sona.dayTheme) ? Sona.dayTheme() : { e:"⭐", n:"Practice Day" };
    const planOf = (s)=> SOUND_PLAN[s] || SOUND_PLAN.R;
    const poolOf = (s)=> (window.Sona && Sona.WORDS && Sona.WORDS[s]) ? Sona.WORDS[s] : POOL;
    const BUDDY = (window.Sona ? Sona.characterById(profile.character) : { img:"/coach/leo.png", emoji:"🦁" });
    const ISO_AGAIN = (s)=>["Again — say it.","One more big "+s+".","Nice. Again.","Keep going.","One more time.","Last one."];
    const PRAISE = ["Nice job!","Great!","Awesome!","Perfect!","You got it!","Woohoo!"];
    const TRYAGAIN = ["Good try!","Almost!","Keep going!","Nice effort!"];

    const $ = (id)=>document.getElementById(id);
    const pick = (a)=>a[Math.floor(Math.random()*a.length)];
    const shuffle = (a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};

    function otherWords(s){ const o=[]; const W=(window.Sona&&Sona.WORDS)||{}; Object.keys(W).forEach(k=>{ if(k!==s) W[k].forEach(w=>o.push(w.e)); }); return o.length?o:EXTRA; }
    function distractors(exclude, n, s){
      const pool = shuffle(poolOf(s).map(w=>w.e).concat(otherWords(s)).concat(EXTRA).filter(e=>e!==exclude));
      const out=[]; for(const e of pool){ if(out.indexOf(e)===-1){ out.push(e); if(out.length>=n) break; } } return out;
    }

    // generate n activities for one sound at one stage (cycles material, so it
    // can stretch to fill any time budget)
    // Build n activities for one sound at its CURRENT SLP rung, sourced from the
    // shared ladder engine (isolation→syllable→word→phrase→sentence). Picture
    // mini-games (pick/findSound) only make sense at the word rung.
    function genFor(s, rung, n){
      rung = Math.max(0, Math.min(5, rung||0));
      let items = (window.Sona&&Sona.ladderContent)?Sona.ladderContent(s,rung):[];
      if(rung>=5 && (!items.length || (items[0]&&items[0].q))){ rung=4; items=(window.Sona&&Sona.ladderContent)?Sona.ladderContent(s,4):[]; } // conversation → sentences here
      if(!items.length){ items=(poolOf(s)||[]).map(w=>({t:w.w,say:w.w,display:w.w,e:w.e,word:w.w,level:"word",mode:"full"})); }
      STAGE_USED[s]=rung;
      let seq=(window.Sona&&Sona.dailyPick)?Sona.dailyPick(items, Math.min(items.length,8), s.charCodeAt(0)):items.slice(0,8);
      if(!seq.length) seq=items.slice();
      const wordRung=(rung===2);
      const q=[]; let wi=0, k=0;
      while(q.length<n){
        if(wordRung && k%4===1) q.push({type:"pick",snd:s});
        else if(wordRung && k%4===3) q.push({type:"findSound",snd:s});
        else {
          const it=seq[wi++ % seq.length];
          const sayText=(it.level==="isolation" && window.Sona && Sona.repeatCue)?Sona.repeatCue(s):(it.say||it.t);
          q.push({type:"say",snd:s,text:it.t,label:(it.display||it.t),emoji:it.e,level:it.level,mode:it.mode,say:sayText,isLetter:(it.level==="isolation"||it.level==="syllable")});
        }
        k++;
      }
      return q;
    }
    // assemble: a focused stage session, or the daily mix — same total length
    // whether the child works on one sound or five (expand vs split)
    const STAGE_USED = {};
    let QUEUE;
    const MISSED = (RETRY && window.Sona && Sona.getMissed) ? Sona.getMissed() : [];
    if (RETRY && MISSED.length) {
      // fix-it round: replay the words they missed, mixed with games
      QUEUE = [];
      MISSED.slice(0, 8).forEach(function (m, k) {
        const pool = (window.Sona && Sona.WORDS && Sona.WORDS[m.sound]) || [];
        const hit = pool.filter(function (w) { return w.w === m.w; })[0];
        QUEUE.push({ type: "say", snd: m.sound, text: m.w, label: m.w, emoji: (hit && hit.e) || "⭐", level: "word", mode: "full" });
        if (k % 3 === 1) QUEUE.push({ type: "pick", snd: m.sound });
      });
      QUEUE.push({ type: "findSound", snd: MISSED[0].sound });
    } else if (DAILY || RETRY) {
      const targets = ((profile.focusSounds&&profile.focusSounds.length)?profile.focusSounds:[SOUND]).filter(s=>SOUND_PLAN[s]);
      const list = targets.length?targets:[SOUND];
      const total = Math.max(8, Math.round(MINUTES*60/24)); // ≈24s per activity
      const base = Math.floor(total/list.length), extra = total%list.length;
      QUEUE = [];
      list.forEach((s,ix)=>{ const st=(window.Sona&&Sona.rungOf)?Sona.rungOf(s):0; QUEUE=QUEUE.concat(genFor(s,st, base+(ix<extra?1:0))); }); // genFor records STAGE_USED[s]
      let prev=null;
      QUEUE.forEach((a2,k2)=>{ if(a2.snd!==prev){ if(k2>0) a2.intro="Now the "+a2.snd+" sound!"; prev=a2.snd; } });
    } else {
      QUEUE = genFor(SOUND, STAGE, [6,7,8][STAGE]||8); // genFor records STAGE_USED[SOUND]
    }


    /* ---- audio ---- */
    let audioCtx=null;
    function getCtx(){ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; audioCtx=new AC(); } if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
    function playPCM(bytes){ return new Promise((res)=>{ try{ const ctx=getCtx(); const n=bytes.byteLength>>1; const ab=ctx.createBuffer(1,n,24000); const ch=ab.getChannelData(0); const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); for(let i=0;i<n;i++) ch[i]=dv.getInt16(i*2,true)/32768; const s=ctx.createBufferSource(); s.buffer=ab; s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1; const g=ctx.createGain(); g.gain.value=(profile.volume!=null?profile.volume:0.8); s.connect(g); g.connect(ctx.destination); s.onended=res; s.start(); }catch(e){ res(); } }); }
    let speaking=false;
    async function say(text){ if(!text||!VOICE_ON) return; if(speaking) return; speaking=true;
      try{ const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,voice:profile.voiceId||""})}); if(r.ok) await playPCM(new Uint8Array(await r.arrayBuffer())); }catch(e){} finally{ speaking=false; } }

    /* ---- mic + scoring ---- */
    let micStream=null;
    async function detectScorer(){ if(!CLOUD){ useSpeechAce=false; return; } try{ const r=await fetch("/api/score"); const j=await r.json(); useSpeechAce=!!(j&&j.hasKey); }catch{ useSpeechAce=false; } }
    function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
    function matchText(t,w){ t=norm(t); w=norm(w); if(!t) return false; if(t.includes(w)||w.includes(t)) return true; let i=0; while(i<Math.min(t.length,w.length)&&t[i]===w[i]) i++; return i>=3; }
    function recordTurn(micBtn,maxMs=8000){ if(window.Sona&&Sona.hasNativeAudio&&Sona.hasNativeAudio())return Sona.captureClip({maxMs:(maxMs||6000)});
      return new Promise((resolve)=>{
        let done=false,chunks=[],rec=null,sr=null,transcript=""; var stopWave=function(){};
        let spoke=false,lastVoice=0,extended=false;
        const finish=()=>{ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch{} try{sr&&sr.stop();}catch{} micBtn.classList.remove("rec"); stopWave(); setTimeout(()=>{ const blob=chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null; resolve({transcript,blob}); },150); };
        try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; rec.start(); } }catch(e){}
        try{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=(ev)=>{ for(const r of ev.results){ for(let i=0;i<r.length;i++) transcript+=" "+r[i].transcript; } finish(); }; sr.onerror=()=>{}; sr.start(); } }catch(e){}
        // live waveform inside the mic button — the kid SEES it hearing them.
        // The same analyser doubles as a voice-activity detector: once they've
        // spoken and ~0.9s of quiet follows, the turn ends itself (tap = backstop).
        let wraf=null, msrc=null, bars=null, ico=micBtn.querySelector("svg");
        try{
          if(micStream){
            const ctx=getCtx(); msrc=ctx.createMediaStreamSource(micStream);
            const an=ctx.createAnalyser(); an.fftSize=512; msrc.connect(an);
            const data=new Uint8Array(an.frequencyBinCount);
            const td=new Uint8Array(an.fftSize);
            bars=document.createElement("div"); bars.className="wavebars";
            for(let b=0;b<7;b++) bars.appendChild(document.createElement("i"));
            if(ico) ico.style.display="none"; micBtn.appendChild(bars);
            const t0=performance.now(); let noiseSum=0,noiseN=0,thr=0,voiced=0;
            (function tick(){ if(done) return;
              an.getByteFrequencyData(data);
              [...bars.children].forEach((el,k)=>{ const v=data[2+k*3]/255; el.style.height=(8+v*30)+"px"; });
              // RMS vs an ambient baseline sampled in the first 300ms
              an.getByteTimeDomainData(td);
              let sum=0; for(let k=0;k<td.length;k++){ const dv=(td[k]-128)/128; sum+=dv*dv; }
              const rms=Math.sqrt(sum/td.length), now=performance.now();
              if(now-t0<300){ noiseSum+=rms; noiseN++; }
              else{
                if(!thr) thr=Math.min(0.09, Math.max(0.012, (noiseSum/Math.max(1,noiseN))*2.6));
                if(rms>thr){ voiced++; lastVoice=now; if(voiced>=2 && !spoke){ spoke=true; const m=document.getElementById("micState"); if(m) m.textContent="I hear you! 👂"; } }
                else if(rms<thr*0.7) voiced=0;
                if(spoke && now-lastVoice>=1000){ finish(); return; }
              }
              wraf=requestAnimationFrame(tick); })();
          }
        }catch(e){}
        const ms=document.getElementById("micState"); if(ms) ms.textContent="Say it now!";
        stopWave=()=>{ if(wraf)cancelAnimationFrame(wraf); try{msrc&&msrc.disconnect();}catch(e){} if(bars)bars.remove(); if(ico)ico.style.display=""; if(ms)ms.textContent=""; };
        micBtn.classList.add("rec"); micBtn.onclick=finish;
        // hard cap — but if they're mid-word right at the cap, allow a moment to finish
        setTimeout(()=>{ if(done) return; if(spoke && (performance.now()-lastVoice)<450 && !extended){ extended=true; setTimeout(finish,1500); } else finish(); },maxMs);
      });
    }
    async function scoreSay(a,blob,transcript){
      if(useSpeechAce && blob){ try{ const fd=new FormData(); fd.append("audio",new File([blob],"a.webm",{type:blob.type||"audio/webm"})); fd.append("text",a.text); fd.append("targetSound",(a.snd||SOUND)); fd.append("userId",CHILD||"child"); fd.append("mode",a.mode||"full"); const r=await fetch("/api/score",{method:"POST",body:fd}); const j=await r.json(); if(j&&j.ok) return j.rating!=="tryAgain"; }catch(e){} }
      // no usable transcript from the browser? transcribe the recording ourselves
      if(!norm(transcript) && blob && blob.size>1200){
        try{ const fd=new FormData(); fd.append("audio",new File([blob],"turn."+(((blob.type||"").includes("webm"))?"webm":"m4a"),{type:blob.type||"audio/mp4"})); const r=await fetch("/api/stt",{method:"POST",body:fd}); const j=await r.json(); if(j&&j.ok&&j.text) transcript=j.text; }catch(e){}
      }
      return matchText(transcript,a.text);
    }

    /* ---- engine ---- */
    let i=0, combo=0, xp=0; const results=[];
    const act=$("act"), checkBtn=$("checkBtn"), fb=$("fb");
    function setProgress(){ $("fill").style.width = Math.round(i/QUEUE.length*100)+"%"; }

    function audioSVG(){ return '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.6 7-8.8s-3-7.8-7-8.8z"/></svg>'; }
    function micSVG(){ return '<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'; }

    function showCombo(n){ const c=$("combo"); c.textContent="COMBO x"+n; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
    function hideCheck(){ checkBtn.classList.add("disabled"); checkBtn.onclick=null; }

    function answer(ok, sub){
      results.push({ word: (QUEUE[i].label||QUEUE[i].snd||SOUND), sound: (QUEUE[i].snd||SOUND), level:(QUEUE[i].level||"word"), ok });
      if(ok){ combo++; xp+=10; if(window.Sona){Sona.sfx.correct(); Sona.pop("⭐",{color:"#ff9600",y:window.innerHeight*0.28}); if(Sona.praiseLine)say(Sona.praiseLine());} if(combo>=2) showCombo(combo); }
      else { combo=0; if(window.Sona) Sona.sfx.tap(); }
      fb.className = "show";
      $("fbIcon").textContent = ok?"⭐":"👍";
      const lb=document.querySelector(".leobubble img");
      if(lb){ lb.classList.remove("hop","cheer"); void lb.offsetWidth; lb.classList.add(ok?"hop":"cheer"); }
      $("fbTitle").textContent = ok?pick(PRAISE):pick(TRYAGAIN);
      $("fbSub").textContent = sub||"";
      $("fbBtn").onclick = ()=>{ fb.className=""; i++; setProgress(); next(); };
    }

    function next(){ if(i>=QUEUE.length){ finish(); return; } render(QUEUE[i]); }

    function render(a){
      act.innerHTML=""; hideCheck(); fb.className="";
      // say-screens auto-advance — the footer Check button is noise there
      checkBtn.style.visibility = (a.type==="say") ? "hidden" : "visible";
      if(a.type==="say") return renderSay(a);
      if(a.type==="pick") return renderPick(a);
      if(a.type==="findSound") return renderFind(a);
    }

    /* SAY IT */
    function renderSay(a){
      const wrap=document.createElement("div"); wrap.className="saywrap";
      const showPic = a.level==="word" && a.emoji;
      wrap.innerHTML =
        '<div class="leobubble"><img src="'+(BUDDY.img||"/coach/leo.png")+'" alt="Leo"/><div class="bub">'+a.label+'</div></div>'+
        (showPic ? '<div class="bigpic">'+a.emoji+'</div>' : '<div class="bigword">'+a.label+'</div>')+
        (a.isLetter ? '<div id="mouthSlot"></div>' : '')+
        '<div class="cue">'+(window.Mouth?Mouth.hint(a.snd||SOUND):(CUE[a.snd||SOUND]||""))+'</div>'+
        '<button class="mic" id="micBtn" title="Say it">'+micSVG()+'</button>'+
        '<div class="micstate" id="micState">Listen…</div>'+
        '<button class="skip" id="skipBtn">Skip</button>';
      act.appendChild(wrap);
      // mouth demo: only attach media that actually loads — video first
      // (/coach/mouth/R.mp4), then the still (R.png), else nothing at all
      if(a.isLetter){
        const slot=wrap.querySelector("#mouthSlot"), mSrc="/coach/mouth/"+(a.snd||SOUND);
        const v=document.createElement("video");
        v.muted=true; v.loop=true; v.autoplay=true; v.playsInline=true; v.setAttribute("playsinline",""); v.className="mouthImg";
        v.addEventListener("loadeddata",()=>{ slot.appendChild(v); v.play().catch(()=>{}); },{once:true});
        v.addEventListener("error",()=>{ const im=new Image(); im.className="mouthImg"; im.onload=()=>slot.appendChild(im); im.src=mSrc+".png"; },{once:true});
        v.src=mSrc+".mp4";
      }
      // Leo speaks, then the mic starts LISTENING by itself — no tap needed.
      let started=false, answered=false;
      const doRecord=async()=>{
        if(started || answered) return; started=true;
        const res=await recordTurn($("micBtn"));
        if(answered) return; answered=true;
        const ok=await scoreSay(a,res.blob,res.transcript);
        answer(ok, ok?("You said “"+a.label+"”"):("Try “"+a.label+"” again"));
      };
      $("skipBtn").onclick=()=>{ if(answered) return; answered=true; answer(true,"Skipped — that’s okay!"); };
      $("micBtn").onclick=doRecord;
      setTimeout(async()=>{ if(a.intro) await say(a.intro); if(a.say) await say(a.say); else await say(a.text); doRecord(); }, 250);
    }

    /* PICK THE PICTURE (hear word -> tap emoji) */
    function renderPick(a){
      const wd=pick(poolOf(a.snd||SOUND)); const w={ display:wd.w, emoji:wd.e, scoreText:wd.w };
      const opts=shuffle([{e:w.emoji,ok:true}].concat(distractors(w.emoji,3,a.snd||SOUND).map(e=>({e,ok:false}))));
      const head=document.createElement("div");
      head.innerHTML='<div class="qtitle">Tap what you hear</div><div class="audiorow"><button class="audiobtn" id="play">'+audioSVG()+'</button><div class="wave"></div></div>';
      act.appendChild(head);
      const grid=document.createElement("div"); grid.className="cards";
      let sel=null;
      opts.forEach(o=>{ const c=document.createElement("div"); c.className="card"; c.textContent=o.e; c.onclick=()=>{ if(window.Sona)Sona.sfx.tap(); grid.querySelectorAll(".card").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); sel=o; armCheck(); }; grid.appendChild(c); });
      act.appendChild(grid);
      $("play").onclick=()=>say(w.scoreText);
      function armCheck(){ checkBtn.classList.remove("disabled"); checkBtn.onclick=()=>{ hideCheck(); const cards=[...grid.children]; cards.forEach((c,k)=>{ if(opts[k].ok)c.classList.add("right"); }); if(!sel.ok){ const idx=opts.indexOf(sel); cards[idx].classList.add("wrong"); } answer(!!sel.ok, sel.ok?("That’s "+w.display+"!"):("It was "+w.display)); }; }
      setTimeout(async()=>{ if(a.intro) await say(a.intro); await say("Tap the picture of the word you hear."); say(w.scoreText); }, 250);
    }

    /* FIND THE SOUND (tap all pictures with the target sound) */
    function renderFind(a){
      const tgs=shuffle(poolOf(a.snd||SOUND)).slice(0,2).map(w=>({e:w.e,ok:true}));
      const others=shuffle(otherWords(a.snd||SOUND)).slice(0,2).map(e=>({e,ok:false}));
      const opts=shuffle(tgs.concat(others));
      const head=document.createElement("div");
      head.innerHTML='<div class="qtitle">Tap the '+(a.snd||SOUND)+' pictures</div><div class="qsub">Pick every picture that starts with the '+(a.snd||SOUND)+' sound.</div><div class="audiorow"><button class="audiobtn sm" id="play">'+audioSVG()+'</button><div class="wave"></div></div>';
      act.appendChild(head);
      const grid=document.createElement("div"); grid.className="cards";
      const chosen=new Set();
      opts.forEach((o,k)=>{ const c=document.createElement("div"); c.className="card"; c.textContent=o.e; c.onclick=()=>{ if(window.Sona)Sona.sfx.tap(); if(chosen.has(k)){chosen.delete(k);c.classList.remove("sel");}else{chosen.add(k);c.classList.add("sel");} const has=chosen.size>0; checkBtn.classList.toggle("disabled",!has); checkBtn.onclick=has?doCheck:null; }; grid.appendChild(c); });
      act.appendChild(grid);
      $("play").onclick=()=>say("Find every picture that starts with "+(a.snd||SOUND)+".");
      function doCheck(){ hideCheck(); const cards=[...grid.children]; let allRight=true; opts.forEach((o,k)=>{ if(o.ok){ cards[k].classList.add("right"); if(!chosen.has(k)) allRight=false; } else if(chosen.has(k)){ cards[k].classList.add("wrong"); allRight=false; } }); answer(allRight, allRight?"You found them all!":("Those are the "+(a.snd||SOUND)+" sounds")); }
      setTimeout(async()=>{ if(a.intro) await say(a.intro); say("Can you find every picture that starts with "+(a.snd||SOUND)+"? Tap them all, then press the blue button."); }, 250);
    }

    /* ---- finish ---- */
    function finish(){
      const correct=results.filter(r=>r.ok).length;
      const stars=Math.max(1,Math.min(3,Math.round(correct/Math.max(1,results.length)*3)));
      const passed=correct>=Math.ceil(results.length*0.5);
      if(window.Sona){ Sona.recordSession({words:results});
        const bys={}; results.forEach(r=>{ (bys[r.sound]=bys[r.sound]||[]).push(r.ok); });
        if(!RETRY) Object.keys(bys).forEach(s=>{ const arr=bys[s]; if(arr.length>=3 && Sona.recordRung){ const acc=arr.filter(Boolean).length/arr.length; Sona.recordRung(s, (STAGE_USED[s]!=null?STAGE_USED[s]:STAGE), acc); } });
      }
      // celebration choreography: stars land one by one, XP counts up
      $("doneStars").textContent="☆☆☆";
      let si=0; const starIv=setInterval(()=>{ si++;
        $("doneStars").textContent="★".repeat(Math.min(si,stars))+"☆".repeat(3-Math.min(si,stars));
        if(si<=stars && window.Sona){ Sona.sfx.star(); Sona.pop("⭐",{color:"#ff9600",y:window.innerHeight*0.3}); }
        if(si>=3) clearInterval(starIv);
      },430);
      const rlabel=(n)=>(window.Sona&&Sona.rungLabel)?Sona.rungLabel(n):"more";
      $("doneSub").textContent = DAILY ? ("Daily practice done, "+CHILD+" — "+correct+" of "+results.length+" sounded great! 🎉")
        : (passed&&STAGE<5 ? ("Next up: "+rlabel(STAGE+1)+"! 🎉") : passed ? ("You finished "+SOUND+" "+rlabel(STAGE)+"! 🏆") : ("Let’s practice this one again. 💪"));
      const xpEl=$("xpReward"); xpEl.innerHTML="+0<small>XP</small>";
      let shown=0; const stepXp=Math.max(1,Math.round(xp/26));
      const xpIv=setInterval(()=>{ shown=Math.min(xp,shown+stepXp); xpEl.innerHTML="+"+shown+"<small>XP</small>"; if(shown>=xp) clearInterval(xpIv); },42);

      $("done").classList.remove("hidden");
      if(window.Sona){ Sona.confetti(); Sona.sfx.complete(); setTimeout(()=>Sona.sfx.star(),500); }
      try{ micStream&&micStream.getTracks().forEach(t=>t.stop()); }catch{}
    }

    /* ---- start ---- */
    async function start(){
      $("startBtn").disabled=true; $("err").classList.remove("show");
      getCtx();
      try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      $("start").classList.add("hidden");
      try{ await detectScorer(); }catch(e){}
      setProgress(); next();
    }
    function leave(){ try{ micStream&&micStream.getTracks().forEach(t=>t.stop()); }catch{} location.href="/home.html"; }

    const rungTitle=(window.Sona&&Sona.rungLabel)?(SOUND+" · "+Sona.rungLabel(STAGE)):("Practice "+SOUND+"!");
    $("startTitle").textContent = RETRY ? "Fix-it round! 🔁" : DAILY ? ("Today's "+MINUTES+"-minute practice!") : rungTitle;
    $("themeTag").textContent = RETRY ? "🔁 One more try on the tricky words!" : THEME.e + " " + THEME.n + (DAILY ? (" — about " + MINUTES + " minutes") : " — new words today!");
    if(BUDDY.img){ $("startPic").src=BUDDY.img; }
    $("startBtn").onclick=start;
    $("close").onclick=leave;
    $("doneBtn").onclick=(e)=>{ e.preventDefault(); leave(); };
    $("againBtn").onclick=()=>{ location.href = DAILY ? ("/lesson.html?daily=1"+(CHILD?("&name="+encodeURIComponent(CHILD)):"")) : ("/lesson.html?sound="+encodeURIComponent(SOUND)+"&stage="+STAGE+(CHILD?("&name="+encodeURIComponent(CHILD)):"")); };
    window.addEventListener("pagehide",()=>{ try{ micStream&&micStream.getTracks().forEach(t=>t.stop()); }catch{} });
    console.log("lesson ready ·",SOUND,"stage",STAGE,"·",QUEUE.length,"activities");
  </script>
</body>
