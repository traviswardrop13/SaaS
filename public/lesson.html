<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#eaf3ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sona" />
  <style>
    :root{ --blue:#2a9df4; --blue-d:#1480e0; --orange:#ff8a3d; --orange-d:#ef6f23; --ink:#10243a; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
      font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;background:#eaf3ff;color:var(--ink);}
    #stage{position:fixed;inset:0;background:radial-gradient(1100px 820px at 50% 22%, #ffffff, #e3eefc);}

    /* top: progress dots + close */
    #bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;
      padding:calc(12px + env(safe-area-inset-top)) 16px 12px;}
    #dots{display:flex;gap:6px;flex:1;}
    .dot{height:8px;flex:1;border-radius:99px;background:#cfe0f3;transition:.3s;}
    .dot.done{background:var(--orange);} .dot.cur{background:var(--blue);}
    #close{border:none;cursor:pointer;width:36px;height:36px;border-radius:50%;background:#fff;color:#94a6bd;font-size:18px;font-weight:800;box-shadow:0 4px 12px rgba(15,39,66,.1);}

    /* Leo — the coach, smaller, up top */
    #lionWrap{display:none;} /* exercise stays clean — Leo is voice-only here */
    #lionWrap.x{position:fixed;top:8%;left:50%;transform:translateX(-50%);width:min(36vw,140px);z-index:20;animation:bob 3.6s ease-in-out infinite;}
    #lionWrap.speaking{animation:bob 1.7s ease-in-out infinite;}
    @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
    #lion{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 26px rgba(20,128,224,.18));}
    #coachImg{width:100%;height:auto;display:none;filter:drop-shadow(0 12px 26px rgba(20,128,224,.18));}
    #mouth{transform-box:fill-box;transform-origin:center top;transform:scaleY(.18);}
    #eyeL,#eyeR{transform-box:fill-box;transform-origin:center;transition:transform .08s;}

    /* THE practice card — what the child is practicing (the white square, center stage) */
    #practice{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);z-index:24;
      width:min(78vw,320px);min-height:min(78vw,320px);background:#fff;border-radius:30px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:26px 22px;
      box-shadow:0 26px 70px rgba(15,39,66,.22);opacity:0;transition:.28s;}
    #practice.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
    #practice.good{box-shadow:0 0 0 6px rgba(34,197,94,.55),0 26px 70px rgba(15,39,66,.22);}
    #practice.bad{box-shadow:0 0 0 6px rgba(239,68,68,.5),0 26px 70px rgba(15,39,66,.22);}
    #pracPic{font-size:96px;line-height:1;}
    #pracPic.letter{font-family:"Baloo 2";font-weight:800;color:var(--blue-d);font-size:90px;letter-spacing:1px;}
    #pracWord{font-family:"Baloo 2";font-weight:800;font-size:34px;color:var(--blue-d);}
    #pracCue{display:none;align-items:center;gap:10px;margin-top:2px;max-width:100%;}
    #mouthImg{width:48px;height:48px;object-fit:contain;border-radius:10px;background:#eef5ff;display:none;}
    #mouthImg.show{display:block;}
    #cueHow{font-family:"Nunito";font-weight:700;color:#5b6b80;font-size:13px;line-height:1.2;text-align:left;}
    #pracChip{font-family:"Baloo 2";font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
      color:var(--orange-d);background:#ffe7d3;padding:5px 12px;border-radius:99px;}
    #hearBtn{margin-top:12px;border:none;cursor:pointer;font-family:"Baloo 2";font-weight:800;font-size:15px;color:#fff;
      background:var(--blue);padding:10px 20px;border-radius:99px;box-shadow:0 4px 0 0 var(--blue-d);}
    #hearBtn:active{transform:translateY(3px);box-shadow:0 1px 0 0 var(--blue-d);}

    #caption{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);z-index:25;max-width:min(90vw,560px);
      text-align:center;font-family:"Baloo 2";font-weight:800;color:var(--ink);font-size:clamp(17px,2.6vw,24px);
      line-height:1.25;padding:0 12px;opacity:0;transition:opacity .25s;}
    #caption.show{opacity:1;}

    #mic{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);z-index:27;width:84px;height:84px;border-radius:50%;
      background:var(--blue);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(42,157,244,.45);}
    #mic.show{display:flex;animation:pulse 1.4s infinite;}
    #mic.rec{background:#ef4444;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,157,244,.5)}70%{box-shadow:0 0 0 22px rgba(42,157,244,0)}100%{box-shadow:0 0 0 0 rgba(42,157,244,0)}}
    #mic svg{width:38px;height:38px;}
    #micHint{position:fixed;left:50%;bottom:2.5%;transform:translateX(-50%);z-index:27;font-family:"Baloo 2";font-weight:800;
      font-size:14px;color:var(--ink);background:rgba(255,255,255,.9);padding:6px 14px;border-radius:99px;display:none;}
    #micHint.show{display:block;}

    .screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:30px;background:radial-gradient(1000px 760px at 50% 28%, #ffffff, #e3eefc);}
    .screen.hidden{display:none;}
    .bigorb{width:120px;height:120px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
      font-size:64px;background:linear-gradient(160deg,#ffd9b0,#ffedd5);box-shadow:0 18px 50px rgba(239,111,35,.2);margin-bottom:20px;}
    .bigorb img{width:100%;height:100%;object-fit:cover;}
    h1{font-family:"Baloo 2";font-weight:800;font-size:clamp(24px,4.6vw,36px);color:var(--ink);}
    p.sub{margin-top:10px;max-width:420px;color:#475569;font-weight:600;font-size:16px;line-height:1.4;}
    .cta{margin-top:24px;border:none;cursor:pointer;font-family:"Baloo 2";font-weight:800;font-size:19px;color:#fff;
      background:var(--orange);padding:16px 40px;border-radius:20px;box-shadow:0 5px 0 0 var(--orange-d);transition:transform .05s;text-decoration:none;}
    .cta:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--orange-d);}
    .cta.blue{background:var(--blue);box-shadow:0 5px 0 0 var(--blue-d);}
    .cta:disabled{opacity:.6;cursor:default;}
    #againBtn{margin-top:12px;background:none;border:none;color:var(--blue-d);font-weight:800;font-size:15px;cursor:pointer;text-decoration:underline;}
    #err{margin-top:16px;max-width:460px;background:#fff0f0;border:1px solid #ffd2d2;border-radius:14px;padding:12px 14px;color:#b42323;font-size:13px;display:none;}
    #err.show{display:block;}
    #doneStars{font-size:30px;letter-spacing:4px;color:var(--orange);margin-top:6px;}
  </style>
</head>
<body>
  <div id="stage">
    <div id="lionWrap">
      <img id="coachImg" alt="Coach Leo" />
      <svg id="lion" viewBox="0 0 240 256" width="240" height="256" aria-label="Coach Leo">
        <g id="mane" fill="#df8f3a">
          <circle cx="202" cy="128" r="15"/><circle cx="178" cy="186" r="15"/><circle cx="120" cy="210" r="15"/>
          <circle cx="62" cy="186" r="15"/><circle cx="38" cy="128" r="15"/><circle cx="62" cy="70" r="15"/>
          <circle cx="120" cy="46" r="15"/><circle cx="178" cy="70" r="15"/>
          <circle cx="120" cy="128" r="80"/>
        </g>
        <circle cx="74" cy="86" r="15" fill="#df8f3a"/><circle cx="166" cy="86" r="15" fill="#df8f3a"/>
        <circle cx="74" cy="88" r="7" fill="#f7cf91"/><circle cx="166" cy="88" r="7" fill="#f7cf91"/>
        <circle cx="120" cy="128" r="62" fill="#f7cf91"/>
        <g id="eyeL"><ellipse cx="100" cy="118" rx="8" ry="11" fill="#fff"/><circle cx="100" cy="120" r="4.5" fill="#33261a"/></g>
        <g id="eyeR"><ellipse cx="140" cy="118" rx="8" ry="11" fill="#fff"/><circle cx="140" cy="120" r="4.5" fill="#33261a"/></g>
        <circle cx="88" cy="150" r="8" fill="#f7b3a3" opacity=".5"/><circle cx="152" cy="150" r="8" fill="#f7b3a3" opacity=".5"/>
        <path d="M111 139 h18 l-9 9 z" fill="#7a4a2a"/>
        <ellipse id="mouth" cx="120" cy="166" rx="17" ry="11" fill="#7a3b28"/>
      </svg>
    </div>

    <!-- the white practice card: what to say (letter / word + picture) + how (mouth cue) -->
    <div id="practice">
      <div id="pracPic">🐰</div>
      <div id="pracWord">rabbit</div>
      <div id="pracCue"><img id="mouthImg" alt="" /><span id="cueHow"></span></div>
      <div id="pracChip">R sound</div>
      <button id="hearBtn" aria-label="Hear it">🔊&nbsp;&nbsp;Hear it</button>
    </div>

    <div id="caption"></div>

    <button id="mic" title="I'm done">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="#fff"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="micHint">Your turn — say it!</div>

    <div id="bar">
      <div id="dots"></div>
      <button id="close" title="Close">&#10005;</button>
    </div>

    <!-- START -->
    <div id="start" class="screen">
      <div class="bigorb"><img id="startPic" alt="Leo" /><span id="startEmoji">🦁</span></div>
      <h1 id="startTitle">Let's practice!</h1>
      <p class="sub">Tap below, then say each one after Leo. Allow the mic so he can hear you!</p>
      <button class="cta" id="startBtn">▶&nbsp;&nbsp;Start lesson</button>
      <div id="err"></div>
    </div>

    <!-- DONE -->
    <div id="done" class="screen hidden">
      <div class="bigorb">🎉</div>
      <h1>Great job!</h1>
      <div id="doneStars">★★★</div>
      <p class="sub" id="doneSub">You practiced so well today.</p>
      <a class="cta blue" id="doneBtn" href="/home.html">Keep going →</a>
      <button id="againBtn">Practice again</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const profile = (window.Sona ? Sona.getProfile() : { childName:"", focusSounds:[], voiceOn:true, cloudScoring:true });
    const CHILD = params.get("name") || profile.childName || "friend";
    const VOICE_ON = profile.voiceOn !== false;
    const CLOUD_SCORING = profile.cloudScoring !== false;
    let useSpeechAce = false;

    const SOUND_PLAN = {
      R: { isolation:{ display:"R", say:"Let's make a big R sound. Pull your tongue back and turn your voice on — rrrr. Now you try!", scoreText:"rah" },
        syllables:[ {display:"rah",scoreText:"rah",say:"Now let's add a vowel — say rah!"},{display:"ray",scoreText:"ray",say:"Try ray!"},{display:"roo",scoreText:"roo",say:"And roo!"} ],
        words:[ {display:"rabbit",emoji:"🐰",scoreText:"rabbit",say:"Now the whole word — rabbit!"},{display:"rocket",emoji:"🚀",scoreText:"rocket",say:"Say rocket!"},{display:"ring",emoji:"💍",scoreText:"ring",say:"Say ring!"} ] },
      S: { isolation:{ display:"S", say:"Let's make a quiet snake sound. Teeth together and smile — ssss. Your turn!", scoreText:"sah" },
        syllables:[ {display:"sah",scoreText:"sah",say:"Add a vowel — sah!"},{display:"see",scoreText:"see",say:"Try see!"},{display:"so",scoreText:"so",say:"And so!"} ],
        words:[ {display:"sun",emoji:"☀️",scoreText:"sun",say:"Whole word — sun!"},{display:"snake",emoji:"🐍",scoreText:"snake",say:"Say snake!"},{display:"soap",emoji:"🧼",scoreText:"soap",say:"Say soap!"} ] },
      L: { isolation:{ display:"L", say:"Let's make the L sound. Tongue tip up behind your teeth — llll. Now you!", scoreText:"lah" },
        syllables:[ {display:"lah",scoreText:"lah",say:"Say lah!"},{display:"lee",scoreText:"lee",say:"Try lee!"},{display:"low",scoreText:"low",say:"And low!"} ],
        words:[ {display:"lion",emoji:"🦁",scoreText:"lion",say:"Whole word — lion!"},{display:"leaf",emoji:"🍃",scoreText:"leaf",say:"Say leaf!"},{display:"ball",emoji:"⚽",scoreText:"ball",say:"Say ball!"} ] },
      K: { isolation:{ display:"K", say:"Let's make the K sound. Lift the back of your tongue — k! k! Now you!", scoreText:"kah" },
        syllables:[ {display:"kah",scoreText:"kah",say:"Say kah!"},{display:"key",scoreText:"key",say:"Try key!"},{display:"ko",scoreText:"ko",say:"And ko!"} ],
        words:[ {display:"cat",emoji:"🐱",scoreText:"cat",say:"Whole word — cat!"},{display:"key",emoji:"🔑",scoreText:"key",say:"Say key!"},{display:"cake",emoji:"🍰",scoreText:"cake",say:"Say cake!"} ] },
    };
    const focus = (profile.focusSounds || []);
    const TARGET = (params.get("sound") || focus[0] || "R").toUpperCase();
    const PLAN = SOUND_PLAN[TARGET] || SOUND_PLAN.R;
    const TARGET_SOUND = SOUND_PLAN[TARGET] ? TARGET : "R";
    const STEPS = [
      { level:"isolation", sound:TARGET_SOUND, mode:"phoneme", display:PLAN.isolation.display, say:PLAN.isolation.say, scoreText:PLAN.isolation.scoreText },
      ...PLAN.syllables.map(s => ({ level:"syllable", sound:TARGET_SOUND, mode:"phoneme", display:s.display, say:s.say, scoreText:s.scoreText })),
      ...PLAN.words.map(w => ({ level:"word", sound:TARGET_SOUND, mode:"full", display:w.display, say:w.say, scoreText:w.scoreText, emoji:w.emoji })),
    ];
    const PRAISE = ["Yay! That was wonderful.","Great job — I heard it!","Awesome work!","So good! High five!","You're doing amazing."];
    const ENCOURAGE = ["Good try! Let's keep going.","Nice effort — on to the next one!","You're working so hard. Let's try another."];
    const CUE = { R:"Tongue back, voice on — rrr", S:"Teeth together, smile — sss", L:"Tongue tip up — lll", K:"Back of tongue up — k!", G:"Back of tongue, voice on — g", F:"Teeth on lip — fff", SH:"Round lips, quiet — shh", CH:"Round lips, pop — ch", TH:"Tongue peeks out — th" };

    const $ = (id) => document.getElementById(id);
    const lionWrap=$("lionWrap"), mouthEl=$("mouth"), eyeL=$("eyeL"), eyeR=$("eyeR"), coachImg=$("coachImg");
    const captionEl=$("caption"), practice=$("practice"), pracPic=$("pracPic"), pracWord=$("pracWord"), pracCue=$("pracCue"), pracChip=$("pracChip"), mouthImg=$("mouthImg"), cueHow=$("cueHow");
    const mic=$("mic"), micHint=$("micHint"), dotsEl=$("dots");
    const startScreen=$("start"), doneScreen=$("done"), startBtn=$("startBtn"), errEl=$("err"), hearBtn=$("hearBtn");

    let alive=true, micStream=null, audioCtx=null, currentHear="";
    const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
    const pick=(a)=>a[Math.floor(Math.random()*a.length)];
    const setCaption=(t)=>{ captionEl.textContent=t||""; captionEl.classList.toggle("show",!!t); };
    const pulse=(on)=> lionWrap && lionWrap.classList.toggle("speaking",!!on);

    /* Coach Leo frames (PNG if present, else SVG) */
    const FRAMES={ idle:"/coach/idle.png", open:"/coach/talk-open.png", closed:"/coach/talk-closed.png", listening:"/coach/listening.png", celebrate:"/coach/celebrate.png", encourage:"/coach/encourage.png" };
    const FRAME_OK={}; let imgReady=false, restState="idle";
    function setFrame(key){ if(!imgReady) return; const k=FRAME_OK[key]?key:"idle"; if(FRAMES[k]) coachImg.src=FRAMES[k]; }
    (function preloadCoach(){ Object.keys(FRAMES).forEach(function(key){ const im=new Image();
      im.onload=function(){ FRAME_OK[key]=true; if(key==="idle"){ imgReady=true; coachImg.src=FRAMES.idle; coachImg.style.display="block"; const s=$("lion"); if(s) s.style.display="none";
        const sp=$("startPic"), se=$("startEmoji"); if(sp){ sp.src=FRAMES.idle; sp.style.display="block"; } if(se) se.style.display="none"; } };
      im.src=FRAMES[key]; }); })();

    /* audio + amplitude lip-sync */
    function getCtx(){ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; audioCtx=new AC(); } if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
    let mouthRAF=null;
    function setMouthOpen(o){ if(imgReady){ setFrame(o>0.12?"open":"closed"); return; } if(mouthEl) mouthEl.style.transform="scaleY("+(0.18+Math.min(1,o)*1.05)+")"; }
    function startMouthLoop(an){ const d=new Uint8Array(an.fftSize); (function tick(){ an.getByteTimeDomainData(d); let s=0; for(let i=0;i<d.length;i++){ const v=(d[i]-128)/128; s+=v*v; } setMouthOpen(Math.min(1,Math.sqrt(s/d.length)*3.4)); mouthRAF=requestAnimationFrame(tick); })(); }
    function stopMouthLoop(){ if(mouthRAF) cancelAnimationFrame(mouthRAF); mouthRAF=null; if(imgReady) setFrame(restState); else if(mouthEl) mouthEl.style.transform="scaleY(.18)"; }
    function playPCM(bytes){ return new Promise((resolve)=>{ try{ const ctx=getCtx(); const n=bytes.byteLength>>1; const ab=ctx.createBuffer(1,n,24000); const ch=ab.getChannelData(0); const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); for(let i=0;i<n;i++) ch[i]=dv.getInt16(i*2,true)/32768; const src=ctx.createBufferSource(); src.buffer=ab; const an=ctx.createAnalyser(); an.fftSize=256; src.connect(an); an.connect(ctx.destination); startMouthLoop(an); src.onended=()=>{ stopMouthLoop(); resolve(); }; src.start(); }catch(e){ console.warn("playPCM",e); stopMouthLoop(); resolve(); } }); }
    setInterval(function(){ if(!eyeL) return; eyeL.style.transform=eyeR.style.transform="scaleY(0.1)"; setTimeout(function(){ eyeL.style.transform=eyeR.style.transform=""; },130); }, 4200);

    async function speak(text){
      if(!text || !alive) return;
      setCaption(text);
      if(!VOICE_ON){ await sleep(Math.min(4500, 700+text.length*45)); return; }
      pulse(true);
      try{ const res=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
        if(!res.ok){ let m="TTS "+res.status; try{const j=await res.json();m=j.error||m;}catch{} throw new Error(m); }
        await playPCM(new Uint8Array(await res.arrayBuffer())); await sleep(300);
      }catch(e){ console.warn("speak failed",e); }
      finally{ pulse(false); }
    }

    /* practice card: show what to practice (letter / word+picture) + how (mouth cue) */
    function showStep(s){
      if(!s){ practice.classList.remove("show"); return; }
      currentHear = s.scoreText || s.display;
      pracChip.textContent = s.sound + " sound";
      if(s.level === "word"){
        pracPic.className=""; pracPic.textContent = s.emoji || "🗣️";
        pracWord.style.display=""; pracWord.textContent = s.display;
        pracCue.style.display="none";
      } else {
        pracPic.className="letter"; pracPic.textContent = s.display;
        pracWord.style.display="none";
        cueHow.textContent = CUE[s.sound] || "";
        mouthImg.classList.remove("show");
        mouthImg.onload=function(){ mouthImg.classList.add("show"); };
        mouthImg.onerror=function(){ mouthImg.classList.remove("show"); };
        mouthImg.src = "/coach/mouth/" + s.sound + ".png";
        pracCue.style.display="flex";
      }
      practice.classList.add("show");
    }
    function buildDots(){ dotsEl.innerHTML=""; STEPS.forEach(()=>{ const d=document.createElement("div"); d.className="dot"; dotsEl.appendChild(d); }); }
    function setDot(i){ [...dotsEl.children].forEach((d,k)=>{ d.className="dot"+(k<i?" done":k===i?" cur":""); }); }

    /* scoring */
    function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
    function scoreMatch(t,w){ t=norm(t); w=norm(w); if(!t) return null; if(t.includes(w)||w.includes(t)) return true; let i=0; while(i<Math.min(t.length,w.length)&&t[i]===w[i]) i++; return i>=3; }
    async function detectScorer(){ if(!CLOUD_SCORING){ useSpeechAce=false; return; } try{ const r=await fetch("/api/score"); const j=await r.json(); useSpeechAce=!!(j&&j.hasKey); }catch{ useSpeechAce=false; } }
    async function scoreAttempt(step,blob,transcript){
      if(useSpeechAce && blob){ try{ setCaption("Let me listen…");
        const fd=new FormData(); fd.append("audio",new File([blob],"attempt.webm",{type:blob.type||"audio/webm"}));
        fd.append("text",step.scoreText); fd.append("targetSound",step.sound); fd.append("userId",CHILD||"child"); fd.append("mode",step.mode||"full");
        const r=await fetch("/api/score",{method:"POST",body:fd}); const j=await r.json();
        if(j&&j.ok) return { ok:j.rating!=="tryAgain", score:j.score, feedback:j.feedback, transcript:j.transcript||transcript, source:"speechace" };
      }catch(e){ console.warn("speechace err",e); } }
      return { ok:scoreMatch(transcript,step.scoreText)===true, transcript, source:"browser" };
    }

    function recordTurn(maxMs=7000){
      return new Promise((resolve)=>{
        let done=false, chunks=[], rec=null, sr=null, transcript="";
        const cleanup=()=>{ try{rec&&rec.state!=="inactive"&&rec.stop();}catch{} try{sr&&sr.stop();}catch{} mic.classList.remove("show","rec"); micHint.classList.remove("show"); mic.onclick=null; restState="idle"; setFrame("idle"); };
        const finish=()=>{ if(done)return; done=true; cleanup(); setTimeout(()=>{ const blob=chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null; resolve({transcript,blob}); },150); };
        try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; rec.start(); mic.classList.add("rec"); } }catch(e){ console.warn("rec",e); }
        try{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=(ev)=>{ for(const r of ev.results){ for(let i=0;i<r.length;i++) transcript+=" "+r[i].transcript; } finish(); }; sr.onerror=()=>{}; sr.start(); } }catch(e){ console.warn("sr",e); }
        mic.classList.add("show"); micHint.classList.add("show"); mic.onclick=finish; restState="listening"; setFrame("listening");
        setTimeout(finish, maxMs);
      });
    }

    async function runLesson(){
      await speak(`Hi ${CHILD}! Today we're working on the ${TARGET_SOUND} sound. Watch me, then it's your turn!`);
      const practiced=[]; let lastLevel="";
      for(let i=0;i<STEPS.length && alive;i++){
        const s=STEPS[i]; setDot(i);
        if(s.level!==lastLevel){ if(s.level==="syllable") await speak("Great! Now let's put it together."); else if(s.level==="word") await speak("You're ready for whole words!"); lastLevel=s.level; }
        showStep(s);
        await speak(s.say);
        const res=await recordTurn();
        const sc=await scoreAttempt(s,res.blob,res.transcript);
        const ok=sc.ok;
        practiced.push({ word:s.display, sound:s.sound, level:s.level, ok, score:sc.score });
        if(res.blob && window.Sona && Sona.saveRecording){ Sona.saveRecording({ word:s.display, sound:s.sound, level:s.level, ok, score:sc.score||null, transcript:sc.transcript||"", source:sc.source, blob:res.blob }); }
        if(window.Sona){ if(ok){ Sona.sfx.correct(); Sona.pop("+10 XP",{color:"#22c55e",y:window.innerHeight*0.3}); } else { Sona.sfx.wrong(); } }
        practice.classList.add(ok?"good":"bad");
        await sleep(450);
        practice.classList.remove("good","bad");
        showStep(null);
        await speak(ok ? pick(PRAISE) : (sc.feedback || pick(ENCOURAGE)));
      }
      setDot(STEPS.length); setCaption("");
      await speak(`Awesome work on your ${TARGET_SOUND} sounds today, ${CHILD}! I'm so proud of you!`);
      if(window.Sona) Sona.recordSession({ words: practiced });
      endLesson(practiced);
    }

    function endLesson(practiced){
      restState="celebrate"; setFrame("celebrate");
      const great=practiced.filter(p=>p.ok).length;
      const stars=Math.max(1, Math.min(3, Math.round(great/Math.max(1,practiced.length)*3)));
      $("doneStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);
      $("doneSub").textContent=`${great} of ${practiced.length} sounded great, ${CHILD}! 🎉`;
      doneScreen.classList.remove("hidden");
      if(window.Sona){ Sona.confetti(); Sona.sfx.complete(); setTimeout(()=>Sona.sfx.star(), 500); }
      try{ micStream?.getTracks().forEach(t=>t.stop()); }catch{}
    }

    async function start(){
      startBtn.disabled=true; errEl.classList.remove("show");
      getCtx();
      try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      startScreen.classList.add("hidden");
      try{ await detectScorer(); await runLesson(); }
      catch(err){ console.error(err); startScreen.classList.remove("hidden"); errEl.textContent=String(err&&err.message||err); errEl.classList.add("show"); startBtn.disabled=false; }
    }
    function leave(){ alive=false; try{ micStream?.getTracks().forEach(t=>t.stop()); }catch{} location.href="/home.html"; }

    buildDots();
    const BUDDY = (window.Sona ? Sona.characterById(profile.character) : null);
    if (BUDDY) { const se=$("startEmoji"), sp=$("startPic");
      if (BUDDY.img && sp) { sp.src = BUDDY.img; sp.style.display="block"; sp.style.objectFit="contain"; if(se) se.style.display="none"; }
      else if (se) se.textContent = BUDDY.emoji;
    }
    $("startTitle").textContent = `Let's practice the ${TARGET_SOUND} sound!`;
    startBtn.onclick=start;
    hearBtn.onclick=()=>{ if(alive && currentHear) speak(currentHear); };
    $("close").onclick=leave;
    $("doneBtn").onclick=function(e){ e.preventDefault(); leave(); };
    $("againBtn").onclick=()=>location.reload();
    window.addEventListener("pagehide", ()=>{ try{ micStream?.getTracks().forEach(t=>t.stop()); }catch{} });
    console.log("lesson.html ready · sound", TARGET_SOUND);
  </script>
</body>
