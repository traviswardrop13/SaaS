<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Soccer Goal</title>
  <link href="/fonts.css" rel="stylesheet">
  <link href="/action.css" rel="stylesheet">
  <link href="/sayplay.css" rel="stylesheet">
  <meta name="theme-color" content="#e6f6ff" />
  <!--
    Soccer Goal: the second Say & Play game rebuilt to be played (suggested
    ages 5-8; Travis, 1 Oct 2026: "go finish soccer"). Say the word, a ball
    rolls to the spot, swipe up to kick it past Bo the goalie, who slides
    along the goal line; a save comes back to kick again; eight goals win.
    Written by hand, not by tools/gameart/build.mjs: the pitch is drawn and
    played in /soccer.js, and every word turn, the mic and its quiet rules are
    /sayplay.js's, as in every Say & Play game. Its start card is the same
    teal "Let's play" pill the builder writes (tools/gameart/page.mjs), by hand.
  -->
  <style>
    :root{--top:#e6f6ff;--bottom:#cfeec0;}
    /* the pitch is taller than a picture scene: the ball needs room to fly */
    #stageWrap.pitch{width:min(100%,calc(58dvh * .79));background:#BFE6FA;}
    #pitch{display:block;width:100%;aspect-ratio:440/560;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;}
    #pitchEcho{position:absolute;left:3%;bottom:2%;width:16%;max-width:74px;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(30,70,20,.25));}
    #pitchEcho.hop{animation:echoHop .9s cubic-bezier(.3,1.5,.5,1);}
    @keyframes echoHop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-34%) rotate(-10deg)}60%{transform:translateY(0) rotate(6deg)}80%{transform:translateY(-10%)}}
    @media (prefers-reduced-motion: reduce){ #pitchEcho.hop{animation:none;} }
  </style>
  <link href="/crafted-games.css" rel="stylesheet">
  <link href="/crafted-soccer.css" rel="stylesheet">
</head>
<body data-phase="boot" data-crafted="soccer">
  <div id="app">
    <div id="top">
      <button id="close" aria-label="Back">✕</button>
      <span class="hudpill"><span id="ttl">Soccer Goal</span></span>
      <span id="spacer"></span>
      <span class="hudpill" id="dots" role="img" aria-label="0 of 8"></span>
    </div>
    <div id="stageWrap" class="pitch">
      <canvas id="pitch" role="img" aria-label="A soccer pitch. Bo the bear guards the goal and slides from side to side. Say the word two times to get the ball, then swipe up to kick it past him."></canvas>
      <img id="pitchEcho" src="/assets/crafted/echo-welcome.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
    </div>
    <div id="turnPanel" aria-live="polite">
      <div id="picBox"><span id="pic"></span></div>
      <div id="word"></div>
      <button id="hear" aria-label="Hear it again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="#1cb0f6"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1cb0f6" stroke-width="2.2" stroke-linecap="round"/></svg><span>Hear it</span></button>
      <div id="listenRow">
        <span id="echoWrap"><img id="echoFace" src="/assets/crafted/echo-welcome.webp" alt="Echo" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" /></span>
        <span id="micState"></span>
        <span id="cheer"></span>
        <button id="micBtn" hidden aria-label="Listen again"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <div class="ovl" id="startOvl">
    <div class="ovlCard">
      <h2 id="startTitle">Soccer Goal</h2>
      <p>Say the word two times to get the ball. Then swipe up to kick it past the goalie!</p>
      <p class="small" id="startSound"></p>
      <button id="startBtn" class="act-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z" fill="#fff"/></svg><span>Let's play</span></button>
    </div>
  </div>
  <div class="ovl" id="primer">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-listen.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2>Let Echo hear you!</h2>
      <p>Say each word two times to get the ball.</p>
      <p class="small" id="micPromise"></p>
      <button class="btn" id="primerYes">Turn on Echo's ears</button>
      <button class="ghost" id="primerNo">Not now</button>
    </div>
  </div>
  <div class="ovl" id="pauseOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-think.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2>Paused</h2>
      <button class="btn" id="resume">Keep playing</button>
    </div>
  </div>
  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <img class="ovlEcho endStar" src="/assets/crafted/echo-cheer.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
      <h2 id="endTitle"></h2>
      <p id="endSub"></p>
      <button class="btn" id="again">Play again</button>
      <button class="ghost" id="goHome">Back home</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script src="/crafted-words.js"></script>
  <script src="/sayplay.js"></script>
  <script src="/soccer.js"></script>
  <script>
    // The pitch's own sounds, made on the phone and played through the
    // engine, so they wait for a closed mic like every chime.
    function soccerNoise(ctx, vol, dur, f0, f1, gain) {
      var n = Math.round(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.6);
      var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime;
      src.buffer = buf; bp.type = "bandpass"; bp.Q.value = 1.1;
      bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(gain * vol, t); src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t); src.stop(t + dur + 0.02);
    }
    function soccerTone(ctx, vol, f, dur, gain, type, fEnd, delay) {
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + (delay || 0);
      o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain * vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    SayPlay.start({
      key: "soccer", intro: "Say each word two times to get a ball.", title: "Soccer Goal",
      steps: [[], [], [], [], [], [], [], []], finale: [],
      done: { title: "Goal star!", sub: "Eight words, eight goals. What a striker!" },
      play: window.Soccer,
      sounds: {
        kick: function (ctx, vol) { soccerTone(ctx, vol, 130, 0.14, 0.45, "sine", 55); soccerNoise(ctx, vol, 0.09, 900, 300, 0.35); },
        net: function (ctx, vol) { soccerNoise(ctx, vol, 0.45, 2600, 800, 0.45); soccerTone(ctx, vol, 659.3, 0.22, 0.07, "sine", 0, 0.05); soccerTone(ctx, vol, 784, 0.3, 0.07, "sine", 0, 0.17); },
        save: function (ctx, vol) { soccerTone(ctx, vol, 210, 0.16, 0.35, "sine", 95); soccerNoise(ctx, vol, 0.12, 700, 260, 0.3); },
        bounce: function (ctx, vol) { soccerTone(ctx, vol, 150, 0.16, 0.3, "sine", 70); },
        whoosh: function (ctx, vol) { soccerNoise(ctx, vol, 0.28, 700, 2600, 0.28); },
        roll: function (ctx, vol) { soccerNoise(ctx, vol, 0.5, 260, 160, 0.3); },
      },
      soundMs: { kick: 200, net: 500, save: 220, bounce: 200, whoosh: 300, roll: 520 },
    });
  </script>
</body>
</html>
