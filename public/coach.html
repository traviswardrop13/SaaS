<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — coaching session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --sky:#1cb0f6; --sky-d:#0e9add; --grass:#22c55e; --grass-d:#16a34a;
      --ink:#1f2937; --wolf:#6b7280;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;
      font-family:"Baloo 2",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;background:#0a1626;color:#fff;overflow:hidden;}
    #stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(1200px 820px at 50% 22%, #14385e, #0a1626);}
    video{width:min(82vw,520px);max-height:62vh;border-radius:28px;background:#000;
      box-shadow:0 24px 60px rgba(0,0,0,.45);object-fit:cover;}

    /* progress dots */
    #top{position:absolute;top:0;left:0;right:0;padding:16px;display:flex;align-items:center;gap:12px;z-index:5;}
    #dots{flex:1;display:flex;gap:7px;}
    .dot{height:7px;flex:1;border-radius:99px;background:rgba(255,255,255,.16);transition:.3s;}
    .dot.done{background:var(--grass);}
    .dot.cur{background:var(--sky);}
    #close{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.14);
      color:#fff;font-size:18px;font-weight:700;cursor:pointer;}

    /* caption (what coach is saying) */
    #caption{position:absolute;left:50%;transform:translateX(-50%);bottom:26%;width:min(88vw,560px);
      text-align:center;font-family:"Baloo 2";font-weight:800;font-size:clamp(18px,2.6vw,26px);
      line-height:1.25;text-shadow:0 2px 14px rgba(0,0,0,.5);opacity:0;transition:.25s;padding:0 10px;}
    #caption.show{opacity:1;}

    /* word card (child's turn) */
    #wordCard{position:absolute;left:50%;bottom:24%;transform:translate(-50%,16px) scale(.92);
      background:#fff;color:var(--ink);border-radius:26px;padding:16px 26px;display:flex;align-items:center;gap:14px;
      box-shadow:0 18px 50px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;}
    #wordCard.show{opacity:1;transform:translate(-50%,0) scale(1);}
    #wordCard .emoji{font-size:46px;}
    #wordCard .word{font-family:"Baloo 2";font-weight:800;font-size:40px;color:var(--sky-d);letter-spacing:.5px;}

    /* bottom control bar */
    #bottom{position:absolute;left:0;right:0;bottom:0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));
      display:flex;flex-direction:column;align-items:center;gap:12px;z-index:5;}
    #status{font-family:"Baloo 2";font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;
      color:rgba(255,255,255,.7);min-height:18px;}
    .bigbtn{border:none;border-radius:20px;font-family:"Baloo 2";font-weight:800;font-size:18px;color:#fff;
      padding:16px 30px;cursor:pointer;box-shadow:0 5px 0 0 var(--grass-d);transition:transform .05s;}
    .bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--grass-d);}
    .bigbtn.grass{background:var(--grass);}
    .bigbtn.sky{background:var(--sky);box-shadow:0 5px 0 0 var(--sky-d);}
    .bigbtn.sky:active{box-shadow:0 1px 0 0 var(--sky-d);}
    #micRing{width:78px;height:78px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 0 0 rgba(28,176,246,.55);cursor:pointer;border:none;}
    #micRing.pulse{animation:pulse 1.3s infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.5);}70%{box-shadow:0 0 0 22px rgba(28,176,246,0);}100%{box-shadow:0 0 0 0 rgba(28,176,246,0);}}
    #micRing svg{width:34px;height:34px;}

    /* overlays */
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:28px;background:radial-gradient(900px 700px at 50% 30%, rgba(20,56,94,.6), rgba(10,22,38,.92));z-index:10;}
    .overlay h1{font-family:"Baloo 2";font-weight:800;font-size:clamp(26px,5vw,40px);}
    .overlay p{margin-top:10px;max-width:380px;color:rgba(255,255,255,.8);font-family:"Nunito";font-weight:600;font-size:16px;}
    .overlay .lion{font-size:84px;}
    .hidden{display:none !important;}
    #errBox{margin-top:14px;max-width:460px;background:rgba(0,0,0,.35);border-radius:14px;padding:12px 14px;
      font-family:ui-monospace,monospace;font-size:12px;color:#ffd7d7;white-space:pre-wrap;text-align:left;}
  </style>
</head>
<body>
  <div id="stage">
    <div id="top">
      <button id="close" title="End">&#10005;</button>
      <div id="dots"></div>
    </div>

    <video id="video" autoplay playsinline></video>

    <div id="caption"></div>

    <div id="wordCard">
      <span class="emoji" id="wcEmoji">🐰</span>
      <span class="word" id="wcWord">rabbit</span>
    </div>

    <div id="bottom">
      <div id="status"></div>
      <button id="micRing" class="hidden" title="I'm done">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="#fff"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- START overlay -->
    <div id="startOverlay" class="overlay">
      <div class="lion">🦁</div>
      <h1>Meet your coach</h1>
      <p>Press start and your coach will say hello, then practice some words with you. (You'll be asked to allow your microphone.)</p>
      <button id="startBtn" class="bigbtn grass" style="margin-top:22px;">▶  Start session</button>
      <div id="errBox" class="hidden"></div>
    </div>

    <!-- DONE overlay -->
    <div id="doneOverlay" class="overlay hidden">
      <div class="lion">🎉</div>
      <h1>Great session!</h1>
      <p id="doneSub">You practiced so well today.</p>
      <button id="againBtn" class="bigbtn sky" style="margin-top:22px;">Done</button>
    </div>
  </div>

  <script type="module">
    /* ---------------- config ---------------- */
    const params = new URLSearchParams(location.search);
    const AVATAR_ID = params.get("avatar") || "7f89caae735346619beafd1bc541ae42"; // custom coach
    const VOICE_ID  = params.get("voice")  || "de5574fc-009e-4a01-a881-9919ef8f5a0c";
    const MODE      = (params.get("mode") || "LITE").toUpperCase();
    const CHILD     = params.get("name") || "friend";

    // Default practice set (override later from the child's plan).
    const WORDS = [
      { word:"rabbit", emoji:"🐰", sound:"R" },
      { word:"sun",    emoji:"☀️", sound:"S" },
      { word:"lion",   emoji:"🦁", sound:"L" },
      { word:"snake",  emoji:"🐍", sound:"S" },
      { word:"rocket", emoji:"🚀", sound:"R" },
      { word:"ball",   emoji:"⚽", sound:"L" },
    ];

    /* ---------------- elements ---------------- */
    const video = document.getElementById("video");
    const captionEl = document.getElementById("caption");
    const statusEl = document.getElementById("status");
    const wordCard = document.getElementById("wordCard");
    const wcEmoji = document.getElementById("wcEmoji");
    const wcWord = document.getElementById("wcWord");
    const micRing = document.getElementById("micRing");
    const dotsEl = document.getElementById("dots");
    const startOverlay = document.getElementById("startOverlay");
    const doneOverlay = document.getElementById("doneOverlay");
    const errBox = document.getElementById("errBox");

    let session = null, SDK = null, micStream = null, alive = true;

    // Readiness gate: the avatar only accepts speak/repeatAudio once the live
    // stream is up. Resolved on SESSION_STREAM_READY so the greeting waits
    // instead of racing the connection ("Session needs to be connected…").
    let streamReady = false, readyResolve = null, readyPromise = null;
    const resetReady = ()=>{ streamReady = false; readyPromise = new Promise(r=>readyResolve=r); };
    const waitReady = (ms=12000)=> streamReady ? Promise.resolve()
      : Promise.race([readyPromise || Promise.resolve(), new Promise(r=>setTimeout(r,ms))]);

    const setStatus = (s)=> statusEl.textContent = s || "";
    const setCaption = (t)=>{ captionEl.textContent = t || ""; captionEl.classList.toggle("show", !!t); };
    function showWord(w){
      if(w){ wcEmoji.textContent = w.emoji||""; wcWord.textContent = w.word; wordCard.classList.add("show"); }
      else wordCard.classList.remove("show");
    }
    function buildDots(){ dotsEl.innerHTML=""; WORDS.forEach(()=>{ const d=document.createElement("div"); d.className="dot"; dotsEl.appendChild(d); }); }
    function setDot(i){ [...dotsEl.children].forEach((d,k)=>{ d.className = "dot" + (k<i?" done":k===i?" cur":""); }); }
    const sleep = (ms)=> new Promise(r=>setTimeout(r,ms));

    /* ---------------- SDK ---------------- */
    async function loadSDK(){
      if(SDK) return SDK;
      const urls=["https://esm.sh/@heygen/liveavatar-web-sdk","https://cdn.jsdelivr.net/npm/@heygen/liveavatar-web-sdk/+esm"];
      let lastErr;
      for(const u of urls){
        try{ const m=await import(/* @vite-ignore */ u);
          if(m&&m.LiveAvatarSession){ SDK={LiveAvatarSession:m.LiveAvatarSession,SessionEvent:m.SessionEvent}; return SDK; } }
        catch(e){ lastErr=e; }
      }
      throw lastErr||new Error("SDK failed to load");
    }

    /* coach line from our brain (Claude). Always resolves. */
    async function coachLine(action, w){
      try{
        const r = await fetch("/api/coach",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({childName:CHILD,targetWord:w?.word,targetSound:w?.sound,action})});
        const j = await r.json();
        if(j?.ok && j.say) return j.say;
      }catch(e){}
      // canned fallback so the session never stalls
      const word=w?.word||"it";
      if(action==="intro") return `Let's try ${word}! Say it with me — ${word}.`;
      if(action==="praise") return `Yay! Nice job with ${word}.`;
      if(action==="finish") return `You did so well today, ${CHILD}! I'm so proud of you.`;
      return "Great try! Let's do the next one.";
    }

    /* wait for her to finish, capped by audio duration */
    function awaitSpeakEnded(maxMs){
      return new Promise((resolve)=>{
        let done=false;
        const finish=()=>{ if(done)return; done=true; try{session.off?.("avatar.speak_ended",finish);}catch{}; resolve(); };
        try{ session.on("avatar.speak_ended", finish); }catch{}
        setTimeout(finish, maxMs);
      });
    }

    /* speak: LITE = our TTS -> repeatAudio; FULL = avatar TTS */
    async function coachSpeak(text){
      if(!text || !session) return;
      setCaption(text);
      await waitReady(8000); // never send a command before the stream is live
      if(MODE!=="LITE"){ try{ session.repeat(text); }catch(e){} await sleep(Math.min(8000, 600 + text.length*55)); return; }
      const res = await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
      if(!res.ok){
        let msg="TTS error "+res.status; try{const j=await res.json();msg=j.error||msg; if(j.detail)msg+="\n"+j.detail;}catch{}
        throw new Error(msg);
      }
      const buf = new Uint8Array(await res.arrayBuffer());
      let bin=""; const CH=0x8000;
      for(let i=0;i<buf.length;i+=CH) bin+=String.fromCharCode.apply(null, buf.subarray(i,i+CH));
      const durationMs = (buf.length/(24000*2))*1000;
      session.repeatAudio(bin);
      await awaitSpeakEnded(durationMs + 1400);
    }

    /* the child's turn: show mic, resolve on tap or after a window */
    function childTurn(maxMs=6000){
      return new Promise((resolve)=>{
        let done=false;
        const finish=()=>{ if(done)return; done=true; micRing.classList.remove("pulse"); micRing.classList.add("hidden");
          micRing.onclick=null; setStatus(""); resolve(); };
        setStatus("Your turn — tap when you're done");
        micRing.classList.remove("hidden"); micRing.classList.add("pulse");
        micRing.onclick = finish;
        setTimeout(finish, maxMs);
      });
    }

    /* ---------------- session ---------------- */
    async function start(){
      const startBtn = document.getElementById("startBtn");
      startBtn.disabled = true;
      errBox.classList.add("hidden"); errBox.textContent="";
      try{
        // mic permission up front (used for the child's turns / future scoring)
        try{ micStream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ /* allow no-mic demo */ }

        const { LiveAvatarSession, SessionEvent } = await loadSDK();

        // Close any prior session first so a re-Start doesn't trip the account's
        // concurrent-session limit.
        if(session){ try{ await session.stop(); }catch{} session=null; }
        resetReady();

        setStatus("connecting…");
        const tp = new URLSearchParams(location.search);
        tp.set("avatar",AVATAR_ID); tp.set("voice",VOICE_ID); if(!tp.get("mode")) tp.set("mode",MODE);
        const res = await fetch(`/api/heygen/token?${tp.toString()}`,{method:"POST"});
        const data = await res.json();
        if(!data.ok || !data.token) throw new Error("Token: "+(data.error||"unknown")+"\n"+JSON.stringify(data.raw||{},null,2));

        session = new LiveAvatarSession(data.token, { voiceChat:false });
        session.on(SessionEvent.SESSION_STREAM_READY, ()=>{ streamReady=true; readyResolve&&readyResolve(); try{ session.attach(video); }catch(e){ console.warn("attach failed", e); } video.play().catch(()=>{}); });
        session.on(SessionEvent.SESSION_DISCONNECTED, ()=>{ streamReady=false; if(alive) setStatus("disconnected"); });
        await session.start();
        await waitReady(); // wait until the stream is live before the first line

        startOverlay.classList.add("hidden");
        await runSession();
      }catch(err){
        console.error(err);
        const m = String(err?.message||err);
        errBox.textContent = /credit/i.test(m)
          ? "Coach is out of session credits right now — top up / upgrade your LiveAvatar plan, then try again."
          : /concurren/i.test(m)
          ? "Coach busy: a previous session is still open (your plan allows one at a time).\nClose other tabs running the coach, wait ~30–60 seconds, then try again."
          : m;
        errBox.classList.remove("hidden");
        setStatus("error");
      }finally{
        startBtn.disabled = false;
      }
    }

    async function runSession(){
      await coachSpeak(`Hi ${CHILD}! I'm so happy to see you. Let's practice some words together!`);
      for(let i=0;i<WORDS.length && alive;i++){
        const w = WORDS[i]; setDot(i);
        showWord(null);
        await coachSpeak(await coachLine("intro", w));
        showWord(w);
        await childTurn();
        showWord(null);
        await coachSpeak(await coachLine("praise", w));
      }
      setDot(WORDS.length);
      setCaption("");
      await coachSpeak(await coachLine("finish"));
      endSession();
    }

    function endSession(){
      document.getElementById("doneSub").textContent = `You practiced ${WORDS.length} words, ${CHILD}! 🎉`;
      doneOverlay.classList.remove("hidden");
    }

    function quit(){
      alive=false;
      try{ session?.stop(); }catch{}
      try{ micStream?.getTracks().forEach(t=>t.stop()); }catch{}
      location.href = "/";
    }

    buildDots();
    document.getElementById("startBtn").onclick = start;
    document.getElementById("close").onclick = quit;
    document.getElementById("againBtn").onclick = ()=> location.reload();
    // Release the session if the tab is closed/navigated away so the avatar
    // slot frees immediately instead of lingering against the concurrency cap.
    window.addEventListener("pagehide", ()=>{ try{ session?.stop(); }catch{} });
    console.log("coach.html ready · mode", MODE, "· avatar", AVATAR_ID);
  </script>
</body>
</html>
