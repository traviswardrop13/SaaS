<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Sound Sprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#0d3321" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#0d3321,#14532d 70%,#1b6b3a);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;z-index:5;}
    #close{border:none;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:800;cursor:pointer;line-height:1;border-radius:12px;padding:8px 12px;}
    #score{font-family:"Baloo 2";font-weight:800;font-size:22px;color:#fff;flex:1;}
    #shieldLbl{font-family:"Baloo 2";font-weight:800;font-size:18px;color:#ffd21c;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.3);}
    #boostChip{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:5;background:rgba(255,255,255,.16);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:13px;padding:7px 15px;border-radius:99px;pointer-events:none;white-space:nowrap;transition:background .2s,color .2s;}
    #boostChip.hot{background:#ffd21c;color:#5c4500;animation:chipPop .4s ease;}
    @keyframes chipPop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
    #tapHint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-family:"Baloo 2";font-weight:800;font-size:15px;color:#c8f0d4;z-index:4;pointer-events:none;}
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(8,30,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:10px;}
    .ovl.show{display:flex;}
    .ovl .big{font-size:70px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:28px;color:#fff;}
    .ovl p{color:#bfe8cc;font-weight:700;font-size:15px;max-width:300px;}
    .btn{border:none;border-radius:16px;padding:15px 32px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;transition:transform .05s;margin-top:6px;}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .btn.blue{background:var(--blue);box-shadow:0 5px 0 0 var(--blue-d);}
    .btn.ghost{background:none;box-shadow:none;color:#9fd0ae;text-transform:none;font-size:14px;}
  </style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div id="score">🏃 0m</div>
      <div id="shieldLbl">🛡️ 1</div>
      <div id="timer" style="font-family:'Baloo 2';font-weight:800;font-size:18px;color:#ffd21c;">45</div>
    </div>
    <div id="flash"></div>
    <div id="boostChip"></div>
    <div id="tapHint">Tap left or right to switch lanes!</div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="big">⚡</div>
    <h2>Charge up first!</h2>
    <p>Say your sound 5 times to power up your runner.</p>
    <button class="btn blue" id="goCharge">⚡ Charge up</button>
    <button class="btn ghost" id="needHome">Back home</button>
  </div>

  <div class="ovl" id="endOvl">
    <div class="big">🏁</div>
    <h2 id="endTitle">Great run!</h2>
    <p id="endSub"></p>
    <button class="btn blue" id="endCharge">⚡ Run again</button>
    <button class="btn" id="endAgain" style="display:none;"></button>
    <button class="btn ghost" id="endHome">Done for now</button>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }

    // ---- charge gate + daily plumbing ----
    var SELF="arcade-run.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ tok=sessionStorage.getItem("sona.play.token")==="1"; sessionStorage.removeItem("sona.play.token"); }catch(e){}
    if(!tok){ $("needOvl").classList.add("show"); }

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    // ---- the runner: 3 lanes, dodge rocks, grab coins ----
    var boost={on:false,cool:false}; // declared with game state — draw() reads it from frame 1
    var LANES=3, playing=true, dist=0, coins=0, shields=1, speed=H*0.004, lane=1, laneX=1;
    var things=[], spawnGap=0, hurtT=0;
    var OBST=["🪨","🌵","🚧","🪵"];
    // the runner = the kid's own buddy character (mascot-neutral)
    var RUNNER="🦊";
    try{ var c=S.characterById((S.getProfile()||{}).character||"fox"); if(c&&c.emoji)RUNNER=c.emoji; }catch(e){}

    function laneCX(l){ var road=W*0.86, lw=road/LANES; return (W-road)/2+lw*l+lw/2; }
    function spawnRow(){
      // one obstacle OR a coin trail; never fully blocked
      var block=(Math.random()*LANES)|0;
      if(Math.random()<0.62){ things.push({t:"o",e:OBST[(Math.random()*OBST.length)|0],lane:block,y:-60}); }
      else { var cl=(Math.random()*LANES)|0; for(var k=0;k<3;k++) things.push({t:"c",e:"🪙",lane:cl,y:-60-k*70}); }
    }

    cv.addEventListener("pointerdown",function(e){
      if(!playing||falling.on)return;
      var r=cv.getBoundingClientRect(), x=e.clientX-r.left;
      if(x<W/2) lane=Math.max(0,lane-1); else lane=Math.min(LANES-1,lane+1);
      sfx("tap"); $("tapHint").style.display="none";
    });

    var PLAYY=function(){ return H-170; };
    function flash(t){ var f=$("flash"); f.textContent=t; f.style.opacity=1; f.style.transform="scale(1.15)"; setTimeout(function(){f.style.opacity=0;f.style.transform="scale(1)";},600); }

    var distIv=setInterval(function(){ if(!playing||falling.on)return; dist+=(boost.on?2:1); $("score").textContent="🏃 "+dist+"m"; },100);
    var rampIv=setInterval(function(){ if(playing) speed*=1.06; },8000);
    // the round ends on the CLOCK, never on a crash — crashing just costs time
    var ROUND=45, tLeft=ROUND;
    var timeIv=setInterval(function(){ if(!playing)return; tLeft--; $("timer").textContent=tLeft; if(tLeft<=0) endRound(); },1000);

    // Mario-Kart fall: hit something → tumble off the map (~1.1s), get rescued
    // back onto the road, keep running. Funny, never punishing.
    var falling={on:false,t0:0};
    function startFall(){
      falling={on:true,t0:performance.now()};
      dist=Math.max(0,dist-10);
      flash("WHOOOA! 🫧"); sfx("tap");
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      var road=W*0.86, rx=(W-road)/2, lw=road/LANES;
      // road + moving dashes
      ctx.fillStyle="rgba(0,0,0,.25)"; rr(rx-8,-10,road+16,H+20,26); ctx.fill();
      var dashOff=(performance.now()*speed*0.06)%56;
      ctx.fillStyle="rgba(255,255,255,.18)";
      for(var l=1;l<LANES;l++){ for(var y=-56;y<H;y+=56){ ctx.fillRect(rx+lw*l-3,y+dashOff,6,30); } }
      // spawn pacing tied to speed
      spawnGap-=speed; if(spawnGap<=0){ spawnRow(); spawnGap=170+Math.random()*130; }
      // things
      ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font="44px sans-serif";
      var px=laneCX(laneX=laneX+(lane-laneX)*0.25), py=PLAYY();
      for(var i=things.length-1;i>=0;i--){ var t=things[i];
        t.y+=speed*(boost.on?1.6:1);
        if(t.y>H+50){ things.splice(i,1); continue; }
        var tx=laneCX(t.lane);
        ctx.fillText(t.e,tx,t.y);
        // collide near player row
        if(!falling.on && Math.abs(t.y-py)<40 && t.lane===Math.round(laneX)){
          if(t.t==="c"){ things.splice(i,1); coins++; dist+=5; sfx("tap"); continue; }
          if(boost.on){ things.splice(i,1); dist+=10; flash("SMASH! +10"); continue; }
          if(performance.now()-hurtT<1200) continue; // brief mercy window
          if(shields>0){ shields--; hurtT=performance.now(); $("shieldLbl").textContent="🛡️ "+shields; things.splice(i,1); flash("Shield saved you! 🛡️"); sfx("tap"); continue; }
          things.splice(i,1); startFall(); continue;
        }
      }
      // player (star mode = rainbow ring; falling = Mario-Kart tumble + rescue)
      if(falling.on){
        var ft=(performance.now()-falling.t0)/1100;
        if(ft>=1){ falling.on=false; hurtT=performance.now(); flash("Back in the race! 🫧"); }
        else{
          ctx.save(); ctx.translate(px,py+ft*ft*300); ctx.rotate(ft*12);
          ctx.globalAlpha=1-ft*0.4; ctx.font=(54*(1-ft*0.45))+"px sans-serif"; ctx.fillText(RUNNER,0,0); ctx.restore();
        }
      } else {
        if(boost.on){ ctx.fillStyle="rgba(255,210,28,.35)"; ctx.beginPath(); ctx.arc(px,py,44,0,7); ctx.fill(); }
        var blink=(performance.now()-hurtT<1200)&&(((performance.now()/120)|0)%2===0);
        if(!blink){ ctx.font="54px sans-serif"; ctx.fillText(RUNNER,px,py); }
      }
      requestAnimationFrame(playing?draw:function(){});
    }
    function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    draw();

    // ── VOICE BOOST: STAR MODE — say your sound → 2.5s invincible + double
    // distance; obstacles smash for points. Optional; local loudness only.
    function fireBoost(){
      boost.on=true; boost.cool=true;
      var ch=$("boostChip"); ch.textContent="STAR MODE!! ⭐"; ch.classList.add("hot");
      sfx("complete"); flash("⭐ STAR MODE! ⭐");
      setTimeout(function(){ boost.on=false; ch.classList.remove("hot"); ch.textContent="…"; },2500);
      setTimeout(function(){ boost.cool=false; paintChip(); },8000);
    }
    var SAYTXT="";
    function paintChip(){ $("boostChip").textContent="🎤 Say “"+SAYTXT+"” for STAR MODE!"; }
    (function(){
      var snd=""; try{ snd=sessionStorage.getItem("sona.boost.sound")||""; }catch(e){}
      if(!snd){ try{ snd=((S&&S.getProfile&&S.getProfile().focusSounds)||["R"])[0]; }catch(e){ snd="R"; } }
      SAYTXT=(S&&S.soundSay)?S.soundSay(String(snd).toUpperCase()):"rrrr";
      paintChip();
      if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ $("boostChip").style.display="none"; return; }
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
        window.addEventListener("pagehide",function(){ try{ st.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
        var AC=window.AudioContext||window.webkitAudioContext, bctx=new AC();
        var src=bctx.createMediaStreamSource(st), an=bctx.createAnalyser(); an.fftSize=512; src.connect(an);
        var td=new Uint8Array(an.fftSize), t0=performance.now(), calS=0,calN=0,thr=0,voiced=0;
        (function tick(){
          an.getByteTimeDomainData(td);
          var sum=0; for(var i=0;i<td.length;i++){ var d=(td[i]-128)/128; sum+=d*d; }
          var rms=Math.sqrt(sum/td.length), now=performance.now();
          if(now-t0<450){ calS+=rms; calN++; }
          else { if(!thr) thr=Math.max(0.05,(calS/Math.max(1,calN))*3.5);
            if(rms>thr){ voiced++; if(voiced>=6 && playing && !boost.on && !boost.cool) fireBoost(); }
            else voiced=0; }
          requestAnimationFrame(tick);
        })();
      }).catch(function(){ $("boostChip").style.display="none"; });
    })();

    // ---- round over ----
    function bankAndContinue(){ location.href="/charge.html?daily=1&banked="+score(); }
    function score(){ return (dist/10|0)+coins*2; }
    function endRound(){
      if(!playing)return; playing=false; clearInterval(distIv); clearInterval(rampIv); clearInterval(timeIv);
      var pts=score(), cshare=Math.min(10,(coins/2)|0);
      try{ if(cshare&&S&&S.addCoins)S.addCoins(cshare); }catch(e){}
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        $("endTitle").textContent="+"+pts+" points! 🏆";
        $("endSub").textContent="Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        $("endOvl").classList.add("show");
        setTimeout(bankAndContinue,1400);
        return;
      }
      $("endTitle").textContent=dist>=300?"Speed legend! 🏆":"Great run!";
      $("endSub").textContent="You ran "+dist+"m and grabbed "+coins+" coins"+(cshare?(" · +"+cshare+" 🪙"):"")+"!";
      $("endOvl").classList.add("show");
    }
    $("endCharge").onclick=backToCharge;
    $("endHome").onclick=function(){ location.href="/today.html#play"; };
    $("close").onclick=function(){ if(playing){ playing=false; clearInterval(distIv); clearInterval(rampIv); clearInterval(timeIv); } if(isDaily){ bankAndContinue(); return; } location.href="/today.html#play"; };
  </script>
</body>
</html>
