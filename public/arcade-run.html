<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Sound Sprint</title>
  <link href="/fonts.css" rel="stylesheet">
  <meta name="theme-color" content="#aee6ff" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#aee6ff,#cff2e2 60%,#d8f7e0);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.3);}
    #tapHint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-family:"Baloo 2";font-weight:800;font-size:15px;color:#c8f0d4;z-index:4;pointer-events:none;}
    /* ── designed HUD kit (handoff section 4) ── */
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;z-index:5;}
    #close{border:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#b08d63;font-size:19px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 4px 0 rgba(40,110,80,.30);}
    .hudpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 14px;box-shadow:0 4px 0 rgba(40,110,80,.30);font-family:"Baloo 2";font-weight:800;font-size:16px;color:#4a2c14;}
    #score{flex:none;}
    #hudspacer{flex:1;}
    #timer{color:#ff5c74;letter-spacing:1px;}
    /* ── warm-card overlays (handoff section 5) ── */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(30,22,50,.55);display:none;align-items:center;justify-content:center;padding:24px;}
    .ovl.show{display:flex;}
    .ovlCard{background:#fff6e9;border-radius:28px;padding:58px 20px 22px;width:100%;max-width:330px;text-align:center;box-shadow:0 18px 40px rgba(30,22,50,.45);position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;}
    .ovlEcho{position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:106px;height:106px;filter:drop-shadow(0 8px 12px rgba(30,22,50,.3));}
    .ovl .big{font-size:56px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:24px;color:#4a2c14;line-height:1.18;}
    .ovl h2 b{color:#7048c9;}
    .ovl p{color:#b08d63;font-weight:800;font-size:14.5px;max-width:270px;}
    .statRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .statPill{background:#fff;border-radius:99px;padding:8px 15px;font-family:"Baloo 2";font-weight:800;font-size:14.5px;color:#4a2c14;box-shadow:0 3px 0 rgba(120,80,20,.12);}
    .btn{border:none;border-radius:20px;padding:15px 30px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 6px 0 #ef6f23;cursor:pointer;transition:transform .05s;margin-top:4px;width:100%;}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #46a302;}
    .btn.blue{background:linear-gradient(180deg,#5cc6ff,#1cb0f6);box-shadow:0 6px 0 #1480c0;}
    .btn.blue:active{box-shadow:0 2px 0 #1480c0;}
    .btn.ghost{background:none;box-shadow:none;color:#b08d63;text-transform:none;font-size:13px;width:auto;padding:8px;}
    /* Echo speaks the win: bubble with a tail toward the leap; numbers fade in later */
    #endTitle{position:relative;background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 6px 16px rgba(74,44,20,.12);display:inline-block;}
    #endTitle:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:#fff;border-radius:3px;}
    #endSub.later{display:block!important;opacity:0;font-size:12.5px;color:var(--muted,#b08d63);transition:opacity .5s ease;margin-top:2px;}
    #endSub.later.in{opacity:1;}
    /* ── end-overlay celebration: star drop + Echo leap (Duolingo-ABC three-element stack) ── */
    #endOvl .ovlCard{padding-top:24px;}
    .endStar{animation:starDrop .35s cubic-bezier(.3,1.6,.5,1) both;}
    @keyframes starDrop{0%{transform:translateY(-64px) scale(.4);opacity:0}70%{transform:translateY(6px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
    .echoWin{position:relative;width:100%;height:96px;overflow:hidden;pointer-events:none;}
    .echoWin img{position:absolute;left:50%;bottom:-40px;width:118px;margin-left:-59px;filter:drop-shadow(0 6px 8px rgba(30,22,50,.18));animation:echoLeap .5s cubic-bezier(.3,1.4,.5,1) both,echoHop 1.5s ease-in-out .6s infinite;}
    @keyframes echoLeap{0%{transform:translateY(110px)}100%{transform:translateY(0)}}
    @keyframes echoHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px) rotate(-5deg)}}
    @media (prefers-reduced-motion: reduce){ .endStar,.echoWin img{animation:none;} }
    [hidden]{display:none!important;}
    /* ── the race's HUD, banner and card (27 Sep 2026) ── */
    #tapHint{color:#fff!important;text-shadow:0 2px 3px rgba(20,60,30,.55);}
    #timer{color:#4a2c14;letter-spacing:0;gap:8px;}
    #timer .wv{white-space:nowrap;}
    #timer .wbar{display:block;width:60px;height:10px;border-radius:99px;background:#e2f1e4;overflow:hidden;}
    #timer .wbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#58cc02,#1cb0f6);transition:width .25s;}
    #banner{position:absolute;left:0;right:0;top:17%;text-align:center;z-index:4;pointer-events:none;opacity:0;padding:0 16px;}
    #banner .pill{display:inline-block;background:rgba(255,255,255,.95);border-radius:26px;padding:10px 26px 12px;box-shadow:0 6px 0 rgba(30,90,50,.3);}
    #banner b{display:block;font-family:"Baloo 2";font-weight:800;font-size:38px;color:#2f8f3a;line-height:1.05;}
    #banner span{display:block;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#8a6f52;margin-top:2px;}
    #banner span:empty{display:none;}
    #banner.in{animation:bannerIn 1.9s ease both;}
    @keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px)}}
    @keyframes bannerFade{0%,100%{opacity:0}15%,80%{opacity:1}}
    #revHearts{display:flex;justify-content:center;gap:8px;}
    #revHearts .wdot{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#f3e3cf;color:#b08d63;font-family:"Baloo 2";font-weight:800;font-size:17px;}
    #revHearts .wdot.on{background:#58cc02;box-shadow:0 3px 0 #46a302;}
    #revHearts .wdot svg{width:20px;height:20px;}
    @media (prefers-reduced-motion: reduce){ #banner.in{animation-name:bannerFade;} }
    /* ── the start card: three pictures from the race itself (1 Oct 2026) ──
       Each picture sits on the road's own blue, so the card shows the race the
       child is about to run; the words under them are for whoever can read. */
    #startTips{display:flex;gap:8px;width:100%;margin:2px 0 2px;}
    .tip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:"Baloo 2";font-weight:800;font-size:13.5px;line-height:1.1;color:#44270f;}
    .tipPic{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;width:100%;height:76px;border-radius:17px;background:#7591c1;border:2px solid #fffdf5;box-shadow:0 3px 0 #cbb694;overflow:hidden;transition:transform .2s,box-shadow .2s;}
    .tipPic img{display:block;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(40,47,57,.25));}
    .tipPic .rock{width:42%;height:34px;margin-top:20px;}
    .tipPic .cactus{width:38%;height:50px;}
    .tipPic .coin{width:52%;height:46px;}
    /* the lanes: two dashed lines, the child's own runner, an arrow each way */
    .tipPic .dash{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.9) 0 9px,transparent 9px 17px);}
    .tipPic .arrow{position:absolute;bottom:16px;width:16px;height:16px;}
    #tipBuddy{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:32px;height:32px;line-height:0;}
    #tipBuddy .crafted-buddy{width:100%!important;height:100%!important;}
    /* the fox is the race's own runner, seen from behind: the same crop the canvas draws */
    #tipBuddy.fox{width:27px;height:47px;bottom:5px;background:url('/assets/crafted/fox-runner.webp') 50.4% 49.5%/261.25% auto no-repeat;}
    /* Echo names each picture as he says it */
    .tip.on .tipPic{transform:translateY(-4px);box-shadow:0 7px 0 #cbb694,0 0 0 3px #19b6bb;}
    #startAct{display:flex;align-items:center;justify-content:center;width:100%;min-height:62px;}
    #startGo{margin-top:0;}
    #startGo svg{width:17px;height:17px;vertical-align:-2px;margin-right:5px;fill:#fff;}
    @media (max-width:350px){ .tipPic .arrow{width:14px;height:14px;bottom:15px;} #tipBuddy{width:27px;height:27px;} #tipBuddy.fox{width:24px;height:42px;} }
    @media (prefers-reduced-motion: reduce){ .tipPic{transition:none;} .tip.on .tipPic{transform:none;} }
  </style>

  <script src="/sona.js"></script>
  <script src="/crafted-buddies.js"></script>
  <script>
    // Check access before any game resources start. The earned speech token
    // remains a separate requirement; a catalog unlock never creates one.
    var gameEntryAllowed=false;
    (function () {
      var S=window.Sona, q=new URLSearchParams(location.search);
      if(!S)return;
      var earned=q.get("from")==="charge";
      if(!S.gameAccess("run",{run:q.get("daily")==="1",earned:earned}).allowed){S.gameBounce("run");return;}
      if(!earned){location.replace("/today.html");return;}
      gameEntryAllowed=true;
    })();
  </script>
  <script>window.SLOW_HELP={phase:"run",action:"slow the course",earned:"Slow course!",eligible:function(){return !falling.on&&!raceHeld;}};</script>
  <script src="/arcade-speech-help.js"></script>
  <script src="/arcade-sayit.js"></script>
  <script>
    if(gameEntryAllowed){
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    // ── the mic and this game's own sounds never overlap (24 Sep 2026) ──
    // On an iPhone a page holding the mic runs as a phone call: the volume
    // buttons change CALL volume and every chime is processed like a call.
    // So no game sound plays while the keep-playing mic is open (a sound
    // asked for then is dropped; the game is paused behind the card anyway),
    // none waits on a mic request that hasn't settled, none plays in the
    // first SETTLE_MS after the mic closes (the phone switches back in
    // silence, not under a chime), and the mic never opens until QUIET_MS
    // after the last sound began: the longest chime ("complete") rings about
    // 0.6 s and the rest covers speaker and Bluetooth delay, so a chime's
    // tail can never answer the card for the child. chimeEnd (2 Oct 2026) is
    // when the last chime asked for will have stopped ringing: Echo's voice
    // on the say-it card waits for that, not for the mic's quiet window, so
    // he starts as soon as the speaker is free (/arcade-sayit.js).
    var SETTLE_MS=200, QUIET_MS=900, quietUntil=0, micClosedAt=-1e9, chimeEnd=0;
    var rv={st:null,pending:0,gen:0,raf:0,t:0,ctx:null,src:null,floor:-1};   // floor: the room's quiet level, measured once per page (see listenFor)
    function chimeLen(n){ return window.SayIt?SayIt.chimeMs(n):600; }
    function sfx(n){
      if(rv.st||slowTurn) return;
      if(rv.pending){ chimeEnd=Math.max(chimeEnd,performance.now()+60+chimeLen(n)); setTimeout(function(){ sfx(n); },60); return; }
      var wait=micClosedAt+SETTLE_MS-performance.now();
      if(wait>0){ quietUntil=Math.max(quietUntil,performance.now()+wait+QUIET_MS); chimeEnd=Math.max(chimeEnd,performance.now()+wait+chimeLen(n)); setTimeout(function(){ sfx(n); },wait); return; }
      quietUntil=Math.max(quietUntil,performance.now()+QUIET_MS);
      chimeEnd=Math.max(chimeEnd,performance.now()+chimeLen(n));
      try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){}
    }

    // ---- charge gate + daily plumbing ----
    var SELF="arcade-run.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ try{sessionStorage.removeItem("sona.play.active");}catch(e){} location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ var _t=sessionStorage.getItem("sona.play.token"); if(_t===SELF||_t==="1"){ tok=true; sessionStorage.setItem("sona.play.active",SELF); sessionStorage.removeItem("sona.play.token"); } else if(sessionStorage.getItem("sona.play.active")===SELF){ tok=true; } }catch(e){}
    if(!tok){ try{ $("needTitle").textContent="Sound Sprint needs a ticket!"; }catch(e){} $("needOvl").classList.add("show"); }

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    // ── the start card: Echo says how to play (1 Oct 2026) ──
    // Travis: "when a kid is about to start playing sound sprint, we want the
    // voice ... to say instructions like move side to side, avoid the cactus,
    // go after the gold star ... so that they have instruction on what to do."
    // A child's first three races open on a card (three pictures from the race
    // and one button) and the race is HELD behind it: nothing moves, spawns or
    // counts until it starts. The count is the child's own (Sona.kkey), and it
    // goes up when a race starts from the card, so a card nobody answered is
    // shown again. A page without the earned ticket shows its own card instead.
    var START_RACES=3, STARTKEY=(S&&S.kkey)?S.kkey("sona.sprintintro.v1"):"sona.sprintintro.v1";
    // (a phone that won't let the page read its storage could never count to three: no card there)
    function startSeen(){ try{ return Math.max(0,parseInt(localStorage.getItem(STARTKEY)||"0",10)||0); }catch(e){ return START_RACES; } }
    var raceHeld=tok&&startSeen()<START_RACES;

    // ---- the runner: 3 lanes, dodge rocks, grab coins ----
    var LANES=3, ROADF=0.74, playing=!raceHeld, dist=0, coins=0, speed0=H*0.0029, speed=speed0, lane=1, laneX=1;
    var BESTK="sona.best.run", BEST=0; try{ BEST=parseInt(localStorage.getItem(BESTK)||"0",10)||0; }catch(e){}
    var REV=3, reviveWait=false;   // say-the-sound cards: one at each checkpoint

    // ── the race: three stretches, then the finish line (27 Sep 2026) ──
    // The round Travis said yes to for Fruit Slice, as a race, with what the

      if(FINISH_ART.complete&&FINISH_ART.naturalWidth){ var fw=road+24, fh=fw*FINISH_ART.naturalHeight/FINISH_ART.naturalWidth;

      playing=true; startClocks(); startStretch(0);
    }
    // What Echo says, true to the race: the things to dodge are a rock, a
    // cactus, a cone and a log, a golden coin is the coin magnet, and there is
    // no gold star. An iPhone plays nothing on a new page until a tap, so the
    // tap is "Let's run!": Echo says the line while the card stays, and the
    // race starts the moment he stops.
    var START_LINE="Tap a lane to move side to side. Dodge the rocks and the cactus, and grab the gold coins!";
    // Never a dead end, never a long silence. Echo has START_WAIT_MS to
    // begin: the voice service gets that long to answer from when the card
    // shows, and the race never waits longer than that after the tap. A line
    // that did not come in time is not asked for again after the tap; the
    // race just starts.
    // Once his line is playing it gets its own length and a beat (it runs
    // about eight seconds, so one cap counted from the tap would cut him off
    // mid-sentence). The fallback gives no sign of when it begins, so it gets
    // one allowance that fits a second ask of the voice service and the whole
    // line. And a double tap must not skip what its first tap asked for:
    // "Skip" counts only after START_GUARD_MS.
    var START_WAIT_MS=7000, START_TAIL_MS=1500, START_FALLBACK_MS=12000, START_GUARD_MS=600;
    var sc={gen:0,saying:false,saidAt:0,cap:0,tips:[],media:null,fallback:false,line:null,ready:false,bytes:null,late:false};
    var START_BTN=$("startGo").innerHTML;
    function startVoiceOn(){ var p=S.getProfile(); return !(p.voiceOn===false||Number(p.volume)===0); }
    // Echo's own voice (/api/tts), asked for as the card shows so the tap
    // finds it ready: no wait between the tap and his first word.
    function loadStartLine(){
      sc.ready=false; sc.late=false; sc.bytes=null;
      var ctl=window.AbortController?new AbortController():null, to=setTimeout(function(){ sc.late=true; if(ctl)ctl.abort(); },START_WAIT_MS), ask;
      try{ ask=fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:START_LINE,voice:S.getProfile().voiceId||"",stable:true}),signal:ctl?ctl.signal:undefined}); }catch(e){ ask=Promise.reject(e); }
      sc.line=ask.then(function(r){ return r.ok?r.arrayBuffer():null; })
        .then(function(b){ return b&&b.byteLength?b:null; },function(){ return null; })
        .then(function(b){ clearTimeout(to); sc.bytes=b; sc.ready=true; return b; });
    }
    function tipOn(i){ var t=$("startTips").children; for(var k=0;k<t.length;k++) t[k].classList.toggle("on",k===i); }
    function paintStart(){
      var b=$("startGo");
      // While Echo talks, the one button is the way past him: a cream second
      // choice, so the teal one stays the button that asked for him.
      b.className=sc.saying?"btn ghost":"btn"; if(sc.saying) b.textContent="Skip"; else b.innerHTML=START_BTN;
      echoPose($("startEcho"),sc.saying?"talk":"wave"); if(!sc.saying) tipOn(-1);
    }
    function startCap(my,ms){ clearTimeout(sc.cap); sc.cap=setTimeout(function(){ if(my===sc.gen&&raceHeld) beginRace(); },ms); }
    function stopStartVoice(){
      var was=sc.saying; sc.gen++; sc.saying=false; clearTimeout(sc.cap); sc.tips.forEach(clearTimeout); sc.tips=[];
      if(sc.media){ var m=sc.media; sc.media=null; m.stop(); }
      // sona.js's own stop: an empty line strands whatever its pipeline was saying
      if(sc.fallback){ sc.fallback=false; try{ S.speakNow(""); }catch(e){} }
      // his line was a sound like any other: the mic waits it out (QUIET_MS, above)
      if(was) quietUntil=Math.max(quietUntil,performance.now()+QUIET_MS);
      paintStart();
    }
    // The line plays as media (Sona.mediaPCM), on every phone and browser. The
    // iPhone app needs that (the ring/silent switch silences Web Audio there,
    // sona.js says why), and a browser allows it because the line starts
    // inside the tap. If it can't play, or the voice service gave no line,
    // sona.js's own pipeline says it: Echo through Web Audio, which the tap
    // woke (speakUnlock), and the browser's voice as the last resort.
    function sayStart(my,bytes){
      if(my!==sc.gen||!sc.saying) return;
      if(!bytes&&sc.late){ beginRace(); return; }   // the voice service never answered: no second wait
      // Never into a mic (2 Oct 2026): the race is held, so no say-it card or
      // sound power can be listening; if one ever were, he stays quiet.
      if(rv.st||rv.pending||reviveWait||slowTurn){ beginRace(); return; }
      if(!bytes||!S.mediaPCM){ sayStartFallback(my); return; }
      var ms=Math.ceil(bytes.byteLength/48), m=S.mediaPCM(bytes,{volume:S.getProfile().volume});   // 24 kHz, 16-bit: 48 bytes a millisecond
      // his line is a sound like a chime: the mic waits it out (QUIET_MS)
      quietUntil=Math.max(quietUntil,performance.now()+ms+QUIET_MS);
      sc.media=m;
      // mediaPCM gives up on a line that never starts after four seconds, and
      // ends one that plays at its length and a beat; this is the backstop
      startCap(my,Math.max(4000,ms+START_TAIL_MS)+500);
      // Echo names each picture about when he says it (the three parts of the line)
      [0,0.38,0.73].forEach(function(at,i){ sc.tips.push(setTimeout(function(){ if(my===sc.gen) tipOn(i); },ms*at)); });
      m.done.then(function(how){ if(my!==sc.gen) return; sc.media=null; if(how==="failed") sayStartFallback(my); else beginRace(); });
    }
    function sayStartFallback(my){
      if(my!==sc.gen||!sc.saying) return;
      sc.tips.forEach(clearTimeout); sc.tips=[]; tipOn(-1);
      sc.fallback=true; startCap(my,START_FALLBACK_MS);
      var said=null; try{ said=S.speakNow(START_LINE); }catch(e){}
      function over(){ if(my===sc.gen) beginRace(); }
      Promise.resolve(said).then(over,over);
    }
    $("startGo").onclick=function(){
      if(!raceHeld) return;
      if(sc.saying){ if(performance.now()-sc.saidAt>=START_GUARD_MS) beginRace(); return; }   // "Skip"
      // sound is off: there is no line to wait for
      if(!sc.line||!startVoiceOn()){ beginRace(); return; }
      var my=++sc.gen; sc.saying=true; sc.saidAt=performance.now(); paintStart();
      try{ if(S.speakUnlock)S.speakUnlock(); }catch(e){}
      startCap(my,START_WAIT_MS);
      // in hand already: say it inside this tap. Still on its way: the moment it lands.
      if(sc.ready) sayStart(my,sc.bytes); else sc.line.then(function(b){ sayStart(my,b); });
    };
    // Locked or switched away mid-line: Echo stops (a hidden page never keeps
    // talking) and the race stays held. The card is still up on the way back,
    // with its button, because the phone needs a new tap before it speaks.
    function startBackground(){ if(raceHeld&&sc.saying) stopStartVoice(); }
    if(S.onBackground) S.onBackground(startBackground); else window.addEventListener("pagehide",startBackground);
    // Back on screen with the card still waiting and no line in hand: a phone
    // locked while the line was on its way drops the ask, and the tap that is
    // coming would then start the race with nothing said. So it is asked for
    // once more, here, where the wait is behind the card and not after a tap.
    document.addEventListener("visibilitychange",function(){ if(!document.hidden&&raceHeld&&!sc.saying&&sc.line&&sc.ready&&!sc.bytes&&startVoiceOn()) loadStartLine(); });
    if(raceHeld){
      // the lane picture shows the child's own runner, as the race draws it
      (function(){ var id=(S.getProfile()||{}).character||"fox", el=$("tipBuddy"), face=id!=="fox"&&window.SonaCraftedBuddies?SonaCraftedBuddies.markup(id,36):"";
        if(face){ el.className=""; el.innerHTML=face; } })();
      if(startVoiceOn()) loadStartLine();
      $("startOvl").classList.add("show");
    } else beginRace();
    requestAnimationFrame(draw);

    // ── Shared short listening path for checkpoints and sound-powered help ──
    // (24 Sep 2026) STAR MODE is gone. It held the mic open for the whole
    // game so a shout could fire a power-up, which kept an iPhone in
    // phone-call audio from the first frame to the last. The mic now opens
    // only for checkpoints or a requested help turn, after the quiet window
    // above, and closes before a chime. Native recognition supplements the
    // sound-shape check for help turns when available; audio stays on device.
    // These gameplay turns never become practice data.
    var SND="R", SAYTXT="rrrr", CAN_LISTEN=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
    (function(){
      var snd=""; try{ snd=sessionStorage.getItem("sona.boost.sound")||""; }catch(e){}
      if(!snd){ try{ snd=((S&&S.getProfile&&S.getProfile().focusSounds)||["R"])[0]; }catch(e){ snd="R"; } }
      SND=String(snd).toUpperCase(); SAYTXT=(S&&S.soundSay)?S.soundSay(SND):"rrrr";
    })();
    function listenNote(t){ try{ $("revListen").textContent=t;if(slowTurn&&!slowTurn.finishing)$("slowStatus").textContent=t; if(slowTurn&&!slowTurn.finishing)echoPose($("slowKeys").querySelector("img"),"listen"); echoPose(document.querySelector("#revOvl .ovlEcho"),reviveSpeaking()?"talk":"listen"); }catch(e){} }
    // Echo's clay pose shows what he is doing (29 Sep 2026). On the slow-down
    // button he talks while his line and the sound play; on the say-it card
    // (2 Oct 2026) he talks while he asks, and listens once it is the
    // child's turn.
    var POSE="/assets/crafted/echo-";
    function echoPose(img,p){ if(img&&img.getAttribute("src")!==POSE+p+".webp")img.src=POSE+p+".webp"; }
    // Held in a variable: a preload nobody holds is collected, and the pose
    // then loads late instead of swapping in at once.
    var POSE_KEEP=["talk","listen","welcome","wave"].map(function(p){ var i=new Image(); i.src=POSE+p+".webp"; return i; });
    // It listens while the turn's mic hears ("I'm listening…") and rests
    // again once the turn is over.
    var slowPaint=paintSlowKeys;
    paintSlowKeys=function(){ slowPaint(); if(!slowTurn||slowTurn.finishing)echoPose($("slowKeys").querySelector("img"),"welcome"); };
    // ── Echo asks on the card (2 Oct 2026) ──
    // Travis: "there's no voice telling them to say it. Most of these kids
    // can't read". The card used to open its mic under a line of text. Now
    // Echo says "To keep playing, say", one take of the sound in Rachel's
    // own voice, then "Go!", and only then the mic opens, a short tail after
    // his last word. The voice is /arcade-sayit.js's, the same in all five
    // round games; it waits for a mic request still settling before the
    // speaker route starts, and stops when the card closes or the page hides
    // (closeReviveMic). A page without the helper just listens, as before.
    // (2 Oct 2026, review) Echo waits only for what is still sounding: a mic
    // request still settling, the phone's switch back from a mic just closed,
    // a chime still ringing (chimeEnd), not the mic's own quiet window. After
    // his "Go!" the mic waits SayIt.VOICE_TAIL_MS (250 ms, the tail every
    // listening page keeps), not QUIET_MS: that is timed from when a chime
    // BEGINS, and after a line that has already ended it left a child who
    // answered right on "Go!" talking to a closed mic. On the website his
    // voice plays through this page's own context (rv.ctx), which the
    // child's taps on the game have already woken.
    var sayVoice=window.SayIt?SayIt.voice({
      up:function(){ return reviveWait&&!slowTurn; },
      wait:function(){ return rv.pending||rv.st?40:Math.max(chimeEnd,micClosedAt+SETTLE_MS)-performance.now(); },
      note:listenNote,
      clip:function(){ return S.ALL_SOUNDS.indexOf(SND)>=0?"/coach/say-echo/"+SND+"-sound.wav":""; },
      ctx:function(){ if(!rv.ctx){ var AC=window.AudioContext||window.webkitAudioContext; rv.ctx=new AC(); } return rv.ctx; },
      listen:function(spoke){ if(spoke)quietUntil=Math.max(quietUntil,performance.now()+SayIt.VOICE_TAIL_MS); openReviveMic(); }
    }):null;
    function speakRevive(){
      // a sound turn still closing hands the card the speaker once it has
      if(slowTurn){ slowTurn.cancelled=true; finishSlowKeys(false).then(function(){ if(reviveWait&&!document.hidden) speakRevive(); }); return; }
      if(sayVoice)sayVoice.speak(); else openReviveMic();
    }
    function reviveSpeaking(){ return !!sayVoice&&sayVoice.speaking(); }
    function closeReviveMic(){
      if(sayVoice)sayVoice.stop();
      rv.gen++; clearTimeout(rv.t); if(rv.raf)cancelAnimationFrame(rv.raf); rv.raf=0;
      try{ if(rv.src)rv.src.disconnect(); }catch(e){} rv.src=null;
      if(rv.st){ try{ rv.st.getTracks().forEach(function(t){t.stop();}); }catch(e){} rv.st=null; micClosedAt=performance.now(); }
      listenNote("Get ready…");
    }
    // A request that was already late when it settled asks again if the card
    // is still up and on screen (24 Sep 2026). The phone can be locked while
    // it is asking: the ask made on the way back finds that request still
    // pending and stands down, so without this the card waited on "Get
    // ready…" for good and only "I'm done playing" got the child out.
    function askAgain(){ if(micWanted()&&!document.hidden&&!rv.st) openReviveMic(); }
    function openReviveMic(){
      if(!micWanted()||reviveSpeaking()||rv.st||rv.pending||document.hidden) return;
      var wait=quietUntil-performance.now();
      if(wait>0){ clearTimeout(rv.t); rv.t=setTimeout(openReviveMic,wait); return; }
      var gen=++rv.gen; rv.pending++;
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
        rv.pending--;
        // the card closed (or the page hid) while the phone was asking: this
        // stream is already late, so it goes straight back
        if(gen!==rv.gen||!micWanted()||document.hidden){ try{ st.getTracks().forEach(function(t){t.stop();}); }catch(e){} micClosedAt=performance.now(); askAgain(); return; }
        rv.st=st;
        if(slowTurn){
          var turn=slowTurn;
          try{turn.native=Promise.resolve(S.speechStart?S.speechStart({words:[SAYTXT],maxMs:SLOW_ASK.listen}):false);}catch(e){turn.native=Promise.resolve(false);}
          turn.native=turn.native.then(function(v){turn.nativeSettled=true;turn.nativeStarted=!!v;return v;},function(){turn.nativeSettled=true;return false;});
          // a sound heard just before the limit still earns it (2 Oct 2026,
          // as Fruit Slice): heard, the mic stays open 550 ms more for
          // Apple's recognizer, and the limit must not throw that try away
          turn.timer=setTimeout(function(){if(slowTurn===turn)finishSlowKeys(!!turn.heardAt);},SLOW_ASK.listen);
        }
        listenFor(st,gen);
      }).catch(function(){
        // a request that failed was the mic too (an iPhone records before
        // it answers): Echo's voice waits SETTLE_MS after it, as Fruit Slice's
        rv.pending--;micClosedAt=performance.now();
        // a request cut short by the page hiding asks again on the way back
        if(gen!==rv.gen||!micWanted()||document.hidden){ askAgain(); return; }
        if(slowTurn){slowMicFailed("Microphone is off");return;}
        // no microphone: the card can't hear anyone, so the round ends kindly
        reviveWait=false; $("revOvl").classList.remove("show"); endRound();
      });
    }
    // ── what counts as the child on the card (24 Sep 2026) ──
    // The bar a sound must clear is 3.5× the room's quiet level, and that
    // level is the page's, not the card's: rv.floor is the 20th-percentile
    // loudness of the quietest FLOOR_MS the card's mic has heard on this
    // page, and it only ever goes DOWN. The first cut of this change
    // averaged the first 450 ms of every card instead, and a card that says
    // "Say rrrr!" opens its mic exactly when an eager child is already
    // saying it: their own voice became the "room", the bar landed above
    // it, and nothing they said could answer the card. So: a low
    // percentile, which a voice filling most of the stretch can't lift;
    // only-down, so nothing a child says ever raises it and one quiet
    // breath (or a later card) mends a floor a talking child set; and the
    // last HEARD_MS of frames are judged against the CURRENT floor, so a
    // try said before that breath still counts the moment it comes. The
    // 0.05 minimum, the 6-frame burst and the family check are unchanged.
    // "I'm listening…" shows only once there is a floor to listen against.
    var FLOOR_MS=450, HEARD_MS=3000;
    function p20(list){ var a=list.slice().sort(function(x,y){ return x-y; }); return a[Math.floor((a.length-1)*0.2)]; }
    function listenFor(st,gen){
      var an, td, fd, binHz, heard=[], said=false;
      try{
        if(!rv.ctx){ var AC=window.AudioContext||window.webkitAudioContext; rv.ctx=new AC(); }
        if(rv.ctx.state==="suspended") rv.ctx.resume();
        rv.src=rv.ctx.createMediaStreamSource(st); an=rv.ctx.createAnalyser(); an.fftSize=512; rv.src.connect(an);
        td=new Uint8Array(an.fftSize); fd=new Uint8Array(an.frequencyBinCount); binHz=rv.ctx.sampleRate/an.fftSize;
      }catch(e){ if(slowTurn){slowMicFailed("Microphone unavailable");return;} closeReviveMic(); reviveWait=false; $("revOvl").classList.remove("show"); endRound(); return; }
      // family check: the burst must SOUND like the target's family (voiced
      // vs hiss) to fire — a scream or an S can't revive an R kid. Shape
      // numbers only; nothing recorded (see Sona.frameShape).
      function famOK(shp){ if(!shp||!shp.m) return true; var cent=shp.fm/shp.m, high=shp.hm/shp.m, fam=(window.Sona&&Sona.soundFamily)?Sona.soundFamily(SND):"any"; if(fam==="low") return !(cent>1800&&high>0.22); if(fam==="hiss") return !(cent<1100&&high<0.10); return true; }
      (function tick(){
        if(gen!==rv.gen) return;
        var now=performance.now();
        // belt and braces: nothing plays while this mic is open, but if a
        // sound ever did, its frames would be dropped: never judged, never
        // part of the floor, never joined to a burst after it
        if(now<quietUntil){ heard=[]; rv.raf=requestAnimationFrame(tick); return; }
        an.getByteTimeDomainData(td);
        var sum=0; for(var i=0;i<td.length;i++){ var d=(td[i]-128)/128; sum+=d*d; }
        var shape=null; if(window.Sona&&Sona.frameShape){ an.getByteFrequencyData(fd); shape=Sona.frameShape(fd,binHz); }
        heard.push({t:now,r:Math.sqrt(sum/td.length),s:shape});
        while(now-heard[0].t>HEARD_MS) heard.shift();
        if(now-heard[0].t>=FLOOR_MS){
          var w=[]; for(var k=heard.length-1;k>=0&&now-heard[k].t<=FLOOR_MS;k--) w.push(heard[k].r);
          var q=p20(w); if(rv.floor<0||q<rv.floor) rv.floor=q;
        }
        if(rv.floor>=0){
          if(!said){ said=true; listenNote("I'm listening…"); }
          var thr=Math.max(0.05,rv.floor*3.5), voiced=0, shp=null;
          for(var j=0;j<heard.length;j++){ var f=heard[j];
            if(f.r>thr){ voiced++;
              if(f.s){ if(!shp)shp={m:0,fm:0,hm:0}; shp.m+=f.s.m; shp.fm+=f.s.fm; shp.hm+=f.s.hm; }
              if(voiced>=6){ if(!famOK(shp)){ voiced=0; shp=null; } else {
                if(slowTurn){
                  if(!slowTurn.heardAt)slowTurn.heardAt=now;
                  // Give on-device recognition the rest of a short utterance;
                  // the first six voiced frames alone can be only its onset.
                  if(now-slowTurn.heardAt<550){rv.raf=requestAnimationFrame(tick);return;}
                }
                closeReviveMic(); doRevive(); return;
              } } }
            else { voiced=0; shp=null; } }
        }
        rv.raf=requestAnimationFrame(tick);
      })();
    }
    // lock/app-switch fires visibilitychange, NOT pagehide — a mic left open
    // there stays lit in a pocket, and Echo stops mid-word. Coming back to
    // the card asks again, out loud, then listens.
    function speechBackground(){if(slowTurn){slowTurn.cancelled=true;finishSlowKeys(false);}else closeReviveMic();}
    if(window.Sona&&Sona.onBackground) Sona.onBackground(speechBackground); else window.addEventListener("pagehide",speechBackground);
    document.addEventListener("visibilitychange",function(){ if(!document.hidden&&reviveWait&&!slowTurn) speakRevive(); });

    // ---- round over ----
    function bankAndContinue(){ S.finishGameTurn("run",score()); location.href="/charge.html?daily=1&banked="+score(); }
    function score(){ return (dist/10|0)+coins*2; }
    function endRound(){
      if(slowTurn){slowTurn.cancelled=true;return finishSlowKeys(false).then(endRound);}
      closeReviveMic();
      if(window.__ended)return; window.__ended=true;
      S.finishGameTurn("run",isDaily?score():null);
      playing=false; reviveWait=false; phase="done"; clearInterval(distIv); clearInterval(rampIv);
      var isBest=dist>BEST; if(isBest){ BEST=dist; try{ localStorage.setItem(BESTK,String(BEST)); }catch(e){} }
      var pts=score(), cshare=Math.min(10,(coins/2)|0);
      try{ if(cshare&&S&&S.addCoins)S.addCoins(cshare); }catch(e){}
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        if(pts===0){ $("endEmoji").style.opacity=".25"; } // gentle zero tier: dim the star, keep it warm
        $("endTitle").textContent=pts===0?"Good try!":("+"+pts+" points!");
        $("endSub").textContent=pts===0?"On to the next game…":"Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        $("endOvl").classList.add("show");
        setTimeout(bankAndContinue,1400);
        return;
      }
      if(pts===0){
        // gentle zero tier: encouraging copy, dimmed star, happy Echo, one warm "again" button
        $("endEmoji").style.opacity=".25";
        $("endTitle").textContent="Good try! Wanna go again?";
        $("endSub").className=""; $("endSub").style.display="none";
        $("endCharge").style.display="none";
        var ea=$("endAgain"); ea.textContent="Yes! Play again"; ea.style.display=""; ea.onclick=backToCharge;
        $("endOvl").classList.add("show");
        return;
      }
      // one reward per moment: star + one line + Echo — no stat rows or coin counters here
      $("endTitle").textContent=finaleDone?"You won the race! "+coins+" coins!":isBest&&dist>0?"NEW BEST! Fast feet, my friend!":"Whew — what a run we had!";
      var _es=$("endSub"); _es.textContent=dist+" m · Best: "+BEST+" m"; _es.className="later";
      setTimeout(function(){ _es.classList.add("in"); },1000);
      $("endAgain").style.display="none";
      $("endOvl").classList.add("show");
    }
    $("endCharge").onclick=function(){ location.href=isDaily?"/charge.html?daily=1":(S.gameAccess("glide").allowed?"/charge.html?game=arcade-glide.html":"/activities.html"); };
    $("endHome").onclick=function(){ S.finishGameTurn("run"); location.href="/today.html#play"; };
    $("close").onclick=function(){
      if(window.__speechLeaving)return;window.__speechLeaving=true;
      function leave(){closeReviveMic();playing=false;clearInterval(distIv);clearInterval(rampIv);S.finishGameTurn("run");if(isDaily){bankAndContinue();return;}location.href="/today.html#play";}
      if(slowTurn){slowTurn.cancelled=true;finishSlowKeys(false).then(leave);}else leave();
    };
    }
  </script>
