<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Charge up!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    #leoRow{background:rgba(255,255,255,.78);border-radius:22px;padding:8px 20px;box-shadow:0 4px 14px rgba(15,40,70,.08);}
    #gameBg{position:fixed;inset:0;background:center/cover no-repeat;filter:blur(14px) brightness(1.06);transform:scale(1.1);opacity:0;transition:filter .6s ease,opacity .6s ease;pointer-events:none;}

    :root{
      --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302;
      --orange:#ff9600; --orange-d:#e08600; --ink:#3c3c3c; --muted:#777; --line:#e5e5e5;
      --bolt:#ffd21c;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#eaf7ff 0%,#f7fcff 55%,#fff);color:var(--ink);}
    #app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overscroll-behavior:none;}

    /* top bar */
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;}
    #close{border:none;background:none;color:#afafaf;font-size:26px;font-weight:800;cursor:pointer;line-height:1;padding:4px 8px;}
    #roundLbl{flex:1;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--muted);}
    #sumLbl{font-family:"Baloo 2";font-weight:800;font-size:17px;color:var(--orange-d);min-width:60px;text-align:right;}

    /* stage */
    #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 22px;gap:10px;min-height:0;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:clamp(34px,11vw,56px);line-height:1.05;color:var(--blue-d);}
    #leoRow{display:flex;align-items:center;gap:10px;}
    #leo{width:64px;height:64px;object-fit:contain;}
    #leo.cheer{animation:hop .5s ease;}
    @keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px) rotate(-5deg)}}
    #cueRow{min-height:20px;color:var(--muted);font-weight:700;font-size:14px;max-width:300px;}
    #mouth{display:none;width:110px;border-radius:14px;}

    /* THE GAME PANEL — literally charges up as reps land */
    #gamePanel{position:relative;width:min(74vw,270px);border-radius:26px;overflow:hidden;border:3px solid #e3ecf2;background:#f2f7fa;box-shadow:0 10px 0 rgba(20,90,150,.10);}
    #gpFill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,rgba(255,210,28,.55),rgba(255,177,0,.75));transition:height .35s cubic-bezier(.2,.9,.3,1.3);}
    #gpInner{position:relative;padding:22px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;}
    #gpEmoji{font-size:64px;line-height:1;filter:drop-shadow(0 6px 8px rgba(15,50,80,.2));}
    #gpName{font-family:"Baloo 2";font-weight:800;font-size:19px;color:var(--ink);}
    #gpState{font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--orange-d);min-height:20px;}
    #gamePanel.ready{border-color:var(--green);animation:readypulse 1s ease infinite;}
    @keyframes readypulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

    /* pips */
    #pips{display:flex;gap:9px;justify-content:center;}
    .pip{width:20px;height:20px;border-radius:50%;background:#e6edf2;box-shadow:inset 0 2px 4px rgba(0,0,0,.10);transition:transform .15s,background .15s;}
    .pip.on{background:var(--bolt);transform:scale(1.22);box-shadow:0 2px 8px rgba(245,184,0,.5);}

    /* mic bottom — AUTO-HOT, GREEN when it's the kid's turn */
    #bottom{display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 18px calc(16px + env(safe-area-inset-bottom));}
    #micBtn{width:86px;height:86px;border-radius:50%;border:none;background:#cfd8df;box-shadow:0 6px 0 0 #b7c2ca;display:flex;align-items:center;justify-content:center;transition:background .15s;pointer-events:none;}
    #micBtn svg{width:38px;height:38px;fill:#fff;}
    #micBtn.go{background:var(--green);box-shadow:0 6px 0 0 var(--green-d);animation:gopulse 1.1s infinite;}
    @keyframes gopulse{0%{box-shadow:0 0 0 0 rgba(88,204,2,.5),0 6px 0 0 var(--green-d)}70%{box-shadow:0 0 0 18px rgba(88,204,2,0),0 6px 0 0 var(--green-d)}100%{box-shadow:0 0 0 0 rgba(88,204,2,0),0 6px 0 0 var(--green-d)}}
    #micState{font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--green-d);min-height:22px;}
    #skip{border:none;background:none;color:#b8c4cd;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;padding:6px;}

    /* overlays */
    .ovl{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.97);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:10px;}
    .ovl.show{display:flex;}
    .ovl .big{font-size:70px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:28px;color:var(--ink);}
    .ovl p{color:var(--muted);font-weight:700;font-size:15px;max-width:310px;}
    .btn{border:none;border-radius:16px;padding:15px 32px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;transition:transform .05s;margin-top:4px;}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .btn.blue{background:var(--blue);box-shadow:0 5px 0 0 var(--blue-d);}
    .btn.ghost{background:none;color:var(--muted);box-shadow:none;text-transform:none;font-size:14px;}
    #runScore{font-family:"Baloo 2";font-weight:800;font-size:56px;color:var(--orange-d);line-height:1;}
    #runBest{font-family:"Baloo 2";font-weight:800;font-size:16px;color:var(--muted);}
  </style>
</head>
<body>
  <div id="gameBg"></div>
  <div id="app">
    <div id="top">
      <button id="close" aria-label="Close">✕</button>
      <div id="roundLbl"></div>
      <div id="sumLbl"></div>
    </div>

    <div id="stage">
      <div id="leoRow">
        <img id="leo" src="/coach/leo.png" alt="Leo" onerror="this.outerHTML='<div id=leo style=font-size:52px>🦁</div>'" />
        <div id="prompt">…</div>
      </div>
      <div id="cueRow"></div>
      <img id="mouth" alt="mouth position" />
      <div id="gamePanel">
        <div id="gpFill"></div>
        <div id="gpInner">
          <div id="gpEmoji">🍉</div>
          <div id="gpName">Fruit Slice</div>
          <div id="gpState">Say it to load the game!</div>
        </div>
      </div>
      <div id="pips"></div>
    </div>

    <div id="bottom">
      <button id="micBtn" aria-label="Microphone">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div id="micState"></div>
      <button id="skip">skip</button>
    </div>
  </div>

  <!-- already played today -->
  <div class="ovl" id="playedOvl">
    <div class="big">🏁</div>
    <h2>You already ran today!</h2>
    <p id="playedSub"></p>
    <button class="btn blue" id="playedArcade">🎮 Free play</button>
    <button class="btn ghost" id="playedHome">Back home</button>
  </div>

  <!-- run complete -->
  <div class="ovl" id="runOvl">
    <div class="big" id="runEmoji">🏆</div>
    <h2 id="runTitle">Run complete!</h2>
    <div id="runScore">0</div>
    <div id="runBest"></div>
    <p>Come back tomorrow for another shot!</p>
    <button class="btn" id="runDone">Done</button>
    <button class="btn ghost" id="runArcade">Free play in the arcade →</button>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var qp=new URLSearchParams(location.search);
    var S=window.Sona;
    var profile=S?S.getProfile():{volume:0.8};
    var SOUND=(qp.get("sound")||((profile.focusSounds&&profile.focusSounds[0])||"R")).toUpperCase();
    if(!(S&&S.WORDS&&S.WORDS[SOUND])) SOUND="R";
    var LEVEL=parseInt(qp.get("level"),10)||1;
    var NEED=(S?S.chargeState().need:5);
    var GAMES={ "arcade-slice.html":{e:"🍉",n:"Fruit Slice"}, "arcade-stack.html":{e:"🧱",n:"Block Stacker"}, "arcade-tiles.html":{e:"🎹",n:"Piano Tiles"}, "arcade-run.html":{e:"🏃",n:"Sound Sprint"}, "arcade-glide.html":{e:"🎈",n:"Flappy Glide"} };
    // The Daily Run = 4 different games from the 5-game arcade, rotating with
    // the date — tomorrow's run has a different lineup than today's.
    var ALL_ARCADE=["arcade-slice.html","arcade-tiles.html","arcade-stack.html","arcade-run.html","arcade-glide.html"];
    var _dayOff=(S&&S.dayNum)?(S.dayNum()%ALL_ARCADE.length):0;
    var DAILY_SEQ=[0,1,2,3].map(function(i){ return ALL_ARCADE[(_dayOff+i)%ALL_ARCADE.length]; });

    // ---- mode: daily run vs free play ----
    var isDaily = qp.get("daily")==="1" || qp.get("session")==="1";
    var freeGame = qp.get("game");
    if(freeGame && !GAMES[freeGame]) freeGame=null;
    var RUNKEY="sona.run.v1";
    function runGet(){ try{ return JSON.parse(sessionStorage.getItem(RUNKEY)||"null"); }catch(e){ return null; } }
    function runSave(r){ try{ sessionStorage.setItem(RUNKEY,JSON.stringify(r)); }catch(e){} }
    var run=runGet();

    var finishedNow=false;
    if(isDaily){
      // bank a returning round score FIRST (arcade sends ?banked=N)
      if(run&&run.active&&run.pending&&qp.get("banked")!=null){
        var b=Math.max(0,parseInt(qp.get("banked"),10)||0);
        run.sum+=b; run.scores.push(b); run.pending=false; run.round++; runSave(run);
      }
      if(!(run&&run.active)){
        if(S&&S.dailyInfo&&S.dailyInfo().playedToday){ /* shown at boot */ }
        else { run={active:true,round:0,sum:0,scores:[],sound:SOUND,level:LEVEL,pending:false}; runSave(run); }
      } else { SOUND=(run.sound||SOUND).toUpperCase(); LEVEL=run.level||LEVEL; }
      if(run&&run.active&&run.round>=DAILY_SEQ.length){ finishedNow=true; }
    }
    var GAME = isDaily ? DAILY_SEQ[Math.min(run?run.round:0,DAILY_SEQ.length-1)] : (freeGame||"arcade-slice.html");
    var GMETA=GAMES[GAME];

    // ---- content: SLP progression. Daily rounds climb the ladder — round 1 =
    // isolation, round 2 = syllables (rah/ree/roo), etc., capped at the child's rung.
    var RUNG=(S&&S.rungOf)?S.rungOf(SOUND):0;
    var useRung = isDaily ? Math.min(RUNG,(run?run.round:0)) : RUNG;
    var ITEMS=[];
    try{ ITEMS=(S.ladderContent(SOUND,useRung)||[]).filter(function(it){return it&&it.t;}); }catch(e){}
    if(!ITEMS.length){ try{ ITEMS=(S.ladderContent(SOUND,0)||[]).filter(function(it){return it&&it.t;}); }catch(e){} }
    if(!ITEMS.length) ITEMS=[{t:(S?S.soundSay(SOUND):"rrrr"),say:(S?S.soundSay(SOUND):"rrrr"),display:(S?S.soundSay(SOUND):"rrrr"),mode:"phoneme",level:"isolation"}];
    var ITEM=ITEMS[(Math.random()*ITEMS.length)|0];
    var NUMWORD={2:"two",3:"three",4:"four",5:"five",6:"six"};
    // What Leo SPEAKS. TTS cannot model a bare sound reliably (a synthesized
    // long "rrrr" comes out weird), so for isolation Leo speaks the INSTRUCTION
    // ("Make your R sound") and the human-recorded model clip — when one exists
    // at /coach/say/<SOUND>.mp3 — does the actual modeling.
    function sayLine(){
      var times=(NUMWORD[NEED]||NEED)+" times";
      var sust=(S&&S.soundSay)?S.soundSay(SOUND):SOUND.toLowerCase();
      if(ITEM.level==="isolation") return "Ready? Say "+sust+" — "+times+"!";
      return "Ready? Say "+(ITEM.display||ITEM.t)+" — "+times+"!";
    }
    // Prefer a real human recording of the whole prompt (Rachel!) if present.
    var CUETIP=""; try{ CUETIP=(S&&S.cue)?(S.cue(SOUND).tip||""):""; }catch(e){}
    function playPrompt(){
      var pre=Promise.resolve();
      if(!playPrompt._did && CUETIP){ playPrompt._did=true; pre=say(CUETIP); }
      return pre.then(function(){ return new Promise(function(res){
        if(ITEM.level!=="isolation"){ say(sayLine()).then(res); return; }
        try{
          var a=new Audio("/coach/say/"+SOUND+".mp3");
          var done=false; function fin(){ if(done)return; done=true; res(); }
          a.onended=fin;
          a.onerror=function(){ if(done)return; done=true; say(sayLine()).then(res); };
          a.play().catch(function(){ if(done)return; done=true; say(sayLine()).then(res); });
        }catch(e){ say(sayLine()).then(res); }
      }); });
    }

    // ---- consistent, instant TTS: on-device cache (IndexedDB "sona-tts").
    // Same text = the exact same audio every time — Leo's rrrr never wobbles.
    function ttsDB(){ return new Promise(function(res,rej){ try{ var r=indexedDB.open("sona-tts",1); r.onupgradeneeded=function(){ r.result.createObjectStore("clips"); }; r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)}; }catch(e){rej(e);} }); }
    function ttsGet(k){ return ttsDB().then(function(db){ return new Promise(function(res){ var tx=db.transaction("clips"); var rq=tx.objectStore("clips").get(k); rq.onsuccess=function(){res(rq.result||null)}; rq.onerror=function(){res(null)}; }); }).catch(function(){return null;}); }
    function ttsPut(k,buf){ ttsDB().then(function(db){ try{ db.transaction("clips","readwrite").objectStore("clips").put(buf,k); }catch(e){} }).catch(function(){}); }

    var audioCtx=null,speaking=false;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    function playPCM(b){ return new Promise(function(res){ try{ var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=c.createBufferSource();s.buffer=ab;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start(); }catch(e){res();} }); }
    function say(t){ return new Promise(function(res){ if(!t||profile.voiceOn===false)return res(); if(speaking)return res(); speaking=true;
      var key=(profile.voiceId||"leo")+"|"+t;
      ttsGet(key).then(function(cached){
        if(cached) return playPCM(new Uint8Array(cached));
        return fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||"",stable:true})})
          .then(function(r){return r.ok?r.arrayBuffer():null;})
          .then(function(b){ if(!b)return null; ttsPut(key,b); return playPCM(new Uint8Array(b)); });
      }).catch(function(){}).finally(function(){speaking=false;res();});
    }); }
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }

    // ---- UI ----
    $("gpEmoji").textContent=GMETA.e; $("gpName").textContent=GMETA.n;
    // the game "forms" as reps land: its city panel fades in and un-blurs
    var GKEY=GAME.replace(/^arcade-|\.html$/g,"");
    (function(){ var im=new Image(); im.onload=function(){ var g=$("gameBg"); g.style.backgroundImage="url("+im.src+")"; g.style.opacity=.35; }; im.src="/coach/city/"+GKEY+".png"; })();
    function paintLoad(n){
      var g=$("gameBg"); if(!g.style.backgroundImage) return;
      var pct=Math.min(1,n/NEED);
      g.style.opacity=String(0.35+0.65*pct);
      g.style.filter="blur("+Math.round(14-13*pct)+"px) brightness("+(1.06-0.06*pct)+")";
    }
    $("prompt").textContent=ITEM.display||ITEM.t;
    var pipsEl=$("pips"); for(var i=0;i<NEED;i++){ var p=document.createElement("div"); p.className="pip"; pipsEl.appendChild(p); }
    function paintReps(n){ var k=pipsEl.children; for(var i=0;i<k.length;i++) k[i].className="pip"+(i<n?" on":""); var pct=Math.min(100,Math.round(n/NEED*100)); $("gpFill").style.height=pct+"%"; $("gpState").textContent=n>=NEED?"READY! 🚀":("Loading… "+pct+"%"); paintLoad(n); }
    if(isDaily&&run&&run.active){ $("roundLbl").textContent="Round "+Math.min(run.round+1,DAILY_SEQ.length)+" of "+DAILY_SEQ.length; $("sumLbl").textContent="🏆 "+run.sum; }
    function micGo(on,txt){ var m=$("micBtn"); m.className=on?"go":""; $("micState").textContent=txt||""; }

    // ---- rapid-fire rep engine: continuous VAD, every voiced burst = a rep.
    // No per-rep scoring round-trips — ONE SpeechAce spot-check on the whole
    // clip at the end keeps the SLP data honest without killing the pace.
    var micStream=null, reps=0, engineOn=false, chunks=[], rec=null;
    var useSpeechAce=true;
    (function(){ try{ fetch("/api/score").then(function(r){return r.json();}).then(function(j){ useSpeechAce=!!(j&&j.hasKey); }).catch(function(){ useSpeechAce=false; }); }catch(e){ useSpeechAce=false; } })();

    function startEngine(){
      return new Promise(function(resolve){
        reps=0; paintReps(0); chunks=[];
        var voiced=0, silent=0, inBurst=false, thr=0, calN=0, calSum=0, t0=performance.now(), lastRep=0, idleTimer=null;
        try{ if(window.MediaRecorder&&micStream){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data); }; rec.start(); } }catch(e){ rec=null; }
        var ctx=getCtx(), src=ctx.createMediaStreamSource(micStream), an=ctx.createAnalyser();
        an.fftSize=512; src.connect(an);
        var td=new Uint8Array(an.fftSize);
        engineOn=true;
        function stopAll(){ engineOn=false; try{src.disconnect();}catch(e){} try{ if(rec&&rec.state!=="inactive")rec.stop(); }catch(e){} if(idleTimer)clearTimeout(idleTimer); }
        function armIdle(){ if(idleTimer)clearTimeout(idleTimer); idleTimer=setTimeout(function(){ if(!engineOn)return; if(reps===0){ playPrompt(); armIdle(); } },8000); }
        armIdle();
        (function tick(){
          if(!engineOn) return;
          an.getByteTimeDomainData(td);
          var sum=0; for(var i=0;i<td.length;i++){ var d=(td[i]-128)/128; sum+=d*d; }
          var rms=Math.sqrt(sum/td.length), now=performance.now();
          if(now-t0<250){ calSum+=rms; calN++; requestAnimationFrame(tick); return; }
          if(!thr) thr=Math.max(0.035,(calSum/Math.max(1,calN))*3.0);
          if(rms>thr){ voiced++; silent=0;
            // a real burst = ~4 voiced frames (~120ms) — silence NEVER counts
            if(!inBurst && voiced>=4 && now-lastRep>350){
              inBurst=true; lastRep=now; reps++;
              paintReps(reps); sfx("tap");
              var l=$("leo"); l.classList.remove("cheer"); void l.offsetWidth; l.classList.add("cheer");
              if(reps>=NEED){ setTimeout(function(){ stopAll(); resolve(); },350); return; }
            }
          } else { silent++; voiced=0; if(silent>=8) inBurst=false; }
          requestAnimationFrame(tick);
        })();
        // hard cap so nobody is ever stuck
        setTimeout(function(){ if(engineOn){ stopAll(); resolve(); } },20000);
      });
    }

    function clipBlob(){ return chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null; }
    // Tri-state verdict: "pass" / "fail" (the scorer really heard a different
    // sound) / "unknown" (no scorer, timeout, error — never punish the kid for
    // infrastructure, and never log made-up data).
    async function verifyClip(){
      var blob=clipBlob();
      if(useSpeechAce&&blob){
        try{
          var ctrl=new AbortController(); var to=setTimeout(function(){ctrl.abort();},8000);
          var fd=new FormData(); fd.append("audio",new File([blob],"a.webm",{type:blob.type||"audio/webm"}));
          fd.append("text",ITEM.t); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode",ITEM.mode||"phoneme");
          var r=await fetch("/api/score",{method:"POST",body:fd,signal:ctrl.signal}); clearTimeout(to);
          var j=await r.json(); if(j&&j.ok) return (j.rating!=="tryAgain")?"pass":"fail";
        }catch(e){}
        return "unknown";
      }
      return "unknown";
    }

    // ---- the flow ----
    var launched=false;
    function logV(v){ if(v!=="unknown" && S && S.logAttempt) S.logAttempt({game:"charge",sound:SOUND,pass:v==="pass",word:String(ITEM.word||ITEM.t).toLowerCase()}); }
    async function burstAndVerify(n){
      var save=NEED; if(n)NEED=n;
      micGo(true, n?"GO!":("GO — say it "+(NUMWORD[NEED]||NEED)+" times!"));
      await startEngine();
      NEED=save;
      micGo(false,""); $("gpState").textContent="Checking…";
      var v=await verifyClip(); logV(v); return v;
    }
    async function flow(){
      try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false}); }
      catch(e){ micGo(false,"Mic is off"); if(S&&S.micDenied)S.micDenied({back:"/today.html"}); return; }
      // Leo speaks the prompt ONCE, then the mic is instantly hot.
      await playPrompt();
      var v=await burstAndVerify();
      if(v==="fail"){
        // The scorer really heard a different sound — the charge is NOT given
        // away. Coach with the SLP cue (never "watch my mouth" — there is no
        // mouth on screen), then re-try. Two honest fails still open the game
        // (a kid is never hard-stuck) but the stats keep the truth.
        var c=(S&&S.cue)?S.cue(SOUND):null;
        var tip=(c&&c.tip)?c.tip:("Let's try our "+((S&&S.soundLabel)?S.soundLabel(SOUND):SOUND)+" sound again");
        if(c&&c.tip)$("cueRow").textContent=c.tip;
        $("gpState").textContent="Almost!";
        await say("Hmm, that was a different sound! "+tip+". Try again!");
        v=await burstAndVerify(3);
        if(v==="fail"){
          await say("Great practicing! Let's play — we'll keep working on it!");
        }
      }
      launchGame();
    }

    function launchGame(){
      if(launched)return; launched=true;
      stopMic();
      paintReps(NEED); $("gamePanel").classList.add("ready"); $("gpState").textContent="GO! 🚀";
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      try{ sessionStorage.setItem("sona.play.token","1"); sessionStorage.setItem("sona.boost.sound",SOUND); }catch(e){}
      if(isDaily&&run){ run.pending=true; runSave(run); }
      setTimeout(function(){ location.href="/"+GAME+"?from=charge"+(isDaily?"&daily=1":""); },700);
    }

    // ---- daily overlays ----
    function showPlayed(){
      var d=S.dailyInfo();
      $("playedSub").textContent="Today's score: "+d.score+" · Best ever: "+d.best+". One run a day — free play is always open!";
      $("playedOvl").classList.add("show");
    }
    $("playedArcade").onclick=function(){ location.href="/today.html#play"; };
    $("playedHome").onclick=function(){ location.href="/today.html"; };

    function finishRun(){
      var r=S.dailyFinish(run.sum);
      try{ if(S.recordSession)S.recordSession({words:[]}); if(S.markLevelDone)S.markLevelDone(LEVEL); if(S.addCoins)S.addCoins(10+Math.min(20,(run.sum/10)|0)); }catch(e){}
      run.active=false; runSave(run);
      $("runScore").textContent=r.score;
      $("runBest").textContent=r.newBest?"🎉 NEW BEST!":("Best ever: "+r.best);
      $("runEmoji").textContent=r.newBest?"👑":"🏆";
      $("runTitle").textContent=r.newBest?"NEW HIGH SCORE!":"Run complete!";
      $("runOvl").classList.add("show");
      sfx("complete"); try{ if(S.confetti)S.confetti(); }catch(e){}
      say(r.newBest?"New high score! Amazing!":"Run complete! Great work!");
    }
    $("runDone").onclick=function(){ location.href="/today.html"; };
    $("runArcade").onclick=function(){ location.href="/today.html#play"; };

    // ---- chrome ----
    function stopMic(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} }
    $("close").onclick=function(){ stopMic(); location.href=isDaily?"/today.html":"/map.html"; };
    $("skip").onclick=function(){ launchGame(); };
    window.addEventListener("pagehide",stopMic);

    // ---- boot: auto-start — the voice speaks, then it's GO. No tap gate. ----
    if(finishedNow){ finishRun(); }
    else if(isDaily && !(run&&run.active) && S&&S.dailyInfo&&S.dailyInfo().playedToday){ showPlayed(); }
    else {
      var booted=false;
      function boot(){ if(booted||launched)return; booted=true; getCtx(); flow(); }
      // silent gesture hook: if the browser blocked audio, the first touch
      // resumes it — no visible "tap to start" anywhere
      document.body.addEventListener("pointerdown",function(){ try{ getCtx(); }catch(e){} },{passive:true});
      setTimeout(boot,300);
    }
  </script>
</body>
</html>
