<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Match-Up</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --ink:#3c3c3c; --muted:#777; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:linear-gradient(180deg,#f3eaff,#e9f0ff 55%,#eafbff);color:var(--ink);}
    #app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;}

    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 6px;}
    #close{border:none;background:none;color:#b7a9d6;font-size:24px;font-weight:800;cursor:pointer;line-height:1;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(120,80,200,.12);}
    .stat.pairs{color:#8b5cf6;} .stat.coins{color:var(--orange-d);margin-left:auto;}

    #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 18px;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:18px;color:#7c4ddb;min-height:26px;text-align:center;margin-bottom:10px;}
    #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:420px;}
    .card{aspect-ratio:3/4;border-radius:16px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .35s;}
    .card.up,.card.matched{transform:rotateY(180deg);}
    .card .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;}
    .card .back{background:linear-gradient(150deg,#8b5cf6,#6d35d6);box-shadow:0 5px 0 0 #5a2bbf;font-size:34px;color:rgba(255,255,255,.92);}
    .card .front{background:#fff;border:2px solid #e9;border:2px solid #ece4fb;box-shadow:0 5px 0 0 #d9ccf2;transform:rotateY(180deg);flex-direction:column;gap:4px;}
    .card .front .e{font-size:44px;line-height:1;}
    .card .front .w{font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--blue-d);}
    .card.matched .front{background:#eafff0;border-color:#bdebca;box-shadow:0 5px 0 0 #bdebca;}
    .card.matched{animation:pop .45s ease;}
    @keyframes pop{0%,100%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.08)}}
    .card.busy{pointer-events:none;}

    #micline{display:flex;align-items:center;gap:8px;margin-top:14px;height:30px;}
    #micline .dot{width:12px;height:12px;border-radius:50%;background:#c9b6f0;}
    #micline.live .dot{background:var(--green);animation:blink 1s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    #micline span{font-family:"Baloo 2";font-weight:800;font-size:13px;color:var(--muted);}

    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#f3eaff,#eafbff);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:34px;color:#7c4ddb;margin-top:10px;}
    #win .rewards{display:flex;gap:14px;margin-top:18px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 20px;font-family:"Baloo 2";font-weight:800;font-size:24px;color:#7c4ddb;box-shadow:0 6px 16px rgba(120,80,200,.12);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
    #win .unlock{margin-top:16px;font-weight:800;color:var(--orange-d);}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    #win a{margin-top:14px;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none;}
    #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(120,80,200,.25));animation:leoPop .6s ease;}
    #leo{width:74px;height:74px;object-fit:contain;display:block;margin:2px auto 2px;filter:drop-shadow(0 6px 8px rgba(120,80,200,.2));animation:leoBob 3.2s ease-in-out infinite;}
    #leo.react{animation:leoPop .55s ease;}
    @keyframes leoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes leoPop{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-8px)}60%{transform:scale(.95)}100%{transform:scale(1)}}
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat pairs"><span id="pairsFound">0</span>/<span id="pairsTot">3</span></span>
      <span class="stat coins"><span style="display:inline-block;width:13px;height:13px;border-radius:50%;background:linear-gradient(180deg,#ffd84d,#f4b400);box-shadow:inset 0 0 0 2px #e0a400;vertical-align:-2px;margin-right:3px;"></span><span id="coins">0</span></span>
    </div>
    <div id="stage">
      <img id="leo" src="/coach/echo/echo-idle.svg" alt="Echo" />
      <div id="prompt">Find the matching pairs!</div>
      <div id="grid"></div>
      <div id="micline"><span class="dot"></span><span id="micText">Tap a card to start</span></div>
    </div>
  </div>

  <div id="win">
    <img class="leoWin" src="/coach/echo/echo-celebrate.svg" alt="Echo celebrating" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
    <h1 id="winTitle">All matched!</h1>
    <div class="rewards">
      <div class="reward"><span id="winReps">0</span><small>words said</small></div>
      <div class="reward"><span id="winFlips">0</span><small>flips</small></div>
    </div>
    <div class="unlock" id="winUnlock"></div>
    <button class="btn" id="again">Play again</button>
    <a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var profile = (window.Sona ? Sona.getProfile() : { focusSounds:["R"], voiceId:"", volume:0.8 });
    var params = new URLSearchParams(location.search);
    var SOUND = (params.get("sound") || (profile.focusSounds && profile.focusSounds[0]) || "R").toUpperCase();
    if(!(window.Sona && Sona.WORDS && Sona.WORDS[SOUND])) SOUND="R";
    // ── SLP content ladder: serve the child's CURRENT rung for this sound ──
    var RUNG = (window.Sona&&Sona.rungOf)?Sona.rungOf(SOUND):2; if(RUNG>5)RUNG=5;
    var ITEMS = (window.Sona&&Sona.ladderContent)?Sona.ladderContent(SOUND,RUNG):[];
    if(RUNG>=5 && (!ITEMS.length || (ITEMS[0]&&ITEMS[0].q))){ RUNG=4; ITEMS=Sona.ladderContent(SOUND,4); } // arcade can't do conversation -> use sentences
    if(!ITEMS.length){ ITEMS=((window.Sona&&Sona.wordsFor)?Sona.wordsFor(SOUND):[]).map(function(w){return {t:w.w,say:w.w,display:w.w,e:w.e,word:w.w,level:"word",mode:"full"};}); }
    if(!ITEMS.length){ ITEMS=[{w:"rabbit",e:"🐰"},{w:"rocket",e:"🚀"},{w:"ring",e:"💍"}].map(function(w){return {t:w.w,say:w.w,display:w.w,e:w.e,word:w.w,level:"word",mode:"full"};}); }
    var POOL = ITEMS;
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    // 10 distinct levels — a journey down Memory Lane. Knob: pairs (number of card pairs).
    var LEVELS=[
      {name:"Cozy Nook",  bg:"linear-gradient(180deg,#fff4e6,#ffe8cf 60%,#ffe0d6)", accent:"#f0a04b", props:["🧸"],          pairs:2},
      {name:"Sunny Yard", bg:"linear-gradient(180deg,#fff7d6,#ffe9a8 60%,#dff5c4)", accent:"#f5b400", props:["🌻"],          pairs:3},
      {name:"Garden Path",bg:"linear-gradient(180deg,#eaffe0,#cdf3b8 60%,#aee6a0)", accent:"#5fae3f", props:["🌷","🦋"],      pairs:3},
      {name:"Berry Wood", bg:"linear-gradient(180deg,#e6f7ea,#bfe8cc 60%,#9bd6b4)", accent:"#3f9e6a", props:["🍓","🌳"],      pairs:4},
      {name:"Blue Brook", bg:"linear-gradient(180deg,#e2f6ff,#bfe6ff 60%,#9cd4f5)", accent:"#2aa6e0", props:["💧","🐟"],      pairs:4},
      {name:"Pebble Cove",bg:"linear-gradient(180deg,#e6f0ff,#c7d8ff 60%,#bcd0f7)", accent:"#5a7fe0", props:["🐚","🌊"],      pairs:5},
      {name:"Twilight Hill",bg:"linear-gradient(180deg,#efe6ff,#d6c4ff 60%,#bfa8f0)", accent:"#8b5cf6", props:["🌄","🪁"],     pairs:5},
      {name:"Starry Lane",bg:"linear-gradient(180deg,#e9e2ff,#cdbcf5 55%,#b39ae6)", accent:"#7c4ddb", props:["⭐","🌙"],      pairs:6},
      {name:"Moonlit Grove",bg:"linear-gradient(180deg,#dcd6f7,#b9a9e6 55%,#9b86d6)", accent:"#6d35d6", props:["🌙","🦉","🍃"],pairs:6},
      {name:"Champion!",  bg:"linear-gradient(135deg,#3a2a6b,#6d35d6 50%,#b97cf0)",  accent:"#ffd84d", props:["🏆","✨","🃏"], pairs:8}
    ];
    var L=LEVELS[Math.min(9,Math.max(0,DIFF-1))];
    // Need distinct cards per pair. With few ladder items (isolation=1) cycle so the
    // board still has >=2 pairs; ids stay unique per slot so matching never breaks.
    var PAIRS = Math.max(2, Math.min(POOL.length>=2?POOL.length:2, L.pairs));
    function itemAt(i){ return POOL[((i%POOL.length)+POOL.length)%POOL.length]; }

    var $=function(id){return document.getElementById(id);};
    var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
    // Leo reacts (real poses, no new art)
    var LEO={ idle:"/coach/echo/echo-idle.svg", cheer:"/coach/echo/echo-celebrate.svg", encourage:"/coach/echo/echo-listening.svg" };
    Object.keys(LEO).forEach(function(k){ var im=new Image(); im.src=LEO[k]; });
    function setLeo(s){ var el=$("leo"); if(el&&LEO[s]) el.src=LEO[s]; }
    function leoReact(){ var el=$("leo"); if(!el)return; el.classList.remove("react"); void el.offsetWidth; el.classList.add("react"); }

    var audioCtx=null;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    function playPCM(bytes){ return new Promise(function(res){ try{ var ctx=getCtx(); var n=bytes.byteLength>>1; var ab=ctx.createBuffer(1,n,24000); var ch=ab.getChannelData(0); var dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=ctx.createBufferSource(); s.buffer=ab; s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1; var g=ctx.createGain(); g.gain.value=(profile.volume!=null?profile.volume:0.8); s.connect(g); g.connect(ctx.destination); s.onended=res; s.start(); }catch(e){res();} }); }
    var speaking=false;
    function say(text){ return new Promise(function(res){ if(!text){return res();} if(speaking){return res();} speaking=true; fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){ if(b) return playPCM(new Uint8Array(b)); }).catch(function(){}).finally(function(){speaking=false;res();}); }); }

    var micStream=null, useSpeechAce=false;
    function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
    function matchText(t,w){ t=norm(t); w=norm(w); if(!t)return false; if(t.indexOf(w)>=0||w.indexOf(t)>=0)return true; var i=0; while(i<Math.min(t.length,w.length)&&t[i]===w[i])i++; return i>=3; }
    // record the attempt (audio for SpeechAce + transcript + voice-activity auto-stop)
    function recordTurn(maxMs){ if(window.Sona&&Sona.hasNativeAudio&&Sona.hasNativeAudio())return Sona.captureClip({maxMs:(maxMs||6000)}); maxMs=maxMs||7000; return new Promise(function(resolve){
      var done=false,chunks=[],rec=null,sr=null,transcript="",spoke=false,lastV=0,raf=null,src=null;
      $("micline").classList.add("live"); $("micText").textContent="Say it!";
      function fin(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} $("micline").classList.remove("live"); $("micText").textContent=""; setTimeout(function(){resolve({transcript:transcript,blob:chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null,spoke:spoke});},120); }
      try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
      try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; fin();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
      try{ if(micStream){ var ctx=getCtx(); src=ctx.createMediaStreamSource(micStream); var an=ctx.createAnalyser(); an.fftSize=512; src.connect(an); var td=new Uint8Array(an.fftSize); var t0=performance.now(),nSum=0,nN=0,thr=0,vms=0,lt=0;
        (function tick(){ if(done)return; an.getByteTimeDomainData(td); var sum=0; for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;} var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<450){nSum+=rms;nN++;lt=now;} else { if(!thr)thr=Math.max(0.05,(nSum/Math.max(1,nN))*3.2); var dt=now-lt;lt=now; if(rms>thr){vms+=dt;lastV=now;if(vms>=250)spoke=true;}else if(rms<thr*0.65)vms=Math.max(0,vms-dt*0.5); if(spoke&&now-lastV>=800){fin();return;} }
          raf=requestAnimationFrame(tick); })(); } }catch(e){}
      setTimeout(fin,maxMs); }); }
    // a card only stays up if the word is said well enough (SpeechAce); wrong/silence → flip back
    var lastFb="";
    async function scoreWord(word,res){ lastFb="";
      var scoreText=word.t||word.word||word.display||"";
      var mode=word.mode||"full";
      if(useSpeechAce && res.blob){ try{ var fd=new FormData(); fd.append("audio",new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"})); fd.append("text",scoreText); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode",mode); var r=await fetch("/api/score",{method:"POST",body:fd}); var j=await r.json(); if(j&&j.ok&&j.rating){ lastFb=j.feedback||""; return j.rating!=="tryAgain"; } }catch(e){} }
      if(res.transcript) return matchText(res.transcript,scoreText);
      return false;
    }

    /* game */
    var cards=[], first=null, busy=false, matched=0, reps=0, flips=0, correct=0, total=0;

    function buildBoard(){
      // pick PAIRS ladder items, cycling when the rung has fewer than PAIRS items
      var order=shuffle(POOL.map(function(_,i){return i;}));
      var chosen=[];
      for(var p=0;p<PAIRS;p++){
        var it = POOL.length>=PAIRS ? POOL[order[p]] : itemAt(p);
        var disp = it.display||it.t||it.word||"";
        var icon = (window.Sona&&Sona.pic) ? Sona.pic(disp, it.e, 44) : (it.e || ((window.Sona&&Sona.soundLabel)?Sona.soundLabel(SOUND):SOUND));
        chosen.push({ t:it.t, say:it.say, display:disp, e:it.e, word:it.word, level:it.level, mode:it.mode, icon:icon, id:"p"+p });
      }
      var deck=shuffle(chosen.concat(chosen));
      var grid=$("grid"); grid.innerHTML="";
      cards=[];
      deck.forEach(function(c,i){
        var el=document.createElement("div"); el.className="card";
        el.innerHTML='<div class="face back">?</div><div class="face front"><span class="e">'+c.icon+'</span><span class="w">'+c.display+'</span></div>';
        el.onclick=function(){ flip(el,c); };
        grid.appendChild(el); cards.push({el:el,c:c,done:false});
      });
    }

    async function flip(el, c){
      if(busy || el.classList.contains("up") || el.classList.contains("matched")) return;
      busy=true; flips++;
      el.classList.add("up");
      if(window.Sona&&Sona.sfx)Sona.sfx.tap&&Sona.sfx.tap();
      // sound-coaching at isolation/syllable: model the sound before they try
      var isPhoneme=(c.level==="isolation"||c.level==="syllable");
      if(isPhoneme){
        $("prompt").textContent="Say it with me!";
        if(window.Sona){ var cue = (c.level==="syllable"&&Sona.repeatCue)?Sona.repeatCue(SOUND):(Sona.actionCue?Sona.actionCue(SOUND,2):null); await say(cue||c.say||c.t); }
        else { await say(c.say||c.t); }
      } else {
        $("prompt").textContent="What's this? Say it!";
      }
      var res=await recordTurn(); var ok=await scoreWord(c,res);   // must say it right to keep the card up
      total++;
      if(window.Sona&&Sona.logAttempt)Sona.logAttempt({game:"match",sound:SOUND,pass:ok,word:c.word||c.t});
      if(!ok){
        if(window.Sona&&Sona.sfx)Sona.sfx.tap&&Sona.sfx.tap();
        $("prompt").textContent=(window.Sona&&Sona.coachLine)?Sona.coachLine(SOUND,lastFb):("Not quite — say “"+(c.display||c.t)+"”."); await say(lastFb||c.say||c.t);
        el.classList.remove("up"); busy=false; return;
      }
      correct++;
      reps++;
      await say(c.say||c.t);                 // Leo says it back to confirm
      if(!first){ first={el:el,c:c}; busy=false; $("prompt").textContent="Find its match!"; return; }
      // second card chosen
      if(first.c.id===c.id && first.el!==el){
        // match!
        el.classList.add("matched"); first.el.classList.add("matched");
        matched++; $("pairsFound").textContent=matched;
        if(window.Sona){ Sona.sfx&&Sona.sfx.correct&&Sona.sfx.correct(); Sona.pop&&Sona.pop("⭐",{color:"#8b5cf6",y:window.innerHeight*0.35}); }
        setLeo("cheer"); leoReact();
        if(window.Sona&&Sona.praiseLine)await say(Sona.praiseLine());
        $("prompt").textContent="Match!";
        first=null; busy=false;
        if(matched>=PAIRS) setTimeout(finishGame,650);
      } else {
        // no match — flip both back
        setLeo("encourage");
        $("prompt").textContent="Try again!";
        var a=first.el, b=el; first=null;
        setTimeout(function(){ a.classList.remove("up"); b.classList.remove("up"); busy=false; setLeo("idle"); $("prompt").textContent="Find the matching pairs!"; }, 950);
      }
    }

    function finishGame(){
      $("winReps").textContent=reps; $("winFlips").textContent=flips;
      var earned=15 + reps*2;
      if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{ var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}"); GS[SOUND]=GS[SOUND]||{}; GS[SOUND].match={done:true}; GS.lastPlayDay=new Date().toISOString().slice(0,10); localStorage.setItem("sona.games.v1",JSON.stringify(GS)); }catch(e){}
      // record SLP ladder mastery for this round
      if(window.Sona&&Sona.recordRung) Sona.recordRung(SOUND, RUNG, correct/Math.max(1,total));
      $("winUnlock").textContent="+"+earned+" 🪙";
      $("coins").textContent=Sona.getCoins?Sona.getCoins():0;
      $("win").classList.add("show");
      if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win"));
      if(window.Sona){ Sona.confetti&&Sona.confetti(); Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete(); }
    }

    function startGame(){
      $("win").classList.remove("show");
      first=null; busy=false; matched=0; reps=0; flips=0; correct=0; total=0;
      $("pairsFound").textContent="0"; $("pairsTot").textContent=PAIRS;
      $("coins").textContent=Sona.getCoins?Sona.getCoins():0;
      $("prompt").textContent="Find the matching pairs!"; $("micText").textContent="Tap a card to start";
      buildBoard();
      // quick peek to help little ones, then flip down
      setTimeout(function(){ cards.forEach(function(c){c.el.classList.add("up");}); setTimeout(function(){ cards.forEach(function(c){ if(!c.el.classList.contains("matched")) c.el.classList.remove("up"); }); }, 1400); }, 300);
    }

    // unobtrusive rung badge — shows which ladder level the child is practicing
    (function(){ try{
      var lbl=(window.Sona&&Sona.rungLabel)?Sona.rungLabel(RUNG):"";
      if(!lbl) return;
      var b=document.createElement("span");
      b.className="stat";
      b.style.cssText="color:#8b5cf6;font-size:13px;";
      b.textContent="Practicing: "+lbl;
      var coins=document.querySelector(".stat.coins");
      var top=$("top");
      if(coins&&top) top.insertBefore(b, coins); else if(top) top.appendChild(b);
    }catch(e){} })();

    (async function(){
      try{ var r=await fetch("/api/score"); var j=await r.json(); useSpeechAce=!!(j&&j.hasKey); }catch(e){ useSpeechAce=false; }
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      $("again").onclick=startGame;
      startGame();
    })();
    // return to this sound's ladder (Sound → ladder → games)
    (function(){ var lad="/map.html";
      var c=document.getElementById("close"); if(c) c.onclick=function(){ location.href=lad; };
      Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){ a.setAttribute("href",lad); });
    })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  
    /* per-level scene: CSS theme now, real art swaps in when the PNG exists (zero code) */
    (function(){
      var s=document.getElementById("stage")||document.body;
      if(L.bg) s.style.background=L.bg;
      if(L.accent){
        // re-tint the accent the game already uses (card backs, prompt, pairs stat)
        try{
          var st=document.createElement("style");
          st.textContent=".card .back{background:linear-gradient(150deg,"+L.accent+","+L.accent+")!important;}"
            +"#prompt{color:"+L.accent+"!important;}"
            +".stat.pairs{color:"+L.accent+"!important;}";
          document.head.appendChild(st);
        }catch(e){}
      }
      // per-level art drop-in, then existing bg.png as fallback
      function tryArt(srcs){
        if(!srcs.length) return;
        var src=srcs.shift();
        var im=new Image();
        im.onload=function(){ s.style.backgroundImage="url("+src+")"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center"; };
        im.onerror=function(){ tryArt(srcs); };
        im.src=src;
      }
      tryArt(["/coach/match/lvl"+DIFF+".png","/coach/match/bg.png"]);
    })();
</script>
</body>
</html>
