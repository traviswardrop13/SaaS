<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Play library</title>
  <link href="/fonts.css" rel="stylesheet" />
  <link href="/sona.css" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#fff6e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- first-run guard: a brand-new family (no onboarding done, no name) never
       sees the home screen with a blank default profile — they set up first.
       Covers deep links and the native shell's start URL alike. -->
  <script>
    (function(){
      try{
        // runs BEFORE sona.js, so the kid namespace has to be resolved by hand
        // here — otherwise this always reads the first child and a freshly added
        // sibling would skip setup (KIDS1)
        var slot=""; try{ var kk=JSON.parse(localStorage.getItem("sona.kids.v1")||"null"); if(kk&&kk.active) slot=kk.active; }catch(e){}
        var key="sona.profile.v1"+(slot?"@"+slot:"");
        var p=JSON.parse(localStorage.getItem(key)||"{}");
        if(!p.onboarded&&!p.childName){ document.documentElement.style.display="none"; location.replace("/onboarding.html"); }
      }catch(e){}
    })();
  </script>
  <style>
    :root{--cream:#fff6e9;--ink:#4a2c14;--muted:#795c3c;}
    html,body{min-height:100%;height:auto;background:var(--cream);}
    body{color:var(--ink);}
    button,a{-webkit-tap-highlight-color:transparent;}
    button{font:inherit;}
    button:focus-visible,a:focus-visible{outline:3px solid #157da5;outline-offset:5px;}
    [hidden]{display:none!important;}
    .library-wrap{max-width:860px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));}
    .library-header{display:flex;align-items:center;justify-content:space-between;gap:16px;}
    .library-label{font-family:"Baloo 2",sans-serif;font-size:17px;font-weight:800;color:var(--muted);}
    .library-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 22px;}
    .library-intro h1{font-family:"Baloo 2",sans-serif;font-size:36px;line-height:1.1;font-weight:800;}
    .library-intro p{font-size:14px;color:var(--muted);line-height:1.5;max-width:240px;margin-top:8px;}
    #libraryEcho{display:block;position:relative;width:84px;height:96px;flex:none;transform:rotate(5deg);}
    #libraryEcho>.stk{background:transparent!important;}
    .activity-group{margin-top:28px;}
    .shelf-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;}
    .shelf-heading h2{font-size:23px;line-height:1.2;}
    .shelf-heading p{font-size:12px;line-height:1.5;color:var(--muted);margin-top:3px;}
    .shelf-tag{display:inline-flex;align-items:center;flex:none;padding:5px 9px;border-radius:99px;background:#f6e8d3;color:#775431;font-size:11px;font-weight:800;white-space:nowrap;}
    .shelf-tag.recommended{background:#dfeecf;color:#3b5d25;}
    .game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;}
    .game-card{position:relative;display:flex;flex-direction:column;min-width:0;border:5px solid #fff;border-radius:23px;background:#fff;box-shadow:0 4px 0 #e8d9c5;color:var(--ink);padding:0;cursor:pointer;transition:transform .12s;text-align:left;}
    .game-card:disabled{cursor:default;}
    .game-card:disabled .game-art{opacity:.55;filter:saturate(.5);}
    /* a Premium game a family hasn't opened is greyed too, but still taps
       through to the grown-up message (only ever seen when pricing is on) */
    .game-card[data-locked="true"] .game-art{opacity:.55;filter:saturate(.5);}
    .game-access.coming-soon{color:#715d45;background:#f0e8db;}
    .game-card:not(:disabled):active{transform:translateY(3px) scale(.98);}
    .game-art{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;}
    .game-info{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 6px 8px;}
    .game-name{font-family:"Baloo 2",sans-serif;font-size:18px;line-height:1.15;font-weight:800;}
    .game-access{font-size:10px;line-height:1.3;font-weight:800;color:#3f6630;background:#eaf3dd;padding:3px 7px;border-radius:99px;}
    .game-access.premium{color:#665093;background:#efe9f9;}
    .featured-group{background:#f1e9fb;border:1px solid #e5d9f5;border-radius:26px;padding:17px 15px 15px;margin:20px 0 26px;}
    .featured-group[data-collection="seasonal"]{background:#ffe9cc;border-color:#f5d9b1;}
    .featured-grid{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 15px)/2);gap:15px;overflow-x:auto;padding:1px 1px 8px;scroll-snap-type:x proximity;}
    .featured-grid .game-card{scroll-snap-align:start;box-shadow:0 4px 0 #ded0ef;}
    .featured-group .shelf-heading h2{font-size:22px;}
    .featured-group .shelf-tag{background:#fff9;color:#665093;}
    #booksCard{display:flex;align-items:center;gap:15px;width:100%;padding:18px 17px;background:#e6f0ee;border:1px solid #d5e4de;border-radius:25px;margin-top:32px;box-shadow:0 4px 0 #cfe0d9;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .12s;}
    #booksCard:active{transform:translateY(3px) scale(.99);}
    .book-art{position:relative;display:block;width:76px;height:86px;flex:none;}
    .book-art>.stk{background:transparent!important;}
    .book-art>img{width:100%;height:100%;object-fit:cover;border-radius:14px;}
    .books-copy{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
    .books-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
    #booksHeading{font-family:"Baloo 2",sans-serif;font-size:23px;line-height:1.2;font-weight:800;}
    #booksLine{font-size:13px;line-height:1.5;color:#536b62;max-width:300px;}
    #booksCard .shelf-tag{background:#fff9;color:#536b62;}
    .books-go{flex:none;font-size:30px;line-height:1;color:#536b62;}
    .age-note{font-size:12px;line-height:1.5;color:var(--muted);text-align:center;margin:25px 12px 0;}
    #catalogPreviewNotice{border:1px dashed #a897ba;border-radius:16px;background:#f4eefb;padding:12px 14px;font-size:12px;line-height:1.5;margin-bottom:20px;color:#665093;}
    #catalogPreviewNotice strong{display:block;}
    #libraryNotice{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:calc(100% - 32px);max-width:440px;display:flex;align-items:center;gap:10px;padding:15px 14px 15px 18px;background:#fff;border:2px solid #eed7b0;border-radius:22px;box-shadow:0 10px 32px rgba(80,50,10,.2);}
    .notice-copy{flex:1;}
    /* buttons are the teal action pill (action.css, via sona.css; design brief
       28 Sep 2026); chips and dots keep their own selection colours */
    #libraryUnlock{display:block;min-height:44px;margin-top:8px;border:0;border-radius:999px;padding:9px 18px;background:linear-gradient(180deg,var(--act-hi),var(--act));box-shadow:0 4px 0 var(--act-d);text-shadow:0 1px 0 var(--act-d);color:#fff;font-weight:800;cursor:pointer;}
    #libraryMessage{font-weight:800;font-size:14px;line-height:1.45;color:var(--muted);}
    #libraryMessageClose{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:#fff0d8;color:var(--ink);font-size:23px;cursor:pointer;}
    .library-wrap.has-message{padding-bottom:145px;}
    @media(min-width:600px){.library-wrap{padding:26px 30px 42px;}.game-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;}.featured-grid{grid-auto-columns:calc((100% - 44px)/3);gap:22px;}.library-intro{margin:28px 0;}.library-intro h1{font-size:42px;}#libraryEcho{width:100px;height:110px;}.game-name{font-size:22px;}.game-info{padding:12px 9px;}.game-access{font-size:11px;}.shelf-heading h2{font-size:27px;}.featured-group{padding:22px;}.activity-group{margin-top:34px;}}
    @media(max-width:350px){.library-wrap{padding-left:15px;padding-right:15px;}.game-grid{gap:12px;}.library-intro h1{font-size:30px;}#libraryEcho{width:67px;height:80px;}.game-card{border-width:4px;border-radius:19px;}.game-art{border-radius:15px;}.game-name{font-size:16px;}.game-info{padding:9px 4px 6px;}.featured-group{padding:14px 11px;}.shelf-heading h2{font-size:21px;}.shelf-tag{font-size:10px;padding:4px 7px;}#booksCard{gap:10px;}.book-art{width:60px;height:72px;}}
    @media(prefers-reduced-motion:reduce){.game-card{transition:none;}}
    :root{--label:#a17c4a;--track:#f0e4d2;--orange-d:#ef6f23;}
    .library-label{flex:1;}
    #buddyBtn,#parentBtn{position:relative;display:flex;align-items:center;justify-content:center;flex:none;border:3px solid #fff;width:44px;height:44px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(140,70,10,.14);color:#795c3c;}
    #buddyBtn{background:#ffe5b1;overflow:hidden;}
    /* REPWEEKS1: the week's reps, top right beside the Grown-ups button, in
       that button's crafted style. It only climbs, it sets no target and it
       compares nothing: the comparisons are behind the gate, one tap away.
       Phones drop the "Sona" wordmark rather than squeeze the count or the
       Grown-ups door; only a screen wide enough for all four shows it. */
    #repPill{display:flex;align-items:center;gap:5px;flex:none;min-height:44px;margin-left:auto;padding:5px 11px 5px 8px;border:1px solid #efe2ce;border-radius:15px;background:linear-gradient(#fffefb,#fff7e9);box-shadow:0 3px 0 #e9d8bb,0 5px 13px #6947200b;color:var(--ink);cursor:pointer;text-align:left;}
    #repPill .rep-ic{display:flex;width:20px;height:20px;flex:none;}
    #repPill .rep-ic svg{width:20px;height:20px;}
    .rep-copy{display:flex;flex-direction:column;align-items:flex-start;}
    #repPillN{font-family:"Baloo 2",sans-serif;font-size:18px;font-weight:800;line-height:1;}
    .rep-unit{font-size:10px;font-weight:800;line-height:1.2;color:var(--muted);white-space:nowrap;}
    .library-label{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
    @media(max-width:459px){.library-label{display:none;}}
    /* founding banner (feedback invite — never pricing) */
    #trialBanner{display:none;align-items:center;gap:12px;background:var(--cream-card);border:1.5px solid var(--cream-line);border-radius:20px;padding:10px 12px 10px 10px;font-weight:800;font-size:13px;line-height:1.3;color:var(--cream-ink);text-decoration:none;box-shadow:0 4px 0 var(--cream-line),0 10px 22px rgba(91,45,5,.08);}
    #trialBanner .tb-echo{width:46px;height:46px;flex:0 0 auto;object-fit:contain;}
    #trialBanner #trialMsg{flex:1;}
    #trialBanner .tb-pill{flex:0 0 auto;background:linear-gradient(180deg,var(--act-hi),var(--act));color:#fff;border-radius:999px;padding:8px 13px;font-family:"Baloo 2";font-size:13px;box-shadow:0 3px 0 var(--act-d);white-space:nowrap;}
    .pulse-echo{display:block;width:84px;height:84px;margin:-6px auto 2px;object-fit:contain;}
    .pulseChip.on{background:linear-gradient(180deg,var(--act-hi),var(--act))!important;color:#fff!important;border-color:var(--act-d)!important;}

    /* parent gate + beta pulse (warm) */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(74,44,20,.5);display:none;align-items:center;justify-content:center;padding:24px;}
    .ovl.show{display:flex;}
    .modal{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:330px;text-align:center;box-shadow:0 20px 50px rgba(74,44,20,.35);}
    .modal h3{font-family:"Baloo 2";font-weight:800;font-size:20px;color:var(--ink);}
    .modal p{font-weight:700;font-size:13.5px;color:var(--muted);margin-top:4px;}
    /* four spelled-out number words, sized to fit the modal on a small phone */
    #gateQ{font-family:"Baloo 2";font-weight:800;font-size:20px;letter-spacing:.06em;line-height:1.45;max-width:15ch;color:var(--orange-d);margin:10px auto 2px;}
    #gateIn{font-family:"Baloo 2";font-weight:800;font-size:26px;letter-spacing:8px;min-height:36px;color:var(--ink);}
    .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
    .pad button{border:none;border-radius:14px;padding:13px 0;font-family:"Baloo 2";font-weight:800;font-size:20px;background:var(--cream);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--track);}
    .pad button:active{transform:translateY(2px);box-shadow:none;}
    .modal.shake{animation:shake .35s;}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
    /* The beta pulse's Send button. The class is older than the pulse: it was
       the Grown-ups pop-up's, and that pop-up is gone (30 Sep 2026). */
    .sheetBtn{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:16px;padding:15px 16px;margin-top:10px;background:var(--cream);font-family:"Baloo 2";font-weight:800;font-size:16px;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--track);text-align:left;}
    .sheetBtn:active{transform:translateY(2px);box-shadow:none;}
    .ghost{border:none;background:none;color:var(--label);font-weight:800;font-size:13px;margin-top:12px;cursor:pointer;}
    #toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;border-radius:99px;padding:10px 18px;font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--ink);box-shadow:0 8px 22px rgba(74,44,20,.3);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap;}
    #toast.show{opacity:1;}
    .modal{max-height:calc(100dvh - 48px);overflow-y:auto;}
    #trialBanner{margin-top:18px;}
  </style>
  <link href="/crafted-home.css" rel="stylesheet" />
</head>
<body>
  <main id="libraryApp" class="library-wrap" hidden>
    <header class="library-header">
      <a id="buddyBtn" href="/customize.html" aria-label="Choose your buddy"></a>
      <span class="library-label">Sona</span>
      <button id="repPill" type="button" aria-label="Reps this week"><span class="rep-ic" data-ic="bolt" aria-hidden="true"></span><span class="rep-copy"><span id="repPillN">0</span><span class="rep-unit" id="repPillUnit">reps this week</span></span></button>
      <button id="parentBtn" type="button" aria-label="Grown-ups"><span class="pic-gear" aria-hidden="true"></span><span>Grown-ups</span></button>
    </header>
    <a id="trialBanner"><img class="tb-echo" src="/assets/crafted/echo-wave.webp" alt="" onerror="this.src='/assets/crafted/echo-welcome.webp'"><span id="trialMsg"></span><span class="tb-pill" aria-hidden="true">Share an idea</span></a>
    <div class="library-intro"><div><h1>Pick a game!</h1><p>A little practice. A lot to explore.</p></div><span id="libraryEcho" aria-hidden="true"></span></div>
    <aside id="catalogPreviewNotice" hidden><strong>Free &amp; Premium preview</strong><span id="catalogPreviewState"></span> <a href="/premium.html">Trial preview</a> · <a href="/activities.html?libraryPreview=0">Exit preview</a></aside>
    <div id="featuredGroups"></div>
    <div id="activityGroups"></div>
    <!-- BOOKS ARE ON (Travis, 26 Sep 2026: "yes turn them on"). One card opens
         the bookshelf: a twelve-page picture book for every sound, the
         ones not out yet all opening Friday 9 Oct (the dates live in
         library.html). The shelf opens for every family (30 Sep 2026):
         one book is free (FREE_BOOKS in sona.js) and the rest are Premium,
         each asking for a grown-up on the shelf the way a Premium game
         does here. -->
    <button id="booksCard" type="button">
      <span class="book-art" id="libraryBooksArt" aria-hidden="true"></span>
      <span class="books-copy"><span class="books-head"><span id="booksHeading">Books</span><span class="shelf-tag" id="booksTag">Free</span></span><span id="booksLine">Picture books Echo reads with you. New ones on the way.</span></span>
      <span class="books-go" aria-hidden="true">›</span>
    </button>
    <p class="age-note">Ages are a guide. Explore any game that fits.</p>
    <div id="libraryNotice" hidden><div class="notice-copy"><p id="libraryMessage" role="status"></p><button id="libraryUnlock" type="button">Ask a grown-up</button></div><button id="libraryMessageClose" aria-label="Close message">×</button></div>
  </main>
  <!-- parent gate -->
  <div class="ovl" id="gateOvl">
    <div class="modal" id="gateModal">
      <h3>For grown-ups</h3>
      <div id="gateQ"></div>
      <p id="gateHint"></p>
      <div id="gateIn"></div>
      <div class="pad" id="pad"></div>
      <button class="ghost" id="gateClose">Never mind</button>
    </div>
  </div>

  <!-- NO GROWN-UPS POP-UP (Travis, 30 Sep 2026: "when they click parents and
       put in code i want it to go straight to settings not have them choose
       what they wanna go to"). The right code goes straight to Settings,
       whose tab bar is the same three places the pop-up offered (Progress ·
       Settings · Talk to us) and whose Account line says the plan the
       pop-up's note used to. -->

  <!-- beta pulse — chip-first ask for founding families; X always works -->
  <div class="ovl" id="pulseOvl">
    <div class="modal" style="position:relative;background:var(--cream-card);">
      <button id="pulseX" aria-label="Close" style="position:absolute;top:12px;right:12px;width:36px;height:36px;border:1.5px solid var(--cream-line);border-radius:50%;background:var(--cream);color:var(--cream-ink);font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--cream-line);">✕</button>
      <img class="pulse-echo" src="/assets/crafted/echo-think.webp" alt="" onerror="this.src='/assets/crafted/echo-welcome.webp'">
      <div style="font-family:'Baloo 2';font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--act-d);">YOU'RE BUILDING SONA WITH US</div>
      <h3 id="pulseQ" style="margin-top:4px;">What should we build next?</h3>
      <div id="pulseOpts"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/sona.js"></script>
  <script src="/crafted-buddies.js"></script>
  <script>
    (function(){
      var S=window.Sona,app=document.getElementById("libraryApp"),host=document.getElementById("activityGroups");
      var notice=document.getElementById("libraryNotice"),message=document.getElementById("libraryMessage");
      if(!S||!S.activityLibrary){app.hidden=false;host.textContent="Your games could not load. Please reopen Sona and try again.";return;}
      var profile=S.getProfile();
      if(!profile.onboarded&&!profile.childName){location.replace("/onboarding.html");return;}
      app.hidden=false;
      // Preview access is tab-local; real family entitlements stay untouched.
      var preview=S.libraryPreview?S.libraryPreview():false;
      document.getElementById("catalogPreviewNotice").hidden=!preview;
      if(preview){
        var plan=S.previewPlan();
        document.getElementById("catalogPreviewState").textContent=plan.state==="trial"?"Trial preview: all available games unlocked. No payment or subscription.":plan.state==="expired"?"Trial ended preview: free games stay available. Purchases are off.":"Free games stay available. Premium games open through the grown-ups gate. Purchases are off.";
      }
      var library=S.activityLibrary(),lockedGame=null;
      // Home art is presentation only: the catalog still owns access and routes.
      // The map lives in sona.js since 30 Sep 2026: the plan screen shows the same pictures.
      var craftedCards=S.CRAFTED_CARDS||{};
      var unlock=document.getElementById("libraryUnlock");
      function node(tag,className,text){var el=document.createElement(tag);if(className)el.className=className;if(text)el.textContent=text;return el;}
      function access(game){return S.gameAccess?S.gameAccess(game.key):{allowed:!S.gated(game.key),tier:game.tier,reason:S.isFree()?"free-mode":"legacy"};}
      function clearMessage(){notice.hidden=true;message.textContent="";lockedGame=null;unlock.hidden=false;app.classList.remove("has-message");}
      function showLocked(game){
        var comingSoon=game.comingSoon||access(game).reason==="coming-soon";
        lockedGame=comingSoon?null:game;unlock.hidden=!!comingSoon;notice.hidden=false;app.classList.add("has-message");
        if(comingSoon){message.textContent=game.name+" is "+(game.comingLabel||"Coming soon").replace(/^Coming/,"coming")+". Pick another game to play.";return;}
        message.textContent="Ask a grown-up to help open "+game.name+". Your free games are still ready to play!";
      }
      document.getElementById("libraryMessageClose").onclick=clearMessage;
      unlock.onclick=function(){if(lockedGame)location.href="/premium.html?game="+encodeURIComponent(lockedGame.key);};
      // Home stays quiet. Practice begins only after a child picks a game.
      // a book card (What's new / Limited time) opens it on the bookshelf,
      // whose own rules decide free, Premium or not out yet
      function bookAccess(game){var ok=!(S.bookLocked&&S.bookLocked(game.name));return {allowed:ok,tier:game.tier,reason:ok?"book":"premium"};}
      function launch(game){
        if(game.kind==="book"){clearMessage();location.href=game.go;return;}
        if(!access(game).allowed){showLocked(game);return;}
        clearMessage();
        location.href=game.go;
      }
      function gameCard(game){
        var button=node("button","game-card");button.type="button";button.dataset.game=game.key;
        var grant=game.kind==="book"?bookAccess(game):access(game),tier=grant.reason==="free-mode"?"free":game.tier;
        if(game.kind==="book")button.classList.add("book-card");
        var comingSoon=game.comingSoon||grant.reason==="coming-soon";
        // a parked game says its day ("Coming Oct 9"), then "Coming soon"
        var label=comingSoon?(game.comingLabel||"Coming soon"):tier==="free"?"Free":grant.allowed?"Included":"Premium";
        button.disabled=!!comingSoon;button.classList.toggle("is-coming",!!comingSoon);
        button.dataset.locked=grant.allowed?"false":"true";
        button.setAttribute("aria-label",comingSoon?game.name+". "+label+".":game.name+". "+(game.playDescription||game.sub)+" "+(grant.allowed?label+".":"Premium. Ask a grown-up to unlock."));
        var art=node("span","game-art");art.setAttribute("aria-hidden","true");
        if(game.kind==="book"){
          var cover=node("img","crafted-card-image");cover.src=game.cover;cover.alt="";cover.decoding="async";cover.loading="lazy";art.appendChild(cover);
        }else if(craftedCards[game.key]){
          var picture=node("img","crafted-card-image");picture.src="/assets/crafted/home-"+craftedCards[game.key]+".webp";picture.alt="";picture.width=768;picture.height=432;picture.decoding="async";picture.loading="lazy";art.appendChild(picture);
        }else{var sticker=S.gameSticker(game.key);S.paintSticker(art,sticker[0],sticker[1]);}
        button.appendChild(art);
        var info=node("span","game-info");info.appendChild(node("span","game-name",game.name));
        info.appendChild(node("span","game-access"+(comingSoon?" coming-soon":tier==="premium"?" premium":""),label));
        var arrow=node("span","game-arrow","›");arrow.setAttribute("aria-hidden","true");info.appendChild(arrow);button.appendChild(info);button.onclick=function(){launch(game);};return button;
      }
      // A cached pre-shelves sona.js still supplies the complete age groups.
      (library.featured || []).forEach(function(collection){
        var section=node("section","featured-group");section.dataset.collection=collection.id;section.setAttribute("aria-labelledby","collection-"+collection.id);
        var top=node("div","shelf-heading"),heading=node("h2","",collection.name);heading.id="collection-"+collection.id;top.appendChild(heading);
        top.appendChild(node("span","shelf-tag",collection.id==="new"?"Just added":"Here for a little while"));section.appendChild(top);
        var grid=node("div","featured-grid");collection.games.forEach(function(game){grid.appendChild(gameCard(game));});section.appendChild(grid);document.getElementById("featuredGroups").appendChild(section);
      });
      // every game still being built goes in one Coming soon section after the
      // age groups, a few across and going down (Travis, 1 Oct 2026)
      var comingShelves=[];
      library.groups.forEach(function(group){
        var section=node("section","activity-group");section.dataset.group=group.id;section.setAttribute("aria-labelledby","group-"+group.id);
        var top=node("div","shelf-heading"),copy=node("div"),heading=node("h2","",group.name);heading.id="group-"+group.id;copy.appendChild(heading);
        copy.appendChild(node("p","",group.ageLabel));top.appendChild(copy);
        if(group.recommended)top.appendChild(node("span","shelf-tag recommended","For your child"));section.appendChild(top);
        var grid=node("div","game-grid"),parked=node("div","coming-grid");
        group.games.forEach(function(game){(game.comingSoon?parked:grid).appendChild(gameCard(game));});section.appendChild(grid);
        if(parked.childElementCount){var waiting=node("div","coming-shelf");waiting.appendChild(node("p","coming-heading",group.name+" · "+group.ageLabel.replace(/^Suggested a/,"A")));waiting.appendChild(parked);comingShelves.push(waiting);}
        host.appendChild(section);
      });
      if(comingShelves.length){var soon=node("section","coming-all");soon.id="comingGroups";var head=node("div","shelf-heading");head.appendChild(node("h2","","Coming soon"));head.appendChild(node("span","shelf-tag","New ones every week"));soon.appendChild(head);comingShelves.forEach(function(w){soon.appendChild(w);});host.appendChild(soon);}
      var lockedKey=new URLSearchParams(location.search).get("locked");
      library.groups.forEach(function(group){group.games.forEach(function(game){if(game.key===lockedKey&&!access(game).allowed)showLocked(game);});});
      // BOOKS: the shelf opens for every family (30 Sep 2026). Without
      // Premium, one book is free and the rest ask for a grown-up there; the
      // tag says which, so a parent reads "1 free book", not "Premium".
      var booksCard=document.getElementById("booksCard");
      var freeBooks=(S.FREE_BOOKS||[]).length;
      var booksOpen=S.booksOpen?S.booksOpen():!S.gated("books");
      document.getElementById("booksTag").textContent=S.isFree()?"Free":booksOpen?"Included":freeBooks?(freeBooks===1?"1 free book":freeBooks+" free books"):"Premium";
      booksCard.onclick=function(){clearMessage();location.href="/library.html";};
      // A cached library can return after a trial expires or an adult changes
      // preview state. Re-evaluate its labels without reviving stale access.
      window.addEventListener("pageshow",function(event){if(event.persisted)location.reload();});
      var echo=node("img");echo.src="/assets/crafted/echo-welcome.webp";echo.alt="";echo.width=84;echo.height=96;document.getElementById("libraryEcho").appendChild(echo);
      // the crafted picture (1 Oct 2026); the old sticker only if it can't load
      (function(host){var im=new Image();im.className="crafted-card-image";im.alt="";im.decoding="async";im.onerror=function(){host.innerHTML="";S.paintSticker(host,"pt-book","sky");};im.src="/assets/crafted/home-books.webp";host.appendChild(im);})(document.getElementById("libraryBooksArt"));
      // Cancel any previous spoken turn without changing the game voice preference.
      if(S.speakNow)S.speakNow("");
    })();
  </script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona;
    var P=(S&&S.getProfile)?S.getProfile():{};
    function sfx(n){try{if(S&&S.sfx&&S.sfx[n])S.sfx[n]();}catch(e){}}
    function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove("show");},1800);}
    if(S&&S.buddyMarkup)$("buddyBtn").innerHTML=SonaCraftedBuddies.markup(P.character||"fox",36);
    // Bank coins already earned by honest practice, once; browsing earns nothing.
    try{if(S&&S.mintCoins)S.mintCoins();}catch(e){}
    try{if(S&&S.repsBeacon)S.repsBeacon();}catch(e){}
    try{if(S&&S.syncHomework)S.syncHomework();}catch(e){}
    try{if(S&&S.iapRefresh)S.iapRefresh();}catch(e){}
    // Refresh clinician coverage without delaying the library. A changed
    // cached answer refreshes card access; unchanged coverage never reloads.
    try{
      if(S&&S.caseRefresh&&S.premium){
        var wasPremium=S.premium();
        S.caseRefresh().then(function(){if(S.premium()!==wasPremium)location.reload();},function(){});
      }
    }catch(e){}
    // ── parent gate: four spelled-out digits, for every family ──
    // It used to be arithmetic (3-8 × 3-8). Two problems: a seven-year-old who
    // knows their times tables walks straight through it, and there are only
    // about thirty plausible products to guess. Four number WORDS have to be
    // read to be answered — which is precisely what the child this gate exists
    // to stop cannot do — and there are ten thousand of them.
    // The optional parent code is gone (Travis, 30 Sep 2026: "get rid of the
    // parent code"); a code saved before then is simply never asked for. The
    // words stay: purchases sit behind this door, and Apple wants a grown-up
    // check before a buy screen.
    var NUMWORD=["ZERO","ONE","TWO","THREE","FOUR","FIVE","SIX","SEVEN","EIGHT","NINE"];
    var gateAns="", gateNeed="", gateNext=null;
    // Where the right code goes when nothing more particular asked: straight
    // to Settings (Travis, 30 Sep 2026: "go straight to settings not have them
    // choose what they wanna go to"). It used to open a Grown-ups pop-up of
    // three doors, and Settings' tab bar already is those three doors.
    function toSettings(){ location.href="/settings.html"; }
    function openGate(next){
      gateNext=next||toSettings; // a callback sends the grown-up somewhere else
      gateAns="";
      var d=[];
      for(var z=0;z<4;z++) d.push((Math.random()*10)|0);
      gateNeed=d.join("");
      $("gateQ").textContent=d.map(function(n){return NUMWORD[n];}).join(" · ");
      $("gateHint").textContent="Tap these numbers in order";
      $("gateIn").textContent="";
      $("gateOvl").classList.add("show");
    }
    $("parentBtn").onclick=function(){ sfx("tap"); openGate(); };
    // REPWEEKS1: the week's reps, read (never written). It is painted on load
    // and again whenever the app comes back to the front: an iPhone keeps
    // Home alive in the background, and a family opening it on Monday morning
    // must not see last week's number under "this week". A tap is a grown-up's
    // way to the week-by-week card, so it meets the same gate as the gear — a
    // child who taps it gets "For grown-ups" and Never mind.
    // repNum builds the thousands comma by hand: progtest scans this page's
    // source for a dollar sign before a digit, which a regex replace needs.
    function repNum(n){n=String(Math.max(0,Math.floor(Number(n)||0)));var o="";while(n.length>3){o=","+n.slice(-3)+o;n=n.slice(0,-3);}return n+o;}
    function paintReps(){
      var n=0; try{ n=(S&&S.weekReps)?S.weekReps(0):0; }catch(e){}
      $("repPillN").textContent=repNum(n);
      $("repPillUnit").textContent=(n===1?"rep":"reps")+" this week";
      $("repPill").setAttribute("aria-label",repNum(n)+(n===1?" rep":" reps")+" this week. For grown-ups: see week by week.");
    }
    paintReps();
    document.addEventListener("visibilitychange",function(){ if(!document.hidden) paintReps(); });
    $("repPill").onclick=function(){ sfx("tap"); openGate(function(){ location.href="/settings.html#reps"; }); };
    (function(){
      var pad=$("pad"); var keys=[1,2,3,4,5,6,7,8,9,"⌫",0,"✓"];
      keys.forEach(function(kk){
        var b=document.createElement("button"); b.textContent=kk;
        b.onclick=function(){
          if(kk==="⌫"){ gateAns=gateAns.slice(0,-1); }
          else if(kk==="✓"){
            if(gateAns===gateNeed){ try{ if(S&&S.gateVerify)S.gateVerify(); }catch(e){} $("gateOvl").classList.remove("show"); sfx("correct"); var fn=gateNext||toSettings; gateNext=null; fn(); }
            else { var m=$("gateModal"); m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake"); gateAns=""; }
          }
          else { if(gateAns.length<gateNeed.length) gateAns+=String(kk); }
          $("gateIn").textContent=gateAns;
        };
        pad.appendChild(b);
      });
    })();
    $("gateClose").onclick=function(){ $("gateOvl").classList.remove("show"); };
    // bounced here from a parent-only page (Sona.requireGate)? Open the gate
    // right away — and send them ON to where they were going once they pass.
    // Without this the parent solves a number puzzle and lands on the kid's
    // home screen, with no sign of the plan screen (or progress page) that
    // bounced them. Sona.gateDest re-checks the allowlist HERE too: this reads
    // a URL, and a URL is never trusted because it arrived. A bounce with no
    // allowed destination goes to Settings, as the Grown-ups button does;
    // replace(), so a back-swipe from there doesn't reopen this gate.
    try{
      if(/[?&]gate=1/.test(location.search)){
        var _raw=""; try{ _raw=decodeURIComponent((location.search.match(/[?&]to=([^&]*)/)||[])[1]||""); }catch(e){}
        var _to=""; try{ _to=(S&&S.gateDest)?S.gateDest(_raw):""; }catch(e){}
        openGate(function(){ location.replace(_to||"/settings.html"); });
      }
    }catch(e){}
    try{ document.querySelectorAll(".pic-trend").forEach(function(n){ n.innerHTML=S.icon("trend",18); }); document.querySelectorAll(".pic-gear").forEach(function(n){ n.innerHTML=S.icon("gear",18); }); document.querySelectorAll("[data-ic]").forEach(function(n){ var m=S.icon(n.dataset.ic,18); if(m) n.innerHTML=m; }); }catch(e){}

    // ── founding banner (web only) ──
    // Hard rule: the kid home shows zero prices, trials, or countdowns. The
    // plan and any trial are said in Settings → Account, behind the gate (the
    // Grown-ups pop-up's plan note moved there on 30 Sep 2026, with the pop-up
    // gone). Founding families keep a kid-safe banner that opens the feedback
    // pulse.
    (function(){ if(!S)return; if(S.isNativeApp&&S.isNativeApp())return;
      var b=$("trialBanner"),m=$("trialMsg");
      if(P.earlyAdopter&&b&&m){ m.textContent="Founding family: you're building Sona with us!"; b.removeAttribute("href"); b.style.cursor="pointer"; b.onclick=function(ev){ if(ev&&ev.preventDefault)ev.preventDefault(); showPulse(true); }; b.style.display="flex"; }
    })();

    // ── beta pulse: chip-first (a tap beats a blank box — the Mobbin study's
    // one repeated pattern). Picking a chip reveals the optional note + Send.
    // X always dismisses, and a send OR a dismiss quiets the auto-ask for two
    // weeks — brand-new families must never feel nagged. Banner tap still
    // opens it any time.
    var PULSE_COOL=14*24*3600*1000;
    var PULSE_CHIPS=["More games","New sounds to practice","Progress reports","Easier for my kid","Something's broken","Something else"];
    function pulseState(){ try{ return JSON.parse(localStorage.getItem("sona.pulse.v1")||"{}"); }catch(e){ return {}; } }
    function pulseSave(s){ try{ localStorage.setItem("sona.pulse.v1",JSON.stringify(s)); }catch(e){} }
    function showPulse(force){
      var st=pulseState();
      var w=$("pulseOpts");
      var picked={};
      w.innerHTML='<div id="pulseChips" style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;"></div>'
        +'<div id="pulseMore" style="display:none;">'
        +'<textarea id="pulseText" rows="2" placeholder="Anything else? (optional)" '
        +'style="width:100%;border:1.5px solid var(--cream-line);background:#fff;border-radius:14px;padding:12px;font-family:Nunito,sans-serif;font-weight:700;font-size:14px;color:var(--ink);resize:none;margin-top:10px;"></textarea>'
        +'<button id="pulseSend" class="sheetBtn" style="justify-content:center;border-radius:999px;background:linear-gradient(180deg,var(--act-hi),var(--act));color:#fff;text-shadow:0 1px 0 var(--act-d);box-shadow:0 4px 0 var(--act-d);">Send it</button>'
        +'</div>';
      var row=$("pulseChips");
      PULSE_CHIPS.forEach(function(label){
        var b=document.createElement("button");
        b.type="button"; b.textContent=label; b.className="pulseChip";
        b.style.cssText="border:1.5px solid var(--cream-line);border-radius:999px;padding:9px 14px;background:var(--cream);color:var(--cream-ink);font-family:'Baloo 2';font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--cream-line);";
        b.onclick=function(){
          picked[label]=!picked[label];
          b.classList.toggle("on",!!picked[label]);
          var any=PULSE_CHIPS.some(function(k){ return picked[k]; });
          $("pulseMore").style.display=any?"block":"none";
        };
        row.appendChild(b);
      });
      $("pulseSend").onclick=function(){
        var chips=PULSE_CHIPS.filter(function(k){ return picked[k]; });
        if(!chips.length) return;
        var note=($("pulseText").value||"").trim().slice(0,600);
        var code=""; try{ code=(S.pilotInfo&&S.pilotInfo().code)||""; }catch(e){}
        try{ fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,
          body:JSON.stringify({q:"pulse.chips",text:chips.join(" + ")+(note?" · "+note:""),src:"pulse",code:code})}).catch(function(){}); }catch(e){}
        st.last=Date.now(); st.cool=Date.now()+PULSE_COOL; pulseSave(st);
        $("pulseOvl").classList.remove("show"); sfx("correct"); toast("Thanks! We build fast ✓");
      };
      $("pulseOvl").classList.add("show");
      if(force){ st.last=Date.now(); pulseSave(st); }
    }
    $("pulseX").onclick=function(){ var st=pulseState(); st.last=Date.now(); st.cool=Date.now()+PULSE_COOL; pulseSave(st); $("pulseOvl").classList.remove("show"); sfx("tap"); };
    (function(){
      if(!P.earlyAdopter) return;
      var st=pulseState(); st.visits=(st.visits||0)+1; pulseSave(st);
      var dayAgo=!st.last || (Date.now()-st.last)>20*3600*1000;
      var cooling=!!st.cool && Date.now()<st.cool;
      var due=st.visits>=3 && st.visits%3===0 && dayAgo && !cooling;
      if(due) setTimeout(function(){ showPulse(false); var s2=pulseState(); s2.last=Date.now(); pulseSave(s2); },900);
    })();
  </script>
