<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#fff6e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- first-run guard: a brand-new family (no onboarding done, no name) never
       sees the home screen with a blank default profile — they set up first.
       Covers deep links and the native shell's start URL alike. -->
  <script>
    (function(){
      try{
        // runs BEFORE sona.js, so the kid namespace has to be resolved by hand
        // here — otherwise this always reads the first child and a freshly added
        // sibling would skip setup (KIDS1)
        var slot=""; try{ var kk=JSON.parse(localStorage.getItem("sona.kids.v1")||"null"); if(kk&&kk.active) slot=kk.active; }catch(e){}
        var key="sona.profile.v1"+(slot?"@"+slot:"");
        var p=JSON.parse(localStorage.getItem(key)||"{}");
        if(!p.onboarded&&!p.childName){ document.documentElement.style.display="none"; location.replace("/onboarding.html"); }
      }catch(e){}
    })();
  </script>
  <style>
    :root{
      /* readable muted/label (fix pack 1a): 4.6:1 on cream — #b08d63/#c9a878
         stay only in decorative spots */
      --cream:#fff6e9; --ink:#4a2c14; --muted:#8a6f52; --label:#a17c4a; --track:#f0e4d2;
      --green:#58cc02; --green-d:#46a302; --orange:#ff8a3d; --orange-d:#ef6f23; --gold:#ffd21c;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;user-select:none;}
    html,body{height:100%;overflow:hidden;background:var(--cream);color:var(--ink);overscroll-behavior:none;}
    /* WKWebView rubber-band shows the webview's own (white) backdrop — pin a
       fixed cream underlay behind everything so a bounce never flashes white */
    body::before{content:"";position:fixed;inset:-120px;background:var(--cream);z-index:-1;}
    #wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;height:100dvh;overflow:hidden;}

    /* header — the sticker book (design section 2) */
    header{display:flex;align-items:center;gap:10px;}
    #hiName{font-family:"Baloo 2";font-weight:800;font-size:23px;line-height:1.1;}
    #subLine{font-weight:800;font-size:12.5px;color:var(--muted);margin-top:2px;}
    #hdrBtns{margin-left:auto;display:flex;align-items:center;gap:8px;}
    #libBtn{border:none;width:44px;height:44px;border-radius:50%;background:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 0 rgba(120,80,20,.15);}
    #ringBtn{border:none;width:44px;height:44px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(120,80,20,.15);padding:0;display:flex;align-items:center;justify-content:center;}
    /* parent corner is a gear — Echo is never a locked door (fix pack 1a) */
    #parentBtn{border:none;cursor:pointer;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(140,70,10,.14);display:flex;align-items:center;justify-content:center;color:#8a6f52;}

    /* hero: today's activity as a tilted photo card */
    /* flex:1 + centering lets the hero absorb tall-screen slack instead of
       leaving one dead gap above the CTA */
    #heroWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0;padding:6px 0 2px;}
    /* height-driven: the card scales to whatever space the locked page leaves */
    /* the card BREATHES: it fills whatever height the flex column leaves
       (banner, nudge, iOS call pill all just shrink it) instead of holding a
       fixed 41dvh that overflowed the page whenever extra rows appeared */
    #heroCard{position:relative;height:100%;min-height:150px;max-height:400px;max-width:80vw;aspect-ratio:234/290;border-radius:26px;border:7px solid #fff;box-shadow:0 12px 26px rgba(90,50,10,.2);transform:rotate(-2deg);background:#eee center/cover no-repeat;cursor:pointer;transition:transform .12s;}
    #heroCard:active{transform:rotate(-2deg) scale(.98);}
    #heroCap{background:#fff;border-radius:16px;padding:10px 20px 12px;box-shadow:0 6px 16px rgba(90,50,10,.14);transform:rotate(1.5deg);margin-top:-26px;text-align:center;max-width:82vw;}
    #heroName{font-family:"Baloo 2";font-weight:800;font-size:19px;}
    #heroSub{font-weight:800;font-size:12px;color:var(--muted);}
    #heroSub b{color:var(--gold);letter-spacing:1px;}

    /* up next thumbnails */
    #upNextLbl{font-family:"Baloo 2";font-weight:800;font-size:12px;letter-spacing:.1em;color:var(--label);}
    /* DAY1: three games, not two — they share the row, so they shrink */
    #thumbs{display:flex;gap:10px;justify-content:center;}
    .thumb{position:relative;flex:1 1 0;min-width:0;max-width:118px;aspect-ratio:1/.97;border-radius:18px;border:5px solid #fff;box-shadow:0 6px 14px rgba(90,50,10,.16);background:#eee center/cover no-repeat;cursor:pointer;transition:transform .12s;margin-bottom:12px;}
    .thumb:nth-child(1){transform:rotate(-2.5deg);}
    .thumb:nth-child(2){transform:rotate(1deg);}
    .thumb:nth-child(3){transform:rotate(2.5deg);}
    .thumb:active{transform:scale(.95);}
    /* LOCKED: dimmed, desaturated, with a padlock. Deliberately still shows the
       art — a kid needs to see what they're about to earn, not a grey box. */
    .thumb.locked{filter:grayscale(.75) brightness(.72);cursor:default;}
    .thumb.locked:active{transform:none;}
    .thumb .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;
      text-shadow:0 3px 8px rgba(0,0,0,.45);}
    .thumb.locked:nth-child(1),.thumb.locked:nth-child(2),.thumb.locked:nth-child(3){transform:rotate(0deg);}
    /* the shake a locked card does when tapped: "not yet — story first" */
    @keyframes nudge{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
    .thumb.nope{animation:nudge .32s;}
    .thumb b{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:#fff;border-radius:99px;padding:4px 11px;font-family:"Baloo 2";font-weight:800;font-size:11px;color:var(--ink);white-space:nowrap;box-shadow:0 3px 0 rgba(120,80,20,.12);}

    /* CTA */

    /* coming-soon tease (Coach Call): softly desaturated, gold ribbon, still tappable */
    .soon{filter:saturate(.72);}
    .soonTag{position:absolute;top:12px;left:-9px;background:linear-gradient(180deg,#ffe063,var(--gold));color:#7a5200;font-family:"Baloo 2";font-weight:800;font-size:12px;letter-spacing:.08em;padding:5px 13px;border-radius:99px;box-shadow:0 3px 0 rgba(120,80,20,.18);transform:rotate(-4deg);pointer-events:none;}
    .thumb .soonTag{top:6px;left:-7px;font-size:10px;padding:3px 9px;}

    /* founding banner (feedback invite — never pricing) */
    #trialBanner{display:none;align-items:center;gap:8px;background:linear-gradient(120deg,#fff7e6,#ffe9c2);border:1px solid #ffe2a8;border-radius:14px;padding:9px 14px;font-weight:800;font-size:12.5px;color:#8a6400;text-decoration:none;}

    /* parent gate + sheet (warm) */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(74,44,20,.5);display:none;align-items:center;justify-content:center;padding:24px;}
    .ovl.show{display:flex;}
    .modal{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:330px;text-align:center;box-shadow:0 20px 50px rgba(74,44,20,.35);}
    .modal h3{font-family:"Baloo 2";font-weight:800;font-size:20px;color:var(--ink);}
    .modal p{font-weight:700;font-size:13.5px;color:var(--muted);margin-top:4px;}
    #gateQ{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--orange-d);margin:10px 0 2px;}
    #gateIn{font-family:"Baloo 2";font-weight:800;font-size:26px;letter-spacing:8px;min-height:36px;color:var(--ink);}
    .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
    .pad button{border:none;border-radius:14px;padding:13px 0;font-family:"Baloo 2";font-weight:800;font-size:20px;background:var(--cream);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--track);}
    .pad button:active{transform:translateY(2px);box-shadow:none;}
    .modal.shake{animation:shake .35s;}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
    .sheetBtn{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:16px;padding:15px 16px;margin-top:10px;background:var(--cream);font-family:"Baloo 2";font-weight:800;font-size:16px;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--track);text-align:left;}
    .sheetBtn:active{transform:translateY(2px);box-shadow:none;}
    .ghost{border:none;background:none;color:var(--label);font-weight:800;font-size:13px;margin-top:12px;cursor:pointer;}
    #toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;border-radius:99px;padding:10px 18px;font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--ink);box-shadow:0 8px 22px rgba(74,44,20,.3);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap;}
    #toast.show{opacity:1;}
    /* short screens: everything shrinks so the locked page never clips */
    /* landscape rescue: with the height-driven hero, a rotated phone crushed
       the play card to ~18px. Short-wide viewports unlock scrolling and give
       the hero a real minimum — scrolling beats a broken-looking screen. */
    @media (orientation:landscape) and (max-height:520px){
      html,body{overflow:auto;height:auto;}
      #wrap{height:auto;min-height:100dvh;overflow:visible;}
      #heroCard{height:auto;min-height:230px;}
    }
    @media (max-height:760px){
      #wrap{gap:10px;}

    }

    /* METER1 — the star jar. A glass the child fills with light by talking;
       it empties overnight, which is what makes tomorrow a fresh jar. */
    #jarRow{display:flex;align-items:center;gap:12px;}
    #jar{position:relative;width:44px;height:56px;flex:none;border-radius:7px 7px 13px 13px;
      border:3px solid #e8d7bb;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:0 3px 0 rgba(140,90,20,.10);}
    #jar:before{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:22px;height:5px;
      border-radius:3px;background:#e8d7bb;}
    #jarFill{position:absolute;left:0;right:0;bottom:0;height:0%;
      background:linear-gradient(180deg,#ffe27a,#ffc31c);transition:height .5s cubic-bezier(.4,1.3,.5,1);}
    #jarFill:after{content:"";position:absolute;top:-3px;left:0;right:0;height:6px;border-radius:50%;
      background:rgba(255,255,255,.5);}
    #jarStar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;
      opacity:0;transition:opacity .4s;}
    #jar.full #jarStar{opacity:1;}
    #jarTxt b{font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--ink);}
    #jarTxt span{display:block;font-weight:800;font-size:11.5px;color:var(--muted);}
    #purse{margin-left:auto;display:flex;align-items:center;gap:5px;font-family:"Baloo 2";font-weight:800;
      font-size:15px;color:#a1701a;background:#fff5dc;border-radius:99px;padding:6px 13px;border:2px solid #f0dfb4;}
    @media (prefers-reduced-motion:reduce){ #jarFill{transition:none;} }

    /* the mystery card sits at the end of the row when bought or buyable */
    .thumb.mystery{background:linear-gradient(160deg,#6b4fd6,#3b2a86)!important;}
    .thumb.mystery .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-size:30px;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.4);}
    .thumb.mystery .cost{position:absolute;top:5px;right:5px;background:#ffd21c;color:#5b3d00;border-radius:99px;
      padding:2px 7px;font-family:"Baloo 2";font-weight:800;font-size:10px;}

    /* the sticker-book home: the CTA is the full-width bar under the deck */
    #goBtn{border:none;border-radius:20px;padding:17px;font-family:"Baloo 2";font-weight:800;font-size:19px;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 6px 0 var(--orange-d);cursor:pointer;width:100%;margin-top:auto;transition:transform .05s;}
    #goBtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d);}
    @media (max-height:760px){ #goBtn{padding:13px;font-size:17px;} }
    #confetti i{position:absolute;border-radius:3px;z-index:6;animation:cfall 1.2s ease-out forwards;}
    @keyframes cfall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(60px) rotate(40deg)}}
    @media (prefers-reduced-motion:reduce){ #confetti i{animation:none;} }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <div>
        <div id="hiName">Hi!</div>
        <div id="subLine"></div>
      </div>
      <div id="hdrBtns">
        <button id="ringBtn" aria-label="Reps today" style="display:flex;align-items:center;gap:5px;font-family:'Baloo 2';font-weight:800;font-size:15px;color:#4a2c14;padding:0 13px;"><svg viewBox="0 0 64 64" style="width:17px;height:17px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg><span id="ringTxt">0</span></button>
        <button id="libBtn" aria-label="Book library"><svg viewBox="0 0 64 64" style="width:24px;height:24px;vertical-align:middle"><path d="M10 14c8-4 15-4 22 0v38c-7-4-14-4-22 0Z" fill="#4db3f2"/><path d="M54 14c-8-4-15-4-22 0v38c7-4 14-4 22 0Z" fill="#2a8fd4"/><line x1="32" y1="14" x2="32" y2="52" stroke="#1c6fa8" stroke-width="2"/><circle cx="19" cy="22" r="3" fill="#fff" opacity=".8"/></svg></button>
        <button id="parentBtn" aria-label="For grown-ups"><span class="pic-gear"></span></button>
      </div>
    </header>

    <a id="trialBanner" href="/subscribe"><span data-ic="gift">🎁</span> <span id="trialMsg"></span></a>

    <!-- the sticker-book home: today's activity as a tilted panel card with a
         caption plate, the next two on a shelf below, one CTA. Swipe the hero
         or tap a thumb to change what LET'S GO opens. -->
    <div id="jarRow">
      <div id="jar"><div id="jarFill"></div><div id="jarStar">⭐</div></div>
      <div id="jarTxt"><b id="jarHead">Fill the star jar!</b><span id="jarSub"></span></div>
      <div id="purse" title="Coins"><span>🪙</span><span id="coinTxt">0</span></div>
    </div>

    <div id="heroWrap">
      <div id="heroCard"></div>
      <div id="heroCap">
        <div id="heroName"></div>
        <div id="heroSub"></div>
      </div>
    </div>
    <div id="upNextLbl">TODAY’S GAMES</div>
    <div id="thumbs"></div>
    <button id="goBtn">LET'S GO!</button>
  </div>

  <!-- parent gate -->
  <div class="ovl" id="gateOvl">
    <div class="modal" id="gateModal">
      <h3>For grown-ups</h3>
      <div id="gateQ"></div>
      <p id="gateHint"></p>
      <div id="gateIn"></div>
      <div class="pad" id="pad"></div>
      <button class="ghost" id="gateClose">Never mind</button>
    </div>
  </div>

  <!-- parent sheet -->
  <div class="ovl" id="sheetOvl">
    <div class="modal">
      <h3>Parent corner</h3>
      <div id="weekCard" style="background:var(--cream);border-radius:16px;padding:14px 16px;margin-top:12px;text-align:left;">
        <div style="display:flex;align-items:center;gap:8px;">
          <b style="font-family:'Baloo 2';font-size:15px;color:var(--ink);">This week</b>
          <span id="wkStreak" style="margin-left:auto;font-family:'Baloo 2';font-weight:800;font-size:12.5px;color:var(--orange-d);"></span>
        </div>
        <div id="wkDots" style="display:flex;gap:7px;margin-top:10px;justify-content:space-between;"></div>
        <div id="wkMsg" style="font-weight:800;font-size:12.5px;color:var(--muted);margin-top:9px;"></div>
        <div id="wkWins" style="font-family:'Baloo 2';font-weight:800;font-size:13px;color:var(--ink);margin-top:6px;"></div>
        <button id="shareWeek" style="display:none;width:100%;border:none;border-radius:14px;padding:12px;margin-top:10px;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 4px 0 var(--orange-d);color:#fff;font-family:'Baloo 2';font-weight:800;font-size:14px;cursor:pointer;">Share this week</button>
      </div>
      <div id="planCard" style="display:none;background:var(--cream);border-radius:16px;padding:14px 16px;margin-top:10px;text-align:left;">
        <div style="display:flex;align-items:center;gap:8px;">
          <b style="font-family:'Baloo 2';font-size:15px;color:var(--ink);">This week</b>
        </div>
        <div id="storyBits" style="font-weight:800;font-size:12px;color:var(--ink);margin-top:9px;line-height:1.55;"></div>
        <div style="font-weight:800;font-size:10.5px;color:var(--label);margin-top:8px;">Built with Rachel — licensed speech-language pathologist. A practice snapshot, not an evaluation.</div>
      </div>
      <div id="planNote" style="display:none;background:var(--cream);border-radius:16px;padding:12px 16px;margin-top:10px;text-align:left;font-weight:800;font-size:12.5px;color:var(--muted);"></div>
      <button class="sheetBtn" id="goProgress"><span class="pic-trend"></span>&nbsp; Progress &amp; SLP report</button>
      <button class="sheetBtn" id="goSettings"><span class="pic-gear"></span>&nbsp; Settings</button>
      <button class="ghost" id="sheetClose">Close</button>
    </div>
  </div>

  <!-- beta pulse — chip-first ask for founding families; X always works -->
  <div class="ovl" id="pulseOvl">
    <div class="modal" style="position:relative;text-align:left;">
      <button id="pulseX" aria-label="Close" style="position:absolute;top:10px;right:10px;width:34px;height:34px;border:none;border-radius:50%;background:var(--cream);color:var(--label);font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 2px 0 var(--track);">✕</button>
      <div style="font-family:'Baloo 2';font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--orange-d);padding-right:40px;">BETA · YOU'RE BUILDING SONA WITH US</div>
      <h3 id="pulseQ" style="text-align:left;margin-top:8px;">What should we build next?</h3>
      <div id="pulseOpts"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/sona.js"></script>
  <script src="/scenes.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona;
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }
    function toast(t){ var el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove("show");},1800); }

    var P=(S&&S.getProfile)?S.getProfile():{};
    var d=(S&&S.dailyInfo)?S.dailyInfo():{playedToday:false,score:0,best:0};
    var sound=(((S&&S.rotSound)?S.rotSound():"")||((P.focusSounds&&P.focusSounds[0])||"R")).toUpperCase();
    function currentLevel(){ try{ return (S&&S.unlockedThru)?Math.max(1,S.unlockedThru()):1; }catch(e){ return 1; } }

    $("hiName").textContent="Hi"+(P.childName?", "+P.childName:"")+"!";
    // PLAY1: a play family never chose a sound to "practice" — the greeting is
    // about the games, not a target
    $("subLine").textContent=(S&&S.playMode&&S.playMode())
      ? "Let's play some talking games!"
      : "Let's practice your "+((S&&S.soundLabel)?S.soundLabel(sound):sound)+" sound";
    try{ var _tr=(S&&S.todayRing)?S.todayRing():null;
      // tomorrow-hook (the one safe streak borrowing): the completed state
      // points forward, never at a breakable number
      if(_tr&&_tr.done) $("subLine").textContent="All done today ★ — Echo has a new adventure tomorrow! Free play's open.";
      else if(_tr&&_tr.n>0) $("subLine").textContent=(_tr.goal-_tr.n)+" more round"+((_tr.goal-_tr.n)===1?"":"s")+" to finish today's goal!";
    }catch(e){}

    // ── DAY1: the day is one story, then three games ───────────────────────
    // The hero is not a game any more — it is TODAY'S CHAPTER, and it is the
    // only thing tappable until it's read. The three cards below are the day's
    // trio, drawn fresh each morning by Sona.dailyGames(), and they wear a
    // padlock until the story is finished.
    //
    // Why gate at all: a kid given six games picks the same one every day, and
    // the story — the thing that makes tomorrow worth showing up for — never
    // gets opened. Story first means every session has a beginning.
    var ICON={slice:"🍉",tiles:"🎹",stack:"🧱",run:"🏃",glide:"🎈",feed:"🦜"};
    var EP=null, TRIO=[], READ=false;
    try{ EP=S.dailyStory(); TRIO=S.dailyGames()||[]; READ=!!S.storyRead(); }catch(e){}

    function art(key){ try{ return (window.SonaScenes&&SonaScenes.has(key))?("url('"+SonaScenes.uri(key)+"')"):""; }catch(e){ return ""; } }
    // The painted panel takes over the moment it decodes — sized per slot (hero
    // 800w, thumbs 300w) so the swap beats the eye. Two art shapes live side by
    // side: full-bleed painted scenes (tall 2:3, the house-in-its-street style)
    // simply cover the card; square sticker cut-outs layer over the vector city.
    function upgradeArt(el,key){ var im=new Image(); im.onload=function(){
      var fullBleed = im.naturalHeight > im.naturalWidth*1.2;
      if(fullBleed){ el.style.backgroundImage="url('"+im.src+"')"; el.style.backgroundSize="cover"; el.style.backgroundPosition="center"; el.style.backgroundRepeat="no-repeat"; return; }
      var base=art(key);
      el.style.backgroundImage="url('"+im.src+"')"+(base?", "+base:"");
      el.style.backgroundSize="88% auto"+(base?", cover":"");
      el.style.backgroundPosition="center 62%"+(base?", center":"");
      el.style.backgroundRepeat="no-repeat";
    }; im.src="/coach/city/"+key+"-"+(el.id==="heroCard"?"800":"300")+".webp"; }
    function applyArt(el,key){
      if(key==="feed"&&!art(key)){
        el.style.backgroundImage="linear-gradient(160deg,#ffe9b8,#b6eca0)";
        el.style.backgroundSize="cover"; upgradeArt(el,key); return;
      }
      el.style.backgroundImage=art(key); upgradeArt(el,key);
    }

    function renderHero(){
      var hero=$("heroCard");
      if(!READ){
        // the story card: a night sky, because that is where the arc lives
        hero.style.backgroundImage="linear-gradient(170deg,#2b56a8,#152a5c 55%,#0d1b3e)";
        hero.style.backgroundSize="cover";
        hero.innerHTML='<span style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">'
          +'<span style="font-size:62px;text-shadow:0 8px 16px rgba(0,0,0,.45);">📖</span>'
          +'<span style="font-family:\'Baloo 2\';font-weight:800;font-size:12px;letter-spacing:.1em;color:#ffd21c;">CHAPTER '+(S.dailyChapterNum?S.dailyChapterNum():1)+'</span>'
          +'</span>';
        $("heroName").textContent=EP?EP.t:"Today's story";
        $("heroSub").innerHTML="Read it first to unlock <b>3</b> games";
        $("goBtn").textContent="READ TODAY'S STORY";
        $("goBtn").dataset.launch="/chapter.html";
        return;
      }
      // story done: the hero becomes the first of today's unlocked games
      var k=TRIO[0], act=(S.gameAct&&S.gameAct(k))||null;
      applyArt(hero,k);
      hero.innerHTML=(k==="feed"&&!art(k))
        ? '<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:78px;text-shadow:0 8px 14px rgba(120,70,10,.25);">🦜🍎</span>' : "";
      $("heroName").textContent=act?act.name:"Play";
      $("heroSub").textContent=act?act.sub:"";
      $("goBtn").textContent="LET'S GO!";
      $("goBtn").dataset.launch=act?act.go:"/chapter.html";
    }

    function renderThumbs(){
      var t=$("thumbs"); t.innerHTML="";
      // once the story is read the hero IS trio[0], so the row shows the rest;
      // before that it shows all three, locked, so the kid sees the whole prize
      var show=READ?TRIO.slice(1):TRIO;
      $("upNextLbl").textContent=READ?"UP NEXT":"TODAY’S GAMES — LOCKED 🔒";
      show.forEach(function(k){
        var act=(S.gameAct&&S.gameAct(k))||{name:"Game",go:"/today.html"};
        var el=document.createElement("div");
        el.className="thumb"+(READ?"":" locked");
        el.dataset.key=k;
        applyArt(el,k);
        el.innerHTML="<b>"+act.name+"</b>"+(READ?"":'<span class="lock">🔒</span>');
        el.onclick=function(){
          if(!READ){
            // never a dead tap: say what unlocks it, and offer the way there
            sfx("tap"); el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope");
            $("heroSub").innerHTML="Read <b>today’s story</b> to unlock this!";
            return;
          }
          sfx("tap"); location.href=act.go;
        };
        t.appendChild(el);
      });
      renderMystery(t);
    }

    // METER1 + COIN1 — coins are minted from reps here rather than inside the
    // games, so every door into the app settles up the same way and no game
    // has to remember to pay.
    function paintJar(){
      try{
        S.mintCoins&&S.mintCoins();
        var g=S.goalState();
        $("jarFill").style.height=Math.round(g.pct*100)+"%";
        $("jar").classList.toggle("full",g.full);
        $("jarHead").textContent=g.full?"Jar full! ⭐":"Fill the star jar!";
        $("jarSub").textContent=g.full
          ? "You said "+g.n+" sounds today."
          : g.n+" of "+g.goal+" sounds — keep talking!";
        $("coinTxt").textContent=String(S.getCoins?S.getCoins():0);
      }catch(e){}
    }

    function renderMystery(t){
      // Additive by design: the mystery game is a FOURTH door, never a way past
      // the story. A coin that skipped the gate would undo the gate.
      if(!READ) return;
      var owned=S.mysteryGame&&S.mysteryGame();
      var can=S.canBuyMystery&&S.canBuyMystery();
      if(!owned&&!can) return;
      var el=document.createElement("div");
      el.className="thumb mystery"; el.dataset.key="mystery";
      if(owned){
        var act=(S.gameAct&&S.gameAct(owned))||{name:"Mystery",go:"/today.html"};
        el.innerHTML='<span class="q">🎁</span><b>'+act.name+'</b>';
        el.onclick=function(){ sfx("tap"); location.href=act.go; };
      } else {
        el.innerHTML='<span class="q">❓</span><b>Mystery game</b><span class="cost">🪙'+(S.mysteryCost?S.mysteryCost():15)+'</span>';
        el.onclick=function(){
          var got=S.buyMystery&&S.buyMystery();
          if(!got){ $("heroSub").textContent="Not enough coins yet — keep practising!"; return; }
          try{ S.confetti&&S.confetti({count:120}); }catch(e){}
          sfx("win"); render();
        };
      }
      t.appendChild(el);
    }

    function render(){ renderHero(); renderThumbs(); paintJar(); }
    render();
    function launch(){ sfx("tap"); location.href=$("goBtn").dataset.launch||"/chapter.html"; }
    $("heroCard").onclick=launch;
    $("goBtn").onclick=launch;

    // ── library ──
    $("libBtn").onclick=function(){ sfx("tap"); location.href="/library.html"; };

    // weekly volume sync — anonymous {id, week, rep count}, throttled in sona.js
    try{ if(S&&S.repsBeacon) S.repsBeacon(); }catch(e){}
    // App Store build: quiet entitlement sync (restores/reinstalls stay unlocked)
    try{ if(S&&S.iapRefresh) S.iapRefresh(); }catch(e){}

    // The comeback modal lived here and is deliberately GONE (Travis's call) —
    // a popup between the kid and the day's story was friction on exactly the
    // visit we most want to go well. The chapter card is the greeting.
    // ── the rep pill (RING1): every honest rep the kid says today ticks this
    // number UP — a count that only climbs (never 0/5 pressure). Gold once the
    // day's 5 rounds are done; tapping explains both numbers honestly.
    function paintRing(){
      try{
        var reps=(S.repsToday?S.repsToday():0);
        $("ringTxt").textContent=String(reps);
        if(S.todayRing().done){ $("ringBtn").style.color="#f0a800"; $("ringBtn").classList.add("gold"); }
      }catch(e){}
    }
    paintRing();
    $("ringBtn").onclick=function(){
      sfx("tap");
      try{
        var tr=S.todayRing(), reps=(S.repsToday?S.repsToday():0), snd=(S.soundLabel?S.soundLabel(S.rotSound()):S.rotSound());
        toast(reps+" reps today · "+(tr.done?"today's goal is done — everything else is bonus!":(tr.n+" of "+tr.goal+" rounds done · "+snd+" sound")));
      }catch(e){}
    };

    // ── parent gate: PIN if the parent set one, else a math question ──
    var gateAns="", gateNeed="", gateMode="math", gateNext=null;
    function openGate(next){
      gateNext=next||null; // pass a callback to run instead of the parent sheet
      var pin=(P.parentPin||"").trim();
      gateAns="";
      if(pin){ gateMode="pin"; gateNeed=pin; $("gateQ").textContent="🔒"; $("gateHint").textContent="Enter your parent code"; }
      else { gateMode="math"; var a=3+((Math.random()*6)|0), b=3+((Math.random()*6)|0); gateNeed=String(a*b); $("gateQ").textContent=a+" × "+b+" = ?"; $("gateHint").textContent="Answer to continue (set a code in Settings)"; }
      $("gateIn").textContent="";
      $("gateOvl").classList.add("show");
    }
    $("parentBtn").onclick=function(){ sfx("tap"); openGate(); };
    (function(){
      var pad=$("pad"); var keys=[1,2,3,4,5,6,7,8,9,"⌫",0,"✓"];
      keys.forEach(function(kk){
        var b=document.createElement("button"); b.textContent=kk;
        b.onclick=function(){
          if(kk==="⌫"){ gateAns=gateAns.slice(0,-1); }
          else if(kk==="✓"){
            if(gateAns===gateNeed){ try{ if(S&&S.gateVerify)S.gateVerify(); }catch(e){} $("gateOvl").classList.remove("show"); sfx("correct"); if(gateNext){ var fn=gateNext; gateNext=null; fn(); } else { paintWeek(); paintWins(); paintPlan(); $("sheetOvl").classList.add("show"); } }
            else { var m=$("gateModal"); m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake"); gateAns=""; }
          }
          else { if(gateAns.length<6) gateAns+=String(kk); }
          $("gateIn").textContent=gateAns.replace(/./g, gateMode==="pin"?"•":"$&");
          if(gateMode==="pin"){ $("gateIn").textContent="•".repeat(gateAns.length); }
        };
        pad.appendChild(b);
      });
    })();
    $("gateClose").onclick=function(){ $("gateOvl").classList.remove("show"); };
    // bounced here from a parent-only page (Sona.requireGate)? Open the gate right away.
    try{ if(/[?&]gate=1/.test(location.search)) openGate(); }catch(e){}
    // Mom's week — her goal (3/5/7 days), her streak. Never shown to the kid.
    function paintWeek(){
      try{
        var w=S.momWeek(), L=["M","T","W","T","F","S","S"], dots=$("wkDots"); dots.innerHTML="";
        for(var i=0;i<7;i++){
          var on=w.days[i], isToday=i===w.todayIx;
          var d=document.createElement("div");
          d.style.cssText="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:12px;"
            +(on?"background:#58cc02;color:#fff;box-shadow:0 2px 0 #46a302;":"background:#fff;color:var(--label);box-shadow:inset 0 0 0 2px var(--track);")
            +(isToday&&!on?"box-shadow:inset 0 0 0 2px var(--orange);color:var(--orange-d);":"");
          d.textContent=on?"✓":L[i];
          dots.appendChild(d);
        }
        var left=w.goal-w.done;
        $("wkMsg").textContent = w.hit ? ("Goal met — "+Math.min(w.done,w.goal)+" of "+w.goal+" days. This week is won!")
          : (w.practicedToday? "Practiced today ✓ — " : "")+(left===1? "1 more day and the week is won!" : left+" more days to hit your "+w.goal+"-day goal.");
        $("wkStreak").innerHTML = w.weekStreak>0 ? ((S.icon?S.icon("flame",14):"")+" "+w.weekStreak+"-week streak") : "";
      }catch(e){}
    }
    // weekly wins: reps + accuracy trend, plus a shareable card (mom's choice)
    function paintWins(){
      try{
        var w=S.weekWins(); var el=$("wkWins"); if(!el)return; var bits=[];
        if(w.reps>0) bits.push(w.reps+(w.reps===1?" sound":" sounds")+" practiced");
        if(w.acc!=null && w.accPrev!=null && w.acc!==w.accPrev) bits.push(w.label+" sound "+w.accPrev+"% \u2192 "+w.acc+"%");
        else if(w.acc!=null) bits.push(w.label+" sound at "+w.acc+"%");
        el.textContent=bits.join(" \u00b7 ");
        $("shareWeek").style.display=(w.reps>0)?"block":"none";
      }catch(e){}
    }
    function shareCard(){
      try{
        var w=S.weekWins(), name=(P.childName||"We");
        var cv=document.createElement("canvas"); cv.width=1080; cv.height=1350; var c=cv.getContext("2d");
        c.fillStyle="#fff6e9"; c.fillRect(0,0,1080,1350);
        c.fillStyle="#ffffff"; c.beginPath(); c.roundRect(70,120,940,1110,48); c.fill();
        c.fillStyle="#ef6f23"; c.font="800 44px 'Baloo 2', sans-serif"; c.textAlign="center";
        c.fillText("SPEECH WINS THIS WEEK",540,230);
        c.fillStyle="#4a2c14"; c.font="800 76px 'Baloo 2', sans-serif";
        c.fillText(name+" practiced",540,360);
        c.fillStyle="#ff8a3d"; c.font="800 150px 'Baloo 2', sans-serif";
        c.fillText(w.week.done+(w.week.done===1?" day":" days"),540,540);
        var L=["M","T","W","T","F","S","S"];
        for(var i=0;i<7;i++){ var x=250+i*97, y=640;
          c.beginPath(); c.arc(x,y,36,0,7);
          c.fillStyle=w.week.days[i]?"#58cc02":"#f0e4d2"; c.fill();
          c.fillStyle=w.week.days[i]?"#fff":"#c9a878"; c.font="800 34px 'Baloo 2', sans-serif"; c.fillText(w.week.days[i]?"\u2713":L[i],x,y+12);
        }
        c.fillStyle="#4a2c14"; c.font="800 58px 'Baloo 2', sans-serif";
        c.fillText(w.reps>0?(w.reps+" sounds, honestly scored"):"Real practice, honestly scored",540,790);
        if(w.acc!=null&&w.accPrev!=null&&w.acc!==w.accPrev){
          c.fillStyle="#58cc02"; c.font="800 88px 'Baloo 2', sans-serif";
          c.fillText(w.label+" sound: "+w.accPrev+"% \u2192 "+w.acc+"%",540,930);
        } else if(w.acc!=null){
          c.fillStyle="#58cc02"; c.font="800 88px 'Baloo 2', sans-serif";
          c.fillText(w.label+" sound: "+w.acc+"%",540,930);
        }
        c.fillStyle="#b08d63"; c.font="800 42px 'Baloo 2', sans-serif";
        c.fillText("Practicing with Echo on Sona",540,1080);
        c.fillStyle="#ef6f23"; c.font="800 46px 'Baloo 2', sans-serif";
        c.fillText("speaksona.com",540,1160);
        cv.toBlob(function(blob){
          if(!blob)return;
          var file=new File([blob],"sona-week.png",{type:"image/png"});
          if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
            navigator.share({files:[file],title:"Sona",text:name+"'s speech practice this week"}).catch(function(){});
          } else {
            var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="sona-week.png"; a.click();
            toast("Saved! Share it anywhere");
          }
        },"image/png");
      }catch(e){}
    }
    $("shareWeek").onclick=function(){ sfx("tap"); shareCard(); };
    paintWins();
    paintWeek();
    try{ document.querySelectorAll(".pic-trend").forEach(function(n){ n.innerHTML=S.icon("trend",18); }); document.querySelectorAll(".pic-gear").forEach(function(n){ n.innerHTML=S.icon("gear",18); }); document.querySelectorAll("[data-ic]").forEach(function(n){ var m=S.icon(n.dataset.ic,18); if(m) n.innerHTML=m; }); }catch(e){}
    $("goProgress").onclick=function(){ location.href="/progress.html"; };
    $("goSettings").onclick=function(){ location.href="/settings.html"; };
    $("sheetClose").onclick=function(){ $("sheetOvl").classList.remove("show"); };

    // ── This-week card (parent corner): the week narrated from real data.
    function paintPlan(){
      try{
        var story=(S.soundStory&&S.soundStory())||[];
        if(!story.length){ $("planCard").style.display="none"; return; }
        $("planCard").style.display="block";
        $("storyBits").innerHTML=story.map(function(b){ return "• "+b; }).join("<br/>");
      }catch(e){}
    }

    // ── plan status (web only; the native app has no payments) ──
    // Hard rule: the kid home shows zero prices, trials, or countdowns.
    // Trial status lives in the parent corner (#planNote), behind the gate.
    // Founding families keep a kid-safe banner that opens the feedback pulse.
    (function(){ if(!S)return; if(S.isNativeApp&&S.isNativeApp())return;
      var b=$("trialBanner"),m=$("trialMsg"),note=$("planNote");
      if(P.earlyAdopter){
        if(b&&m){ m.innerHTML="Founding family — you're building Sona with us. <u>Tap to share an idea!</u>"; b.removeAttribute("href"); b.style.cursor="pointer"; b.onclick=function(ev){ if(ev&&ev.preventDefault)ev.preventDefault(); showPulse(true); }; b.style.display="flex"; }
        if(note){ note.textContent="Your family has founding access while we build Sona together — thank you."; note.style.display="block"; }
        return;
      }
      if(!note)return;
      // Free mode: no trial, no plan, nothing to say in the parent corner. The
      // trial key still sits on every device that met the paywall before the
      // flip, and without this they'd read "Your free trial has ended — see
      // plans" inside an app that is free.
      if(S.isFree&&S.isFree())return;
      if((S.isSubscribed&&S.isSubscribed())||(S.isPilot&&S.isPilot()))return; if(S.ensureTrial)S.ensureTrial();
      var link=' <a href="/subscribe.html" style="color:var(--orange-d);font-weight:800;">';
      if(S.trialActive&&S.trialActive()){ var dd=S.trialDaysLeft?S.trialDaysLeft():7; note.innerHTML="Your free trial: "+dd+" day"+(dd===1?"":"s")+" left."+link+"See plans →</a>"; note.style.display="block"; }
      else if(S.trialExpired&&S.trialExpired()){ note.innerHTML="Your free trial has ended."+link+"See plans →</a>"; note.style.display="block"; }
    })();

    // ── beta pulse: chip-first (a tap beats a blank box — the Mobbin study's
    // one repeated pattern). Picking a chip reveals the optional note + Send.
    // X always dismisses, and a send OR a dismiss quiets the auto-ask for two
    // weeks — brand-new families must never feel nagged. Banner tap still
    // opens it any time.
    var PULSE_COOL=14*24*3600*1000;
    var PULSE_CHIPS=["More games","New sounds to practice","Progress reports","Easier for my kid","Something's broken","Something else"];
    function pulseState(){ try{ return JSON.parse(localStorage.getItem("sona.pulse.v1")||"{}"); }catch(e){ return {}; } }
    function pulseSave(s){ try{ localStorage.setItem("sona.pulse.v1",JSON.stringify(s)); }catch(e){} }
    function showPulse(force){
      var st=pulseState();
      var w=$("pulseOpts");
      var picked={};
      w.innerHTML='<div id="pulseChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;"></div>'
        +'<div id="pulseMore" style="display:none;">'
        +'<textarea id="pulseText" rows="2" placeholder="Anything else? (optional)" '
        +'style="width:100%;border:2px solid var(--track);border-radius:14px;padding:12px;font-family:Nunito,sans-serif;font-weight:700;font-size:14px;color:var(--ink);resize:none;margin-top:10px;"></textarea>'
        +'<button id="pulseSend" class="sheetBtn" style="justify-content:center;background:linear-gradient(180deg,#ffa05a,#ff8a3d);color:#fff;box-shadow:0 4px 0 var(--orange-d);">Send it</button>'
        +'</div>';
      var row=$("pulseChips");
      PULSE_CHIPS.forEach(function(label){
        var b=document.createElement("button");
        b.type="button"; b.textContent=label; b.className="pulseChip";
        b.style.cssText="border:2px solid var(--track);border-radius:999px;padding:9px 14px;background:#fff;color:var(--ink);font-family:'Baloo 2';font-weight:800;font-size:13px;cursor:pointer;";
        b.onclick=function(){
          picked[label]=!picked[label];
          b.style.background=picked[label]?"linear-gradient(180deg,#ffa05a,#ff8a3d)":"#fff";
          b.style.color=picked[label]?"#fff":"var(--ink)";
          b.style.borderColor=picked[label]?"var(--orange-d)":"var(--track)";
          var any=PULSE_CHIPS.some(function(k){ return picked[k]; });
          $("pulseMore").style.display=any?"block":"none";
        };
        row.appendChild(b);
      });
      $("pulseSend").onclick=function(){
        var chips=PULSE_CHIPS.filter(function(k){ return picked[k]; });
        if(!chips.length) return;
        var note=($("pulseText").value||"").trim().slice(0,600);
        var code=""; try{ code=(S.pilotInfo&&S.pilotInfo().code)||""; }catch(e){}
        try{ fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,
          body:JSON.stringify({q:"pulse.chips",text:chips.join(" + ")+(note?" · "+note:""),src:"pulse",code:code})}).catch(function(){}); }catch(e){}
        st.last=Date.now(); st.cool=Date.now()+PULSE_COOL; pulseSave(st);
        $("pulseOvl").classList.remove("show"); sfx("correct"); toast("Thanks! We build fast ✓");
      };
      $("pulseOvl").classList.add("show");
      if(force){ st.last=Date.now(); pulseSave(st); }
    }
    $("pulseX").onclick=function(){ var st=pulseState(); st.last=Date.now(); st.cool=Date.now()+PULSE_COOL; pulseSave(st); $("pulseOvl").classList.remove("show"); sfx("tap"); };
    (function(){
      if(!P.earlyAdopter) return;
      var st=pulseState(); st.visits=(st.visits||0)+1; pulseSave(st);
      var dayAgo=!st.last || (Date.now()-st.last)>20*3600*1000;
      var cooling=!!st.cool && Date.now()<st.cool;
      var due=st.visits>=3 && st.visits%3===0 && dayAgo && !cooling;
      if(due) setTimeout(function(){ showPulse(false); var s2=pulseState(); s2.last=Date.now(); pulseSave(s2); },900);
    })();
  </script>
</body>
</html>
