<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Today</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{--blue:#1cb0f6;--blue-d:#1597d4;--green:#58cc02;--green-d:#46a302;--amber:#ffb703;--amber-d:#e08600;--ink:#1f2a37;--muted:#6b7a8d;--card:#ffffff;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;}
    body{background:linear-gradient(180deg,#eaf6ff 0%,#dff1ff 40%,#eafbe4 100%);color:var(--ink);display:flex;justify-content:center;}
    #app{width:100%;max-width:430px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));}
    /* top bar */
    .top{display:flex;align-items:center;gap:10px;}
    .hi{flex:1;}
    .hi b{font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--ink);display:block;line-height:1.1;}
    .hi span{font-size:13px;color:var(--muted);font-weight:700;}
    .pill{display:flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:7px 12px;font-family:"Baloo 2";font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(20,90,150,.10);}
    .pill.streak{color:var(--amber-d);} .pill.coins{color:var(--amber-d);}
    .avatar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffe08a,#ffb703);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 3px 0 rgba(20,90,150,.12);}
    /* hero practice card */
    .hero{margin-top:18px;border-radius:26px;padding:20px 20px 22px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(150deg,#2bb8ff 0%,#1597d4 60%,#0e7fbe 100%);box-shadow:0 12px 0 rgba(14,127,190,.28),0 18px 30px rgba(20,90,150,.28);}
    .hero .sheen{position:absolute;right:-30px;top:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%);}
    .hero .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:99px;padding:5px 11px;font-weight:800;font-size:12px;letter-spacing:.02em;}
    .hero h1{font-family:"Baloo 2";font-weight:800;font-size:27px;line-height:1.12;margin-top:12px;text-shadow:0 2px 8px rgba(11,71,110,.35);}
    .hero .sub{margin-top:8px;font-weight:800;font-size:14px;opacity:.95;display:flex;flex-wrap:wrap;gap:6px;}
    .hero .chip{background:rgba(255,255,255,.2);border-radius:99px;padding:4px 10px;}
    .hero .scene{font-size:54px;margin-top:14px;filter:drop-shadow(0 6px 8px rgba(11,71,110,.3));}
    .start{margin-top:16px;width:100%;border:none;border-radius:18px;padding:16px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.03em;color:var(--green-d);background:#fff;box-shadow:0 6px 0 rgba(11,71,110,.25);cursor:pointer;transition:transform .05s;}
    .start:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(11,71,110,.25);}
    /* minutes selector */
    .mins{margin-top:14px;}
    .mins .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
    .mins .row{display:flex;gap:10px;}
    .seg{flex:1;border:2px solid #cfe6f7;background:#fff;border-radius:14px;padding:11px 0;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--blue-d);cursor:pointer;}
    .seg.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d);}
    .seg small{display:block;font-family:"Nunito";font-weight:700;font-size:10px;opacity:.8;text-transform:uppercase;}
    /* secondary cards */
    .grid{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .mini{background:#fff;border-radius:20px;padding:15px;box-shadow:0 5px 0 rgba(20,90,150,.08);cursor:pointer;}
    .mini .ico{font-size:26px;}
    .mini b{display:block;font-family:"Baloo 2";font-weight:800;font-size:15px;margin-top:7px;color:var(--ink);}
    .mini span{font-size:12px;color:var(--muted);font-weight:700;}
    .mini.wide{grid-column:1/3;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#fff 0%,#fff7e6 100%);}
    .mini.wide .ico{font-size:30px;}
    .mini.wide .txt{flex:1;} .mini.wide .go{font-family:"Baloo 2";font-weight:800;color:var(--amber-d);font-size:13px;}
    /* progress dots */
    .plan{margin-top:18px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 0 rgba(20,90,150,.08);}
    .plan .hd{display:flex;align-items:center;justify-content:between;}
    .plan .hd b{font-family:"Baloo 2";font-weight:800;font-size:15px;flex:1;}
    .plan .hd a{font-size:12px;font-weight:800;color:var(--blue-d);text-decoration:none;}
    .days{display:flex;gap:8px;margin-top:12px;align-items:center;}
    .day{flex:1;height:8px;border-radius:99px;background:#e6eef5;}
    .day.done{background:var(--green);} .day.today{background:var(--amber);}
    .plan .cap{margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.45;}
    /* bottom nav */
    .nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e8eef4;display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:9;}
    .nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#9fb0c0;text-decoration:none;}
    .nav a .ni{font-size:21px;} .nav a.on{color:var(--blue-d);}
  </style>
</head>
<body>
  <div id="app">
    <div class="top">
      <div class="avatar" id="av">🦁</div>
      <div class="hi"><b id="hello">Hi!</b><span id="date">Let's practice!</span></div>
      <div class="pill streak">🔥 <span id="streak">0</span></div>
      <div class="pill coins">🪙 <span id="coins">0</span></div>
    </div>

    <a id="trialBanner" href="/subscribe" style="display:none;margin-top:12px;text-decoration:none;align-items:center;gap:8px;background:linear-gradient(120deg,#fff7e6,#ffe9c2);border:1px solid #ffe2a8;border-radius:14px;padding:10px 14px;font-weight:800;font-size:13px;color:#8a6400;">🎁 <span id="trialMsg"></span></a>

    <div class="hero">
      <div class="sheen"></div>
      <span class="tag">🏁 Daily Run · made for <span id="who">you</span></span>
      <h1 id="title">Say your sounds, power up, play!</h1>
      <div class="sub">
        <span class="chip" id="soundChip">R sound · start of words</span>
        <span class="chip" id="minChip">~10 min</span>
        <span class="chip" id="themeChip">🐉 dragons</span>
      </div>
      <div class="scene" id="scene">🐉🌈</div>
      <button class="start" id="startBtn">⚡ Charge up &amp; play</button>
    </div>

    <!-- Kid-first home: just today's practice. Parent tools (progress, speech
         check, then-vs-now, plan) live in the Progress tab. -->

  </div>

  <div class="nav">
    <a class="on" href="/today.html"><span class="ni">🏠</span>Today</a>
    <a href="/map.html"><span class="ni">🎮</span>Play</a>
    <a href="/progress.html"><span class="ni">📈</span>Progress</a>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    // First run: send brand-new installs through setup, so we never greet a
    // stranger's child as "Mia". Onboarding sets profile.onboarded = true.
    if (window.Sona && Sona.getProfile && !Sona.getProfile().onboarded) { location.replace("/onboarding.html"); }
    var P=(window.Sona?Sona.getProfile():{});
    var INTERESTS=["dragons","space","dinosaurs","mermaids","puppies","race cars","unicorns","pirates","jungle animals","robots"];
    var THEME_EMOJI={dragons:"🐉🌈",space:"🚀🪐",dinosaurs:"🦕🌋",mermaids:"🧜‍♀️🐚",puppies:"🐶🦴",kittens:"🐱🧶","race cars":"🏎️🏁",unicorns:"🦄✨",pirates:"🏴‍☠️🪙","jungle animals":"🐵🌴",robots:"🤖⚡",superheroes:"🦸💥"};
    var name=(P.childName||"Mia").trim();
    var sound=((P.focusSounds&&P.focusSounds[0])||"R").toUpperCase();
    var interest=((P.interests&&P.interests[0])||P.interest||((window.Sona&&Sona.dayNum)?INTERESTS[Sona.dayNum()%INTERESTS.length]:"dragons"));
    var minutes=P.dailyMinutes||10;
    var pos="initial", posLabel="start of words";

    // Themed session name for today's practice (not a story promise — the games
    // themselves carry the theme).
    var TITLES={dragons:name+"'s Dragon Quest",space:name+"'s Space Mission",dinosaurs:name+"'s Dino Dig",mermaids:name+"'s Mermaid Lagoon",puppies:name+"'s Puppy Park",unicorns:name+"'s Unicorn Trail",pirates:name+"'s Treasure Hunt",robots:name+"'s Robot Workshop","race cars":name+"'s Grand Prix","jungle animals":name+"'s Jungle Trek"};
    function applyTheme(){
      $("hello").textContent="Hi "+name+"!";
      var whoEl=$("who"); if(whoEl)whoEl.textContent=name;
      $("title").textContent=TITLES[interest]||(name+"'s "+interest+" practice");
      $("soundChip").textContent=sound+" sound · "+posLabel;
      $("minChip").textContent="~"+minutes+" min";
      $("themeChip").textContent=(THEME_EMOJI[interest]?THEME_EMOJI[interest].slice(0,2):"⭐")+" "+interest;
      $("scene").textContent=THEME_EMOJI[interest]||"⭐";
      $("coins").textContent=(window.Sona&&Sona.getCoins)?Sona.getCoins():0;
      var g=(window.Sona&&Sona.getProgress)?Sona.getProgress():null;
      var sc=(g&&g.streak&&g.streak.count)||0;
      if(g&&g.streak)$("streak").textContent=sc;
      // real local weekday + streak line (was hardcoded "Tuesday · Day 3 of your plan")
      var wd=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];
      $("date").textContent=wd+(sc>0?" · "+sc+"-day streak 🔥":" · Let's practice!");
      if(window.Sona&&Sona.characterById){try{var c=Sona.characterById(P.character||"leo");}catch(e){}}
    }
    // "Start" = the Daily Run: 4 quick games, each unlocked by a 5-rep charge,
    // one shot per day, chasing a cumulative high score. Free play lives in the
    // arcade (Play tab) — unlimited, same charge gate.
    function currentLevel(){
      try{ var cap=(window.Sona&&Sona.unlockedThru)?Sona.unlockedThru():1;
        for(var L=1; L<=cap; L++){ if(!(window.Sona&&Sona.levelDone&&Sona.levelDone(L))) return L; }
        return cap||1;
      }catch(e){ return 1; }
    }
    function startSession(){
      var L=currentLevel();
      location.href="/charge.html?daily=1&sound="+encodeURIComponent(sound)+"&level="+L;
    }
    // Daily Run hero states: fresh (one shot waiting) vs done (score + best)
    applyTheme();
    // Daily Run hero states — AFTER applyTheme so the run title/button win over
    // the theme title.
    (function(){
      var d=(window.Sona&&Sona.dailyInfo)?Sona.dailyInfo():{playedToday:false,score:0,best:0};
      if(d.playedToday){
        var tag=document.querySelector(".hero .tag");
        if(tag)tag.textContent="🏁 Daily Run · done for today";
        $("title").textContent="You scored "+d.score+" today!";
        $("minChip").textContent="🏆 Best: "+d.best;
        $("startBtn").textContent="🎮 Free play in the Arcade";
        $("startBtn").onclick=function(){ location.href="/map.html"; };
        $("scene").onclick=$("startBtn").onclick;
      } else {
        $("title").textContent="One shot. Four games. High score!";
        if(d.best>0)$("minChip").textContent="🏆 Beat "+d.best+"!";
        $("startBtn").textContent="🏁 Start today's run";
        $("startBtn").onclick=startSession; $("scene").onclick=startSession;
      }
    })();
    // free-trial banner (no card): show days left + lock-in founding price
    (function(){ if(!window.Sona)return; if(Sona.isNativeApp&&Sona.isNativeApp())return; if((Sona.isSubscribed&&Sona.isSubscribed())||(Sona.isPilot&&Sona.isPilot()))return; if(Sona.ensureTrial)Sona.ensureTrial(); var b=$("trialBanner"),m=$("trialMsg"); if(!b||!m)return;
      if(Sona.trialActive&&Sona.trialActive()){ var d=Sona.trialDaysLeft?Sona.trialDaysLeft():7; m.innerHTML=d+" day"+(d===1?"":"s")+" left in your free trial · <u>Lock in founding $39.99/yr →</u>"; b.style.display="flex"; }
      else if(Sona.trialExpired&&Sona.trialExpired()){ m.innerHTML="Your free trial ended · <u>Keep going for $39.99/yr →</u>"; b.style.display="flex"; }
    })();
  </script>
</body>
</html>
