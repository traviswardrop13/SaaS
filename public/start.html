<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <script>
// Clinician tools live in the browser. A restored link in the native shell
// must return to the family app before rendering or making clinician requests.
// The FAMILY iPhone app opens / on every launch, and / is this page
// (GHLEXIT1, 24 Nov 2026), so this guard is its first script, as it is
// for-slps.html's.
(function () {
  var native = false;
  try { if (/\bSonaSLPApp\/\d/.test(navigator.userAgent || "")) { window.__sonaFamilyRedirect = true; document.documentElement.style.visibility = "hidden"; window.location.replace("/slp.html"); return; } } catch (e) {}
  try {
    var bridge = window.Capacitor;
    native = !!(bridge && (typeof bridge.isNativePlatform === "function" ? bridge.isNativePlatform() : true));
  } catch (e) {}
  if (!native) return;
  window.__sonaFamilyRedirect = true;
  document.documentElement.style.visibility = "hidden";
  // Home owns active-child selection and the first-run setup guard.
  window.location.replace("/today.html");
})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<body>

<header>
  <div class="wrap hbar">
    <a class="brand" href="/" aria-label="Sona">
      <img src="/assets/site/echo.webp" alt="" width="42" height="42">

    </a>

<main>
<section class="hero-band">
  <div class="wrap hero">
  <div class="hero-intro">
    <p class="eyebrow">For pediatric SLPs and SLPAs</p>
    <h1>More reps <span>between sessions.</span></h1>
  </div>

  <div class="hero-r" aria-hidden="true">

</footer>

<script>
  (function () {
    if (window.__sonaFamilyRedirect) return;
    var $ = function (id) { return document.getElementById(id); };
    // Where the lead came from: utm_source if the ad set one, else this page.
    var src = "slp-optin";
    // WHICH AD BROUGHT THEM, flat on the lead as /api/lead takes it (the
    // same set for-slps.html sends). Read once, clamped: a stranger writes
    // the URL.
    var attrib = {};
    try {
      var q = new URLSearchParams(location.search);
      var clean = function (v, n) { return String(v || "").replace(/[^\w .\-|/]/g, "").slice(0, n || 120); };
      ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "fbclid"].forEach(function (k) {
        var v = q.get(k); if (v) attrib[k] = clean(v);
      });
      attrib.referrer = clean(document.referrer, 200);
      attrib.landing = clean(location.pathname, 120);
      if (attrib.utm_source) src = attrib.utm_source.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 30) || src;
    } catch (e) {}

    /*
     * SHARE & EARN (REFER1): a therapist's link is app.speaksona.com/?ref=<code>,
     * and / is this page now. Kept 60 days on this browser exactly as the
     * plans page keeps it ("sona.slp.ref"), so a visitor who leaves and comes
     * back to /plans later still counts for them. The plans page sends it with
     * the trial sign-up; the server takes it only for a brand-new account.
     */
    try {
      var given = String(new URLSearchParams(location.search).get("ref") || "").toLowerCase();
      if (/^[a-z0-9]{8}$/.test(given)) localStorage.setItem("sona.slp.ref", JSON.stringify({ ref: given, at: Date.now() }));
    } catch (e) {}

    // An email typed earlier in this tab (sessionStorage, never the address bar).
    try {
      var kept = sessionStorage.getItem("sona.optin.email");
      if (kept && !$("oEmail").value && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(kept)) $("oEmail").value = kept;
    } catch (e) {}

    var LABEL = "Get Started";
    function err(msg) {
      var e = $("oErr"); e.textContent = msg;
      try { e.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (x) { e.scrollIntoView(false); }
    }
    function busy(on) { $("oGo").disabled = on; $("oGo").textContent = on ? "One moment…" : LABEL; }

    // ON TO THE PLANS, with the ad's tags (and a ref) still on the address,
    // so the trial sign-up there carries them too. Never the email: it waits
    // in this tab's sessionStorage, where the plans page fills its box from.
    function toPlans() { location.assign("/plans" + location.search); }

    function go() {
      if ($("oGo").disabled) return;
      var email = (($("oEmail").value) || "").trim();
      $("oErr").textContent = "";
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err("Enter a valid email."); $("oEmail").focus(); return; }
      try { sessionStorage.setItem("sona.optin.email", email); } catch (e) {}
      busy(true);
      var lead = { email: email, role: "slp", source: src };
      for (var k in attrib) if (Object.prototype.hasOwnProperty.call(attrib, k)) lead[k] = attrib[k];
      fetch("/api/lead", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(lead),
      }).then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, j: j }; });
      }).then(function (res) {
        var j = res.j;
        if (j && j.ok === true) {
          // THE LEAD, only once the server has the email, with no parameters.
          // The plans page then counts its trial sign-up as InitiateCheckout,
          // not a second Lead ("sona.optin.lead"). A short wait so the pixel's
          // request leaves before the page does.
          try { sessionStorage.setItem("sona.optin.lead", "1"); } catch (e) {}
          try { if (window.sonaTrack) sonaTrack("Lead"); } catch (e) {}
          setTimeout(toPlans, 350);
          return;
        }
        if (res.status === 400) { busy(false); err((j && j.error) || "Enter a valid email."); return; }
        // Too many tries, or the server had trouble: no Lead, but nobody is
        // kept from the plans by our hiccup.
        toPlans();
      }).catch(function () { toPlans(); });
    }
    $("optin").addEventListener("submit", function (e) { e.preventDefault(); go(); });
  })();
</script>
</body>
</html>
