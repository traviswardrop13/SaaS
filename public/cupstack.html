<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Cup Stack</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --ink:#3c3c3c; --muted:#777; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    /* richer themed play-room sky: warm sun-glow up top over a layered blue arcade gradient */
    body{
      background:
        radial-gradient(120% 80% at 50% -18%, rgba(255,255,255,.9), rgba(255,255,255,0) 46%),
        radial-gradient(90% 60% at 84% 6%, rgba(255,214,153,.55), rgba(255,214,153,0) 55%),
        radial-gradient(80% 60% at 12% 14%, rgba(92,198,255,.35), rgba(92,198,255,0) 60%),
        linear-gradient(180deg,#eaf6ff 0%,#d4ecff 52%,#b8def9 100%);
      color:var(--ink);
    }
    #app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;}

    /* ── shared design-system keyframes (mirrored from /public/sona.css so this
         self-contained game speaks the same visual language as the other screens) ── */
    @keyframes sona-floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes sona-twinkle{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes sona-glow{0%,100%{box-shadow:0 0 0 0 rgba(42,157,244,0)}50%{box-shadow:0 0 0 10px rgba(42,157,244,.14)}}
    @keyframes sona-glow-warm{0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,0)}50%{box-shadow:0 0 0 10px rgba(255,138,61,.18)}}

    /* ── ambient scenery (pure decoration, sits behind all gameplay) ── */
    /* soft floating bokeh orbs — gentle drift via shared sona-floatY */
    #app::before{
      content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
      background:
        radial-gradient(circle at 16% 24%, rgba(255,255,255,.85) 0 8px, rgba(255,255,255,0) 9px),
        radial-gradient(circle at 82% 30%, rgba(255,255,255,.55) 0 6px, rgba(255,255,255,0) 7px),
        radial-gradient(circle at 70% 16%, rgba(92,198,255,.5) 0 14px, rgba(92,198,255,0) 16px),
        radial-gradient(circle at 28% 12%, rgba(255,194,128,.45) 0 11px, rgba(255,194,128,0) 13px),
        radial-gradient(circle at 90% 60%, rgba(176,140,255,.32) 0 18px, rgba(176,140,255,0) 20px);
      animation:sona-floatY 6.5s ease-in-out infinite;will-change:transform;
    }
    /* a few twinkling sparkles, slower + offset so the sky feels alive */
    #app::after{
      content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
      background:
        radial-gradient(circle at 40% 20%, rgba(255,255,255,.9) 0 2.5px, rgba(255,255,255,0) 4px),
        radial-gradient(circle at 60% 34%, rgba(255,255,255,.8) 0 2px, rgba(255,255,255,0) 3.5px),
        radial-gradient(circle at 22% 40%, rgba(255,255,255,.75) 0 2px, rgba(255,255,255,0) 3.5px),
        radial-gradient(circle at 86% 46%, rgba(255,255,255,.8) 0 2.5px, rgba(255,255,255,0) 4px);
      animation:sona-twinkle 4s ease-in-out infinite;will-change:opacity,transform;
    }

    /* top bar */
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;}
    #close{border:none;background:none;color:#9ec7e6;font-size:24px;font-weight:800;cursor:pointer;line-height:1;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.8);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(20,120,200,.12);}
    /* progress + combo chips: themed gradient fill, white text, soft depth (already pill-rounded) */
    .stat.cups{color:#fff;background:linear-gradient(180deg,#5cc6ff,var(--blue));box-shadow:0 3px 10px rgba(20,120,200,.22),inset 0 1px 0 rgba(255,255,255,.4);}
    .stat.combo{color:#fff;margin-left:auto;background:linear-gradient(180deg,#ffb24d,var(--orange));box-shadow:0 3px 10px rgba(224,134,0,.24),inset 0 1px 0 rgba(255,255,255,.4);}
    #comboPop{display:inline-block;}

    /* tower stage */
    #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:100%;padding:8px 18px 0;overflow:hidden;position:relative;}
    #towerWrap{display:flex;align-items:flex-end;justify-content:center;width:100%;transform-origin:bottom center;transition:transform .35s ease;}
    #tower{display:flex;flex-direction:column-reverse;align-items:center;gap:-2px;}
    .cup{width:108px;height:38px;margin-top:-3px;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);
      display:flex;align-items:flex-start;justify-content:center;color:rgba(255,255,255,.9);font-size:11px;font-weight:800;
      box-shadow:inset 0 6px 0 rgba(255,255,255,.35), inset 0 -6px 0 rgba(0,0,0,.08);}
    .cup .rim{width:100%;height:7px;background:rgba(255,255,255,.45);}
    .cup.drop{animation:cupdrop .5s cubic-bezier(.34,1.56,.64,1);}
    .cup.wobbledrop{animation:cupwobble .6s ease;}
    @keyframes cupdrop{0%{transform:translateY(-340px) scale(.9);opacity:0}60%{opacity:1}100%{transform:translateY(0);opacity:1}}
    @keyframes cupwobble{0%{transform:translateY(-340px) rotate(-12deg);opacity:0}55%{opacity:1}70%{transform:translateY(0) rotate(6deg)}85%{transform:rotate(-3deg)}100%{transform:rotate(var(--tilt,0deg))}}
    /* glossy themed play-floor with a soft top highlight + ambient glow beneath the tower */
    #ground{position:relative;width:min(86vw,360px);height:14px;border-radius:99px;margin-top:2px;
      background:linear-gradient(180deg,rgba(120,180,230,.32),rgba(20,90,150,.22));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 10px rgba(20,90,150,.14);}
    #ground::before{content:"";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
      width:72%;height:30px;border-radius:99px;pointer-events:none;z-index:-1;
      background:radial-gradient(60% 100% at 50% 0%, rgba(92,198,255,.4), rgba(92,198,255,0) 70%);}
    #heightTag{position:absolute;left:14px;top:46%;font-family:"Baloo 2";font-weight:800;color:#7fb6dd;font-size:13px;writing-mode:vertical-rl;transform:rotate(180deg);}

    /* sparkle layer */
    #fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
    /* juicier stack sparkles: a soft warm glow + a touch more lift/scale on each landing */
    .spark{position:absolute;font-size:22px;animation:spark .8s ease forwards;filter:drop-shadow(0 0 6px rgba(255,221,120,.9));will-change:transform,opacity;}
    @keyframes spark{0%{transform:translateY(0) scale(.3) rotate(-12deg);opacity:1}60%{opacity:1}100%{transform:translateY(-68px) scale(1.35) rotate(10deg);opacity:0}}

    /* bottom: word + mic — warm play-room light rises from the panel (layered under the white fade) */
    #bottom{position:relative;padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;
      background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.72)),
                 radial-gradient(120% 90% at 50% 125%, rgba(255,204,140,.42), rgba(255,204,140,0) 62%);}
    #wordCard{background:#fff;border:2px solid #e5e5e5;border-bottom-width:4px;border-radius:20px;padding:12px 26px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(20,120,200,.1);}
    #wordEmoji{font-size:40px;line-height:1;}
    #wordText{font-family:"Baloo 2";font-weight:800;font-size:34px;color:var(--blue-d);line-height:1;}
    #hear{border:none;background:none;cursor:pointer;font-size:24px;padding:4px;}
    .mic{position:relative;width:96px;height:96px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 30%,#5cc6ff,#1cb0f6 60%,#1597d4);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45);transition:transform .05s;}
    /* gentle breathing glow while idle (shared sona-glow) — a transparent halo ring so the 3D button shadow is untouched */
    .mic::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;animation:sona-glow 2.4s ease-in-out infinite;will-change:box-shadow;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);}
    .mic.rec{animation:pulse 1.5s infinite;}
    .mic.rec::after{animation:none;}
    .mic svg{width:42px;height:42px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:42px;max-height:42px;overflow:hidden;}
    .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 18px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}
    #micState{font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--blue-d);min-height:20px;}

    /* win screen — brighter celebration sky with a warm sun-glow */
    #win{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,.95), rgba(255,255,255,0) 50%),
        radial-gradient(90% 60% at 50% 8%, rgba(255,212,140,.5), rgba(255,212,140,0) 55%),
        linear-gradient(180deg,#eaf6ff,#bfe3ff);}
    #win.show{display:flex;}
    /* title pops in + a gentle ongoing breathe; numbers count up via JS underneath */
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:34px;color:var(--blue-d);margin-top:10px;animation:leoPop .6s ease both;}
    #win .rewards{display:flex;gap:14px;margin-top:18px;}
    /* reward cards: gradient sheen, deeper elevation, a gentle alternating float */
    #win .reward{position:relative;overflow:hidden;border-radius:18px;padding:14px 20px;font-family:"Baloo 2";font-weight:800;font-size:26px;color:var(--blue-d);
      background:linear-gradient(180deg,#ffffff,#eef7ff);box-shadow:0 10px 22px rgba(20,120,200,.18),inset 0 1px 0 rgba(255,255,255,.8);
      animation:sona-floatY 3.6s ease-in-out infinite;will-change:transform;}
    #win .reward:nth-child(2){animation-delay:.5s;}
    #win .reward::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;
      background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
    #win .unlock{margin-top:18px;font-weight:800;color:var(--orange-d);}
    #win .btn{position:relative;margin-top:24px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#6fdb2e,var(--green));box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    /* gentle warm breathing halo invites the next tap (shared sona-glow-warm; halo only, 3D shadow intact) */
    #win .btn::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;animation:sona-glow-warm 2.6s ease-in-out infinite;will-change:box-shadow;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    #win a{margin-top:14px;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none;}
    #win .leoWin{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(20,90,160,.25));animation:leoPop .6s ease;}

    /* Leo character — reacts live during play */
    #leoWrap{position:absolute;left:8px;bottom:15%;width:100px;z-index:3;animation:leoBob 3.2s ease-in-out infinite;pointer-events:none;}
    #leoWrap.react{animation:leoPop .55s ease;}
    #leo{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 9px rgba(20,90,160,.22));transform-origin:50% 100%;}
    @keyframes leoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes leoPop{0%{transform:scale(1)}28%{transform:scale(1.13) translateY(-10px)}58%{transform:scale(.95)}100%{transform:scale(1)}}
    /* image cups (auto-used when /coach/cupstack/cup.png exists) */
    .cup.art{background:none!important;box-shadow:none!important;clip-path:none!important;}
    .cup.art img{width:100%;height:100%;object-fit:contain;display:block;}

    /* respect reduced-motion (accessibility + battery) — calms every loop/transition */
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat cups"><span id="cupCount">0</span>/<span id="cupGoal">10</span></span>
      <span class="stat rung" id="rungBadge" style="font-size:12px;background:rgba(255,255,255,.72);color:var(--blue-d);padding:6px 11px;"></span>
      <span class="stat combo" id="comboStat" style="visibility:hidden;"><span id="comboPop">x2</span></span>
    </div>

    <div id="stage">
      <div id="heightTag"></div>
      <div id="towerWrap"><div id="tower"></div></div>
      <div id="leoWrap"><img id="leo" src="/coach/echo/echo-idle.svg" alt="Leo" /></div>
      <div id="ground"></div>
      <div id="fx"></div>
    </div>

    <div id="bottom">
      <div id="micState">Get ready!</div>
      <div id="wordCard">
        <span id="wordEmoji">🐰</span>
        <span id="wordText">rabbit</span>
        <button id="hear" title="Hear it"><svg viewBox="0 0 24 24" fill="none" stroke="#1597d4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;display:block;"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
      </div>
      <button class="mic" id="micBtn" title="Say it">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div id="win">
    <img class="leoWin" src="/coach/echo/echo-celebrate.svg" alt="Leo celebrating" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
    <h1 id="winTitle">Great stacking!</h1>
    <div class="rewards">
      <div class="reward"><span id="winHeight">0</span><small>cups tall</small></div>
      <div class="reward"><span id="winCombo">0</span><small>best combo</small></div>
    </div>
    <div class="unlock" id="winUnlock"></div>
    <button class="btn" id="again">Play again</button>
    <a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    /* ---- config (the clinical seam: swap this array for assigned targets) ---- */
    var profile = (window.Sona ? Sona.getProfile() : { focusSounds:["R"], voiceId:"", volume:0.8 });
    var params = new URLSearchParams(location.search);
    var SOUND = (params.get("sound") || (profile.focusSounds && profile.focusSounds[0]) || "R").toUpperCase();
    if(!(window.Sona && Sona.WORDS && Sona.WORDS[SOUND])) SOUND="R";
    /* ---- SLP ladder: serve the child's CURRENT rung for this sound ---- */
    var RUNG = (window.Sona&&Sona.rungOf)?Sona.rungOf(SOUND):2; if(RUNG>5)RUNG=5;
    var ITEMS = (window.Sona&&Sona.ladderContent)?Sona.ladderContent(SOUND,RUNG):[];
    if(RUNG>=5 && (!ITEMS.length || (ITEMS[0]&&ITEMS[0].q))){ RUNG=4; ITEMS=Sona.ladderContent(SOUND,4); } // arcade can't do conversation -> use sentences
    if(!ITEMS.length){ ITEMS=((window.Sona&&Sona.wordsFor)?Sona.wordsFor(SOUND):[]).map(function(w){return {t:w.w,say:w.w,display:w.w,e:w.e,word:w.w,level:"word",mode:"full"};}); }
    if(!ITEMS.length){ ITEMS=[{t:"rabbit",say:"rabbit",display:"rabbit",e:"🐰",word:"rabbit",level:"word",mode:"full"}]; }
    var SOUND_ICON=(window.Sona&&Sona.soundSay)?Sona.soundSay(SOUND):SOUND.toLowerCase();
    // helpers to read an item safely (single source of truth for the game mechanic)
    function itDisplay(it){ return (it&&(it.display||it.t))||""; }
    function itSay(it){ return (it&&(it.say||it.t))||""; }
    function itScore(it){ return (it&&it.t)||""; }
    function itEmoji(it){ return (it&&it.e)||SOUND_ICON; }
    function itMode(it){ return (it&&it.mode)||"full"; }
    function itPhoneme(it){ return it&&(it.level==="isolation"||it.level==="syllable"); }
    // POOL kept as the per-turn content array for the existing mechanic.
    var POOL = ITEMS;
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    /* ---- 10 distinct levels: a journey through Stack Hall 🥤 ----
       knob: GOAL = number of cups to stack (gentle→hard, capped at 20).
       scene: bg gradient + accent + props painted on #stage. */
    var LEVELS = [
      { name:"Practice Table", bg:"linear-gradient(180deg,#fbf6ea 0%,#f3e9cf 60%,#e7d6a8 100%)", accent:"#c9a14a", props:["🥤","🪵"], goal:6 },
      { name:"Snack Corner",   bg:"linear-gradient(180deg,#fff1e6 0%,#ffd9b8 60%,#ffbf8f 100%)", accent:"#ff9600", props:["🍪","🥤"], goal:8 },
      { name:"Classroom",      bg:"linear-gradient(180deg,#eafbf0 0%,#cdeede 60%,#a8e0c4 100%)", accent:"#46a302", props:["✏️","📐"], goal:9 },
      { name:"School Gym",     bg:"linear-gradient(180deg,#e9f7ff 0%,#c7e9ff 60%,#9fd5fb 100%)", accent:"#1cb0f6", props:["🏀","🥤"], goal:11 },
      { name:"Practice Court", bg:"linear-gradient(180deg,#fef0f5 0%,#fbd0e0 60%,#f7aecb 100%)", accent:"#ff8fc7", props:["🎽","🥤"], goal:12 },
      { name:"Town Arena",     bg:"linear-gradient(180deg,#f1eaff 0%,#dcc9ff 60%,#c2a8ff 100%)", accent:"#b08cff", props:["🎺","🥤"], goal:14 },
      { name:"Big Stadium",    bg:"linear-gradient(180deg,#e6fbff 0%,#bff0f5 60%,#8fe0ea 100%)", accent:"#1fc7d6", props:["🏟️","📣"], goal:15 },
      { name:"Night Lights",   bg:"linear-gradient(180deg,#26305e 0%,#3a4a8c 55%,#5b6fc0 100%)", accent:"#7da3ff", props:["🌙","🏟️"], goal:17 },
      { name:"Finals Floor",   bg:"linear-gradient(180deg,#3a1f5e 0%,#6a2fa0 55%,#a05be0 100%)", accent:"#d39bff", props:["🎆","🥤"], goal:18 },
      { name:"Champion Cup!",  bg:"radial-gradient(120% 90% at 50% 0%, #fff3c4 0%, #ffd84d 30%, #ff9d2e 65%, #e0731a 100%)", accent:"#ffcf2e", props:["🏆","🥇","🎉"], goal:20 }
    ];
    var L = LEVELS[Math.min(9, Math.max(0, DIFF-1))];
    var GOAL = Math.min(20, L.goal);
    // cup colors (one unlocks on a win) — lead with the level accent for a themed tower
    var CUP_COLORS = [L.accent,"#ff7a6e","#ffb24d","#ffd33d","#7dd470","#4cc6ff","#b08cff","#ff8fc7"];

    // Strict: a cup only stacks on a clean rep (SpeechAce "great" rating). Wrong → try again.

    var $ = function(id){ return document.getElementById(id); };
    var pick = function(a){ return a[Math.floor(Math.random()*a.length)]; };
    var shuffle = function(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; };

    /* ---- audio ---- */
    var audioCtx=null;
    function getCtx(){ if(!audioCtx){ var AC=window.AudioContext||window.webkitAudioContext; audioCtx=new AC(); } if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
    function playPCM(bytes){ return new Promise(function(res){ try{ var ctx=getCtx(); var n=bytes.byteLength>>1; var ab=ctx.createBuffer(1,n,24000); var ch=ab.getChannelData(0); var dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); for(var i=0;i<n;i++) ch[i]=dv.getInt16(i*2,true)/32768; var s=ctx.createBufferSource(); s.buffer=ab; s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1; var g=ctx.createGain(); g.gain.value=(profile.volume!=null?profile.volume:0.8); s.connect(g); g.connect(ctx.destination); s.onended=res; s.start(); }catch(e){ res(); } }); }
    // soft "thunk" when a cup lands (pitch rises with a cleaner rep)
    function thunk(p){ try{ var ctx=getCtx(); var o=ctx.createOscillator(),g=ctx.createGain(); o.type="sine"; o.frequency.setValueAtTime(180+(p||0)*160,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(90,ctx.currentTime+0.18); g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.16,ctx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.22); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.24); }catch(e){} }

    /* ---- Leo (real art) reacts live; cup + background auto-upgrade from /coach/cupstack/ ---- */
    var LEO={ idle:"/coach/echo/echo-idle.svg", cheer:"/coach/echo/echo-celebrate.svg", encourage:"/coach/echo/echo-listening.svg", listen:"/coach/echo/echo-listening.svg" };
    Object.keys(LEO).forEach(function(k){ var im=new Image(); im.src=LEO[k]; });
    function setLeo(state){ var el=document.getElementById("leo"); if(el&&LEO[state]) el.src=LEO[state]; }
    function leoReact(){ var w=document.getElementById("leoWrap"); if(!w)return; w.classList.remove("react"); void w.offsetWidth; w.classList.add("react"); }
    var CUP_ART=false;
    (function(){ var im=new Image(); im.onload=function(){ CUP_ART=true; }; im.src="/coach/cupstack/cup.png"; })();
    (function(){
      var s=document.getElementById("stage");
      // 1) paint the level's CSS scene immediately
      if(L.bg) s.style.background=L.bg;
      // 2) ambient level props drifting faintly behind the tower
      if(L.props&&L.props.length){
        var amb=document.createElement("div");
        amb.setAttribute("aria-hidden","true");
        amb.style.cssText="position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.16;font-size:38px;overflow:hidden;";
        var spots=[["8%","18%"],["80%","12%"],["64%","26%"],["18%","40%"],["86%","48%"]];
        for(var i=0;i<L.props.length;i++){ var sp=document.createElement("span"); sp.textContent=L.props[i];
          var pos=spots[i%spots.length]; sp.style.cssText="position:absolute;left:"+pos[0]+";top:"+pos[1]+";animation:sona-floatY "+(5.5+i)+"s ease-in-out infinite;"; amb.appendChild(sp); }
        s.insertBefore(amb, s.firstChild);
      }
      // 3) per-level art-drop override (real art replaces CSS when present)
      var lvlImg=new Image();
      lvlImg.onload=function(){ s.style.backgroundImage="url("+lvlImg.src+")"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center bottom"; };
      lvlImg.onerror=function(){ // fall back to the generic art-drop if a level image is absent
        var bg=new Image(); bg.onload=function(){ s.style.backgroundImage="url(/coach/cupstack/bg.png)"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center bottom"; }; bg.src="/coach/cupstack/bg.png"; };
      lvlImg.src="/coach/cupstack/lvl"+DIFF+".png";
    })();
    var speaking=false;
    function say(text){ return new Promise(function(res){ if(!text){return res();} if(speaking){return res();} speaking=true;
      fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,voice:profile.voiceId||""})})
        .then(function(r){ return r.ok?r.arrayBuffer():null; })
        .then(function(buf){ if(buf) return playPCM(new Uint8Array(buf)); })
        .catch(function(){}).finally(function(){ speaking=false; res(); }); }); }

    /* ---- mic + scoring ---- */
    var micStream=null, useSpeechAce=false;
    function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
    function matchText(t,w){ t=norm(t); w=norm(w); if(!t) return false; if(t.indexOf(w)>=0||w.indexOf(t)>=0) return true; var i=0; while(i<Math.min(t.length,w.length)&&t[i]===w[i]) i++; return i>=3; }

    function recordTurn(micBtn,maxMs){ if(window.Sona&&Sona.hasNativeAudio&&Sona.hasNativeAudio())return Sona.captureClip({maxMs:(maxMs||6000)});
      maxMs=maxMs||8000;
      return new Promise(function(resolve){
        var done=false,chunks=[],rec=null,sr=null,transcript=""; var stopWave=function(){};
        var spoke=false,lastVoice=0;
        var finish=function(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} micBtn.classList.remove("rec"); stopWave(); setTimeout(function(){ var blob=chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null; resolve({transcript:transcript,blob:blob}); },150); };
        try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); }; rec.start(); } }catch(e){}
        try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){ for(var i=0;i<ev.results.length;i++){ for(var k=0;k<ev.results[i].length;k++) transcript+=" "+ev.results[i][k].transcript; } finish(); }; sr.onerror=function(){}; sr.start(); } }catch(e){}
        var wraf=null,msrc=null,bars=null,ico=micBtn.querySelector("svg");
        try{
          if(micStream){
            var ctx=getCtx(); msrc=ctx.createMediaStreamSource(micStream);
            var an=ctx.createAnalyser(); an.fftSize=512; msrc.connect(an);
            var data=new Uint8Array(an.frequencyBinCount), tdv=new Uint8Array(an.fftSize);
            bars=document.createElement("div"); bars.className="wavebars";
            for(var b=0;b<7;b++) bars.appendChild(document.createElement("i"));
            if(ico) ico.style.display="none"; micBtn.appendChild(bars);
            var t0=performance.now(),noiseSum=0,noiseN=0,thr=0,voiced=0;
            (function tick(){ if(done) return;
              an.getByteFrequencyData(data);
              [].forEach.call(bars.children,function(el,k){ var v=data[2+k*3]/255; el.style.height=(8+v*30)+"px"; });
              an.getByteTimeDomainData(tdv);
              var sum=0; for(var k=0;k<tdv.length;k++){ var d=(tdv[k]-128)/128; sum+=d*d; }
              var rms=Math.sqrt(sum/tdv.length), now=performance.now();
              if(now-t0<300){ noiseSum+=rms; noiseN++; }
              else{
                if(!thr) thr=Math.min(0.09, Math.max(0.012,(noiseSum/Math.max(1,noiseN))*2.6));
                if(rms>thr){ voiced++; lastVoice=now; if(voiced>=2&&!spoke){ spoke=true; $("micState").textContent="I hear you! 👂"; } }
                else if(rms<thr*0.7) voiced=0;
                if(spoke && now-lastVoice>=1000){ finish(); return; }
              }
              wraf=requestAnimationFrame(tick); })();
          }
        }catch(e){}
        $("micState").textContent="Say it now!";
        stopWave=function(){ if(wraf)cancelAnimationFrame(wraf); try{msrc&&msrc.disconnect();}catch(e){} if(bars)bars.remove(); if(ico)ico.style.display=""; };
        micBtn.classList.add("rec"); micBtn.onclick=finish;
        setTimeout(function(){ if(!done) finish(); }, maxMs);
      });
    }

    // Strict scoring: a rep only counts when it's actually right. Returns {score, pass}.
    async function scoreAttempt(it, res){
      var scoreText=itScore(it), mode=itMode(it);
      // SpeechAce is the real judge — "pass" means a clean rep of the sound (great rating).
      if(useSpeechAce && res.blob){
        try{
          var fd=new FormData();
          fd.append("audio", new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"}));
          fd.append("text", scoreText); fd.append("targetSound", SOUND); fd.append("userId","child"); fd.append("mode",mode);
          var r=await fetch("/api/score",{method:"POST",body:fd});
          var j=await r.json();
          if(j&&j.ok && typeof j.score==="number") return { score:j.score, pass: j.rating==="great", feedback: j.feedback };
        }catch(e){}
      }
      // No SpeechAce: judge on the transcript when we have one — say it right, or try again.
      if(res.transcript){ var ok=matchText(res.transcript, scoreText); return { score: ok?85:30, pass: ok }; }
      // No way to score at all (scoring offline / no speech engine): don't hard-block the kid.
      return { score:70, pass:true };
    }

    /* ---- game state ---- */
    var queue=[], qi=0, placed=0, combo=0, bestCombo=0, busy=false, colorIdx=0;
    var roundCorrect=0, roundTotal=0; // ladder accuracy this round
    function buildQueue(){ queue=shuffle(POOL); if(!queue.length) queue=POOL.slice(); qi=0; }
    // CYCLE through ITEMS (modulo) so even a 1-item rung (isolation) yields enough turns.
    function nextWord(){ var w=queue[qi % Math.max(1,queue.length)]; qi++; return w; }
    var current=null;

    function showWord(it){
      current=it;
      var word=(it&&it.word)||itScore(it);
      $("wordEmoji").innerHTML=(window.Sona&&Sona.pic&&it.e)?Sona.pic(word,it.e,40):itEmoji(it);
      $("wordText").textContent=itDisplay(it);
    }

    function setCombo(n){
      combo=n; if(combo>bestCombo) bestCombo=combo;
      var cs=$("comboStat");
      if(combo>=2){ cs.style.visibility="visible"; $("comboPop").textContent="x"+combo; cs.animate?cs.animate([{transform:"scale(1.3)"},{transform:"scale(1)"}],{duration:280}):0; }
      else cs.style.visibility="hidden";
    }

    function sparkle(n){
      var fx=$("fx"); var rect=$("towerWrap").getBoundingClientRect();
      for(var i=0;i<n;i++){ var s=document.createElement("span"); s.className="spark"; s.textContent=pick(["✨","⭐","💫"]);
        s.style.left=(rect.left+rect.width/2-20+(Math.random()*80-40))+"px"; s.style.top=(rect.top+10)+"px";
        fx.appendChild(s); (function(el){ setTimeout(function(){ el.remove(); },820); })(s); }
    }

    function dropCup(band){
      var cup=document.createElement("div");
      var idx=(placed+colorIdx)%CUP_COLORS.length;
      cup.className="cup "+(band==="low"?"wobbledrop":"drop")+(CUP_ART?" art":"");
      var tilt = band==="great"?0 : band==="ok"? (Math.random()<.5?-4:4) : (Math.random()<.5?-9:9);
      cup.style.setProperty("--tilt", tilt+"deg");
      cup.style.transform="rotate("+tilt+"deg)";
      if(CUP_ART){ // real art: one design, hue-rotated for variety
        cup.innerHTML='<img src="/coach/cupstack/cup.png" alt="" style="filter:hue-rotate('+(idx*52)+'deg);"/>';
      } else {
        cup.style.background=CUP_COLORS[idx];
        cup.innerHTML='<span class="rim"></span>';
      }
      $("tower").appendChild(cup);
      placed++;
      $("cupCount").textContent=placed;
      $("heightTag").textContent=placed+" cups";
      thunk(band==="great"?1:band==="ok"?0.5:0.2);
      // keep the whole tower visible as it grows
      var scale=Math.min(1, 8.5/Math.max(1,placed));
      $("towerWrap").style.transform="scale("+scale+")";
      if(band==="great"){ sparkle(6); }
    }

    // model the current item: at isolation/syllable still coach the SOUND, else present the word/phrase.
    function modelItem(it){
      if(itPhoneme(it) && window.Sona){
        var cue=Sona.repeatCue?Sona.repeatCue(SOUND):itSay(it);
        return say(cue);
      }
      return say(itSay(it));
    }

    var cupTries=0; // fail-forward: attempts on the current word
    async function attempt(){
      if(busy) return; busy=true;
      $("micBtn").onclick=null;
      var w=current;
      setLeo("listen"); // Leo leans in while the kid talks
      var res=await recordTurn($("micBtn"));
      var sa=await scoreAttempt(w, res);
      roundTotal++; if(sa.pass) roundCorrect++;
      if(window.Sona&&Sona.logAttempt)Sona.logAttempt({game:"cupstack",sound:SOUND,pass:sa.pass,score:sa.score,word:itScore(w)});
      if(sa.pass){
        // Right — said cleanly, so a cup stacks.
        cupTries=0;
        if(window.Sona){Sona.sfx&&Sona.sfx.correct&&Sona.sfx.correct();}
        setCombo(combo+1); setLeo("cheer"); leoReact();
        $("micState").textContent="Nice one!";
        if(window.Sona&&Sona.praiseLine)await say(Sona.praiseLine());
        dropCup("great");
        await new Promise(function(r){ setTimeout(r,700); });
        setLeo("idle");
        busy=false;
        if(placed>=GOAL){ return finishGame(); }
        showWord(nextWord());
        $("micState").textContent="Listen…";
        await modelItem(current); // Leo models the next item (sound coaching at isolation/syllable)
        $("micState").textContent="Your turn — say it!";
        attempt(); // auto-listen — no tap to speak
      } else if(++cupTries<3){
        // Wrong — no cup yet. Re-model and try the same word again (up to 3x).
        if(window.Sona){Sona.sfx&&Sona.sfx.tap&&Sona.sfx.tap();}
        setCombo(0); setLeo("encourage");
        $("micState").textContent=(window.Sona&&Sona.coachLine)?Sona.coachLine(SOUND,sa.feedback):"Try again!";
        await new Promise(function(r){ setTimeout(r,700); });
        setLeo("idle");
        busy=false;
        $("micState").textContent="Listen…";
        await modelItem(w); // model the same item again
        $("micState").textContent="Your turn — say it!";
        attempt(); // auto-listen — no tap to speak
      } else {
        // fail-forward: after 3 tries, cheer the effort and stack a cup so the
        // kid moves on (the misses are already logged honestly above).
        cupTries=0; setCombo(0);
        if(window.Sona){Sona.sfx&&Sona.sfx.correct&&Sona.sfx.correct();}
        setLeo("cheer"); $("micState").textContent="Good trying!";
        if(window.Sona)await say("Good trying! Here's the next one.");
        dropCup("great");
        await new Promise(function(r){ setTimeout(r,700); });
        setLeo("idle"); busy=false;
        if(placed>=GOAL){ return finishGame(); }
        showWord(nextWord());
        $("micState").textContent="Listen…";
        await modelItem(current);
        $("micState").textContent="Your turn — say it!";
        attempt();
      }
    }

    function finishGame(){
      // SLP ladder: record this round's accuracy at the current rung (advances ~80%, never regresses).
      if(window.Sona&&Sona.recordRung) Sona.recordRung(SOUND, RUNG, roundCorrect/Math.max(1,roundTotal));
      // count the rewards up for a satisfying payoff
      (function countUp(el,to){ var n=0,step=Math.max(1,Math.round(to/18)); var iv=setInterval(function(){ n=Math.min(to,n+step); el.textContent=n; if(n>=to)clearInterval(iv); },40); })($("winHeight"),placed);
      $("winCombo").textContent=bestCombo;
      // pay coins into the meta-economy (base + combo bonus)
      var earned = 15 + bestCombo*2;
      if(window.Sona && Sona.addCoins) Sona.addCoins(earned);
      // mark the level done + complete today's daily quest (read by the map)
      try{
        var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}");
        GS[SOUND]=GS[SOUND]||{};
        var best=Math.max(placed,(GS[SOUND].cupstack&&GS[SOUND].cupstack.best)||0);
        GS[SOUND].cupstack={ done:true, best:best };
        GS.lastPlayDay=new Date().toISOString().slice(0,10);
        localStorage.setItem("sona.games.v1",JSON.stringify(GS));
      }catch(e){}
      // unlock the next cup color as the single reward
      colorIdx=(colorIdx+1)%CUP_COLORS.length;
      $("winUnlock").textContent="+"+earned+" 🪙   ·   🎉 New cup color unlocked!";
      $("winTitle").textContent = bestCombo>=4 ? "Amazing tower!" : "Great stacking!";
      $("win").classList.add("show");
      if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win"));
      if(window.Sona){ Sona.confetti&&Sona.confetti(); Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete(); Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin(); }
    }

    function startGame(){
      $("win").classList.remove("show");
      $("tower").innerHTML=""; placed=0; combo=0; bestCombo=0; setCombo(0);
      roundCorrect=0; roundTotal=0;
      $("cupCount").textContent="0"; $("cupGoal").textContent=GOAL; $("towerWrap").style.transform="scale(1)";
      setLeo("idle");
      buildQueue(); showWord(nextWord());
      $("micState").textContent="Listen…";
      (async function(){ await modelItem(current); $("micState").textContent="Your turn — say it!"; attempt(); })();
    }

    /* ---- boot ---- */
    (async function(){
      // detect SpeechAce availability (graceful fallback if not)
      try{ var r=await fetch("/api/score"); var j=await r.json(); useSpeechAce=!!(j&&j.hasKey); }catch(e){ useSpeechAce=false; }
      // mic permission up front
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      $("hear").onclick=function(){ if(current) modelItem(current); };
      $("again").onclick=startGame;
      // unobtrusive rung badge — what level the child is practicing for this sound
      try{ var rb=$("rungBadge"); if(rb) rb.textContent="Practicing: "+((window.Sona&&Sona.rungLabel)?Sona.rungLabel(RUNG):""); }catch(e){}
      if(window.Sona&&Sona.music) Sona.music.start();
      startGame();
    })();
    // return to this sound's ladder (Sound → ladder → games)
    (function(){ var lad="/map.html";
      var c=document.getElementById("close"); if(c) c.onclick=function(){ location.href=lad; };
      Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){ a.setAttribute("href",lad); });
    })();
    window.addEventListener("pagehide",function(){ try{ if(micStream) micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  </script>
</body>
</html>
