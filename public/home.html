<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sona.css" />
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div class="brand"><span class="leo">🦁</span> Sona</div>
      <div class="pills">
        <span class="pill flame">🔥 <span id="streak">0</span></span>
        <span class="pill xp">⭐ <span id="xp">0</span></span>
        <a class="iconbtn" href="/settings.html" title="Settings" style="display:flex;align-items:center;justify-content:center;">⚙️</a>
      </div>
    </header>

    <a class="card" href="/customize.html" style="display:flex;gap:14px;align-items:center;color:inherit;">
      <div class="leo" style="width:64px;height:64px;font-size:40px;flex:0 0 auto;position:relative;">
        <span id="heroChar">🦁</span>
        <span id="heroOutfit" style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:24px;"></span>
      </div>
      <div style="flex:1;min-width:0;">
        <h1 id="hello">Ready to practice?</h1>
        <p class="muted" id="sub">A few minutes a day keeps the streak going!</p>
      </div>
      <span class="pill" title="Customize" style="flex:0 0 auto;">✨</span>
    </a>

    <a class="btn" id="startBtn" href="#" style="margin-top:14px;">▶&nbsp;&nbsp;Start today's practice</a>

    <h2 style="margin:22px 2px 6px;">Your sounds</h2>
    <div class="path" id="path"></div>

    <p class="muted" style="text-align:center;margin-top:18px;font-size:13px;">
      <a href="/progress.html">Progress</a> · <a href="/settings.html">Settings</a>
    </p>
  </div>

  <script src="/sona.js"></script>
  <script>
    var p = Sona.getProfile();
    if (!p.onboarded) { location.replace("/onboarding.html"); }
    var g = Sona.getProgress();

    // fun world layer: apply the child's chosen backdrop + buddy
    var bd = Sona.backdropById(p.backdrop);
    document.body.style.background = bd.css + " fixed";
    var buddy = Sona.characterById(p.character);
    var outfit = Sona.outfitById(p.outfit);
    document.getElementById("heroChar").textContent = buddy.emoji;
    document.getElementById("heroOutfit").textContent = outfit.emoji || "";
    var BUDDY = buddy.emoji;

    var name = (p.childName || "").trim();
    var today = new Date().toISOString().slice(0, 10);
    var practicedToday = g.streak.lastDate === today;

    document.getElementById("streak").textContent = g.streak.count || 0;
    document.getElementById("xp").textContent = g.totals.stars || 0;
    document.getElementById("hello").textContent = name ? ("Hi, " + name + "!") : "Ready to practice?";
    document.getElementById("sub").textContent = practicedToday
      ? "Nice — you practiced today! 🎉"
      : "A few minutes a day keeps the streak going!";

    var SOUNDS = (p.focusSounds && p.focusSounds.length) ? p.focusSounds.slice() : ["R", "S", "L", "K"];
    function starsFor(s) { return Math.min(3, Math.floor((g.bySound[s] || 0) / 3)); }
    function unlocked(i) { return i === 0 || (g.bySound[SOUNDS[i - 1]] || 0) >= 3; }
    function go(s) { location.href = "/lesson.html?sound=" + encodeURIComponent(s) + (name ? "&name=" + encodeURIComponent(name) : ""); }

    var pathEl = document.getElementById("path");
    var firstPlay = null, allDone = true;
    SOUNDS.forEach(function (s, i) {
      var open = unlocked(i), st = starsFor(s), done = st >= 3;
      if (!done) allDone = false;
      var current = open && firstPlay === null && !done;
      if (current) firstPlay = s;
      var node = document.createElement("div");
      node.className = "node" + (done ? " done" : "") + (open ? "" : " locked") + (current ? " cur" : "");
      node.innerHTML =
        (i > 0 ? '<span class="connector"></span>' : '') +
        (current ? '<div class="leoToken">' + BUDDY + '</div>' : '') +
        '<button class="bubble">' + (done ? '✓' : (open ? s : '🔒')) + '</button>' +
        '<div class="label">' + s + ' sound</div>' +
        '<div class="stars">' + (open ? ("★".repeat(st) + "☆".repeat(3 - st)) : '') + '</div>';
      if (open) node.querySelector(".bubble").onclick = function () { go(s); };
      pathEl.appendChild(node);
    });
    if (firstPlay === null) firstPlay = SOUNDS[0];
    // prize chest at the end of the path
    var chest = document.createElement("div");
    chest.className = "node chest " + (allDone ? "ready" : "locked");
    chest.innerHTML = '<span class="connector"></span><button class="bubble">' + (allDone ? '🎁' : '🔒') + '</button><div class="label">Prize</div>';
    if (allDone) chest.querySelector(".bubble").onclick = function () { alert("🎉 You mastered all your sounds! Amazing job!"); };
    pathEl.appendChild(chest);
    document.getElementById("startBtn").onclick = function (e) { e.preventDefault(); go(firstPlay); };
  </script>
</body>
</html>
