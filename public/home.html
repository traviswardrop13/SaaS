<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sona.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#2a9df4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sona" />
  <style>
    /* premium launchpad polish */
    body{background:linear-gradient(180deg,#eef7ff 0%,#e7f1ff 45%,#eafbe9 100%) fixed;}
    .hero{position:relative;margin-top:8px;background:#fff;border-radius:28px;padding:26px 22px 24px;text-align:center;
      box-shadow:0 18px 40px -18px rgba(20,90,160,.35), 0 2px 0 rgba(255,255,255,.6) inset;overflow:hidden;}
    .hero:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% -20%,rgba(28,176,246,.12),transparent 60%);pointer-events:none;}
    .hero .leoBig{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(20,90,160,.22));animation:floaty 4s ease-in-out infinite;}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .hero h1{font-family:"Baloo 2";font-weight:800;font-size:26px;margin-top:6px;color:#0e2a44;}
    .hero .sub{color:#6b86a3;font-weight:700;font-size:14px;margin-top:2px;}
    .playBtn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;width:100%;border:none;border-radius:20px;
      padding:18px;font-family:"Baloo 2";font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;color:#fff;cursor:pointer;text-decoration:none;
      background:linear-gradient(180deg,#5fd216,#46a302);box-shadow:0 8px 0 0 #3c8c02, 0 14px 22px -8px rgba(70,163,2,.6);transition:transform .06s,box-shadow .06s;}
    .playBtn:active{transform:translateY(5px);box-shadow:0 3px 0 0 #3c8c02, 0 8px 14px -8px rgba(70,163,2,.6);}
    .glance{display:flex;gap:10px;margin-top:14px;}
    .glance .g{flex:1;background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 8px 22px -14px rgba(20,90,160,.4);}
    .glance .g .n{font-family:"Baloo 2";font-weight:800;font-size:22px;color:#0e2a44;}
    .glance .g .l{font-weight:800;font-size:11px;color:#6b86a3;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
    .themeChip{display:block;text-align:center;margin-top:14px;font-weight:800;font-size:13px;color:#3c8c02;}
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div class="brand"><span class="leo"><img src="/coach/leo-icon.png" alt="Leo" /></span> Sona <span class="beta">BETA</span></div>
      <div class="pills">
        <span class="pill flame">🔥 <span id="streak">0</span></span>
        <a class="iconbtn" href="/settings.html" title="Settings" style="display:flex;align-items:center;justify-content:center;">⚙️</a>
      </div>
    </header>

    <div id="iosTip" class="card" style="display:none;align-items:center;gap:10px;background:#eef7ff;border-color:#bfe3ff;padding:12px 14px;margin-bottom:14px;">
      <span style="font-size:24px;flex:0 0 auto;">📲</span>
      <span style="flex:1;font-weight:700;font-size:13.5px;">Make Sona an app: tap <b>Share</b> below, then <b>“Add to Home Screen.”</b></span>
      <button id="iosTipClose" class="iconbtn" style="width:30px;height:30px;font-size:16px;flex:0 0 auto;">×</button>
    </div>

    <div id="subBanner" class="card" style="display:none;align-items:center;gap:10px;background:#fff7ef;border-color:#ffd9b0;padding:12px 14px;margin-bottom:14px;">
      <span style="flex:1;font-weight:700;font-size:14px;">✨ Enjoying Sona? <a href="/subscribe">Start your subscription</a> to keep Leo going.</span>
      <button id="subDismiss" class="iconbtn" title="Dismiss" style="width:30px;height:30px;font-size:16px;flex:0 0 auto;">×</button>
    </div>

    <div class="hero">
      <img class="leoBig" id="leoBig" src="/coach/leo.png" alt="Leo" />
      <h1 id="hello">Ready to play?</h1>
      <div class="sub" id="sub">A few minutes a day keeps the streak going!</div>
      <a class="playBtn" href="/play.html">🎮 Play</a>
      <span class="themeChip" id="themeLine"></span>
    </div>

    <div class="glance">
      <a class="g" href="/play.html" style="text-decoration:none;"><div class="n" id="gStreak">0</div><div class="l">🔥 Day streak</div></a>
      <a class="g" href="/shop.html" style="text-decoration:none;"><div class="n" id="gCoins">0</div><div class="l">🪙 Coins</div></a>
      <a class="g" href="/progress.html" style="text-decoration:none;"><div class="n" id="gStars">0</div><div class="l">⭐ Stars</div></a>
    </div>

    <p class="muted" style="text-align:center;margin-top:18px;font-size:13px;">
      <a href="/progress.html">Progress</a> · <a href="/settings.html">Settings</a> · <a href="mailto:wardroptravis@gmail.com?subject=Sona%20feedback">Send feedback</a>
    </p>
  </div>

  <script src="/sona.js"></script>
  <script>
    var p = Sona.getProfile();
    if (!p.onboarded) { location.replace("/onboarding.html"); }
    var g = Sona.getProgress();

    // real Leo art for the chosen buddy
    document.getElementById("leoBig").src = (Sona.characterById(p.character).img) || "/coach/leo.png";

    var name = (p.childName || "").trim();
    var today = new Date().toISOString().slice(0, 10);
    var practicedToday = g.streak.lastDate === today;

    document.getElementById("streak").textContent = g.streak.count || 0;
    document.getElementById("hello").textContent = name ? ("Hi, " + name + "!") : "Ready to play?";
    document.getElementById("sub").textContent = practicedToday
      ? "Nice — you played today! 🎉"
      : "A few minutes a day keeps the streak going!";

    // glance stats
    document.getElementById("gStreak").textContent = g.streak.count || 0;
    document.getElementById("gCoins").textContent = (Sona.getCoins ? Sona.getCoins() : 0);
    document.getElementById("gStars").textContent = (g.totals && g.totals.stars) || 0;

    // today's theme — fresh words today
    if (Sona.dayTheme) {
      var th = Sona.dayTheme();
      document.getElementById("themeLine").textContent = th.e + " " + th.n + " — new words today!";
    }

    // iOS install tip (once, Safari only, until installed)
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    try { if (standalone) localStorage.setItem("sona.iosTipDone", "1"); } catch (e) {}
    if (isIOS && !standalone && localStorage.getItem("sona.iosTipDone") !== "1") {
      try { localStorage.setItem("sona.iosTipDone", "1"); } catch (e) {} // show once, ever
      var tip = document.getElementById("iosTip"); tip.style.display = "flex";
      document.getElementById("iosTipClose").onclick = function () { tip.style.display = "none"; };
    }

    // gentle, dismissible subscribe prompt (non-blocking)
    var iosTipShowing = document.getElementById("iosTip") && document.getElementById("iosTip").style.display === "flex";
    if (!iosTipShowing && (g.totals.sessions || 0) >= 1 && !(Sona.isSubscribed && Sona.isSubscribed()) && localStorage.getItem("sona.subPromptDismissed") !== "1") {
      var sb = document.getElementById("subBanner"); sb.style.display = "flex";
      document.getElementById("subDismiss").onclick = function () { sb.style.display = "none"; try { localStorage.setItem("sona.subPromptDismissed", "1"); } catch (e) {} };
    }
  </script>
</body>
</html>
