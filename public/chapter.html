<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Today's Story</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0d1b3e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --ink:#fff; --dim:#b9c6e8; --gold:#ffd21c; --green:#58cc02; --green-d:#46a302; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:Nunito,-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:radial-gradient(120% 90% at 50% 8%,#26407e 0%,#152a5c 45%,#0d1b3e 100%);color:var(--ink);}
    /* the night sky the whole arc lives under — a star fell out of it */
    /* SCENE1: the chapter's world. Sits under the stars and the text, never
       over them — a scene that competes with the words it illustrates is worse
       than no scene at all. */
    #scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;transition:opacity .45s;}
    #scene i{position:absolute;display:block;}
    #stars{position:fixed;inset:0;pointer-events:none;}
    #stars i{position:absolute;background:#fff;border-radius:50%;opacity:.65;animation:tw 3.4s ease-in-out infinite;}
    @keyframes tw{0%,100%{opacity:.22;}50%{opacity:.9;}}

    #app{position:relative;height:100%;display:flex;flex-direction:column;
      padding:calc(14px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;}
    #top{display:flex;align-items:center;gap:10px;flex:none;}
    #close{border:none;background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;border-radius:50%;font-size:17px;font-weight:800;cursor:pointer;flex:none;}
    #chip{font-family:"Baloo 2";font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;}
    #ttl{font-family:"Baloo 2";font-weight:800;font-size:15px;color:#fff;line-height:1.2;}

    /* progress pips — a child can see how much story is left */
    #pips{display:flex;gap:6px;margin-top:14px;flex:none;}
    #pips b{height:5px;border-radius:99px;background:rgba(255,255,255,.2);flex:1;transition:background .3s;}
    #pips b.on{background:var(--gold);}

    #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;padding:8px 0;}
    #echo{width:min(38vw,150px);height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.45));transition:transform .35s,opacity .2s;}
    #echo.swap{opacity:0;}
    #echo.pop{transform:scale(1.07) rotate(-3deg);}
    #text{font-family:"Baloo 2";font-weight:800;font-size:clamp(19px,5.4vw,26px);line-height:1.36;margin-top:18px;
      text-shadow:0 3px 10px rgba(0,0,0,.35);max-width:22ch;}
    #hint{color:var(--dim);font-weight:800;font-size:12.5px;margin-top:14px;}

    #bottom{flex:none;display:flex;gap:10px;align-items:center;}
    #hear{flex:none;border:none;border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.15);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:14px;cursor:pointer;}
    #next{flex:1;border:none;border-radius:18px;padding:16px;font-family:"Baloo 2";font-weight:800;font-size:19px;color:#fff;
      background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 5px 0 #ef6f23;cursor:pointer;}
    #next:active{transform:translateY(4px);box-shadow:0 1px 0 #ef6f23;}

    /* the finish beat: the three games visibly unlock */
    #done{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
      padding:32px 26px;background:radial-gradient(120% 90% at 50% 20%,#2b56a8 0%,#152a5c 55%,#0d1b3e 100%);}
    #done h1{font-family:"Baloo 2";font-weight:800;font-size:30px;margin-top:14px;}
    #done p{color:var(--dim);font-weight:800;font-size:14.5px;margin-top:8px;line-height:1.5;max-width:26ch;}
    #unlocked{display:flex;gap:10px;margin-top:22px;}
    #unlocked div{width:74px;height:74px;border-radius:18px;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;
      font-size:30px;border:2px solid rgba(255,255,255,.22);animation:unlock .5s backwards;}
    #unlocked div:nth-child(2){animation-delay:.14s;} #unlocked div:nth-child(3){animation-delay:.28s;}
    @keyframes unlock{from{transform:scale(.6) rotate(-12deg);opacity:0;}to{transform:none;opacity:1;}}
    #doneBtn{margin-top:26px;width:100%;max-width:320px;border:none;border-radius:18px;padding:17px;font-family:"Baloo 2";font-weight:800;font-size:20px;
      color:#fff;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 5px 0 var(--orange-d);cursor:pointer;}
    #hook{color:var(--gold);font-weight:800;font-size:13px;margin-top:18px;max-width:28ch;line-height:1.5;}
  </style>
</head>
<body>
  <div id="stars"></div>
  <div id="scene"></div>
  <div id="app">
    <div id="top">
      <button id="close" aria-label="Close">✕</button>
      <div>
        <div id="chip"></div>
        <div id="ttl"></div>
      </div>
    </div>
    <div id="pips"></div>

    <div id="stage">
      <img id="echo" src="/coach/echo/echo-idle.svg" alt="Echo" onerror="this.style.display='none';" />
      <div id="text"></div>
      <div id="hint">Tap to keep reading</div>
    </div>

    <div id="bottom">
      <button id="hear">🔊 Read it to me</button>
      <button id="next">Next →</button>
    </div>
  </div>

  <div id="done">
    <img src="/coach/echo/echo-celebrate.svg" alt="Echo" style="width:120px;" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
    <h1>Story finished! 🎉</h1>
    <p>Three games just unlocked for today.</p>
    <div id="unlocked"></div>
    <div id="hook"></div>
    <button id="doneBtn">Let's play! →</button>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, profile={}; try{ profile=S.getProfile()||{}; }catch(e){}

    // twinkling sky (cheap, deterministic enough to look hand-placed)
    (function(){ var f=document.createDocumentFragment();
      for(var i=0;i<38;i++){ var s=document.createElement("i"); var sz=(i%4)+1.4;
        s.style.cssText="left:"+((i*37)%100)+"%;top:"+((i*61)%92)+"%;width:"+sz+"px;height:"+sz+"px;animation-delay:"+((i%9)*0.37)+"s";
        f.appendChild(s); } $("stars").appendChild(f); })();

    // ── today's chapter ────────────────────────────────────────────────────
    // The pages ARE the episode: the opening beat plus the four story beats.
    // These used to flash between practice rounds where a mid-game child had
    // no attention left for them; read first, they're the reason to practise.
    var EP=null, PAGES=[], i=0;
    try{ EP=S.dailyStory(); }catch(e){}
    if(!EP){ location.replace("/today.html"); }
    else {
      PAGES=[EP.open].concat(EP.beats||[]);
      $("chip").textContent="Chapter "+(S.dailyChapterNum?S.dailyChapterNum():1);
      $("ttl").textContent=EP.t;
      var pips=$("pips");
      PAGES.forEach(function(){ pips.appendChild(document.createElement("b")); });
      paintScene();
    }

    /* ── voice ───────────────────────────────────────────────────────────── */
    // SPEAK1: the speech path lives in sona.js now. This page carried its own
    // copy with no fetch timeout and a PCM promise that never resolved on a
    // suspended iOS context — two stuck calls and every later tap of "Read it
    // to me" was dropped silently. The shared pipeline is bounded end to end.
    function unlockAudio(){ try{ S.speakUnlock(); }catch(e){} }
    function say(t){ try{ return S.speak(t); }catch(e){ return Promise.resolve(); } }

    // The chapter's world: painted once. Echo re-poses per page on top of it,
    // which is what makes a page turn feel like a page rather than a text swap.
    var SCENE=null;
    function paintScene(){
      try{
        SCENE=(S.chapterScene&&EP)?S.chapterScene(EP.id):null;
        if(!SCENE) return;
        document.body.style.background=SCENE.sky;
        $("scene").innerHTML=SCENE.decor||"";
        // the starfield belongs to the night chapters; it reads as dirt on a
        // daylit meadow or the inside of a cave
        var st=$("stars"); if(st) st.style.display=SCENE.stars?"":"none";
      }catch(e){}
    }

    function paint(){
      $("text").textContent=PAGES[i]||"";
      // Echo acts: a different pose per page, cross-faded so the swap is not a
      // hard cut. The live review's finding was that he stood in one neutral
      // pose while the words described a star falling.
      try{
        if(S.chapterPose&&EP){
          var img=$("echo"), want=S.chapterPose(EP.id,i);
          if(img && img.getAttribute("src")!==want){
            img.classList.add("swap");
            setTimeout(function(){ img.setAttribute("src",want); img.classList.remove("swap"); },170);
          }
        }
      }catch(e){}
      var pp=$("pips").children;
      for(var k=0;k<pp.length;k++) pp[k].className=(k<=i)?"on":"";
      $("next").textContent=(i>=PAGES.length-1)?"Finish the story →":"Next →";
      $("hint").textContent=(i>=PAGES.length-1)?"Last page!":"Tap to keep reading";
      var e=$("echo"); e.classList.add("pop"); setTimeout(function(){ e.classList.remove("pop"); },340);
      say(PAGES[i]);
    }

    function advance(){
      try{ S.sfx&&S.sfx("tap"); }catch(e){}
      if(i>=PAGES.length-1){ finish(); return; }
      i++; paint();
    }

    // Finishing is what unlocks the day. markStoryRead() also queues tomorrow's
    // chapter, so the home screen is different in the morning without anyone
    // having to remember to advance it.
    function finish(){
      try{ S.markStoryRead(); }catch(e){}
      try{ S.track&&S.track("story finished",{chapter:(S.dailyChapterNum?S.dailyChapterNum():0)}); }catch(e){}
      var keys=[]; try{ keys=S.dailyGames()||[]; }catch(e){}
      var ICON={slice:"🍉",tiles:"🎹",stack:"🧱",run:"🏃",glide:"🎈",feed:"🦜"};
      var host=$("unlocked"); host.innerHTML="";
      keys.forEach(function(k){ var d=document.createElement("div"); d.textContent=ICON[k]||"🎮"; host.appendChild(d); });
      $("hook").textContent=EP.hook||"";
      $("done").style.display="flex";
      try{ S.confetti&&S.confetti({count:150}); }catch(e){}
      say("You did it! Three games are unlocked.");
    }

    $("next").onclick=function(){ unlockAudio(); advance(); };
    $("stage").onclick=function(){ unlockAudio(); advance(); };
    // the button means NOW — it supersedes the auto-read instead of queueing
    // behind it, because a child who taps it wants this page, immediately
    $("hear").onclick=function(ev){ ev.stopPropagation(); unlockAudio(); try{ S.speakNow(PAGES[i]); }catch(e){} };
    $("close").onclick=function(){ location.href="/today.html"; };
    $("doneBtn").onclick=function(){ location.href="/today.html"; };

    if(EP) paint();
  </script>
</body>
</html>
