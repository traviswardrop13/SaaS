<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Pop-a-Word</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --ink:#3c3c3c; --muted:#777; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:linear-gradient(180deg,#cdeffd,#d8f3e0 60%,#bfe9a8);color:var(--ink);}
    #app{height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;}
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 6px;}
    #close{border:none;background:none;color:#86c08a;font-size:24px;font-weight:800;cursor:pointer;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(40,140,80,.12);}
    .stat.score{color:var(--green-d);} .stat.coins{color:var(--orange-d);margin-left:auto;}
    #prompt{text-align:center;font-family:"Baloo 2";font-weight:800;font-size:19px;color:var(--green-d);min-height:26px;padding:4px 18px;}
    #hearRow{text-align:center;margin-bottom:4px;} #hear{border:none;background:#fff;border-radius:99px;padding:8px 16px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 8px rgba(40,140,80,.14);color:var(--green-d);}
    #grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;padding:10px 18px calc(18px + env(safe-area-inset-bottom));}
    .hole{position:relative;border-radius:50%/30%;background:radial-gradient(ellipse at 50% 40%,#7a5a3a,#5a3f28);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;box-shadow:inset 0 -6px 12px rgba(0,0,0,.3);}
    .critter{width:84%;aspect-ratio:1/1;margin-bottom:-6%;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      transform:translateY(115%);transition:transform .28s cubic-bezier(.34,1.4,.6,1);box-shadow:0 4px 0 rgba(0,0,0,.12);cursor:pointer;}
    .critter.up{transform:translateY(8%);}
    .critter.bop{animation:bop .4s ease;}
    @keyframes bop{0%{transform:translateY(8%) scale(1)}50%{transform:translateY(8%) scale(1.12)}100%{transform:translateY(115%)}}
    .critter .e{font-size:38px;line-height:1;} .critter .w{font-family:"Baloo 2";font-weight:800;font-size:12px;color:var(--blue-d);}
    .critter.right{outline:4px solid var(--green);}
    #micline{display:flex;align-items:center;justify-content:center;gap:8px;height:24px;}
    #micline .dot{width:11px;height:11px;border-radius:50%;background:#bcd;} #micline.live .dot{background:var(--green);animation:blink 1s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}} #micline span{font-weight:800;font-size:12px;color:var(--muted);}
    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#cdeffd,#bfe9a8);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;} #win h1{font-family:"Baloo 2";font-weight:800;font-size:32px;color:var(--green-d);margin-top:10px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:26px;color:var(--green-d);margin-top:16px;box-shadow:0 6px 16px rgba(40,140,80,.14);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;}
    #win .unlock{margin-top:14px;font-weight:800;color:var(--orange-d);}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win a{margin-top:14px;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none;}
    #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(40,140,80,.25));animation:leoPop .6s ease;}
    #leo{width:64px;height:64px;object-fit:contain;display:block;margin:2px auto 0;filter:drop-shadow(0 5px 7px rgba(40,140,80,.2));animation:leoBob 3.2s ease-in-out infinite;}
    #leo.react{animation:leoPop .55s ease;}
    @keyframes leoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes leoPop{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-8px)}60%{transform:scale(.95)}100%{transform:scale(1)}}
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat score">⭐ <span id="score">0</span>/<span id="goal">8</span></span>
      <span class="stat coins">🪙 <span id="coins">0</span></span>
    </div>
    <img id="leo" src="/coach/leo.png" alt="Leo" />
    <div id="prompt">Pop the word Leo says!</div>
    <div id="hearRow"><button id="hear">🔊 Say it again</button></div>
    <div id="grid"></div>
    <div id="micline"><span class="dot"></span><span id="micText"></span></div>
  </div>
  <div id="win">
    <img class="leoWin" src="/coach/poses/leo-celebrate.png" alt="Leo celebrating" onerror="this.onerror=null;this.src='/coach/leo.png';" />
    <h1>Great popping!</h1>
    <div class="reward"><span id="winScore">0</span><small>words popped</small></div>
    <div class="unlock" id="winUnlock"></div>
    <button class="btn" id="again">Play again</button>
    <a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script>
    var profile = (window.Sona ? Sona.getProfile() : { focusSounds:["R"], voiceId:"", volume:0.8 });
    var params = new URLSearchParams(location.search);
    var SOUND = (params.get("sound") || (profile.focusSounds && profile.focusSounds[0]) || "R").toUpperCase();
    if(!(window.Sona && Sona.WORDS && Sona.WORDS[SOUND])) SOUND="R";
    var POOL = (window.Sona && Sona.WORDS && Sona.WORDS[SOUND]) ? Sona.WORDS[SOUND].filter(function(w){return w.i;}) : [{w:"rabbit",e:"🐰"}];
    var GOAL = 8;

    var $=function(id){return document.getElementById(id);};
    var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
    var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
    var LEO={ idle:"/coach/leo.png", cheer:"/coach/poses/leo-celebrate.png" };
    Object.keys(LEO).forEach(function(k){ var im=new Image(); im.src=LEO[k]; });
    function setLeo(s){ var el=$("leo"); if(el&&LEO[s]) el.src=LEO[s]; }
    function leoReact(){ var el=$("leo"); if(!el)return; el.classList.remove("react"); void el.offsetWidth; el.classList.add("react"); }

    var audioCtx=null;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    function playPCM(bytes){ return new Promise(function(res){ try{ var ctx=getCtx(); var n=bytes.byteLength>>1; var ab=ctx.createBuffer(1,n,24000); var ch=ab.getChannelData(0); var dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=ctx.createBufferSource(); s.buffer=ab; s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1; var g=ctx.createGain(); g.gain.value=(profile.volume!=null?profile.volume:0.8); s.connect(g); g.connect(ctx.destination); s.onended=res; s.start(); }catch(e){res();} }); }
    var speaking=false;
    function say(text){ return new Promise(function(res){ if(!text){return res();} if(speaking){return res();} speaking=true; fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){ if(b) return playPCM(new Uint8Array(b)); }).catch(function(){}).finally(function(){speaking=false;res();}); }); }

    var micStream=null;
    function hearRep(maxMs){ maxMs=maxMs||4000; return new Promise(function(resolve){ var done=false,spoke=false,raf=null,src=null;
      $("micline").classList.add("live"); $("micText").textContent="Say it! 🎤";
      function fin(){ if(done)return; done=true; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} $("micline").classList.remove("live"); $("micText").textContent=""; resolve(spoke); }
      try{ if(micStream){ var ctx=getCtx(); src=ctx.createMediaStreamSource(micStream); var an=ctx.createAnalyser(); an.fftSize=512; src.connect(an); var td=new Uint8Array(an.fftSize); var t0=performance.now(),nS=0,nN=0,thr=0,v=0,lv=0;
        (function tick(){ if(done)return; an.getByteTimeDomainData(td); var sum=0; for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;} var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<300){nS+=rms;nN++;} else { if(!thr)thr=Math.min(0.1,Math.max(0.014,(nS/Math.max(1,nN))*2.6)); if(rms>thr){v++;lv=now;if(v>=2)spoke=true;}else if(rms<thr*0.7)v=0; if(spoke&&now-lv>=800){fin();return;} }
          raf=requestAnimationFrame(tick); })(); } }catch(e){}
      setTimeout(fin,maxMs); }); }

    /* game */
    var score=0, busy=false, target=null, slots=[];
    function layout(){ var grid=$("grid"); grid.innerHTML=""; slots=[]; for(var i=0;i<6;i++){ var hole=document.createElement("div"); hole.className="hole"; var cr=document.createElement("div"); cr.className="critter"; cr.innerHTML='<span class="e"></span><span class="w"></span>'; hole.appendChild(cr); grid.appendChild(hole); slots.push(cr); } }

    function round(){
      if(score>=GOAL) return finishGame();
      busy=false; target=pick(POOL);
      // choose 4-5 critters to show, including the target, rest distractors from pool
      var others=shuffle(POOL.filter(function(w){return w.w!==target.w;}));
      var show=shuffle([target].concat(others.slice(0,4))).slice(0,Math.min(5,POOL.length));
      // place into random holes
      var holes=shuffle([0,1,2,3,4,5]).slice(0,show.length);
      slots.forEach(function(cr){ cr.className="critter"; cr.dataset.word=""; });
      show.forEach(function(w,k){ var cr=slots[holes[k]]; cr.dataset.word=w.w; cr.querySelector(".e").textContent=w.e; cr.querySelector(".w").textContent=w.w; setTimeout(function(){cr.classList.add("up");}, 80*k); cr.onclick=function(){ tap(cr,w); }; });
      $("prompt").textContent="Pop the "+target.w+"!";
      say("Pop the "+target.w+"!");
    }

    async function tap(cr, w){
      if(busy) return;
      if(w.w!==target.w){ $("prompt").textContent="That's "+w.w+" — find "+target.w+"!"; if(window.Sona&&Sona.sfx)Sona.sfx.tap&&Sona.sfx.tap(); return; }
      busy=true; cr.classList.add("right");
      await hearRep();  // say it to pop (rep) — always proceeds
      cr.classList.remove("right"); cr.classList.add("bop");
      if(window.Sona){ Sona.sfx&&Sona.sfx.correct&&Sona.sfx.correct(); Sona.pop&&Sona.pop("⭐",{color:"#46a302",y:window.innerHeight*0.4}); }
      setLeo("cheer"); leoReact();
      score++; $("score").textContent=score; $("prompt").textContent="Pop! 🎉";
      // lower the others
      slots.forEach(function(s){ if(s!==cr) s.classList.remove("up"); });
      setTimeout(function(){ setLeo("idle"); round(); }, 600);
    }

    function finishGame(){
      $("winScore").textContent=score;
      var earned=15+score*2;
      if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{ var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}"); GS[SOUND]=GS[SOUND]||{}; GS[SOUND].whack={done:true}; GS.lastPlayDay=new Date().toISOString().slice(0,10); localStorage.setItem("sona.games.v1",JSON.stringify(GS)); }catch(e){}
      $("winUnlock").textContent="+"+earned+" 🪙";
      $("coins").textContent=Sona.getCoins?Sona.getCoins():0;
      $("win").classList.add("show");
      if(window.Sona){ Sona.confetti&&Sona.confetti(); Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete(); }
    }

    function startGame(){
      $("win").classList.remove("show"); score=0; $("score").textContent="0"; $("goal").textContent=GOAL;
      $("coins").textContent=Sona.getCoins?Sona.getCoins():0;
      layout(); round();
    }
    $("hear").onclick=function(){ if(target) say("Pop the "+target.w+"!"); };

    (async function(){
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      $("again").onclick=startGame;
      startGame();
    })();
    // return to this sound's ladder (Sound → ladder → games)
    (function(){ var lad="/ladder.html?sound="+SOUND;
      var c=document.getElementById("close"); if(c) c.onclick=function(){ location.href=lad; };
      Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){ a.setAttribute("href",lad); });
    })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  </script>
</body>
</html>
