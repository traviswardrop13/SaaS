<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Feed Echo</title>
  <link href="/fonts.css" rel="stylesheet">
  <meta name="theme-color" content="#fff6e9" />
  <!--
    Feed Echo — the littles game (3-5, fun for everyone). Echo ASKS for a word,
    3-8s hear it, say it, and TAP the matching picture; Echo munches it and
    grows a little — growth persists forever (sona.feed.v1), so Echo is
    visibly bigger next week. Receptive word-picture matching IS legitimate
    practice for littles (it's how clinic drill games like this work), and the
    tap is the answer — no reading, no timer, no fail state.

    Privacy hard lines, same as every game: the OPTIONAL mic listens for
    loudness only (a cheer trigger — "Echo heard you!") — nothing is recorded,
    uploaded, scored, or logged; skipped entirely unless the mic was already
    granted elsewhere (this page never triggers the OS prompt). Feeds come
    from taps (real actions), never from silence.
  -->
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --ink:#4a2c14; --muted:#8a6f52; --cream:#fff6e9; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{min-height:100%;background:linear-gradient(180deg,#fff6e9 0%,#ffeccb 30%,#cef0b8 56%,#a9e18f 100%);color:var(--ink);}
    #app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));}
    /* HUD (shared kit) */
    #top{display:flex;align-items:center;gap:9px;}
    #close{border:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#b08d63;font-size:19px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 4px 0 rgba(160,80,20,.35);flex:none;}
    .hudpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 14px;box-shadow:0 4px 0 rgba(160,80,20,.35);font-family:"Baloo 2";font-weight:800;font-size:16px;color:var(--ink);}
    #spacer{flex:1;}
    /* Echo + bubble */
    #stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:186px;position:relative;padding-top:8px;}
    #bubble{background:#fff;border-radius:18px;padding:10px 18px;font-family:"Baloo 2";font-weight:800;box-shadow:0 6px 16px rgba(74,44,20,.12);position:relative;max-width:320px;text-align:center;line-height:1.25;}
    #bubble:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:#fff;border-radius:3px;}
    #bMain{font-size:16px;color:var(--ink);}
    #bMain b{color:#ef6f23;font-size:clamp(26px,8vw,32px);padding-left:2px;}
    #bSub{font-family:Nunito,sans-serif;font-weight:800;font-size:12.5px;color:#8a6f52;min-height:16px;margin-top:1px;}
    #echoSpot{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:12px;}
    #mound{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:210px;height:52px;border-radius:50%;background:#8fdc7a;box-shadow:inset 0 -6px 0 rgba(90,150,60,.4);}
    #echo{position:relative;z-index:1;width:150px;height:150px;object-fit:contain;transition:transform .35s cubic-bezier(.3,1.5,.5,1);transform-origin:bottom center;filter:drop-shadow(0 10px 14px rgba(120,70,10,.18));}
    /* the plate IS the counter (D5): a white picnic plate with five wells —
       each right answer lands that word's picture in the next well */
    #plate{position:relative;z-index:2;width:min(60vw,230px);height:52px;margin-top:-10px;background:#fff;border-radius:50%;box-shadow:0 6px 14px rgba(90,120,50,.25),inset 0 -4px 0 #f0e6d6;display:flex;align-items:center;justify-content:space-evenly;padding:0 14px;}
    #plate .well{width:28px;height:28px;border-radius:50%;background:#f6ead6;box-shadow:inset 0 2.5px 4px rgba(120,80,20,.22);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    #plate .well .fd{animation:popIn .4s cubic-bezier(.2,1.5,.4,1) both;}
    @keyframes popIn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
    #echo.munch{animation:munch .5s ease;}
    @keyframes munch{0%{transform:scale(var(--sc,1))}35%{transform:scale(calc(var(--sc,1)*1.12)) rotate(-3deg)}70%{transform:scale(calc(var(--sc,1)*.96))}100%{transform:scale(var(--sc,1))}}
    #heard{position:absolute;top:2px;right:6px;background:#ffd21c;color:#5c4500;font-family:"Baloo 2";font-weight:800;font-size:12.5px;padding:7px 12px;border-radius:99px;opacity:0;transform:scale(.6);transition:all .25s ease;pointer-events:none;box-shadow:0 3px 0 rgba(160,110,0,.35);}
    #heard.show{opacity:1;transform:scale(1);}
    /* cards */
    #grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;flex:1;align-content:center;}
    .cardBtn{border:none;background:#fff;border-radius:22px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 6px 0 rgba(160,80,20,.22);transition:transform .08s;min-height:118px;justify-content:center;}
    .cardBtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(160,80,20,.22);}
    .cardBtn .e{font-size:52px;line-height:1;}
    .cardBtn .e{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,210,28,.2),rgba(255,210,28,.03) 75%);}
    .cardBtn .w{font-family:"Baloo 2";font-weight:800;font-size:15.5px;color:var(--ink);}
    .cardBtn.right{animation:flyIn .55s ease both;}
    @keyframes flyIn{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(.1) translateY(-160px);opacity:0;}}
    .cardBtn.wrong{animation:wob .4s ease;}
    @keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
    #hint{text-align:center;font-weight:800;font-size:13.5px;color:var(--muted);min-height:20px;margin-top:10px;}
    /* end overlay (shared warm-card kit) */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(30,22,50,.55);display:none;align-items:center;justify-content:center;padding:24px;}
    .ovl.show{display:flex;}
    .ovlCard{background:var(--cream);border-radius:28px;padding:24px 20px 22px;width:100%;max-width:330px;text-align:center;box-shadow:0 18px 40px rgba(30,22,50,.45);display:flex;flex-direction:column;align-items:center;gap:9px;}
    .big{font-size:56px;line-height:1;}
    .endStar{animation:starDrop .35s cubic-bezier(.3,1.6,.5,1) both;}
    @keyframes starDrop{0%{transform:translateY(-64px) scale(.4);opacity:0}70%{transform:translateY(6px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:24px;color:var(--ink);line-height:1.18;background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 6px 16px rgba(74,44,20,.12);}
    .ovl p{color:var(--muted);font-weight:800;font-size:14.5px;max-width:270px;}
    .echoWin{position:relative;width:100%;height:116px;overflow:hidden;pointer-events:none;}
    .echoWin img{position:absolute;left:50%;bottom:-40px;width:118px;margin-left:-59px;animation:echoLeap .5s cubic-bezier(.3,1.4,.5,1) both,echoHop 1.5s ease-in-out .6s infinite;}
    @keyframes echoLeap{0%{transform:translateY(110px)}100%{transform:translateY(0)}}
    @keyframes echoHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px) rotate(-5deg)}}
    /* the ukulele concert: Echo strums, notes float — music comes from real
       synthesized string plucks (Karplus-Strong), scheduled in playUke() */
    .uke{position:absolute;left:50%;bottom:6px;margin-left:-6px;font-size:44px;transform-origin:20% 80%;animation:strum .3s ease-in-out infinite alternate;filter:drop-shadow(0 4px 6px rgba(30,22,50,.25));}
    @keyframes strum{0%{transform:rotate(-26deg)}100%{transform:rotate(-14deg)}}
    .note{position:absolute;bottom:18px;font-size:20px;opacity:0;animation:noteUp 1.6s ease-out infinite;pointer-events:none;}
    @keyframes noteUp{0%{opacity:0;transform:translateY(0) scale(.7) rotate(0deg)}20%{opacity:1}100%{opacity:0;transform:translateY(-86px) scale(1.15) rotate(14deg)}}
    @media (prefers-reduced-motion: reduce){ .uke,.note{animation:none;} .note{opacity:.7;} }
    .btn{border:none;border-radius:20px;padding:15px 30px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 6px 0 #ef6f23;cursor:pointer;width:100%;margin-top:4px;}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #46a302;}
    .ghost{background:none;border:none;box-shadow:none;color:var(--muted);font-family:"Baloo 2";font-weight:800;font-size:13.5px;cursor:pointer;padding:8px;}
    #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:800;font-size:13.5px;padding:11px 18px;border-radius:99px;box-shadow:0 8px 24px -8px rgba(120,70,10,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;}
    #toast.show{opacity:1;}
    @media (prefers-reduced-motion: reduce){ .endStar,.echoWin img,#echo.munch,.cardBtn.right,.cardBtn.wrong{animation:none;} }
    @media (max-height:700px){ #echo{width:118px;height:118px;} .cardBtn .e{font-size:44px;} #stage{min-height:150px;} }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" aria-label="Back">✕</button>
      <span class="hudpill" id="ttl">Feed Echo</span>
      <span id="spacer"></span>
      <span class="hudpill" id="starPill" title="Echo heard you"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 16.9 6.1 20.2l1.3-6.6L2.5 9l6.6-.8Z" fill="#ffd21c" stroke="#f0a800" stroke-width="1.2"/></svg> <span id="starN">0</span></span>
    </div>

    <div id="stage">
      <span id="heard">Echo heard you! <svg viewBox="0 0 24 24" style="width:14px;height:14px;vertical-align:-2px"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 16.9 6.1 20.2l1.3-6.6L2.5 9l6.6-.8Z" fill="#f0a800"/></svg></span>
      <div id="bubble"><div id="bMain">Ready?</div><div id="bSub"></div></div>
      <div id="echoSpot">
        <div id="mound"></div>
        <img id="echo" src="/coach/echo/echo-listening.svg" alt="Echo"
             onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
        <div id="plate" data-fed="0/5"><span class="well"></span><span class="well"></span><span class="well"></span><span class="well"></span><span class="well"></span></div>
      </div>
    </div>

    <div id="grid"></div>
  </div>

  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <div class="big endStar"><svg viewBox="0 0 90 44" style="width:84px;height:40px"><ellipse cx="45" cy="22" rx="43" ry="20" fill="#fff"/><ellipse cx="45" cy="24" rx="43" ry="18" fill="none" stroke="#f0e6d6" stroke-width="3"/><circle cx="26" cy="20" r="8" fill="#ff5c5c"/><circle cx="45" cy="18" r="8" fill="#ffb100"/><circle cx="64" cy="20" r="8" fill="#a86ee3"/><circle cx="23" cy="17" r="2" fill="#fff" opacity=".8"/></svg></div>
      <h2 id="endTitle">Yum! You fed Echo!</h2>
      <p id="endSub"></p>
      <div class="echoWin" id="concert">
        <img src="/coach/echo/echo-celebrate.svg" alt="" />
        <span class="uke" aria-hidden><svg viewBox="0 0 64 64" style="width:44px;height:44px"><ellipse cx="24" cy="42" rx="16" ry="14" fill="#e09a5a"/><circle cx="24" cy="42" r="5.5" fill="#7a4a22"/><rect x="34" y="10" width="7" height="26" rx="3" transform="rotate(35 37 23)" fill="#8a5a30"/><rect x="44" y="4" width="9" height="8" rx="2" transform="rotate(35 48 8)" fill="#6f4522"/><path d="M14 36l20 12M13 40l20 12M12 44l19 11" stroke="#fff" stroke-width="1.1" opacity=".85"/><circle cx="17" cy="33" r="2" fill="#fff" opacity=".75"/></svg></span>
        <span class="note" style="left:22%;animation-delay:0s;"><svg viewBox="0 0 64 64" style="width:20px;height:20px"><ellipse cx="24" cy="46" rx="9" ry="7" fill="#ffd21c" transform="rotate(-20 24 46)"/><rect x="30" y="14" width="4.5" height="32" rx="2" fill="#ffd21c"/><path d="M34.5 14c8 2 12 7 10 14-1-4-5-7-10-8Z" fill="#f0a800"/></svg></span>
        <span class="note" style="left:70%;animation-delay:.5s;"><svg viewBox="0 0 64 64" style="width:20px;height:20px"><ellipse cx="24" cy="46" rx="9" ry="7" fill="#fff" transform="rotate(-20 24 46)"/><rect x="30" y="14" width="4.5" height="32" rx="2" fill="#fff"/><path d="M34.5 14c8 2 12 7 10 14-1-4-5-7-10-8Z" fill="#fff" opacity=".85"/></svg></span>
        <span class="note" style="left:44%;animation-delay:1s;"><svg viewBox="0 0 64 64" style="width:18px;height:18px"><ellipse cx="24" cy="46" rx="9" ry="7" fill="#ffd21c" transform="rotate(-20 24 46)"/><rect x="30" y="14" width="4.5" height="32" rx="2" fill="#ffd21c"/><path d="M34.5 14c8 2 12 7 10 14-1-4-5-7-10-8Z" fill="#f0a800"/></svg></span>
      </div>
      <button class="btn" id="again">Play again</button>
      <button class="ghost" id="goHome">Back home</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/sona.js"></script>
  <script>
    // Trial gate (littles' direct door) — page load only, same rules as charge
    if(window.Sona&&Sona.gated&&Sona.gated()){ location.replace("/trial.html"); }
    var S=window.Sona;
    function $(id){ return document.getElementById(id); }
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }
    var profile=(S&&S.getProfile)?S.getProfile():{};

    // ── persistent growth: Echo is visibly bigger every week they show up ──
    // per-child: Echo grows for the child who fed him (KIDS1)
    var FEEDKEY=(window.Sona&&Sona.kkey)?Sona.kkey("sona.feed.v1"):"sona.feed.v1";
    function feedState(){ try{ return JSON.parse(localStorage.getItem(FEEDKEY)||"{}"); }catch(e){ return {}; } }
    function feedSave(s){ try{ localStorage.setItem(FEEDKEY,JSON.stringify(s)); }catch(e){} }
    function echoScale(){ var f=feedState().fed||0; return 1+Math.min(f,80)*0.004; } // lifetime base, caps ~1.32×
    // every bite VISIBLY grows Echo within the round (+7% each) on top of the
    // slow lifetime growth — balloon now, keep a little forever
    var roundBump=0;
    function paintScale(){ var sc=echoScale()*(1+roundBump); var e=$("echo"); e.style.setProperty("--sc",sc); e.style.transform="scale("+sc+")"; }

    // ── words: target from the CURRENT rotation sound (coherent with the
    // plan); distractors from other sounds with different first letters ──
    var SOUND=(S&&S.rotSound)?S.rotSound():"R";
    try{ $("ttl").textContent="Feed Echo · "+((S&&S.soundLabel)?S.soundLabel(SOUND):SOUND)+" sound"; }catch(e){}
    function paintPlate(){ try{
      var wells=$("plate").querySelectorAll(".well");
      $("plate").dataset.fed=fed+"/"+NEED;
    }catch(e){} }
    function landOnPlate(w){ try{
      var wells=$("plate").querySelectorAll(".well");
      var slot=wells[Math.min(fed-1,wells.length-1)];
      if(slot) slot.innerHTML='<span class="fd">'+((S&&S.pic)?S.pic(w.w,w.e,20):w.e)+'</span>';
      $("plate").dataset.fed=fed+"/"+NEED;
    }catch(e){} }
    function pool(sound){ var ws=(S&&S.wordsFor)?(S.wordsFor(sound,"i")||[]):[]; return ws.filter(function(w){ return w&&w.w&&w.e; }).sort(function(a,b){ return a.w.length-b.w.length; }).slice(0,8); }
    var TARGETS=pool(SOUND);
    if(!TARGETS.length){ SOUND="R"; TARGETS=pool("R"); }
    var OTHERS=[];
    try{
      (S.ALL_SOUNDS||[]).forEach(function(s){ if(s===SOUND)return; (S.wordsFor(s,"i")||[]).forEach(function(w){ if(w&&w.w&&w.e&&w.w[0].toLowerCase()!==String(TARGETS[0]&&TARGETS[0].w||" ")[0].toLowerCase()) OTHERS.push(w); }); });
    }catch(e){}

    // ── tiny cached TTS (same on-device cache as charge; repeat asks are free)
    var audioCtx=null,speaking=false,ttsPlaying=false;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    // iOS unlock: the first ask auto-plays at boot (no gesture) — any first
    // tap unlocks the context so speech works from then on
    (function(){ function un(){ try{ var c=getCtx(); if(c.state==="suspended")c.resume(); var b=c.createBuffer(1,1,22050), s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){} }
      document.addEventListener("pointerdown", un, { passive:true, capture:true }); })();
    function ttsDB(){ return new Promise(function(res,rej){ try{ var r=indexedDB.open("sona-tts",1); r.onupgradeneeded=function(){ r.result.createObjectStore("clips"); }; r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)}; }catch(e){rej(e);} }); }
    function ttsGet(k){ return ttsDB().then(function(db){ return new Promise(function(res){ var tx=db.transaction("clips"); var rq=tx.objectStore("clips").get(k); rq.onsuccess=function(){res(rq.result||null)}; rq.onerror=function(){res(null)}; }); }).catch(function(){return null;}); }
    function ttsPut(k,buf){ ttsDB().then(function(db){ try{ db.transaction("clips","readwrite").objectStore("clips").put(buf,k); }catch(e){} }).catch(function(){}); }
    function playPCM(b){ return new Promise(function(res){ var done=false; ttsPlaying=true; function fin(){ if(done)return; done=true; ttsPlaying=false; res(); } try{ var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=c.createBufferSource();s.buffer=ab;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=fin;s.start(); }catch(e){fin();} }); }
    function speakFallback(t){ return new Promise(function(res){ try{
      if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return res();
      var u=new SpeechSynthesisUtterance(t); u.rate=.95; u.pitch=1.05; u.volume=(profile.volume!=null?profile.volume:0.8);
      var done=false; function fin(){ if(done)return; done=true; ttsPlaying=false; res(); }
      u.onend=fin; u.onerror=fin; setTimeout(fin,9000); ttsPlaying=true; window.speechSynthesis.speak(u);
    }catch(e){ ttsPlaying=false; res(); } }); }
    function say(t){ return new Promise(function(res){ if(!t||profile.voiceOn===false||speaking)return res(); speaking=true;
      var key=(profile.voiceId||"echo")+"|v6|"+t;
      ttsGet(key).then(function(cached){
        if(cached) return playPCM(new Uint8Array(cached)).then(function(){return true;});
        return fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||"",stable:true})})
          .then(function(r){return r.ok?r.arrayBuffer():null;})
          .then(function(b){ if(!b)return false; ttsPut(key,b); return playPCM(new Uint8Array(b)).then(function(){return true;}); });
      }).then(function(played){ if(!played) return speakFallback(t); })
      .catch(function(){ return speakFallback(t); })
      .finally(function(){ speaking=false; res(); });
    }); }

    // ── OPTIONAL mic cheer: loudness only, only if already granted elsewhere.
    // Never prompts, never records, never logs — a voice burst while a card is
    // up = "Echo heard you! ⭐". Echo's own voice never counts (tts guard). ──
    var heardThisTurn=false, stars=0, micOn=false;
    // Test seam: a headless browser has no microphone, so there is no way to
    // exercise "a round WITH voicing" without one. Only ever ADDS a heard turn,
    // and only when the page was opened with ?heard=N — it can't be reached
    // from the app, and it cannot suppress the silence rule.
    try{ var _hq=parseInt(new URLSearchParams(location.search).get("heard"),10); if(_hq>0){ stars=_hq; window.__heard=stars; } }catch(e){}
    (function(){
      try{
        if(localStorage.getItem("sona.micok")!=="1") return;
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return;
        navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(stream){
          micOn=true;
          var ctx=getCtx(),src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();
          an.fftSize=512; src.connect(an);
          var td=new Uint8Array(an.fftSize),voiced=0,thr=0,calN=0,calSum=0,t0=performance.now();
          (function tick(){
            if(!micOn)return;
            if(speaking||ttsPlaying){ voiced=0; requestAnimationFrame(tick); return; }
            an.getByteTimeDomainData(td);
            var sum=0; for(var i=0;i<td.length;i++){ var d=(td[i]-128)/128; sum+=d*d; }
            var rms=Math.sqrt(sum/td.length),now=performance.now();
            if(now-t0<250){ calSum+=rms; calN++; requestAnimationFrame(tick); return; }
            if(!thr) thr=Math.max(0.035,(calSum/Math.max(1,calN))*3.0);
            if(rms>thr){ voiced++; if(voiced>=4&&!heardThisTurn&&turnLive){ heardThisTurn=true; stars++; try{ window.__heard=stars; }catch(e){} try{ $("starN").textContent=stars; }catch(e){} $("heard").classList.add("show"); setTimeout(function(){ $("heard").classList.remove("show"); },1400); sfx("tap"); } }
            else voiced=0;
            requestAnimationFrame(tick);
          })();
          // lock/app-switch fires visibilitychange, NOT pagehide — this mic
          // stayed open in your pocket with the recording indicator lit
          var _rel=function(){ micOn=false; try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} };
          if(window.Sona&&Sona.onBackground) Sona.onBackground(_rel); else window.addEventListener("pagehide",_rel);
        }).catch(function(){ /* denied elsewhere — tap-only play, no blocker here */ });
      }catch(e){}
    })();

    // ── the round: 5 feeds, no timer, no fail ──
    var NEED=5, fed=0, turnLive=false, target=null, usedIdx=[];
    function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0,t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
    function nextTurn(){
      heardThisTurn=false;
      var ti; do{ ti=(Math.random()*TARGETS.length)|0; }while(TARGETS.length>1&&usedIdx.indexOf(ti)>=0&&usedIdx.length<TARGETS.length);
      usedIdx.push(ti); if(usedIdx.length>=TARGETS.length)usedIdx=[];
      target=TARGETS[ti];
      var opts=[target].concat(shuffle(OTHERS.slice()).slice(0,3));
      if(opts.length<2){ opts=[target].concat(TARGETS.filter(function(w){return w.w!==target.w;}).slice(0,3)); }
      shuffle(opts);
      $("bMain").innerHTML="Where's the <b>"+target.w+"</b>?";
      $("bSub").textContent="Say it out loud, then tap it!";
      var g=$("grid"); g.innerHTML="";
      opts.forEach(function(w){
        var b=document.createElement("button"); b.className="cardBtn"; b.type="button";
        b.innerHTML='<span class="e">'+((S&&S.pic)?S.pic(w.w,w.e,54):w.e)+'</span><span class="w">'+w.w+"</span>";
        b.onclick=function(){ pick(w,b); };
        g.appendChild(b);
      });
      turnLive=true;
      say("Where is the "+target.w+"? Say... "+target.w+"!");
    }
    function pick(w,btn){
      if(!turnLive)return;
      if(w.w!==target.w){
        btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
        $("bSub").textContent="Almost! Where's the "+target.w+"?";
        sfx("tap");
        return; // no fail state, no strikes — littles just try again
      }
      turnLive=false; fed++;
      roundBump=fed*0.07;
      var f=feedState(); f.fed=(f.fed||0)+1; feedSave(f);
      btn.classList.add("right"); sfx("correct");
      var e=$("echo"); e.classList.remove("munch"); void e.offsetWidth; e.classList.add("munch");
      paintScale();
      landOnPlate(w);
      $("bMain").innerHTML=(fed>=NEED)?"YUM! All full!":["Yum!","Nice one!","So tasty!","Great!"][fed%4];
      $("bSub").textContent="";
      if((feedState().fed||0)%10===0){ toast("Echo grew bigger!"); }
      // Nothing is spoken on a correct tap. Every third one used to say
      // "Mmm! <word>! More please!" — it talked over the child right as they
      // were about to go again, and the next turn's prompt speaks the word
      // anyway. The munch, the plate and the bubble already say "yes".
      if(fed>=NEED){ setTimeout(finish,900); } else { setTimeout(nextTurn,900); }
    }
    function toast(t){ var el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.remove("show"); },1800); }

    // ── Echo's ukulele: real plucked strings (Karplus-Strong), no assets.
    // A celebration jingle, not background music: one pass (~4s), volume from
    // the profile, silent when sounds are off, stopped when the overlay closes.
    var ukeNodes=[];
    function pluck(ctx,dest,freq,when,vel){
      var sr=ctx.sampleRate, N=Math.round(sr/freq), len=Math.round(sr*0.9);
      var buf=ctx.createBuffer(1,len,sr), ch=buf.getChannelData(0);
      for(var i=0;i<N;i++) ch[i]=Math.random()*2-1;           // the pluck burst
      for(var n=N;n<len;n++) ch[n]=0.996*0.5*(ch[n-N]+ch[n-N+1]); // string decay
      var s=ctx.createBufferSource(); s.buffer=buf;
      var g=ctx.createGain(); g.gain.setValueAtTime(vel,when); g.gain.exponentialRampToValueAtTime(0.001,when+0.85);
      s.connect(g); g.connect(dest); s.start(when); ukeNodes.push(s);
    }
    function playUke(){
      try{
        if(profile.soundOn===false) return;
        var ctx=getCtx(), t=ctx.currentTime+0.15;
        var master=ctx.createGain(); master.gain.value=Math.min(0.5,(profile.volume!=null?profile.volume:0.8)*0.55); master.connect(ctx.destination);
        // ukulele voicings (G4-C4-E4-A4 strings): C, F, G7, C — the campfire cadence
        var CH={ C:[392,261.6,329.6,523.3], F:[349.2,261.6,349.2,440], G:[392,293.7,392,493.9] };
        var pat=[CH.C,CH.C,CH.F,CH.F,CH.G,CH.G,CH.C];
        pat.forEach(function(chord,i){
          var when=t+i*0.42, up=(i%2===1);
          chord=up?chord.slice().reverse():chord;              // down-up strum feel
          chord.forEach(function(fq,k){ pluck(ctx,master,fq,when+k*0.022,up?0.5:0.7); });
        });
        // the last chord rings with a little flourish arpeggio
        [523.3,659.3,784].forEach(function(fq,k){ pluck(ctx,master,fq,t+7*0.42+0.25+k*0.09,0.55); });
        window.__ukePlayed=true;
      }catch(e){}
    }
    function stopUke(){ try{ ukeNodes.forEach(function(n){ try{n.stop();}catch(e){} }); ukeNodes=[]; }catch(e){} }

    function finish(){
      // a finished round advances the rotation + ring (real taps + real words —
      // never idle time), exactly like a charge free-play round. Nothing from
      // the mic is logged anywhere.
      // SILENCE IS NEVER A REP. `stars` is the count of turns where the mic
      // actually heard the child; tapping the right picture five times without
      // speaking used to advance the rotation and the daily ring all the same,
      // which teaches a four-year-old that pointing is the game. The round
      // still ENDS warmly either way — a child is never scolded for a quiet
      // day — it just doesn't count as practice.
      var ringDone=false, counted=(stars>0);
      if(counted){
        try{
          var pre=S.todayRing&&S.todayRing().done;
          if(S.rotAdvance)S.rotAdvance();
          ringDone=!pre&&S.todayRing&&S.todayRing().done;
        }catch(e){}
      }
      var stk=null; if(counted){ try{ stk=(S&&S.awardNextSticker)?S.awardNextSticker():null; }catch(e){} }
      try{ if(S&&S.confetti)S.confetti({count:140}); }catch(e){}
      $("endTitle").textContent=ringDone?"All of today's practice — done!":(counted?"Yum! Echo's full — concert time!":"Echo's full — but he didn't hear you!");
      $("endSub").textContent=counted
        ? ((stk?("You won the "+stk.name+" sticker! "):"")+"Echo heard you "+stars+" time"+(stars===1?"":"s")+"! "+(ringDone?"Come back tomorrow — Echo will have a new adventure ready!":"Echo's growing bigger every day you play!"))
        : "Say the word out loud next time and Echo will hear you — that's how he grows!";
      $("endOvl").classList.add("show");
      sfx("complete");
      // the payoff: Echo's ukulele concert. On a goal-done day the tomorrow
      // line speaks first, then the strumming; otherwise music leads.
      if(ringDone){ say("You did all of today's practice! Come back tomorrow — I'll have a new adventure ready!").then(playUke); }
      else { playUke(); }
    }

    $("again").onclick=function(){ stopUke(); fed=0; stars=0; roundBump=0; paintScale();
      try{ $("plate").querySelectorAll(".well").forEach(function(w){ w.innerHTML=""; }); $("plate").dataset.fed="0/5"; $("starN").textContent="0"; }catch(e){}
      $("endOvl").classList.remove("show"); sfx("tap"); nextTurn(); };
    $("goHome").onclick=function(){ stopUke(); location.href="/today.html"; };
    $("close").onclick=function(){ stopUke(); location.href="/today.html"; };

    paintScale();
    nextTurn();
  </script>
</body>
</html>
