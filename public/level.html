<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Level</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --green:#58cc02; --green-d:#46a302; --ink:#16384f; --muted:#6b86a3; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;}
    body{background:#0b1437;display:flex;justify-content:center;}
    #app{position:relative;width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#dff4ff 0%,#eafaf0 45%,#d6f0c4 100%);display:flex;flex-direction:column;overflow:hidden;}

    /* header */
    header{position:relative;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 56px 8px;}
    #back{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top));width:40px;height:40px;border:none;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(20,90,150,.18);color:#3a6b86;font-size:24px;font-weight:800;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
    .htitle{text-align:center;}
    .htitle b{display:block;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--ink);}
    .htitle span{display:block;font-family:"Baloo 2";font-weight:700;font-size:12.5px;color:var(--muted);}

    /* path */
    #path{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 24px 14px;overflow-y:auto;}
    #path:before{content:"";position:absolute;left:50%;top:42px;bottom:42px;width:0;border-left:4px dashed #bfe0c6;transform:translateX(-50%);z-index:0;}
    .rung{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
    .knob{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid var(--c,#1cb0f6);display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;
      box-shadow:0 6px 0 rgba(20,90,150,.16),0 10px 16px rgba(20,90,150,.18);position:relative;}
    .lbl{font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--ink);text-align:center;}
    .sub{font-family:"Nunito";font-weight:700;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
    /* states */
    .rung.done .knob{background:var(--c);color:#fff;}
    .rung.done .knob .ic{display:none;}
    .rung.done .knob:after{content:"✓";color:#fff;font-family:"Baloo 2";font-weight:800;font-size:36px;}
    .rung.up .knob{opacity:.55;filter:saturate(.7);}
    .rung.up .lbl,.rung.up .sub{opacity:.6;}
    .rung.cur .knob{cursor:pointer;animation:bob 1.6s ease-in-out infinite;box-shadow:0 6px 0 rgba(20,90,150,.16),0 0 0 6px rgba(88,204,2,.20);}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .pill{font-family:"Baloo 2";font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--green);box-shadow:0 3px 0 var(--green-d);border-radius:99px;padding:5px 13px;}
    /* prize */
    .rung.prize .knob{width:88px;height:88px;border-color:#ffcf33;background:radial-gradient(circle at 50% 32%,#fff3c4,#ffd34d 72%);font-size:46px;box-shadow:0 6px 0 rgba(160,120,0,.25),0 0 26px rgba(255,200,40,.55);}
    .rung.prize.locked .knob{filter:grayscale(.55);opacity:.72;box-shadow:0 6px 0 rgba(120,120,120,.2);}
    .rung.prize .lbl{font-size:15px;}

    /* CTA */
    #cta{padding:10px 24px calc(16px + env(safe-area-inset-bottom));}
    #go{width:100%;border:none;border-radius:18px;padding:16px;font-family:"Baloo 2";font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 6px 0 0 var(--green-d);cursor:pointer;}
    #go:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--green-d);}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <button id="back" title="Back">‹</button>
      <div class="htitle"><b id="htitle">Level</b><span id="hsub"></span></div>
    </header>
    <div id="cue" style="display:none;margin:2px 16px 0;background:#fff;border-radius:14px;padding:11px 13px;box-shadow:0 4px 12px rgba(20,90,150,.12);"></div>
    <div id="path"></div>
    <div id="cta"><button id="go">▶&nbsp; Start</button></div>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var qp=new URLSearchParams(location.search);
    var level=parseInt(qp.get("level"),10); if(!level||level<1) level=1;
    var TOWN = level<=4 ? "Starter Town" : level<=7 ? "The Academy Grounds" : "Champion's Arena";

    // Use the live session if it's for THIS level (so the path fills in as games finish);
    // otherwise show a fresh plan. doneCount = steps completed; allDone = ready for the prize.
    var sess=(window.Sona&&Sona.session)?Sona.session.get():null;
    var mine=!!(sess && sess.level===level && sess.queue && sess.queue.length);
    var games = mine ? sess.queue.slice() : ((window.Sona&&Sona.levelGames)?Sona.levelGames(level):["rocket.html","bubble.html","racer.html"]);
    var doneCount = mine ? Math.min(sess.idx||0, games.length) : 0;
    var allDone = doneCount>=games.length;
    var started = doneCount>0;
    var prizeCoins = 25 + level*5;
    function meta(file){ return (window.Sona&&Sona.gameMeta)?Sona.gameMeta(file):{name:"Game",icon:"🎮",band:"",c:"#1cb0f6"}; }

    $("htitle").textContent="Level "+level;
    $("hsub").textContent=TOWN+" · "+games.length+" games";
    (function(){ var SND=((window.Sona&&Sona.getProfile&&Sona.getProfile().focusSounds)||[])[0]||"R"; var c=(window.Sona&&Sona.cue)?Sona.cue(SND):null; if(c){ var cu=$("cue"); cu.style.display="block"; cu.innerHTML='<div style="font-family:\'Baloo 2\';font-weight:800;font-size:13.5px;color:#16384f;">'+c.mouth+'&nbsp; How to make the '+((window.Sona&&Sona.soundLabel)?Sona.soundLabel(SND):SND)+' sound</div><div style="font-weight:700;font-size:12.5px;color:#6b86a3;margin-top:3px;line-height:1.4;">'+c.tip+'</div>'; } })();
    $("back").onclick=function(){ if(window.Sona&&Sona.sfx&&Sona.sfx.tap)Sona.sfx.tap(); location.href="/map.html"; };

    function go(){
      if(window.Sona&&Sona.sfx&&Sona.sfx.correct)Sona.sfx.correct();
      if(allDone){ location.href="/levelcomplete.html"; return; }   // claim the prize
      if(window.Sona&&Sona.session){
        var snd=((window.Sona.getProfile&&Sona.getProfile().focusSounds)||[])[0]||"R";
        if(!mine) Sona.session.start(level, snd, games, level);     // fresh start
        location.href=Sona.session.url();                          // current step's game
      } else {
        location.href="/"+String(games[doneCount]||games[0]).replace(/^\//,"")+"?sound=R";
      }
    }

    // build the path top→bottom: PRIZE on top, then steps last→first (step 1 sits at the bottom)
    var path=$("path");
    var pr=document.createElement("div"); pr.className="rung prize"+(allDone?"":" locked");
    pr.innerHTML='<div class="knob">'+(allDone?"🎉":"🎁")+'</div><div class="lbl">Level prize</div><div class="sub">+'+prizeCoins+' 🪙</div>';
    if(allDone){ pr.style.cursor="pointer"; pr.onclick=go; }
    path.appendChild(pr);

    var WAVE=[0,-44,44,-30,30];
    for(var i=games.length-1;i>=0;i--){
      var m=meta(games[i]);
      var state = i<doneCount ? "done" : (i===doneCount ? "cur" : "up");
      var r=document.createElement("div"); r.className="rung "+state; r.style.transform="translateX("+WAVE[i%WAVE.length]+"px)";
      var pill = state==="cur" ? '<div class="pill">'+(started?"Continue":"Start here")+'</div>' : '';
      r.innerHTML=pill+'<div class="knob" style="--c:'+m.c+';"><span class="ic">'+m.icon+'</span></div>'+
                  '<div class="lbl">'+m.name+'</div><div class="sub">'+(m.band||("Step "+(i+1)))+'</div>';
      if(state==="cur") r.onclick=go;
      path.appendChild(r);
    }

    $("go").innerHTML = allDone ? "🎁&nbsp; Claim prize" : (started ? "Continue&nbsp; →" : "▶&nbsp; Start");
    $("go").onclick=go;
  </script>
</body>
</html>
