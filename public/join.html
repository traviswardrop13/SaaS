<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- STRIP THE KEY FIRST, before anything network/analytics touches the URL.
       The family key rides in ?k=; this page loads none of the ad/analytics scripts,
       and we replaceState to a clean URL immediately so the key never lands in
       a captured pageview URL (the whole reason share links point here and not
       at the Next landing page, which does load analytics). The invite token
       (?inv=, present when the clinician set this child up ahead of time)
       rides the same strip for the same reason. -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        window.__slp = { code: q.get("slp") || "", key: q.get("k") || "", inv: q.get("inv") || "" };
        history.replaceState({}, "", "/join.html");
      } catch (e) { window.__slp = { code: "", key: "", inv: "" }; }
    })();
  </script>
  <title>Sona — free access from your speech therapist</title>
  <!-- the SLP side is hidden (19 Sep 2026): reachable by direct link, not by search -->
  <meta name="robots" content="noindex">
  <link href="/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/sona.css" />
  <meta name="theme-color" content="#fff6e9" />
  <style>
    body{background:var(--cream,#fff6e9);color:var(--ink,#4a2c14);}
    .jwrap{max-width:420px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 22px 40px;text-align:center;}
    .jhero img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(140,60,0,.22));}
    .jhero h1{font-family:"Baloo 2";font-weight:800;font-size:26px;margin-top:10px;}
    .jmsg{font-weight:700;color:var(--muted,#8a6f52);margin-top:8px;font-size:15px;line-height:1.5;}
    .jcard{background:#fff;border-radius:20px;box-shadow:0 5px 0 #f0e2cc;padding:18px 16px;margin-top:20px;text-align:left;}
    .jcard label{display:block;font-family:"Baloo 2";font-weight:800;font-size:12px;color:var(--label,#a17c4a);margin:10px 0 4px;}
    .jcard input{width:100%;border:2px solid #f0e4d2;border-radius:14px;padding:12px 14px;font-family:"Baloo 2";font-weight:800;font-size:16px;color:var(--ink,#4a2c14);}
    #jCode{text-transform:lowercase;} #jKey{text-transform:uppercase;letter-spacing:1px;}
    .jbtn{border:none;border-radius:16px;padding:15px;width:100%;margin-top:14px;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#fff;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 5px 0 #ef6f23;cursor:pointer;}
    .jbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #ef6f23;}
    #jStatus{font-weight:800;font-size:13.5px;margin-top:12px;min-height:18px;}
  </style>
</head>
<body>
  <div class="jwrap">
    <div class="jhero">
      <img src="/coach/echo/echo-celebrate.svg" alt="Echo" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
      <h1 id="jTitle">Unlocking your free access…</h1>
    </div>
    <p class="jmsg" id="jMsg">Your speech therapist gave you free access to Sona. One moment…</p>

    <!-- manual fallback: shown only if the link's credential didn't verify -->
    <div class="jcard" id="jForm" style="display:none;">
      <label for="jCode">Code from your SLP</label>
      <input id="jCode" type="text" autocomplete="off" placeholder="e.g. rachel-k4" />
      <label for="jKey">Family key</label>
      <input id="jKey" type="text" autocomplete="off" placeholder="e.g. ABCD2345" />
      <button class="jbtn" id="jGo">Unlock free access</button>
      <div id="jStatus" class="muted"></div>
    </div>
    <!-- consent, asked AFTER the unlock is already granted: sharing is a
         separate decision from access, and saying no costs the family nothing -->
    <div class="jcard" id="jConsent" style="display:none;">
      <div style="font-family:'Baloo 2';font-weight:800;font-size:17px;" id="jConsentTitle">Share progress with your therapist?</div>
      <!-- The whole of what is shared, in one paragraph, with the clinician
           named: what they see, what they can send, what never leaves, and
           that stopping deletes rather than hides. Filled in by askConsent()
           so the clinician's name or clinic can be spoken. -->
      <p class="muted" style="font-weight:700;font-size:13px;line-height:1.55;margin-top:8px;" id="jConsentBody"></p>
      <button class="jbtn" id="jYes">Yes, share progress</button>
      <button class="jbtn" id="jNo" style="background:#fff;color:var(--muted,#8a6f52);box-shadow:0 5px 0 #f0e4d2;margin-top:10px;">No thanks — just use Sona</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script>
    (function () {
      var title = document.getElementById("jTitle"), msg = document.getElementById("jMsg"),
          form = document.getElementById("jForm"), status = document.getElementById("jStatus"),
          consent = document.getElementById("jConsent");
      function go() {
        var p = {}; try { p = Sona.getProfile() || {}; } catch (e) {}
        location.href = (p.onboarded || p.childName) ? "/today.html" : "/onboarding.html";
      }
      // The clinician may have set a first sound to practise ahead of time,
      // behind an invite token in the link. Claiming it ties THIS device to
      // that invite, so the target becomes the child's first assignment and
      // the dashboard knows this child came in through it. The name and age
      // the clinician's dashboard shows are what the grown-up types here, on
      // this device — the invite carries only a label, discarded on claim. It
      // runs ONLY behind Yes: a family that declined sharing has not agreed
      // to be on the roster at all. Fire-and-forget — the unlock and the
      // enrolment never wait on it, and the request carries the credential
      // and the device's own opaque child id, nothing typed here.
      function claimInvite(code) {
        var inv = ""; try { inv = (window.__slp && window.__slp.inv) || ""; } catch (e) {}
        if (!inv) return;
        var ticket = "", childId = "";
        try { ticket = localStorage.getItem("sona.slpticket") || ""; } catch (e) {}
        try { childId = (Sona.pilotInfo() || {}).childId || ""; } catch (e) {}
        if (!ticket || !childId) return;
        try {
          fetch("/api/slp/claim", {
            method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
            body: JSON.stringify({ code: code, ticket: ticket, childId: childId, inv: inv }),
          }).then(function (r) { return r.json(); }).then(function (j) {
            // the clinician's target is written server-side; pull it now if
            // we are still here, so today's words are theirs from the first open
            if (j && j.ok && Sona.syncHomework) Sona.syncHomework(true);
          }).catch(function () {});
        } catch (e) {}
      }
      // The credential verified: free access is ALREADY granted (slpRedeem set
      // the device unlock). Sharing is the separate question — enrolling is
      // what actually puts this child on the clinician's dashboard, because
      // sendProgress() no-ops without consent. Saying no keeps the free app.
      function askConsent(code, name) {
        title.textContent = "You're in — it's free! 🎉";
        msg.textContent = name ? ("Free access via " + name + ".") : "Free access unlocked.";
        form.style.display = "none";
        consent.style.display = "block";
        document.getElementById("jConsentBody").textContent =
          "If you say yes, " + (name || "your child's speech therapist") + " will see your child's first name and age as you entered them, " +
          "which sounds they are practising, practice days and how many tries each day, and a rough pass rate per sound. " +
          "They can also send practice assignments and a short note to this app. Never any audio; recordings stay on this device. " +
          "You can stop any time, and stopping deletes everything they could see. Saying no changes nothing; Sona stays free for you.";
        try { if (Sona.confetti) Sona.confetti({ count: 150 }); } catch (e) {}
        document.getElementById("jYes").onclick = function () {
          try { Sona.slpJoinCaseload(code); } catch (e) {}
          claimInvite(code);
          consent.style.display = "none";
          title.textContent = "All set! 🎉";
          msg.textContent = "Your therapist will see practice progress. Let's meet Echo.";
          setTimeout(go, 1100);
        };
        document.getElementById("jNo").onclick = function () {
          // declining shares nothing — and costs nothing; the unlock stands
          try { Sona.saveProfile({ slpShare: false }); } catch (e) {}
          consent.style.display = "none";
          title.textContent = "No problem!";
          msg.textContent = "Nothing will be shared, and Sona is still free for you. Let's meet Echo.";
          setTimeout(go, 1100);
        };
      }
      function attempt(code, key, fromForm) {
        if (!code || !key) { showForm(); return; }
        if (fromForm) { status.style.color = "var(--muted)"; status.textContent = "Checking…"; }
        Sona.slpRedeem(code, key).then(function (r) {
          if (r.valid) {
            // grant first, ask second — the unlock must not depend on the answer
            try {
              Sona.saveProfile({ earlyAdopter: true, slpCode: String(code).toUpperCase() });
              localStorage.setItem("sona.slp", String(code).toUpperCase());
            } catch (e) {}
            askConsent(String(code).toUpperCase(), r.name);
          } else {
            showForm();
            status.style.color = "#b42323";
            status.textContent = r.error === "offline" ? "Couldn't reach the server — try again." : "That code and key don't match — check with your therapist.";
          }
        });
      }
      function showForm() {
        title.textContent = "Enter your SLP's code";
        msg.textContent = "Type the code and family key your speech therapist gave you — Sona is free for their families.";
        form.style.display = "block";
        try { if (window.__slp && window.__slp.code) document.getElementById("jCode").value = window.__slp.code; } catch (e) {}
      }
      document.getElementById("jGo").onclick = function () {
        attempt((document.getElementById("jCode").value || "").trim(), (document.getElementById("jKey").value || "").trim(), true);
      };
      var s = window.__slp || {};
      if (s.code && s.key) attempt(s.code, s.key, false); else showForm();
    })();
  </script>
</body>
</html>
