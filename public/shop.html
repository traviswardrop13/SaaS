<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Shop</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --ink:#3c3c3c; --muted:#777; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    body{background:linear-gradient(180deg,#eaf6ff,#eafbff);color:var(--ink);min-height:100vh;min-height:100dvh;}
    #wrap{max-width:560px;margin:0 auto;padding-bottom:96px;}
    #hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,rgba(234,246,255,.96),rgba(234,246,255,.7));backdrop-filter:blur(6px);}
    #back{border:none;background:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(20,120,200,.12);color:var(--blue-d);}
    .coins{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:8px 16px;font-family:"Baloo 2";font-weight:800;font-size:17px;color:var(--orange-d);box-shadow:0 3px 10px rgba(20,120,200,.12);}
    #leoPrev{display:flex;flex-direction:column;align-items:center;margin:6px 0 2px;}
    #leoPrev .stage{position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center;border-radius:26px;}
    #leoPrev img{width:110px;height:110px;object-fit:contain;}
    #leoPrev .ot{position:absolute;top:2px;font-size:34px;}
    #leoPrev .nm{font-family:"Baloo 2";font-weight:800;color:var(--blue-d);margin-top:4px;}
    h2{font-family:"Baloo 2";font-weight:800;font-size:18px;margin:18px 16px 2px;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 16px 0;}
    .item{background:#fff;border:2px solid #e8eef4;border-bottom-width:4px;border-radius:18px;padding:12px 6px 10px;text-align:center;cursor:pointer;transition:transform .05s;}
    .item:active{transform:translateY(2px);}
    .item .ic{font-size:36px;line-height:1;height:42px;display:flex;align-items:center;justify-content:center;}
    .item .nm{font-family:"Baloo 2";font-weight:800;font-size:13px;margin-top:4px;}
    .item .price{font-weight:800;font-size:13px;color:var(--orange-d);margin-top:3px;}
    .item.owned{border-color:#bdebca;} .item.equipped{border-color:var(--blue);background:#eaf7ff;}
    .item .tag{font-weight:800;font-size:12px;border-radius:99px;padding:2px 8px;margin-top:3px;display:inline-block;}
    .item.equipped .tag{background:var(--blue);color:#fff;} .item.owned .tag{background:#d7ffe2;color:var(--green-d);}
    .item.cant{opacity:.55;}
    #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#3c3c3c;color:#fff;font-weight:800;font-size:13px;border-radius:14px;padding:10px 16px;opacity:0;transition:opacity .2s;z-index:40;}
    #toast.show{opacity:1;}
    #nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:560px;margin:0 auto;display:flex;background:#fff;border-top:1px solid #e8eef4;padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
    #nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-weight:800;font-size:11px;} #nav a.on{color:var(--blue-d);} #nav a .ic{font-size:22px;}

    /* ═══════════════════════════════════════════════════════════════════
       LEO'S SHOP — visual polish (additive · CSS-only)
       Animates transform/opacity only (box-shadow used sparingly). No
       HTML/JS changes — decoration via ::before/::after + backgrounds only.
       NOTE: this page does not link sona.css, so the shared keyframes it
       reuses (sona-shimmer / sona-glow-warm / sona-twinkle) are mirrored
       locally below verbatim, keeping one visual language without an
       external dependency.
       ═══════════════════════════════════════════════════════════════════ */
    @keyframes sona-shimmer{0%{transform:translateX(-120%) rotate(8deg)}100%{transform:translateX(240%) rotate(8deg)}}
    @keyframes sona-glow-warm{0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,0)}50%{box-shadow:0 0 0 10px rgba(255,138,61,.18)}}
    @keyframes sona-twinkle{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
    /* Respect reduced-motion (mirrors sona.css; this page loads standalone). */
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    }

    /* ── Coin display: a soft idle gleam + gentle bob on the pill, and a
       tasteful coin-style tilt on hover. The 🪙 glyph is the focal point so
       the pill carries the motion (the glyph itself is an inline text node
       the JS owns, so a true sona-coinflip on just the coin would need JS). */
    .coins{position:relative;overflow:hidden;transition:transform .2s ease;
      background:linear-gradient(180deg,#fffdf7,#fff);
      animation:shop-coinbob 3.2s ease-in-out infinite;will-change:transform;}
    .coins::before{content:"";position:absolute;top:-60%;left:-30%;width:42%;height:220%;
      pointer-events:none;transform:rotate(8deg) translateX(-60%);
      background:linear-gradient(100deg,transparent,rgba(255,214,128,.55),transparent);
      animation:shop-coinsheen 4.6s ease-in-out infinite;will-change:transform;}
    .coins:hover{transform:translateY(-1px) scale(1.03);}
    @keyframes shop-coinbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes shop-coinsheen{0%,72%{transform:rotate(8deg) translateX(-220%)}
      100%{transform:rotate(8deg) translateX(520%)}}

    /* ── Leo preview: a circular pedestal + radial glow stage with a soft
       sparkle. .stage gets its backdrop background inline from JS, so the
       glow halo sits BEHIND it (::before, z-index:-1) and the sparkle sits
       on TOP (::after). The pedestal is drawn under the stage on #leoPrev. */
    #leoPrev{position:relative;padding-top:6px;}
    #leoPrev::before{content:"";position:absolute;left:50%;top:142px;
      width:148px;height:34px;transform:translateX(-50%);pointer-events:none;z-index:0;
      background:radial-gradient(closest-side,rgba(28,176,246,.30),rgba(28,176,246,.10) 60%,transparent 72%);
      border-radius:50%;}
    #leoPrev .stage{z-index:1;box-shadow:0 14px 26px rgba(20,120,200,.18);
      animation:shop-stagefloat 4.2s ease-in-out infinite;will-change:transform;}
    /* radial glow halo blooming out from behind the stage */
    #leoPrev .stage::before{content:"";position:absolute;inset:-34%;z-index:-1;
      pointer-events:none;border-radius:50%;
      background:radial-gradient(closest-side,rgba(255,150,0,.22),rgba(28,176,246,.16) 55%,transparent 76%);
      animation:shop-glowpulse 3.6s ease-in-out infinite;will-change:transform,opacity;}
    /* layered sparkles riding on top of the stage face */
    #leoPrev .stage::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
      background-image:
        radial-gradient(circle at 22% 26%, #fff 0 1.6px, transparent 2.4px),
        radial-gradient(circle at 80% 34%, #fff 0 2px, transparent 2.8px),
        radial-gradient(circle at 68% 78%, #fff 0 1.4px, transparent 2.2px),
        radial-gradient(circle at 34% 82%, #fff 0 1.2px, transparent 2px);
      animation:sona-twinkle 2.6s ease-in-out infinite;will-change:transform,opacity;}
    #leoPrev .ot{z-index:3;}
    #leoPrev img{position:relative;z-index:3;}
    @keyframes shop-stagefloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes shop-glowpulse{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}

    /* ── Item cards: depth + a shimmer/shine sweep on hover (reuses the
       sona-shimmer keyframe from sona.css). Host gets position+overflow so
       the diagonal sheen is clipped to the rounded card. */
    .item{position:relative;overflow:hidden;
      transition:transform .12s ease,box-shadow .18s ease;
      box-shadow:0 4px 12px rgba(20,120,200,.06);}
    .item .ic,.item .nm,.item .price,.item .tag{position:relative;z-index:1;}
    .item::before{content:"";position:absolute;top:-40%;left:0;width:55%;height:180%;
      pointer-events:none;z-index:2;
      background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
      transform:translateX(-130%) rotate(8deg);}
    @media (hover:hover){
      .item:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,120,200,.14);}
      .item:hover::before{animation:sona-shimmer 1.1s ease;}
    }
    /* tactile press preserved (already in base .item:active) */
    .item.cant{cursor:default;}
    .item.cant:hover{transform:none;box-shadow:0 4px 12px rgba(20,120,200,.06);}

    /* ── Owned & equipped badge base: a small circular corner badge
       overlay (::after), inset so the card's overflow:hidden never clips
       it. (JS marks an item equipped OR owned, never both.) */
    .item.owned::after,.item.equipped::after{position:absolute;top:6px;right:6px;z-index:3;
      width:20px;height:20px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:800;color:#fff;line-height:1;
      animation:shop-pop .35s cubic-bezier(.2,1.3,.4,1) both;}
    @keyframes shop-pop{0%{transform:scale(0)}100%{transform:scale(1)}}
    /* owned: green checkmark badge */
    .item.owned::after{content:"✓";
      background:linear-gradient(160deg,var(--green),var(--green-d));
      box-shadow:0 2px 5px rgba(70,163,2,.45);}

    /* ── Equipped item: a gentle warm pulse-glow (reuses sona-glow-warm
       from sona.css) instead of a flat blue border. */
    .item.equipped{border-color:#bcd9f2;background:#f3faff;
      animation:sona-glow-warm 2.2s ease-in-out infinite;will-change:box-shadow;}
    /* equipped: blue star badge to match its "wearing" state */
    .item.equipped::after{content:"★";
      background:linear-gradient(160deg,var(--blue),var(--blue-d));
      box-shadow:0 2px 5px rgba(21,151,212,.45);}

    /* ── Category headers: gradient divider rule + a small ornament dot,
       turning plain text rows into decorated section dividers. */
    h2{display:flex;align-items:center;gap:10px;}
    h2::after{content:"";flex:1;height:3px;border-radius:99px;
      background:linear-gradient(90deg,rgba(28,176,246,.35),rgba(255,150,0,.22),transparent);}
    h2::before{content:"";flex:0 0 auto;width:7px;height:7px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#ffd98a,var(--orange));
      box-shadow:0 0 0 3px rgba(255,150,0,.16);}
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud"><button id="back" onclick="location.href='/play.html'">←</button><span class="coins">🪙 <span id="coins">0</span></span></div>
    <div id="leoPrev"><div class="stage" id="stage"><span class="ot" id="prevOutfit"></span><img src="/coach/echo/echo-idle.svg" alt="Echo" /></div><div class="nm" id="prevName">Echo</div></div>
    <h2>🎩 Echo's outfits</h2>
    <div class="grid" id="outfits"></div>
    <h2>🌄 Backdrops</h2>
    <div class="grid" id="backdrops"></div>
  </div>
  <div id="toast"></div>
  <nav id="nav">
    <a href="/play.html"><span class="ic">🎮</span>Play</a>
    <a class="on" href="/shop.html"><span class="ic">🛍️</span>Shop</a>
    <a href="/progress.html"><span class="ic">📈</span>Grown-ups</a>
  </nav>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    function toast(t){ var el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove("show");},1600); }
    function refresh(){
      var p=Sona.getProfile();
      $("coins").textContent=Sona.getCoins?Sona.getCoins():0;
      // Leo preview with equipped outfit
      var of=(Sona.OUTFITS||[]).filter(function(o){return o.id===p.outfit;})[0];
      $("prevOutfit").textContent=(of&&of.emoji)||"";
      var bd=Sona.backdropById?Sona.backdropById(p.backdrop):null;
      $("stage").style.background=(bd&&bd.css)||"#eaf3ff";

      paint("outfits", Sona.OUTFITS||[], "outfits", "outfit", p.outfit);
      paint("backdrops", Sona.BACKDROPS||[], "backdrops", "backdrop", p.backdrop);
    }
    function paint(hostId, list, kind, profKey, equippedId){
      var host=$(hostId); host.innerHTML="";
      list.forEach(function(it){
        var owned = it.cost===0 || (Sona.owns&&Sona.owns(kind,it.id));
        var equipped = equippedId===it.id;
        var coins = Sona.getCoins?Sona.getCoins():0;
        var afford = coins>=it.cost;
        var el=document.createElement("div");
        el.className="item"+(equipped?" equipped":(owned?" owned":(afford?"":" cant")));
        var icon = it.emoji!==undefined ? (it.emoji||"🚫") : "🎨";
        var bottom = equipped ? '<div class="tag">Wearing</div>' : (owned ? '<div class="tag">Tap to wear</div>' : '<div class="price">🪙 '+it.cost+'</div>');
        el.innerHTML='<div class="ic">'+(it.id==="none"?"🚫":(it.emoji||"🌄"))+'</div><div class="nm">'+it.name+'</div>'+bottom;
        el.onclick=function(){
          var pNow=Sona.getProfile();
          if(equipped) return;
          if(owned){ var patch={}; patch[profKey]=it.id; Sona.saveProfile(patch); if(Sona.sfx)Sona.sfx.tap&&Sona.sfx.tap(); refresh(); return; }
          // buy
          if((Sona.getCoins?Sona.getCoins():0) < it.cost){ toast("Need "+(it.cost-(Sona.getCoins?Sona.getCoins():0))+" more 🪙 — play a game!"); return; }
          if(Sona.spendCoins&&Sona.spendCoins(it.cost)){ Sona.addOwned&&Sona.addOwned(kind,it.id); var patch={}; patch[profKey]=it.id; Sona.saveProfile(patch); if(Sona.sfx){Sona.sfx.coin&&Sona.sfx.coin(); Sona.sfx.reward&&Sona.sfx.reward();} if(Sona.pop)Sona.pop("🎉",{color:"#ff9600",y:window.innerHeight*0.4}); toast("Unlocked "+it.name+"!"); refresh(); }
        };
        host.appendChild(el);
      });
    }
    refresh();
  </script>
</body>
</html>
