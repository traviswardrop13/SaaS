<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Grocery Grab</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffb02e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --ink:#4a3a1f; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;}
    html,body{height:100%;overflow:hidden;} body{background:linear-gradient(180deg,#fff3da,#ffe7bd 60%,#ffd99a);color:var(--ink);}
    #app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;z-index:6;}
    #close{border:none;background:rgba(255,255,255,.6);color:#b08743;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--orange-d);}
    .stat.count{margin-left:auto;}
    #stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:0 18px;}
    #item{width:170px;height:170px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:96px;box-shadow:0 12px 30px rgba(180,120,20,.18);transition:transform .3s;}
    #item.fly{animation:fly .7s cubic-bezier(.5,0,.7,1) forwards;}
    @keyframes fly{0%{transform:scale(1)}30%{transform:scale(1.1) rotate(-6deg)}100%{transform:translate(40vw,46vh) scale(.2) rotate(20deg);opacity:0}}
    #phrase{margin-top:16px;font-family:"Baloo 2";font-weight:800;font-size:34px;color:var(--orange-d);}
    #cart{position:absolute;right:16px;bottom:10px;width:54px;height:54px;color:var(--green-d);} #cartCount{position:absolute;right:14px;bottom:6px;background:var(--green);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:14px;border-radius:99px;padding:2px 9px;}
    #leoWrap{position:absolute;left:8px;bottom:6px;width:78px;z-index:4;pointer-events:none;} #leoWrap.react{animation:lpop .55s ease;}
    #leo{width:100%;filter:drop-shadow(0 6px 8px rgba(120,80,20,.25));} @keyframes lpop{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-8px)}100%{transform:scale(1)}}
    #bottom{padding:8px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(255,243,218,0),rgba(255,243,218,.7));z-index:6;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--orange-d);min-height:20px;text-align:center;}
    #hearRow{display:flex;gap:10px;align-items:center;} #hear{border:2px solid #f0cf95;background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;color:var(--orange-d);cursor:pointer;font-size:14px;}
    .mic{width:90px;height:90px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 30%,#5cc6ff,#1cb0f6 60%,#1597d4);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);} .mic.rec{animation:mpulse 1.4s infinite;} .mic svg{width:40px;height:40px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:40px;max-height:40px;overflow:hidden;} .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes mpulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 16px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}
    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#fff3da,#ffd99a);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;} #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(120,80,20,.25));animation:lpop .6s ease;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--orange-d);margin-top:10px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--orange-d);margin-top:18px;box-shadow:0 6px 16px rgba(180,120,20,.15);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:#9a8050;text-transform:uppercase;}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);} #win a{margin-top:14px;color:#9a8050;font-weight:800;font-size:14px;text-decoration:none;}

    /* ═══════════════════════════════════════════════════════════════════
       VISUAL POLISH LAYER — additive, CSS-only. Mirrors the shared Sona
       design system (sona-floatY / sona-twinkle / breathing-glow look) so this
       game speaks the same visual language as the rest of the app. Animates
       transform/opacity (box-shadow sparingly); never touches game logic or
       the DOM. All depth is painted on ::before/::after + background layers
       on existing nodes only.
       NOTE: JS may swap #stage's background-image inline when a /coach/
       grocery/bg.png art-drop exists — our scenery rides on #stage::before
       (behind that image) and #app, so we never fight the art hook.
       ═══════════════════════════════════════════════════════════════════ */

    /* Reused scenery/motion keyframes (same names + values as /public/sona.css,
       redefined here because this game page does not link sona.css). The mic
       glow uses a transform/opacity halo ring (micBreathe) instead of the
       box-shadow-based sona-glow so the mic's 3D lip stays intact. */
    @keyframes sona-floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes sona-twinkle{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:.85;transform:scale(1.1)}}

    /* ── BACKGROUND ── warmer, richer market gradient (keeps the original
       sunny-amber palette, adds depth + a soft top glow) sitting behind the
       whole app column. */
    body{background:
      radial-gradient(120% 70% at 50% -12%, #fff8e8 0%, rgba(255,248,232,0) 60%),
      linear-gradient(180deg,#fff3da 0%,#ffe7bd 52%,#ffd99a 100%) fixed;}

    /* ── AMBIENT STORE GLOW ── soft overhead aisle-light pools + a faint warm
       floor wash, painted on #app::before so it spans the column and stays
       behind #top / #stage / #bottom (later siblings paint on top). */
    #app::before{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(45% 30% at 22% 16%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%),
        radial-gradient(50% 32% at 80% 12%, rgba(255,214,150,.40), rgba(255,214,150,0) 70%),
        radial-gradient(80% 40% at 50% 108%, rgba(255,166,86,.28), rgba(255,166,86,0) 70%);
    }
    /* keep real UI above the ambient wash */
    #top,#stage,#bottom{position:relative;z-index:6;}

    /* ── FLOATING PRODUCE BOKEH ── two gentle layers of soft round shapes
       drifting/twinkling inside the play area for a "fresh market" feel.
       #stage has overflow:hidden, so these stay contained; z-index:0 keeps
       them behind Leo, the item, the cart and any JS bg-image swap. */
    #stage::before{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle at 14% 26%, rgba(88,204,2,.16) 0 14px, transparent 16px),
        radial-gradient(circle at 86% 20%, rgba(255,150,0,.16) 0 18px, transparent 20px),
        radial-gradient(circle at 78% 72%, rgba(28,176,246,.14) 0 12px, transparent 14px),
        radial-gradient(circle at 22% 78%, rgba(255,107,107,.13) 0 16px, transparent 18px),
        radial-gradient(circle at 50% 12%, rgba(255,196,61,.14) 0 10px, transparent 12px);
      animation:sona-floatY 6s ease-in-out infinite;will-change:transform;
    }
    #stage::after{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle at 8% 58%, rgba(255,255,255,.5) 0 4px, transparent 6px),
        radial-gradient(circle at 92% 44%, rgba(255,255,255,.45) 0 5px, transparent 7px),
        radial-gradient(circle at 60% 86%, rgba(255,255,255,.4) 0 4px, transparent 6px),
        radial-gradient(circle at 40% 34%, rgba(255,255,255,.4) 0 3px, transparent 5px);
      animation:sona-twinkle 4.5s ease-in-out infinite;will-change:transform,opacity;
    }

    /* ── ITEM CARD ── lift item/phrase above the scenery; warm rim + a soft
       top sheen on the product card for a premium, glossy feel.
       NB: #leoWrap/#cart/#cartCount are already position:absolute — we only
       raise their z-index below; we must NOT reset their position. */
    #item,#phrase{position:relative;z-index:2;}
    #item{
      background:linear-gradient(180deg,#ffffff,#fff7e8);
      box-shadow:0 12px 30px rgba(180,120,20,.20),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -10px 22px rgba(255,210,140,.18);
    }
    #item::after{
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:radial-gradient(120% 60% at 50% -8%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%);
    }
    /* ── SUCCESS JUICE ── on grab (.fly), a soft radial glow-burst blooms
       behind the item then fades. Pure scale+opacity, so it never disturbs
       the existing JS fly transform on #item itself. */
    #item.fly::before{
      content:"";position:absolute;left:50%;top:50%;width:150%;height:150%;
      transform:translate(-50%,-50%) scale(.4);border-radius:50%;pointer-events:none;z-index:-1;
      background:radial-gradient(circle, rgba(88,204,2,.45), rgba(88,204,2,0) 65%);
      animation:grabBurst .7s ease-out forwards;
    }
    @keyframes grabBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
      30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}

    /* ── CART ── gentle resting bob + a soft contact glow so it reads as the
       drop target; cartCount becomes a juicy gradient pill. */
    #cart{z-index:2;animation:sona-floatY 3.6s ease-in-out infinite;will-change:transform;
      filter:drop-shadow(0 4px 6px rgba(70,163,0,.30));}
    #cartCount{z-index:3;background:linear-gradient(180deg,#6fe016,var(--green));
      box-shadow:0 3px 8px rgba(70,163,0,.35),inset 0 1px 0 rgba(255,255,255,.5);}

    /* ── PROGRESS PILLS ── the "Phrases x/y" count gets a warm gradient fill
       + soft elevation; both stat pills get a subtle inset top-light. */
    .stat{box-shadow:0 3px 10px rgba(180,120,20,.12),inset 0 1px 0 rgba(255,255,255,.7);}
    .stat.count{background:linear-gradient(180deg,#fff4dc,#ffe6b8);color:var(--orange-d);}

    /* ── MIC ── breathing halo while idle (premium, calm). A pseudo-ring on
       the mic pulses via transform/opacity so it composites cleanly with the
       existing 3D box-shadow lip; the JS .rec pulse (mpulse) takes over while
       recording by hiding this idle ring. */
    .mic{position:relative;}
    .mic::before{
      content:"";position:absolute;inset:-10px;border-radius:50%;pointer-events:none;z-index:-1;
      background:radial-gradient(circle, rgba(28,176,246,.30), rgba(28,176,246,0) 70%);
      animation:micBreathe 2.4s ease-in-out infinite;will-change:transform,opacity;
    }
    .mic.rec::before{animation:none;opacity:0;}
    @keyframes micBreathe{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.9;transform:scale(1.08)}}
    .mic svg{position:relative;z-index:1;}

    /* ── HEAR BUTTON ── a touch of depth + warmth to match the pills. */
    #hear{box-shadow:0 3px 8px rgba(180,120,20,.10);transition:transform .05s;}
    #hear:active{transform:translateY(2px);}

    /* ── LEO ── lift above scenery + a soft ground shadow for grounding. */
    #leoWrap{z-index:4;}

    /* ── WIN SCREEN ── richer celebratory backdrop with ambient float,
       a glowing Leo, glossy reward chips and a breathing CTA. */
    #win{background:
      radial-gradient(110% 60% at 50% -8%, #fff8e8, rgba(255,248,232,0) 60%),
      linear-gradient(180deg,#fff3da,#ffd99a);}
    #win::before{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle at 18% 24%, rgba(88,204,2,.16) 0 16px, transparent 18px),
        radial-gradient(circle at 82% 18%, rgba(255,150,0,.16) 0 20px, transparent 22px),
        radial-gradient(circle at 74% 78%, rgba(28,176,246,.14) 0 14px, transparent 16px),
        radial-gradient(circle at 24% 80%, rgba(255,107,107,.13) 0 16px, transparent 18px);
      animation:sona-floatY 6s ease-in-out infinite;will-change:transform;
    }
    #win > *{position:relative;z-index:1;}
    #win .reward{background:linear-gradient(180deg,#ffffff,#fff6e2);
      box-shadow:0 6px 16px rgba(180,120,20,.15),inset 0 1px 0 rgba(255,255,255,.9);}
    /* CTA: glossier gradient + a breathing halo ring (transform/opacity), so
       the 3D box-shadow lip is preserved while it gently pulses. */
    #win .btn{position:relative;background:linear-gradient(180deg,#6fe016,var(--green));}
    #win .btn::after{
      content:"";position:absolute;inset:-8px;border-radius:22px;pointer-events:none;z-index:-1;
      background:radial-gradient(closest-side, rgba(88,204,2,.40), rgba(88,204,2,0) 75%);
      animation:micBreathe 2.6s ease-in-out infinite;will-change:transform,opacity;
    }

    /* Respect reduced-motion (accessibility + battery). */
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat" id="rungBadge">Phrases</span>
      <span class="stat count"><span id="count">0</span>/<span id="goal">6</span></span>
    </div>
    <div id="stage">
      <div id="leoWrap"><img id="leo" src="/coach/echo/echo-idle.svg" alt="Leo" /></div>
      <div id="item">🐰</div>
      <div id="phrase">a rabbit</div>
      <div id="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:54px;height:54px;"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.1a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/></svg></div><span id="cartCount">0</span>
    </div>
    <div id="bottom">
      <div id="prompt">Say the whole phrase to grab it!</div>
      <div id="hearRow"><button id="hear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;margin-right:5px;"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Hear it</button></div>
      <button class="mic" id="micBtn" title="Say it"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div id="win">
    <img class="leoWin" src="/coach/echo/echo-celebrate.svg" alt="Leo" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
    <h1>Shopping done!</h1>
    <div class="reward"><span id="winCount">0</span><small>items grabbed</small></div>
    <div class="reward" id="winUnlock" style="background:#fff7df;color:#e08600;"></div>
    <button class="btn" id="again">Play again</button><a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var profile=(window.Sona?Sona.getProfile():{focusSounds:["R"],voiceId:"",volume:0.8});
    var SOUND=(new URLSearchParams(location.search).get("sound")||(profile.focusSounds&&profile.focusSounds[0])||"R").toUpperCase();
    if(!(window.Sona&&Sona.WORDS&&Sona.WORDS[SOUND])) SOUND="R";
    /* ── SLP CONTENT LADDER ── serve the child's CURRENT rung for this sound
       instead of always practicing at phrase level. Computed once. */
    var RUNG=(window.Sona&&Sona.rungOf)?Sona.rungOf(SOUND):2; if(RUNG>5)RUNG=5;
    var ITEMS=(window.Sona&&Sona.ladderContent)?Sona.ladderContent(SOUND,RUNG):[];
    if(RUNG>=5 && (!ITEMS.length || (ITEMS[0]&&ITEMS[0].q))){ RUNG=4; ITEMS=Sona.ladderContent(SOUND,4); } // arcade can't do conversation -> use sentences
    if(!ITEMS.length){ ITEMS=((window.Sona&&Sona.wordsFor)?Sona.wordsFor(SOUND):[]).map(function(w){return {t:w.w,say:w.w,display:w.w,e:w.e,word:w.w,level:"word",mode:"full"};}); }
    if(!ITEMS.length){ ITEMS=[{t:"a rabbit",say:"a rabbit",display:"a rabbit",e:"🐰",word:"rabbit",level:"phrase",mode:"full"}]; }
    var LIST=ITEMS;
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    /* ── 10 DISTINCT LEVELS ── a journey through The Market 🛒.
       KNOB: goal = how many phrase-items to grab (length/challenge), gently
       climbing 4 → 13 and respecting the existing 14 cap. SCENE: per-level
       bg gradient + accent + ambient props themed to each market stop. */
    var LEVELS=[
      {name:"Corner Shop",   goal:4,  bg:"radial-gradient(120% 70% at 50% -12%, #fff8e8 0%, rgba(255,248,232,0) 60%), linear-gradient(180deg,#fff3da 0%,#ffe7bd 52%,#ffd99a 100%)", accent:"#e08600", props:["🛒","🥛","🍎"]},
      {name:"Bakery",        goal:5,  bg:"radial-gradient(120% 70% at 50% -12%, #fff1de 0%, rgba(255,241,222,0) 60%), linear-gradient(180deg,#ffe9c9 0%,#f6d3a0 55%,#e7b878 100%)", accent:"#c8741f", props:["🥖","🥐","🧁"]},
      {name:"Produce Aisle", goal:6,  bg:"radial-gradient(120% 70% at 50% -12%, #f0ffe6 0%, rgba(240,255,230,0) 60%), linear-gradient(180deg,#e6f9cf 0%,#c6ec9a 55%,#a3d873 100%)", accent:"#46a302", props:["🥦","🥕","🌽"]},
      {name:"Fruit Stand",   goal:7,  bg:"radial-gradient(120% 70% at 50% -12%, #fff0f3 0%, rgba(255,240,243,0) 60%), linear-gradient(180deg,#ffe1e6 0%,#ffc2b0 55%,#ff9e7a 100%)", accent:"#e85a3a", props:["🍓","🍊","🍇"]},
      {name:"Farmers Market",goal:8,  bg:"radial-gradient(120% 70% at 50% -12%, #eafff0 0%, rgba(234,255,240,0) 60%), linear-gradient(180deg,#d6f6e0 0%,#a9e6c2 55%,#79cfa0 100%)", accent:"#1f9d5a", props:["🧺","🍅","🌻"]},
      {name:"Dairy & Deli",  goal:9,  bg:"radial-gradient(120% 70% at 50% -12%, #f2faff 0%, rgba(242,250,255,0) 60%), linear-gradient(180deg,#e2f3ff 0%,#bfe2fb 55%,#94caf2 100%)", accent:"#1597d4", props:["🧀","🥛","🥚"]},
      {name:"Big Supermarket",goal:10, bg:"radial-gradient(120% 70% at 50% -12%, #fffbe8 0%, rgba(255,251,232,0) 60%), linear-gradient(180deg,#fff4c7 0%,#ffe07a 55%,#ffc83d 100%)", accent:"#d99000", props:["🏬","🛒","🧺"]},
      {name:"Night Market",  goal:11, bg:"radial-gradient(120% 70% at 50% -12%, #3a3170 0%, rgba(58,49,112,0) 60%), linear-gradient(180deg,#2b2456 0%,#3e3274 55%,#5a3f8c 100%)", accent:"#ffd24d", props:["🌙","🏮","🍜"]},
      {name:"Festival Market",goal:12, bg:"radial-gradient(120% 70% at 50% -12%, #fff0fb 0%, rgba(255,240,251,0) 60%), linear-gradient(180deg,#ffd9f2 0%,#e7b3ff 55%,#b58cff 100%)", accent:"#a64fd4", props:["🎪","🎈","🍡"]},
      {name:"Grand Bazaar!", goal:13, bg:"radial-gradient(120% 70% at 50% -12%, #fff6d6 0%, rgba(255,246,214,0) 60%), linear-gradient(180deg,#ffe9a8 0%,#ffbf4d 50%,#ff8f2e 100%)", accent:"#b35900", props:["👑","🏆","🛒"]}
    ];
    var L=LEVELS[Math.min(9,Math.max(0,DIFF-1))];
    var GOAL=Math.min(14,(L.goal||((Math.min(LIST.length,6)||6)+(DIFF-1))));

    var audioCtx=null; function getCtx(){if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();}if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx;}
    function playPCM(b){return new Promise(function(res){try{var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength);for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768;var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start();}catch(e){res();}});}
    var speaking=false; function say(t){return new Promise(function(res){if(!t||speaking)return res();speaking=true;fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){return b?playPCM(new Uint8Array(b)):null;}).catch(function(){}).finally(function(){speaking=false;res();});});}
    var LEO={idle:"/coach/echo/echo-idle.svg",cheer:"/coach/echo/echo-celebrate.svg",listen:"/coach/echo/echo-listening.svg"};
    Object.keys(LEO).forEach(function(k){var im=new Image();im.src=LEO[k];});
    function setLeo(s){var el=$("leo");if(el&&LEO[s])el.src=LEO[s];}
    function leoReact(){var w=$("leoWrap");if(!w)return;w.classList.remove("react");void w.offsetWidth;w.classList.add("react");}
    function norm(s){return (s||"").toLowerCase().replace(/[^a-z]/g,"");}

    var micStream=null, useSpeechAce=false;
    function recordTurn(maxMs){ if(window.Sona&&Sona.hasNativeAudio&&Sona.hasNativeAudio())return Sona.captureClip({maxMs:(maxMs||6000)}); maxMs=maxMs||8000; return new Promise(function(resolve){
      var done=false,chunks=[],rec=null,sr=null,transcript="",spoke=false,lastV=0,raf=null,src=null,bars=null,micBtn=$("micBtn"),ico=micBtn.querySelector("svg");
      function finish(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} micBtn.classList.remove("rec");micBtn.onclick=null; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} if(bars)bars.remove(); if(ico)ico.style.display=""; setTimeout(function(){resolve({transcript:transcript,blob:chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null,spoke:spoke});},120); }
      try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
      try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; finish();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
      micBtn.classList.add("rec"); micBtn.onclick=finish;
      try{ if(micStream){ var ctx=getCtx();src=ctx.createMediaStreamSource(micStream);var an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
        var fd=new Uint8Array(an.frequencyBinCount),td=new Uint8Array(an.fftSize);bars=document.createElement("div");bars.className="wavebars";for(var b=0;b<7;b++)bars.appendChild(document.createElement("i"));if(ico)ico.style.display="none";micBtn.appendChild(bars);
        var t0=performance.now(),nS=0,nN=0,thr=0,v=0;
        (function tick(){ if(done)return; an.getByteFrequencyData(fd);[].forEach.call(bars.children,function(el,k){el.style.height=(8+fd[2+k*3]/255*30)+"px";});
          an.getByteTimeDomainData(td);var sum=0;for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;}var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<300){nS+=rms;nN++;}else{if(!thr)thr=Math.min(0.1,Math.max(0.014,(nS/Math.max(1,nN))*2.6));if(rms>thr){v++;lastV=now;if(v>=2)spoke=true;}else if(rms<thr*0.7)v=0;if(spoke&&now-lastV>=1100){finish();return;}}
          raf=requestAnimationFrame(tick);})();
      } }catch(e){}
      setTimeout(function(){ if(!done)finish(); }, maxMs);
    }); }
    // phrase-level pass: SpeechAce rating other than tryAgain; else heard speech
    async function scoreUtterance(res,text,mode){
      if(!res.spoke && !res.transcript && !res.blob) return {pass:false};
      if(useSpeechAce && res.blob){ try{ var fd=new FormData(); fd.append("audio",new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"})); fd.append("text",text); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode",mode||"full"); var r=await fetch("/api/score",{method:"POST",body:fd}); var j=await r.json(); if(j&&j.ok&&j.rating) return {pass:j.rating!=="tryAgain"}; }catch(e){} }
      if(res.transcript) return {pass:true};
      return {pass:!!res.spoke};
    }

    var queue=[], qi=0, got=0, busy=false, correct=0, total=0;
    /* rung-aware default prompt: at sound/syllable rungs we coach the sound */
    function defaultPrompt(it){ if(it&&(it.level==="isolation"||it.level==="syllable")) return "Say the sound to grab it!"; return "Say the whole phrase to grab it!"; }
    function itemEmoji(it){ return it.e || ({R:"🔤",S:"🐍",L:"🦁",K:"🔑",G:"🍇",F:"🐟",V:"🎻",SH:"🤫",CH:"🚂",J:"🕹️",TH:"👍",THV:"👍",Z:"🦓",P:"🥧",B:"🎈",M:"🌝",N:"👃",T:"🌮",D:"🦆"}[SOUND]||"🛍️"); }
    function showItem(it){ $("item").classList.remove("fly"); void $("item").offsetWidth; var em=itemEmoji(it); $("item").innerHTML=(it.e&&window.Sona&&Sona.pic)?Sona.pic(it.word,it.e,120):em; $("phrase").textContent=(it.display||it.t); }
    /* model the raw sound at isolation/syllable rungs, else just present the item */
    function speakItem(it){ if(it&&(it.level==="isolation"||it.level==="syllable")&&window.Sona&&Sona.repeatCue){ return say(Sona.repeatCue(SOUND)); } return say((it&&(it.say||it.t))||""); }
    async function turn(){
      if(busy) return; busy=true; $("micBtn").onclick=null;
      var it=queue[qi%queue.length];
      setLeo("listen"); $("prompt").textContent="Say “"+(it.display||it.t)+"”";
      var res=await recordTurn(); var sa=await scoreUtterance(res, it.t, it.mode);
      total++;
      if(window.Sona&&Sona.logAttempt)Sona.logAttempt({game:"grocery",sound:SOUND,pass:sa.pass});
      if(sa.pass){
        if(window.Sona&&Sona.sfx&&Sona.sfx.correct)Sona.sfx.correct();
        setLeo("cheer"); leoReact(); $("item").classList.add("fly"); $("prompt").textContent="Nice one!";
        if(window.Sona&&Sona.praiseLine)await say(Sona.praiseLine());
        got++; correct++; qi++; $("count").textContent=got; $("cartCount").textContent=got;
        await new Promise(function(r){setTimeout(r,720);});
        setLeo("idle"); busy=false;
        if(got>=GOAL) return finishGame();
        var nx=queue[qi%queue.length]; showItem(nx); $("micBtn").onclick=turn; $("prompt").textContent=defaultPrompt(nx);
        speakItem(nx);
      } else {
        if(window.Sona&&Sona.sfx&&Sona.sfx.tap)Sona.sfx.tap();
        setLeo("idle"); $("prompt").textContent="Not quite — try again!";
        await new Promise(function(r){setTimeout(r,650);}); busy=false; $("micBtn").onclick=turn; speakItem(it);
      }
    }
    function finishGame(){
      window.Sona&&Sona.recordRung&&Sona.recordRung(SOUND,RUNG,correct/Math.max(1,total));
      var earned=20; if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}");GS[SOUND]=GS[SOUND]||{};GS[SOUND].grocery={done:true};GS.lastPlayDay=new Date().toISOString().slice(0,10);localStorage.setItem("sona.games.v1",JSON.stringify(GS));}catch(e){}
      $("winCount").textContent=got; $("winUnlock").textContent="+"+earned+" 🪙"; $("win").classList.add("show");
      if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win"));
      if(window.Sona){Sona.confetti&&Sona.confetti();Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete();Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin();}
    }
    function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
    function startGame(){ $("win").classList.remove("show"); got=0; qi=0; busy=false; correct=0; total=0; $("count").textContent="0"; $("cartCount").textContent="0"; $("goal").textContent=GOAL;
      var rb=$("rungBadge"); if(rb)rb.textContent="Practicing: "+((window.Sona&&Sona.rungLabel)?Sona.rungLabel(RUNG):"");
      queue=shuffle(LIST); setLeo("idle"); showItem(queue[0]); $("micBtn").onclick=turn; $("prompt").textContent=defaultPrompt(queue[0]); speakItem(queue[0]);
    }
    (async function(){ try{var r=await fetch("/api/score");var j=await r.json();useSpeechAce=!!(j&&j.hasKey);}catch(e){useSpeechAce=false;}
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){micStream=null;}
      $("hear").onclick=function(){ speakItem(queue[qi%queue.length]); }; $("again").onclick=startGame;
      if(window.Sona&&Sona.music)Sona.music.start(); startGame();
    })();
    (function(){ var lad="/map.html"; var c=$("close"); if(c)c.onclick=function(){location.href=lad;}; Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){a.setAttribute("href",lad);}); })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  
    /* ── APPLY CHOSEN LEVEL'S SCENE ──
       Paint the level gradient on the real scene element (#stage), tint the
       game's orange accent vars, and float the level's props as faint ambient
       emoji. Then layer art-drops on top: a per-level "/coach/grocery/lvlN.png"
       overrides the gradient when present; the original bg.png stays a fallback. */
    (function(){
      var stage=document.getElementById("stage")||document.body;
      if(L.bg)stage.style.background=L.bg;
      if(L.accent){ var rs=document.documentElement.style; rs.setProperty("--orange-d",L.accent); rs.setProperty("--orange",L.accent); }
      /* faint ambient props (additive layer; never blocks taps) */
      try{ if(L.props&&L.props.length){ var amb=document.createElement("div");
        amb.style.cssText="position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.22;font-size:46px;";
        var spots=[[12,22],[82,30],[68,74]];
        for(var p=0;p<L.props.length&&p<3;p++){ var s=document.createElement("span");
          s.textContent=L.props[p]; s.style.cssText="position:absolute;left:"+spots[p][0]+"%;top:"+spots[p][1]+"%;";
          s.style.animation="sona-floatY "+(5+p)+"s ease-in-out infinite"; amb.appendChild(s); }
        stage.appendChild(amb);
      } }catch(e){}
      /* art drop-in: per-level art wins, classic bg.png is the fallback (zero code) */
      function dropArt(src){ var im=new Image(); im.onload=function(){ if(stage){ stage.style.backgroundImage="url("+src+")"; stage.style.backgroundSize="cover"; stage.style.backgroundPosition="center"; } }; im.src=src; }
      dropArt("/coach/grocery/bg.png");
      dropArt("/coach/grocery/lvl"+DIFF+".png");
    })();
</script>
