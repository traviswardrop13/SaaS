<body>
  <main class="wrap" id="libraryMain">
    <header class="app">
      <a class="library-back" href="/today.html" aria-label="Back to games"><span aria-hidden="true">←</span></a>

    <section class="library-intro" aria-labelledby="libraryTitle">
      <p class="eyebrow">A LITTLE WORLD OF STORIES</p>
      <h1 id="libraryTitle">Let's read!</h1>
      <p>Find a little adventure.<br>Echo will read along with you.</p>
    </section>
    <div class="shelfhead"><h2>Pick a story</h2><span class="tag" id="bookCount"></span></div>
    <div class="shelf" id="shelf"></div>
    <p class="library-note">Just for fun. No scores, no hurry.</p>
    <details class="library-extras">
      <summary>More to explore<span aria-hidden="true">+</span></summary>
      <button id="feedTile" class="extra-tile" onclick="location.href='/arcade-feed.html'"><img src="/coach/echo/echo-idle.svg" alt="" /><span><b>Feed Echo</b><small>Say the word, tap the picture — watch Echo grow!</small></span><span aria-hidden="true">→</span></button>
      <button id="advTile" class="extra-tile" onclick="location.href='/story.html'"><span class="extra-book" aria-hidden="true">✦</span><span><b id="advTitle">Your Adventure</b><small id="advSub">A brand-new story, written just for you — never the same twice</small></span><span aria-hidden="true">→</span></button>

      <div class="sounds" id="wbSounds"></div>
      <div class="wordgrid" id="wordgrid"></div>
    </details>
  </main>

  <!-- full-screen picture book -->
  <div id="book" role="dialog" aria-modal="true" aria-labelledby="bkHead" tabindex="-1">
    <div class="bktop">
      <button class="bkclose" id="bkClose" aria-label="Close book">✕</button>
      <div id="bkHead"></div>
      <div id="bkCount" class="page-count"></div>
    </div>
    <div class="bkstage" id="bkStage"></div>
    <div id="bkProgress" class="book-progress" aria-label="Book progress"></div>
    <div class="bkbottom">
      <div id="bookTurn" role="status" aria-live="polite"><div class="turn-word" id="bookPrompt"></div><div class="turn-status" id="bookStatus"></div></div>
      <button class="bknav bkback" id="bkPrev" aria-label="Back a page">←</button>
      <button class="bkhear" id="bkHear" title="Hear it again"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Hear it</button>
      <button class="bkhear" id="bkMic" type="button" hidden>Try microphone</button>
      <button class="bknav bknext" id="bkNext">Next →</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script>

    }catch(e){}
    var PITCH = Sona.VOICE_PITCH || 1.15;

    var STORIES = [
      { sound: "R", emoji: "🐰", title: "Rory the Rabbit", colors: ["#ff7a6e", "#ef6557"], pages: [

        { e: "🌧️", t: "Rain! They run for the roof." },
        { e: "🌈", t: "Reba the robot: ready, ready!" } ] },

        { e: "🌽", t: "The rooster pecks rows of corn." },
        { e: "💤", t: "Ruby rests. What a great run!" } ] },
      { sound: "R", emoji: "🦝", title: "Remy the Raccoon", colors: ["#ffb066", "#ef923c"], pages: [
        { e: "🦝", t: "Remy the raccoon roams the river." },
        { e: "🪨", t: "He reaches under a round rock." },

        { e: "⭐", t: "Remy the raccoon: hooray!" } ] },
      { sound: "R", emoji: "🦏", title: "Rex the Rhino", colors: ["#ff7a6e", "#e05a9c"], pages: [
        { e: "🦏", t: "Rex the rhino runs really fast." },
        { e: "🛣️", t: "He roars down the rocky road." },
        { e: "🌳", t: "Rex rolls in the rich, green grass." },

        { e: "🤝", t: "Rex meets a friendly rabbit." },
        { e: "🎉", t: "Run, Rex, run! Hooray!" } ] },
      { sound: "S", emoji: "🦭", title: "Sunny the Seal", colors: ["#62bdff", "#46a6ec"], pages: [
        { e: "☀️", t: "Sunny the seal sits in the sun." },
        { e: "🐍", t: "Sunny sees a silly snake." },

        { e: "💛", t: "Lily loves to play all day." } ] },
      { sound: "K", emoji: "🐨", title: "Kiki the Koala", colors: ["#7dd470", "#63bd57"], pages: [

        { e: "🪶", t: "Fifi the fox finds four feathers." },
        { e: "🐟", t: "Fifi feeds a funny fish." },
        { e: "🔥", t: "They warm five feet by the fire." },
        { e: "🦋", t: "A butterfly flies fast — wow!" },

        { e: "👋", t: "Fifi waves: farewell, farewell!" } ] },
    ];

    /* Narration uses the shared, bounded speech pipeline. A turn token keeps
       a cancelled page from opening its microphone after a late TTS result. */
    var playing = false, sayToken = 0, bookMicClosedAt = 0;
    function unlockAudio() { try { Sona.speakUnlock(); } catch (e) {} }
    document.addEventListener("pointerdown", unlockAudio, { passive:true, capture:true });
    function stopSpeech() { sayToken++; playing = false; try { Sona.speakStop(); } catch (e) {} }
    function say(text) {
      var token = ++sayToken; playing = true;
      // Give the phone's input audio session time to release before output.
      var quietMs = Math.max(0, 250 - (Date.now() - bookMicClosedAt));
      return new Promise(function (resolve) { if (quietMs) setTimeout(resolve, quietMs); else resolve(); }).then(function () {
        if (token !== sayToken) return;
        return Sona.speakNow(text, { auto:false });
      }).then(function () { if (token === sayToken) playing = false; });
    }

    // Explicit words preserve phonemes, including final TH in bath/teeth and
    // SH in wish. Letter matching would pick voiced "the" or S in "sleeping".
    // Requested prototype: mapping/response rule is documented for Rachel.
    var BOOK_TARGETS = {
      rory:["Rory","rocket","rock","ring","river","Rory"],
      reba:["Reba","rose","rabbit","ribbon","Rain","ready"],
      ruby:["Ruby","rise","red","Ruby","rooster","run"],
      remy:["Remy","rock","red","raft","reeds","Remy"],
      rex:["Rex","road","rolls","red","rabbit","Run"],
      sunny:["sun","silly","sand","soup","song","Sunny"],
      lily:["lemon","log","leaf","laughs","look","loves"],
      kiki:["cake","key","kite","cookie","cat","cool"],
      shelly:["shoes","shell","ship","wish","milkshake","Shelly"],
      charlie:["cherries","Charlie","cheese","chair","chips","cheep"],
      theo:["thinks","three","thumbs","teeth","bath","Thank"],
      gus:["goat","gift","guitar","gate","giggles","game"],
      fifi:["Fifi","fish","feet","fast","fun","Fifi"]
    };
    var bookEpoch = 0, bookCapture = null, bookTimer = null, pageReady = false;
    function cancelBookTurn() {
      bookEpoch++; clearTimeout(bookTimer); bookTimer = null;
      if (bookCapture) { bookCapture.cancel(); bookCapture = null; bookMicClosedAt = Date.now(); }
      stopSpeech();
    }
    function liveTurn(token) { return token === bookEpoch && BOOK && page >= 0 && page < BOOK.pages.length && !document.hidden; }
    function turnUI(phase, word, status) {
      document.getElementById("book").setAttribute("data-turn", phase);
      document.getElementById("bookPrompt").textContent = word;
      document.getElementById("bookStatus").textContent = status;
      var mic = document.getElementById("bkMic");
      mic.hidden = false;
      mic.disabled = phase !== "retry" && phase !== "paused";
      mic.textContent = phase === "listening" ? "Listening…" : (phase === "retry" ? "Try microphone" : (phase === "paused" ? "Resume" : "Your turn"));
      document.getElementById("bkNext").disabled = !pageReady;
    }
    function repeatPage(readPage) {
      if (!BOOK || page < 0 || page >= BOOK.pages.length) return;
      cancelBookTurn(); pageReady = false;
      var token = bookEpoch, word = BOOK_TARGETS[bookSlug(BOOK)][page], sentence = BOOK.pages[page].t;
      turnUI("reading", readPage ? "Listen to Echo" : "Your turn", readPage ? "Then it is your turn." : "Listen to your word.");
      var first = readPage ? say(sentence) : Promise.resolve();
      first.then(function () {
        if (!liveTurn(token)) return;
        turnUI("prompting", "Say " + word, "");
        return say("Say " + word + ".").then(function () {
          if (!liveTurn(token)) return;
          // The browser voice watchdog can return before a stuck utterance
          // ends. Never let that utterance become the child's response.
          if (window.speechSynthesis && speechSynthesis.speaking) {
            stopSpeech(); turnUI("paused", "Say " + word, "Tap Resume to hear your word again."); return;
          }
          bookTimer = setTimeout(function () { listenOnPage(token, word); }, 400);
        });
      }).catch(function () { if (liveTurn(token)) turnUI("paused", "Say " + word, "Tap Resume to try again."); });
    }
    function listenOnPage(token, word) {
      if (!liveTurn(token)) return;
      turnUI("opening", "Say " + word, "Opening the microphone…");
      var capture = Sona.captureResponse({ maxMs:15000,
        onListening:function () { if (liveTurn(token)) turnUI("listening", "Say " + word, "I'm listening. Take your time."); },
        onLevel:function (level) { if (liveTurn(token)) document.getElementById("bkMic").style.setProperty("--voice-level", level); }
      });
      bookCapture = capture;
      capture.promise.then(function (result) {
        if (!liveTurn(token)) return;
        bookCapture = null; bookMicClosedAt = Date.now();
        if (!result.spoke || result.reason !== "response") {
          var status = result.reason === "denied" ? "Ask a grown-up to allow the microphone in your browser or app settings, then try again." : (result.reason === "unavailable" ? "A microphone is needed to turn the page." : "I didn't hear you yet. Let's try again.");
          turnUI("retry", "Say " + word, status); return;
        }
        // A voiced attempt moves the story. It is not a word-correctness
        // grade and never adds a scored rep or a clinician outcome.
        pageReady = true; turnUI("heard", "I heard you!", "Turning the page…");
        if (result.blob) Sona.saveRecording({ sound:BOOK.sound, word:word, level:"book", blob:result.blob });
        bookTimer = setTimeout(function () { if (liveTurn(token) && pageReady) { page++; showPage(); } }, 650);
      }).catch(function () { if (liveTurn(token)) { bookCapture = null; turnUI("retry", "Say " + word, "Try the microphone again."); } });
    }

    /* ---- shelf ---- */
    // BOOKS1: the shelf holds the child's OWN sounds. A library full of books
    // for sounds nobody is working on is a library a child scrolls past — and
    // for a kid on /r/, a Theo-the-Sloth /th/ book is practice they were never
    // assigned. Two escape hatches, because an empty shelf is worse than an
    // unfocused one:
    //   - play mode (PLAY1) rotates every sound, so it gets the whole shelf
    //   - if a filter would leave nothing, show everything instead
    var focusOrder = (profile.focusSounds || []).map(function (x) { return String(x).toUpperCase(); });
    var playMode = false; try { playMode = !!(window.Sona && Sona.playMode && Sona.playMode()); } catch (e) {}
    if (!playMode && focusOrder.length) {
      var mine = STORIES.filter(function (st) { return focusOrder.indexOf(String(st.sound).toUpperCase()) !== -1; });
      if (mine.length) STORIES = mine;
    }
    STORIES.sort(function (a, b) {
      var ai = focusOrder.indexOf(String(a.sound).toUpperCase()), bi = focusOrder.indexOf(String(b.sound).toUpperCase());
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });
    var shelf = document.getElementById("shelf");
    // read-through star (D1): a book read to The End pins the gold star to
    // its cover. Local flag by title; Story Time's story.done counts too.
    // per-child: two siblings must not share read stars (KIDS1)
    var LIBKEY = (window.Sona&&Sona.kkey)?Sona.kkey("sona.lib.read.v1"):"sona.lib.read.v1";
    function libRead() { try { return JSON.parse(localStorage.getItem(LIBKEY) || "{}"); } catch (e) { return {}; } }
    function markRead(title) { try { var m = libRead(); if (!m[title]) { m[title] = 1; localStorage.setItem(LIBKEY, JSON.stringify(m)); } } catch (e) {} }
    function wasRead(st) {
      try { if (libRead()[st.title]) return true; } catch (e) {}
      try { var g = JSON.parse(localStorage.getItem((window.Sona&&Sona.kkey)?Sona.kkey("sona.games.v1"):"sona.games.v1") || "{}"); return !!(g[st.sound] && g[st.sound].story && g[st.sound].story.done); } catch (e) { return false; }
    }
    document.getElementById("bookCount").textContent = STORIES.length + " books";
    STORIES.forEach(function (st) {
      var b = document.createElement("button");
      b.className = "bookBtn";
      b.setAttribute("aria-label", st.title + ", " + st.sound + " sound, " + st.pages.length + " pages" + (wasRead(st) ? ", read" : ""));
      st.shelfButton = b;
      b.innerHTML = '<span class="cvr">' + cover(st, 76) + '</span>'
        + (wasRead(st) ? '<span class="doneStar">' + ((window.Sona && Sona.icon) ? Sona.icon("star", 22) : "") + '</span>' : "")
        + '<span class="bt">' + st.title + '</span>'
        + '<span class="bs">' + st.sound + ' sound<span aria-hidden="true"> · </span>' + st.pages.length + ' pages<span class="book-open" aria-hidden="true">→</span></span>';
      b.onclick = function () { if (window.Sona) Sona.sfx.tap(); openBook(st); };
      shelf.appendChild(b);
    });

    /* ---- the picture book: one picture + one line per page ---- */
    // Designed reader art (design board sections 11-12): every R-book page
    // (and the SH pages) swaps its emoji for a scene sticker. Values are
    // inline SVG (new rrb-*/rb-* art), a word (reuse the shipped word-box
    // sticker via Sona.pic), or __star (the kit star). Anything unmapped
    // falls through to the existing word-match + emoji pipeline.
    var READER_ART={
      "🌈":"<svg viewBox=\"0 0 64 64\" style=\"width:116px;height:116px\"><g id=\"rrb-rainbow\"><path d=\"M12 46a20 20 0 0 1 40 0\" fill=\"none\" stroke=\"#ff5c5c\" stroke-width=\"5.5\" stroke-linecap=\"round\"></path><path d=\"M20 46a12 12 0 0 1 24 0\" fill=\"none\" stroke=\"#ffd21c\" stroke-width=\"5.5\" stroke-linecap=\"round\"></path><path d=\"M28 46a4 4 0 0 1 8 0\" fill=\"none\" stroke=\"#4db3f2\" stroke-width=\"5.5\" stroke-linecap=\"round\"></path><circle cx=\"13\" cy=\"42\" r=\"5.5\" fill=\"#f0f0f5\"></circle><circle cx=\"9\" cy=\"47\" r=\"6.5\" fill=\"#f0f0f5\"></circle><circle cx=\"17\" cy=\"48\" r=\"5\" fill=\"#f0f0f5\"></circle><circle cx=\"51\" cy=\"42\" r=\"5.5\" fill=\"#f0f0f5\"></circle><circle cx=\"55\" cy=\"47\" r=\"6.5\" fill=\"#f0f0f5\"></circle><circle cx=\"47\" cy=\"48\" r=\"5\" fill=\"#f0f0f5\"></circle><circle cx=\"10\" cy=\"43.5\" r=\"2\" fill=\"#fff\" opacity=\".85\"></circle></g></svg>",
      "🌊":"<svg viewBox=\"0 0 64 64\" style=\"width:116px;height:116px\"><g id=\"rrb-river\"><path d=\"M5 45q8-11 15-11t10 7 10-7 9 3 10-3v24H5Z\" fill=\"#4db3f2\"></path><path d=\"M5 55q9-5 16-3t11 3 11-3 16 1v5H5Z\" fill=\"#2a8fd4\"></path><circle cx=\"20\" cy=\"35\" r=\"4\" fill=\"#f0f0f5\"></circle><circle cx=\"26\" cy=\"38.5\" r=\"2.8\" fill=\"#f0f0f5\"></circle><circle cx=\"40\" cy=\"35.5\" r=\"3.2\" fill=\"#f0f0f5\"></circle><circle cx=\"12\" cy=\"42\" r=\"2.2\" fill=\"#fff\" opacity=\".85\"></circle></g></svg>",

    function readerArt(pg){
      var a=READER_ART[pg.e];
      if(a){
        if(a==="__star") return (window.Sona&&Sona.icon)?Sona.icon("star",116):(pg.e||"");
        if(a.charAt(0)==="<") return a;
        return (window.Sona&&Sona.pic)?Sona.pic(a,pg.e,116):(pg.e||"");
      }
      return (window.Sona&&Sona.pic)?Sona.pic(readerWord(pg.t),pg.e,118):(pg.e||"");
    }
    function legacyCover(st,w){ var c0=st.colors[0],c1=st.colors[1];
      var face=(window.Sona&&Sona.COVER_FACES&&Sona.COVER_FACES[st.sound])||"";
      return '<svg viewBox="0 0 60 76" style="width:'+w+'px;height:'+Math.round(w*76/60)+'px;overflow:visible">'
        +'<rect x="2" y="8" width="52" height="62" rx="7" fill="#fff" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))"/>'
        +'<rect x="2" y="8" width="6" height="62" rx="3" fill="'+c0+'"/>'
        +'<circle cx="30" cy="39" r="20" fill="'+c0+'" opacity=".15"/>'
        +(face?('<g transform="translate(12,21) scale(0.56)">'+face+'</g>'):'')
        +'<circle cx="52" cy="10" r="10" fill="'+c1+'"/>'
        +'<text x="52" y="14" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="'+(String(st.sound).length>1?8:10)+'" fill="#fff">'+st.sound+'</text>'
        +'</svg>'; }
    // The atlas is six equal illustrations, in reading order. The page's
    // original picture stays available if its artwork cannot load.
    function bookSlug(st) { return st.title.split(" ")[0].toLowerCase(); }
    function scene(st, n, isCover) {
      var col = n % 3, row = Math.floor(n / 3);
      var label = isCover ? st.title : st.pages[n].t;
      var fallback = isCover ? legacyCover(st, 110) : readerArt(st.pages[n]);
      return '<span class="story-scene" role="img" aria-label="' + label.replace(/"/g, "&quot;") + '">'
        + '<span class="scene-fallback">' + fallback + '</span>'
        + '<img class="story-atlas" src="/assets/books/' + bookSlug(st) + '.jpg" alt="" aria-hidden="true" loading="lazy" decoding="async" style="left:' + (-col * 100) + '%;top:' + (-row * 100) + '%" onerror="this.parentNode.classList.add(&quot;art-missing&quot;);this.style.display=&quot;none&quot;;" />'
        + '</span>';
    }
    function cover(st) { return '<span class="cover-art">' + scene(st, 0, true) + '<span class="cover-spine" aria-hidden="true"></span></span>'; }
    var BOOK = null, page = -1, returnFocus = null;
    var bkStage = document.getElementById("bkStage"), bkHead = document.getElementById("bkHead");

    function openBook(st) {
      returnFocus = document.activeElement;
      BOOK = st; page = -1;
      var bk = document.getElementById("book");
      bk.classList.add("show");
      document.body.classList.add("reading");
      document.getElementById("libraryMain").setAttribute("inert", "");
      bkHead.textContent = st.title;
      showPage();
      document.getElementById("bkNext").focus();
    }
    // color every target-sound letter in a sentence (design §8 reader)
    function readerWord(t){ try{ var ws=String(t||"").toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/);
      for(var i=0;i<ws.length;i++){ if(window.Sona&&Sona.WORD_STICKERS&&Sona.WORD_STICKERS[ws[i]]) return ws[i]; }
      return ""; }catch(e){ return ""; } }
    function tintSound(html, snd){ try{ var L=String(snd||"").charAt(0);
      return html.replace(/>([^<]+)</g, function(m, txt){
        return ">"+txt.replace(new RegExp("(["+L.toLowerCase()+L.toUpperCase()+"])","g"), '<b style="color:#ef6f23">$1</b>')+"<"; // kid accent, matches the sound chip (1c)
      }); }catch(e){ return html; } }
    function closeBook() {
      cancelBookTurn(); document.getElementById("book").classList.remove("show");
      document.body.classList.remove("reading");
      document.getElementById("libraryMain").removeAttribute("inert");
      BOOK = null;
      if (returnFocus && returnFocus.focus) returnFocus.focus();
    }

    function tappable(t) {
      return t.split(" ").map(function (w) {
        var word = w.replace(/[^a-zA-Z']/g, "");
        if (!word) return w;
        return '<span role="button" tabindex="0" aria-label="Hear ' + word + '">' + w + '</span>';
      }).join(" ");
    }
    function showPage() {
      if (!BOOK) return;
      cancelBookTurn(); pageReady = false;
      document.getElementById("bookTurn").hidden = page < 0 || page >= BOOK.pages.length;
      document.getElementById("bkMic").hidden = true;
      document.getElementById("book").removeAttribute("data-turn");
      var prev = document.getElementById("bkPrev"), next = document.getElementById("bkNext"), hear = document.getElementById("bkHear");
      next.disabled = false;
      var N = BOOK.pages.length;
      prev.classList.remove("pill"); prev.textContent = "←"; prev.setAttribute("aria-label", "Back a page");
      prev.style.visibility = page <= -1 ? "hidden" : "visible";
      bkStage.scrollTop = 0;
      document.getElementById("book").setAttribute("data-page", page < 0 ? "cover" : (page >= N ? "end" : "story"));
      document.getElementById("bkCount").textContent = page < 0 ? N + " pages" : (page >= N ? "Finished" : (page + 1) + " / " + N);
      var progress = document.getElementById("bkProgress"), dots = "";
      for (var dot = 0; dot < N; dot++) dots += '<span class="' + (dot <= page ? "done" : "") + (dot === page ? " current" : "") + '"></span>';
      progress.innerHTML = dots;
      progress.setAttribute("aria-label", page < 0 ? "Book cover" : (page >= N ? "Book finished" : "Page " + (page + 1) + " of " + N));
      if (page === -1) {
        bkStage.innerHTML = '<div class="cover-page">' + cover(BOOK) + '<div class="cover-copy"><p class="eyebrow">READ WITH ECHO</p><h1 class="bktitle">' + BOOK.title + '</h1><p class="bksub">A story full of ' + BOOK.sound + ' sounds.</p><p class="book-mic-note" id="bookMicPromise"></p></div></div>';
        document.getElementById("bookMicPromise").textContent = Sona.MIC_PROMISE;
        next.textContent = "Read & say it →"; hear.style.visibility = "hidden";
        say(BOOK.title + "! A story full of " + BOOK.sound + " sounds.");
      } else if (page >= N) {
        bkStage.innerHTML = '<div class="end-page">' + scene(BOOK, N - 1, false) + '<div class="end-copy"><p class="eyebrow">ONE LITTLE ADVENTURE, ALL READ</p><h1 class="bktitle">The End!</h1><p class="bksub">Great reading! Pick another little adventure.</p></div></div>';
        next.textContent = "Back to books"; hear.style.visibility = "hidden";
        prev.classList.add("pill"); prev.textContent = "Read again"; prev.setAttribute("aria-label", "Read again"); prev.style.visibility = "visible";
        markRead(BOOK.title);
        if (BOOK.shelfButton && !BOOK.shelfButton.querySelector(".doneStar")) {
          var star = document.createElement("span"); star.className = "doneStar"; star.setAttribute("aria-label", "Read");
          star.innerHTML = Sona.icon ? Sona.icon("star", 20) : ""; BOOK.shelfButton.appendChild(star);
          BOOK.shelfButton.setAttribute("aria-label", BOOK.shelfButton.getAttribute("aria-label") + ", read");
        }
        if (window.Sona) { Sona.confetti({ count: 130, duration: 2200 }); Sona.sfx.star(); }
        say("The end! Great reading!");
      } else {
        var pg = BOOK.pages[page];
        bkStage.innerHTML = '<article class="paperWrap"><div class="paper">' + scene(BOOK, page, false)
          + '<div class="page-copy"><div class="bktext">' + tintSound(tappable(pg.t), BOOK.sound) + '</div>'
          + '<div class="bkhint">Listen. Say your word. Turn the page.</div></div></div></article>';
        next.textContent = page === N - 1 ? "Finish →" : "Next →"; hear.style.visibility = "visible";
        bkStage.querySelectorAll(".bktext span").forEach(function (sp) {
          sp.onclick = function () {
            cancelBookTurn(); pageReady = false;
            var token = bookEpoch, word = BOOK_TARGETS[bookSlug(BOOK)][page];
            turnUI("reading", "Listen to Echo", "Then say your word.");
            say(sp.textContent.replace(/[^a-zA-Z']/g, "")).then(function () { if (liveTurn(token)) repeatPage(false); });
          };
          sp.onkeydown = function (event) { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); sp.click(); } };
        });
        repeatPage(true);
      }
    }
    document.getElementById("bkNext").onclick = function () {
      if (!BOOK || (page >= 0 && page < BOOK.pages.length && !pageReady)) return;
      unlockAudio();
      if (BOOK && page >= BOOK.pages.length) { closeBook(); return; }
      page++; showPage();
    };
    document.getElementById("bkPrev").onclick = function () {
      unlockAudio();
      if (BOOK && page >= BOOK.pages.length) { page = -1; showPage(); return; } // Read again
      if (page > -1) { page--; showPage(); }
    };
    document.getElementById("bkHear").onclick = function () { unlockAudio(); repeatPage(true); };
    document.getElementById("bkMic").onclick = function () { unlockAudio(); repeatPage(false); };
    document.getElementById("bkClose").onclick = closeBook;
    Sona.onBackground(function () {
      if (!BOOK) return;
      cancelBookTurn(); pageReady = false;
      if (page >= 0 && page < BOOK.pages.length) turnUI("paused", "Take a little break", "Tap Resume when you're ready.");
    });

    document.addEventListener("keydown", function (event) {
      if (!BOOK) return;
      if (event.key === "Escape") { event.preventDefault(); closeBook(); return; }
      if (event.key === "ArrowRight") { event.preventDefault(); document.getElementById("bkNext").click(); }
      if (event.key === "ArrowLeft") { event.preventDefault(); document.getElementById("bkPrev").click(); }
      if (event.key === "Tab") {
        var controls = document.getElementById("book").querySelectorAll("button, [tabindex='0']"), visible = [];
        for (var i = 0; i < controls.length; i++) if (!controls[i].disabled && getComputedStyle(controls[i]).visibility !== "hidden" && controls[i].getClientRects().length) visible.push(controls[i]);
        var first = visible[0], last = visible[visible.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    /* ---- word box ---- */
    var wbHost = document.getElementById("wbSounds"), grid = document.getElementById("wordgrid");
    var allSounds = Object.keys(Sona.WORDS);
    // the child's focus sounds lead the chip row; every other sound follows
    var focus = (profile.focusSounds || []).filter(function (s) { return allSounds.indexOf(s) !== -1; });
    var order = focus.concat(allSounds.filter(function (s) { return focus.indexOf(s) === -1; }));
    var curSound = order[0];
    function paintChips() {
      wbHost.innerHTML = "";
      if (order.length < 2) { wbHost.style.display = "none"; return; }
      order.forEach(function (s) {
        var c = document.createElement("div");
        c.className = "sound" + (s === curSound ? " on" : "");
        c.textContent = s;
        c.onclick = function () { if (window.Sona) Sona.sfx.tap(); curSound = s; paintChips(); paintGrid(); };
        wbHost.appendChild(c);
      });
    }
    function paintGrid() {
      grid.innerHTML = "";
      (Sona.WORDS[curSound] || []).forEach(function (w) {
        var c = document.createElement("div");
        c.className = "wcard";
        c.innerHTML = '<span class="we">' + ((window.Sona&&Sona.pic)?Sona.pic(w.w,w.e,42):w.e) + '</span><span class="ww">' + w.w + '</span>';
        c.onclick = function () { if (playing) return; if (window.Sona) Sona.pop(w.e, { y: window.innerHeight * 0.3 }); say(w.w); };
        grid.appendChild(c);
      });
    }
    paintChips(); paintGrid();
  </script>
</body>
</html>
