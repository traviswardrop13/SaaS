<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sona.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#fff7ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    body{background:linear-gradient(180deg,#fff7ec,#ffe9d2) fixed;}
    .shelfhead{display:flex;align-items:center;gap:10px;margin:18px 2px 8px;}
    .shelfhead h2{margin:0;}
    .shelfhead .tag{font-size:11px;font-weight:800;color:#46a302;background:#d7ffb8;border-radius:99px;padding:3px 9px;}
    /* story shelf */
    .shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .bookBtn{border:none;cursor:pointer;border-radius:18px;padding:16px 12px;text-align:center;color:#fff;
      font-family:"Baloo 2";font-weight:800;transition:transform .06s;box-shadow:0 6px 0 0 rgba(0,0,0,.16);}
    .bookBtn:active{transform:translateY(4px);box-shadow:0 1px 0 0 rgba(0,0,0,.16);}
    .bookBtn .be{font-size:44px;display:block;}
    .bookBtn .bt{display:block;font-size:15px;margin-top:6px;line-height:1.2;}
    .bookBtn .bs{display:block;font-size:11px;opacity:.85;margin-top:3px;letter-spacing:.05em;text-transform:uppercase;}
    /* story reader */
    #reader{display:none;}
    #reader.show{display:block;}
    #shelves.hidden{display:none;}
    .line{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:16px;padding:12px 14px;margin-top:10px;
      box-shadow:0 4px 12px rgba(120,60,0,.08);}
    .line.now{outline:3px solid var(--orange);}
    .lineplay{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:15px;cursor:pointer;box-shadow:0 3px 0 0 var(--blue-d);}
    .lineplay:active{transform:translateY(2px);box-shadow:0 1px 0 0 var(--blue-d);}
    .linetext{font-family:"Baloo 2";font-weight:700;font-size:18px;color:var(--ink);line-height:1.45;padding-top:5px;}
    .linetext span{cursor:pointer;border-radius:6px;padding:1px 2px;}
    .linetext span:active{background:#ffe7c8;}
    /* word box */
    .wordgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
    .wcard{border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:16px;padding:14px 6px 10px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .06s;}
    .wcard:active{transform:scale(.94);}
    .wcard .we{font-size:42px;line-height:1;}
    .wcard .ww{font-family:"Baloo 2";font-weight:800;font-size:13px;color:var(--blue-d);}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div class="brand"><span class="leo">📚</span> Library</div>
      <div class="pills">
        <span class="pill" style="color:var(--orange-d);">🪙 <span id="coins">0</span></span>
        <a class="iconbtn" href="/home.html" title="Home" style="display:flex;align-items:center;justify-content:center;">✕</a>
      </div>
    </header>

    <div id="shelves">
      <div class="card" style="display:flex;gap:12px;align-items:center;">
        <img src="/coach/leo.png" alt="Leo" style="width:58px;height:58px;object-fit:contain;flex:0 0 auto;" />
        <div><b style="font-family:'Baloo 2';font-size:17px;">Just for fun!</b>
        <p class="muted" style="font-size:13px;font-weight:700;">No scores in here — listen to stories and play with words as much as you like.</p></div>
      </div>

      <div class="shelfhead"><h2>Sound stories</h2><span class="tag">LEO READS</span></div>
      <div class="shelf" id="shelf"></div>

      <div class="shelfhead"><h2>Word box</h2><span class="tag">TAP TO HEAR</span></div>
      <div class="sounds" id="wbSounds" style="margin-top:2px;"></div>
      <div class="wordgrid" id="wordgrid"></div>
    </div>

    <!-- story reader -->
    <div id="reader">
      <button class="btn ghost" id="readerBack" style="width:auto;padding:10px 18px;margin-bottom:6px;">← All stories</button>
      <div class="card" style="text-align:center;">
        <div id="storyEmoji" style="font-size:64px;"></div>
        <h1 id="storyTitle" style="margin-top:6px;"></h1>
        <p class="muted" id="storySub" style="font-size:13px;font-weight:700;"></p>
        <button class="btn" id="readAll" style="margin-top:12px;">🔊&nbsp;&nbsp;Read to me</button>
      </div>
      <div id="lines"></div>
      <p class="muted" style="text-align:center;margin:16px 0;font-size:13px;font-weight:700;">Tap any word to hear it! 🎧</p>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script>
    var profile = Sona.getProfile();
    var PITCH = Sona.VOICE_PITCH || 1.08;
    document.getElementById("coins").textContent = Sona.getCoins();

    var STORIES = [
      { sound: "R", emoji: "🐰", title: "Rory the Rabbit", colors: ["#ff7a6e", "#ef6557"], lines: [
        "Rory the rabbit rides a red rocket.",
        "The rocket roars over the rainbow.",
        "Rory sees a robot on a rock.",
        "The robot gives Rory a ring.",
        "They race around the river.",
        "Rory roars: hooray, hooray!" ] },
      { sound: "S", emoji: "🦭", title: "Sunny the Seal", colors: ["#62bdff", "#46a6ec"], lines: [
        "Sunny the seal sits in the sun.",
        "Sunny sees a silly snake.",
        "The snake slides on the soft sand.",
        "They sip soup with a silver spoon.",
        "Sunny sings a silly song.",
        "So sleepy! Sunny says goodnight." ] },
      { sound: "L", emoji: "🦁", title: "Lily the Lion", colors: ["#ffd45e", "#f0bb33"], lines: [
        "Lily the lion licks a lemon lollipop.",
        "Lily leaps over a little log.",
        "A ladybug lands on a leaf.",
        "Lily laughs: la la la!",
        "They look at a yellow balloon.",
        "Lily loves to play all day." ] },
      { sound: "K", emoji: "🐨", title: "Kiki the Koala", colors: ["#7dd470", "#63bd57"], lines: [
        "Kiki the koala bakes a cake.",
        "A kind king comes with a key.",
        "The king flies a colorful kite.",
        "Kiki gives the king a cookie.",
        "A cat and a cow come to play.",
        "What a cool day for Kiki!" ] },
    ];

    /* ---- speech (no scoring, just listening) ---- */
    var audioCtx = null, playing = false;
    function getCtx() { if (!audioCtx) { var AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); } if (audioCtx.state === "suspended") audioCtx.resume(); return audioCtx; }
    function say(text) {
      return new Promise(function (resolve) {
        if (!text) return resolve();
        fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text, voice: profile.voiceId || "" }) })
          .then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer(); })
          .then(function (buf) {
            var bytes = new Uint8Array(buf), ctx = getCtx(), n = bytes.byteLength >> 1;
            var ab = ctx.createBuffer(1, n, 24000), ch = ab.getChannelData(0);
            var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            for (var i = 0; i < n; i++) ch[i] = dv.getInt16(i * 2, true) / 32768;
            var s = ctx.createBufferSource(); s.buffer = ab; s.playbackRate.value = PITCH; s.connect(ctx.destination); s.onended = resolve; s.start();
          })
          .catch(function () { setTimeout(resolve, 600 + text.length * 40); });
      });
    }

    /* ---- story shelf ---- */
    var shelf = document.getElementById("shelf");
    STORIES.forEach(function (st) {
      var b = document.createElement("button");
      b.className = "bookBtn";
      b.style.background = "linear-gradient(160deg," + st.colors[0] + "," + st.colors[1] + ")";
      b.innerHTML = '<span class="be">' + st.emoji + '</span><span class="bt">' + st.title + '</span><span class="bs">' + st.sound + ' sound</span>';
      b.onclick = function () { if (window.Sona) Sona.sfx.tap(); openStory(st); };
      shelf.appendChild(b);
    });

    function openStory(st) {
      document.getElementById("shelves").classList.add("hidden");
      document.getElementById("reader").classList.add("show");
      document.getElementById("storyEmoji").textContent = st.emoji;
      document.getElementById("storyTitle").textContent = st.title;
      document.getElementById("storySub").textContent = "A story full of " + st.sound + " sounds";
      var host = document.getElementById("lines");
      host.innerHTML = "";
      st.lines.forEach(function (ln) {
        var row = document.createElement("div");
        row.className = "line";
        var words = ln.split(" ").map(function (w) { return "<span>" + w + "</span>"; }).join(" ");
        row.innerHTML = '<button class="lineplay">▶</button><div class="linetext">' + words + '</div>';
        row.querySelector(".lineplay").onclick = function () { if (playing) return; playing = true; row.classList.add("now"); say(ln).then(function () { row.classList.remove("now"); playing = false; }); };
        row.querySelectorAll(".linetext span").forEach(function (sp) {
          sp.onclick = function () { if (playing) return; playing = true; say(sp.textContent.replace(/[^a-zA-Z']/g, "")).then(function () { playing = false; }); };
        });
        host.appendChild(row);
      });
      document.getElementById("readAll").onclick = async function () {
        if (playing) return; playing = true;
        var rows = [].slice.call(host.children);
        for (var i = 0; i < rows.length; i++) {
          rows[i].classList.add("now");
          rows[i].scrollIntoView({ behavior: "smooth", block: "center" });
          await say(st.lines[i]);
          rows[i].classList.remove("now");
        }
        playing = false;
        if (window.Sona) { Sona.sfx.star(); }
      };
    }
    document.getElementById("readerBack").onclick = function () {
      document.getElementById("reader").classList.remove("show");
      document.getElementById("shelves").classList.remove("hidden");
    };

    /* ---- word box ---- */
    var wbHost = document.getElementById("wbSounds"), grid = document.getElementById("wordgrid");
    var allSounds = Object.keys(Sona.WORDS);
    var focus = (profile.focusSounds || []).filter(function (s) { return allSounds.indexOf(s) !== -1; });
    var order = focus.concat(allSounds.filter(function (s) { return focus.indexOf(s) === -1; }));
    var curSound = order[0];
    function paintChips() {
      wbHost.innerHTML = "";
      order.forEach(function (s) {
        var c = document.createElement("div");
        c.className = "sound" + (s === curSound ? " on" : "");
        c.textContent = s;
        c.onclick = function () { if (window.Sona) Sona.sfx.tap(); curSound = s; paintChips(); paintGrid(); };
        wbHost.appendChild(c);
      });
    }
    function paintGrid() {
      grid.innerHTML = "";
      (Sona.WORDS[curSound] || []).forEach(function (w) {
        var c = document.createElement("div");
        c.className = "wcard";
        c.innerHTML = '<span class="we">' + w.e + '</span><span class="ww">' + w.w + '</span>';
        c.onclick = function () { if (playing) return; playing = true; if (window.Sona) Sona.pop(w.e, { y: window.innerHeight * 0.3 }); say(w.w).then(function () { playing = false; }); };
        grid.appendChild(c);
      });
    }
    paintChips(); paintGrid();
  </script>
</body>
</html>
