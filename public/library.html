<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Library</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/sona.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#fff6e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    body{background:linear-gradient(180deg,#fff7ec,#ffe9d2) fixed;}
    .shelfhead{display:flex;align-items:center;gap:10px;margin:18px 2px 8px;}
    .shelfhead h2{margin:0;}
    /* warm tag pair (fix pack 1c) — the green pair was legacy Duolingo chrome */
    .shelfhead .tag{font-size:11px;font-weight:800;color:#7a5200;background:#ffe7c4;border-radius:99px;padding:3px 9px;}
    /* story shelf (D1): covers standing on rails — no gradient buttons */
    .shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;}
    .bookBtn{position:relative;border:none;cursor:pointer;background:none;padding:0;text-align:center;
      font-family:"Baloo 2";font-weight:800;transition:transform .06s;display:flex;flex-direction:column;align-items:center;}
    .bookBtn:active{transform:translateY(2px);}
    .bookBtn .cvr{position:relative;display:block;z-index:1;}
    .bookBtn .rail{display:block;width:100%;height:9px;border-radius:3px;background:#ecd2a8;box-shadow:0 3px 0 #d9bc8c;margin-top:-5px;}
    .bookBtn .bt{display:block;font-size:13px;margin-top:8px;line-height:1.2;color:#4a2c14;}
    .bookBtn .bs{display:block;font-size:9.5px;margin-top:2px;letter-spacing:.06em;text-transform:uppercase;color:#b08d63;}
    .bookBtn .doneStar{position:absolute;top:-7px;left:2px;z-index:2;filter:drop-shadow(0 2px 2px rgba(120,60,10,.3));}
    /* word box */
    .wordgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
    .wcard{border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:16px;padding:14px 6px 10px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .06s;}
    .wcard:active{transform:scale(.94);}
    .wcard .we{font-size:42px;line-height:1;}
    .wcard .ww{font-family:"Baloo 2";font-weight:800;font-size:13px;color:var(--blue-d);}

    /* ── full-screen picture book (D2): the page is PAPER ── */
    #book{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#fff6e9;}
    #book.show{display:flex;}
    .bktop{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;}
    .bkclose{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:#b9a98c;font-size:18px;font-weight:800;cursor:pointer;
      box-shadow:0 3px 0 0 rgba(120,80,20,.15);flex:0 0 auto;}
    #bkHead{flex:1;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:14px;}
    .bkstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px;}
    /* the paper spread + the page-edge stack (progress you can feel) */
    .paperWrap{position:relative;width:100%;max-width:420px;}
    .pstack{position:absolute;inset:0;border-radius:18px;background:#f9efdc;transform:translate(5px,5px);}
    .pstack.two{background:#f0e2c8;transform:translate(9px,9px);}
    .paper{position:relative;background:#fffdf7;border-radius:18px;box-shadow:0 14px 30px rgba(140,90,20,.16);padding:22px 18px 24px 30px;overflow:visible;}
    .paper::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;border-radius:18px 0 0 18px;background:linear-gradient(90deg,rgba(150,95,30,.13),rgba(150,95,30,0));}
    .ribbon{position:absolute;top:-2px;right:16px;width:31px;height:62px;background:#ff7a6e;
      clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);display:flex;flex-direction:column;align-items:center;
      font-family:"Baloo 2";font-weight:800;font-size:11px;color:#fff;padding-top:8px;line-height:1.25;filter:drop-shadow(0 2px 2px rgba(120,60,10,.2));}
    .bkart{width:min(52vw,190px);height:min(52vw,190px);margin:0 auto 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
    .bkpic{line-height:1;filter:drop-shadow(0 10px 16px rgba(150,90,10,.16));animation:bkfloat 3.4s ease-in-out infinite;}
    @keyframes bkfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .bktext{margin-top:10px;font-family:"Baloo 2";font-weight:800;font-size:clamp(20px,5.8vw,25px);color:#5b2d05;line-height:1.4;}
    .bktext span{cursor:pointer;border-radius:8px;padding:0 2px;}
    .bktext span:active{background:#ffe2b3;}
    .bkhint{margin-top:10px;font-weight:800;font-size:11px;letter-spacing:.08em;color:#a17c4a;}
    .pgEcho{position:absolute;left:-12px;bottom:-16px;width:72px;height:72px;transform:rotate(-6deg);filter:drop-shadow(0 5px 7px rgba(120,60,10,.25));}
    .bktitle{font-family:"Baloo 2";font-weight:800;font-size:clamp(30px,8vw,40px);color:#5b2d05;margin-top:18px;}
    .bksub{font-weight:800;color:rgba(91,45,5,.7);margin-top:8px;}
    .bkbottom{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 18px calc(22px + env(safe-area-inset-bottom));}
    .bknav{border:none;border-radius:16px;padding:15px 22px;font-family:"Baloo 2";font-weight:800;font-size:16px;cursor:pointer;
      letter-spacing:.03em;transition:transform .05s;}
    .bknav:active{transform:translateY(3px);}
    .bknext{flex:1;max-width:280px;color:#fff;text-transform:uppercase;white-space:nowrap;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 5px 0 0 #ef6f23;}
    .bknext:active{box-shadow:0 1px 0 0 #ef6f23;}
    .bkback{width:44px;height:44px;border-radius:50%;padding:0;background:#fff;color:#8a6f52;font-size:18px;box-shadow:0 5px 0 0 rgba(120,80,20,.18);flex:0 0 auto;}
    .bkback.pill{width:auto;border-radius:16px;padding:15px 20px;font-size:15px;}
    /* Hear it: white pill with the warm speaker (was a blue circle) */
    .bkhear{display:flex;align-items:center;gap:7px;border:none;border-radius:99px;background:#fff;color:#ef6f23;
      font-family:"Baloo 2";font-weight:800;font-size:14px;padding:12px 18px;cursor:pointer;box-shadow:0 5px 0 0 rgba(120,80,20,.18);flex:0 0 auto;}
    .bkhear:active{transform:translateY(3px);box-shadow:0 1px 0 0 rgba(120,80,20,.18);}
    @media (prefers-reduced-motion:reduce){ .bkpic{animation:none;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div class="brand"><span class="leo"><svg viewBox="0 0 64 64" style="width:22px;height:22px;vertical-align:-4px"><path d="M10 14c8-4 15-4 22 0v38c-7-4-14-4-22 0Z" fill="#4db3f2"/><path d="M54 14c-8-4-15-4-22 0v38c7-4 14-4 22 0Z" fill="#2a8fd4"/><line x1="32" y1="14" x2="32" y2="52" stroke="#1c6fa8" stroke-width="2"/><circle cx="19" cy="22" r="3" fill="#fff" opacity=".8"/></svg></span> Library</div>
      <div class="pills">
        <a class="iconbtn" href="/today.html" title="Home" style="display:flex;align-items:center;justify-content:center;">✕</a>
      </div>
    </header>

    <div class="card" style="display:flex;gap:12px;align-items:center;">
      <img src="/coach/echo/echo-idle.svg" alt="Echo" style="width:58px;height:58px;object-fit:contain;flex:0 0 auto;" />
      <div><b style="font-family:'Baloo 2';font-size:17px;">Just for fun!</b>
      <p class="muted" style="font-size:13px;font-weight:700;">No scores in here — read picture books with Echo and play with words.</p></div>
    </div>

    <button id="advTile" onclick="location.href='/story.html'" style="width:100%;border:none;cursor:pointer;border-radius:18px;padding:16px;margin-top:14px;text-align:left;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#35407e,#6a5aa8 70%,#8a6fc4);box-shadow:0 6px 0 rgba(30,24,70,.35);">
      <svg viewBox="0 0 64 64" style="width:44px;height:44px;flex:0 0 auto"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg>
      <span><b id="advTitle" style="display:block;font-family:'Baloo 2';font-weight:800;font-size:17px;color:#fff;">Your Adventure</b>
      <span id="advSub" style="display:block;font-weight:800;font-size:12px;color:rgba(255,255,255,.85);margin-top:2px;">A brand-new story, written just for you — never the same twice</span></span>
    </button>

    <div class="shelfhead"><h2>Sound stories</h2><span class="tag">ECHO READS</span></div>
    <div class="shelf" id="shelf"></div>

    <div class="shelfhead"><h2>Word box</h2><span class="tag">TAP TO HEAR</span></div>
    <div class="sounds" id="wbSounds" style="margin-top:2px;"></div>
    <div class="wordgrid" id="wordgrid"></div>
  </div>

  <!-- full-screen picture book -->
  <div id="book">
    <div class="bktop">
      <button class="bkclose" id="bkClose">✕</button>
      <div id="bkHead"></div>
      <div style="width:44px;flex:0 0 auto;"></div>
    </div>
    <div class="bkstage" id="bkStage"></div>
    <div class="bkbottom">
      <button class="bknav bkback" id="bkPrev" aria-label="Back a page">←</button>
      <button class="bkhear" id="bkHear" title="Hear it again"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#ef6f23"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#ef6f23" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Hear it</button>
      <button class="bknav bknext" id="bkNext">Next →</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script>
    var profile = Sona.getProfile();
    try{ var nm=(profile.childName||"").trim(), it=(profile.interests&&profile.interests[0])||"";
      if(nm) document.getElementById("advTitle").textContent=nm+"'s Adventure";
      if(it) document.getElementById("advSub").textContent="A brand-new "+it+" story, made just for "+(nm||"you")+" — never the same twice";
    }catch(e){}
    var PITCH = Sona.VOICE_PITCH || 1.15;

    var STORIES = [
      { sound: "R", emoji: "🐰", title: "Rory the Rabbit", colors: ["#ff7a6e", "#ef6557"], pages: [
        { e: "🚀", t: "Rory the rabbit rides a red rocket." },
        { e: "🌈", t: "The rocket roars over the rainbow." },
        { e: "🤖", t: "Rory sees a robot on a rock." },
        { e: "💍", t: "The robot gives Rory a ring." },
        { e: "🌊", t: "They race around the river." },
        { e: "🎉", t: "Rory roars: hooray, hooray!" } ] },
      { sound: "R", emoji: "🤖", title: "Reba the Robot", colors: ["#ff9a6e", "#ef7d47"], pages: [
        { e: "🤖", t: "Reba the robot runs on a road." },
        { e: "🌹", t: "Reba rolls past a red rose." },
        { e: "🐇", t: "A rabbit races right by." },
        { e: "🎀", t: "Reba wraps it in a ribbon." },
        { e: "🌧️", t: "Rain! They run for the roof." },
        { e: "🌈", t: "Reba the robot: ready, ready!" } ] },
      { sound: "R", emoji: "🐓", title: "Ruby the Rooster", colors: ["#ff6e8e", "#ef5772"], pages: [
        { e: "🐓", t: "Ruby the rooster rises at dawn." },
        { e: "🌅", t: "Ruby crows: rise and shine!" },
        { e: "🏃", t: "She runs around the red barn." },
        { e: "🪱", t: "Ruby finds a wriggly worm." },
        { e: "🌽", t: "The rooster pecks rows of corn." },
        { e: "💤", t: "Ruby rests. What a great run!" } ] },
      { sound: "R", emoji: "🦝", title: "Remy the Raccoon", colors: ["#ffb066", "#ef923c"], pages: [
        { e: "🦝", t: "Remy the raccoon roams the river." },
        { e: "🪨", t: "He reaches under a round rock." },
        { e: "🍇", t: "Remy grabs a ripe, red grape." },
        { e: "🚣", t: "He rows a raft in the rain." },
        { e: "🌿", t: "Remy rests in the reeds." },
        { e: "⭐", t: "Remy the raccoon: hooray!" } ] },
      { sound: "R", emoji: "🦏", title: "Rex the Rhino", colors: ["#ff7a6e", "#e05a9c"], pages: [
        { e: "🦏", t: "Rex the rhino runs really fast." },
        { e: "🛣️", t: "He roars down the rocky road." },
        { e: "🌳", t: "Rex rolls in the rich, green grass." },
        { e: "🍎", t: "He reaches for a red apple." },
        { e: "🤝", t: "Rex meets a friendly rabbit." },
        { e: "🎉", t: "Run, Rex, run! Hooray!" } ] },
      { sound: "S", emoji: "🦭", title: "Sunny the Seal", colors: ["#62bdff", "#46a6ec"], pages: [
        { e: "☀️", t: "Sunny the seal sits in the sun." },
        { e: "🐍", t: "Sunny sees a silly snake." },
        { e: "🏖️", t: "The snake slides on the soft sand." },
        { e: "🥄", t: "They sip soup with a silver spoon." },
        { e: "🎵", t: "Sunny sings a silly song." },
        { e: "😴", t: "So sleepy! Sunny says goodnight." } ] },
      { sound: "L", emoji: "🦁", title: "Lily the Lion", colors: ["#ffd45e", "#f0bb33"], pages: [
        { e: "🍭", t: "Lily the lion licks a lemon lollipop." },
        { e: "🪵", t: "Lily leaps over a little log." },
        { e: "🐞", t: "A ladybug lands on a leaf." },
        { e: "😄", t: "Lily laughs: la la la!" },
        { e: "🎈", t: "They look at a yellow balloon." },
        { e: "💛", t: "Lily loves to play all day." } ] },
      { sound: "K", emoji: "🐨", title: "Kiki the Koala", colors: ["#7dd470", "#63bd57"], pages: [
        { e: "🍰", t: "Kiki the koala bakes a cake." },
        { e: "🔑", t: "A kind king comes with a key." },
        { e: "🪁", t: "The king flies a colorful kite." },
        { e: "🍪", t: "Kiki gives the king a cookie." },
        { e: "🐮", t: "A cat and a cow come to play." },
        { e: "🌞", t: "What a cool day for Kiki!" } ] },
      { sound: "SH", emoji: "🐑", title: "Shelly the Sheep", colors: ["#c08cf0", "#a86fe0"], pages: [
        { e: "👟", t: "Shelly the sheep shines her shoes." },
        { e: "🐚", t: "She shows a shiny shell to a fish." },
        { e: "🚢", t: "They sail on a big ship. Shhh!" },
        { e: "⭐", t: "Shelly makes a wish on a star." },
        { e: "🥤", t: "She sips a milkshake — so fresh." },
        { e: "😴", t: "Shhh… Shelly is sleeping now." } ] },
      { sound: "CH", emoji: "🐥", title: "Charlie the Chick", colors: ["#ff9446", "#ef7d2c"], pages: [
        { e: "🍒", t: "Charlie the chick chews chewy cherries." },
        { e: "🚂", t: "Charlie rides the choo-choo train." },
        { e: "🧀", t: "He munches cheese at lunch." },
        { e: "🐿️", t: "A chipmunk sits on a chair." },
        { e: "🍫", t: "They share chocolate chips. Crunch!" },
        { e: "😁", t: "Charlie chirps: cheep, cheep, cheep." } ] },
      { sound: "TH", emoji: "🦥", title: "Theo the Sloth", colors: ["#9aa7ff", "#7f8eef"], pages: [
        { e: "💭", t: "Theo the sloth thinks happy thoughts." },
        { e: "3️⃣", t: "Theo counts: one, two, three!" },
        { e: "👍", t: "He gives a big thumbs up." },
        { e: "🦷", t: "Theo brushes his three teeth." },
        { e: "🛁", t: "Then a warm bath — both feet in." },
        { e: "🌙", t: "Thank you, moon. Theo says goodnight." } ] },
      { sound: "G", emoji: "🐐", title: "Gus the Goat", colors: ["#58c7b5", "#3fae9c"], pages: [
        { e: "🌱", t: "Gus the goat grows a green garden." },
        { e: "🎁", t: "A goose gives Gus a gift." },
        { e: "🎸", t: "Gus plays a goofy guitar." },
        { e: "🍇", t: "They gobble grapes by the gate." },
        { e: "🐛", t: "A bug giggles on the grass." },
        { e: "🌟", t: "Good game, Gus. Goodnight!" } ] },
      { sound: "F", emoji: "🦊", title: "Fifi the Fox", colors: ["#ff7fab", "#ef6595"], pages: [
        { e: "🪶", t: "Fifi the fox finds four feathers." },
        { e: "🐟", t: "Fifi feeds a funny fish." },
        { e: "🔥", t: "They warm five feet by the fire." },
        { e: "🦋", t: "A butterfly flies fast — wow!" },
        { e: "🎉", t: "Fifi has fun with her friends." },
        { e: "👋", t: "Fifi waves: farewell, farewell!" } ] },
    ];

    /* ---- speech (no scoring, just listening) ---- */
    var audioCtx = null, playing = false, curSrc = null, sayToken = 0;
    function getCtx() { if (!audioCtx) { var AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); } if (audioCtx.state === "suspended") audioCtx.resume(); return audioCtx; }
    function stopSpeech() { sayToken++; try { curSrc && curSrc.stop(); } catch (e) {} curSrc = null; playing = false; }
    function say(text) {
      return new Promise(function (resolve) {
        if (!text) return resolve();
        var tok = ++sayToken;
        playing = true;
        fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text, voice: profile.voiceId || "" }) })
          .then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer(); })
          .then(function (buf) {
            if (tok !== sayToken) { playing = false; return resolve(); } // superseded — don't overlap
            var bytes = new Uint8Array(buf), ctx = getCtx(), n = bytes.byteLength >> 1;
            var ab = ctx.createBuffer(1, n, 24000), ch = ab.getChannelData(0);
            var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            for (var i = 0; i < n; i++) ch[i] = dv.getInt16(i * 2, true) / 32768;
            var s = ctx.createBufferSource(); s.buffer = ab; s.playbackRate.value = PITCH; var g = ctx.createGain(); g.gain.value = (profile.volume != null ? profile.volume : 0.8); s.connect(g); g.connect(ctx.destination);
            curSrc = s;
            s.onended = function () { playing = false; curSrc = null; resolve(); };
            s.start();
          })
          .catch(function () { setTimeout(function () { playing = false; resolve(); }, 600 + text.length * 40); });
      });
    }

    /* ---- shelf ---- */
    // the child's focus-sound books come first; the rest keep their order
    var focusOrder = profile.focusSounds || [];
    STORIES.sort(function (a, b) {
      var ai = focusOrder.indexOf(a.sound), bi = focusOrder.indexOf(b.sound);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });
    var shelf = document.getElementById("shelf");
    // R-era: Sona goes deep on R first, so non-R books read as "coming soon"
    // (locked). SLP-referred families keep the full library (clinics target
    // any sound). New letters unlock their books as they ship.
    var slpFull = false; try { slpFull = !!(Sona.slpCode && Sona.slpCode()); } catch (e) {}
    // read-through star (D1): a book read to The End pins the gold star to
    // its cover. Local flag by title; Story Time's story.done counts too.
    var LIBKEY = "sona.lib.read.v1";
    function libRead() { try { return JSON.parse(localStorage.getItem(LIBKEY) || "{}"); } catch (e) { return {}; } }
    function markRead(title) { try { var m = libRead(); if (!m[title]) { m[title] = 1; localStorage.setItem(LIBKEY, JSON.stringify(m)); } } catch (e) {} }
    function wasRead(st) {
      try { if (libRead()[st.title]) return true; } catch (e) {}
      try { var g = JSON.parse(localStorage.getItem("sona.games.v1") || "{}"); return !!(g[st.sound] && g[st.sound].story && g[st.sound].story.done); } catch (e) { return false; }
    }
    STORIES.forEach(function (st) {
      var locked = !slpFull && st.sound !== "R";
      var b = document.createElement("button");
      b.className = "bookBtn" + (locked ? " soon" : "");
      if (locked) b.style.opacity = ".55";
      b.innerHTML = '<span class="cvr">' + cover(st, 76) + '</span>'
        + (!locked && wasRead(st) ? '<span class="doneStar">' + ((window.Sona && Sona.icon) ? Sona.icon("star", 22) : "") + '</span>' : "")
        + '<span class="rail"></span>'
        + '<span class="bt">' + st.title + '</span>'
        + '<span class="bs">' + (locked ? 'COMING SOON' : st.pages.length + ' pages') + '</span>';
      b.onclick = locked
        ? function () { if (window.Sona) { Sona.sfx.tap(); if (Sona.pop) Sona.pop("New books are on the way!", { color: "#ff8a3d" }); } }
        : function () { if (window.Sona) Sona.sfx.tap(); openBook(st); };
      shelf.appendChild(b);
    });

    /* ---- the picture book: one picture + one line per page ---- */
    // Designed reader art (design board sections 11-12): every R-book page
    // (and the SH pages) swaps its emoji for a scene sticker. Values are
    // inline SVG (new rrb-*/rb-* art), a word (reuse the shipped word-box
    // sticker via Sona.pic), or __star (the kit star). Anything unmapped

    function readerArt(pg){
      var a=READER_ART[pg.e];
      if(a){
        if(a==="__star") return (window.Sona&&Sona.icon)?Sona.icon("star",116):(pg.e||"");
        if(a.charAt(0)==="<") return a;
        return (window.Sona&&Sona.pic)?Sona.pic(a,pg.e,116):(pg.e||"");
      }
      return (window.Sona&&Sona.pic)?Sona.pic(readerWord(pg.t),pg.e,118):(pg.e||"");
    }
    function cover(st,w){ var c0=st.colors[0],c1=st.colors[1];
      var face=(window.Sona&&Sona.COVER_FACES&&Sona.COVER_FACES[st.sound])||"";
      return '<svg viewBox="0 0 60 76" style="width:'+w+'px;height:'+Math.round(w*76/60)+'px;overflow:visible">'
        +'<rect x="2" y="8" width="52" height="62" rx="7" fill="#fff" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))"/>'
        +'<rect x="2" y="8" width="6" height="62" rx="3" fill="'+c0+'"/>'
        +'<circle cx="30" cy="39" r="20" fill="'+c0+'" opacity=".15"/>'
        +(face?('<g transform="translate(12,21) scale(0.56)">'+face+'</g>'):'')
        +'<circle cx="52" cy="10" r="10" fill="'+c1+'"/>'
        +'<text x="52" y="14" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="'+(String(st.sound).length>1?8:10)+'" fill="#fff">'+st.sound+'</text>'
        +'</svg>'; }
    // per-story wash for the reader background (D2): story tint over cream
    function hexRgba(hex, a) { try { var h = hex.replace("#", ""); return "rgba(" + parseInt(h.substr(0, 2), 16) + "," + parseInt(h.substr(2, 2), 16) + "," + parseInt(h.substr(4, 2), 16) + "," + a + ")"; } catch (e) { return "rgba(255,122,110," + a + ")"; } }
    var BOOK = null, page = -1; // -1 = cover, pages.length = The End
    var bkStage = document.getElementById("bkStage"), bkHead = document.getElementById("bkHead");

    function openBook(st) {
      BOOK = st; page = -1;
      var bk = document.getElementById("book");
      bk.classList.add("show");
      // tint layers OVER the opaque cream (backgroundImage keeps the base color)
      bk.style.backgroundImage = "linear-gradient(180deg," + hexRgba(st.colors[0], .18) + ", #fff6e9 52%, #ffedd8)";
      bkHead.textContent = st.title + " · " + st.sound + " sound";
      bkHead.style.color = st.colors[1];
      showPage();
    }
    // color every target-sound letter in a sentence (design §8 reader)
    function readerWord(t){ try{ var ws=String(t||"").toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/);
      for(var i=0;i<ws.length;i++){ if(window.Sona&&Sona.WORD_STICKERS&&Sona.WORD_STICKERS[ws[i]]) return ws[i]; }
      return ""; }catch(e){ return ""; } }
    function tintSound(html, snd){ try{ var L=String(snd||"").charAt(0);
      return html.replace(/>([^<]+)</g, function(m, txt){
        return ">"+txt.replace(new RegExp("(["+L.toLowerCase()+L.toUpperCase()+"])","g"), '<b style="color:#ef6f23">$1</b>')+"<"; // kid accent, matches the sound chip (1c)
      }); }catch(e){ return html; } }
    function closeBook() { stopSpeech(); document.getElementById("book").classList.remove("show"); BOOK = null; }

    function tappable(t) {
      return t.split(" ").map(function (w) { return "<span>" + w + "</span>"; }).join(" ");

      var e = document.getElementById("pgEcho");
      if (e) e.src = "/coach/echo/echo-listening.svg";
      return say(text).then(function () { var e2 = document.getElementById("pgEcho"); if (e2) e2.src = "/coach/echo/echo-idle.svg"; });
    }
    function showPage() {
      stopSpeech();
      var prev = document.getElementById("bkPrev"), next = document.getElementById("bkNext"), hear = document.getElementById("bkHear");
      prev.classList.remove("pill"); prev.textContent = "←";
      prev.style.visibility = page <= -1 ? "hidden" : "visible";
      var N = BOOK.pages.length, left = N - 1 - page; // pages after this one
      if (page === -1) {
        bkStage.innerHTML = '<div class="bkpic">' + cover(BOOK, 150) + '</div><div class="bktitle">' + BOOK.title + '</div><div class="bksub">A story full of ' + BOOK.sound + ' sounds — Echo reads it to you!</div>';
        next.textContent = "Start →"; hear.style.visibility = "hidden";
        say(BOOK.title + "! A story full of " + BOOK.sound + " sounds.");
      } else if (page >= N) {
        // The End: star burst IN the art panel, no page-edge stack left
        bkStage.innerHTML = '<div class="paperWrap"><div class="paper">'
          + '<div class="bkart" style="background:radial-gradient(circle,rgba(255,210,28,.3),rgba(255,210,28,0) 72%)"><div class="bkpic" style="filter:none"><svg viewBox="0 0 64 64" style="width:120px;height:120px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg></div></div>'
          + '<div class="bktitle" style="margin-top:4px;">The End!</div><div class="bksub">Great listening! Read it again or pick another story.</div>'
          + '<img class="pgEcho" id="pgEcho" src="/coach/echo/echo-celebrate.svg" alt="Echo" />'
          + '</div></div>';
        next.textContent = "All done ✓"; hear.style.visibility = "hidden";
        prev.classList.add("pill"); prev.textContent = "Read again"; prev.style.visibility = "visible";
        markRead(BOOK.title);
        if (window.Sona) { Sona.confetti({ count: 130, duration: 2200 }); Sona.sfx.star(); }
        say("The end! Great listening!");
      } else {
        var pg = BOOK.pages[page];
        bkStage.innerHTML = '<div class="paperWrap">'
          + (left >= 2 ? '<div class="pstack two"></div>' : "")
          + (left >= 1 ? '<div class="pstack"></div>' : "")
          + '<div class="paper">'
          + '<span class="ribbon" style="background:' + BOOK.colors[0] + '">' + (page + 1) + '<span style="font-size:8.5px;opacity:.85">of ' + N + '</span></span>'
          + '<div class="bkart" style="background:radial-gradient(circle,' + hexRgba(BOOK.colors[0], .16) + ',' + hexRgba(BOOK.colors[1], .05) + ' 75%)"><div class="bkpic" style="filter:none">' + readerArt(pg) + '</div></div>'
          + '<div style="display:inline-block;background:#ffe7d3;color:#ef6f23;font-family:Baloo 2;font-weight:800;font-size:11px;letter-spacing:.08em;border-radius:99px;padding:4px 12px;">' + BOOK.sound + ' SOUND</div>'
          + '<div class="bktext">' + tintSound(tappable(pg.t), BOOK.sound) + '</div>'
          + '<div class="bkhint">TAP ANY WORD TO HEAR IT</div>'
          + '<img class="pgEcho" id="pgEcho" src="/coach/echo/echo-listening.svg" alt="Echo" />'
          + '</div></div>';
        next.textContent = "Next →"; hear.style.visibility = "visible";
        bkStage.querySelectorAll(".bktext span").forEach(function (sp) {
          sp.onclick = function () { if (playing) return; readAlong(sp.textContent.replace(/[^a-zA-Z']/g, "")); };
        });
        readAlong(pg.t);
      }
    }
    document.getElementById("bkNext").onclick = function () {
      if (window.Sona) Sona.sfx.tap();
      if (BOOK && page >= BOOK.pages.length) { closeBook(); return; }
      page++; showPage();
    };
    document.getElementById("bkPrev").onclick = function () {
      if (BOOK && page >= BOOK.pages.length) { page = -1; showPage(); return; } // Read again
      if (page > -1) { page--; showPage(); }
    };
    document.getElementById("bkHear").onclick = function () { if (BOOK && page >= 0 && page < BOOK.pages.length && !playing) say(BOOK.pages[page].t); };
    document.getElementById("bkClose").onclick = closeBook;

    /* ---- word box ---- */
    var wbHost = document.getElementById("wbSounds"), grid = document.getElementById("wordgrid");
    var allSounds = Object.keys(Sona.WORDS);
    // R era (design board §8): the word box shows ONLY the R list — the
    // sound-chip row is gone entirely, matching the locked non-R books.
    // SLP-referred families keep the full box (clinics target any sound).
    var slpBox = false; try { slpBox = !!(Sona.slpCode && Sona.slpCode()); } catch (e) {}
    var focus = (profile.focusSounds || []).filter(function (s) { return allSounds.indexOf(s) !== -1; });
    var order = slpBox ? focus.concat(allSounds.filter(function (s) { return focus.indexOf(s) === -1; })) : ["R"];
    var curSound = order[0];
    function paintChips() {
      wbHost.innerHTML = "";
      if (order.length < 2) { wbHost.style.display = "none"; return; }
      order.forEach(function (s) {
        var c = document.createElement("div");
        c.className = "sound" + (s === curSound ? " on" : "");
        c.textContent = s;
        c.onclick = function () { if (window.Sona) Sona.sfx.tap(); curSound = s; paintChips(); paintGrid(); };
        wbHost.appendChild(c);
      });
    }
    function paintGrid() {
      grid.innerHTML = "";
      (Sona.WORDS[curSound] || []).forEach(function (w) {
        var c = document.createElement("div");
        c.className = "wcard";
        c.innerHTML = '<span class="we">' + ((window.Sona&&Sona.pic)?Sona.pic(w.w,w.e,42):w.e) + '</span><span class="ww">' + w.w + '</span>';
        c.onclick = function () { if (playing) return; if (window.Sona) Sona.pop(w.e, { y: window.innerHeight * 0.3 }); say(w.w); };
        grid.appendChild(c);
      });
    }
    paintChips(); paintGrid();
  </script>
</body>
</html>
