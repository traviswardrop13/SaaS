<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Library</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/sona.css" />
  <link rel="stylesheet" href="/action.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#fff6e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    /* the hidden attribute beats the inline display:flex on the two tiles */
    [hidden]{display:none!important;}
    body{background:linear-gradient(180deg,#fff7ec,#ffe9d2) fixed;}
    /* The shelf scrolled up under the clock; this covers the status bar's band.
       See-through and blurred: the page's gradient scrolls on an iPhone (it
       ignores background-attachment:fixed), and a solid strip showed as a band. */
    body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:rgba(255,247,236,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:30;pointer-events:none;}
    .shelfhead{display:flex;align-items:center;gap:10px;margin:18px 2px 8px;}
    .shelfhead h2{margin:0;}
    /* warm tag pair (fix pack 1c) — the green pair was legacy Duolingo chrome */
    .shelfhead .tag{font-size:11px;font-weight:800;color:#7a5200;background:#ffe7c4;border-radius:99px;padding:3px 9px;}
    /* story shelf (D1): covers standing on rails — no gradient buttons */
    .shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;}
    .bookBtn{position:relative;border:none;cursor:pointer;background:none;padding:0;text-align:center;
      font-family:"Baloo 2";font-weight:800;transition:transform .06s;display:flex;flex-direction:column;align-items:center;}
    .bookBtn:active{transform:translateY(2px);}
    .bookBtn .cvr{position:relative;display:block;z-index:1;}
    /* a fuller book stands on the shelf in its own drawn cover */
    .bookBtn .scvr{display:block;width:min(100%,96px);aspect-ratio:1;margin:0 auto;border-radius:14px;object-fit:cover;background:var(--cream-card);
      box-shadow:0 4px 8px rgba(91,45,5,.2);}
    .bookBtn .rail{display:block;width:100%;height:9px;border-radius:3px;background:#ecd2a8;box-shadow:0 3px 0 #d9bc8c;margin-top:-5px;}
    .bookBtn .bt{display:block;font-size:13px;margin-top:8px;line-height:1.2;color:#4a2c14;}
    .bookBtn .bs{display:block;font-size:9.5px;margin-top:2px;letter-spacing:.06em;text-transform:uppercase;color:#b08d63;}
    .bookBtn.soon{cursor:default;}
    .bookBtn.soon:active{transform:none;}
    .bookBtn.soon .cvr{opacity:.45;filter:saturate(.35);}
    .bookBtn.soon .bs{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:99px;background:#f3e3cf;color:#8a6f52;letter-spacing:.04em;}
    /* a Premium book the family hasn't opened: greyed, still tappable (it
       asks for a grown-up); the free one says so while others are locked */
    .bookBtn.locked .cvr{opacity:.5;filter:saturate(.4);}
    .bookBtn.locked .bs,.bookBtn.free .bs{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:99px;letter-spacing:.04em;}
    .bookBtn.locked .bs{background:#efe9f9;color:#665093;}
    .bookBtn.free .bs{background:#e3f1ec;color:#2f6b5a;}
    #bookNotice{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:calc(100% - 32px);max-width:440px;display:flex;align-items:center;gap:10px;padding:15px 14px 15px 18px;background:#fff;border:2px solid #eed7b0;border-radius:22px;box-shadow:0 10px 32px rgba(80,50,10,.2);}
    #bookNotice[hidden]{display:none;}
    #bookNotice .notice-copy{flex:1;min-width:0;}
    #bookMessage{margin:0;font-weight:800;font-size:14px;line-height:1.45;color:var(--muted);}
    #bookUnlock{display:block;min-height:44px;margin-top:8px;border:0;border-radius:999px;padding:9px 18px;background:linear-gradient(180deg,var(--act-hi),var(--act));box-shadow:0 4px 0 var(--act-d);text-shadow:0 1px 0 var(--act-d);color:#fff;font:inherit;font-weight:800;cursor:pointer;}
    #bookMessageClose{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:#fff0d8;color:var(--ink);font-size:23px;cursor:pointer;}
    .bookBtn .doneStar{position:absolute;top:-7px;left:2px;z-index:2;filter:drop-shadow(0 2px 2px rgba(120,60,10,.3));}
    /* MORE BOOKS: the closed control under the child's own shelf. Its colours
       are action.css's cream pill (a second choice); only its size and place
       are set here: tall and full width, because a small finger presses it. */
    #moreBtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:56px;margin:26px 0 6px;padding:0 22px;font-size:18px;line-height:1.2;
      scroll-margin-top:calc(14px + env(safe-area-inset-top));}
    #moreBtn .chev{width:18px;height:18px;flex:none;transition:transform .2s;}
    #moreBtn[aria-expanded="true"] .chev{transform:rotate(180deg);}
    #moreBooks .shelfhead{margin-top:22px;}
    /* a small finger taps twice: for a beat after More books opens or closes,
       nothing on the page takes a tap (see MORE BOOKS in the script) */
    .wrap.settling{pointer-events:none;}
    /* word box */
    .wcard{border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:16px;padding:14px 6px 10px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .06s;}
    .wcard:active{transform:scale(.94);}
    .wcard .we{font-size:42px;line-height:1;}
    .wcard .ww{font-family:"Baloo 2";font-weight:800;font-size:13px;color:var(--blue-d);}

    /* ── the picture book (family redesign brief, 28 Sep 2026): "Pictures fill
       the whole screen. The page text sits on a cream card over the bottom of
       the picture." Layers, back to front: a blurred copy of the page's
       picture over the whole screen, the picture itself, the cream card with
       Echo peeking over it, and the two slim bars. The art decides its own
       fit once it has loaded: today's pages are 440x400 (wide) and are shown
       whole, at full width, over the blur, because covering a phone with
       them would cut away more than half of each scene; the coming
       1024x1536 portrait pages (#book.tall) cover the screen, which the brief
       drew them for (what matters in the middle 70%, the bottom quarter calm
       for the card). ── */
    #book{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:var(--cream);
      --bk-top:calc(68px + env(safe-area-inset-top));--bk-bot:calc(90px + env(safe-area-inset-bottom));--bk-card:104px;}
    #book.show{display:block;}
    .bkstage{position:absolute;inset:0;}
    /* a div, never a second <img>: the page's picture stays the one image */
    .bkbg{position:absolute;inset:-48px;background-size:cover;background-position:center;filter:blur(20px) saturate(1.1);transform:scale(1.06);}
    .bkbg.wash{inset:0;filter:none;transform:none;}
    /* ...and above and below a wide picture, its own top and bottom rows
       carried out to the edges of the screen (sky up, ground down), so what
       shows around it is the scene continuing, not a blur of its middle.
       Each is a copy laid over the picture and flipped out from its edge,
       stretched: CSS can't stretch an SVG background (it keeps its shape). */
    .bkedge{position:absolute;left:0;right:0;top:var(--art-t,0px);height:calc(var(--art-b,0px) - var(--art-t,0px));background-size:100% 100%;
      background-repeat:no-repeat;filter:blur(8px) saturate(1.05);opacity:0;transition:opacity .2s;}
    .bkedge.up{transform-origin:50% 0;transform:scaleY(-12);}
    .bkedge.down{transform-origin:50% 100%;transform:scaleY(-12);}
    #book.edges .bkedge{opacity:1;}
    #book.tall .bkbg,#book.tall .bkedge{display:none;}
    /* the picture's space: between the bars, above the card and room for
       Echo's question over it, so on a short phone the bubble lands on the
       ground, not on the characters */
    .bkart{position:absolute;left:0;right:0;top:var(--bk-top);bottom:calc(var(--bk-bot) + var(--bk-card) + 36px);display:flex;align-items:center;justify-content:center;}
    /* --bk-lift/--bk-ask: room for Echo's question on a short phone (roomForAsk).
       Never a transition: Reduce Motion (sona.css) makes every transition a
       .01ms one, and a box mid-transition reports where it WAS, so the room
       check would measure a picture that has already moved. */
    .bkart.scene{top:calc(var(--bk-top) - var(--bk-lift,0px));bottom:calc(var(--bk-bot) + var(--bk-card) + 36px + var(--bk-lift,0px) + var(--bk-ask,0px));transition:none!important;}
    /* wide art: the whole scene at full width, its top and bottom edges
       feathered into the blur so it reads as one picture, not a card */
    .bkart.scene img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;opacity:0;transition:opacity .2s;
      -webkit-mask-image:linear-gradient(180deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(180deg,transparent,#000 6%,#000 94%,transparent);}
    .bkart.scene img.in,.bkcover.in{opacity:1;}
    #book.tall .bkart.scene{top:0;bottom:0;}
    #book.tall .bkart.scene img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;object-position:50% 40%;-webkit-mask-image:none;mask-image:none;}
    /* the title page: the drawn cover, large (the app draws the title) */
    .bkcover{display:block;width:min(84vw,440px);height:auto;max-height:94%;aspect-ratio:1;object-fit:contain;border-radius:24px;
      box-shadow:0 16px 34px rgba(91,45,5,.28);opacity:0;transition:opacity .2s;}
    /* the older six-page books: their sticker on a soft wash */
    .bkart.sticker{--stk:min(50vw,210px);}
    .bkglow{position:absolute;width:calc(var(--stk) * 1.7);height:calc(var(--stk) * 1.7);border-radius:50%;}
    .bkpic{position:relative;line-height:1;filter:drop-shadow(0 12px 18px rgba(150,90,10,.18));animation:bkfloat 3.4s ease-in-out infinite;}
    .bkpic svg,.bkpic img{width:var(--stk,150px)!important;height:var(--stk,150px)!important;}
    .bkpic span{font-size:var(--stk,150px)!important;}
    @keyframes bkfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    /* the cream card, anchored above the bottom bar; Echo stands BEHIND its
       top edge (he comes first, so the card covers his feet) */
    .bkfoot{position:absolute;left:12px;right:12px;bottom:calc(var(--bk-bot) + 2px);z-index:2;max-width:560px;margin:0 auto;}
    .bkcard{position:relative;background:var(--cream-card);border:2px solid var(--cream-line);border-radius:26px;padding:14px 18px 13px;
      box-shadow:0 10px 26px rgba(91,45,5,.2);text-align:center;}
    .bkecho{position:absolute;left:8px;bottom:calc(100% - 24px);width:76px;height:70px;transition:transform .4s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%;}
    .bkecho img{width:100%;height:100%;object-fit:contain;display:block;}
    .bkfoot.ask .bkecho{transform:translateY(-10px) scale(1.12);}
    .bkfoot.end .bkecho{left:50%;margin-left:-56px;width:112px;height:104px;bottom:calc(100% - 18px);}
    .bktext{font-family:"Baloo 2";font-weight:800;font-size:clamp(21px,6vw,26px);color:var(--cream-ink);line-height:1.36;}
    .bktext span{cursor:pointer;border-radius:10px;padding:0 2px;}
    .bktext span:active{background:rgba(255,206,84,.35);}
    /* the key word lifts and glows (a class on its word, never a <b>: the
       <b> inside is the sound's letters) */
    .bktext span.kw{display:inline-block;background:rgba(255,206,84,.42);box-shadow:0 0 0 3px rgba(255,206,84,.3);transform:translateY(-2px) scale(1.07);
      transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s;}
    .bktext span.kw.yay{animation:kwpop .6s cubic-bezier(.3,1.6,.5,1);}
    @keyframes kwpop{0%{transform:translateY(-2px) scale(1.07)}40%{transform:translateY(-8px) scale(1.3)}100%{transform:translateY(-2px) scale(1.07)}}
    .bktitle{font-family:"Baloo 2";font-weight:800;font-size:clamp(28px,7.6vw,36px);line-height:1.12;color:var(--cream-ink);}
    .bksub{font-weight:800;font-size:15px;color:rgba(91,45,5,.7);margin-top:6px;}
    .bktext,.bktitle,.bksub,.bkbubble .bq{text-wrap:balance;}
    /* Echo's question, beside him, over the picture's calm bottom */
    .bkbubble{position:absolute;left:94px;bottom:calc(100% + 12px);max-width:calc(100% - 98px);background:var(--cream-card);border:2px solid var(--cream-line);
      border-radius:20px;padding:7px 14px 8px;box-shadow:0 8px 20px rgba(91,45,5,.2);font-family:"Baloo 2";font-weight:800;color:var(--cream-ink);
      animation:bubIn .35s cubic-bezier(.3,1.6,.5,1) both;}
    .bkbubble::before{content:"";position:absolute;left:-11px;bottom:12px;border:9px solid transparent;border-right:11px solid var(--cream-line);border-left:0;}
    .bkbubble::after{content:"";position:absolute;left:-7px;bottom:14px;border:7px solid transparent;border-right:8px solid var(--cream-card);border-left:0;}
    .bkbubble .bq{font-size:19px;line-height:1.2;}
    .bkbubble .bkw{font-size:24px;}
    #bkMicState{font-size:14px;line-height:1.25;color:var(--act-d);min-height:1.25em;}
    @keyframes bubIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
    /* the slim bars, over the picture */
    .bktop{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;}
    #book.tall .bktop{background:linear-gradient(180deg,rgba(40,24,10,.28),rgba(40,24,10,0));}
    .bkround{width:44px;height:44px;border-radius:50%;padding:0;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;}
    #bkHead{flex:1;min-width:0;display:flex;justify-content:center;}
    #bkHead .bh{display:flex;flex-direction:column;align-items:center;max-width:100%;background:rgba(255,250,241,.92);border:2px solid var(--cream-line);
      border-radius:18px;padding:3px 14px 4px;box-shadow:0 3px 0 rgba(91,45,5,.1);}
    #bkHead .bh1{font-family:"Baloo 2";font-weight:800;font-size:15px;line-height:1.2;color:var(--cream-ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #bkHead .bhsep{display:none;}
    #bkHead .bh2{font-weight:800;font-size:10.5px;line-height:1.2;letter-spacing:.07em;text-transform:uppercase;color:rgba(91,45,5,.6);}
    .bkcount{flex:0 0 auto;min-width:44px;height:32px;border-radius:99px;background:rgba(255,250,241,.92);border:2px solid var(--cream-line);
      display:flex;align-items:center;justify-content:center;padding:0 9px;font-family:"Baloo 2";font-weight:800;font-size:13px;color:var(--cream-ink);white-space:nowrap;}
    .bkbottom{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;min-height:var(--bk-bot);box-sizing:border-box;
      padding:10px 16px calc(14px + env(safe-area-inset-bottom));}
    #book.tall .bkbottom{background:linear-gradient(0deg,rgba(40,24,10,.22),rgba(40,24,10,0));}
    #bkPrev{width:48px;height:48px;font-size:20px;}
    #bkPrev.pill{width:auto;border-radius:99px;padding:0 20px;font-size:17px;}
    #bkHear{display:flex;align-items:center;gap:7px;height:48px;padding:0 16px;font-size:15px;flex:0 0 auto;}
    #bkHear svg{width:19px;height:19px;color:var(--act-d);}
    #bkNext{flex:1;max-width:300px;min-height:56px;margin-left:auto;padding:0 18px;font-size:19px;white-space:nowrap;}
    #bkPrev[hidden]~#bkHear[hidden]~#bkNext{margin-right:auto;}   /* the title page: Start, centred */
    /* the key-word moment: the teal mic where Next was, and the grown-ups' Skip */
    #bkMicWrap{flex:1;display:flex;align-items:center;min-width:0;gap:6px;}
    .bkmic{width:64px;height:64px;border:none;padding:0;margin:0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
      transition:opacity .25s,transform .25s;}
    .bkmic svg{width:30px;height:30px;}
    /* resting (Echo is talking, or the page is turning): greyed, never see-
       through; at .4 opacity over the grass it read as a green button */
    .bkmic.wait,.bkmic.bye,.bkmic.yay{filter:saturate(.25) brightness(1.12);transform:scale(.88);cursor:default;}
    .bkmic.live{animation:micRing 1.3s ease-out infinite;}
    .bkmic.nudge{animation:micNudge 1.4s ease-in-out infinite;}
    .bkmic.nudge:active{transform:translateY(3px);}
    @keyframes micRing{0%{box-shadow:0 5px 0 var(--act-d),0 0 0 0 var(--act-glow)}100%{box-shadow:0 5px 0 var(--act-d),0 0 0 18px rgba(31,152,166,0)}}
    @keyframes micNudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    #bkSkip{flex:0 0 auto;min-height:44px;min-width:52px;border:none;background:rgba(255,250,241,.85);border-radius:99px;padding:0 13px;cursor:pointer;
      font-family:"Baloo 2";font-weight:800;font-size:14px;color:rgba(91,45,5,.72);}
    /* a grown-up says yes to the mic, inside the book */
    .bkovl{position:absolute;inset:0;z-index:6;background:rgba(40,24,10,.5);display:flex;align-items:center;justify-content:center;padding:22px;}
    .bkovlCard{background:var(--cream);border-radius:28px;padding:20px 20px 18px;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;
      align-items:center;gap:9px;box-shadow:0 18px 40px rgba(40,24,10,.4);}
    .bkovlCard img{width:88px;height:82px;object-fit:contain;}
    .bkovlCard h2{margin:0;font-family:"Baloo 2";font-weight:800;font-size:23px;line-height:1.18;color:var(--cream-ink);}
    .bkovlCard p{margin:0;font-weight:800;font-size:14.5px;line-height:1.42;color:rgba(91,45,5,.78);}
    .bkovlCard p.small{font-size:12px;color:rgba(91,45,5,.62);}
    .bkovlCard button{width:100%;min-height:52px;font-size:18px;margin-top:2px;}
    @media (prefers-reduced-motion:reduce){ .bkpic,.bkmic.live,.bkmic.nudge,.bktext span.kw.yay{animation:none;} .bkecho{transition:none;} }
      .shelfLetter{grid-column:1/-1;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;color:var(--cream-ink,#5b2d05);margin:10px 0 -4px;}
    .shelfLetter:first-child{margin-top:0;}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div class="brand"><img src="/assets/crafted/echo-welcome.webp" alt="" style="width:34px;height:34px;vertical-align:-10px;object-fit:contain;"> Library</div>
      <div class="pills">
        <a class="iconbtn" href="/today.html" title="Home" style="display:flex;align-items:center;justify-content:center;background:var(--cream);border:1.5px solid var(--cream-line);color:var(--cream-ink);box-shadow:0 3px 0 var(--cream-line);">✕</a>
      </div>
    </header>

    <div class="card" style="display:flex;gap:12px;align-items:center;">
      <img src="/assets/crafted/echo-welcome.webp" alt="Echo" style="width:58px;height:58px;object-fit:contain;flex:0 0 auto;" />
      <div><b style="font-family:'Baloo 2';font-size:17px;">Just for fun!</b>
      <p class="muted" style="font-size:13px;font-weight:700;">No scores in here — just picture books Echo reads with you.</p></div>
    </div>

    <!-- Feed Echo lives here for EVERYONE (it's the littles' main game, but
         big kids love feeding him too) — the library is the no-scores zone.
         Hidden since the books came back (26 Sep 2026): Home's Books card
         opens this page, and a books page should lead with books. -->
    <button id="feedTile" hidden onclick="location.href='/arcade-feed.html'" style="width:100%;border:none;cursor:pointer;border-radius:18px;padding:14px 16px;margin-top:14px;text-align:left;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#cef0b8,#a9e18f);box-shadow:0 6px 0 rgba(90,150,60,.35);">
      <svg viewBox="0 0 64 64" style="width:40px;height:40px;flex:0 0 auto"><circle cx="32" cy="32" r="30" fill="#fff" opacity=".85"/><ellipse cx="32" cy="46" rx="16" ry="6" fill="#8fdc7a"/><circle cx="32" cy="30" r="13" fill="#ff5c5c"/><path d="M32 18q4-4 8-2-3 4-8 2Z" fill="#58cc02"/><rect x="31" y="14" width="2.5" height="6" rx="1.2" fill="#8a5a2a"/><circle cx="27" cy="26" r="2" fill="#fff" opacity=".85"/></svg>
      <span><b style="display:block;font-family:'Baloo 2';font-weight:800;font-size:16px;color:#2e5c1a;">Feed Echo</b>
      <span style="display:block;font-weight:800;font-size:12px;color:#3f7d2a;margin-top:2px;">Say the word, tap the picture — watch Echo grow!</span></span>
    </button>

    <!-- The adventure (story.html) stays parked: turning the books on opened
         the picture books, not the story engine. -->
    <button id="advTile" hidden onclick="location.href='/story.html'" style="width:100%;border:none;cursor:pointer;border-radius:18px;padding:16px;margin-top:14px;text-align:left;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#35407e,#6a5aa8 70%,#8a6fc4);box-shadow:0 6px 0 rgba(30,24,70,.35);">
      <svg viewBox="0 0 64 64" style="width:44px;height:44px;flex:0 0 auto"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg>
      <span><b id="advTitle" style="display:block;font-family:'Baloo 2';font-weight:800;font-size:17px;color:#fff;">Your Adventure</b>
      <span id="advSub" style="display:block;font-weight:800;font-size:12px;color:rgba(255,255,255,.85);margin-top:2px;">A brand-new story, written just for you — never the same twice</span></span>
    </button>

    <div class="shelfhead"><h2>Sound stories</h2><span class="tag">ECHO READS</span></div>
    <div class="shelf" id="shelf"></div>

    // the cream card, with Echo behind its top edge and his bubble beside him
    function footHTML(inner, cls, pose) {
      return '<div class="bkfoot' + (cls ? " " + cls : "") + '">'
        + '<div class="bkecho"><img id="pgEcho" src="' + echoSrc(pose || "welcome") + '" alt="Echo" onerror="' + ECHO_BACKUP + '" /></div>'
        + '<div class="bkcard">' + inner + '</div>'
        + '<div class="bkbubble" id="bkBubble" aria-live="polite" hidden><div class="bq" id="bkAsk"></div><div id="bkMicState"></div></div>'
        + '</div>';
    }
    var STAR = '<svg viewBox="0 0 64 64" style="width:min(44vw,170px);height:min(44vw,170px)"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg>';
    function showPage() {
      endMoment();
      stopSpeech();
      bookEl.classList.remove("tall"); bookEl.classList.remove("edges"); bookEl.style.removeProperty("--bk-lift"); bookEl.style.removeProperty("--bk-ask");
      bkPrev.classList.remove("pill"); bkPrev.textContent = "←";
      bkPrev.hidden = page <= -1;
      var N = BOOK.pages.length, c0 = BOOK.colors[0], c1 = BOOK.colors[1];
      var wash = '<div class="bkbg wash" style="background:linear-gradient(180deg,' + hexRgba(c0, .34) + ',' + hexRgba(c1, .14) + ' 58%,var(--cream))"></div>';
      var blur = function (src) { return '<div class="bkbg" style="background-image:url(&quot;' + escAttr(src) + '&quot;)"></div>'; };
      var edge = function (src, at) { return '<div class="bkedge ' + at + '" style="background-image:url(&quot;' + escAttr(src) + '&quot;)"></div>'; };
      bkCount.textContent = page >= 0 && page < N ? (page + 1) + " of " + N : "";
      bkCount.style.visibility = page >= 0 && page < N ? "visible" : "hidden";
      if (page === -1) {
        // a painted book's title page is its first scene: the shelf's small
        // copy (already here) until the full-size cut is ready, then that
        var cvr = BOOK.cover || (BOOK.painted ? sceneOf(BOOK, 0) || paintedSrc(BOOK, true) : "");
        bkStage.innerHTML = (cvr ? blur(cvr) + edge(cvr, "up") + edge(cvr, "down") + '<div class="bkart cvrpage"><img class="bkcover" src="' + escAttr(cvr) + '" alt="' + escAttr(BOOK.coverAlt) + '"></div>'
            : wash + '<div class="bkart sticker"><div class="bkpic">' + cover(BOOK, 150) + '</div></div>')
          + footHTML('<div class="bktitle">' + escHtml(BOOK.title) + '</div><div class="bksub">A story full of ' + sndLabel(BOOK.sound) + ' sounds — Echo reads it to you!</div>');
        fitArt();
        if (BOOK.painted && !sceneOf(BOOK, 0)) {
          var titled = BOOK;
          cutScenes(BOOK, function () {
            var im = bkStage.querySelector("img.bkcover"), s0 = sceneOf(titled, 0);
            if (BOOK === titled && page === -1 && im && s0) im.src = s0;
          });
        }
        setBar("next");
        bkNext.textContent = "Start →"; bkHear.hidden = true;
        readAlong(BOOK.title + "! A story full of " + sndLabel(BOOK.sound).replace(" (v)", "") + " sounds.");
      } else if (page >= N) {
        // The End: the star over the last picture, Echo celebrating on the card
        var last = BOOK.pages[N - 1], lastArt = last && (last.art || sceneOf(BOOK, N - 1));
        bkStage.innerHTML = (lastArt ? blur(lastArt) : wash)
          + '<div class="bkart"><div class="bkpic" style="filter:drop-shadow(0 10px 22px rgba(255,190,20,.55))">' + STAR + '</div></div>'
          + footHTML('<div class="bktitle">The End!</div><div class="bksub">Great listening! Read it again or pick another story.</div>', "end", "cheer");
        setBar("next");
        bkNext.textContent = "All done ✓"; bkHear.hidden = true;
        bkPrev.classList.add("pill"); bkPrev.textContent = "Read again";
        markRead(BOOK.title);
        if (window.Sona && Sona.confetti) Sona.confetti({ count: 130, duration: 2200 });
        chime("star");
        say("The end! Great listening!");
      } else {
        var pg = BOOK.pages[page];
        // the picture: a drawn page's file or a painted page's scene, whole
        // at full width over its own edges; the sticker on a wash for a page
        // with neither (or a painted book whose picture couldn't come down);
        // and while a painted book's picture is still on its way, the wash
        // alone, filled in below when it lands
        var artNow = function (at) {
          var p = BOOK.pages[at], src = p.art || sceneOf(BOOK, at);
          if (src) return blur(src) + edge(src, "up") + edge(src, "down") + '<div class="bkart scene">'
            + (p.art ? readerArt(p) : '<img src="' + escAttr(src) + '" alt="" data-scene="' + at + '">') + '</div>';
          if (BOOK.painted && !(CUT.id === BOOK.painted && CUT.failed)) return wash + '<div class="bkart bkwait"></div>';
          return wash + '<div class="bkart sticker"><div class="bkglow" style="background:radial-gradient(circle,' + hexRgba(c0, .3) + ',' + hexRgba(c1, 0) + ' 70%)"></div><div class="bkpic">' + readerArt(p) + '</div></div>';
        };
        bkStage.innerHTML = artNow(page)
          + footHTML('<div class="bktext">' + lineHTML(BOOK, page) + '</div>', "", "talk");
        fitArt();
        if (bkStage.querySelector(".bkwait")) {
          var waitBook = BOOK, waitPage = page;
          cutScenes(BOOK, function () {
            var w = bkStage.querySelector(".bkwait"), foot = bkStage.querySelector(".bkfoot");
            if (BOOK !== waitBook || page !== waitPage || !w || !foot) return;   // the page already turned
            var wa = bkStage.querySelector(".bkbg.wash"); if (wa) wa.remove(); w.remove();
            foot.insertAdjacentHTML("beforebegin", artNow(waitPage));
            fitArt();
          });
        }
        bkNext.textContent = "Next →"; bkHear.hidden = false;
        bkStage.querySelectorAll(".bktext span").forEach(function (sp) { sp.onclick = function () { wordTap(sp); }; });
        // a page with a key word shows the mic (resting) where Next was, and
        // asks once Echo has finished reading it
        var on = momentOn(), tok = momTok;
        setBar(on ? "wait" : "next", "");
        readAlong(pg.t).then(function () { if (on && tok === momTok) startMoment(); });
      }
      publish();
    }

    /* ---- the key-word moment (family redesign brief, 28 Sep 2026) ----
       "The key word lights up in the text. Echo pops up and asks 'Can you say
       boat?', and the teal mic appears. When the child says it, a small
       celebration plays and the page turns. After 3 tries, Echo says
       something kind and the page turns anyway. A small Skip for grown-ups."
       The listening is Say & Play's check (SayCheck): a voice of the book's
       sound family. It can't tell the word, so "heard" means Echo heard the
       child, never that the word was right, and nothing here grades.
       The rules it keeps:
       - PLAY, NOT PRACTICE. An accepted word adds one play rep toward the
         daily goal. It never logs an attempt, a session, a rung, a rotation
         step, coins or a sticker, and no clinical practice key changes.
       - SILENCE NEVER TURNS THE PAGE and is never a try: a quiet window
         closes the mic and waits for a tap on it, which only listens again.
         A try is a voice in the other family ("shape"); three of those, and
         Echo says something kind and turns the page (the brief's "3 tries").
       - ONE TARGET, IN ISOLATION: Echo's model ends on the word alone
         ("Can you say... boat."), calm, so what the child copies is the one
         word; nothing is glued onto it.
       - DEVELOPMENTAL ORDER: a child younger than the age the book's sound is
         usually acquired (Sona.soundNorm) is never asked to say it; the book
         reads with Next, as before. Play mode shows every sound's books.
       - THE MIC IS QUIET'S: nothing plays while it is live or being asked
         for, nor inside a beat of its close; every way off a page closes it
         first; a hidden page closes it and coming back needs a tap on it.
       - A GROWN-UP SAYS YES FIRST, inside the book, and the phone is asked
         only from that tap. "Not now", a refused or missing mic: the books
         read with Next for the rest of the visit. Never a dead end. */
    var M = null, momTok = 0, micOff = false, barMode = "next", turnT = 0;
    function momentOn() {
      if (!BOOK || !BOOK.keys || page < 0 || page >= BOOK.pages.length || !BOOK.keys[page]) return false;
      if (!SC || micOff || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
      var age = parseInt(profile.childAge, 10) || 0, norm = (window.Sona && Sona.soundNorm) ? Sona.soundNorm(BOOK.sound) : null;
      return !(age && norm && age < norm);
    }
    // What tests read; the page's internals stay put otherwise.
    function publish() {
      try { window.__book = { page: page, mode: barMode, word: M ? M.word : null, tries: M ? M.tries : 0, primer: !bkPrimer.hidden, micOff: micOff }; } catch (e) {}
    }
    var MIC_NOTE = { live: "Your turn!", nudge: "Tap the mic, then say it" };
    // The bottom bar: Next ("next"), or the mic, resting while Echo talks
    // ("wait"), listening ("live": "Your turn!" shows then and never before),
    // waiting for a tap after a quiet window ("nudge"), or done ("yay", "bye").
    function setBar(mode, note) {
      barMode = mode;
      var mic = mode !== "next";
      bkNext.hidden = mic; bkMicWrap.hidden = !mic;
      bkMic.className = "act-mic bkmic " + mode;
      bkMic.setAttribute("aria-label", mode === "live" ? "Echo is listening" : mode === "nudge" ? "Tap the mic, then say it" : "Microphone");
      var st = document.getElementById("bkMicState");
      if (st) st.textContent = note != null ? note : (MIC_NOTE[mode] || "");
      var bub = document.getElementById("bkBubble"); if (bub && !bub.hidden) roomForAsk();
      try { document.body.setAttribute("data-bkmic", mode); } catch (e) {}
      publish();
    }
    // Every way off the moment starts here: the mic closes, Echo's line and
    // any chime still waiting are dropped, the grown-ups' question goes.
    function hush() { momTok++; clearTimeout(turnT); if (SC) SC.stop(); bkPrimer.hidden = true; return momTok; }
    function endMoment() { hush(); M = null; publish(); }
    // "Not now", a refused mic, no mic: the rest of this visit reads with Next.
    // A mic that wouldn't open this once (busy): this page does, and the next
    // page asks again.
    function momentOff(justThisPage) {
      if (!justThisPage) micOff = true;
      endMoment();
      var foot = bkStage.querySelector(".bkfoot"), bub = document.getElementById("bkBubble"), kw = bkStage.querySelector(".bktext .kw");
      if (foot) foot.classList.remove("ask"); if (bub) bub.hidden = true; if (kw) kw.classList.remove("kw");
      setBar("next"); echoPose("welcome"); roomForAsk();
    }
    function markKey(word) {
      var spans = bkStage.querySelectorAll(".bktext span"), w = String(word).toLowerCase();
      for (var i = 0; i < spans.length; i++) {
        var k = spans[i].textContent.toLowerCase().replace(/[^a-z']/g, "").replace(/^'+|'+$/g, "");
        if (k === w) { spans[i].classList.add("kw"); return; }   // the first, if it's there twice
      }
    }
    // The key words are stored lower-case; a name keeps its capital when Echo
    // shows it ("Can you say Finn?"). A name is the title's first word (never
    // one of the voiced-th book's little words: "This Bear, That Bee"), or a
    // word the book capitalises mid-sentence and never writes lower-case (a
    // capital after a full stop proves nothing: "Then the sun sets.").
    function keyShown(word) {
      var w = String(word).replace(/[^a-z']/gi, ""), cap = w.charAt(0).toUpperCase() + w.slice(1);
      if (/^th(e|is|at|ese|ose|en|ey|ere|em)$/i.test(w)) return w;
      if (String(BOOK.title).split(" ")[0].replace(/'s$/, "") === cap) return cap;
      var re = new RegExp("\\b" + w + "\\b", "gi"), mid = 0, low = 0, m;
      BOOK.pages.forEach(function (p) {
        re.lastIndex = 0;
        while ((m = re.exec(p.t))) {
          if (m[0].charAt(0) === m[0].charAt(0).toLowerCase()) low++;
          else if (/[a-z,]\s*$/i.test(p.t.slice(0, m.index))) mid++;
        }
      });
      return mid && !low ? cap : w;
    }
    function askHTML(word) {
      var mark = (window.Sona && Sona.soundMark) ? Sona.soundMark(word, BOOK.sound, "i") : '<b class="snd">' + escHtml(word) + "</b>";
      return 'Can you say <span class="bkw">' + mark + "</span>?";
    }
    function startMoment() {
      if (!momentOn()) { setBar("next"); return; }
      var tok = momTok;
      M = { word: keyShown(BOOK.keys[page]), tries: 0, ok: false, leaving: false };
      markKey(BOOK.keys[page]);
      var foot = bkStage.querySelector(".bkfoot"), bub = document.getElementById("bkBubble");
      document.getElementById("bkAsk").innerHTML = askHTML(M.word);
      if (bub) bub.hidden = false; if (foot) foot.classList.add("ask");
      roomForAsk();
      echoPose("wave");
      if (document.hidden) { setBar("nudge"); echoPose("think"); return; }
      setBar("wait", "Listen…");
      SC.ready(function (st) {
        if (tok !== momTok) return;
        if (st === "nomic") return momentOff();
        if (st === "go") { M.ok = true; return ask(false); }
        primer(tok);
      });
    }
    // The grown-up's yes. The phone's own mic prompt rides on this tap, and
    // is never shown from anywhere else.
    function primer(tok) {
      document.getElementById("bkMicPromise").textContent = (window.Sona && Sona.MIC_PROMISE) || "";
      bkPrimer.hidden = false; publish();
      document.getElementById("bkPrimerYes").onclick = function () {
        if (tok !== momTok || !M || document.hidden) return;
        bkPrimer.hidden = true; publish();
        // The phone's mic prompt must never open under a voice: a word tapped
        // just before this question came up may still be reading.
        if (playing) stopSpeech();
        SC.permit(function (r) {
          if (tok !== momTok || !M) return;
          if (r === "denied") return denied();
          if (r === "nomic") return momentOff();
          if (r === "failed") return momentOff(true);
          M.ok = true; ask(false);
        });
      };
      document.getElementById("bkPrimerNo").onclick = function () { if (tok === momTok) momentOff(); };
    }
    function denied() {
      momentOff();
      if (!window.Sona || !Sona.micDenied) return;
      Sona.micDenied({ onClose: function () {} });
      // The shared screen's way out says "Back home"; here it only closes it
      // and the book reads on with Next, so it says that instead.
      var back = document.getElementById("sonaMicBack");
      if (back && /back home/i.test(back.textContent)) back.textContent = "Keep reading";
    }
    // Echo models the word, calm, the word alone at the end; then the mic.
    function ask(again) {
      if (!M) return;
      var tok = momTok;
      setBar("wait", again ? "One more time…" : "Listen…");
      echoPose(again ? "think" : "wave");
      SC.say((again ? "One more time... " : "Can you say... ") + M.word + ".", function () { if (tok === momTok) listenNow(); });
    }
    function listenNow() {
      if (!M) return;
      var tok = momTok;
      setBar("wait", "");
      SC.listen(BOOK.sound, function (out) { if (tok === momTok) answer(out); },
        function () { if (tok === momTok) { setBar("live"); echoPose("listen"); } });
    }
    function answer(out) {
      if (!M) return;
      var tok = momTok;
      if (out === "heard") {
        if (M.leaving) return; // one accepted callback credits the page once
        try { if (window.Sona && Sona.gameRep && (!Sona.kkey || Sona.kkey("sona.gamereps.v1") === bookRepKey)) Sona.gameRep(BOOK.sound); } catch (e) {}
        // SayCheck has already closed the mic; the chime still waits its beat
        M.leaving = true;
        setBar("yay", "I heard you!");
        echoPose("cheer");
        var kw = bkStage.querySelector(".bktext .kw"); if (kw) kw.classList.add("yay");
        chime("correct");
        SC.quiet(function () { if (tok === momTok && window.Sona && Sona.confetti) Sona.confetti({ count: 60, duration: 1100 }); });
        turnT = setTimeout(function () { if (tok === momTok) turnPage(); }, 1200);
        return;
      }
      if (out === "shape") {
        M.tries++;
        if (M.tries < 3) return ask(true);
        M.leaving = true;
        setBar("bye", "Great trying! Let's turn the page.");
        // cheer, not think: the page turns on this, and a round ends on a win
        echoPose("cheer");
        SC.say("Great trying. Let's turn the page.", function () { if (tok === momTok) turnPage(); });
        return;
      }
      if (out === "denied") return denied();
      if (out === "nomic") return momentOff();
      if (out === "failed") return momentOff(true);
      // "quiet" (no voice in the window) or "hidden": nothing moves. The mic
      // waits for a tap, and the tap only listens again.
      setBar("nudge"); echoPose("think");
    }
    function turnPage() { endMoment(); if (BOOK && page < BOOK.pages.length) { page++; showPage(); } }
    function wordTap(sp) {
      if (playing || (M && M.leaving)) return;
      var w = sp.textContent.replace(/[^a-zA-Z']/g, ""), tok = hush();
      if (M && M.ok) setBar("wait", "");
      // a moment the tap cut off before the grown-up's answer starts over, so
      // the mic is never left resting with nothing that wakes it
      readAlong(w).then(function () { if (tok !== momTok || !M) return; if (M.ok) listenNow(); else startMoment(); });
    }

    bkNext.onclick = function () {
      if (!BOOK) return;
      if (page >= BOOK.pages.length) { closeBook(); return; }
      endMoment(); page++; showPage(); chime("tap");
    };
    // for grown-ups: turns the page with no word said
    bkSkip.onclick = function () { if (!BOOK || page < 0 || page >= BOOK.pages.length) return; turnPage(); };
    bkPrev.onclick = function () {
      if (!BOOK) return;
      endMoment();
      if (page >= BOOK.pages.length) { page = -1; showPage(); return; } // Read again
      if (page > -1) { page--; showPage(); }
    };
    // Hear it: the mic closes, Echo reads the page again, then asks again
    bkHear.onclick = function () {
      if (!BOOK || page < 0 || page >= BOOK.pages.length || playing || (M && M.leaving)) return;
      var tok = hush(), pg = BOOK.pages[page];
      if (barMode !== "next") setBar("wait", M ? "Listen…" : "");
      readAlong(pg.t).then(function () {
        if (tok !== momTok) return;
        if (M && M.ok) ask(false); else if (momentOn()) startMoment();
      });
    };
    // after a quiet window (or coming back to the page): the tap listens again
    bkMic.onclick = function () {
      // not while the book is reading a tapped word: hush() stops only the
      // mic, so asking for it now would open it under the book's own voice
      if (!BOOK || barMode !== "nudge" || playing) return;
      hush();
      if (M && M.ok) listenNow(); else startMoment();
    };
    document.getElementById("bkClose").onclick = closeBook;
    // A hidden page closes the mic and stops Echo (SayCheck closes its own
    // side too); coming back needs a tap on the mic. A page already turning
    // is left to turn.
    if (window.Sona && Sona.onBackground) Sona.onBackground(function () {
      stopSpeech();
      if (echoIs("talk")) echoPose("welcome");   // his line stopped, so does his beak
      if (!BOOK || barMode === "next" || (M && M.leaving)) return;
      hush(); setBar("nudge"); echoPose("think");
    });
    // Home's What's new / Limited time rows open a book straight from its
    // card (?book=<folder>). The shelf's own rules still decide: a book not
    // out yet does nothing, a Premium one shows the grown-up message.
    (function () {
      var want = ""; try { want = new URLSearchParams(location.search).get("book") || ""; } catch (e) {}
      if (!/^[a-z0-9-]+$/.test(want)) return;
      var st = ALL_STORIES.filter(function (b) { return (b.cover || "").split("/")[3] === want; })[0];
      if (!st || !bookOpen(st)) return;
      if (bookLocked(st)) { showLocked(st); return; }
      openBook(st);
    })();

  </script>
</body>
</html>
