<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sona — Family progress</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --ink:#16384f; --muted:#6b86a3; --line:#e6eef6; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    body{background:linear-gradient(180deg,#eef7ff,#eafbe9 70%);color:var(--ink);min-height:100vh;}
    .wrap{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 40px;}
    .topbar{display:flex;align-items:center;gap:10px;}
    .back{font-weight:800;font-size:13px;color:var(--blue-d);text-decoration:none;}
    .brand{display:flex;align-items:center;gap:8px;font-family:"Baloo 2";font-weight:800;font-size:17px;color:var(--blue-d);}
    .brand img{width:28px;height:28px;}
    .btn{margin-left:auto;border:none;border-radius:12px;padding:9px 14px;font-family:"Baloo 2";font-weight:800;font-size:13px;color:#fff;background:var(--blue);cursor:pointer;text-decoration:none;}
    .btn:active{transform:translateY(2px);}
    h1{font-family:"Baloo 2";font-weight:800;font-size:26px;margin-top:10px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
    .age{font-size:15px;font-weight:800;color:var(--muted);}
    .meta{color:var(--muted);font-weight:700;font-size:13.5px;margin-top:4px;}
    .card{background:#fff;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 10px 26px -18px rgba(20,90,160,.5);}
    .card h2{font-family:"Baloo 2";font-weight:800;font-size:16px;}
    .card h2 .hint{font-weight:700;font-size:12px;color:var(--muted);margin-left:6px;}
    .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
    .stat{flex:1;min-width:120px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 26px -18px rgba(20,90,160,.5);}
    .stat .n{font-family:"Baloo 2";font-weight:800;font-size:25px;line-height:1;}
    .stat .l{font-weight:800;font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.03em;}
    .sndrow{padding:13px 0;border-top:1px solid var(--line);}
    .sndrow:first-child{border-top:none;}
    .sndtop{display:flex;align-items:center;gap:8px;}
    .chip{font-family:"Baloo 2";font-weight:800;font-size:13px;border-radius:99px;padding:4px 11px;background:#eef3fb;color:#46627a;}
    .chip b{color:#16384f;}
    .chip.hi{background:#eafce9;color:#46a302;} .chip.mid{background:#fff5e0;color:#b07908;} .chip.lo{background:#fdecea;color:#c0392b;}
    .sndcount{font-weight:700;font-size:12px;color:var(--muted);}
    .pchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
    .pchip{font-weight:800;font-size:11px;border-radius:99px;padding:3px 9px;background:#eef3fb;color:#6b86a3;}
    .pchip.hi{background:#eafce9;color:#46a302;} .pchip.mid{background:#fff5e0;color:#b07908;} .pchip.lo{background:#fdecea;color:#c0392b;}
    .cols{display:flex;gap:14px;flex-wrap:wrap;}
    .col{flex:1;min-width:220px;}
    .col h3{font-family:"Baloo 2";font-weight:800;font-size:14px;margin-bottom:4px;}
    .wlist{list-style:none;}
    .wlist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-weight:700;font-size:14px;}
    .wlist li:first-child{border-top:none;}
    .wpct{font-weight:800;font-size:12.5px;}
    .wpct.hi{color:#46a302;} .wpct.mid{color:#b07908;} .wpct.lo{color:#c0392b;}
    .muted{color:var(--muted);font-weight:700;}
    .small{font-size:12.5px;}
    .note{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.5;margin-top:16px;}
    .reporthead{display:none;}
    @media print{
      body{background:#fff;}
      .topbar .btn,.back,.signout,.note .nolink{display:none !important;}
      .card,.stat{box-shadow:none;border:1px solid #e0e8f0;}
      .reporthead{display:block;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="brand"><img src="/coach/leo-icon.png" alt="Sona"/> Sona · SLP</span>
      <button class="btn" id="print">🖨 Print / Save PDF</button>
    </div>
    <a href="/slp-families.html" class="back">← Back to caseload</a>

    <div class="reporthead"><p class="muted small" id="reportMeta"></p></div>

    <div id="content"><p class="muted" style="margin-top:20px;">Loading…</p></div>

    <p class="note">Auto-scored from at-home practice with Sona. A practice/progress aid — not a diagnosis or a substitute for professional clinical judgment.</p>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var code="", id=(new URLSearchParams(location.search)).get("id")||"";
    function lbl(s){ return (window.Sona&&Sona.soundLabel)?Sona.soundLabel(s):s; }
    function cls(p){ return p>=80?'hi':(p>=50?'mid':'lo'); }
    function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
    function ago(iso){ if(!iso)return "no activity yet"; var d=(Date.now()-new Date(iso).getTime())/86400000; if(d<1)return "today"; if(d<2)return "yesterday"; return Math.floor(d)+" days ago"; }
    var POSN={i:"Initial",m:"Medial",f:"Final",v:"Vocalic R",b:"Blends"};

    $("print").onclick=function(){ window.print(); };

    function posChips(byPos){
      if(!byPos) return "";
      var bits=["i","m","f","v","b"].map(function(pk){ var x=byPos[pk]; if(!x||!x.a) return ""; var v=Math.round((x.p||0)/Math.max(1,x.a)*100); return '<span class="pchip '+cls(v)+'">'+POSN[pk]+' '+v+'% <span style="opacity:.7;">('+x.a+')</span></span>'; }).filter(Boolean);
      return bits.length? '<div class="pchips">'+bits.join("")+'</div>' : "";
    }

    function render(k){
      var out=k.outcomes||{}, sounds=Object.keys(out);
      var att=0,pass=0, words=[];
      sounds.forEach(function(s){ var o=out[s]||{}; att+=(o.attempts||0); pass+=(o.passes||0);
        Object.keys(o.byWord||{}).forEach(function(w){ var bw=o.byWord[w]; if(bw&&bw.a){ words.push({word:w,sound:s,a:bw.a,p:bw.p||0,pct:Math.round((bw.p||0)/bw.a*100)}); } });
      });
      var acc= att? Math.round(pass/att*100): null;

      var name=k.child||"Child";
      var sub=[ k.age?("age "+k.age):"", k.focus?("target: "+lbl(k.focus)):"", "last active "+ago(k.at) ].filter(Boolean).join("  ·  ");
      var goalLine = k.goal? '<div class="meta">🎯 Assigned goal: '+esc(String(k.goal))+' words a day</div>' : '';

      // accuracy by sound (most-practiced first)
      var sndHtml = sounds.length? sounds.sort(function(a,b){return (out[b].attempts||0)-(out[a].attempts||0);}).map(function(s){
        var o=out[s]||{}, p=Math.round((o.passes||0)/Math.max(1,o.attempts||0)*100);
        return '<div class="sndrow"><div class="sndtop"><span class="chip '+cls(p)+'">'+esc(lbl(s))+' <b>'+p+'%</b></span><span class="sndcount">'+(o.attempts||0)+' productions'+(p>=80&&(o.attempts||0)>=10?' · approaching mastery ✅':'')+'</span></div>'+posChips(o.byPos)+'</div>';
      }).join("") : '<p class="muted small">No practice recorded yet.</p>';

      // words mastered vs keep practicing
      var mastered=words.filter(function(w){return w.pct>=80 && w.a>=2;}).sort(function(a,b){return b.pct-a.pct||b.a-a.a;}).slice(0,12);
      var towork=words.filter(function(w){return w.pct<60;}).sort(function(a,b){return a.pct-b.pct||b.a-a.a;}).slice(0,12);
      function wli(arr){ return arr.length? '<ul class="wlist">'+arr.map(function(w){return '<li><span>'+esc(w.word)+' <span class="muted small">('+esc(lbl(w.sound))+')</span></span><span class="wpct '+cls(w.pct)+'">'+w.pct+'% <span class="muted">·'+w.a+'</span></span></li>';}).join("")+'</ul>' : '<p class="muted small">—</p>'; }

      $("reportMeta").textContent="Sona progress report · "+name+" · generated "+new Date().toLocaleDateString();
      $("content").innerHTML =
        '<h1>'+esc(name)+(k.age?' <span class="age">age '+esc(String(k.age))+'</span>':'')+'</h1>'+
        '<div class="meta">'+esc(sub)+'</div>'+goalLine+
        '<div class="stats">'+
          '<div class="stat"><div class="n">'+att+'</div><div class="l">Productions</div></div>'+
          '<div class="stat"><div class="n">'+(acc==null?"–":acc+"%")+'</div><div class="l">Overall accuracy</div></div>'+
          '<div class="stat"><div class="n">'+sounds.length+'</div><div class="l">Sounds practiced</div></div>'+
          '<div class="stat"><div class="n">'+(k.sessions||0)+'</div><div class="l">Sessions</div></div>'+
          '<div class="stat"><div class="n">'+(k.streak||0)+'</div><div class="l">Day streak 🔥</div></div>'+
        '</div>'+
        '<div class="card"><h2>Accuracy by sound &amp; position <span class="hint">% correct · (productions)</span></h2>'+sndHtml+'</div>'+
        '<div class="card"><h2>Words</h2><div class="cols">'+
          '<div class="col"><h3>✅ Mastered</h3>'+wli(mastered)+'</div>'+
          '<div class="col"><h3>🎯 Keep practicing</h3>'+wli(towork)+'</div>'+
        '</div></div>';
    }

    function load(){
      fetch("/api/slp?code="+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(j){
        if(!j||!j.ok||!j.configured){ $("content").innerHTML='<p class="muted" style="margin-top:20px;">Couldn’t load this family right now.</p>'; return; }
        var k=(j.kids||[]).filter(function(x){return x.childId===id;})[0];
        if(!k){ $("content").innerHTML='<p class="muted" style="margin-top:20px;">That family wasn’t found on your roster. <a href="/slp-families.html">Back to caseload →</a></p>'; return; }
        render(k);
      }).catch(function(){ $("content").innerHTML='<p class="muted" style="margin-top:20px;">Couldn’t load right now.</p>'; });
    }
    fetch("/api/slp/auth/me").then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok){ location.replace("/slp-login.html"); return; }
      code=j.code||""; if(!code||!id){ location.replace("/slp-families.html"); return; }
      load();
    }).catch(function(){ location.replace("/slp-login.html"); });
  </script>
</body>
</html>
