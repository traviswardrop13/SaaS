<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — meet your coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;
      font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;background:#eef5ff;color:#1f2937;}
    #stage{position:fixed;inset:0;}

    #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b1220;display:none;}
    #video.show{display:block;}

    #coachStage{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
      background:radial-gradient(1100px 800px at 50% 30%, #ffffff, #e8f1ff);}
    #coachStage.show{display:flex;}
    #orb{width:180px;height:180px;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#dbeafe,#fef9c3);
      box-shadow:0 22px 60px rgba(30,64,175,.18);transition:transform .2s;}
    #orb.speaking{animation:talk 1s ease-in-out infinite;}
    @keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .coachpic{width:100%;height:100%;object-fit:cover;display:block;}
    #coachStage .who{margin-top:16px;font-family:"Baloo 2";font-weight:800;color:#0f2742;font-size:20px;opacity:.85;}

    #bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
      padding:14px 16px;opacity:0;transition:opacity .35s;pointer-events:none;}
    #bar.show{opacity:1;}
    #dots{display:flex;gap:6px;flex:1;max-width:280px;}
    .dot{height:6px;flex:1;border-radius:99px;background:rgba(120,140,170,.35);transition:.3s;}
    .dot.done{background:#22c55e;} .dot.cur{background:#1cb0f6;}
    #leave{pointer-events:auto;border:none;cursor:pointer;width:42px;height:42px;border-radius:50%;
      background:rgba(255,255,255,.92);color:#ef4444;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.22);}

    #caption{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);z-index:25;
      max-width:min(90vw,640px);text-align:center;font-family:"Baloo 2";font-weight:800;
      font-size:clamp(18px,2.7vw,28px);line-height:1.25;padding:0 12px;opacity:0;transition:opacity .25s;}
    #caption.show{opacity:1;}
    #caption.onvideo{color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.6);}
    #caption.onlight{color:#0f2742;}

    #wordCard{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);z-index:26;
      background:#fff;border-radius:28px;padding:22px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;
      box-shadow:0 22px 60px rgba(15,39,66,.28);opacity:0;pointer-events:none;transition:.3s;}
    #wordCard.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
    #wordCard .emoji{font-size:84px;line-height:1;}
    #wordCard .word{font-family:"Baloo 2";font-weight:800;font-size:46px;color:#0e9add;letter-spacing:.5px;}
    #wordCard .chip{margin-top:4px;font-family:"Baloo 2";font-weight:800;font-size:13px;letter-spacing:.08em;
      color:#16a34a;background:#dcfce7;padding:5px 12px;border-radius:99px;text-transform:uppercase;}

    #mic{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:27;width:84px;height:84px;border-radius:50%;
      background:#1cb0f6;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;
      box-shadow:0 10px 30px rgba(28,176,246,.45);}
    #mic.show{display:flex;animation:pulse 1.4s infinite;}
    #mic.rec{background:#ef4444;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.5)}70%{box-shadow:0 0 0 24px rgba(28,176,246,0)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0)}}
    #mic svg{width:38px;height:38px;}
    #micHint{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:27;font-family:"Baloo 2";font-weight:800;
      font-size:14px;color:#0f2742;background:rgba(255,255,255,.85);padding:6px 14px;border-radius:99px;display:none;}
    #micHint.show{display:block;}

    #unmute{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:35;border:none;cursor:pointer;display:none;
      background:rgba(0,0,0,.62);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:15px;padding:12px 20px;border-radius:99px;}
    #unmute.show{display:block;}

    #dbg{position:fixed;left:10px;bottom:10px;z-index:50;max-width:60vw;font:600 11px/1.4 ui-monospace,monospace;
      color:#8aa0bd;background:rgba(255,255,255,.6);padding:5px 9px;border-radius:8px;display:none;}
    #dbg.show{display:block;}

    .screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:30px;background:radial-gradient(1000px 760px at 50% 28%, #ffffff, #e8f1ff);}
    .screen.hidden{display:none;}
    .bigorb{width:128px;height:128px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:68px;
      background:linear-gradient(160deg,#dbeafe,#fef9c3);box-shadow:0 18px 50px rgba(30,64,175,.18);margin-bottom:22px;}
    h1{font-family:"Baloo 2";font-weight:800;font-size:clamp(26px,4.6vw,40px);color:#0f2742;}
    p.sub{margin-top:10px;max-width:430px;color:#475569;font-weight:600;font-size:16px;line-height:1.4;}
    #joinBtn{margin-top:26px;border:none;cursor:pointer;font-family:"Baloo 2";font-weight:800;font-size:20px;color:#fff;
      background:#22c55e;padding:18px 42px;border-radius:22px;box-shadow:0 6px 0 0 #16a34a;transition:transform .05s;}
    #joinBtn:active{transform:translateY(4px);box-shadow:0 2px 0 0 #16a34a;}
    #joinBtn:disabled{opacity:.6;cursor:default;}
    #previewLink{margin-top:16px;background:none;border:none;cursor:pointer;color:#0e9add;font-weight:700;font-size:14px;text-decoration:underline;}
    .spinner{width:54px;height:54px;border-radius:50%;border:5px solid #cfe0ff;border-top-color:#1cb0f6;
      animation:spin 1s linear infinite;margin-bottom:20px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    #err{margin-top:16px;max-width:470px;background:#fff0f0;border:1px solid #ffd2d2;border-radius:14px;padding:12px 14px;
      color:#b42323;font-size:13px;white-space:pre-wrap;text-align:left;display:none;}
    #err.show{display:block;}
    #doneBtn{margin-top:24px;border:none;cursor:pointer;font-family:"Baloo 2";font-weight:800;font-size:18px;color:#fff;
      background:#1cb0f6;padding:16px 38px;border-radius:20px;box-shadow:0 5px 0 0 #0e9add;text-decoration:none;}
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline></video>
    <div id="coachStage"><div id="orb"><img class="coachpic" src="/coach.jpg" onerror="this.onerror=null;this.src='/coach-avatar.svg'" alt="coach" /></div><div class="who" id="coachWho">Coach</div></div>

    <div id="caption" class="onlight"></div>

    <div id="wordCard">
      <span class="emoji" id="wcEmoji">🐰</span>
      <span class="word" id="wcWord">rabbit</span>
      <span class="chip" id="wcChip">R sound</span>
    </div>

    <button id="mic" title="I'm done">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="#fff"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="micHint">Your turn — say it!</div>
    <button id="unmute">🔊&nbsp;&nbsp;Tap for sound</button>

    <div id="bar">
      <div id="dots"></div>
      <button id="leave" title="Leave the call">&#10005;</button>
    </div>

    <div id="dbg"></div>

    <!-- JOIN -->
    <div id="join" class="screen">
      <div class="bigorb"><img class="coachpic" src="/coach.jpg" onerror="this.onerror=null;this.src='/coach-avatar.svg'" alt="coach" /></div>
      <h1>Your coach is ready to meet you!</h1>
      <p class="sub">Pop on your headphones and tap below — your coach will say hello and practice some words with you.</p>
      <button id="joinBtn">▶&nbsp;&nbsp;Start meeting</button>
      <button id="previewLink">Just listen (no video) — saves credits</button>
      <div id="err"></div>
    </div>

    <!-- CONNECTING -->
    <div id="connecting" class="screen hidden">
      <div class="spinner"></div>
      <h1>Connecting…</h1>
      <p class="sub">Getting your coach on the call.</p>
    </div>

    <!-- DONE -->
    <div id="done" class="screen hidden">
      <div class="bigorb">🎉</div>
      <h1>Great session!</h1>
      <p class="sub" id="doneSub">You practiced so well today.</p>
      <a class="btn" id="doneBtn" href="/home.html">Done</a>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script type="module">
    /* Zoom-style video call + practice lesson with recording.
       - Avatar (LITE): our ElevenLabs TTS -> live avatar face (when available).
       - Voice-only fallback: same lesson with voice via Web Audio + cards (0 credits).
       - On the child's turn we record their attempt (MediaRecorder) and score it
         (Web Speech) to mark each word correct / try-again, saving the audio for review. */
    const params = new URLSearchParams(location.search);
    const profile = (window.Sona ? Sona.getProfile() : { childName:"", focusSounds:[], voiceOn:true, coachName:"Coach" });
    const AVATAR_ID = params.get("avatar") || "513fd1b7-7ef9-466d-9af2-344e51eeb833"; // built-in "Ann" until a valid custom LiveAvatar id is set
    const VOICE_ID  = params.get("voice")  || "de5574fc-009e-4a01-a881-9919ef8f5a0c";
    const MODE = (params.get("mode") || "LITE").toUpperCase();
    const CHILD = params.get("name") || profile.childName || "friend";
    const COACH = (profile.coachName || "Coach").trim() || "Coach";
    const VOICE_ON = profile.voiceOn !== false;
    const CLOUD_SCORING = profile.cloudScoring !== false;
    let useSpeechAce = false;

    const focus = (profile.focusSounds || []);
    const TARGET = (params.get("sound") || focus[0] || "R").toUpperCase();

    // Articulation hierarchy: isolation -> syllables -> words for ONE target sound.
    const SOUND_PLAN = {
      R: { isolation:{ display:"rrr", say:"Let's make a big R sound. Pull your tongue back and turn your voice on — rrrr. Now you try!", scoreText:"rah" },
        syllables:[ {display:"rah",scoreText:"rah",say:"Now let's add a vowel — say rah!"},{display:"ray",scoreText:"ray",say:"Try ray!"},{display:"roo",scoreText:"roo",say:"And roo!"} ],
        words:[ {display:"rabbit",emoji:"🐰",scoreText:"rabbit",say:"Now the whole word — rabbit!"},{display:"rocket",emoji:"🚀",scoreText:"rocket",say:"Say rocket!"},{display:"ring",emoji:"💍",scoreText:"ring",say:"Say ring!"} ] },
      S: { isolation:{ display:"sss", say:"Let's make a quiet snake sound. Teeth together and smile — ssss. Your turn!", scoreText:"sah" },
        syllables:[ {display:"sah",scoreText:"sah",say:"Add a vowel — sah!"},{display:"see",scoreText:"see",say:"Try see!"},{display:"so",scoreText:"so",say:"And so!"} ],
        words:[ {display:"sun",emoji:"☀️",scoreText:"sun",say:"Whole word — sun!"},{display:"snake",emoji:"🐍",scoreText:"snake",say:"Say snake!"},{display:"soap",emoji:"🧼",scoreText:"soap",say:"Say soap!"} ] },
      L: { isolation:{ display:"lll", say:"Let's make the L sound. Tongue tip up behind your teeth — llll. Now you!", scoreText:"lah" },
        syllables:[ {display:"lah",scoreText:"lah",say:"Say lah!"},{display:"lee",scoreText:"lee",say:"Try lee!"},{display:"low",scoreText:"low",say:"And low!"} ],
        words:[ {display:"lion",emoji:"🦁",scoreText:"lion",say:"Whole word — lion!"},{display:"leaf",emoji:"🍃",scoreText:"leaf",say:"Say leaf!"},{display:"ball",emoji:"⚽",scoreText:"ball",say:"Say ball!"} ] },
      K: { isolation:{ display:"k! k!", say:"Let's make the K sound. Lift the back of your tongue — k! k! Now you!", scoreText:"kah" },
        syllables:[ {display:"kah",scoreText:"kah",say:"Say kah!"},{display:"key",scoreText:"key",say:"Try key!"},{display:"ko",scoreText:"ko",say:"And ko!"} ],
        words:[ {display:"cat",emoji:"🐱",scoreText:"cat",say:"Whole word — cat!"},{display:"key",emoji:"🔑",scoreText:"key",say:"Say key!"},{display:"cake",emoji:"🍰",scoreText:"cake",say:"Say cake!"} ] },
    };
    const PLAN = SOUND_PLAN[TARGET] || SOUND_PLAN.R;
    const TARGET_SOUND = SOUND_PLAN[TARGET] ? TARGET : "R";
    const STEPS = [
      { level:"isolation", sound:TARGET_SOUND, mode:"phoneme", display:PLAN.isolation.display, say:PLAN.isolation.say, scoreText:PLAN.isolation.scoreText },
      ...PLAN.syllables.map(s => ({ level:"syllable", sound:TARGET_SOUND, mode:"phoneme", display:s.display, say:s.say, scoreText:s.scoreText })),
      ...PLAN.words.map(w => ({ level:"word", sound:TARGET_SOUND, mode:"full", display:w.display, say:w.say, scoreText:w.scoreText, emoji:w.emoji })),
    ];

    const PRAISE = ["Yay! That was wonderful.","Great job — I heard it!","Awesome work!","So good! High five!","You're doing amazing."];
    const ENCOURAGE = ["Good try! Let's keep going.","Nice effort — on to the next one!","You're working so hard. Let's try another."];

    const video = document.getElementById("video");
    const coachStage = document.getElementById("coachStage");
    const orb = document.getElementById("orb");
    const captionEl = document.getElementById("caption");
    const wordCard = document.getElementById("wordCard");
    const wcEmoji = document.getElementById("wcEmoji");
    const wcWord = document.getElementById("wcWord");
    const wcChip = document.getElementById("wcChip");
    const mic = document.getElementById("mic");
    const micHint = document.getElementById("micHint");
    const bar = document.getElementById("bar");
    const dotsEl = document.getElementById("dots");
    const joinScreen = document.getElementById("join");
    const connScreen = document.getElementById("connecting");
    const doneScreen = document.getElementById("done");
    const joinBtn = document.getElementById("joinBtn");
    const previewLink = document.getElementById("previewLink");
    const errEl = document.getElementById("err");
    const unmuteBtn = document.getElementById("unmute");
    const dbgEl = document.getElementById("dbg");
    document.getElementById("coachWho").textContent = COACH;

    let session = null, SDK = null, alive = true, avatarLive = false, micStream = null;
    let streamReady = false, readyResolve = null, readyPromise = null;
    let audioCtx = null;
    const resetReady = () => { streamReady = false; readyPromise = new Promise(r => readyResolve = r); };
    const waitReady = (ms = 12000) => streamReady ? Promise.resolve()
      : Promise.race([readyPromise || Promise.resolve(), new Promise(r => setTimeout(r, ms))]);
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const showDbg = (t) => { dbgEl.textContent = t; dbgEl.classList.add("show"); };

    function setCaption(t){ captionEl.textContent = t || ""; captionEl.classList.toggle("show", !!t);
      captionEl.classList.toggle("onvideo", avatarLive); captionEl.classList.toggle("onlight", !avatarLive); }
    function showStep(s){
      if(!s){ wordCard.classList.remove("show"); return; }
      if(s.level === "word"){ wcEmoji.style.display = ""; wcEmoji.textContent = s.emoji || ""; wcWord.textContent = s.display; }
      else { wcEmoji.style.display = "none"; wcWord.textContent = s.display; } // isolation/syllable: big text, no emoji
      wcChip.textContent = s.sound + " sound";
      wordCard.classList.add("show");
    }
    function buildDots(){ dotsEl.innerHTML=""; STEPS.forEach(()=>{ const d=document.createElement("div"); d.className="dot"; dotsEl.appendChild(d); }); }
    function setDot(i){ [...dotsEl.children].forEach((d,k)=>{ d.className = "dot" + (k<i?" done":k===i?" cur":""); }); }
    const pulse = (on) => orb.classList.toggle("speaking", !!on);

    let hideT;
    function unmuteVideo(){ try{ video.muted = false; video.play().catch(()=>{}); }catch{} unmuteBtn.classList.remove("show"); }
    function pokeBar(){ bar.classList.add("show"); clearTimeout(hideT); hideT = setTimeout(()=>bar.classList.remove("show"), 2800);
      if(avatarLive && video.muted) unmuteVideo(); }
    ["mousemove","touchstart","click"].forEach(ev => window.addEventListener(ev, pokeBar));

    function getCtx(){ if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); }
      if(audioCtx.state === "suspended") audioCtx.resume(); return audioCtx; }
    function playPCM(bytes){
      return new Promise((resolve)=>{
        try{
          const ctx = getCtx();
          const n = bytes.byteLength >> 1;
          const ab = ctx.createBuffer(1, n, 24000);
          const ch = ab.getChannelData(0);
          const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
          for(let i=0;i<n;i++) ch[i] = dv.getInt16(i*2, true) / 32768;
          const src = ctx.createBufferSource();
          src.buffer = ab; src.connect(ctx.destination);
          src.onended = () => resolve();
          src.start();
        }catch(e){ console.warn("playPCM failed", e); resolve(); }
      });
    }

    async function loadSDK(){
      if(SDK) return SDK;
      const urls = ["https://esm.sh/@heygen/liveavatar-web-sdk","https://cdn.jsdelivr.net/npm/@heygen/liveavatar-web-sdk/+esm"];
      let lastErr;
      for(const u of urls){
        try{ const m = await import(/* @vite-ignore */ u);
          if(m && m.LiveAvatarSession){ SDK = { LiveAvatarSession:m.LiveAvatarSession, SessionEvent:m.SessionEvent }; return SDK; } }
        catch(e){ lastErr = e; }
      }
      throw lastErr || new Error("SDK failed to load");
    }

    async function speak(text){
      if(!text || !alive) return;
      setCaption(text);
      if(!VOICE_ON){ await sleep(Math.min(4500, 700 + text.length*45)); return; }
      pulse(true);
      try{
        const res = await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
        if(!res.ok){ let m = "TTS error " + res.status; try{ const j = await res.json(); m = j.error || m; if(j.detail) m += "\n"+j.detail; }catch{} throw new Error(m); }
        const buf = new Uint8Array(await res.arrayBuffer());
        if(avatarLive && session){
          await waitReady(8000);
          let bin = ""; const CH = 0x8000;
          for(let i=0;i<buf.length;i+=CH) bin += String.fromCharCode.apply(null, buf.subarray(i, i+CH));
          const durMs = (buf.length/(24000*2))*1000;
          session.repeatAudio(btoa(bin)); // LiveAvatar expects base64 PCM-24000, not a raw binary string
          await sleep(durMs + 900);
        } else {
          await playPCM(buf);
          await sleep(550);
        }
      }catch(e){ console.warn("speak failed", e); }
      finally{ pulse(false); }
    }

    /* Score the child's attempt from a transcript. true = match, false = miss, null = no speech. */
    function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
    function scoreMatch(transcript, target){
      const t = norm(transcript), w = norm(target);
      if(!t) return null;
      if(t.includes(w) || w.includes(t)) return true;
      let i=0; while(i<Math.min(t.length,w.length) && t[i]===w[i]) i++;
      return i >= 3;
    }

    async function detectScorer(){
      if(!CLOUD_SCORING){ useSpeechAce = false; return; }
      try{ const r = await fetch("/api/score"); const j = await r.json(); useSpeechAce = !!(j && j.hasKey); }
      catch{ useSpeechAce = false; }
    }

    /* Score the attempt: SpeechAce (phoneme-level) when available, else the browser transcript. */
    async function scoreAttempt(step, blob, transcript){
      if(useSpeechAce && blob){
        try{
          setCaption("Let me listen…");
          const fd = new FormData();
          fd.append("audio", new File([blob], "attempt.webm", { type: blob.type || "audio/webm" }));
          fd.append("text", step.scoreText);
          fd.append("targetSound", step.sound);
          fd.append("userId", CHILD || "child");
          fd.append("mode", step.mode || "full"); // lenient phoneme mode for isolation/syllables
          const r = await fetch("/api/score", { method: "POST", body: fd });
          const j = await r.json();
          if(j && j.ok){ return { ok: j.rating !== "tryAgain", score: j.score, rating: j.rating, feedback: j.feedback, transcript: j.transcript || transcript, source: "speechace" }; }
          console.warn("speechace not ok:", j && j.error);
        }catch(e){ console.warn("speechace error", e); }
      }
      return { ok: scoreMatch(transcript, step.scoreText) === true, transcript, source: "browser" };
    }

    /* the child's turn: record audio + recognize speech, resolve on tap / final result / timeout */
    function recordTurn(word, maxMs=7000){
      return new Promise((resolve)=>{
        let done=false, chunks=[], rec=null, sr=null, transcript="";
        const cleanup=()=>{ try{ rec && rec.state!=="inactive" && rec.stop(); }catch{} try{ sr && sr.stop(); }catch{}
          mic.classList.remove("show","rec"); micHint.classList.remove("show"); mic.onclick=null; };
        const finish=()=>{ if(done) return; done=true; cleanup();
          setTimeout(()=>{
            const blob = chunks.length ? new Blob(chunks, { type:(rec&&rec.mimeType)||"audio/webm" }) : null;
            resolve({ transcript, blob });
          }, 150);
        };
        try{ if(micStream && window.MediaRecorder){ rec = new MediaRecorder(micStream); rec.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); }; rec.start(); mic.classList.add("rec"); } }catch(e){ console.warn("recorder", e); }
        try{ const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if(SR){ sr = new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3;
            sr.onresult = (ev)=>{ for(const r of ev.results){ for(let i=0;i<r.length;i++) transcript += " " + r[i].transcript; } finish(); };
            sr.onerror = ()=>{}; sr.start(); } }catch(e){ console.warn("speech-rec", e); }
        mic.classList.add("show"); micHint.classList.add("show"); mic.onclick = finish;
        setTimeout(finish, maxMs);
      });
    }

    async function startAvatar(){
      const { LiveAvatarSession, SessionEvent } = await loadSDK();
      if(session){ try{ await session.stop(); }catch{} session = null; }
      resetReady(); avatarLive = false;
      const tp = new URLSearchParams(location.search);
      tp.set("avatar", AVATAR_ID); tp.set("voice", VOICE_ID); if(!tp.get("mode")) tp.set("mode", MODE);
      const res = await fetch(`/api/heygen/token?${tp.toString()}`, { method:"POST" });
      const data = await res.json();
      if(!data.ok || !data.token) throw new Error((data && data.error) || "token error");
      session = new LiveAvatarSession(data.token, { voiceChat:false });
      session.on(SessionEvent.SESSION_STREAM_READY, () => {
        streamReady = true; avatarLive = true; readyResolve && readyResolve();
        // attach AFTER the stream is ready (attaching before start() binds nothing)
        try { session.attach(video); } catch(e){ console.warn("attach failed", e); }
        video.play().catch(async () => { video.muted = true; try { await video.play(); } catch(e){} unmuteBtn.classList.add("show"); });
      });
      session.on(SessionEvent.SESSION_DISCONNECTED, () => { streamReady = false; });
      await session.start();
      await waitReady();
      if(!avatarLive) throw new Error("stream not ready (avatar didn't send video)");
    }

    async function join(useAvatar){
      joinBtn.disabled = true; previewLink.disabled = true;
      errEl.classList.remove("show"); errEl.textContent = "";
      getCtx();
      try { video.play().catch(()=>{}); } catch {} // prime within the gesture
      // mic up front (for recording the child's turns)
      try { micStream = await navigator.mediaDevices.getUserMedia({ audio:true }); } catch(e){ micStream = null; showDbg("mic: " + (e && e.message || e)); }
      joinScreen.classList.add("hidden");
      connScreen.classList.remove("hidden");
      try{
        if(useAvatar){
          try{ await startAvatar(); }
          catch(e){ console.warn("avatar unavailable — voice-only:", e); avatarLive = false; showDbg("avatar → audio-only: " + String(e && e.message || e)); }
        }
        connScreen.classList.add("hidden");
        if(avatarLive){ video.classList.add("show"); } else { coachStage.classList.add("show"); }
        pokeBar();
        await detectScorer();
        await runLesson();
      }catch(err){
        console.error(err);
        connScreen.classList.add("hidden"); joinScreen.classList.remove("hidden");
        errEl.textContent = friendly(String(err && err.message || err));
        errEl.classList.add("show");
      }finally{
        joinBtn.disabled = false; previewLink.disabled = false;
      }
    }

    function friendly(m){
      if(/credit/i.test(m)) return "Your coach is out of video time right now (avatar credits). You can still tap “Just listen” to practice with her voice, or top up your LiveAvatar plan for the face.";
      if(/concurren/i.test(m)) return "Your coach is just finishing another call. Wait about a minute, then try again.";
      return m;
    }

    async function runLesson(){
      await speak(`Hi ${CHILD}! I'm so happy to see you. I'm your speech coach.`);
      await speak(`Today we're working on the ${TARGET_SOUND} sound. Watch me first, then it's your turn!`);
      const practiced = [];
      let lastLevel = "";
      for(let i=0;i<STEPS.length && alive;i++){
        const s = STEPS[i]; setDot(i);
        // a gentle level transition the first time we reach syllables / words
        if(s.level !== lastLevel){
          if(s.level === "syllable") await speak("Great! Now let's put it together.");
          else if(s.level === "word") await speak("You're ready for whole words!");
          lastLevel = s.level;
        }
        showStep(s);
        await speak(s.say);
        const res = await recordTurn(s);
        const sc = await scoreAttempt(s, res.blob, res.transcript);
        const ok = sc.ok;
        practiced.push({ word:s.display, sound:s.sound, level:s.level, ok, score:sc.score });
        if(res.blob && window.Sona && Sona.saveRecording){ Sona.saveRecording({ word:s.display, sound:s.sound, level:s.level, ok, score:sc.score||null, transcript:sc.transcript||"", source:sc.source, blob:res.blob }); }
        showStep(null);
        await speak(ok ? pick(PRAISE) : (sc.feedback || pick(ENCOURAGE)));
      }
      setDot(STEPS.length); setCaption("");
      await speak(`Awesome work on your ${TARGET_SOUND} sounds today, ${CHILD}! I'm so proud of you!`);
      if(window.Sona) Sona.recordSession({ words: practiced });
      endSession(practiced);
    }

    function endSession(practiced){
      const great = practiced.filter(p=>p.ok).length;
      document.getElementById("doneSub").textContent = `Great ${TARGET_SOUND} practice, ${CHILD} — ${great} of ${practiced.length} sounded great! 🎉`;
      doneScreen.classList.remove("hidden");
      try{ session?.stop(); }catch{}
      try{ micStream?.getTracks().forEach(t=>t.stop()); }catch{}
    }

    function leave(){ alive = false; try{ session?.stop(); }catch{} try{ micStream?.getTracks().forEach(t=>t.stop()); }catch{} location.href = "/home.html"; }

    buildDots();
    joinBtn.onclick = () => join(true);
    previewLink.onclick = () => join(false);
    document.getElementById("leave").onclick = leave;
    unmuteBtn.onclick = unmuteVideo;
    window.addEventListener("pagehide", () => { try{ session?.stop(); }catch{} try{ micStream?.getTracks().forEach(t=>t.stop()); }catch{} });
    console.log("call.html (lesson+recording) ready · mode", MODE, "· avatar", AVATAR_ID);
  </script>
</body>
