<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sona</title>
  <link rel="stylesheet" href="/sona.css" />
</head>
<body>
  <!-- call.html is retired (old live-avatar lesson). Send anyone who lands here
       to the new clean lesson, preserving the chosen sound. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var sound = q.get("sound");
      if (sound) {
        var dest = "/lesson.html?sound=" + encodeURIComponent(sound);
        var name = q.get("name"); if (name) dest += "&name=" + encodeURIComponent(name);
        location.replace(dest);
      } else {
        location.replace("/home.html");
      }
    })();
  </script>
  <div class="wrap" style="text-align:center;padding-top:80px;">
    <p class="muted">Taking you to your practice…</p>
    <p style="margin-top:14px;"><a href="/home.html">Tap here if it doesn't load.</a></p>
  </div>
</body>
</html>
