<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — meet your coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;
      font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;background:#eef5ff;color:#1f2937;}
    #stage{position:fixed;inset:0;}

    /* full-bleed avatar — like a video call */
    #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b1220;display:none;}
    #video.show{display:block;}

    /* top bar (auto-hides like Zoom) — only a tiny Leave control lives here */
    #bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
      padding:16px 18px;opacity:0;transition:opacity .35s;pointer-events:none;
      background:linear-gradient(to bottom, rgba(0,0,0,.28), transparent);}
    #bar.show{opacity:1;}
    #live{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.45);}
    #live .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;animation:bp 1.6s infinite;}
    @keyframes bp{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
    #leave{pointer-events:auto;border:none;cursor:pointer;width:44px;height:44px;border-radius:50%;
      background:rgba(255,255,255,.92);color:#ef4444;font-size:18px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);}

    /* captions of what the coach is saying */
    #caption{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);z-index:25;
      max-width:min(90vw,640px);text-align:center;color:#fff;font-family:"Baloo 2";font-weight:800;
      font-size:clamp(18px,2.7vw,28px);line-height:1.25;text-shadow:0 2px 16px rgba(0,0,0,.6);
      opacity:0;transition:opacity .25s;padding:0 12px;}
    #caption.show{opacity:1;}

    /* clean light screens before the call (join + connecting) */
    .screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:30px;background:radial-gradient(1000px 760px at 50% 28%, #ffffff, #e8f1ff);}
    .screen.hidden{display:none;}
    .orb{width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:68px;
      background:linear-gradient(160deg,#dbeafe,#fef9c3);box-shadow:0 18px 50px rgba(30,64,175,.18);margin-bottom:22px;}
    h1{font-family:"Baloo 2";font-weight:800;font-size:clamp(26px,4.6vw,40px);color:#0f2742;}
    p.sub{margin-top:10px;max-width:430px;color:#475569;font-weight:600;font-size:16px;line-height:1.4;}
    #joinBtn{margin-top:26px;border:none;cursor:pointer;font-family:"Baloo 2";font-weight:800;font-size:20px;color:#fff;
      background:#22c55e;padding:18px 42px;border-radius:22px;box-shadow:0 6px 0 0 #16a34a;transition:transform .05s;}
    #joinBtn:active{transform:translateY(4px);box-shadow:0 2px 0 0 #16a34a;}
    #joinBtn:disabled{opacity:.6;cursor:default;}
    .spinner{width:54px;height:54px;border-radius:50%;border:5px solid #cfe0ff;border-top-color:#1cb0f6;
      animation:spin 1s linear infinite;margin-bottom:20px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    #err{margin-top:16px;max-width:470px;background:#fff0f0;border:1px solid #ffd2d2;border-radius:14px;padding:12px 14px;
      color:#b42323;font-size:13px;white-space:pre-wrap;text-align:left;display:none;}
    #err.show{display:block;}
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline></video>
    <div id="caption"></div>

    <div id="bar">
      <div id="live"><span class="dot"></span> Live with your coach</div>
      <button id="leave" title="Leave the call">&#10005;</button>
    </div>

    <!-- JOIN (clean, light, single button) -->
    <div id="join" class="screen">
      <div class="orb">🦁</div>
      <h1>Your coach is ready to meet you!</h1>
      <p class="sub">Pop on your headphones and tap below — your coach will say hello and practice some words with you.</p>
      <button id="joinBtn">▶&nbsp;&nbsp;Start meeting</button>
      <div id="err"></div>
    </div>

    <!-- CONNECTING -->
    <div id="connecting" class="screen hidden">
      <div class="spinner"></div>
      <h1>Connecting…</h1>
      <p class="sub">Getting your coach on the call.</p>
    </div>
  </div>

  <script type="module">
    /* Zoom-style "video call with your coach": clean light join screen, then a
       full-bleed live avatar with no chrome except an auto-hiding Leave button.
       Reuses the proven LiveAvatar + our-TTS (LITE) path, with the same
       readiness gating and session cleanup as avatar.html/coach.html. */
    const params = new URLSearchParams(location.search);
    const AVATAR_ID = params.get("avatar") || "513fd1b7-7ef9-466d-9af2-344e51eeb833"; // Ann
    const VOICE_ID  = params.get("voice")  || "de5574fc-009e-4a01-a881-9919ef8f5a0c";
    const MODE = (params.get("mode") || "LITE").toUpperCase();
    const CHILD = (params.get("name") || "friend");

    const video = document.getElementById("video");
    const captionEl = document.getElementById("caption");
    const bar = document.getElementById("bar");
    const joinScreen = document.getElementById("join");
    const connScreen = document.getElementById("connecting");
    const joinBtn = document.getElementById("joinBtn");
    const errEl = document.getElementById("err");

    let session = null, SDK = null;
    let streamReady = false, readyResolve = null, readyPromise = null;
    const resetReady = () => { streamReady = false; readyPromise = new Promise(r => readyResolve = r); };
    const waitReady = (ms = 12000) => streamReady ? Promise.resolve()
      : Promise.race([readyPromise || Promise.resolve(), new Promise(r => setTimeout(r, ms))]);
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const setCaption = (t) => { captionEl.textContent = t || ""; captionEl.classList.toggle("show", !!t); };

    // auto-hide the top bar after a moment of no interaction (Zoom feel)
    let hideT;
    function pokeBar(){ if(!video.classList.contains("show")) return;
      bar.classList.add("show"); clearTimeout(hideT); hideT = setTimeout(() => bar.classList.remove("show"), 2600); }
    ["mousemove","touchstart","click"].forEach(ev => window.addEventListener(ev, pokeBar));

    async function loadSDK(){
      if(SDK) return SDK;
      const urls = ["https://esm.sh/@heygen/liveavatar-web-sdk","https://cdn.jsdelivr.net/npm/@heygen/liveavatar-web-sdk/+esm"];
      let lastErr;
      for(const u of urls){
        try{ const m = await import(/* @vite-ignore */ u);
          if(m && m.LiveAvatarSession){ SDK = { LiveAvatarSession:m.LiveAvatarSession, SessionEvent:m.SessionEvent }; return SDK; } }
        catch(e){ lastErr = e; }
      }
      throw lastErr || new Error("SDK failed to load");
    }

    async function speak(text){
      if(!text || !session) return;
      setCaption(text);
      await waitReady(8000);
      if(MODE !== "LITE"){ try{ session.repeat(text); }catch{} await sleep(Math.min(8000, 600 + text.length*55)); return; }
      const res = await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
      if(!res.ok){ let m = "TTS error " + res.status; try{ const j = await res.json(); m = j.error || m; if(j.detail) m += "\n" + j.detail; }catch{} throw new Error(m); }
      const buf = new Uint8Array(await res.arrayBuffer());
      let bin = ""; const CH = 0x8000;
      for(let i=0;i<buf.length;i+=CH) bin += String.fromCharCode.apply(null, buf.subarray(i, i+CH));
      const durMs = (buf.length/(24000*2))*1000;
      session.repeatAudio(bin);
      await sleep(durMs + 900);
    }

    async function join(){
      joinBtn.disabled = true; errEl.classList.remove("show"); errEl.textContent = "";
      try{
        const { LiveAvatarSession, SessionEvent } = await loadSDK();
        if(session){ try{ await session.stop(); }catch{} session = null; }
        resetReady();
        joinScreen.classList.add("hidden");
        connScreen.classList.remove("hidden");

        const tp = new URLSearchParams(location.search);
        tp.set("avatar", AVATAR_ID); tp.set("voice", VOICE_ID); if(!tp.get("mode")) tp.set("mode", MODE);
        const res = await fetch(`/api/heygen/token?${tp.toString()}`, { method:"POST" });
        const data = await res.json();
        if(!data.ok || !data.token) throw new Error("Token: " + (data.error || "unknown"));

        session = new LiveAvatarSession(data.token, { voiceChat:false });
        session.attach(video);
        session.on(SessionEvent.SESSION_STREAM_READY, () => {
          streamReady = true; readyResolve && readyResolve();
          connScreen.classList.add("hidden");
          video.classList.add("show");
          video.play().catch(() => {});
          pokeBar();
        });
        session.on(SessionEvent.SESSION_DISCONNECTED, () => { streamReady = false; });

        await session.start();
        await waitReady();
        // Warm greeting — canned lines so it works even without the Claude key.
        await speak(`Hi ${CHILD}! I'm so happy to see you. I'm your speech coach.`);
        await speak(`We're going to have so much fun practicing words together today.`);
        setCaption("");
      }catch(err){
        console.error(err);
        connScreen.classList.add("hidden");
        joinScreen.classList.remove("hidden");
        const m = String(err?.message || err);
        errEl.textContent = /concurren/i.test(m)
          ? "Your coach is just finishing another call. Please wait about a minute, then tap Start meeting again."
          : m;
        errEl.classList.add("show");
      }finally{
        joinBtn.disabled = false;
      }
    }

    function leave(){ try{ session?.stop(); }catch{} location.href = "/"; }

    joinBtn.onclick = join;
    document.getElementById("leave").onclick = leave;
    // free the session slot immediately when the tab is closed / navigated away
    window.addEventListener("pagehide", () => { try{ session?.stop(); }catch{} });
    console.log("call.html ready · mode", MODE, "· avatar", AVATAR_ID);
  </script>
</body>
</html>
