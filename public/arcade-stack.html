<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Block Stacker</title>
  <link href="/fonts.css" rel="stylesheet">
  <meta name="theme-color" content="#2b2e6b" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#2b2e6b,#5b3f8f 45%,#a45fae 75%,#e17aa4);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.25);}
    #tapHint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-family:"Baloo 2";font-weight:800;font-size:16px;color:#cfe3f7;z-index:4;pointer-events:none;}
    /* ── designed HUD kit (handoff section 4) ── */
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;z-index:5;}
    #close{border:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#b08d63;font-size:19px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 4px 0 rgba(30,20,70,.45);}
    .hudpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 14px;box-shadow:0 4px 0 rgba(30,20,70,.45);font-family:"Baloo 2";font-weight:800;font-size:16px;color:#4a2c14;}
    #score{flex:none;}
    #hudspacer{flex:1;}
    #timer{color:#ff5c74;letter-spacing:1px;}
    #boostChip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));top:auto;z-index:5;background:#fff;color:#4a2c14;font-family:"Baloo 2";font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:99px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 0 rgba(30,20,70,.45);transition:background .2s,color .2s;}
    #boostChip.hot{background:#ffd21c;color:#5c4500;animation:chipPop .4s ease;}
    @keyframes chipPop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
    /* ── warm-card overlays (handoff section 5) ── */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(30,22,50,.55);display:none;align-items:center;justify-content:center;padding:24px;}
    .ovl.show{display:flex;}
    .ovlCard{background:#fff6e9;border-radius:28px;padding:58px 20px 22px;width:100%;max-width:330px;text-align:center;box-shadow:0 18px 40px rgba(30,22,50,.45);position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;}
    .ovlEcho{position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:106px;height:106px;filter:drop-shadow(0 8px 12px rgba(30,22,50,.3));}
    .ovl .big{font-size:56px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:24px;color:#4a2c14;line-height:1.18;}
    .ovl h2 b{color:#7048c9;}
    .ovl p{color:#b08d63;font-weight:800;font-size:14.5px;max-width:270px;}
    .statRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .statPill{background:#fff;border-radius:99px;padding:8px 15px;font-family:"Baloo 2";font-weight:800;font-size:14.5px;color:#4a2c14;box-shadow:0 3px 0 rgba(120,80,20,.12);}
    .btn{border:none;border-radius:20px;padding:15px 30px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#6edd18,#58cc02);box-shadow:0 6px 0 #46a302;cursor:pointer;transition:transform .05s;margin-top:4px;width:100%;}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #46a302;}
    .btn.blue{background:linear-gradient(180deg,#5cc6ff,#1cb0f6);box-shadow:0 6px 0 #1480c0;}
    .btn.blue:active{box-shadow:0 2px 0 #1480c0;}
    .btn.ghost{background:none;box-shadow:none;color:#b08d63;text-transform:none;font-size:13px;width:auto;padding:8px;}
  </style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div class="hudpill"><svg viewBox="0 0 64 64" style="width:19px;height:19px;vertical-align:-4px"><rect x="8" y="19" width="48" height="27" rx="7" fill="#69db7c"/><rect x="8" y="19" width="48" height="9" rx="4.5" fill="#85e099"/><circle cx="18" cy="26" r="2.5" fill="#fff" opacity=".85"/></svg> <b id="score">0</b></div>
      <div id="hudspacer"></div>
      <div id="best" class="hudpill" style="font-size:13px;color:#b08d63;"></div>
    </div>
    <div id="flash"></div>
    <div id="tapHint">Tap to drop the block!</div>
    <div id="boostChip"></div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/coach/echo/echo-star.svg" alt="" />
      <h2 id="needTitle">This game needs a ticket!</h2>
      <p>Say your sound 5 times to charge it up</p>
      <button class="btn" id="goCharge"><svg viewBox="0 0 64 64" style="width:18px;height:18px;vertical-align:-3px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg> Charge up</button>
      <button class="btn ghost" id="needHome">Back home</button>
    </div>
  </div>

  <div class="ovl" id="revOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/coach/echo/echo-listening.svg" alt="" />
      <h2 id="revTitle">Say it!</h2>
      <p id="revHearts" style="font-size:26px;"></p>
      <p>Say your sound for a new life!</p>
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 4px 0 #ef6f23,0 0 0 10px rgba(255,138,61,.14);display:flex;align-items:center;justify-content:center;margin:2px 0;"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
      <p style="font-size:13px;">I'm listening…</p>
      <button class="btn ghost" id="revDone">I'm done playing</button>
    </div>
  </div>

  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/coach/echo/echo-celebrate.svg" alt="" />
      <div class="big" id="endEmoji"><svg viewBox="0 0 64 64" style="width:56px;height:56px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg></div>
      <h2 id="endTitle">Great round!</h2>
      <p id="endSub"></p>
      <button class="btn blue" id="endCharge"><svg viewBox="0 0 64 64" style="width:18px;height:18px;vertical-align:-3px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg> Next game</button>
      <button class="btn" id="endAgain" style="display:none;"></button>
      <button class="btn ghost" id="endHome">Back to the house</button>
    </div>
  </div>


  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    var fromCharge=qp.get("from")==="charge";
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }
    // ---- charge gate: a round is unlocked by the 5-rep charge (play token) ----
    var SELF="arcade-stack.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ tok=sessionStorage.getItem("sona.play.token")==="1"; sessionStorage.removeItem("sona.play.token"); }catch(e){}
    if(!tok){ try{ $("needTitle").textContent="Block Stacker needs a ticket!"; }catch(e){} $("needOvl").classList.add("show"); }

    // best height (local, just for pride)
    var BKEY="sona.stack.best"; var best=0; try{ best=parseInt(localStorage.getItem(BKEY)||"0",10)||0; }catch(e){}
    if(best) $("best").textContent="Best: "+best;

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    var COLORS=["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#4dabf7","#9775fa","#f783ac"];
    var BH=34;                       // block height
    var baseW=Math.min(W*0.62,240); // starting width
    var stack=[{x:(W-baseW)/2,w:baseW,c:COLORS[0]}];
    // kid pace: slow slide to start, gentle ramp per drop
    var cur={x:0,w:baseW,dir:1,c:COLORS[1]}, speed=Math.max(2.1,W*0.0042);
    var playing=true, dropping=false, camY=0, score=0, perfectRun=0;
    // ── lives: a crash → say your sound for a new life (3 per run) ──
    var REV=3, reviveWait=false, MIC=false;
    function hearts(){ $("best").innerHTML=((window.Sona&&Sona.heartRow)?Sona.heartRow(REV,3,17):String(REV))+(best?' <b style="vertical-align:middle"> · Best '+best+"</b>":""); }
    function crash(){
      if(!playing) return;
      playing=false;  sfx("tap");
      if(REV>0 && MIC){
        $("revTitle").textContent="Say \u201C"+SAYTXT+"\u201D!";
        $("revHearts").innerHTML=(window.Sona&&Sona.heartRow)?Sona.heartRow(REV,3,28):String(REV);
        reviveWait=true; $("revOvl").classList.add("show");
      } else { endRound(); }
    }
    function doRevive(){
      reviveWait=false; REV--; hearts();
      $("revOvl").classList.remove("show");
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      cur={x:-stack[stack.length-1].w*0.6, w:stack[stack.length-1].w, dir:1, c:COLORS[(stack.length+1)%COLORS.length]}; dropping=false; playing=true;
    }
    $("revDone").onclick=function(){ reviveWait=false; $("revOvl").classList.remove("show"); endRound(); };
    hearts();


    function flash(t){ var f=$("flash"); f.textContent=t; f.style.opacity=1; f.style.transform="scale(1.18)"; setTimeout(function(){f.style.opacity=0;f.style.transform="scale(1)";},520); }

    function drop(){
      if(!playing||dropping) return; dropping=true;
      var top=stack[stack.length-1];
      var left=Math.max(cur.x,top.x), right=Math.min(cur.x+cur.w,top.x+top.w);
      var overlap=right-left;
      if(overlap<=6){ // missed — a life, not the game
        dropping=false; crash(); return;
      }
      var perfect=Math.abs(cur.x-top.x)<7;
      if(perfect){ overlap=top.w; left=top.x; perfectRun++; flash("PERFECT!"); sfx("correct");
        if(perfectRun>=2&&overlap<baseW){ overlap=Math.min(baseW,overlap+12); flash("PERFECT! +GROW"); } }
      else { perfectRun=0; sfx("tap"); }
      stack.push({x:left,w:overlap,c:cur.c});
      score++; $("score").textContent=score;
      endBoost(); // slow-mo is for one drop
      // next block
      cur={x:-overlap*0.6, w:overlap, dir:1, c:COLORS[stack.length%COLORS.length]};
      speed=Math.min(W*0.011, speed+0.06);
      dropping=false;
      $("tapHint").style.display="none";
    }
    cv.addEventListener("pointerdown",drop);

    // ── VOICE BOOST: say your sound → SLOW-MO for the current drop. Optional,
    // instant, pure local loudness detection — nothing recorded or uploaded.
    var boost={on:false,cool:false};
    function fireBoost(){
      boost.on=true; boost.cool=true;
      var ch=$("boostChip"); ch.textContent="SLOW-MO!"; ch.classList.add("hot");
      sfx("correct"); flash("SLOW-MO!");
      setTimeout(function(){ endBoost(); },4000); // safety end if they never drop
      setTimeout(function(){ boost.cool=false; if(!boost.on)paintChip(); },8000);
    }
    function endBoost(){ if(!boost.on)return; boost.on=false; var ch=$("boostChip"); ch.classList.remove("hot"); if(!boost.cool)paintChip(); else ch.textContent="…"; }
    var SAYTXT="";
    function paintChip(){ $("boostChip").innerHTML=((window.Sona&&Sona.icon)?Sona.icon("mic",17)+" ":"")+"Say “"+SAYTXT+"” for SLOW-MO!"; }
    (function(){
      var snd=""; try{ snd=sessionStorage.getItem("sona.boost.sound")||""; }catch(e){}
      if(!snd){ try{ snd=((S&&S.getProfile&&S.getProfile().focusSounds)||["R"])[0]; }catch(e){ snd="R"; } }
      SAYTXT=(S&&S.soundSay)?S.soundSay(String(snd).toUpperCase()):"rrrr";
      paintChip();
      if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ $("boostChip").style.display="none"; return; }
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){ MIC=true;
        window.addEventListener("pagehide",function(){ try{ st.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
        var AC=window.AudioContext||window.webkitAudioContext, actx=new AC();
        var src=actx.createMediaStreamSource(st), an=actx.createAnalyser(); an.fftSize=512; src.connect(an);
        var td=new Uint8Array(an.fftSize), t0=performance.now(), calS=0,calN=0,thr=0,voiced=0;
        (function tick(){
          an.getByteTimeDomainData(td);
          var sum=0; for(var i=0;i<td.length;i++){ var d=(td[i]-128)/128; sum+=d*d; }
          var rms=Math.sqrt(sum/td.length), now=performance.now();
          if(now-t0<450){ calS+=rms; calN++; }
          else { if(!thr) thr=Math.max(0.05,(calS/Math.max(1,calN))*3.5);
            if(rms>thr){ voiced++; if(voiced>=6){ if(reviveWait){ voiced=0; doRevive(); } else if(playing && !boost.on && !boost.cool) fireBoost(); } }
            else voiced=0; }
          requestAnimationFrame(tick);
        })();
      }).catch(function(){ $("boostChip").style.display="none"; });
    })();

    function draw(){
      ctx.clearRect(0,0,W,H);
      // dusk scenery: stars, moon, toy-town lights (design 4: Block Stacker)
      ctx.fillStyle="rgba(255,255,255,.5)"; for(var si=0;si<16;si++){ ctx.fillRect(((si*131)%W),((si*197)%(H*0.5)),2,2); }
      ctx.fillStyle="#fff4d6"; ctx.beginPath(); ctx.arc(W*0.82,H*0.14,26,0,7); ctx.fill();
      ctx.fillStyle="rgba(255,244,214,.25)"; ctx.beginPath(); ctx.arc(W*0.82,H*0.14,36,0,7); ctx.fill();
      ctx.fillStyle="rgba(20,14,50,.45)";
      for(var bi=0;bi<7;bi++){ var tw=W*0.15, tx=bi*tw*0.98-8, th=H*(0.08+((bi*29)%3)*0.04); ctx.fillRect(tx,H-th,tw,th);
        ctx.fillStyle="#ffd88a"; for(var wi=0;wi<2;wi++){ ctx.fillRect(tx+6+wi*13, H-th+8, 6,7); } ctx.fillStyle="rgba(20,14,50,.45)"; }
      // parallax stars
      ctx.globalAlpha=0.22; ctx.fillStyle="#bfe0ff"; for(var i=0;i<24;i++){ ctx.fillRect(((i*89)%W),(((i*173)+camY*0.3)%H+H)%H,2,2); } ctx.globalAlpha=1;
      var towerTopY=H-46-stack.length*BH+camY;
      var want= towerTopY<H*0.42 ? camY+(H*0.42-towerTopY) : camY;
      camY+=(want-camY)*0.08;
      // ground: a low street in the town's silhouette tone — blends into the
      // dusk instead of reading as a dead navy band
      ctx.fillStyle="rgba(20,14,50,.55)"; ctx.fillRect(0,H-46+camY,W,46);
      // stack
      for(var i=0;i<stack.length;i++){ var b=stack[i], y=H-46-(i+1)*BH+camY;
        ctx.fillStyle=b.c; rr(b.x,y,b.w,BH-3,7); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.18)"; rr(b.x,y,b.w,7,4); ctx.fill();
      }
      // moving block
      if(playing){
        cur.x+=cur.dir*speed*(boost.on?0.35:1);
        if(cur.x<-8){cur.x=-8;cur.dir=1;} if(cur.x+cur.w>W+8){cur.x=W+8-cur.w;cur.dir=-1;}
        var y=H-46-(stack.length+1)*BH+camY;
        ctx.fillStyle=cur.c; rr(cur.x,y,cur.w,BH-3,7); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.25)"; rr(cur.x,y,cur.w,7,4); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    draw();

    function bankAndContinue(){ location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      if(window.__ended)return; window.__ended=true;
      playing=false; reviveWait=false;
      var coins=Math.min(10,(score/3)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      if(score>best){ best=score; try{ localStorage.setItem(BKEY,String(best)); }catch(e){} flash("NEW BEST!"); }
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        // Daily Run: bank the score and keep the run moving — no buttons, no stall.
        $("endTitle").textContent="+"+score+" points!";
        $("endSub").textContent="Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        setTimeout(function(){ $("endOvl").classList.add("show"); },350);
        setTimeout(bankAndContinue,1500);
        return;
      }
      $("endTitle").textContent=score>=14?"Sky-high tower!":"Nice tower!";
      $("endSub").textContent="You stacked "+score+" blocks"+(coins?(" · +"+coins+" coins"):"")+(best?(" · Best: "+best):"")+"!";
      $("endAgain").style.display="none";
      $("endCharge").innerHTML='<svg viewBox="0 0 64 64" style="width:18px;height:18px;vertical-align:-3px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg> Next game';
      setTimeout(function(){ $("endOvl").classList.add("show"); },450);
    }
    $("endCharge").onclick=function(){ location.href="/charge.html?"+(isDaily?"daily=1":("game=arcade-run.html")); };
    $("endAgain").onclick=function(){ location.reload(); };
    $("endHome").onclick=function(){ location.href="/today.html#play"; };
    $("close").onclick=function(){ if(isDaily){ bankAndContinue(); return; } location.href="/today.html#play"; };
  </script>
</body>
</html>
