<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Block Stacker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#12263f" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#12263f,#1d3a5f 70%,#28517f);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;z-index:5;}
    #close{border:none;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:800;cursor:pointer;line-height:1;border-radius:12px;padding:8px 12px;}
    #score{font-family:"Baloo 2";font-weight:800;font-size:22px;color:#fff;flex:1;}
    #best{font-family:"Baloo 2";font-weight:800;font-size:15px;color:#9db8d0;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.25);}
    #tapHint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-family:"Baloo 2";font-weight:800;font-size:16px;color:#cfe3f7;z-index:4;pointer-events:none;}
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(10,26,44,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:10px;}
    .ovl.show{display:flex;}
    .ovl .big{font-size:70px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:28px;color:#fff;}
    .ovl p{color:#bcd3e8;font-weight:700;font-size:15px;max-width:300px;}
    .btn{border:none;border-radius:16px;padding:15px 32px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;transition:transform .05s;margin-top:6px;}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .btn.blue{background:var(--blue);box-shadow:0 5px 0 0 var(--blue-d);}
    .btn.ghost{background:none;box-shadow:none;color:#9db8d0;text-transform:none;font-size:14px;}
  </style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div id="score">🧱 0</div>
      <div id="best"></div>
    </div>
    <div id="flash"></div>
    <div id="tapHint">Tap to drop the block!</div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="big">🎟</div>
    <h2>You need a ticket!</h2>
    <p>Charge up with your sounds to earn one — then come stack!</p>
    <button class="btn blue" id="goCharge">⚡ Charge up</button>
    <button class="btn ghost" id="needHome">Back home</button>
  </div>

  <div class="ovl" id="endOvl">
    <div class="big">🏗️</div>
    <h2 id="endTitle">Nice tower!</h2>
    <p id="endSub"></p>
    <button class="btn blue" id="endCharge">⚡ Charge up for more</button>
    <button class="btn" id="endAgain" style="display:none;">🎟 Play again</button>
    <button class="btn ghost" id="endHome">Done for now</button>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    var fromCharge=qp.get("from")==="charge";
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }
    // ---- charge gate: a round is unlocked by the 5-rep charge (play token) ----
    var SELF="arcade-stack.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ tok=sessionStorage.getItem("sona.play.token")==="1"; sessionStorage.removeItem("sona.play.token"); }catch(e){}
    if(!tok){ $("needOvl").classList.add("show"); }

    // best height (local, just for pride)
    var BKEY="sona.stack.best"; var best=0; try{ best=parseInt(localStorage.getItem(BKEY)||"0",10)||0; }catch(e){}
    if(best) $("best").textContent="Best: "+best;

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    var COLORS=["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#4dabf7","#9775fa","#f783ac"];
    var BH=34;                       // block height
    var baseW=Math.min(W*0.62,240); // starting width
    var stack=[{x:(W-baseW)/2,w:baseW,c:COLORS[0]}];
    // kid pace: slow slide to start, gentle ramp per drop
    var cur={x:0,w:baseW,dir:1,c:COLORS[1]}, speed=Math.max(2.1,W*0.0042);
    var playing=true, dropping=false, camY=0, score=0, perfectRun=0;

    function flash(t){ var f=$("flash"); f.textContent=t; f.style.opacity=1; f.style.transform="scale(1.18)"; setTimeout(function(){f.style.opacity=0;f.style.transform="scale(1)";},520); }

    function drop(){
      if(!playing||dropping) return; dropping=true;
      var top=stack[stack.length-1];
      var left=Math.max(cur.x,top.x), right=Math.min(cur.x+cur.w,top.x+top.w);
      var overlap=right-left;
      if(overlap<=6){ // missed
        playing=false; sfx("tap"); endRound(); return;
      }
      var perfect=Math.abs(cur.x-top.x)<7;
      if(perfect){ overlap=top.w; left=top.x; perfectRun++; flash("PERFECT! ✨"); sfx("correct");
        if(perfectRun>=2&&overlap<baseW){ overlap=Math.min(baseW,overlap+12); flash("PERFECT! +GROW ✨"); } }
      else { perfectRun=0; sfx("tap"); }
      stack.push({x:left,w:overlap,c:cur.c});
      score++; $("score").textContent="🧱 "+score;
      // next block
      cur={x:-overlap*0.6, w:overlap, dir:1, c:COLORS[stack.length%COLORS.length]};
      speed=Math.min(W*0.011, speed+0.06);
      dropping=false;
      $("tapHint").style.display="none";
    }
    cv.addEventListener("pointerdown",drop);

    function draw(){
      ctx.clearRect(0,0,W,H);
      // parallax stars
      ctx.globalAlpha=0.22; ctx.fillStyle="#bfe0ff"; for(var i=0;i<24;i++){ ctx.fillRect(((i*89)%W),(((i*173)+camY*0.3)%H+H)%H,2,2); } ctx.globalAlpha=1;
      var towerTopY=H-80-stack.length*BH+camY;
      var want= towerTopY<H*0.42 ? camY+(H*0.42-towerTopY) : camY;
      camY+=(want-camY)*0.08;
      // ground
      ctx.fillStyle="#0d1f35"; ctx.fillRect(0,H-80+camY,W,80);
      // stack
      for(var i=0;i<stack.length;i++){ var b=stack[i], y=H-80-(i+1)*BH+camY;
        ctx.fillStyle=b.c; rr(b.x,y,b.w,BH-3,7); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.18)"; rr(b.x,y,b.w,7,4); ctx.fill();
      }
      // moving block
      if(playing){
        cur.x+=cur.dir*speed;
        if(cur.x<-8){cur.x=-8;cur.dir=1;} if(cur.x+cur.w>W+8){cur.x=W+8-cur.w;cur.dir=-1;}
        var y=H-80-(stack.length+1)*BH+camY;
        ctx.fillStyle=cur.c; rr(cur.x,y,cur.w,BH-3,7); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.25)"; rr(cur.x,y,cur.w,7,4); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    draw();

    function bankAndContinue(){ location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      var coins=Math.min(10,(score/3)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      if(score>best){ best=score; try{ localStorage.setItem(BKEY,String(best)); }catch(e){} flash("NEW BEST! 🏆"); }
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        // Daily Run: bank the score and keep the run moving — no buttons, no stall.
        $("endTitle").textContent="+"+score+" points! 🏆";
        $("endSub").textContent="Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        setTimeout(function(){ $("endOvl").classList.add("show"); },350);
        setTimeout(bankAndContinue,1500);
        return;
      }
      $("endTitle").textContent=score>=14?"Sky-high tower! 🏆":"Nice tower!";
      $("endSub").textContent="You stacked "+score+" blocks"+(coins?(" · +"+coins+" 🪙"):"")+(best?(" · Best: "+best):"")+"!";
      $("endAgain").style.display="none";
      $("endCharge").textContent="⚡ Play again";
      setTimeout(function(){ $("endOvl").classList.add("show"); },450);
    }
    $("endCharge").onclick=backToCharge;
    $("endAgain").onclick=function(){ location.reload(); };
    $("endHome").onclick=function(){ location.href="/today.html#play"; };
    $("close").onclick=function(){ if(isDaily){ bankAndContinue(); return; } location.href="/today.html#play"; };
  </script>
</body>
</html>
