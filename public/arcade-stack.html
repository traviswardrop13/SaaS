<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Block Stacker</title>
  <link href="/fonts.css" rel="stylesheet">
  <meta name="theme-color" content="#2b2e6b" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#2b2e6b,#5b3f8f 45%,#a45fae 75%,#e17aa4);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.25);}
    #tapHint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-family:"Baloo 2";font-weight:800;font-size:16px;color:#cfe3f7;z-index:4;pointer-events:none;}
    /* ── designed HUD kit (handoff section 4) ── */
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;z-index:5;}
    #close{border:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#b08d63;font-size:19px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 4px 0 rgba(30,20,70,.45);}
    .hudpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 14px;box-shadow:0 4px 0 rgba(30,20,70,.45);font-family:"Baloo 2";font-weight:800;font-size:16px;color:#4a2c14;}
    #score{flex:none;}
    #hudspacer{flex:1;}
    #timer{color:#ff5c74;letter-spacing:1px;}
    /* ── warm-card overlays (handoff section 5) ── */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(30,22,50,.55);display:none;align-items:center;justify-content:center;padding:24px;}
    .ovl.show{display:flex;}
    .ovlCard{background:#fff6e9;border-radius:28px;padding:58px 20px 22px;width:100%;max-width:330px;text-align:center;box-shadow:0 18px 40px rgba(30,22,50,.45);position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;}
    .ovlEcho{position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:106px;height:106px;filter:drop-shadow(0 8px 12px rgba(30,22,50,.3));}
    .ovl .big{font-size:56px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:24px;color:#4a2c14;line-height:1.18;}
    .ovl h2 b{color:#7048c9;}
    .ovl p{color:#b08d63;font-weight:800;font-size:14.5px;max-width:270px;}
    .statRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .statPill{background:#fff;border-radius:99px;padding:8px 15px;font-family:"Baloo 2";font-weight:800;font-size:14.5px;color:#4a2c14;box-shadow:0 3px 0 rgba(120,80,20,.12);}
    .btn{border:none;border-radius:20px;padding:15px 30px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 6px 0 #ef6f23;cursor:pointer;transition:transform .05s;margin-top:4px;width:100%;}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #46a302;}
    .btn.blue{background:linear-gradient(180deg,#5cc6ff,#1cb0f6);box-shadow:0 6px 0 #1480c0;}
    .btn.blue:active{box-shadow:0 2px 0 #1480c0;}
    .btn.ghost{background:none;box-shadow:none;color:#b08d63;text-transform:none;font-size:13px;width:auto;padding:8px;}
    /* Echo speaks the win: bubble with a tail toward the leap; numbers fade in later */
    #endTitle{position:relative;background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 6px 16px rgba(74,44,20,.12);display:inline-block;}
    #endTitle:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:#fff;border-radius:3px;}
    #endSub.later{display:block!important;opacity:0;font-size:12.5px;color:var(--muted,#b08d63);transition:opacity .5s ease;margin-top:2px;}
    #endSub.later.in{opacity:1;}
    /* ── end-overlay celebration: star drop + Echo leap (Duolingo-ABC three-element stack) ── */
    #endOvl .ovlCard{padding-top:24px;}
    .endStar{animation:starDrop .35s cubic-bezier(.3,1.6,.5,1) both;}
    @keyframes starDrop{0%{transform:translateY(-64px) scale(.4);opacity:0}70%{transform:translateY(6px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
    .echoWin{position:relative;width:100%;height:96px;overflow:hidden;pointer-events:none;}
    .echoWin img{position:absolute;left:50%;bottom:-40px;width:118px;margin-left:-59px;filter:drop-shadow(0 6px 8px rgba(30,22,50,.18));animation:echoLeap .5s cubic-bezier(.3,1.4,.5,1) both,echoHop 1.5s ease-in-out .6s infinite;}
    @keyframes echoLeap{0%{transform:translateY(110px)}100%{transform:translateY(0)}}
    @keyframes echoHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px) rotate(-5deg)}}
    @media (prefers-reduced-motion: reduce){ .endStar,.echoWin img{animation:none;} }
    /* ── the round's HUD, banner and card (27 Sep 2026) ── */
    #best{color:#4a2c14;gap:8px;}
    #best .wv{white-space:nowrap;}
    #best .wbar{display:block;width:64px;height:10px;border-radius:99px;background:#e9e2f6;overflow:hidden;}
    #best .wbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9775fa,#f783ac);transition:width .25s;}
    #banner{position:absolute;left:0;right:0;top:17%;text-align:center;z-index:4;pointer-events:none;opacity:0;padding:0 16px;}
    #banner .pill{display:inline-block;background:rgba(255,255,255,.95);border-radius:26px;padding:10px 26px 12px;box-shadow:0 6px 0 rgba(40,20,90,.35);}
    #banner b{display:block;font-family:"Baloo 2";font-weight:800;font-size:40px;color:#7048c9;line-height:1.05;}
    #banner span{display:block;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#8a6f52;margin-top:2px;}
    #banner span:empty{display:none;}
    #banner.in{animation:bannerIn 1.9s ease both;}
    @keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px)}}
    @keyframes bannerFade{0%,100%{opacity:0}15%,80%{opacity:1}}
    #revHearts{display:flex;justify-content:center;gap:8px;}
    #revHearts .wdot{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#f3e3cf;color:#b08d63;font-family:"Baloo 2";font-weight:800;font-size:17px;}
    #revHearts .wdot.on{background:#58cc02;box-shadow:0 3px 0 #46a302;}
    #revHearts .wdot svg{width:20px;height:20px;}
    @media (prefers-reduced-motion: reduce){ #banner.in{animation-name:bannerFade;} }
  </style>
  <link href="/crafted-games.css" rel="stylesheet">
  <link href="/crafted-stack.css" rel="stylesheet">
  <link href="/arcade-speech-help.css" rel="stylesheet">
</head>
<body data-crafted="stack">
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="slowControl" hidden>
      <button id="slowKeys" type="button"><img src="/assets/crafted/echo-welcome.webp" alt=""><span id="slowSound">rrrr</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
      <p id="slowStatus" role="status">Tap Echo to slow the block</p><span class="slowTrack"><i id="slowMeter"></i></span>
      <button id="slowCancel" type="button" hidden>Keep playing</button>
    </div>
    <div id="top">
      <button id="close" aria-label="Back to games">✕</button>
      <div class="hudpill"><svg viewBox="0 0 64 64" style="width:19px;height:19px;vertical-align:-4px"><rect x="8" y="19" width="48" height="27" rx="7" fill="#69db7c"/><rect x="8" y="19" width="48" height="9" rx="4.5" fill="#85e099"/><circle cx="18" cy="26" r="2.5" fill="#fff" opacity=".85"/></svg> <b id="score">0</b></div>
      <div id="hudspacer"></div>
      <div id="best" class="hudpill"></div>
    </div>
    <div id="flash"></div>
    <div id="banner" aria-live="polite"><div class="pill"><b id="bnBig"></b><span id="bnSmall"></span></div></div>
    <div id="tapHint">Tap to drop the block!</div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-welcome.webp" alt="" />
      <h2 id="needTitle">This game needs a ticket!</h2>
      <p>Say your sound 5 times to fill it up</p>
      <button class="btn" id="goCharge"><svg viewBox="0 0 64 64" style="width:18px;height:18px;vertical-align:-3px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg> Fill my ticket!</button>
      <button class="btn ghost" id="needHome">Back home</button>
    </div>
  </div>

  <div class="ovl" id="revOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-welcome.webp" alt="" />
      <h2 id="revTitle">Say it!</h2>
      <p id="revHearts" style="font-size:26px;"></p>
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 4px 0 #ef6f23,0 0 0 10px rgba(255,138,61,.14);display:flex;align-items:center;justify-content:center;margin:2px 0;"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
      <p id="revListen" style="font-size:13px;">Get ready…</p>
      <button class="btn ghost" id="revDone">I'm done playing</button>
    </div>
  </div>

  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <div class="big endStar" id="endEmoji"><svg viewBox="0 0 64 64" style="width:56px;height:56px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg></div>
      <h2 id="endTitle">Great round!</h2>
      <p id="endSub"></p>
      <div class="echoWin"><img src="/assets/crafted/echo-welcome.webp" alt="" /></div>
      <button class="btn blue" id="endCharge">WOOHOO! Next →</button>
      <button class="btn" id="endAgain" style="display:none;"></button>
      <button class="btn ghost" id="endHome">Back home</button>
    </div>
  </div>


  <script src="/sona.js"></script>
  <script>window.SLOW_HELP={phase:"floor",action:"slow the block",earned:"Slow blocks!",eligible:function(){return !dropping;}};</script>
  <script src="/arcade-speech-help.js"></script>
  <script>
    // Check access before any game resources start. The earned speech token
    // remains a separate requirement; a catalog unlock never creates one.
    var gameEntryAllowed=false;
    (function () {
      var S=window.Sona, q=new URLSearchParams(location.search);
      if(!S)return;
      var earned=q.get("from")==="charge";
      if(!S.gameAccess("stack",{run:q.get("daily")==="1",earned:earned}).allowed){S.gameBounce("stack");return;}
      if(!earned){location.replace("/today.html");return;}
      gameEntryAllowed=true;
    })();
  </script>
  <script>
    if(gameEntryAllowed){
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    var fromCharge=qp.get("from")==="charge";
    // ── the mic and this game's own sounds never overlap (24 Sep 2026) ──
    // On an iPhone a page holding the mic runs as a phone call: the volume
    // buttons change CALL volume and every chime is processed like a call.
    // So no game sound plays while the keep-playing mic is open (a sound
    // asked for then is dropped; the game is paused behind the card anyway),
    // none waits on a mic request that hasn't settled, none plays in the
    // first SETTLE_MS after the mic closes (the phone switches back in
    // silence, not under a chime), and the mic never opens until QUIET_MS
    // after the last sound began: the longest chime ("complete") rings about
    // 0.6 s and the rest covers speaker and Bluetooth delay, so a chime's
    // tail can never answer the card for the child.
    var SETTLE_MS=200, QUIET_MS=900, quietUntil=0, micClosedAt=-1e9;
    var rv={st:null,pending:0,gen:0,raf:0,t:0,ctx:null,src:null,floor:-1};   // floor: the room's quiet level, measured once per page (see listenFor)
    function sfx(n){
      if(rv.st||slowTurn) return;
      if(rv.pending){ setTimeout(function(){ sfx(n); },60); return; }
      var wait=micClosedAt+SETTLE_MS-performance.now();
      if(wait>0){ quietUntil=Math.max(quietUntil,performance.now()+wait+QUIET_MS); setTimeout(function(){ sfx(n); },wait); return; }
      quietUntil=Math.max(quietUntil,performance.now()+QUIET_MS);
      try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){}
    }
    // ---- charge gate: a round is unlocked by the 5-rep charge (play token) ----
    var SELF="arcade-stack.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ try{sessionStorage.removeItem("sona.play.active");}catch(e){} location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ var _t=sessionStorage.getItem("sona.play.token"); if(_t===SELF||_t==="1"){ tok=true; sessionStorage.setItem("sona.play.active",SELF); sessionStorage.removeItem("sona.play.token"); } else if(sessionStorage.getItem("sona.play.active")===SELF){ tok=true; } }catch(e){}
    if(!tok){ try{ $("needTitle").textContent="Block Stacker needs a ticket!"; }catch(e){} $("needOvl").classList.add("show"); }

    // best height (local, just for pride)
    var BKEY="sona.stack.best"; var best=0; try{ best=parseInt(localStorage.getItem(BKEY)||"0",10)||0; }catch(e){}
    if(best) $("best").textContent="Best: "+best;

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    var COLORS=["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#4dabf7","#9775fa","#f783ac"];
    var BH=Math.min(52,Math.max(30,H*0.06)); // painted block height follows the portrait stage
    var baseW=Math.min(W*0.62,240); // starting width
    // A block is never narrower than this. The old tower cut every slightly-off
    // drop down, so a young child was soon aiming a sliver, missing it, and
    // the say-it card handed the same sliver back (all three cards in about
    // eight seconds, in the review's test runs).
    var MINW=baseW*0.6;

    // ── the round: three floors, then a rocket to the moon (27 Sep 2026) ──
    // The round Travis said yes to for Fruit Slice, for the tower: the five
    // blocks the "Say it 5 times" page built are its bottom; three floors of
    // 5, 6 and 7 blocks go on top, with the say-it card between floors; a
    // missed block tumbles off and a fresh one slides in (nothing stops,
    // nothing is lost; the next comes slower, and after two misses in a row
    // the landing zone is wider too); a close drop snaps into
    // place; and the round always ends on a win: a rocket on the top blasts
    // off to the moon, launched by any tap (or by itself, if nobody taps).
    var FLOORS=[{goal:5,speed:1},{goal:6,speed:1.15},{goal:7,speed:1.3}];
    var floor=0, floorGot=0, phase="floor", missRun=0, rocket=null, finaleDone=false;
    var BASE5=[["#85e099",1],["#ffe066",0.97],["#ffb86b",0.94],["#ff8787",0.91],["#b197fc",0.88]];   // the "Say it 5 times" stack, bottom up
    var stack=BASE5.map(function(b){ var w=baseW*b[1]; return {x:(W-w)/2,w:w,c:b[0],base:true}; });
    var playing=true, dropping=false, camY=0, score=0, perfectRun=0;
    var speed0=Math.max(2.1,W*0.0042), speed=speed0, cur=null, falling=[], puffs=[];
    function nextBlock(w){
      var gold=floor>0&&floorGot>0&&missRun<2&&Math.random()<0.18;
      cur={x:-w*0.6, w:w, dir:1, c:gold?"#ffd21c":COLORS[stack.length%COLORS.length], gold:gold};
    }
    nextBlock(stack[stack.length-1].w);
    function startFloor(i){
      slowMs=0; $("slowStatus").textContent="Tap Echo to slow the block"; floor=i; floorGot=0; phase="floor"; missRun=0; speed=speed0*FLOORS[i].speed;
      nextBlock(Math.max(MINW,stack[stack.length-1].w)); hud();
      banner("Floor "+(i+1),"Stack "+FLOORS[i].goal+" blocks!");
    }
    function endFloor(){
      phase="break"; cur=null; hud();
      var last=floor===FLOORS.length-1;
      setTimeout(function(){
        if(window.__ended||!playing) return;
        banner(last?"What a tower!":"Floor "+(floor+1)+" done!", last?"Now for the rocket…":"Great building!");
        sfx("complete"); echoHop();
        setTimeout(function(){
          if(window.__ended||!playing) return;
          if(last) startFinale();
          else sayCard("Say \u201C"+SAYTXT+"\u201D for floor "+(floor+2)+"!","none");
        },1700);
      },500);
    }

    // ── the HUD: this floor's progress, then the rocket ──
    var REV=3, reviveWait=false;   // say-the-sound cards: one between each floor
    function hud(){
      var t=$("best");
      if(phase==="finale"||phase==="done"){ t.innerHTML='<span class="wv">Rocket!</span>'; t.setAttribute("aria-label","The rocket"); return; }
      var f=FLOORS[floor], got=phase==="break"?f.goal:Math.min(floorGot,f.goal);
      t.innerHTML='<span class="wv">Floor '+(floor+1)+'</span><span class="wbar"><i style="width:'+Math.round(got/f.goal*100)+'%"></i></span>';
      t.setAttribute("aria-label","Floor "+(floor+1)+" of 3: "+got+" of "+f.goal+" blocks");
    }
    var TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    function floorDots(){ var s=""; for(var i=0;i<FLOORS.length;i++) s+='<span class="wdot'+(i<=floor?' on':'')+'">'+(i<=floor?TICK:String(i+1))+'</span>'; return s; }
    function banner(big,small){ var b=$("banner"); $("bnBig").textContent=big; $("bnSmall").textContent=small||""; b.classList.remove("in"); void b.offsetWidth; b.classList.add("in"); }
    var echoT=-1e9;
    function echoHop(){ echoT=performance.now(); }

    // ── the say-it card, between floors ──
    // The quoted sound in its title is the practice sound's letters, in the
    // crafted orange (.ovl h2 b): the family's brief keeps orange for those
    // letters alone, and Sona.soundMark decides which letters they are. The
    // title arrives as plain text, so everything else in it is escaped.
    function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function sayMark(){ return (window.Sona&&Sona.soundMark)?Sona.soundMark(SAYTXT,SND):'<b class="snd">'+esc(SAYTXT)+'</b>'; }
    function markTitle(t){ var q="\u201C"+SAYTXT+"\u201D", i=t.indexOf(q); return i<0?esc(t):esc(t.slice(0,i))+"\u201C"+sayMark()+"\u201D"+esc(t.slice(i+q.length)); }
    function sayCard(title,snd){
      if(!playing) return;
      playing=false; if(snd!=="none") sfx(snd||"tap");
      if(REV>0 && CAN_LISTEN){
        $("revTitle").innerHTML=markTitle(title||("Say \u201C"+SAYTXT+"\u201D to keep playing!"));
        $("revHearts").innerHTML=floorDots();
        reviveWait=true; $("revOvl").classList.add("show"); openReviveMic();
      } else { endRound(); }
    }
    // The card's old name, from when a missed block opened it. Kept because
    // the quiet-mic suites open the card through it.
    function crash(){ sayCard(); }
    function doRevive(){
      if(slowTurn){finishSlowKeys(true);return;}
      reviveWait=false; REV--; hud();
      // the card heard the child's sound: one rep on the week's count (Sona.gameRep)
      try{ if(S&&S.gameRep)S.gameRep(SND); }catch(e){}
      $("revOvl").classList.remove("show");
      // the mic has just closed: sfx() holds this chime SETTLE_MS
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      dropping=false; playing=true;
      if(phase==="break") startFloor(floor+1);
      else if(phase==="floor") nextBlock(Math.max(MINW,stack[stack.length-1].w));
    }
    $("revDone").onclick=function(){ closeReviveMic(); reviveWait=false; $("revOvl").classList.remove("show"); endRound(); };
    hud(); banner("Floor 1","Stack 5 blocks!");


    function flash(t){ var f=$("flash"); f.textContent=t; f.style.opacity=1; f.style.transform="scale(1.18)"; setTimeout(function(){f.style.opacity=0;f.style.transform="scale(1)";},520); }
    function tableY(){ return H*0.80; }
    function blockY(i){ return tableY()-(i+1)*BH+camY; }

    // ── the game's own sounds, made on the phone (27 Sep 2026) ──
    // They join Sona's sfx set on this page only, so each goes through sfx()
    // above and keeps its quiet rules.
    var SAC=null;

        var sx=rx+(W*0.82-rx)*Math.min(1,rocket.lift/H)*0.4;
        drawRocket(sx,ry-rocket.lift,rocket.launched);
        if(!rocket.launched){ ctx.globalAlpha=0.5+0.5*Math.sin(now/200); ctx.fillStyle="#fff"; ctx.font='800 20px "Baloo 2",sans-serif'; ctx.textAlign="center"; ctx.fillText("Tap!",sx,ry-134); ctx.globalAlpha=1; }
        if(ry-rocket.lift<-140) landed();
      }
      ctx.restore();
      // The live instruction belongs on the painted plaque, clear of the
      // home indicator. Keeping it visible helps a child who cannot read yet
      // follow a grown-up's prompt without a floating card over the game.
      ctx.fillStyle="#fff2d6";ctx.textAlign="center";ctx.font='800 '+Math.max(16,Math.min(22,W*.055))+'px "Baloo 2",sans-serif';
      var plaqueText=$("flash").style.opacity==="1"?$("flash").textContent:(phase==="finale"?"Tap to blast off!":phase==="done"?"To the moon!":"Tap to drop the block!");
      ctx.fillText(plaqueText,W/2,H*.908,W*.72);
      requestAnimationFrame(draw);
    }
    // Toy-block finish changes paint only; the landing edges stay exact.
    function paintBlock(x,y,w,h,color){
      var wood=WOOD[WOOD_COLORS[color]||"blue"];
      if(wood&&wood.complete&&wood.naturalWidth){ctx.save();ctx.shadowColor="rgba(18,10,39,.3)";ctx.shadowBlur=4;ctx.shadowOffsetY=3;ctx.drawImage(wood,x,y,w,h);ctx.restore();return;}
      ctx.save();ctx.shadowColor="rgba(18,10,39,.3)";ctx.shadowBlur=6;ctx.shadowOffsetY=4;
      ctx.fillStyle=color;rr(x,y,w,h,7);ctx.fill();ctx.shadowColor="transparent";
      var shine=ctx.createLinearGradient(0,y,0,y+h);shine.addColorStop(0,"rgba(255,255,255,.38)");shine.addColorStop(.45,"rgba(255,255,255,.02)");shine.addColorStop(1,"rgba(44,15,29,.2)");ctx.fillStyle=shine;rr(x,y,w,h,7);ctx.fill();
      ctx.strokeStyle="rgba(255,244,224,.45)";ctx.lineWidth=1;rr(x+1.5,y+1.5,w-3,h-3,6);ctx.stroke();
      ctx.strokeStyle="rgba(73,30,19,.09)";ctx.lineWidth=.7;for(var grain=8;grain<h-4;grain+=6){ctx.beginPath();ctx.moveTo(x+7,y+grain);ctx.bezierCurveTo(x+w*.32,y+grain-2,x+w*.6,y+grain+2,x+w-7,y+grain);ctx.stroke();}ctx.restore();
    }
    function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    draw();

    function bankAndContinue(){ S.finishGameTurn("stack",score); location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      if(slowTurn){slowTurn.cancelled=true;return finishSlowKeys(false).then(endRound);}
      closeReviveMic();
      if(window.__ended)return; window.__ended=true;
      S.finishGameTurn("stack",isDaily?score:null);
      playing=false; reviveWait=false; phase="done";
      var coins=Math.min(10,(score/3)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      if(score>best){ best=score; try{ localStorage.setItem(BKEY,String(best)); }catch(e){} flash("NEW BEST!"); }
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        // Daily Run: bank the score and keep the run moving — no buttons, no stall.
        if(score===0){ $("endEmoji").style.opacity=".25"; } // gentle zero tier: dim the star, keep it warm
        $("endTitle").textContent=score===0?"Good try!":("+"+score+" points!");
        $("endSub").textContent=score===0?"On to the next game…":"Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        setTimeout(function(){ $("endOvl").classList.add("show"); },350);
        setTimeout(bankAndContinue,1500);
        return;
      }
      if(score===0){
        // gentle zero tier: encouraging copy, dimmed star, happy Echo, one warm "again" button
        $("endEmoji").style.opacity=".25";
        $("endTitle").textContent="Good try! Wanna go again?";
        $("endSub").className=""; $("endSub").style.display="none";
        $("endCharge").style.display="none";
        var ea=$("endAgain"); ea.textContent="Yes! Play again"; ea.style.display=""; ea.onclick=backToCharge;
        setTimeout(function(){ $("endOvl").classList.add("show"); },450);
        return;
      }
      // one reward per moment: star + one line + Echo — no stat rows or coin counters here
      $("endTitle").textContent=finaleDone?"Blast off! You built "+score+" blocks to the moon!":score>=14?"We built it SKY-HIGH! "+score+" blocks!":"Look at our tower — "+score+" blocks!";
      var _es=$("endSub"); _es.textContent=score+" blocks · Best: "+best; // was BEST, never declared on this page: the line threw and the win card never opened
      setTimeout(function(){ _es.classList.add("in"); },1000);
      $("endAgain").style.display="none";
      setTimeout(function(){ $("endOvl").classList.add("show"); },450);
    }
    $("endCharge").onclick=function(){ location.href=isDaily?"/charge.html?daily=1":(S.gameAccess("run").allowed?"/charge.html?game=arcade-run.html":"/activities.html"); };
    $("endAgain").onclick=function(){ location.reload(); };
    $("endHome").onclick=function(){ S.finishGameTurn("stack"); location.href="/today.html#play"; };
    $("close").onclick=function(){
      if(window.__speechLeaving)return;window.__speechLeaving=true;
      function leave(){closeReviveMic();playing=false;S.finishGameTurn("stack");if(isDaily){bankAndContinue();return;}location.href="/today.html#play";}
      if(slowTurn){slowTurn.cancelled=true;finishSlowKeys(false).then(leave);}else leave();
    };
    }
  </script>
