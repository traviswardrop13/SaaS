<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Block Stacker</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/action.css">
  <meta name="theme-color" content="#2b2e6b" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#2b2e6b,#5b3f8f 45%,#a45fae 75%,#e17aa4);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.25);transform:rotate(-4deg);}
    #tapHint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-family:"Baloo 2";font-weight:800;font-size:16px;color:#cfe3f7;z-index:4;pointer-events:none;}
    /* ── designed HUD kit (handoff section 4) ── */
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;z-index:5;}
    #close{border:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#b08d63;font-size:19px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 4px 0 rgba(30,20,70,.45);}
    .hudpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 14px;box-shadow:0 4px 0 rgba(30,20,70,.45);font-family:"Baloo 2";font-weight:800;font-size:16px;color:#4a2c14;}
    #score{flex:none;}
    #hudspacer{flex:1;}
    #timer{color:#ff5c74;letter-spacing:1px;}
    /* ── cards over the game (the family's redesign brief, 28 Sep 2026) ──
       Echo peeks over the card's top edge from BEHIND it (designs 10, 11):
       he sits in the wrapper under the card, so the card's own edge hides
       him below the beak. Drawn inside the card he would paint over it.
       Teal is the one action colour and cream the second choice; both come
       from /action.css and are never pasted here. */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(30,22,50,.55);display:none;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;}
    .ovl.show{display:flex;}
    .cardWrap{position:relative;width:100%;max-width:340px;margin:auto;padding-top:76px;}
    .peek{position:absolute;top:0;left:50%;width:112px;margin-left:-56px;z-index:0;pointer-events:none;filter:drop-shadow(0 -2px 8px rgba(30,22,50,.25));animation:peekUp .45s cubic-bezier(.3,1.4,.5,1) both;}
    @keyframes peekUp{0%{transform:translateY(56px)}100%{transform:translateY(0)}}
    .ovlCard{position:relative;z-index:1;background:var(--cream-card);border-radius:28px;padding:22px 20px 20px;text-align:center;box-shadow:0 18px 40px rgba(30,22,50,.45);display:flex;flex-direction:column;align-items:center;gap:8px;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:23px;color:#4a2c14;line-height:1.18;}
    .ovl h2 b{color:var(--snd);}   /* the practice sound: orange, and nothing else is */
    .ovl p{color:#b08d63;font-weight:800;font-size:14.5px;max-width:280px;}
    .ovlCard .act-pill,.ovlCard .cream-pill{width:100%;min-height:54px;padding:12px 20px;font-size:19px;margin-top:4px;}
    .ovlCard .cream-pill{min-height:50px;font-size:17px;}
    /* the say-it card between floors: a cheer, not a "Whoops!" (a missed
       block no longer opens it), so its one line is the heading */
    #revTitle{font-size:25px;}
    #revHearts{line-height:1;}
    .revMic{width:78px;height:78px;display:flex;align-items:center;justify-content:center;margin:6px 0 2px;}
    .revMic svg{width:34px;height:34px;fill:#fff;}
    .ovl #revListen{color:var(--act-d);font-family:"Baloo 2";font-size:18px;}
    /* great round */
    .eyebrow{font-family:"Baloo 2";font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
    .ovl .eyebrow{font-size:13px;color:#8a6f52;margin-bottom:-8px;}   /* the page's darker tan: the lighter one is under 3:1 on the cream at 13px */
    #endTitle{font-size:34px;line-height:1.05;}
    .stars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:54px;}
    .endStar{animation:starDrop .35s cubic-bezier(.3,1.6,.5,1) both;}
    .endStar:nth-child(2){animation-delay:.12s;} .endStar:nth-child(3){animation-delay:.24s;}
    @keyframes starDrop{0%{transform:translateY(-64px) scale(.4);opacity:0}70%{transform:translateY(6px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
    /* the finale's title keeps its whole sentence in one heading (the round's
       test reads it whole), but only "Blast off!" is headline-sized: the rest
       drops to its own line, smaller, so it doesn't wrap into three */
    #endTitle .more{display:inline-block;width:100%;font-size:21px;line-height:1.2;margin-top:4px;text-wrap:balance;}
    .endPic{display:flex;justify-content:center;} .endPic:empty{display:none;}
    .ovl #endSub{font-size:15px;color:#8a6f52;}
    .statRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .statPill{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:7px 16px;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#4a2c14;box-shadow:0 3px 0 rgba(120,80,20,.12);}
    /* a short phone (an SE is 568 tall): the same card, tighter, so both
       buttons stay on screen without scrolling */
    @media (max-height:680px){
      .cardWrap{padding-top:60px;} .peek{width:92px;margin-left:-46px;}
      .ovlCard{gap:6px;padding:18px 18px 16px;}
      #endTitle{font-size:28px;} #endTitle .more{font-size:18px;}
      .endPic svg{width:140px;height:84px;}
      .ovlCard .act-pill,.ovlCard .cream-pill{min-height:48px;}
    }
    @media (prefers-reduced-motion: reduce){ .endStar,.peek{animation:none;} }
    /* ── the round's HUD, banner and card (27 Sep 2026) ── */
    #best{color:#4a2c14;gap:8px;}
    #best .wv{white-space:nowrap;}
    #best .wbar{display:block;width:64px;height:10px;border-radius:99px;background:#e9e2f6;overflow:hidden;}
    #best .wbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9775fa,#f783ac);transition:width .25s;}
    #banner{position:absolute;left:0;right:0;top:17%;text-align:center;z-index:4;pointer-events:none;opacity:0;padding:0 16px;}
    #banner .pill{display:inline-block;background:rgba(255,255,255,.95);border-radius:26px;padding:10px 26px 12px;box-shadow:0 6px 0 rgba(40,20,90,.35);}
    #banner b{display:block;font-family:"Baloo 2";font-weight:800;font-size:40px;color:#7048c9;line-height:1.05;}
    #banner span{display:block;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#8a6f52;margin-top:2px;}
    #banner span:empty{display:none;}
    #banner.in{animation:bannerIn 1.9s ease both;}
    @keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px)}}
    @keyframes bannerFade{0%,100%{opacity:0}15%,80%{opacity:1}}
    #revHearts{display:flex;justify-content:center;gap:8px;}
    #revHearts .wdot{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#f3e3cf;color:#b08d63;font-family:"Baloo 2";font-weight:800;font-size:17px;}
    #revHearts .wdot.on{background:#58cc02;box-shadow:0 3px 0 #46a302;}
    #revHearts .wdot svg{width:20px;height:20px;}
    @media (prefers-reduced-motion: reduce){ #banner.in{animation-name:bannerFade;} }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div class="hudpill"><svg viewBox="0 0 64 64" style="width:19px;height:19px;vertical-align:-4px"><rect x="8" y="19" width="48" height="27" rx="7" fill="#69db7c"/><rect x="8" y="19" width="48" height="9" rx="4.5" fill="#85e099"/><circle cx="18" cy="26" r="2.5" fill="#fff" opacity=".85"/></svg> <b id="score">0</b></div>
      <div id="hudspacer"></div>
      <div id="best" class="hudpill"></div>
    </div>
    <div id="flash"></div>
    <div id="banner" aria-live="polite"><div class="pill"><b id="bnBig"></b><span id="bnSmall"></span></div></div>
    <div id="tapHint">Tap to drop the block!</div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="cardWrap">
      <img class="peek" src="/coach/echo/echo-star.svg" alt="" />
      <div class="ovlCard">
        <h2 id="needTitle">This game needs a ticket!</h2>
        <p>Say your sound 5 times to fill it up</p>
        <button class="act-pill" id="goCharge"><svg viewBox="0 0 64 64" style="width:18px;height:18px;vertical-align:-3px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg> Fill my ticket!</button>
        <button class="cream-pill" id="needHome">Back home</button>
      </div>
    </div>
  </div>

  <div class="ovl" id="revOvl">
    <div class="cardWrap">
      <img class="peek" src="/coach/echo/echo-listening.svg" alt="" />
      <div class="ovlCard">
        <h2 id="revTitle">Say it!</h2>
        <p id="revHearts"></p>
        <div class="act-mic revMic" role="img" aria-label="Microphone"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
        <p id="revListen">Get ready…</p>
        <button class="cream-pill" id="revDone">I'm done playing</button>
      </div>
    </div>
  </div>

  <div class="ovl" id="endOvl">
    <div class="cardWrap">
      <img class="peek" src="/coach/echo/echo-celebrate.svg" alt="" />
      <div class="ovlCard">
        <p class="eyebrow" id="endGame">Block Stacker</p>
        <h2 id="endTitle">Great round!</h2>
        <div class="stars" id="endEmoji" aria-hidden="true"><svg class="endStar" viewBox="0 0 64 64" style="width:42px;height:42px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c" stroke="#f0b400" stroke-width="2" stroke-linejoin="round"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg><svg class="endStar" viewBox="0 0 64 64" style="width:54px;height:54px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c" stroke="#f0b400" stroke-width="2" stroke-linejoin="round"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg><svg class="endStar" viewBox="0 0 64 64" style="width:42px;height:42px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c" stroke="#f0b400" stroke-width="2" stroke-linejoin="round"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg></div>
        <div class="endPic" id="endPic" aria-hidden="true"></div>
        <p id="endSub"></p>
        <div class="statRow" id="endStats"><span class="statPill" id="endScore"></span><span class="statPill" id="endCoins"></span></div>
        <button class="act-pill" id="endCharge">Next</button>
        <button class="act-pill" id="endAgain" style="display:none;"></button>
        <button class="cream-pill" id="endHome">Back to games</button>
      </div>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script>
    // Check access before any game resources start. The earned speech token
    // remains a separate requirement; a catalog unlock never creates one.
    var gameEntryAllowed=false;
    (function () {
      var S=window.Sona, q=new URLSearchParams(location.search);
      if(!S)return;
      var earned=q.get("from")==="charge";
      if(!S.gameAccess("stack",{run:q.get("daily")==="1",earned:earned}).allowed){S.gameBounce("stack");return;}
      if(!earned){location.replace("/today.html");return;}
      gameEntryAllowed=true;
    })();
  </script>
  <script>
    if(gameEntryAllowed){
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    var fromCharge=qp.get("from")==="charge";
    // ── the mic and this game's own sounds never overlap (24 Sep 2026) ──
    // On an iPhone a page holding the mic runs as a phone call: the volume
    // buttons change CALL volume and every chime is processed like a call.
    // So no game sound plays while the keep-playing mic is open (a sound
    // asked for then is dropped; the game is paused behind the card anyway),
    // none waits on a mic request that hasn't settled, none plays in the
    // first SETTLE_MS after the mic closes (the phone switches back in
    // silence, not under a chime), and the mic never opens until QUIET_MS
    // after the last sound began: the longest chime ("complete") rings about
    // 0.6 s and the rest covers speaker and Bluetooth delay, so a chime's
    // tail can never answer the card for the child.
    var SETTLE_MS=200, QUIET_MS=900, quietUntil=0, micClosedAt=-1e9;
    var rv={st:null,pending:0,gen:0,raf:0,t:0,ctx:null,src:null,floor:-1};   // floor: the room's quiet level, measured once per page (see listenFor)
    function sfx(n){
      if(rv.st) return;
      if(rv.pending){ setTimeout(function(){ sfx(n); },60); return; }
      var wait=micClosedAt+SETTLE_MS-performance.now();
      if(wait>0){ quietUntil=Math.max(quietUntil,performance.now()+wait+QUIET_MS); setTimeout(function(){ sfx(n); },wait); return; }
      quietUntil=Math.max(quietUntil,performance.now()+QUIET_MS);
      try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){}
    }
    // ---- charge gate: a round is unlocked by the 5-rep charge (play token) ----
    var SELF="arcade-stack.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ try{sessionStorage.removeItem("sona.play.active");}catch(e){} location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ var _t=sessionStorage.getItem("sona.play.token"); if(_t===SELF||_t==="1"){ tok=true; sessionStorage.setItem("sona.play.active",SELF); sessionStorage.removeItem("sona.play.token"); } else if(sessionStorage.getItem("sona.play.active")===SELF){ tok=true; } }catch(e){}
    if(!tok){ try{ $("needTitle").textContent="Block Stacker needs a ticket!"; }catch(e){} $("needOvl").classList.add("show"); }

    // best height (local, just for pride). It no longer has a pill of its
    // own in the top bar: that place shows this floor's progress, and every
    // finished round is the same 18 blocks, so a running record would only
    // ever read 18. A new best still gets its banner at the end.
    var BKEY="sona.stack.best"; var best=0; try{ best=parseInt(localStorage.getItem(BKEY)||"0",10)||0; }catch(e){}

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    var ROPE0=70;   // where the hook's rope starts: just under the HUD, so it never runs behind the top bar's pills
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); ROPE0=$("top").getBoundingClientRect().bottom-r.top; }
    fit(); window.addEventListener("resize",fit);

    var COLORS=["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#4dabf7","#9775fa","#f783ac"];
    var BH=34;                       // block height
    var HANG=BH*1.5;                 // how far above the tower the hook holds the block (picture only)
    // A dropped block is placed the instant the child taps, exactly as
    // before; only its picture falls the HANG it hung above the tower, in
    // FALL_MS, so a tap on "drop" looks like a drop and not a jump.
    var FALL_MS=140, landT=-1e9;
    var baseW=Math.min(W*0.62,240); // starting width
    // A block is never narrower than this. The old tower cut every slightly-off
    // drop down, so a young child was soon aiming a sliver, missing it, and
    // the say-it card handed the same sliver back (all three cards in about
    // eight seconds, in the review's test runs).
    var MINW=baseW*0.6;

    // ── the round: three floors, then a rocket to the moon (27 Sep 2026) ──
    // The round Travis said yes to for Fruit Slice, for the tower: the five
    // blocks the "Say it 5 times" page built are its bottom; three floors of
    // 5, 6 and 7 blocks go on top, with the say-it card between floors; a
    // missed block tumbles off and a fresh one slides in (nothing stops,
    // nothing is lost; the next comes slower, and after two misses in a row
    // the landing zone is wider too); a close drop snaps into
    // place; and the round always ends on a win: a rocket on the top blasts
    // off to the moon, launched by any tap (or by itself, if nobody taps).
    var FLOORS=[{goal:5,speed:1},{goal:6,speed:1.15},{goal:7,speed:1.3}];
    var floor=0, floorGot=0, phase="floor", missRun=0, rocket=null, finaleDone=false;
    var BASE5=[["#85e099",1],["#ffe066",0.97],["#ffb86b",0.94],["#ff8787",0.91],["#b197fc",0.88]];   // the "Say it 5 times" stack, bottom up
    var stack=BASE5.map(function(b){ var w=baseW*b[1]; return {x:(W-w)/2,w:w,c:b[0],base:true}; });
    var playing=true, dropping=false, camY=0, score=0, perfectRun=0;
    var speed0=Math.max(2.1,W*0.0042), speed=speed0, cur=null, falling=[], puffs=[];
    function nextBlock(w){
      var gold=floor>0&&floorGot>0&&missRun<2&&Math.random()<0.18;
      cur={x:-w*0.6, w:w, dir:1, c:gold?"#ffd21c":COLORS[stack.length%COLORS.length], gold:gold};
    }
    nextBlock(stack[stack.length-1].w);
    function startFloor(i){
      floor=i; floorGot=0; phase="floor"; missRun=0; speed=speed0*FLOORS[i].speed;
      nextBlock(Math.max(MINW,stack[stack.length-1].w)); hud();
      banner("Floor "+(i+1),"Stack "+FLOORS[i].goal+" blocks!");
    }
    function endFloor(){
      phase="break"; cur=null; hud();
      var last=floor===FLOORS.length-1;
      setTimeout(function(){
        if(window.__ended||!playing) return;
        banner(last?"What a tower!":"Floor "+(floor+1)+" done!", last?"Now for the rocket…":"Great building!");
        sfx("complete"); echoHop();
        setTimeout(function(){
          if(window.__ended||!playing) return;
          if(last) startFinale();
          else sayCard("Say \u201C"+SAYTXT+"\u201D for floor "+(floor+2)+"!","none");
        },1700);
      },500);
    }

    // ── the HUD: this floor's progress, then the rocket ──
    var REV=3, reviveWait=false;   // say-the-sound cards: one between each floor
    function hud(){
      var t=$("best");
      if(phase==="finale"||phase==="done"){ t.innerHTML='<span class="wv">Rocket!</span>'; t.setAttribute("aria-label","The rocket"); return; }
      var f=FLOORS[floor], got=phase==="break"?f.goal:Math.min(floorGot,f.goal);
      t.innerHTML='<span class="wv">Floor '+(floor+1)+'</span><span class="wbar"><i style="width:'+Math.round(got/f.goal*100)+'%"></i></span>';
      t.setAttribute("aria-label","Floor "+(floor+1)+" of 3: "+got+" of "+f.goal+" blocks");
    }
    var TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    function floorDots(){ var s=""; for(var i=0;i<FLOORS.length;i++) s+='<span class="wdot'+(i<=floor?' on':'')+'">'+(i<=floor?TICK:String(i+1))+'</span>'; return s; }
    function banner(big,small){ var b=$("banner"); $("bnBig").textContent=big; $("bnSmall").textContent=small||""; b.classList.remove("in"); void b.offsetWidth; b.classList.add("in"); }
    var ECHO=new Image(), echoT=-1e9; ECHO.src="/coach/echo/echo-celebrate.svg";
    function echoHop(){ echoT=performance.now(); }

    // ── the say-it card, between floors ──
    // The sound's letters are orange (the family's redesign brief: orange
    // means the practice sound and nothing else), so the title is written as
    // HTML: everything but the quoted sound is escaped text, and the sound
    // goes through Sona.soundMark. Its words are the round's own.
    function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function sayMark(){ return (window.Sona&&Sona.soundMark)?Sona.soundMark(SAYTXT,SND):'<b class="snd">'+esc(SAYTXT)+'</b>'; }
    function markTitle(t){ var q="\u201C"+SAYTXT+"\u201D", i=t.indexOf(q); return i<0?esc(t):esc(t.slice(0,i))+"\u201C"+sayMark()+"\u201D"+esc(t.slice(i+q.length)); }
    function sayCard(title,snd){
      if(!playing) return;
      playing=false; if(snd!=="none") sfx(snd||"tap");
      if(REV>0 && CAN_LISTEN){
        $("revTitle").innerHTML=markTitle(title||("Say \u201C"+SAYTXT+"\u201D to keep playing!"));
        $("revHearts").innerHTML=floorDots();
        reviveWait=true; $("revOvl").classList.add("show"); openReviveMic();
      } else { endRound(); }
    }
    // The card's old name, from when a missed block opened it. Kept because
    // the quiet-mic suites open the card through it.
    function crash(){ sayCard(); }

    // A request that was already late when it settled asks again if the card

      if(!reviveWait||rv.st||rv.pending||document.hidden) return;

      if(wait>0){ clearTimeout(rv.t); rv.t=setTimeout(openReviveMic,wait); return; }
      var gen=++rv.gen; rv.pending++;
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){

    // ── what counts as the child on the card (24 Sep 2026) ──
    // The bar a sound must clear is 3.5× the room's quiet level, and that
    // level is the page's, not the card's: rv.floor is the 20th-percentile
    // loudness of the quietest FLOOR_MS the card's mic has heard on this
    // page, and it only ever goes DOWN. The first cut of this change
    // averaged the first 450 ms of every card instead, and a card that says
    // "Say rrrr!" opens its mic exactly when an eager child is already
    // saying it: their own voice became the "room", the bar landed above
    // it, and nothing they said could answer the card. So: a low
    // percentile, which a voice filling most of the stretch can't lift;
    // only-down, so nothing a child says ever raises it and one quiet
    // breath (or a later card) mends a floor a talking child set; and the
    // last HEARD_MS of frames are judged against the CURRENT floor, so a
    // try said before that breath still counts the moment it comes. The

      // vs hiss) to fire — a scream or an S can't revive an R kid. Shape
      // numbers only; nothing recorded (see Sona.frameShape).

        ctx.fillStyle="#c9c3e6"; ctx.beginPath(); ctx.moveTo(mid-6,y-11); ctx.lineTo(mid+6,y-11); ctx.lineTo(mid+10,y+1); ctx.lineTo(mid-10,y+1); ctx.closePath(); ctx.fill();
        ctx.save(); ctx.setLineDash([4,7]); ctx.lineCap="round"; ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.moveTo(mid,y+BH+3); ctx.lineTo(mid,y+BH+HANG-6); ctx.stroke(); ctx.restore();
        drawBlock(cur,y,true);
        if(cur.gold){ ctx.strokeStyle="rgba(255,244,180,"+(0.5+0.5*Math.sin(now/120))+")"; ctx.lineWidth=3; rr(cur.x-3,y-3,cur.w+6,BH+3,9); ctx.stroke(); }
      }
      // the rocket on the top, then away to the moon
      if(rocket&&!rocket.gone){
        var top=stack[stack.length-1], rx=top.x+top.w/2, ry=blockY(stack.length-1);
        if(!rocket.launched&&now>=rocket.at) launch();
        if(rocket.launched){ rocket.v+=0.22; rocket.lift+=rocket.v;
          if(Math.random()<0.8) puffs.push({x:rx+(Math.random()-0.5)*14+(W*0.82-rx)*Math.min(1,rocket.lift/H)*0.4,y:ry-rocket.lift+6,r:6+Math.random()*5,life:1,vx:(Math.random()-0.5)*1.2,vy:0.6}); }
        var sx=rx+(W*0.82-rx)*Math.min(1,rocket.lift/H)*0.4;
        drawRocket(sx,ry-rocket.lift,rocket.launched);
        if(!rocket.launched){ ctx.globalAlpha=0.5+0.5*Math.sin(now/200); ctx.fillStyle="#fff"; ctx.font='800 20px "Baloo 2",sans-serif'; ctx.textAlign="center"; ctx.fillText("Tap!",sx,ry-104); ctx.globalAlpha=1; }
        if(ry-rocket.lift<-140) landed();
      }
      requestAnimationFrame(draw);
    }
    function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    draw();

    // ---- round over ----
    // ── the Great round card (the family's redesign brief, 28 Sep 2026) ──
    // It was one star, one line and Echo, with "no stat rows or coin
    // counters". The brief asks for the game's name, three stars, what the
    // round earned in the game's own unit, the coins the round already
    // awarded (the coin maths is unchanged; the card only says it) and one
    // next step. The stars are not a grade: every round with points gets all
    // three and a round with none gets "Good try!" and no stars, so there is
    // never an empty star to fall short of. "Next" follows the arcade chain
    // (slice → tiles → stack → run → glide → slice) and shows only when that
    // game opens for this family (Sona.gameAccess); otherwise "Back to games"
    // stands alone and takes the teal.
    var NEXT="run";
    function gameName(k,fb){ try{ var a=S.gameAct(k); if(a&&a.name) return a.name; }catch(e){} return fb; }
    function nextOpen(){ try{ return !!S.gameAct(NEXT)&&S.gameAccess(NEXT).allowed; }catch(e){ return false; } }
    function endCard(o){
      $("endGame").textContent=gameName("stack","Block Stacker");
      $("endTitle").innerHTML=esc(o.title)+(o.more?' <span class="more">'+esc(o.more)+"</span>":"");
      $("endEmoji").style.display=o.stars?"":"none";
      $("endPic").innerHTML=o.pic||"";
      $("endSub").textContent=o.line||""; $("endSub").style.display=o.line?"":"none";
      $("endScore").textContent=o.stat||""; $("endScore").style.display=o.stat?"":"none";
      var c=$("endCoins"); c.style.display=o.coins>0?"":"none";
      if(o.coins>0){ c.innerHTML=((S&&S.icon)?S.icon("coin",20):"")+"+"+o.coins; c.setAttribute("aria-label",o.coins+" coins"); }
      $("endStats").style.display=(o.stat||o.coins>0)?"":"none";
      var next=!!o.buttons&&!o.again&&nextOpen();
      $("endCharge").style.display=next?"":"none"; if(next) $("endCharge").textContent="Next: "+gameName(NEXT,"");
      var ea=$("endAgain"); ea.style.display=o.again?"":"none"; if(o.again){ ea.textContent=o.again; ea.onclick=backToCharge; }
      $("endHome").style.display=o.buttons?"":"none"; $("endHome").className=(next||o.again)?"cream-pill":"act-pill";
    }
    function blocksSaid(n){ return n+(n===1?" block":" blocks"); }
    // What the round earned, drawn (design 11's "what they earned"): the top
    // of this child's own tower, block for block in its colours and widths,
    // the top one with the face it wore on the hook. No new art.
    function towerPic(){
      var top=stack.slice(1).slice(-7); if(!top.length) return "";
      var L=Infinity, R=-Infinity; top.forEach(function(b){ L=Math.min(L,b.x); R=Math.max(R,b.x+b.w); });
      var k=Math.min(110/baseW,170/Math.max(1,R-L)), cx=(L+R)/2, h=13, H0=top.length*h+4, out="";
      for(var i=0;i<top.length;i++){ var b=top[i], y=H0-(i+1)*h, x=90+(b.x-cx)*k, w=Math.max(6,b.w*k);
        out+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+(h-2)+'" rx="4" fill="'+b.c+'"/><rect x="'+(x+2).toFixed(1)+'" y="'+(y+1.5)+'" width="'+Math.max(2,w-4).toFixed(1)+'" height="3" rx="1.5" fill="#fff" opacity=".3"/>';
        if(i===top.length-1){ var fx=x+w/2; out+='<circle cx="'+(fx-4).toFixed(1)+'" cy="'+(y+5)+'" r="1.3" fill="#3d2317"/><circle cx="'+(fx+4).toFixed(1)+'" cy="'+(y+5)+'" r="1.3" fill="#3d2317"/><path d="M'+(fx-2.5).toFixed(1)+' '+(y+7.5)+'q2.5 2 5 0" fill="none" stroke="#3d2317" stroke-width="1.2" stroke-linecap="round"/>'; } }
      return '<svg viewBox="0 0 180 '+(H0+6)+'" width="180" height="'+(H0+6)+'"><ellipse cx="90" cy="'+(H0+2)+'" rx="64" ry="4" fill="rgba(74,44,20,.12)"/>'+out+'</svg>';
    }
    function bankAndContinue(){ S.finishGameTurn("stack",score); location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      closeReviveMic();
      if(window.__ended)return; window.__ended=true;
      S.finishGameTurn("stack",isDaily?score:null);
      playing=false; reviveWait=false; phase="done";
      var coins=Math.min(10,(score/3)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      if(score>best){ best=score; try{ localStorage.setItem(BKEY,String(best)); }catch(e){} flash("New best!"); }
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        // Daily Run: bank the score and keep the run moving — no buttons, no stall.
        endCard({title:score===0?"Good try!":"Great round!", stars:score>0, stat:score?blocksSaid(score):"", coins:coins,
          line:score===0?"On to the next game…":"Banking your score…"});
        setTimeout(function(){ $("endOvl").classList.add("show"); },350);
        setTimeout(bankAndContinue,1500);
        return;
      }
      if(score===0){
        // gentle zero tier: encouraging copy, happy Echo, one warm "again" button
        endCard({title:"Good try! Wanna go again?", buttons:true, again:"Yes! Play again"});
        setTimeout(function(){ $("endOvl").classList.add("show"); },450);
        return;
      }
      // The rocket reached the moon: the round's own headline takes the
      // title's place ("Blast off!", then how many blocks sent it up). A
      // round stopped early on the say-it card is still a Great round.
      if(finaleDone) endCard({title:"Blast off!", more:"You built "+score+" blocks to the moon!", stars:true, pic:towerPic(), stat:blocksSaid(score), coins:coins, buttons:true});
      else endCard({title:"Great round!", stars:true, pic:towerPic(), stat:blocksSaid(score), coins:coins, buttons:true,
        line:score>=14?"We built it SKY-HIGH! "+score+" blocks!":"Look at our tower — "+score+" blocks!"});
      setTimeout(function(){ $("endOvl").classList.add("show"); },450);
    }
    $("endCharge").onclick=function(){ location.href=isDaily?"/charge.html?daily=1":(nextOpen()?"/charge.html?game=arcade-"+NEXT+".html":"/today.html#play"); };
    $("endAgain").onclick=function(){ location.reload(); };
    $("endHome").onclick=function(){ S.finishGameTurn("stack"); location.href="/today.html#play"; };
    $("close").onclick=function(){ closeReviveMic(); S.finishGameTurn("stack"); if(isDaily){ bankAndContinue(); return; } location.href="/today.html#play"; };
    }
  </script>
</body>
