<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Story</title>
  <link href="/fonts.css" rel="stylesheet">
  <link href="/action.css" rel="stylesheet">
  <link href="/crafted-adventure.css" rel="stylesheet">
  <meta name="theme-color" content="#2b2f5e" />
  <!--
    THE DAILY STORY'S PLAYER (STORY1, 22 Oct 2026; Travis chose both age
    groups, today's painted clay look, and the story is Premium). One page for
    every day: Pelly's letter and the problem (the intro), then "Let's go!"
    opens the story's own game; that game's end card brings the child back
    here (?part=end&story=<id>) for the happy ending and the sticker its round
    already gave. The scenes are /adventures.js; the day list (titles, Home's
    line and picture, the game and its page) is sona.js's STORY_DAYS.

    What it keeps:
    - Entitlement first. Before any picture, sound or fetch it asks
      Sona.storyOpen() (the books' rule: never the demonstration window), and
      which story: no part, today's OPEN story; part=end, a finished one. Any
      other visit leaves for Home with the body still hidden.
    - Nothing turns by itself, and silence is never asked for: no scene asks
      the child to speak (the game's own word turn does that). Next, or a tap
      on the picture, turns the page; taps wait 600 ms after a scene appears,
      so a double tap never skips one.
    - It writes ONE thing: Sona.storySeen(id) on "Let's go!" (so coming back
      the same day offers "Keep going"). No rep, no trophy, no coin, no
      sticker (the round gave it), no practice data. Its two events carry the
      game key alone, and no child's name reaches any line, request or event.
    - Echo's voice, one line at a time: a recorded file when the voice
      manifest lists that exact line (/assets/adventure/voice/manifest.js, a
      script that may be missing), else the live voice through the phone's
      shared voice cache (SayIt.line: the same store, key and voice service
      Say & Play and the round games use), else the browser's own voice,
      cut off at 9 s. In the iPhone app every one plays as media (Sona.mediaPCM
      says why); on the website through this page's own Web Audio, woken by
      the start tap. Sound off: captions only, and nothing is fetched.
  -->
</head>
<body hidden>
  <div class="adv" id="adv">
    <div class="advstage" id="stage"></div>

    <div class="advcap" id="cap" hidden>
      <div class="advecho" aria-hidden="true"><img id="capEcho" alt="" /></div>
      <div class="advcard">
        <p class="advask" id="capAsk" hidden></p>
        <p class="advtext" id="capBox"><span id="capText" aria-live="polite"></span></p>
        <div class="advrow">
          <button class="cream-pill advhear" id="hearBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Hear it</button>
          <button class="act-pill advnext" id="nextBtn" type="button" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="act-pill advgo" id="goBtn" type="button" hidden></button>
          <p class="advmicstate" id="micState" aria-live="polite" hidden></p>
          <button class="act-mic advmic" id="micBtn" type="button" aria-label="Microphone" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>

    <div class="advovl" id="startOvl" hidden>
      <div class="advbox" role="dialog" aria-labelledby="startTitle">
        <div class="advhero"><img id="startPic" alt="" /></div>
        <p class="advday" id="startDay"></p>
        <h1 class="advtitle" id="startTitle"></h1>
        <button class="act-pill advbig" id="startBtn" type="button"></button>
        <button class="cream-pill advbig2" id="againBtn" type="button" hidden>Watch the story again</button>
      </div>
    </div>

    <div class="advovl" id="endOvl" hidden>
      <div class="advbox" role="dialog" aria-label="The end of the story">
        <img class="advcheer" id="endEcho" alt="" />
        <div class="advgots" id="gotList" role="status"></div>
        <p class="advfound" id="foundLine" hidden><img id="foundPic" alt="" /><span id="foundText"></span></p>
        <button class="act-pill advbig" id="homeBtn" type="button">Back home</button>
      </div>
    </div>

    <!-- TALK1: a grown-up says yes to the mic first, inside the story (the
         books' question, word for word but for "page") -->
    <div class="advovl" id="micOvl" hidden>
      <div class="advbox" role="dialog" aria-labelledby="micTitle">
        <img class="advcheer" src="/assets/crafted/echo-listen.webp" alt="" onerror="if(this.src.indexOf('echo-welcome')<0)this.src='/assets/crafted/echo-welcome.webp'" />
        <h2 class="advtitle" id="micTitle">Echo wants to hear the words</h2>
        <p class="advmicp">On each page, Echo asks your child to say one word out loud.</p>
        <p class="advmicp" id="micPromise"></p>
        <button class="act-pill advbig" id="micYes" type="button">Yes, use the mic</button>
        <button class="cream-pill advbig2" id="micNo" type="button">Not now</button>
      </div>
    </div>

    <div class="advtop">
      <button class="cream-pill advround" id="closeBtn" type="button" aria-label="Back home">✕</button>
      <button class="cream-pill advskip" id="skipBtn" type="button" aria-label="Skip (for grown-ups)" hidden>Skip</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script src="/arcade-sayit.js"></script>
  <script src="/crafted-buddies.js"></script>
  <script src="/adventures.js"></script>
  <script src="/talk-stories.js"></script>
  <script src="/saycheck.js"></script>
  <script src="/assets/adventure/voice/manifest.js"></script>
  <script>
  (function () {
    "use strict";
    var S = window.Sona, A = window.SonaAdventures, HOME = "/today.html";
    // ── timings ──
    // LINE_WAIT_MS: Echo starts a line as soon as it is ready and waits at
    // most this long; a line not ready by then leaves the caption, with Next
    // glowing (it still plays if it lands while the child is on that scene
    // and has not tapped). TAP_GUARD_MS: a scene ignores taps this long after
    // it appears, so a double tap never skips one. MP3_START_MS: a recorded
    // line in the app that has not started by then gives way to the live
    // voice. SYNTH_CAP_MS: the browser's own voice is cut off here, as the
    // books' is. CAP_OVERLAP: how far the picture's foot runs under the card.
    var LINE_WAIT_MS = 2500, TAP_GUARD_MS = 600, MP3_START_MS = 3000, SYNTH_CAP_MS = 9000, FETCH_MS = 8000, CAP_OVERLAP = 26;
    function away() { try { location.replace(HOME); } catch (e) { location.href = HOME; } }
    function param(k) {
      var m = new RegExp("[?&]" + k + "=([^&#]*)").exec(location.search);
      try { return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : ""; } catch (e) { return ""; }
    }
    function dayOf(id) {
      // TALK1: sona.js says which story Day 1's slot holds for this child
      if (S && S.storyDay) {
        var d = S.storyDay(id);
        return d ? { id: d.id, game: d.game, page: d.page, hero: d.hero, title: d.title, n: d.day, talk: !!d.talk, sound: d.sound || "" } : null;
      }
      var L = (S && S.STORY_DAYS) || [];
      for (var i = 0; i < L.length; i++) if (L[i].id === id) return { id: L[i].id, game: L[i].game, page: L[i].page, hero: L[i].hero, title: L[i].title, n: i + 1 };
      return null;
    }
    var T = window.SonaTalkStories || {};
    function storyData(d) { return d.talk ? T[d.id] : A[d.id]; }

    // ── 1. who may be here, and which story: before any picture, sound or fetch ──
    var mode = "", day = null, seen = false, dayNo = 1;
    try {
      if (!S || !S.storyOpen || !S.storyOpen() || !A) { away(); return; }
      var part = param("part");
      if (part === "end") {
        day = dayOf(param("story"));
        if (!day || !storyData(day) || !S.storyEnding || !S.storyEnding(day.id).ok) { away(); return; }
        mode = "end"; dayNo = day.n;
      } else if (!part && param("again") === "1") {
        // TALK1: a talking story found on Home's row, told again whole (its
        // intro and its ending), every page asking its word; it finishes
        // nothing. Only a finished talking story open to this child.
        day = dayOf(param("story"));
        if (!day || !day.talk || !storyData(day) || !S.storyReplay || !S.storyReplay(day.id)) { away(); return; }
        mode = "again"; dayNo = day.n;
      } else if (!part) {
        var q = S.questToday();
        if (!q || q.kind !== "story" || q.state !== "open" || !q.story) { away(); return; }
        day = dayOf(q.story.id);
        if (!day || !storyData(day)) { away(); return; }
        mode = "intro"; seen = q.seen === true; dayNo = q.day || day.n;
      } else { away(); return; }
    } catch (e) { away(); return; }

    // the scenes this child sees: ages 3-4 skip the big-kid scenes and read
    // the short lines
    var data = storyData(day), little = false, TALK = !!day.talk;
    try { little = S.playStyle() === "simple"; } catch (e) {}
    function runOf(list) {
      var out = [];
      list.forEach(function (sc) {
        if (little && sc.ages === "big") return;
        var t = typeof sc.line === "string" ? sc.line : ((little && sc.line.little) || sc.line.big);
        out.push({ art: sc.art, src: "/assets/adventure/" + day.id + "/" + sc.art + ".webp", text: t, buddy: sc.buddy || null, key: TALK ? sc.key || "" : "" });
      });
      return out;
    }
    var run = runOf(mode === "end" ? data.ending : mode === "again" ? data.intro.concat(data.ending) : data.intro);
    if (!run.length) { away(); return; }

    function $(id) { return document.getElementById(id); }
    var stage = $("stage"), cap = $("cap"), capEcho = $("capEcho"), capBox = $("capBox"), capText = $("capText");
    var hearBtn = $("hearBtn"), nextBtn = $("nextBtn"), goBtn = $("goBtn"), skipBtn = $("skipBtn"), closeBtn = $("closeBtn");
    var startOvl = $("startOvl"), startPic = $("startPic"), startBtn = $("startBtn"), againBtn = $("againBtn");
    var endOvl = $("endOvl"), endEcho = $("endEcho"), gotList = $("gotList"), homeBtn = $("homeBtn");
    var foundLine = $("foundLine"), foundPic = $("foundPic"), foundText = $("foundText");
    var capAsk = $("capAsk"), micBtn = $("micBtn"), micState = $("micState"), micOvl = $("micOvl");
    document.documentElement.style.setProperty("--adv-wash", data.wash || "");
    try { var tc = document.querySelector('meta[name="theme-color"]'); if (tc && data.wash) tc.setAttribute("content", data.wash); } catch (e) {}
    goBtn.textContent = data.go || "Let's go!";
    document.body.hidden = false;

    function now() { return Date.now(); }
    function rm() { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } }
    function prof() { try { return S.getProfile() || {}; } catch (e) { return {}; } }
    function vol() { var p = prof(), v = Number(p.volume == null ? 0.8 : p.volume); return isFinite(v) ? Math.max(0, Math.min(1, v)) : 0.8; }
    // sound off: the family's voice switch, or a muted Sona
    function soundOn() { var p = prof(); return p.voiceOn !== false && vol() > 0; }
    // the iPhone app plays every line as media (sona.js mediaPCM says why)
    var MEDIA = false;
    try { MEDIA = !!(S.voiceAsMedia && S.voiceAsMedia() && S.mediaPCM); } catch (e) {}

    // Echo's faces, held so a swap never waits on the network
    var ECHO = {};
    ["welcome", "talk", "cheer", "wave", "listen", "think"].forEach(function (p) { var i = new Image(); i.src = "/assets/crafted/echo-" + p + ".webp"; ECHO[p] = i; });
    function backup() { if (this.src.indexOf("echo-welcome") < 0) this.src = "/assets/crafted/echo-welcome.webp"; }
    capEcho.onerror = backup; endEcho.onerror = backup;
    function echoPose(p) { var src = "/assets/crafted/echo-" + p + ".webp"; if (capEcho.getAttribute("src") !== src) capEcho.src = src; }
    echoPose("welcome");

    // ── state, and what a test reads ──
    var view = "", idx = -1, shownAt = 0, voice = "off", opened = false, endSent = false, celebrated = false, sized = false;
    // TALK1's word moment (below): M is this page's word, null between pages
    var M = null, momTok = 0, micOff = false, bar = "next", turnT = 0, finished = false;
    var played = [];
    function pub() {
      window.__adventure = { mode: mode, id: day.id, game: day.game, view: view, idx: idx, total: run.length, art: idx >= 0 && run[idx] ? run[idx].art : "",
        line: idx >= 0 && run[idx] ? run[idx].text : "", voice: voice, glow: nextBtn.classList.contains("glow") || goBtn.classList.contains("glow"),
        little: little, media: MEDIA, sound: soundOn(), seen: seen, played: played.slice(),
        talk: TALK, word: M ? M.word : null, said: M ? M.said : 0, tries: M ? M.tries : 0, bar: bar, micOff: micOff,
        ask: !capAsk.hidden, primer: !micOvl.hidden, finished: finished };
    }

    // ── the website's own Web Audio, woken inside a tap ──
    var ctx = null;
    function wake() {
      if (MEDIA || !soundOn()) return;
      try {
        if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = new AC(); }
        if (ctx.state !== "running" && ctx.state !== "closed") { var r = ctx.resume(); if (r && r.then) r.then(null, function () {}); }
        var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
      } catch (e) {}
    }
    document.addEventListener("pointerdown", wake, { capture: true, passive: true });

    // ── Echo's lines ──
    // A recorded line's file is named by FNV-1a (32-bit, over the UTF-8
    // bytes, 8 hex digits) of TTS_CACHE_VERSION + "|" + the line: a line
    // whose words change has a new name and no file, so a stale recording can
    // never play. The manifest also carries each file's words, and a file is
    // played only for exactly those words.
    function voiceHash(text) {
      var s = unescape(encodeURIComponent(((S && S.TTS_CACHE_VERSION) || "v9") + "|" + text)), h = 0x811c9dc5;
      for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0; }
      return ("0000000" + h.toString(16)).slice(-8);
    }
    function recordedUrl(text) {
      try {
        var M = window.SonaAdventureVoice, h = voiceHash(text);
        return M && M.files && M.files[h] === text ? "/assets/adventure/voice/" + h + ".mp3" : "";
      } catch (e) { return ""; }
    }
    function fetchBytes(url) {
      return new Promise(function (res) {
        var ctl = null, t = 0;
        try { ctl = new AbortController(); t = setTimeout(function () { ctl.abort(); }, FETCH_MS); } catch (e) { ctl = null; }
        fetch(url, ctl ? { signal: ctl.signal } : undefined)
          .then(function (r) { return r.ok ? r.arrayBuffer() : null; })
          .then(function (b) { clearTimeout(t); res(b && b.byteLength ? b : null); }, function () { clearTimeout(t); res(null); });
      });
    }
    // the live voice through the shared cache (SayIt.line: the phone's
    // "sona-tts" store, the voice service with its time limit, and a stand-in
    // the service marks X-Sona-Voice-Keep: 0 is played but never kept)
    function live(text) {
      var SI = window.SayIt;
      if (!SI || !SI.line) return Promise.resolve({ kind: "synth" });
      return SI.line(text).then(function (b) { return b && b.byteLength ? { kind: "pcm", bytes: b } : { kind: "synth" }; }, function () { return { kind: "synth" }; });
    }
    // one promise per line for the page; a line that could not load is asked
    // for again the next time it is needed
    var clips = {};
    function clipFor(text) {
      if (clips[text]) return clips[text];
      var url = recordedUrl(text);
      var p = url ? fetchBytes(url).then(function (b) { return b ? { kind: "mp3", bytes: b } : live(text); }) : live(text);
      clips[text] = p;
      p.then(function (c) { if (c.kind === "synth" && clips[text] === p) delete clips[text]; });
      return p;
    }
    // Preloading: the lines from this scene on, two at a time, in scene order
    // (the scene on screen never waits behind the queue: clipFor asks for it
    // at once). Sound off: nothing is fetched at all.
    var want = [], inflight = 0;
    function preload(from) {
      if (!soundOn()) return;
      want = run.slice(from).map(function (sc) { return sc.text; });
      pump();
    }
    function pump() {
      while (inflight < 2 && want.length) {
        var t = want.shift();
        if (clips[t]) continue;
        inflight++;
        clipFor(t).then(function () { inflight--; pump(); });
      }
    }
    // and the pictures: the next two scenes' are always on their way (held,
    // since an Image nobody holds is thrown away)
    var held = {};
    function prefetchPic(i) { var sc = run[i]; if (!sc || held[sc.src]) return; var im = new Image(); im.src = sc.src; held[sc.src] = im; }

    // One line at a time. stopVoice() ends the one playing (its promise
    // settles "stopped") and any still on its way (vtok moves on).
    var vtok = 0, playing = null, synthOn = false;
    function stopVoice() {
      vtok++;
      var p = playing; playing = null;
      if (p) { try { p.stop(); } catch (e) {} }
      if (synthOn) { synthOn = false; try { window.speechSynthesis.cancel(); } catch (e) {} }
      holdVoice(false);
    }
    // TALK1: while Echo reads a page the mic stays shut (SayCheck.hold), and
    // it waits SayCheck's tail after the line before it may open
    var SC = window.SayCheck || null, holding = false;
    function holdVoice(on) {
      if (!SC || !TALK || on === holding) return;
      holding = on; try { SC.hold(on); } catch (e) {}
    }
    function stopAll() { stopVoice(); try { if (S.sfx && S.sfx.stop) S.sfx.stop(); } catch (e) {} }
    function pcmMake(bytes) {
      return function (c) {
        var d = new DataView(bytes), n = bytes.byteLength >> 1, b = c.createBuffer(1, n, 24000), ch = b.getChannelData(0);
        for (var i = 0; i < n; i++) ch[i] = d.getInt16(i * 2, true) / 32768;
        return b;
      };
    }
    // Web Audio on the page's context; resolves "ended", "failed" or "stopped"
    function webPlay(make, tok) {
      return new Promise(function (done) {
        var c = ctx, src = null, over = false, dog = 0;
        var me = { stop: function () { fin("stopped"); } };
        function fin(how) {
          if (over) return; over = true; clearTimeout(dog);
          if (playing === me) playing = null;
          try { if (src) { src.onended = null; src.stop(); } } catch (e) {}
          done(how);
        }
        if (tok !== vtok) { done("stopped"); return; }
        if (!c) { done("failed"); return; }
        playing = me;
        function go() {
          if (over) return;
          if (tok !== vtok) { fin("stopped"); return; }
          if (c.state !== "running") { fin("failed"); return; }
          try {
            var buf = make(c), g = c.createGain();
            src = c.createBufferSource(); src.buffer = buf; g.gain.value = vol();
            src.connect(g); g.connect(c.destination);
            src.onended = function () { fin("ended"); };
            // onended is not trusted to arrive: its own length and a beat end it
            dog = setTimeout(function () { fin("ended"); }, Math.ceil(buf.duration * 1000) + 1500);
            src.start(0);
          } catch (e) { fin("failed"); }
        }
        if (c.state === "suspended") {
          var woke = false, once = function () { if (woke) return; woke = true; go(); };
          try { var r = c.resume(); if (r && r.then) r.then(once, once); } catch (e) { once(); }
          setTimeout(once, 400);
        } else go();
      });
    }
    function decode(bytes) {
      return new Promise(function (res) {
        var c = ctx, over = false;
        function fin(b) { if (over) return; over = true; res(b || null); }
        if (!c || !c.decodeAudioData) { fin(null); return; }
        setTimeout(function () { fin(null); }, 4000);
        // decodeAudioData takes the bytes away: decode a copy
        try { var p = c.decodeAudioData(bytes.slice(0), fin, function () { fin(null); }); if (p && p.then) p.then(fin, function () { fin(null); }); } catch (e) { fin(null); }
      });
    }
    // a recorded line in the app: an <audio> element (media); one that has
    // not started within MP3_START_MS is let go ("failed")
    function appMp3(bytes, tok) {
      return new Promise(function (done) {
        var url = null, a = null, over = false, started = false, t = 0;
        var me = { stop: function () { fin("stopped"); } };
        function fin(how) {
          if (over) return; over = true; clearTimeout(t);
          if (playing === me) playing = null;
          try { a.onended = null; a.onerror = null; a.onplaying = null; a.pause(); a.removeAttribute("src"); a.load(); } catch (e) {}
          try { if (url) URL.revokeObjectURL(url); } catch (e) {}
          done(how);
        }
        if (tok !== vtok) { done("stopped"); return; }
        try { url = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" })); a = new Audio(url); a.volume = vol(); } catch (e) { done("failed"); return; }
        playing = me;
        function go() {
          if (started || over) return; started = true; clearTimeout(t);
          var d = Number(a.duration);
          t = setTimeout(function () { fin("ended"); }, (isFinite(d) && d > 0 ? d * 1000 : 15000) + 1500);
        }
        a.onplaying = go;
        a.onended = function () { fin("ended"); };
        a.onerror = function () { fin(started ? "ended" : "failed"); };
        t = setTimeout(function () { if (!started) fin("failed"); }, MP3_START_MS);
        try { var r = a.play(); if (r && r.then) r.then(go, function () { fin(started ? "ended" : "failed"); }); else go(); } catch (e) { fin("failed"); }
      });
    }
    function appPCM(bytes, tok) {
      if (tok !== vtok) return Promise.resolve("stopped");
      var m = S.mediaPCM(bytes, { volume: vol() }), me = { stop: function () { m.stop(); } };
      playing = me;
      return m.done.then(function (how) { if (playing === me) playing = null; return how; });
    }
    // the browser's own voice, for a line nothing else could say; cut off at
    // SYNTH_CAP_MS so it can never run on into the next scene
    function synth(text, tok) {
      return new Promise(function (done) {
        var SS = window.speechSynthesis, over = false, cap = 0;
        var me = { stop: function () { fin("stopped"); } };
        function fin(how) {
          if (over) return; over = true; clearTimeout(cap);
          if (playing === me) playing = null;
          if (how !== "ended") { try { SS.cancel(); } catch (e) {} }
          synthOn = false; done(how);
        }
        if (tok !== vtok) { done("stopped"); return; }
        if (!SS || !window.SpeechSynthesisUtterance) { done("failed"); return; }
        try {
          var u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.pitch = 1.05; u.volume = vol();
          u.onend = function () { fin("ended"); }; u.onerror = function () { fin("failed"); };
          playing = me; synthOn = true;

    // after a quiet window (or coming back to the page): the tap listens again
    micBtn.onclick = function () {
      if (view !== "scene" || bar !== "nudge" || voice === "speaking") return;
      hush(); wake();
      if (M && M.ok) { setBar("wait", ""); listenNow(); } else startMoment();
    };
    goBtn.onclick = function () {
      if (view !== "scene" || !tapOk()) return;
      stopAll();
      try { S.storySeen(day.id); } catch (e) {}
      location.href = day.page;
    };
    // the grown-ups' Skip: the intro to "Let's go!", the ending to its sticker
    skipBtn.onclick = function () {
      if (view !== "scene") return;
      stopVoice();
      // a talking story: one page, with no word said
      if (TALK) { talkNext(); return; }
      if (mode === "intro") show(run.length - 1); else showStickers();
    };
    closeBtn.onclick = function () { if (TALK) hush(); stopAll(); location.href = HOME; };
    startBtn.onclick = function () {
      if (view !== "start") return;
      // "Keep going": today's intro was already watched, straight to the game
      if (mode === "intro" && seen) { stopAll(); location.href = day.page; return; }
      begin();
    };
    againBtn.onclick = function () { if (view === "start") begin(); };
    homeBtn.onclick = function () { if (now() - shownAt < TAP_GUARD_MS) return; if (TALK) hush(); stopAll(); location.href = HOME; };
    document.addEventListener("keydown", function (e) { if (view === "scene" && e.key === "ArrowRight") { e.preventDefault(); turn(); } });
    function refit() { if (view === "scene") { sizeCaption(); layout(); } else sized = false; }
    window.addEventListener("resize", refit);
    // the card's height was measured in whatever font was ready; the story's
    // own font can wrap a line differently once it lands
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit, function () {}); } catch (e) {}
    // A hidden page stops Echo, and coming back plays nothing until a tap on
    // Hear it or Next: Next glows instead.
    if (S.onBackground) S.onBackground(function () {
      var was = voice;
      stopAll();
      if (view === "scene" && (was === "loading" || was === "late" || was === "speaking")) setVoice("done");
      // a talking page: the mic closes, and coming back needs a tap on it
      if (TALK && view === "scene" && bar !== "next" && !(M && M.leaving)) {
        hush(); setBar("nudge"); echoPose("think");
        if (!M) { var sc = run[idx]; if (sc && sc.key && talkOn()) { M = { word: sc.key, said: 0, tries: 0, ok: false, leaving: false, page: idx }; paintAsk(); } }
      }
    });
    // a page brought back from the browser's cache asks again who may be here
    window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });

    // ── the first screen ──
    // The website plays nothing until a tap, so the story opens on its card;
    // the iPhone app plays media without one, so a new intro starts at once.
    // Coming back the same day offers "Keep going" in both; the ending always
    // opens on its card.
    if (mode === "intro" && !seen && MEDIA) begin(); else openCard();
  })();
  </script>
</body>
