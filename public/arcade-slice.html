<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Fruit Slice</title>
  <link href="/fonts.css" rel="stylesheet">
  <meta name="theme-color" content="#8fd0f5" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff8a3d; --orange-d:#ef6f23; --ink:#4a2c14; --muted:#8a6f52; --line:#f0e4d2; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#8fd0f5,#ffe9b8 45%,#ffb066 75%,#ff8a5a);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:none;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #combo{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:34px;color:#ffd21c;opacity:0;transition:opacity .15s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.25);}
    /* ── designed HUD kit (handoff section 4) ── */
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;z-index:5;}
    #close{border:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#b08d63;font-size:19px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 4px 0 rgba(160,80,20,.35);}
    .hudpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 14px;box-shadow:0 4px 0 rgba(160,80,20,.35);font-family:"Baloo 2";font-weight:800;font-size:16px;color:#4a2c14;}
    #score{flex:none;}
    #hudspacer{flex:1;}
    #timer{color:#ff5c74;letter-spacing:1px;}
    /* ── warm-card overlays (handoff section 5) ── */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(30,22,50,.55);display:none;align-items:center;justify-content:center;padding:24px;}
    .ovl.show{display:flex;}
    .ovlCard{background:#fff6e9;border-radius:28px;padding:58px 20px 22px;width:100%;max-width:330px;text-align:center;box-shadow:0 18px 40px rgba(30,22,50,.45);position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;}
    .ovlEcho{position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:106px;height:106px;filter:drop-shadow(0 8px 12px rgba(30,22,50,.3));}
    .ovl .big{font-size:56px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:24px;color:#4a2c14;line-height:1.18;}
    .ovl h2 b{color:#7048c9;}
    .ovl p{color:#b08d63;font-weight:800;font-size:14.5px;max-width:270px;}
    .statRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .statPill{background:#fff;border-radius:99px;padding:8px 15px;font-family:"Baloo 2";font-weight:800;font-size:14.5px;color:#4a2c14;box-shadow:0 3px 0 rgba(120,80,20,.12);}
    .btn{border:none;border-radius:20px;padding:15px 30px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 6px 0 #ef6f23;cursor:pointer;transition:transform .05s;margin-top:4px;width:100%;}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #46a302;}
    .btn.blue{background:linear-gradient(180deg,#5cc6ff,#1cb0f6);box-shadow:0 6px 0 #1480c0;}
    .btn.blue:active{box-shadow:0 2px 0 #1480c0;}
    .btn.ghost{background:none;box-shadow:none;color:#b08d63;text-transform:none;font-size:13px;width:auto;padding:8px;}
    /* Echo speaks the win: bubble with a tail toward the leap; numbers fade in later */
    #endTitle{position:relative;background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 6px 16px rgba(74,44,20,.12);display:inline-block;}
    #endTitle:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:#fff;border-radius:3px;}
    #endSub.later{display:block!important;opacity:0;font-size:12.5px;color:var(--muted,#b08d63);transition:opacity .5s ease;margin-top:2px;}
    #endSub.later.in{opacity:1;}
    /* ── end-overlay celebration: star drop + Echo leap (Duolingo-ABC three-element stack) ── */
    #endOvl .ovlCard{padding-top:24px;}
    .endStar{animation:starDrop .35s cubic-bezier(.3,1.6,.5,1) both;}
    @keyframes starDrop{0%{transform:translateY(-64px) scale(.4);opacity:0}70%{transform:translateY(6px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
    .echoWin{position:relative;width:100%;height:96px;overflow:hidden;pointer-events:none;}
    .echoWin img{position:absolute;left:50%;bottom:-40px;width:118px;margin-left:-59px;filter:drop-shadow(0 6px 8px rgba(30,22,50,.18));animation:echoLeap .5s cubic-bezier(.3,1.4,.5,1) both,echoHop 1.5s ease-in-out .6s infinite;}
    @keyframes echoLeap{0%{transform:translateY(110px)}100%{transform:translateY(0)}}
    @keyframes echoHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px) rotate(-5deg)}}
    @media (prefers-reduced-motion: reduce){ .endStar,.echoWin img{animation:none;} }
    /* ── the round's HUD, banner and Echo at the fruit stand (27 Sep 2026) ── */
    #timer{color:#4a2c14;letter-spacing:0;gap:8px;}
    #timer .wv{white-space:nowrap;}
    #timer .wbar{display:block;width:64px;height:10px;border-radius:99px;background:#f3e3cf;overflow:hidden;}
    #timer .wbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff8a5a,#ff5470);transition:width .25s;}
    #timer .notch{display:flex;gap:3px;}
    #timer .notch i{width:9px;height:13px;border-radius:3px;background:#f3e3cf;}
    #timer .notch i.on{background:#ff5470;}
    #banner{position:absolute;left:0;right:0;top:17%;text-align:center;z-index:4;pointer-events:none;opacity:0;padding:0 16px;}
    #banner .pill{display:inline-block;background:rgba(255,255,255,.95);border-radius:26px;padding:10px 26px 12px;box-shadow:0 6px 0 rgba(160,80,20,.28);}
    #banner b{display:block;font-family:"Baloo 2";font-weight:800;font-size:40px;color:#ff5c74;line-height:1.05;}
    #banner span{display:block;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#b0683a;margin-top:2px;}
    #banner span:empty{display:none;}
    #banner.in{animation:bannerIn 1.9s ease both;}
    @keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px)}}
    @keyframes bannerFade{0%,100%{opacity:0}15%,80%{opacity:1}}
    #sliceEcho{position:absolute;left:3%;bottom:calc(env(safe-area-inset-bottom) + 46px);width:17%;max-width:78px;z-index:3;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(90,50,15,.25));}
    #sliceEcho.hop{animation:echoJump .9s cubic-bezier(.3,1.5,.5,1);}
    @keyframes echoJump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-34%) rotate(-10deg)}60%{transform:translateY(0) rotate(6deg)}80%{transform:translateY(-10%)}}
    #sab{position:absolute;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom);}
    #revHearts{display:flex;justify-content:center;gap:8px;}
    #revHearts .wdot{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#f3e3cf;color:#b08d63;font-family:"Baloo 2";font-weight:800;font-size:17px;}
    #revHearts .wdot.on{background:#58cc02;box-shadow:0 3px 0 #46a302;}
    #revHearts .wdot svg{width:20px;height:20px;}
    @media (prefers-reduced-motion: reduce){ #banner.in{animation-name:bannerFade;} #sliceEcho.hop{animation:none;} }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div class="hudpill"><svg viewBox="0 0 64 64" style="width:19px;height:19px;vertical-align:-4px"><path d="M5 25a27 27 0 0 0 54 0Z" fill="#58cc02"/><path d="M10 25a22 22 0 0 0 44 0Z" fill="#eefce2"/><path d="M14 25a18 18 0 0 0 36 0Z" fill="#ff5470"/><ellipse cx="26" cy="33" rx="2" ry="3" fill="#3d2317" transform="rotate(18 26 33)"/><ellipse cx="38" cy="33" rx="2" ry="3" fill="#3d2317" transform="rotate(-18 38 33)"/></svg> <b id="score">0</b></div>
      <div id="hudspacer"></div>
      <div id="timer" class="hudpill"></div>
    </div>
    <div id="combo"></div>
    <div id="banner" aria-live="polite"><div class="pill"><b id="bnBig"></b><span id="bnSmall"></span></div></div>
    <img id="sliceEcho" src="/coach/echo/echo-celebrate.svg" alt="" />
    <div id="sab"></div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/coach/echo/echo-star.svg" alt="" />
      <h2 id="needTitle">This game needs a ticket!</h2>
      <p>Say your sound 5 times to fill it up</p>
      <button class="btn" id="goCharge"><svg viewBox="0 0 64 64" style="width:18px;height:18px;vertical-align:-3px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg> Fill my ticket!</button>
      <button class="btn ghost" id="needHome">Back home</button>
    </div>
  </div>

  <div class="ovl" id="revOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/coach/echo/echo-listening.svg" alt="" />
      <h2 id="revTitle">Say it!</h2>
      <p id="revHearts" style="font-size:26px;"></p>
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 4px 0 #ef6f23,0 0 0 10px rgba(255,138,61,.14);display:flex;align-items:center;justify-content:center;margin:2px 0;"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
      <p id="revListen" style="font-size:13px;">Get ready…</p>
      <button class="btn ghost" id="revDone">I'm done playing</button>
    </div>
  </div>

  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <div class="big endStar" id="endEmoji"><svg viewBox="0 0 64 64" style="width:56px;height:56px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg></div>
      <h2 id="endTitle">Great slicing!</h2>
      <p id="endSub"></p>
      <div class="echoWin"><img src="/coach/echo/echo-celebrate.svg" alt="" /></div>
      <button class="btn blue" id="endCharge">WOOHOO! Next →</button>
      <button class="btn" id="endAgain" style="display:none;"></button>
      <button class="btn ghost" id="endHome">Back home</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script>
    // Check access before any game resources start. The earned speech token
    // remains a separate requirement; a catalog unlock never creates one.
    var gameEntryAllowed=false;
    (function () {
      var S=window.Sona, q=new URLSearchParams(location.search);
      if(!S)return;
      var earned=q.get("from")==="charge";
      if(!S.gameAccess("slice",{run:q.get("daily")==="1",earned:earned}).allowed){S.gameBounce("slice");return;}
      if(!earned){location.replace("/today.html");return;}
      gameEntryAllowed=true;
    })();
  </script>
  <script>
    if(gameEntryAllowed){
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    var fromCharge=qp.get("from")==="charge";
    // ── the mic and this game's own sounds never overlap (24 Sep 2026) ──
    // On an iPhone a page holding the mic runs as a phone call: the volume
    // buttons change CALL volume and every chime is processed like a call.
    // So no game sound plays while the keep-playing mic is open (a sound
    // asked for then is dropped; the game is paused behind the card anyway),
    // none waits on a mic request that hasn't settled, none plays in the
    // first SETTLE_MS after the mic closes (the phone switches back in
    // silence, not under a chime), and the mic never opens until QUIET_MS
    // after the last sound began: the longest chime ("complete") rings about
    // 0.6 s and the rest covers speaker and Bluetooth delay, so a chime's
    // tail can never answer the card for the child.
    var SETTLE_MS=200, QUIET_MS=900, quietUntil=0, micClosedAt=-1e9;
    var rv={st:null,pending:0,gen:0,raf:0,t:0,ctx:null,src:null,floor:-1};   // floor: the room's quiet level, measured once per page (see listenFor)
    function sfx(n){
      if(rv.st) return;
      if(rv.pending){ setTimeout(function(){ sfx(n); },60); return; }
      var wait=micClosedAt+SETTLE_MS-performance.now();
      if(wait>0){ quietUntil=Math.max(quietUntil,performance.now()+wait+QUIET_MS); setTimeout(function(){ sfx(n); },wait); return; }
      quietUntil=Math.max(quietUntil,performance.now()+QUIET_MS);
      try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){}
    }

    // ---- charge gate: a round is unlocked by the 5-rep charge (play token) ----
    var SELF="arcade-slice.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ try{sessionStorage.removeItem("sona.play.active");}catch(e){} location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ var _t=sessionStorage.getItem("sona.play.token"); if(_t===SELF||_t==="1"){ tok=true; sessionStorage.setItem("sona.play.active",SELF); sessionStorage.removeItem("sona.play.token"); } else if(sessionStorage.getItem("sona.play.active")===SELF){ tok=true; } }catch(e){}
    if(!tok){ try{ $("needTitle").textContent="Fruit Slice needs a ticket!"; }catch(e){} $("needOvl").classList.add("show"); }

    // ---- canvas game: swipe-slice tossed fruit, 45s ----
    var FRUITS=["🍉","🍎","🍊","🍋","🍇","🍓","🥝","🍑","🍍"];
    // ── Hand-built vector fruit (SVG → Image), replacing the emoji set.
    // Flat, thick-rounded, top-left light — matches the city panel style.
    // Falls back to emoji per-sprite until its image decodes.
    var SVGS={
      watermelon:'<path d="M8 58 A44 44 0 0 1 92 58 L88 64 Q50 80 12 64 Z" fill="#2f9e44"/><path d="M14 57 A38 38 0 0 1 86 57 L83 61 Q50 74 17 61 Z" fill="#d3f9d8"/><path d="M20 55 A31 31 0 0 1 80 55 L78 58 Q50 69 22 58 Z" fill="#ff6b7a"/><ellipse cx="38" cy="46" rx="2.6" ry="4" fill="#343a40" transform="rotate(-18 38 46)"/><ellipse cx="55" cy="42" rx="2.6" ry="4" fill="#343a40" transform="rotate(8 55 42)"/><ellipse cx="68" cy="49" rx="2.6" ry="4" fill="#343a40" transform="rotate(24 68 49)"/><path d="M24 50 A26 26 0 0 1 44 34" stroke="#ffd0d6" stroke-width="5" fill="none" stroke-linecap="round"/>',
      apple:'<circle cx="50" cy="56" r="34" fill="#fa5252"/><path d="M50 56 m-34 0 a34 34 0 0 1 34-34 v68 a34 34 0 0 1 -34 -34" fill="#ff8787"/><path d="M50 24 q-2 -10 6 -14" stroke="#8a5a2e" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M58 14 q14 -4 16 8 q-14 6 -16 -8" fill="#69db7c"/><circle cx="38" cy="46" r="7" fill="#ffe3e3" opacity=".85"/>',
      orange:'<circle cx="50" cy="56" r="34" fill="#ff922b"/><path d="M50 56 m-34 0 a34 34 0 0 1 34 -34 v68 a34 34 0 0 1 -34 -34" fill="#ffa94d"/><circle cx="38" cy="46" r="7" fill="#ffe8cc" opacity=".9"/><circle cx="62" cy="66" r="2.4" fill="#e8590c" opacity=".5"/><circle cx="54" cy="74" r="2.4" fill="#e8590c" opacity=".5"/><circle cx="68" cy="54" r="2.4" fill="#e8590c" opacity=".5"/><path d="M50 22 q0 -8 8 -10" stroke="#2f9e44" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="62" cy="12" rx="9" ry="5" fill="#51cf66" transform="rotate(20 62 12)"/>',
      lemon:'<ellipse cx="50" cy="56" rx="36" ry="27" fill="#ffd43b" transform="rotate(-14 50 56)"/><ellipse cx="50" cy="56" rx="36" ry="27" fill="none" transform="rotate(-14 50 56)"/><circle cx="16" cy="47" r="6" fill="#ffd43b"/><circle cx="84" cy="65" r="6" fill="#ffd43b"/><ellipse cx="38" cy="46" rx="9" ry="6" fill="#fff3bf" opacity=".9" transform="rotate(-14 38 46)"/>',
      grapes:'<circle cx="38" cy="42" r="12" fill="#9775fa"/><circle cx="62" cy="42" r="12" fill="#9775fa"/><circle cx="26" cy="60" r="12" fill="#845ef7"/><circle cx="50" cy="58" r="13" fill="#b197fc"/><circle cx="74" cy="60" r="12" fill="#845ef7"/><circle cx="38" cy="76" r="12" fill="#7048e8"/><circle cx="62" cy="76" r="12" fill="#7048e8"/><circle cx="50" cy="90" r="11" fill="#5f3dc4"/><path d="M50 30 q-2 -12 8 -16" stroke="#8a5a2e" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="63" cy="14" rx="10" ry="6" fill="#69db7c" transform="rotate(18 63 14)"/><circle cx="45" cy="52" r="4.5" fill="#e5dbff" opacity=".9"/>',
      strawberry:'<path d="M50 92 Q18 68 22 42 Q26 24 50 26 Q74 24 78 42 Q82 68 50 92" fill="#fa5252"/><path d="M50 92 Q18 68 22 42 Q26 24 50 26 L50 92" fill="#ff8787"/><path d="M34 22 L50 30 L66 22 L58 34 L50 28 L42 34 Z" fill="#51cf66"/><path d="M50 16 l0 10" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="48" r="2.2" fill="#fff3bf"/><circle cx="54" cy="44" r="2.2" fill="#fff3bf"/><circle cx="62" cy="58" r="2.2" fill="#fff3bf"/><circle cx="44" cy="64" r="2.2" fill="#fff3bf"/><circle cx="54" cy="76" r="2.2" fill="#fff3bf"/>',
      kiwi:'<circle cx="50" cy="56" r="34" fill="#a9803f"/><circle cx="50" cy="56" r="29" fill="#94d82d"/><circle cx="50" cy="56" r="27" fill="#a9e34b"/><circle cx="50" cy="56" r="9" fill="#f4fce3"/><g fill="#343a40"><ellipse cx="50" cy="38" rx="2" ry="3.4"/><ellipse cx="62" cy="43" rx="2" ry="3.4" transform="rotate(40 62 43)"/><ellipse cx="67" cy="56" rx="2" ry="3.4" transform="rotate(90 67 56)"/><ellipse cx="62" cy="69" rx="2" ry="3.4" transform="rotate(140 62 69)"/><ellipse cx="50" cy="74" rx="2" ry="3.4"/><ellipse cx="38" cy="69" rx="2" ry="3.4" transform="rotate(40 38 69)"/><ellipse cx="33" cy="56" rx="2" ry="3.4" transform="rotate(90 33 56)"/><ellipse cx="38" cy="43" rx="2" ry="3.4" transform="rotate(140 38 43)"/></g>',
      peach:'<circle cx="50" cy="58" r="32" fill="#ff9f9f"/><path d="M50 58 m-32 0 a32 32 0 0 1 32 -32 v64 a32 32 0 0 1 -32 -32" fill="#ffb8b0"/><path d="M50 30 Q58 54 50 86" stroke="#ef8080" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M50 26 q-2 -10 6 -13" stroke="#8a5a2e" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="61" cy="16" rx="11" ry="6" fill="#69db7c" transform="rotate(22 61 16)"/><circle cx="38" cy="48" r="6.5" fill="#ffe0dc" opacity=".9"/>',
      pineapple:'<defs><clipPath id="pb"><ellipse cx="50" cy="64" rx="25" ry="29"/></clipPath></defs><ellipse cx="50" cy="64" rx="25" ry="29" fill="#ffc93b"/><g clip-path="url(#pb)" stroke="#e0a400" stroke-width="3.5" opacity=".85"><path d="M20 44 L84 90" fill="none"/><path d="M16 62 L76 100" fill="none"/><path d="M32 34 L92 76" fill="none"/><path d="M80 44 L16 90" fill="none"/><path d="M84 62 L24 100" fill="none"/><path d="M68 34 L8 76" fill="none"/></g><circle cx="41" cy="52" r="5" fill="#ffe9a8" opacity=".85"/><path d="M50 40 C45 24 46 12 50 4 C54 12 55 24 50 40" fill="#2f9e44"/><path d="M48 40 C36 30 29 22 24 10 C37 15 46 25 51 36" fill="#51cf66"/><path d="M52 40 C64 30 71 22 76 10 C63 15 54 25 49 36" fill="#51cf66"/>'
    };
    var JUICE={ "🍉":"#ff6b7a","🍎":"#fa5252","🍊":"#ff922b","🍋":"#ffd43b","🍇":"#9775fa","🍓":"#fa5252","🥝":"#94d82d","🍑":"#ffa8a8","🍍":"#ffd43b" };
    var SPRITEKEY={ "🍉":"watermelon","🍎":"apple","🍊":"orange","🍋":"lemon","🍇":"grapes","🍓":"strawberry","🥝":"kiwi","🍑":"peach","🍍":"pineapple" };
    var SPRITES={};
    Object.keys(SVGS).forEach(function(k){
      var im=new Image();
      im.onload=function(){ SPRITES[k]=im; };
      im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 100 100">'+SVGS[k]+'</svg>');
    });
    function drawFruit(e,size){
      var sp=SPRITES[SPRITEKEY[e]];

        if(gold) showCombo("GOLDEN! +3"); else if(combo>=3) showCombo(combo+" COMBO! 🔥"); }
      if(phase==="finale"&&giant) giantMove(lx,ly,p.x,p.y,now);
      lx=p.x; ly=p.y; e.preventDefault&&e.preventDefault();
    }
    cv.addEventListener("pointerdown",function(e){ pDown=true; var p=pt(e); lx=p.x; ly=p.y; trail.length=0; if(giant) giant.inside=false; });
    cv.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",function(){ pDown=false; });

    var comboIv=setInterval(function(){ if(document.hidden)return; if(combo&&performance.now()-comboT>1400) combo=0; },500);

    // ── the finale: one giant watermelon, five cuts ──
    // It rises and waits in the middle of the sky; every swipe that crosses it
    // is one cut (a swipe back across counts again), five and it bursts. It
    // cannot be missed, so the round always ends on a win.
    function startFinale(){
      phase="finale";
      var R=Math.min(W*0.34,H*0.21);
      giant={x:W/2,y:H+R+30,ty:H*0.42,r:R,cuts:0,t:0,inside:false,lastCut:0,shake:0,gashes:[],hint:performance.now()+4000};
      hud(); banner("Giant watermelon!","Swipe it "+GIANT_CUTS+" times!"); echoHop();
    }
    function giantY(){ return giant.y+Math.sin(giant.t/520)*7; }
    function giantMove(x1,y1,x2,y2,now){
      var g=giant, gy=giantY(), dx=x2-g.x, dy=y2-gy;
      if(g.y>g.ty+g.r*0.6) return;                    // still rising
      if(dx*dx+dy*dy>g.r*g.r*1.1) g.inside=false;      // out again: the next pass is a new cut
      if(g.inside||now-g.lastCut<160||!segHit(x1,y1,x2,y2,g.x,gy,g.r)) return;
      g.inside=true; g.lastCut=now; g.cuts++; g.shake=12; g.hint=now+4000; score++;
      var a=Math.atan2(y2-y1,x2-x1), o=(x1-g.x)*-Math.sin(a)+(y1-gy)*Math.cos(a);   // the swipe's line: angle, and offset from the centre
      for(var j=0;j<g.gashes.length;j++) if(Math.abs(g.gashes[j].o-o)<g.r*0.2&&Math.abs(Math.sin(g.gashes[j].a-a))<0.3) o+=(o>0?-1:1)*g.r*0.34;
      g.gashes.push({a:a,o:Math.max(-g.r*0.7,Math.min(g.r*0.7,o))});
      juice(x2,y2,"#ff5470",14,false); sfx("splat"); $("score").textContent=score; hud();
      if(g.cuts>=GIANT_CUTS) burstGiant();
    }
    function burstGiant(){
      var g=giant, gy=giantY(), i, a;
      phase="done"; finaleDone=true; hud();
      for(i=0;i<18;i++){ a=i/18*Math.PI*2; parts.push({x:g.x,y:gy,vx:Math.cos(a)*(4+Math.random()*4),vy:Math.sin(a)*(4+Math.random()*4)-4,e:"🍉",half:(i%2)+1,life:1.3}); }
      juice(g.x,gy,"#ff5470",46,false); juice(g.x,gy,"#58cc02",14,false); splat(g.x,gy,g.r*1.2,"#ff5470");
      giant=null; sfx("giant"); echoHop();
      try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      banner("You did it!","The giant watermelon is sliced!");
      setTimeout(endRound,1800);
    }
    function drawGiant(dt,now){
      var g=giant; g.t+=dt; g.y+=(g.ty-g.y)*0.06; g.shake*=0.85;
      var gy=giantY(), sx=g.shake>0.5?(Math.random()-0.5)*g.shake:0, R=g.r, i;
      if(now>g.hint&&g.y<g.ty+R*0.6){   // nothing for a while: a ring and a word say where to swipe
        var p=(now%1200)/1200; ctx.strokeStyle="rgba(255,255,255,"+(0.8*(1-p))+")"; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(g.x,gy,R*(1.05+p*0.35),0,7); ctx.stroke();
        ctx.font='800 22px "Baloo 2",sans-serif'; ctx.lineWidth=5; ctx.strokeStyle="rgba(120,50,10,.5)"; ctx.strokeText("Swipe across it!",g.x,gy-R-28); ctx.fillStyle="#fff"; ctx.fillText("Swipe across it!",g.x,gy-R-28);
      }
      ctx.save(); ctx.translate(g.x+sx,gy); ctx.rotate(Math.sin(g.t/900)*0.06);
      ctx.fillStyle="#2f9e44"; ctx.beginPath(); ctx.ellipse(0,0,R,R*0.86,0,0,7); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,R,R*0.86,0,0,7); ctx.clip();
      ctx.strokeStyle="#1d7a34"; ctx.lineWidth=R*0.11;
      for(i=-3;i<=3;i++){ ctx.beginPath(); ctx.ellipse(i*R*0.29,0,R*0.1,R*0.95,0,0,7); ctx.stroke(); }
      for(i=0;i<g.gashes.length;i++){ var h=g.gashes[i], nx=-Math.sin(h.a)*h.o, ny=Math.cos(h.a)*h.o, ux=Math.cos(h.a)*R*1.2, uy=Math.sin(h.a)*R*1.2;
        ctx.lineCap="round"; ctx.strokeStyle="#ff5470"; ctx.lineWidth=R*0.17; ctx.beginPath(); ctx.moveTo(nx-ux,ny-uy); ctx.lineTo(nx+ux,ny+uy); ctx.stroke();
        ctx.strokeStyle="#ffc2cc"; ctx.lineWidth=R*0.05; ctx.beginPath(); ctx.moveTo(nx-ux,ny-uy); ctx.lineTo(nx+ux,ny+uy); ctx.stroke(); }
      ctx.restore();
      ctx.fillStyle="rgba(255,255,255,.22)"; ctx.beginPath(); ctx.ellipse(-R*0.38,-R*0.4,R*0.26,R*0.13,-0.6,0,7); ctx.fill();
      ctx.restore();
    }

    // ── the stand at the bottom: fruit waiting on the counter, restocked ──
    function drawStand(now){
      var top=standTop(), i, x, k, sw=24, lip=6, band=16;
      for(i=0;i<WELLS.length;i++){ var wl=WELLS[i];
        if(!wl.e&&wl.back&&now>=wl.back){ wl.e=FRUITS[(Math.random()*FRUITS.length)|0]; wl.pop=now; }
        if(!wl.e) continue;
        var t=wl.pop?Math.min(1,(now-wl.pop)/350):1, sc=t<1?0.4+0.6*t+Math.sin(t*Math.PI)*0.25:1;
        ctx.save(); ctx.translate(wellX(i),top-12); ctx.scale(sc,sc); drawFruit(wl.e,48); ctx.restore(); }
      ctx.fillStyle="#ffdf9e"; ctx.fillRect(0,top,W,H-top);
      ctx.fillStyle="#e0b25f"; ctx.fillRect(0,top,W,lip);
      for(x=0,k=0;x<W;x+=sw,k++){ ctx.fillStyle=k%2?"#ff9d6e":"#fff8ec"; ctx.beginPath(); ctx.moveTo(x,top+lip); ctx.lineTo(x+sw,top+lip); ctx.lineTo(x+sw,top+lip+band); ctx.arc(x+sw/2,top+lip+band,sw/2,0,Math.PI); ctx.closePath(); ctx.fill(); }
    }
    function glow(r,now){
      var gl=ctx.createRadialGradient(0,0,r*0.4,0,0,r*1.7); gl.addColorStop(0,"rgba(255,214,51,.9)"); gl.addColorStop(1,"rgba(255,214,51,0)");
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,r*1.7,0,7); ctx.fill();
      ctx.fillStyle="#fff7c2";
      for(var k=0;k<4;k++){ var a=now/400+k*1.571, d=r*1.3, s=5+2*Math.sin(now/150+k), x=Math.cos(a)*d, y=Math.sin(a)*d;
        ctx.beginPath(); ctx.moveTo(x,y-s); ctx.quadraticCurveTo(x,y,x+s,y); ctx.quadraticCurveTo(x,y,x,y+s); ctx.quadraticCurveTo(x,y,x-s,y); ctx.quadraticCurveTo(x,y,x,y-s); ctx.fill(); }
    }

    var lastT=performance.now();
    function draw(){
      var now=performance.now(), dt=Math.min(100,now-lastT), i; lastT=now;
      if(playing&&phase==="wave"){
        waveMs+=dt;
        if(waveMs>=nextToss){ toss(); nextToss=waveMs+WAVES[wave].every*(missRun>=2?1.25:1); }
        if(waveGot>=WAVES[wave].goal||waveMs>=WAVE_CAP_MS) endWave();
      }
      ctx.clearRect(0,0,W,H);
      // sunset skyline silhouettes (design 4: Fruit Slice sky)
      ctx.fillStyle="rgba(200,90,60,.18)";
      for(i=0;i<6;i++){ var bw=W*0.16, bx=i*bw*1.05-10, bh=H*(0.10+((i*37)%3)*0.035)+62; ctx.fillRect(bx,H-bh,bw,bh); }
      ctx.fillStyle="rgba(160,60,40,.22)";
      for(i=0;i<5;i++){ var bw2=W*0.13, bx2=i*bw2*1.55+20, bh2=H*(0.06+((i*53)%3)*0.03)+62; ctx.fillRect(bx2,H-bh2,bw2,bh2); }
      // juice left on the sky by each slice, fading
      for(i=splats.length-1;i>=0;i--){ var s=splats[i]; s.life-=0.012; if(s.life<=0){ splats.splice(i,1); continue; }
        ctx.globalAlpha=s.life*0.42; ctx.fillStyle=s.col; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
        for(var q=0;q<s.d.length;q++){ ctx.beginPath(); ctx.arc(s.x+s.d[q][0],s.y+s.d[q][1],s.d[q][2],0,7); ctx.fill(); }
        ctx.globalAlpha=1; }
      // fruit
      ctx.textAlign="center"; ctx.textBaseline="middle";
      for(i=fruits.length-1;i>=0;i--){ var f=fruits[i];
        f.x+=f.vx; f.y+=f.vy; f.vy+=f.g||G; f.rot+=f.vr;
        if(f.sliced){ fruits.splice(i,1); continue; }
        // a miss just falls away: nothing stops and nothing is lost; the help grows instead
        if(f.y>H+80){ fruits.splice(i,1); if(playing&&phase==="wave"){ missRun++; combo=0; } continue; }
        ctx.save(); ctx.translate(f.x,f.y);
        if(f.gold) glow(f.r,now);
        ctx.rotate(f.rot);
        // opaque paint before emoji — translucent fillStyle ghosts color glyphs
        drawFruit(f.e,f.r*2.15); ctx.restore();
      }
      // particles + halves
      for(i=parts.length-1;i>=0;i--){ var p=parts[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=G*0.8; p.life-=0.02;
        if(p.life<=0||p.y>H+60){ parts.splice(i,1); continue; }
        if(p.e){ ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); ctx.translate(p.x,p.y);
          ctx.beginPath(); if(p.half===1)ctx.rect(-30,-30,30,60); else ctx.rect(0,-30,30,60); ctx.clip(); drawFruit(p.e,52); ctx.restore(); }
        else { ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; }
      }
      drawStand(now);
      if(giant) drawGiant(dt,now);
      // trail
      if(trail.length>1){ ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=5; ctx.lineCap="round"; ctx.beginPath();
        var pts=trail.filter(function(q){return now-q.t<130;});
        for(i=0;i<pts.length;i++){ i?ctx.lineTo(pts[i].x,pts[i].y):ctx.moveTo(pts[i].x,pts[i].y); } ctx.stroke(); }
      // "+3" over a golden fruit
      for(i=floats.length-1;i>=0;i--){ var ft=floats[i]; ft.y-=0.9; ft.life-=0.018; if(ft.life<=0){ floats.splice(i,1); continue; }
        ctx.globalAlpha=Math.min(1,ft.life*1.6); ctx.font='800 30px "Baloo 2",sans-serif'; ctx.lineWidth=5; ctx.strokeStyle="rgba(120,50,10,.55)"; ctx.strokeText(ft.t,ft.x,ft.y); ctx.fillStyle=ft.col; ctx.fillText(ft.t,ft.x,ft.y); ctx.globalAlpha=1; }
      requestAnimationFrame(draw);
    }
    startWave(0);
    draw();

    // ---- round over ----
    function bankAndContinue(){ S.finishGameTurn("slice",score); location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      closeReviveMic();
      if(window.__ended)return; window.__ended=true;
      S.finishGameTurn("slice",isDaily?score:null);
      playing=false; reviveWait=false; clearInterval(comboIv);
      var isBest=score>BEST; if(isBest){ BEST=score; try{ localStorage.setItem(BESTK,String(BEST)); }catch(e){} }
      var coins=Math.min(10,(score/4)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        // Daily Run: bank the score and keep the run moving — no buttons, no stall.
        if(score===0){ $("endEmoji").style.opacity=".25"; } // gentle zero tier: dim the star, keep it warm
        $("endTitle").textContent=score===0?"Good try!":("+"+score+" points!");
        $("endSub").textContent=score===0?"On to the next game…":"Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        $("endOvl").classList.add("show");
        setTimeout(bankAndContinue,1400);
        return;
      }
      if(score===0){
        // gentle zero tier: encouraging copy, dimmed star, happy Echo, one warm "again" button
        $("endEmoji").style.opacity=".25";
        $("endTitle").textContent="Good try! Wanna go again?";
        $("endSub").className=""; $("endSub").style.display="none";
        $("endCharge").style.display="none";
        var ea=$("endAgain"); ea.textContent="Yes! Play again"; ea.style.display=""; ea.onclick=backToCharge;
        $("endOvl").classList.add("show");
        return;
      }
      // one reward per moment: star + one line + Echo — no stat rows or coin counters here
      $("endTitle").textContent=finaleDone?(isBest?"A new best! You sliced the giant watermelon!":"You sliced the giant watermelon!"):(isBest?"WOW — a new best! I saw "+score+" fruits fly!":"I saw "+score+" fruits fly! So fun!");
      var _es=$("endSub"); _es.textContent=score+" fruits · Best: "+BEST; _es.className="later";
      setTimeout(function(){ _es.classList.add("in"); },1000);
      $("endAgain").style.display="none";
      $("endOvl").classList.add("show");
    }
    $("endCharge").onclick=function(){ location.href=isDaily?"/charge.html?daily=1":(S.gameAccess("tiles").allowed?"/charge.html?game=arcade-tiles.html":"/activities.html"); };
    $("endAgain").onclick=function(){ location.reload(); };
    $("endHome").onclick=function(){ S.finishGameTurn("slice"); location.href="/today.html#play"; };
    $("close").onclick=function(){ closeReviveMic(); S.finishGameTurn("slice"); if(playing){ playing=false; clearInterval(comboIv); } if(isDaily){ bankAndContinue(); return; } location.href="/today.html#play"; };
    }
  </script>
