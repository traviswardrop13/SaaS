<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Fruit Slice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#0f2740" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --ink:#3c3c3c; --muted:#777; --line:#e5e5e5; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:#0f2740;}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:none;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;z-index:5;}
    #close{border:none;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:800;cursor:pointer;line-height:1;border-radius:12px;padding:8px 12px;}
    #score{font-family:"Baloo 2";font-weight:800;font-size:22px;color:#fff;flex:1;}
    #timer{font-family:"Baloo 2";font-weight:800;font-size:18px;color:#ffd21c;}
    #combo{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:34px;color:#ffd21c;opacity:0;transition:opacity .15s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.25);}
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(10,26,44,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:10px;}
    .ovl.show{display:flex;}
    .ovl .big{font-size:70px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:28px;color:#fff;}
    .ovl p{color:#bcd3e8;font-weight:700;font-size:15px;max-width:300px;}
    .btn{border:none;border-radius:16px;padding:15px 32px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;transition:transform .05s;margin-top:6px;}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .btn.blue{background:var(--blue);box-shadow:0 5px 0 0 var(--blue-d);}
    .btn.ghost{background:none;box-shadow:none;color:#9db8d0;text-transform:none;font-size:14px;}
  </style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div id="score">🍉 0</div>
      <div id="timer">45</div>
    </div>
    <div id="combo"></div>
  </div>

  <!-- needs a ticket -->
  <div class="ovl" id="needOvl">
    <div class="big">🎟</div>
    <h2>You need a ticket!</h2>
    <p>Charge up with your sounds to earn one — then come slice!</p>
    <button class="btn blue" id="goCharge">⚡ Charge up</button>
    <button class="btn ghost" id="needHome">Back home</button>
  </div>

  <!-- round over -->
  <div class="ovl" id="endOvl">
    <div class="big" id="endEmoji">🍉</div>
    <h2 id="endTitle">Great slicing!</h2>
    <p id="endSub"></p>
    <button class="btn blue" id="endCharge">⚡ Charge up for more</button>
    <button class="btn" id="endAgain" style="display:none;">🎟 Play again</button>
    <button class="btn ghost" id="endHome">Done for now</button>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    var fromCharge=qp.get("from")==="charge";
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }

    // ---- charge gate: a round is unlocked by the 5-rep charge (play token) ----
    var SELF="arcade-slice.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ tok=sessionStorage.getItem("sona.play.token")==="1"; sessionStorage.removeItem("sona.play.token"); }catch(e){}
    if(!tok){ $("needOvl").classList.add("show"); }

    // ---- canvas game: swipe-slice tossed fruit, 45s ----
    var FRUITS=["🍉","🍎","🍊","🍋","🍇","🍓","🥝","🍑","🍍"];
    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    var ROUND=45, tLeft=ROUND, playing=true, score=0, combo=0, comboT=0;
    var fruits=[], parts=[], trail=[];
    var G=H*0.0011||0.62; // gravity scaled to screen

    function toss(){
      var n=1+((Math.random()*2)|0)+(tLeft<20?1:0); // ramps up late
      for(var i=0;i<n;i++){
        var x=W*(0.15+Math.random()*0.7);
        fruits.push({ e:FRUITS[(Math.random()*FRUITS.length)|0], x:x, y:H+40,
          vx:(W*0.5-x)*0.004+(Math.random()-0.5)*2.2,
          vy:-(H*0.0165)*(0.92+Math.random()*0.22),
          r:26+Math.random()*10, rot:Math.random()*6, vr:(Math.random()-0.5)*0.12, sliced:false });
      }
    }
    var tossIv=setInterval(function(){ if(playing) toss(); },1100);
    toss();

    // slicing: pointer trail + segment-vs-circle hit
    var pDown=false,lx=0,ly=0;
    function pt(e){ var r=cv.getBoundingClientRect(); var t=(e.touches&&e.touches[0])||e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
    function segHit(x1,y1,x2,y2,cx,cy,r){ var dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((cx-x1)*dx+(cy-y1)*dy)/L2)),px=x1+t*dx,py=y1+t*dy,ddx=cx-px,ddy=cy-py; return ddx*ddx+ddy*ddy<=r*r; }
    function onMove(e){ if(!pDown||!playing)return; var p=pt(e); trail.push({x:p.x,y:p.y,t:performance.now()});
      var hit=0;
      for(var i=0;i<fruits.length;i++){ var f=fruits[i];
        if(!f.sliced && segHit(lx,ly,p.x,p.y,f.x,f.y,f.r+8)){ f.sliced=true; hit++; score++; combo++;
          for(var k=0;k<10;k++) parts.push({x:f.x,y:f.y,vx:(Math.random()-0.5)*7,vy:-Math.random()*6,r:3+Math.random()*4,life:1,col:["#ff6b6b","#ffd21c","#7bed8d","#74c0fc"][(Math.random()*4)|0]});
          parts.push({x:f.x,y:f.y,vx:-2.4,vy:-2,e:f.e,half:1,life:1}); parts.push({x:f.x,y:f.y,vx:2.4,vy:-2,e:f.e,half:2,life:1});
        } }
      if(hit){ sfx("tap"); $("score").textContent="🍉 "+score; comboT=performance.now();
        if(combo>=3){ var c=$("combo"); c.textContent=combo+" COMBO! 🔥"; c.style.opacity=1; c.style.transform="scale(1.15)"; setTimeout(function(){c.style.opacity=0;c.style.transform="scale(1)";},550); } }
      lx=p.x; ly=p.y; e.preventDefault&&e.preventDefault();
    }
    cv.addEventListener("pointerdown",function(e){ pDown=true; var p=pt(e); lx=p.x; ly=p.y; trail.length=0; });
    cv.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",function(){ pDown=false; });

    // timer
    var timeIv=setInterval(function(){ if(!playing)return; tLeft--; $("timer").textContent=tLeft;
      if(combo&&performance.now()-comboT>1400) combo=0;
      if(tLeft<=0) endRound(); },1000);

    function draw(){
      ctx.clearRect(0,0,W,H);
      // night-sky bg stars
      ctx.globalAlpha=0.25; ctx.fillStyle="#9fd0ff"; for(var i=0;i<20;i++){ ctx.fillRect(((i*97)%W),((i*211)%(H*0.6)),2,2); } ctx.globalAlpha=1;
      // trail
      if(trail.length>1){ ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=5; ctx.lineCap="round"; ctx.beginPath();
        var now=performance.now(); var pts=trail.filter(function(p){return now-p.t<130;});
        for(var i=0;i<pts.length;i++){ i?ctx.lineTo(pts[i].x,pts[i].y):ctx.moveTo(pts[i].x,pts[i].y); } ctx.stroke(); }
      // fruit
      ctx.textAlign="center"; ctx.textBaseline="middle";
      for(var i=fruits.length-1;i>=0;i--){ var f=fruits[i];
        f.x+=f.vx; f.y+=f.vy; f.vy+=G; f.rot+=f.vr;
        if(f.y>H+80||f.sliced){ fruits.splice(i,1); continue; }
        ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot); ctx.font=(f.r*2)+"px sans-serif"; ctx.fillText(f.e,0,0); ctx.restore();
      }
      // particles + halves
      for(var i=parts.length-1;i>=0;i--){ var p=parts[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=G*0.8; p.life-=0.02;
        if(p.life<=0||p.y>H+60){ parts.splice(i,1); continue; }
        if(p.e){ ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.font="34px sans-serif";
          ctx.beginPath(); if(p.half===1)ctx.rect(-30,-30,30,60); else ctx.rect(0,-30,30,60); ctx.clip(); ctx.fillText(p.e,0,0); ctx.restore(); }
        else { ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; }
      }
      requestAnimationFrame(draw);
    }
    draw();

    // ---- round over ----
    function bankAndContinue(){ location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      if(!playing)return; playing=false; clearInterval(tossIv); clearInterval(timeIv);
      var coins=Math.min(10,(score/4)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        // Daily Run: bank the score and keep the run moving — no buttons, no stall.
        $("endTitle").textContent="+"+score+" points! 🏆";
        $("endSub").textContent="Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        $("endOvl").classList.add("show");
        setTimeout(bankAndContinue,1400);
        return;
      }
      $("endTitle").textContent=score>=20?"Fruit master! 🏆":"Great slicing!";
      $("endSub").textContent="You sliced "+score+" fruits"+(coins?(" · +"+coins+" 🪙"):"")+"!";
      $("endAgain").style.display="none";
      $("endCharge").textContent="⚡ Play again";
      $("endOvl").classList.add("show");
    }
    $("endCharge").onclick=backToCharge;
    $("endAgain").onclick=function(){ location.reload(); };
    $("endHome").onclick=function(){ location.href="/map.html"; };
    $("close").onclick=function(){ if(playing){ playing=false; clearInterval(tossIv); clearInterval(timeIv); } if(isDaily){ bankAndContinue(); return; } location.href="/map.html"; };
  </script>
</body>
</html>
