<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Level complete!</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#58cc02" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --green:#58cc02; --green-d:#46a302; --ink:#16384f; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:linear-gradient(180deg,#d9f6ff,#bfe9c8 60%,#a9e08a);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;}
    .wrap{max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;}
    .leoWin{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(40,120,40,.28));animation:pop .6s ease;}
    @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.16) translateY(-8px)}60%{transform:scale(.96)}100%{transform:scale(1)}}
    .stars{font-size:42px;letter-spacing:6px;margin-top:6px;}
    h1{font-family:"Baloo 2";font-weight:800;font-size:32px;color:var(--green-d);margin-top:10px;}
    p.sub{font-weight:800;color:#3c7a4a;margin-top:6px;font-size:15px;}
    .reward{background:#fff;border-radius:18px;padding:14px 24px;font-family:"Baloo 2";font-weight:800;font-size:24px;color:var(--green-d);margin-top:20px;box-shadow:0 6px 16px rgba(40,120,40,.16);}
    .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:#7a9a6a;text-transform:uppercase;letter-spacing:.05em;}
    .btn{margin-top:26px;border:none;border-radius:18px;padding:16px 48px;font-family:"Baloo 2";font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 6px 0 0 var(--green-d);cursor:pointer;}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--green-d);}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="leoWin" src="/coach/poses/leo-celebrate.png" alt="Leo celebrating" onerror="this.onerror=null;this.src='/coach/leo.png';" />
    <div class="stars">⭐⭐⭐</div>
    <h1 id="title">Level complete!</h1>
    <p class="sub" id="sub">You finished all the games!</p>
    <div class="reward"><span id="bonus">+0 🪙</span><small>level bonus</small></div>
    <button class="btn" id="map">Done →</button>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var s=(window.Sona&&Sona.session)?Sona.session.get():null;
    var level=s?s.level:null, games=s?s.queue.length:0;
    if(level){
      $("title").textContent="Level "+level+" complete!";
      $("sub").textContent="You finished all "+games+" games!";
      var bonus=25+level*5;
      if(window.Sona&&Sona.addCoins)Sona.addCoins(bonus);
      if(window.Sona&&Sona.markLevelDone)Sona.markLevelDone(level);
      $("bonus").textContent="+"+bonus+" 🪙";
    } else {
      // landed here without a session (e.g. refresh) — just celebrate, no double-reward
      $("sub").textContent="Great practicing today!";
      $("bonus").textContent="+0 🪙";
    }
    if(window.Sona){ Sona.confetti&&Sona.confetti(); Sona.sfx&&Sona.sfx.reward&&Sona.sfx.reward(); }
    if(window.Sona&&Sona.sendProgress)Sona.sendProgress();   // pilot: report progress back (consented)
    if(window.Sona&&Sona.session)Sona.session.end();
    $("map").onclick=function(){ location.href="/today.html"; };  // daily loop closes on Today (the one home)
  </script>
</body>
</html>
