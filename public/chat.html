<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Chat with Leo</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#9b7bff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --purp:#9b7bff; --purp-d:#8260f0; --green:#58cc02; --green-d:#46a302; --ink:#2e2350; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:linear-gradient(180deg,#efeaff,#e4dcff 55%,#d6c9ff);color:var(--ink);}
    #app{height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;z-index:6;}
    #close{border:none;background:rgba(255,255,255,.6);color:#8a78c0;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--purp-d);}
    .stat.count{margin-left:auto;}
    #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 20px;gap:8px;}
    #leoBig{width:128px;height:128px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(90,60,160,.25));animation:bob 3.4s ease-in-out infinite;}
    #leoBig.react{animation:lpop .55s ease;}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}} @keyframes lpop{0%{transform:scale(1)}30%{transform:scale(1.13) translateY(-8px)}100%{transform:scale(1)}}
    #bubble{background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 8px 22px rgba(90,60,160,.16);max-width:400px;text-align:center;position:relative;}
    #bubble:after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top:none;border-bottom-color:#fff;}
    #bubble b{font-family:"Baloo 2";font-weight:800;font-size:20px;color:var(--ink);line-height:1.3;}
    #opts{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
    .opt{background:#fff;border:2px solid #e2d9ff;border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:104px;box-shadow:0 5px 14px rgba(90,60,160,.12);}
    .opt .e{font-size:42px;} .opt .w{font-family:"Baloo 2";font-weight:800;font-size:17px;color:var(--purp-d);}
    .opt.chosen{border-color:var(--green);box-shadow:0 0 0 3px rgba(88,204,2,.25);}
    #bottom{padding:8px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:9px;background:linear-gradient(180deg,rgba(239,234,255,0),rgba(239,234,255,.75));z-index:6;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:14.5px;color:var(--purp-d);min-height:18px;text-align:center;}
    #hear{border:2px solid #d8ccff;background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;color:var(--purp-d);cursor:pointer;font-size:14px;}
    .mic{width:88px;height:88px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 30%,#5cc6ff,#1cb0f6 60%,#1597d4);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);} .mic.rec{animation:mpulse 1.4s infinite;} .mic svg{width:38px;height:38px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:38px;} .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes mpulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 16px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}
    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#efeaff,#d6c9ff);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;} #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(90,60,160,.25));animation:lpop .6s ease;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--purp-d);margin-top:10px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--purp-d);margin-top:18px;box-shadow:0 6px 16px rgba(90,60,160,.14);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:#8a78c0;text-transform:uppercase;}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);} #win a{margin-top:14px;color:#8a78c0;font-weight:800;font-size:14px;text-decoration:none;}
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat">Conversation</span>
      <span class="stat count"><span id="count">0</span>/<span id="goal">4</span></span>
    </div>
    <div id="stage">
      <img id="leoBig" src="/coach/leo.png" alt="Leo" />
      <div id="bubble"><b id="qText">Which do you like — a rabbit or a rocket?</b></div>
      <div id="opts"></div>
    </div>
    <div id="bottom">
      <div id="prompt">Tap the mic and tell Leo your pick!</div>
      <button id="hear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;margin-right:5px;"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Hear it again</button>
      <button class="mic" id="micBtn" title="Say it"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div id="win">
    <img class="leoWin" src="/coach/poses/leo-celebrate.png" alt="Leo" onerror="this.onerror=null;this.src='/coach/leo.png';" />
    <h1>Great chatting!</h1>
    <div class="reward"><span id="winCount">0</span><small>answers to Leo</small></div>
    <div class="reward" id="winUnlock" style="background:#fff7df;color:#e08600;"></div>
    <button class="btn" id="again">Chat again</button><a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var profile=(window.Sona?Sona.getProfile():{focusSounds:["R"],voiceId:"",volume:0.8});
    var SOUND=(new URLSearchParams(location.search).get("sound")||(profile.focusSounds&&profile.focusSounds[0])||"R").toUpperCase();
    if(!(window.Sona&&Sona.WORDS&&Sona.WORDS[SOUND])) SOUND="R";
    var CHATS=(window.SonaContent?SonaContent.chats(SOUND):[{q:"A rabbit or a rocket?",options:[{w:"rabbit",e:"🐰"},{w:"rocket",e:"🚀"}]}]);
    var GOAL=Math.min(4,CHATS.length)||4;
    var REPLIES=["Ooh, a {w} — great choice!","Nice! I love a {w} too.","A {w}? Awesome pick!","Yes! {w} it is."];

    var audioCtx=null; function getCtx(){if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();}if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx;}
    function playPCM(b){return new Promise(function(res){try{var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength);for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768;var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start();}catch(e){res();}});}
    var speaking=false; function say(t){return new Promise(function(res){if(!t||speaking)return res();speaking=true;fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){return b?playPCM(new Uint8Array(b)):null;}).catch(function(){}).finally(function(){speaking=false;res();});});}
    function setLeo(s){ var el=$("leoBig"); if(el){ el.src= s==="cheer"?"/coach/poses/leo-celebrate.png": s==="listen"?"/coach/poses/leo-listen.png":"/coach/leo.png"; } }
    function leoReact(){var w=$("leoBig");if(!w)return;w.classList.remove("react");void w.offsetWidth;w.classList.add("react");}
    function norm(s){return (s||"").toLowerCase().replace(/[^a-z]/g,"");}

    var micStream=null;
    function listen(maxMs){ maxMs=maxMs||7000; return new Promise(function(resolve){
      var done=false,raf=null,src=null,sr=null,transcript="",spoke=false,lastV=0,micBtn=$("micBtn"),ico=micBtn.querySelector("svg"),bars=null;
      function finish(){ if(done)return; done=true; try{sr&&sr.stop();}catch(e){} if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} micBtn.classList.remove("rec");micBtn.onclick=null; if(bars)bars.remove(); if(ico)ico.style.display=""; resolve({spoke:spoke,transcript:transcript}); }
      micBtn.classList.add("rec"); micBtn.onclick=function(){ spoke=true; finish(); };
      try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; spoke=true; finish();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
      try{ if(micStream){ var ctx=getCtx();src=ctx.createMediaStreamSource(micStream);var an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
        var fd=new Uint8Array(an.frequencyBinCount),td=new Uint8Array(an.fftSize);bars=document.createElement("div");bars.className="wavebars";for(var b=0;b<7;b++)bars.appendChild(document.createElement("i"));if(ico)ico.style.display="none";micBtn.appendChild(bars);
        var t0=performance.now(),nS=0,nN=0,thr=0,v=0;
        (function tick(){ if(done)return; an.getByteFrequencyData(fd);[].forEach.call(bars.children,function(el,k){el.style.height=(8+fd[2+k*3]/255*30)+"px";});
          an.getByteTimeDomainData(td);var sum=0;for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;}var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<300){nS+=rms;nN++;}else{if(!thr)thr=Math.min(0.1,Math.max(0.014,(nS/Math.max(1,nN))*2.6));if(rms>thr){v++;lastV=now;if(v>=2)spoke=true;}else if(rms<thr*0.7)v=0;if(spoke&&now-lastV>=1000){finish();return;}}
          raf=requestAnimationFrame(tick);})();
      } }catch(e){}
      setTimeout(function(){ if(!done)finish(); }, maxMs);
    }); }

    var ci=0, answered=0, busy=false;
    function renderChat(){ var c=CHATS[ci%CHATS.length]; $("qText").textContent=c.q;
      var ow=$("opts"); ow.innerHTML=""; c.options.forEach(function(o){ var el=document.createElement("div"); el.className="opt"; el.innerHTML='<span class="e">'+(o.e||"⭐")+'</span><span class="w">'+o.w+'</span>'; el.dataset.w=o.w; ow.appendChild(el); }); }
    function chooseChip(word){ var hit=null; Array.prototype.forEach.call($("opts").children,function(el){ if(norm(el.dataset.w)===norm(word)) { el.classList.add("chosen"); hit=el; } }); return hit; }
    async function ask(){ var c=CHATS[ci%CHATS.length]; setLeo("idle"); $("prompt").textContent="Listen to Leo…"; await say(c.q); $("prompt").textContent="Tap the mic and tell Leo your pick!"; $("micBtn").onclick=turn; }
    async function turn(){
      if(busy) return; busy=true; $("micBtn").onclick=null; setLeo("listen");
      var c=CHATS[ci%CHATS.length];
      var res=await listen();
      if(res.spoke){
        // figure out which option they picked (transcript match), else default to first
        var pick=c.options[0].w;
        if(res.transcript){ for(var i=0;i<c.options.length;i++){ if(norm(res.transcript).indexOf(norm(c.options[i].w))>=0){ pick=c.options[i].w; break; } } }
        chooseChip(pick);
        if(window.Sona&&Sona.sfx&&Sona.sfx.correct)Sona.sfx.correct();
        setLeo("cheer"); leoReact();
        var reply=REPLIES[answered%REPLIES.length].replace(/\{w\}/g,pick);
        $("qText").textContent=reply; $("prompt").textContent="Nice one!";
        answered++; ci++; $("count").textContent=answered;
        await say(reply);
        await new Promise(function(r){setTimeout(r,400);});
        busy=false;
        if(answered>=GOAL) return finishGame();
        renderChat(); ask();
      } else {
        setLeo("idle"); $("prompt").textContent="I didn't catch that — tell me your pick!";
        await new Promise(function(r){setTimeout(r,500);}); busy=false; $("micBtn").onclick=turn;
      }
    }
    function finishGame(){
      var earned=18; if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}");GS[SOUND]=GS[SOUND]||{};GS[SOUND].chat={done:true};GS.lastPlayDay=new Date().toISOString().slice(0,10);localStorage.setItem("sona.games.v1",JSON.stringify(GS));}catch(e){}
      $("winCount").textContent=answered; $("winUnlock").textContent="+"+earned+" 🪙"; $("win").classList.add("show");
      if(window.Sona){Sona.confetti&&Sona.confetti();Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete();Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin();}
    }
    function startGame(){ $("win").classList.remove("show"); ci=0; answered=0; busy=false; $("count").textContent="0"; $("goal").textContent=GOAL; renderChat(); ask(); }
    (async function(){ try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){micStream=null;}
      $("hear").onclick=function(){ say(CHATS[ci%CHATS.length].q); }; $("again").onclick=startGame;
      if(window.Sona&&Sona.music)Sona.music.start(); startGame();
    })();
    (function(){ var lad="/ladder.html?sound="+SOUND; var c=$("close"); if(c)c.onclick=function(){location.href=lad;}; Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){a.setAttribute("href",lad);}); })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  </script>
</body>
</html>
