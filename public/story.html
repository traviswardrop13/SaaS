<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Story Time</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#7cc40a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --leaf:#7cc40a; --leaf-d:#66a406; --green:#58cc02; --green-d:#46a302; --ink:#33401a; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:linear-gradient(180deg,#eef8d6,#e2f3c0 55%,#d3eca6);color:var(--ink);}
    #app{height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;z-index:6;}
    #close{border:none;background:rgba(255,255,255,.6);color:#86a542;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--leaf-d);}
    .stat.count{margin-left:auto;}
    #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 20px;perspective:1200px;}
    #book{width:100%;max-width:380px;background:#fff;border-radius:22px;box-shadow:0 16px 40px rgba(90,120,20,.22);padding:24px 22px 26px;text-align:center;transform-origin:left center;}
    #book.flip{animation:flip .6s ease;}
    @keyframes flip{0%{transform:rotateY(0)}45%{transform:rotateY(-22deg) scale(.97)}100%{transform:rotateY(0)}}
    #pageEmoji{font-size:96px;line-height:1;} #pageText{margin-top:14px;font-family:"Baloo 2";font-weight:800;font-size:24px;line-height:1.3;color:var(--ink);}
    #pageText .hl{color:#ef5da8;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;}
    #pageNo{margin-top:12px;font-weight:800;font-size:12px;color:#9ab06a;text-transform:uppercase;letter-spacing:.06em;}
    #leoWrap{position:absolute;left:8px;bottom:6px;width:72px;z-index:4;pointer-events:none;} #leoWrap.react{animation:lpop .55s ease;}
    #leo{width:100%;filter:drop-shadow(0 6px 8px rgba(90,120,20,.25));} @keyframes lpop{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-8px)}100%{transform:scale(1)}}
    #bottom{padding:8px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:9px;background:linear-gradient(180deg,rgba(238,248,214,0),rgba(238,248,214,.75));z-index:6;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:14.5px;color:var(--leaf-d);min-height:18px;text-align:center;}
    #hear{border:2px solid #cfe6a0;background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;color:var(--leaf-d);cursor:pointer;font-size:14px;}
    .mic{width:88px;height:88px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 30%,#5cc6ff,#1cb0f6 60%,#1597d4);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);} .mic.rec{animation:mpulse 1.4s infinite;} .mic svg{width:38px;height:38px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:38px;max-height:38px;overflow:hidden;} .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes mpulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 16px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}
    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#eef8d6,#d3eca6);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;} #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(90,120,20,.25));animation:lpop .6s ease;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--leaf-d);margin-top:10px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--leaf-d);margin-top:18px;box-shadow:0 6px 16px rgba(90,120,20,.15);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:#8aa45c;text-transform:uppercase;}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);} #win a{margin-top:14px;color:#8aa45c;font-weight:800;font-size:14px;text-decoration:none;}
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat">Story</span>
      <span class="stat count"><span id="count">0</span>/<span id="goal">5</span></span>
    </div>
    <div id="stage">
      <div id="leoWrap"><img id="leo" src="/coach/leo.png" alt="Leo" /></div>
      <div id="book">
        <div id="pageEmoji">🐰</div>
        <div id="pageText">Once, Leo saw a <span class="hl">rabbit</span>.</div>
        <div id="pageNo">Page 1</div>
      </div>
    </div>
    <div id="bottom">
      <div id="prompt">Say the underlined word to turn the page!</div>
      <button id="hear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;margin-right:5px;"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Read it to me</button>
      <button class="mic" id="micBtn" title="Say it"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div id="start" style="position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(180deg,#eafff0,#dff6e6);">
    <img src="/coach/poses/leo-celebrate.png" alt="" onerror="this.onerror=null;this.src='/coach/leo.png';" style="width:120px;height:120px;object-fit:contain;" />
    <h1 id="startTitle" style="font-family:'Baloo 2';font-weight:800;font-size:26px;color:#3f8a06;margin-top:14px;">Story time!</h1>
    <p style="font-weight:700;color:#5a7a3c;font-size:15px;margin-top:8px;max-width:300px;">I'll read each page out loud — then you read it back to me! 📖</p>
    <button id="startBtn" style="margin-top:24px;border:none;border-radius:18px;padding:16px 44px;font-family:'Baloo 2';font-weight:800;font-size:20px;text-transform:uppercase;color:#fff;background:#58cc02;box-shadow:0 5px 0 #46a302;cursor:pointer;">📖 Start</button>
  </div>
  <div id="win">
    <img class="leoWin" src="/coach/poses/leo-celebrate.png" alt="Leo" onerror="this.onerror=null;this.src='/coach/leo.png';" />
    <h1>The End!</h1>
    <div class="reward"><span id="winCount">0</span><small>pages read</small></div>
    <div class="reward" id="winUnlock" style="background:#fff7df;color:#e08600;"></div>
    <button class="btn" id="again">Read again</button><a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    if(window.Sona&&Sona.gated&&Sona.gated()){ location.replace("/trial.html"); }
    var Q=new URLSearchParams(location.search);
    var profile=(window.Sona?Sona.getProfile():{focusSounds:["R"],voiceId:"",volume:0.8});
    var SOUND=(Q.get("sound")||(profile.focusSounds&&profile.focusSounds[0])||"R").toUpperCase();
    if(!(window.Sona&&Sona.WORDS&&Sona.WORDS[SOUND])) SOUND="R";
    var POS=(Q.get("position")||"initial").toLowerCase();
    var NAME=(Q.get("name")||profile.childName||"").trim();
    // What the kid loves — drives the AI theming. URL wins, then profile, then a daily-rotating default.
    var INTERESTS=["dragons","space","dinosaurs","mermaids","puppies","race cars","unicorns","pirates","jungle animals","robots"];
    var INTEREST=(Q.get("interest")||(profile.interests&&profile.interests[0])||profile.interest||((window.Sona&&Sona.dayNum)?INTERESTS[Sona.dayNum()%INTERESTS.length]:"dragons")).trim();
    var MINUTES=Number(Q.get("minutes"))||profile.dailyMinutes||5;
    // ---- 10 LEVELS: a journey through Story Land. Each level paints #stage differently
    // and asks the AI for a slightly longer adventure (pages goal + minutes climb gently).
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    var LEVELS=[
      {name:"First Page",   bg:"linear-gradient(180deg,#eef8d6,#e2f3c0 55%,#d3eca6)", accent:"#7cc40a", props:["🌤️","🌼"], pages:4, minutes:3},
      {name:"Sunny Meadow", bg:"linear-gradient(180deg,#fff6c9,#ffe89a 55%,#ffd166)", accent:"#f0a500", props:["🌻","🐝"], pages:5, minutes:4},
      {name:"Cozy Woods",   bg:"linear-gradient(180deg,#e6f6d8,#bfe6a0 55%,#8fc96b)", accent:"#5a9e2e", props:["🌳","🍃"], pages:5, minutes:4},
      {name:"Blue River",   bg:"linear-gradient(180deg,#d6f0ff,#a8dcff 55%,#79c4f2)", accent:"#1cb0f6", props:["🌊","🐟"], pages:6, minutes:5},
      {name:"Flower Hill",  bg:"linear-gradient(180deg,#ffe3f1,#ffc2e0 55%,#ff9ecb)", accent:"#ef5da8", props:["🌷","🦋"], pages:6, minutes:5},
      {name:"Desert Dunes", bg:"linear-gradient(180deg,#fff0d0,#ffd79a 55%,#f0b35e)", accent:"#e08600", props:["🏜️","🌵"], pages:7, minutes:6},
      {name:"Misty Mountain",bg:"linear-gradient(180deg,#eef1fb,#cfd7f2 55%,#a9b6e6)", accent:"#6a73c4", props:["⛰️","☁️"], pages:7, minutes:6},
      {name:"Starry Night", bg:"linear-gradient(180deg,#2b2d6e,#3a3f8f 55%,#5560c4)", accent:"#9aa6ff", props:["🌙","⭐"], pages:8, minutes:7},
      {name:"Crystal Cave", bg:"linear-gradient(180deg,#1f2a4d,#3a4a8a 55%,#7a8fd6)", accent:"#7ee0ff", props:["💎","✨"], pages:8, minutes:7},
      {name:"Castle of Tales",bg:"radial-gradient(circle at 50% 18%,#fff4c2,#ffd86b 35%,#f6a623 70%,#b9450a)", accent:"#ffb300", props:["🏰","👑","🏆"], pages:9, minutes:8}
    ];
    var L=LEVELS[Math.min(9,Math.max(0,DIFF-1))];
    // Ask the AI for the level's longer story; keep MINUTES at least the level minimum.
    MINUTES=Math.max(MINUTES,L.minutes);
    var LEVEL_GOAL=L.pages;
    // Static fallback so a child NEVER sees a broken adventure if generation fails.
    var FALLBACK=(window.SonaContent?SonaContent.storyPages(SOUND):[{text:"Once, Leo saw a ___.",word:"rabbit",e:"🐰"}]);
    var PAGES=FALLBACK, GENERATED=false;
    // GOAL = how many pages this run asks for, never more than we actually have.
    var GOAL=Math.min(LEVEL_GOAL,PAGES.length)||PAGES.length||5;
    // Try to fetch a fresh, AI-written adventure themed to the kid's interest.
    function loadStory(){return fetch("/api/story",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:NAME,interest:INTEREST,sound:SOUND,position:POS,minutes:MINUTES,diff:DIFF,level:DIFF,pages:LEVEL_GOAL})}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.ok&&j.story&&j.story.pages&&j.story.pages.length>=4){PAGES=j.story.pages;GOAL=Math.min(LEVEL_GOAL,PAGES.length);GENERATED=true;}}).catch(function(){});}

    var audioCtx=null; function getCtx(){if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();}if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx;}
    // Mobile browsers block audio until a tap ON THIS PAGE — call once from the Start tap so every page can then auto-read.
    function unlockAudio(){ try{ var c=getCtx(); if(c.state==="suspended")c.resume(); var b=c.createBuffer(1,1,22050); var s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){} }
    function playPCM(b){return new Promise(function(res){try{var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength);for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768;var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start();}catch(e){res();}});}
    var speaking=false; function say(t){return new Promise(function(res){if(!t||speaking)return res();speaking=true;fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){return b?playPCM(new Uint8Array(b)):null;}).catch(function(){}).finally(function(){speaking=false;res();});});}
    var LEO={idle:"/coach/leo.png",cheer:"/coach/poses/leo-celebrate.png",listen:"/coach/poses/leo-listen.png"};
    Object.keys(LEO).forEach(function(k){var im=new Image();im.src=LEO[k];});
    function setLeo(s){var el=$("leo");if(el&&LEO[s])el.src=LEO[s];}
    function leoReact(){var w=$("leoWrap");if(!w)return;w.classList.remove("react");void w.offsetWidth;w.classList.add("react");}

    var micStream=null, useSpeechAce=false;
    function recordTurn(maxMs){ maxMs=maxMs||8000; return new Promise(function(resolve){
      var done=false,chunks=[],rec=null,sr=null,transcript="",spoke=false,lastV=0,raf=null,src=null,bars=null,micBtn=$("micBtn"),ico=micBtn.querySelector("svg");
      function finish(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} micBtn.classList.remove("rec");micBtn.onclick=null; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} if(bars)bars.remove(); if(ico)ico.style.display=""; setTimeout(function(){resolve({transcript:transcript,blob:chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null,spoke:spoke});},120); }
      try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
      try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; finish();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
      micBtn.classList.add("rec"); micBtn.onclick=finish;
      try{ if(micStream){ var ctx=getCtx();src=ctx.createMediaStreamSource(micStream);var an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
        var fd=new Uint8Array(an.frequencyBinCount),td=new Uint8Array(an.fftSize);bars=document.createElement("div");bars.className="wavebars";for(var b=0;b<7;b++)bars.appendChild(document.createElement("i"));if(ico)ico.style.display="none";micBtn.appendChild(bars);
        var t0=performance.now(),nS=0,nN=0,thr=0,v=0;
        (function tick(){ if(done)return; an.getByteFrequencyData(fd);[].forEach.call(bars.children,function(el,k){el.style.height=(8+fd[2+k*3]/255*30)+"px";});
          an.getByteTimeDomainData(td);var sum=0;for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;}var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<300){nS+=rms;nN++;}else{if(!thr)thr=Math.min(0.1,Math.max(0.014,(nS/Math.max(1,nN))*2.6));if(rms>thr){v++;lastV=now;if(v>=2)spoke=true;}else if(rms<thr*0.7)v=0;if(spoke&&now-lastV>=950){finish();return;}}
          raf=requestAnimationFrame(tick);})();
      } }catch(e){}
      setTimeout(function(){ if(!done)finish(); }, maxMs);
    }); }
    async function scoreUtterance(res,text){
      if(!res.spoke && !res.transcript && !res.blob) return {pass:false};
      if(useSpeechAce && res.blob){ try{ var fd=new FormData(); fd.append("audio",new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"})); fd.append("text",text); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode","full"); var r=await fetch("/api/score",{method:"POST",body:fd}); var j=await r.json(); if(j&&j.ok&&j.rating) return {pass:j.rating!=="tryAgain"}; }catch(e){} }
      if(res.transcript) return {pass:true};
      return {pass:!!res.spoke};
    }

    var pi=0, busy=false;
    function renderPage(){ var p=PAGES[pi]; $("pageEmoji").innerHTML=(window.Sona&&Sona.pic)?Sona.pic(p.word,p.e,96):(p.e||"📖");
      $("pageText").innerHTML=p.text.replace("___",'<span class="hl">'+p.word+'</span>'); $("pageNo").textContent="Page "+(pi+1)+" of "+GOAL; }
    async function readPage(){ var p=PAGES[pi]; setLeo("listen"); $("prompt").textContent="Listen…"; await say(p.text.replace("___",p.word)); $("prompt").textContent="Say “"+p.word+"” to turn the page!"; $("micBtn").onclick=turn; }
    async function turn(){
      if(busy) return; busy=true; $("micBtn").onclick=null;
      var p=PAGES[pi];
      var res=await recordTurn(); var sa=await scoreUtterance(res, p.word);
      if(window.Sona&&Sona.logAttempt)Sona.logAttempt({game:"story",sound:SOUND,pass:sa.pass});
      if(sa.pass){
        if(window.Sona&&Sona.sfx&&Sona.sfx.correct)Sona.sfx.correct();
        setLeo("cheer"); leoReact(); $("prompt").textContent="Nice one!";
        if(window.Sona&&Sona.praiseLine)await say(Sona.praiseLine());
        pi++; $("count").textContent=Math.min(pi,GOAL);
        await new Promise(function(r){setTimeout(r,500);});
        if(pi>=GOAL){ busy=false; return finishGame(); }
        var bk=$("book"); bk.classList.remove("flip"); void bk.offsetWidth; bk.classList.add("flip");
        renderPage(); setLeo("idle"); busy=false; readPage();
      } else {
        if(window.Sona&&Sona.sfx&&Sona.sfx.tap)Sona.sfx.tap();
        setLeo("idle"); $("prompt").textContent="Not quite — try again!";
        await new Promise(function(r){setTimeout(r,600);}); busy=false; $("micBtn").onclick=turn; say(p.word);
      }
    }
    function finishGame(){
      var earned=22; if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}");GS[SOUND]=GS[SOUND]||{};GS[SOUND].story={done:true};GS.lastPlayDay=new Date().toISOString().slice(0,10);localStorage.setItem("sona.games.v1",JSON.stringify(GS));}catch(e){}
      $("winCount").textContent=GOAL; $("winUnlock").textContent="+"+earned+" 🪙"; $("win").classList.add("show");
      if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win"));
      if(window.Sona){Sona.confetti&&Sona.confetti();Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete();Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin();}
    }
    function startGame(){ $("win").classList.remove("show"); pi=0; busy=false; $("count").textContent="0"; $("goal").textContent=GOAL; renderPage(); setLeo("idle"); readPage(); }
    (async function(){ try{var r=await fetch("/api/score");var j=await r.json();useSpeechAce=!!(j&&j.hasKey);}catch(e){useSpeechAce=false;}
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){micStream=null;}
      $("hear").onclick=function(){ var p=PAGES[pi]; say(p.text.replace("___",p.word)); }; $("again").onclick=startGame;
      // Show a quick "writing your adventure" beat while the AI story loads, then play.
      $("pageEmoji").innerHTML="✨"; $("pageText").textContent="Writing "+(NAME?NAME+"'s":"your")+" "+INTEREST+" adventure…"; $("pageNo").textContent="";
      await loadStory();
      if(GENERATED){try{document.title="Sona — "+INTEREST+" adventure";}catch(e){}}
      // One tap to begin — unlocks audio on mobile so every page auto-reads (no clicking to hear).
      $("pageEmoji").innerHTML="📖"; $("pageText").textContent=(NAME?NAME+"'s":"Your")+" "+INTEREST+" adventure is ready!"; $("pageNo").textContent="";
      $("startTitle").textContent=(NAME?NAME+"'s":"Your")+" "+INTEREST+" story!";
      $("start").style.display="flex";
      $("startBtn").onclick=function(){ unlockAudio(); if(window.Sona&&Sona.music)Sona.music.start(); $("start").style.display="none"; startGame(); };
    })();
    (function(){ var lad="/map.html"; var c=$("close"); if(c)c.onclick=function(){location.href=lad;}; Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){a.setAttribute("href",lad);}); })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  
    /* LEVEL SCENERY + art drop-in.
       1) paint #stage with the chosen level's gradient + accent + faint ambient props
       2) per-level art override: /coach/story/lvlN.png swaps in when present (zero code)
       3) fallback to the original /coach/story/bg.png if no per-level art exists */
    (function(){
      var s=document.getElementById("stage"); if(!s)return;
      if(L.bg) s.style.background=L.bg;
      if(L.accent){ try{ document.documentElement.style.setProperty("--leaf",L.accent); document.documentElement.style.setProperty("--leaf-d",L.accent); }catch(e){} }
      // faint ambient props drifting behind the book
      try{
        if(L.props&&L.props.length){
          var amb=document.createElement("div");
          amb.style.cssText="position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.22;";
          for(var i=0;i<L.props.length;i++){
            var e=document.createElement("span");
            e.textContent=L.props[i];
            e.style.cssText="position:absolute;font-size:54px;"+
              (i===0?"top:10%;left:8%;":i===1?"bottom:14%;right:10%;":"top:42%;right:24%;");
            amb.appendChild(e);
          }
          s.insertBefore(amb,s.firstChild);
        }
      }catch(e){}
      // per-level art (preferred), then generic bg.png fallback
      function drop(src){ var im=new Image(); im.onload=function(){ s.style.backgroundImage="url("+src+")"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center"; }; im.src=src; }
      var lv=new Image();
      lv.onload=function(){ s.style.backgroundImage="url("+lv.src+")"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center"; };
      lv.onerror=function(){ drop("/coach/story/bg.png"); };
      lv.src="/coach/story/lvl"+DIFF+".png";
    })();
</script>
</body>
</html>
