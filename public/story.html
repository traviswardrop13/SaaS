<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Story Time</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#fff6e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    /* canon tokens (D3): the legacy green/leaf era :root is gone */
    :root{ --cream:#fff6e9; --ink:#4a2c14; --muted:#8a6f52; --label:#a17c4a;
      --green:#58cc02; --green-d:#46a302; --orange:#ff8a3d; --orange-d:#ef6f23; --gold:#ffd21c; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,sans-serif;}
    html,body{height:100%;overflow:hidden;} html{background:var(--cream);}
    body{background:var(--cream);color:var(--ink);}
    #app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
    #top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 4px;z-index:6;}
    #close{border:none;background:#fff;color:#b9a98c;width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(120,80,20,.14);flex:0 0 auto;}
    #ctxLine{flex:1;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .stat{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 13px;font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--ink);box-shadow:0 4px 0 rgba(120,80,20,.14);flex:0 0 auto;}
    #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 20px;perspective:1200px;position:relative;}
    /* the book spread is the shared D2 paper component */
    .paperWrap{position:relative;width:100%;max-width:400px;z-index:1;}
    .pstack{position:absolute;inset:0;border-radius:18px;background:#f9efdc;transform:translate(5px,5px);}
    .pstack.two{background:#f0e2c8;transform:translate(9px,9px);}
    #book{position:relative;display:flex;flex-direction:column;justify-content:center;background:#fffdf7;border-radius:18px;box-shadow:0 14px 30px rgba(140,90,20,.16);padding:22px 18px 22px 30px;text-align:center;transform-origin:left center;}
    #book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;border-radius:18px 0 0 18px;background:linear-gradient(90deg,rgba(150,95,30,.13),rgba(150,95,30,0));}
    .ribbon{position:absolute;top:-2px;right:16px;width:31px;height:62px;background:#ff8a3d;
      clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);display:flex;flex-direction:column;align-items:center;
      font-family:"Baloo 2";font-weight:800;font-size:11px;color:#fff;padding-top:8px;line-height:1.25;filter:drop-shadow(0 2px 2px rgba(120,60,10,.2));z-index:2;}
    @media (min-height:850px){ #pageEmoji{font-size:116px;} #pageText{font-size:26px;} }
    #book.flip{animation:flip .6s ease;}
    @keyframes flip{0%{transform:rotateY(0)}45%{transform:rotateY(-22deg) scale(.97)}100%{transform:rotateY(0)}}
    #artWrap{width:min(46vw,180px);height:min(46vw,180px);margin:0 auto 8px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
    #pageEmoji{font-size:92px;line-height:1;}
    #pageText{margin-top:8px;font-family:"Baloo 2";font-weight:800;font-size:23px;line-height:1.35;color:#5b2d05;}
    #pageText .hl{background:#ffe7d3;color:#ef6f23;border-radius:10px;padding:1px 10px 3px;display:inline-block;}
    /* Echo cluster below the book — the charge grammar (one voice) */
    #echoCluster{display:flex;flex-direction:column;align-items:center;padding:2px 16px 0;z-index:6;}
    #bubble{background:#fff;border-radius:20px;border-bottom-left-radius:5px;padding:10px 18px;box-shadow:0 6px 16px rgba(120,60,10,.16);text-align:center;max-width:86vw;}
    #bMain{font-family:"Baloo 2";font-weight:800;font-size:14px;color:#4a2c14;line-height:1.15;}
    #bTarget{font-family:"Baloo 2";font-weight:800;font-size:clamp(26px,8vw,34px);color:#ef6f23;display:inline-block;padding-left:6px;}
    #subLine{font-weight:800;font-size:13px;color:#8a6f52;margin-top:1px;}
    #echoWrap{margin-top:6px;} #echoWrap.react{animation:lpop .55s ease;}
    #echo{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(120,60,10,.2));}
    @keyframes lpop{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-8px)}100%{transform:scale(1)}}
    #bottom{padding:6px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:9px;z-index:6;}
    /* Read it to me: white pill with the warm speaker */
    #hear{display:flex;align-items:center;gap:6px;border:none;background:#fff;border-radius:99px;padding:10px 16px;font-family:"Baloo 2";font-weight:800;color:#ef6f23;cursor:pointer;font-size:14px;box-shadow:0 4px 0 rgba(120,80,20,.16);}
    #hear:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,80,20,.16);}
    /* mic: app orange with the pulse ring (the blue radial is gone — blue is the parent color) */
    .mic{width:70px;height:70px;border-radius:50%;border:none;background:linear-gradient(180deg,#ffa05a,#ff8a3d);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 0 var(--orange-d);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--orange-d);} .mic.rec{animation:mpulse 1.4s infinite;} .mic svg{width:32px;height:32px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:32px;max-height:32px;overflow:hidden;} .wavebars i{width:5px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes mpulse{0%{box-shadow:0 0 0 0 rgba(255,138,61,.45),0 5px 0 0 var(--orange-d)}70%{box-shadow:0 0 0 16px rgba(255,138,61,0),0 5px 0 0 var(--orange-d)}100%{box-shadow:0 0 0 0 rgba(255,138,61,0),0 5px 0 0 var(--orange-d)}}
    #win{position:fixed;inset:0;z-index:50;background:var(--cream);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;} #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(120,80,20,.22));animation:lpop .6s ease;}
    #winChip{font-family:"Baloo 2";font-weight:800;font-size:12px;letter-spacing:.08em;background:rgba(255,255,255,.8);border-radius:99px;padding:6px 15px;color:#8a5a1a;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--ink);margin-top:10px;}
    #win .rewards{display:flex;gap:12px;margin-top:18px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--ink);box-shadow:0 6px 16px rgba(120,80,20,.14);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#6fd60e,#58cc02);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);} #win a{margin-top:14px;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none;}
    @media (max-height:760px){ #pageEmoji{font-size:74px;} #pageText{font-size:20px;} #echo{width:54px;height:54px;} #artWrap{width:min(38vw,140px);height:min(38vw,140px);} }
    @media (prefers-reduced-motion:reduce){ #book.flip,#echoWrap.react,#win .leoWin,.mic.rec{animation:none;} }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/today.html'">✕</button>
      <div id="ctxLine">Story Time</div>
      <span class="stat"><svg viewBox="0 0 64 64" style="width:17px;height:17px;vertical-align:-3px"><path d="M8 16c8-5 16-5 24 0v34c-8-5-16-5-24 0Z" fill="#ffb066"/><path d="M56 16c-8-5-16-5-24 0v34c8-5 16-5 24 0Z" fill="#ef8b3d"/><line x1="32" y1="16" x2="32" y2="50" stroke="#b95e14" stroke-width="2"/></svg> <span id="count">0</span>/<span id="goal">5</span></span>
    </div>
    <div id="stage">
      <div class="paperWrap">
        <div class="pstack two" id="stack2"></div>
        <div class="pstack" id="stack1"></div>
        <div id="book">
          <span class="ribbon" id="ribbon"></span>
          <div id="artWrap"><div id="pageEmoji"></div></div>
          <div id="pageText">Once, Echo saw a <span class="hl">rabbit</span>.</div>
        </div>
      </div>
    </div>
    <div id="echoCluster">
      <div id="bubble">
        <div id="bMain"><span id="sayLbl">Your turn — say</span><b id="bTarget"></b></div>
        <div id="subLine">Say the word to turn the page!</div>
      </div>
      <div id="echoWrap"><img id="echo" src="/coach/echo/echo-idle.svg" alt="Echo" /></div>
    </div>
    <div id="bottom">
      <button id="hear"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#ef6f23"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#ef6f23" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Read it to me</button>
      <button class="mic" id="micBtn" title="Say it"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div id="start" style="position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(180deg,#eafff0,#dff6e6 55%,#cdea9e);">
    <div style="background:#fff;border-radius:26px;padding:30px 26px;max-width:340px;width:100%;box-shadow:10px 12px 0 rgba(124,196,10,.18),0 16px 40px rgba(90,120,20,.22);">
      <img src="/coach/echo/echo-celebrate.svg" alt="" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" style="width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(90,120,20,.22));" />
      <h1 id="startTitle" style="font-family:'Baloo 2';font-weight:800;font-size:28px;color:#3f8a06;margin-top:12px;line-height:1.15;">Story time!</h1>
      <p style="font-weight:700;color:#5a7a3c;font-size:15.5px;margin-top:8px;">I'll read each page out loud — then you read it back to me!</p>
      <button id="startBtn" style="margin-top:22px;width:100%;border:none;border-radius:18px;padding:17px;font-family:'Baloo 2';font-weight:800;font-size:20px;color:#fff;background:linear-gradient(180deg,#6fd60e,#58cc02);box-shadow:0 5px 0 #46a302;cursor:pointer;">Start the story!</button>
    </div>
  </div>
  <div id="win">
    <div id="winChip"></div>
    <img class="leoWin" src="/coach/echo/echo-celebrate.svg" alt="Echo" onerror="this.onerror=null;this.src='/coach/echo/echo-idle.svg';" />
    <h1>The End!</h1>
    <div class="rewards">
      <div class="reward"><span id="winCount">0</span><small>pages read</small></div>
      <div class="reward" id="winUnlock"></div>
    </div>
    <button class="btn" id="again">Read again</button><a href="/today.html" id="winDone">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    if(window.Sona&&Sona.gated&&Sona.gated()){ location.replace("/trial.html"); }
    var Q=new URLSearchParams(location.search);
    var profile=(window.Sona?Sona.getProfile():{focusSounds:["R"],voiceId:"",volume:0.8});
    var SOUND=(Q.get("sound")||(profile.focusSounds&&profile.focusSounds[0])||"R").toUpperCase();
    if(!(window.Sona&&Sona.WORDS&&Sona.WORDS[SOUND])) SOUND="R";
    var POS=(Q.get("position")||"initial").toLowerCase();
    var NAME=(Q.get("name")||profile.childName||"").trim();
    // What the kid loves — drives the AI theming. URL wins, then profile, then a daily-rotating default.
    var INTERESTS=["dragons","space","dinosaurs","mermaids","puppies","race cars","unicorns","pirates","jungle animals","robots"];
    var INTEREST=(Q.get("interest")||(profile.interests&&profile.interests[0])||profile.interest||((window.Sona&&Sona.dayNum)?INTERESTS[Sona.dayNum()%INTERESTS.length]:"dragons")).trim();
    var MINUTES=Number(Q.get("minutes"))||profile.dailyMinutes||5;
    // ---- 10 LEVELS: a journey through Story Land. Each level paints #stage differently
    // and asks the AI for a slightly longer adventure (pages goal + minutes climb gently).
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    var LEVELS=[
      {name:"First Page",   bg:"linear-gradient(180deg,#eef8d6,#e2f3c0 55%,#d3eca6)", accent:"#7cc40a", props:["🌤️","🌼"], pages:4, minutes:3},
      {name:"Sunny Meadow", bg:"linear-gradient(180deg,#fff6c9,#ffe89a 55%,#ffd166)", accent:"#f0a500", props:["🌻","🐝"], pages:5, minutes:4},
      {name:"Cozy Woods",   bg:"linear-gradient(180deg,#e6f6d8,#bfe6a0 55%,#8fc96b)", accent:"#5a9e2e", props:["🌳","🍃"], pages:5, minutes:4},
      {name:"Blue River",   bg:"linear-gradient(180deg,#d6f0ff,#a8dcff 55%,#79c4f2)", accent:"#1cb0f6", props:["🌊","🐟"], pages:6, minutes:5},
      {name:"Flower Hill",  bg:"linear-gradient(180deg,#ffe3f1,#ffc2e0 55%,#ff9ecb)", accent:"#ef5da8", props:["🌷","🦋"], pages:6, minutes:5},
      {name:"Desert Dunes", bg:"linear-gradient(180deg,#fff0d0,#ffd79a 55%,#f0b35e)", accent:"#e08600", props:["🏜️","🌵"], pages:7, minutes:6},
      {name:"Misty Mountain",bg:"linear-gradient(180deg,#eef1fb,#cfd7f2 55%,#a9b6e6)", accent:"#6a73c4", props:["⛰️","☁️"], pages:7, minutes:6},
      {name:"Starry Night", bg:"linear-gradient(180deg,#2b2d6e,#3a3f8f 55%,#5560c4)", accent:"#9aa6ff", props:["🌙","⭐"], pages:8, minutes:7},
      {name:"Crystal Cave", bg:"linear-gradient(180deg,#1f2a4d,#3a4a8a 55%,#7a8fd6)", accent:"#7ee0ff", props:["💎","✨"], pages:8, minutes:7},
      {name:"Castle of Tales",bg:"radial-gradient(circle at 50% 18%,#fff4c2,#ffd86b 35%,#f6a623 70%,#b9450a)", accent:"#ffb300", props:["🏰","👑","🏆"], pages:9, minutes:8}
    ];
    var L=LEVELS[Math.min(9,Math.max(0,DIFF-1))];
    // Ask the AI for the level's longer story; keep MINUTES at least the level minimum.
    MINUTES=Math.max(MINUTES,L.minutes);
    var LEVEL_GOAL=L.pages;
    // Static fallback so a child NEVER sees a broken adventure if generation fails.
    var FALLBACK=(window.SonaContent?SonaContent.storyPages(SOUND):[{text:"Once, Echo saw a ___.",word:"rabbit",e:"🐰"}]);
    var PAGES=FALLBACK, GENERATED=false;
    // GOAL = how many pages this run asks for, never more than we actually have.
    var GOAL=Math.min(LEVEL_GOAL,PAGES.length)||PAGES.length||5;
    // Try to fetch a fresh, AI-written adventure themed to the kid's interest.
    function loadStory(){return fetch("/api/story",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:NAME,interest:INTEREST,sound:SOUND,position:POS,minutes:MINUTES,diff:DIFF,level:DIFF,pages:LEVEL_GOAL})}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.ok&&j.story&&j.story.pages&&j.story.pages.length>=4){PAGES=j.story.pages;GOAL=Math.min(LEVEL_GOAL,PAGES.length);GENERATED=true;}}).catch(function(){});}

    var audioCtx=null; function getCtx(){if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();}if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx;}
    // Mobile browsers block audio until a tap ON THIS PAGE — call once from the Start tap so every page can then auto-read.
    function unlockAudio(){ try{ var c=getCtx(); if(c.state==="suspended")c.resume(); var b=c.createBuffer(1,1,22050); var s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){} }
    function playPCM(b){return new Promise(function(res){try{var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength);for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768;var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start();}catch(e){res();}});}
    // Guaranteed-audio fallback: if cloud TTS fails (quota, network), the
    // browser's built-in voice reads the line instead — lower quality, but a
    // child is NEVER left with silent instructions. Runs under the speaker
    // guard so it can't charge reps.
    function speakFallback(t,slow){ return new Promise(function(res){ try{
      if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return res();
      var u=new SpeechSynthesisUtterance(String(t).replace(/\[[a-z ]{2,24}\]\s*/gi,""));
      u.rate=slow?0.62:0.95; u.pitch=1.05; u.volume=(profile.volume!=null?profile.volume:0.8);
      var done=false; function fin(){ if(done)return; done=true; try{ if(typeof ttsEnd==="function")ttsEnd(); }catch(e){} res(); }
      u.onend=fin; u.onerror=fin; setTimeout(fin,(window.speechSynthesis.getVoices&&window.speechSynthesis.getVoices().length)?12000:1200);
      try{ if(typeof ttsBegin==="function")ttsBegin(); }catch(e){}
      window.speechSynthesis.speak(u);
    }catch(e){ res(); } }); }
    var speaking=false;
    function _say1(t){return new Promise(function(res){if(!t)return res();speaking=true;fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){if(!b)return speakFallback(t);return playPCM(new Uint8Array(b));}).catch(function(){return speakFallback(t);}).finally(function(){speaking=false;res();});});}
    // QUEUE, never drop. This used to be `if(speaking) return res()` — so any
    // line that arrived while Echo was still talking silently vanished, and the
    // child got a page read to them but never heard the question that followed
    // (Rachel caught this: "then it doesn't read the next question"). A line
    // now WAITS its turn. Depth is capped so a kid mashing "read it to me"
    // can't stack up a backlog.
    var _sayQ=Promise.resolve(), _sayN=0;
    function say(t){
      if(!t||profile.voiceOn===false) return Promise.resolve();
      if(_sayN>=2) return Promise.resolve();   // already one playing + one waiting
      _sayN++;
      var run=function(){ return _say1(t); };
      _sayQ=_sayQ.then(run,run).then(function(){ _sayN=Math.max(0,_sayN-1); },function(){ _sayN=Math.max(0,_sayN-1); });
      return _sayQ;
    }
    var LEO={idle:"/coach/echo/echo-idle.svg",cheer:"/coach/echo/echo-celebrate.svg",listen:"/coach/echo/echo-listening.svg"};
    Object.keys(LEO).forEach(function(k){var im=new Image();im.src=LEO[k];});
    function setLeo(s){var el=$("echo");if(el&&LEO[s])el.src=LEO[s];}
    function leoReact(){var w=$("echoWrap");if(!w)return;w.classList.remove("react");void w.offsetWidth;w.classList.add("react");}
    // the bubble is the only voice on screen (charge grammar): line 1 carries
    // the target word huge; the sub-line carries state + the pages-left count
    function bubbleSay(word,sub){ $("sayLbl").textContent="Your turn — say"; $("bTarget").textContent=word||""; $("subLine").textContent=sub||""; }
    function bubbleNote(sub){ $("bTarget").textContent=""; $("sayLbl").textContent=""; $("subLine").textContent=sub||""; }

    var micStream=null;
    function recordTurn(maxMs){ if(window.Sona&&Sona.hasNativeAudio&&Sona.hasNativeAudio())return Sona.captureClip({maxMs:(maxMs||6000)}); maxMs=maxMs||8000; return new Promise(function(resolve){
      var done=false,chunks=[],rec=null,sr=null,transcript="",spoke=false,lastV=0,raf=null,src=null,bars=null,micBtn=$("micBtn"),ico=micBtn.querySelector("svg");
      function finish(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} micBtn.classList.remove("rec");micBtn.onclick=null; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} if(bars)bars.remove(); if(ico)ico.style.display=""; setTimeout(function(){resolve({transcript:transcript,blob:chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null,spoke:spoke});},120); }
      try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
      try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; finish();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
      micBtn.classList.add("rec"); micBtn.onclick=finish;
      try{ if(micStream){ var ctx=getCtx();src=ctx.createMediaStreamSource(micStream);var an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
        var fd=new Uint8Array(an.frequencyBinCount),td=new Uint8Array(an.fftSize);bars=document.createElement("div");bars.className="wavebars";for(var b=0;b<7;b++)bars.appendChild(document.createElement("i"));if(ico)ico.style.display="none";micBtn.appendChild(bars);
        var t0=performance.now(),nS=0,nN=0,thr=0,v=0;
        (function tick(){ if(done)return; an.getByteFrequencyData(fd);[].forEach.call(bars.children,function(el,k){el.style.height=(8+fd[2+k*3]/255*30)+"px";});
          an.getByteTimeDomainData(td);var sum=0;for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;}var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<300){nS+=rms;nN++;}else{if(!thr)thr=Math.min(0.1,Math.max(0.014,(nS/Math.max(1,nN))*2.6));if(rms>thr){v++;lastV=now;if(v>=2)spoke=true;}else if(rms<thr*0.7)v=0;if(spoke&&now-lastV>=950){finish();return;}}
          raf=requestAnimationFrame(tick);})();
      } }catch(e){}
      setTimeout(function(){ if(!done)finish(); }, maxMs);
    }); }
    async function scoreUtterance(res,text){
      if(!res.spoke && !res.transcript && !res.blob) return {pass:false};
      // Cloud scoring is gone — nothing is uploaded. The turn is judged from
      // what the browser could hear locally (transcript when available, voicing
      // otherwise), which is a narrower claim honestly made.
      if(res.transcript) return {pass:true};
      return {pass:!!res.spoke};
    }

    var pi=0, busy=false;
    function fixText(t){ return String(t||"").replace(/^([B-HJ-Z])\s/,"I "); }
    function pagesLeft(){ var k=GOAL-pi; return k<=1?"Last page — then The End!":k+" more pages to The End!"; }
    function renderPage(){ var p=PAGES[pi]; p.text=fixText(p.text); $("pageEmoji").innerHTML=(window.Sona&&Sona.pic)?Sona.pic(p.word,p.e,96):(p.e||"");
      $("pageText").innerHTML=p.text.replace("___",'<span class="hl">'+p.word+'</span>');
      // bookmark ribbon + the page-edge stack (thins as pages turn — D2 paper)
      try{ var rb=$("ribbon"); rb.style.display="flex"; rb.style.background=L.accent; rb.innerHTML=(pi+1)+'<span style="font-size:8.5px;opacity:.85">of '+GOAL+'</span>'; }catch(e){}
      try{ var left=GOAL-1-pi; $("stack1").style.display=left>=1?"block":"none"; $("stack2").style.display=left>=2?"block":"none"; }catch(e){}
      // per-page art tint from the level accent
      try{ $("artWrap").style.background="radial-gradient(circle,"+L.accent+"22,"+L.accent+"08 75%)"; }catch(e){}
    }
    async function readPage(){ var p=PAGES[pi]; setLeo("listen"); bubbleNote("Listen…");
      await say(fixText(p.text).replace("___",p.word));
      bubbleSay(p.word,pagesLeft());
      await say("Now you! Say... "+p.word+"!");
      turn(); // mic turns on by itself — the button stays as a backup tap
    }
    async function turn(){
      if(busy) return; busy=true; $("micBtn").onclick=null;
      var p=PAGES[pi];
      var res=await recordTurn(); var sa=await scoreUtterance(res, p.word);
      if(window.Sona&&Sona.logAttempt)Sona.logAttempt({game:"story",sound:SOUND,pass:sa.pass});
      if(sa.pass){
        if(window.Sona&&Sona.sfx&&Sona.sfx.correct)Sona.sfx.correct();
        setLeo("cheer"); leoReact(); $("subLine").textContent="Nice one!";
        if(window.Sona&&Sona.praiseLine)await say(Sona.praiseLine());
        pi++; $("count").textContent=Math.min(pi,GOAL);
        await new Promise(function(r){setTimeout(r,500);});
        if(pi>=GOAL){ busy=false; return finishGame(); }
        var bk=$("book"); bk.classList.remove("flip"); void bk.offsetWidth; bk.classList.add("flip");
        renderPage(); setLeo("idle"); busy=false; readPage();
      } else {
        if(window.Sona&&Sona.sfx&&Sona.sfx.tap)Sona.sfx.tap();
        setLeo("idle"); $("subLine").textContent="Not quite — try again!";
        await new Promise(function(r){setTimeout(r,600);}); busy=false; say(p.word).then(function(){ turn(); });
      }
    }
    function finishGame(){
      var earned=22; if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{var GK=(window.Sona&&Sona.kkey)?Sona.kkey("sona.games.v1"):"sona.games.v1";var GS=JSON.parse(localStorage.getItem(GK)||"{}");GS[SOUND]=GS[SOUND]||{};GS[SOUND].story={done:true};GS.lastPlayDay=(window.Sona&&Sona.localDay?Sona.localDay():new Date().toISOString().slice(0,10));localStorage.setItem(GK,JSON.stringify(GS));}catch(e){}
      $("winCount").textContent=GOAL;
      // drawn coin, never 🪙 (D3); the chip names the level like a postcard
      $("winUnlock").innerHTML='<svg viewBox="0 0 64 64" style="width:22px;height:22px;vertical-align:-4px"><circle cx="32" cy="32" r="20" fill="#ffd21c"/><circle cx="32" cy="32" r="14.5" fill="none" stroke="#f0a800" stroke-width="3"/><path d="M32 24l2.6 5.9 6.4.7-4.8 4.3 1.5 6.3L32 37.9l-5.7 3.3 1.5-6.3-4.8-4.3 6.4-.7Z" fill="#f0a800"/></svg> +'+earned+'<small>coins</small>';
      try{ $("winChip").textContent=String(L.name).toUpperCase()+" · LEVEL "+DIFF; $("win").style.background="linear-gradient(180deg,"+L.accent+"2e, #fff6e9 55%, #ffedd8)"; $("winDone").style.color=L.accent; }catch(e){}
      $("win").classList.add("show");
      if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win"));
      if(window.Sona){Sona.confetti&&Sona.confetti();Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete();Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin();}
    }
    function startGame(){ $("win").classList.remove("show"); pi=0; busy=false; $("count").textContent="0"; $("goal").textContent=GOAL; renderPage(); setLeo("idle"); readPage(); }
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){micStream=null;}
      $("hear").onclick=function(){ var p=PAGES[pi]; say(p.text.replace("___",p.word)); }; $("again").onclick=startGame;
      // Show a quick "writing your adventure" beat while the AI story loads, then play.
      $("pageEmoji").innerHTML='<svg viewBox="0 0 64 64" style="width:74px;height:74px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg>'; $("pageText").textContent="Writing "+(NAME?NAME+"'s":"your")+" "+INTEREST+" adventure…";
      await loadStory();
      if(GENERATED){try{document.title="Sona — "+INTEREST+" adventure";}catch(e){}}
      // One tap to begin — unlocks audio on mobile so every page auto-reads (no clicking to hear).
      $("pageEmoji").innerHTML='<svg viewBox="0 0 64 64" style="width:74px;height:74px"><path d="M8 16c8-5 16-5 24 0v34c-8-5-16-5-24 0Z" fill="#ffb066"/><path d="M56 16c-8-5-16-5-24 0v34c8-5 16-5 24 0Z" fill="#ef8b3d"/><line x1="32" y1="16" x2="32" y2="50" stroke="#b95e14" stroke-width="2"/><circle cx="16" cy="24" r="3" fill="#fff" opacity=".8"/></svg>'; $("pageText").textContent=(NAME?NAME+"'s":"Your")+" "+INTEREST+" adventure is ready!";
      $("startTitle").textContent=(NAME?NAME+"'s":"Your")+" "+INTEREST+" story!";
      $("start").style.display="flex";
      $("startBtn").onclick=function(){ unlockAudio(); if(window.Sona&&Sona.music)Sona.music.start(); $("start").style.display="none"; startGame(); };
    })();
    // The exits point at the real home directly. This used to rewrite a stale
    // "/play.html" href to "/map.html" at runtime — two redirects to reach
    // today.html, and a dead end for any child whose JS had not run yet.
    (function(){ var c=$("close"); if(c)c.onclick=function(){location.href="/today.html";}; })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  
    /* LEVEL SCENERY + art drop-in.
       1) paint #stage with the chosen level's gradient + accent + faint ambient props
       2) per-level art override: /coach/story/lvlN.png swaps in when present (zero code)
       3) fallback to the original /coach/story/bg.png if no per-level art exists */
    (function(){
      var s=document.getElementById("stage"); if(!s)return;
      if(L.bg) s.style.background=L.bg;
      try{ var mcol=(L.bg.match(/#[0-9a-fA-F]{6}(?!.*#)/)||[])[0]; if(mcol){ document.body.style.background=mcol; document.documentElement.style.background=mcol; } }catch(e){}
      // header context: {level name} · {sound} sound, in the level ink;
      // theme-color = the level sky's TOP color (D3)
      try{ var top=(L.bg.match(/#[0-9a-fA-F]{6}/)||[])[0];
        if(top){ var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",top); }
        var cx=$("ctxLine"); if(cx){ cx.textContent=L.name+" · "+SOUND+" sound"; cx.style.color=L.accent; }
      }catch(e){}
      // ambient scenery: soft SHAPES, never emoji props (D3) — a 3-circle
      // cloud, two horizon hills in the level accent, and a soft ground band
      try{
        var amb=document.createElement("div");
        amb.style.cssText="position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;";
        amb.innerHTML=
          '<svg viewBox="0 0 120 60" style="position:absolute;top:6%;left:4%;width:34%;opacity:.5"><ellipse cx="40" cy="42" rx="30" ry="15" fill="#fff"/><circle cx="56" cy="28" r="17" fill="#fff"/><circle cx="80" cy="38" r="19" fill="#fff"/></svg>'
          +'<svg viewBox="0 0 120 60" style="position:absolute;top:14%;right:2%;width:26%;opacity:.35"><ellipse cx="40" cy="42" rx="30" ry="15" fill="#fff"/><circle cx="56" cy="28" r="17" fill="#fff"/><circle cx="80" cy="38" r="19" fill="#fff"/></svg>'
          +'<i style="position:absolute;bottom:-6%;left:-14%;width:70%;height:22%;border-radius:50%;background:'+L.accent+'2b;display:block"></i>'
          +'<i style="position:absolute;bottom:-8%;right:-16%;width:80%;height:24%;border-radius:50%;background:'+L.accent+'1f;display:block"></i>'
          +'<i style="position:absolute;bottom:6%;left:0;right:0;height:10%;background:linear-gradient(180deg,'+L.accent+'14,'+L.accent+'00);display:block"></i>';
        s.insertBefore(amb,s.firstChild);
      }catch(e){}
      // per-level art (preferred), then generic bg.png fallback
      function drop(src){ var im=new Image(); im.onload=function(){ s.style.backgroundImage="url("+src+")"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center"; }; im.src=src; }
      var lv=new Image();
      lv.onload=function(){ s.style.backgroundImage="url("+lv.src+")"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center"; };
      lv.onerror=function(){ drop("/coach/story/bg.png"); };
      lv.src="/coach/story/lvl"+DIFF+".png";
    })();
</script>
