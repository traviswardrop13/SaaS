<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Flappy Glide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#2a5a8f" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#2a5a8f,#4f8fc7 45%,#ffb98a 85%,#ffd7a8);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;z-index:5;}
    #close{border:none;background:rgba(255,255,255,.16);color:#fff;font-size:20px;font-weight:800;cursor:pointer;line-height:1;border-radius:12px;padding:8px 12px;}
    #score{font-family:"Baloo 2";font-weight:800;font-size:22px;color:#fff;flex:1;}
    #timer{font-family:"Baloo 2";font-weight:800;font-size:18px;color:#ffd21c;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.3);}
    #boostChip{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:5;background:rgba(255,255,255,.16);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:13px;padding:7px 15px;border-radius:99px;pointer-events:none;white-space:nowrap;transition:background .2s,color .2s;}
    #boostChip.hot{background:#ffd21c;color:#5c4500;animation:chipPop .4s ease;}
    @keyframes chipPop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
    #tapHint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-family:"Baloo 2";font-weight:800;font-size:15px;color:#ffe9cf;z-index:4;pointer-events:none;}
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(20,42,68,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:10px;}
    .ovl.show{display:flex;}
    .ovl .big{font-size:70px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:28px;color:#fff;}
    .ovl p{color:#cfe3f5;font-weight:700;font-size:15px;max-width:300px;}
    .btn{border:none;border-radius:16px;padding:15px 32px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;transition:transform .05s;margin-top:6px;}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    .btn.blue{background:var(--blue);box-shadow:0 5px 0 0 var(--blue-d);}
    .btn.ghost{background:none;box-shadow:none;color:#a8c4dc;text-transform:none;font-size:14px;}
  </style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div id="score">🎈 0</div>
      <div id="timer">45</div>
    </div>
    <div id="flash"></div>
    <div id="boostChip"></div>
    <div id="tapHint">Tap to flap! Glide through the gaps!</div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="big">⚡</div>
    <h2>Charge up first!</h2>
    <p>Say your sound 5 times to fill your balloon.</p>
    <button class="btn blue" id="goCharge">⚡ Charge up</button>
    <button class="btn ghost" id="needHome">Back home</button>
  </div>

  <div class="ovl" id="revOvl">
    <div class="big">😮</div>
    <h2 id="revTitle">Say it!</h2>
    <p id="revHearts" style="font-size:26px;">❤️❤️❤️</p>
    <p>Say your sound for a new life!</p>
    <button class="btn ghost" id="revDone">I'm done</button>
  </div>

  <div class="ovl" id="endOvl">
    <div class="big">🎈</div>
    <h2 id="endTitle">Great gliding!</h2>
    <p id="endSub"></p>
    <button class="btn blue" id="endCharge">⚡ Glide again</button>
    <button class="btn" id="endAgain" style="display:none;"></button>
    <button class="btn ghost" id="endHome">Done for now</button>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }

    // ---- charge gate + daily plumbing ----
    var SELF="arcade-glide.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ tok=sessionStorage.getItem("sona.play.token")==="1"; sessionStorage.removeItem("sona.play.token"); }catch(e){}
    if(!tok){ $("needOvl").classList.add("show"); }

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    // ---- game state ----
    var boost={on:false,cool:false}; // declared with game state — draw() reads it from frame 1
    var playing=true, score=0;
    var BESTK="sona.best.glide", BEST=0; try{ BEST=parseInt(localStorage.getItem(BESTK)||"0",10)||0; }catch(e){}
    // ── lives: a crash → say your sound for a new life (3 per run) ──
    var REV=3, reviveWait=false, MIC=false;
    function hearts(){ $("timer").textContent="❤️ "+REV; }
    function crash(){
      if(!playing) return;
      playing=false; gates=[]; sfx("tap");
      if(REV>0 && MIC){
        $("revTitle").textContent="Say \u201C"+SAYTXT+"\u201D!";
        $("revHearts").textContent=Array(REV+1).join("\u2764\uFE0F");
        reviveWait=true; $("revOvl").classList.add("show");
      } else { endRound(); }
    }
    function doRevive(){
      reviveWait=false; REV--; hearts();
      $("revOvl").classList.remove("show");
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      py=H*0.45; vy=0; mercyT=performance.now(); playing=true; draw(); // the gated rAF died on crash — restart it
    }
    $("revDone").onclick=function(){ reviveWait=false; $("revOvl").classList.remove("show"); endRound(); };
    hearts();

    var G=H*0.00075, FLAP=-H*0.0115;
    var py=H*0.45, vy=0, px=W*0.32;
    var gates=[], gapH=H*0.34, gspeed=W*0.0048, spawnMs=1650;
    var falling={on:false,t0:0}, mercyT=0;
    var RUNNER="🦊";
    try{ var c=S.characterById((S.getProfile()||{}).character||"fox"); if(c&&c.emoji)RUNNER=c.emoji; }catch(e){}

    function spawnGate(){
      var cy=H*(0.30+Math.random()*0.40);
      gates.push({x:W+70,cy:cy,passed:false,gold:boost.on});
    }
    var spawnTimer=setInterval(function(){ if(playing&&!falling.on) spawnGate(); },spawnMs);
    var rampIv=setInterval(function(){ if(playing){ gspeed*=1.05; if(gapH>H*0.26) gapH*=0.985; } },9000);
    

    cv.addEventListener("pointerdown",function(){
      if(!playing||falling.on)return;
      vy=FLAP; sfx("tap"); $("tapHint").style.display="none";
    });
    function flash(t){ var f=$("flash"); f.textContent=t; f.style.opacity=1; f.style.transform="scale(1.15)"; setTimeout(function(){f.style.opacity=0;f.style.transform="scale(1)";},600); }

    // Mario-Kart fall: bonk a tower → tumble off the sky (~1.1s) → float back
    // in on the balloon, keep gliding. Never a "you lose" screen.
    function startFall(){ falling={on:true,t0:performance.now()}; flash("WHOOOA! 🫧"); sfx("tap"); }

    
    // vector hot-air balloon (SVG → Image) that carries the buddy
    var BAL=new Image(), BALOK=false;
    BAL.onload=function(){ BALOK=true; };
    BAL.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 100 125"><path d="M50 4 C24 4 12 24 12 42 C12 62 30 74 40 84 L60 84 C70 74 88 62 88 42 C88 24 76 4 50 4" fill="#fa5252"/><path d="M50 4 C36 4 28 24 28 42 C28 62 38 74 42 84 L50 84 Z" fill="#ff8787"/><path d="M50 4 C60 4 68 24 68 42 C68 62 60 74 56 84 L50 84 Z" fill="#ffd43b"/><path d="M50 4 C46 4 42 24 42 42 C42 62 46 74 48 84 L52 84 C54 74 58 62 58 42 C58 24 54 4 50 4" fill="#fff" opacity=".22"/><path d="M40 84 L37 96 M60 84 L63 96 M50 84 L50 96" stroke="#8a5a2e" stroke-width="2.5"/><rect x="34" y="96" width="32" height="22" rx="6" fill="#a97044"/><rect x="34" y="96" width="32" height="8" rx="4" fill="#c08a5a"/><path d="M38 104 h24 M38 111 h24" stroke="#8a5a2e" stroke-width="2" opacity=".6"/></svg>');
    var COLW=74;
    function draw(){
      ctx.clearRect(0,0,W,H);
      // drifting clouds
      ctx.fillStyle="rgba(255,255,255,.35)";
      for(var i=0;i<5;i++){ var cx=((i*173-performance.now()*0.02*(1+i*0.2))%(W+140)+W+140)%(W+140)-70; var cy2=H*0.12+i*H*0.14; ctx.beginPath(); ctx.ellipse(cx,cy2,52,20,0,0,7); ctx.fill(); }
      // gates (hedge towers)
      for(var i=gates.length-1;i>=0;i--){ var g=gates[i];
        g.x-=gspeed*(boost.on?1.4:1);
        if(g.x<-90){ gates.splice(i,1); continue; }
        var topH=g.cy-gapH/2, botY=g.cy+gapH/2;
        ctx.fillStyle=g.gold?"#ffd21c":"#2f9e44";
        rr(g.x-COLW/2,-12,COLW,topH+12,18); ctx.fill();
        rr(g.x-COLW/2,botY,COLW,H-botY+12,18); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.22)";
        rr(g.x-COLW/2,topH-14,COLW,14,7); ctx.fill();
        rr(g.x-COLW/2,botY,COLW,14,7); ctx.fill();
        // score when the gate passes the player
        if(!g.passed && g.x<px-COLW/2){ g.passed=true; score+=(g.gold||boost.on)?2:1; $("score").textContent="🎈 "+score; sfx("tap"); if(score%10===0)flash(score+" GATES! 🎈"); }
        // collide (skip during fall/mercy/boost)
        if(!falling.on && !boost.on && performance.now()-mercyT>1200 &&
           Math.abs(g.x-px)<(COLW/2+22) && (py<topH+22||py>botY-22)){
          crash();
        }
      }
      // player physics
      if(!falling.on){
        vy+=G*(boost.on?0.4:1); py+=vy;
        if(py<44){ py=44; vy=0; }
        if(py>H-120){ py=H-120; vy=FLAP*0.6; } // soft bounce off the ground — no floor deaths
      }
      // player (balloon + buddy; falling = tumble)
      if(falling.on){
        var ft=(performance.now()-falling.t0)/1100;
        if(ft>=1){ falling.on=false; mercyT=performance.now(); py=H*0.45; vy=0; flash("Back in the sky! 🎈"); }
        else{ ctx.save(); ctx.translate(px,py+ft*ft*320); ctx.rotate(ft*10); ctx.globalAlpha=1-ft*0.4; ctx.fillStyle="#000"; ctx.textAlign="center"; ctx.textBaseline="middle";
          if(BALOK){ ctx.drawImage(BAL,-40,-78,80,100); ctx.font="34px sans-serif"; ctx.fillText(RUNNER,0,16); } else { ctx.font="50px sans-serif"; ctx.fillText(RUNNER,0,0); }
          ctx.restore(); }
      } else {
        var blink=(performance.now()-mercyT<1200)&&(((performance.now()/120)|0)%2===0);
        if(!blink){
          if(boost.on){ ctx.fillStyle="rgba(255,210,28,.35)"; ctx.beginPath(); ctx.arc(px,py,46,0,7); ctx.fill(); }
          // opaque paint before emoji: canvases modulate color glyphs by the
          // fill's alpha, so a leftover translucent fillStyle ghosts the buddy
          ctx.fillStyle="#000"; ctx.textAlign="center"; ctx.textBaseline="middle";
          var bob=Math.sin(performance.now()/300)*3;
          ctx.save(); ctx.translate(px,py+bob); ctx.rotate(Math.max(-0.22,Math.min(0.34,vy*0.02)));
          if(BALOK){ ctx.drawImage(BAL,-40,-78,80,100); ctx.font="34px sans-serif"; ctx.fillText(RUNNER,0,16); }
          else { ctx.font="34px sans-serif"; ctx.fillText("🎈",0,-40); ctx.font="50px sans-serif"; ctx.fillText(RUNNER,0,0); }
          ctx.restore();
        }
      }
      requestAnimationFrame(playing?draw:function(){});
    }
    function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    spawnGate(); draw();

    // ── VOICE BOOST: SUPER FLOAT — say your sound → 3s feather-fall,
    // fly-through-anything, 2x gates. Optional; local loudness only.
    function fireBoost(){
      boost.on=true; boost.cool=true;
      var ch=$("boostChip"); ch.textContent="SUPER FLOAT!! 🎈"; ch.classList.add("hot");
      sfx("complete"); flash("🎈 SUPER FLOAT! 2× 🎈");
      setTimeout(function(){ boost.on=false; ch.classList.remove("hot"); ch.textContent="…"; },3000);
      setTimeout(function(){ boost.cool=false; paintChip(); },9000);
    }
    var SAYTXT="";
    function paintChip(){ $("boostChip").textContent="🎤 Say “"+SAYTXT+"” for SUPER FLOAT!"; }
    (function(){
      var snd=""; try{ snd=sessionStorage.getItem("sona.boost.sound")||""; }catch(e){}
      if(!snd){ try{ snd=((S&&S.getProfile&&S.getProfile().focusSounds)||["R"])[0]; }catch(e){ snd="R"; } }
      SAYTXT=(S&&S.soundSay)?S.soundSay(String(snd).toUpperCase()):"rrrr";
      paintChip();
      if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ $("boostChip").style.display="none"; return; }
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){ MIC=true;
        window.addEventListener("pagehide",function(){ try{ st.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
        var AC=window.AudioContext||window.webkitAudioContext, bctx=new AC();
        var src=bctx.createMediaStreamSource(st), an=bctx.createAnalyser(); an.fftSize=512; src.connect(an);
        var td=new Uint8Array(an.fftSize), t0=performance.now(), calS=0,calN=0,thr=0,voiced=0;
        (function tick(){
          an.getByteTimeDomainData(td);
          var sum=0; for(var i=0;i<td.length;i++){ var d=(td[i]-128)/128; sum+=d*d; }
          var rms=Math.sqrt(sum/td.length), now=performance.now();
          if(now-t0<450){ calS+=rms; calN++; }
          else { if(!thr) thr=Math.max(0.05,(calS/Math.max(1,calN))*3.5);
            if(rms>thr){ voiced++; if(voiced>=6){ if(reviveWait){ voiced=0; doRevive(); } else if(playing && !boost.on && !boost.cool) fireBoost(); } }
            else voiced=0; }
          requestAnimationFrame(tick);
        })();
      }).catch(function(){ $("boostChip").style.display="none"; });
    })();

    // ---- round over ----
    function bankAndContinue(){ location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      if(window.__ended)return; window.__ended=true;
      playing=false; reviveWait=false; clearInterval(spawnTimer); clearInterval(rampIv);
      var isBest=score>BEST; if(isBest){ BEST=score; try{ localStorage.setItem(BESTK,String(BEST)); }catch(e){} }
      var coins=Math.min(10,(score/3)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        $("endTitle").textContent="+"+score+" points! 🏆";
        $("endSub").textContent="Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        $("endOvl").classList.add("show");
        setTimeout(bankAndContinue,1400);
        return;
      }
      $("endTitle").textContent=score>=18?"Sky master! 🌟":"Great gliding!";
      $("endSub").textContent="You glided through "+score+" gates"+(coins?(" · +"+coins+" 🪙"):"")+"!";
      $("endOvl").classList.add("show");
    }
    $("endCharge").onclick=backToCharge;
    $("endHome").onclick=function(){ location.href="/today.html#play"; };
    $("close").onclick=function(){ if(playing){ playing=false; clearInterval(spawnTimer); clearInterval(rampIv); } if(isDaily){ bankAndContinue(); return; } location.href="/today.html#play"; };
  </script>
</body>
</html>
