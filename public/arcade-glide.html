<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Flappy Glide</title>
  <link href="/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/action.css">
  <meta name="theme-color" content="#3f74ab" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#3f74ab,#6ea3d4 42%,#ffcf9a 78%,#ffe7c4);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.3);}
    #tapHint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-family:"Baloo 2";font-weight:800;font-size:15px;color:#ffe9cf;z-index:4;pointer-events:none;}
    /* ── designed HUD kit (handoff section 4) ── */
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;z-index:5;}
    #close{border:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#b08d63;font-size:19px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 4px 0 rgba(70,50,20,.35);}
    .hudpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 14px;box-shadow:0 4px 0 rgba(70,50,20,.35);font-family:"Baloo 2";font-weight:800;font-size:16px;color:#4a2c14;}
    #score{flex:none;}
    #hudspacer{flex:1;}
    #timer{color:#ff5c74;letter-spacing:1px;}
    /* ── cards over the game (the family's redesign brief, 28 Sep 2026) ──
       Echo peeks over the card's top edge from BEHIND it (designs 10, 11):
       he sits in the wrapper under the card, so the card's own edge hides
       him below the beak. Drawn inside the card he would paint over it.
       Teal is the one action colour and cream the second choice; both come
       from /action.css and are never pasted here. */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(30,22,50,.55);display:none;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;}
    .ovl.show{display:flex;}
    .cardWrap{position:relative;width:100%;max-width:340px;margin:auto;padding-top:76px;}
    .peek{position:absolute;top:0;left:50%;width:112px;margin-left:-56px;z-index:0;pointer-events:none;filter:drop-shadow(0 -2px 8px rgba(30,22,50,.25));animation:peekUp .45s cubic-bezier(.3,1.4,.5,1) both;}
    @keyframes peekUp{0%{transform:translateY(56px)}100%{transform:translateY(0)}}
    .ovlCard{position:relative;z-index:1;background:var(--cream-card);border-radius:28px;padding:22px 20px 20px;text-align:center;box-shadow:0 18px 40px rgba(30,22,50,.45);display:flex;flex-direction:column;align-items:center;gap:8px;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:23px;color:#4a2c14;line-height:1.18;}
    .ovl h2 b{color:var(--snd);}   /* the practice sound: orange, and nothing else is */
    .ovl p{color:#b08d63;font-weight:800;font-size:14.5px;max-width:280px;}
    .ovlCard .act-pill,.ovlCard .cream-pill{width:100%;min-height:54px;padding:12px 20px;font-size:19px;margin-top:4px;}
    .ovlCard .cream-pill{min-height:50px;font-size:17px;}
    /* the say-it card, on a cloud between legs: the ask is its headline
       (it follows a finished leg, not a miss, so no "Whoops!") */
    #revTitle{font-size:24px;}
    #revHearts{line-height:1;}
    .revMic{width:78px;height:78px;display:flex;align-items:center;justify-content:center;margin:6px 0 2px;}
    .revMic svg{width:34px;height:34px;fill:#fff;}
    .ovl #revListen{color:var(--act-d);font-family:"Baloo 2";font-size:18px;}
    /* great round */
    .eyebrow{font-family:"Baloo 2";font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
    .ovl .eyebrow{font-size:13px;color:#8a6f52;margin-bottom:-8px;}   /* the page's darker tan: the lighter one is under 3:1 on the cream at 13px */
    #endTitle{font-size:34px;line-height:1.05;}
    .stars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:54px;}
    .endStar{animation:starDrop .35s cubic-bezier(.3,1.6,.5,1) both;}
    .endStar:nth-child(2){animation-delay:.12s;} .endStar:nth-child(3){animation-delay:.24s;}
    @keyframes starDrop{0%{transform:translateY(-64px) scale(.4);opacity:0}70%{transform:translateY(6px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
    /* the landing's line sits under "Great round!" inside the title: the
       flight is always won, and the card says how */
    #endTitle .finale{display:block;font-size:19px;line-height:1.2;color:#4a2c14;margin-top:6px;}
    .endPic{display:flex;justify-content:center;} .endPic:empty{display:none;}
    .ovl #endSub{font-size:15px;color:#8a6f52;}
    .statRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .statPill{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:7px 16px;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#4a2c14;box-shadow:0 3px 0 rgba(120,80,20,.12);}
    /* a short phone (an SE is 568 tall): the same card, tighter, so both
       buttons stay on screen without scrolling */
    @media (max-height:680px){
      .cardWrap{padding-top:60px;} .peek{width:92px;margin-left:-46px;}
      .ovlCard{gap:6px;padding:18px 18px 16px;}
      #endTitle{font-size:28px;} #endTitle .finale{font-size:17px;}
      .endPic svg{width:140px;height:84px;}
      .ovlCard .act-pill,.ovlCard .cream-pill{min-height:48px;}
    }
    @media (prefers-reduced-motion: reduce){ .endStar,.peek{animation:none;} }
    /* ── the flight's HUD, banner and card (27 Sep 2026) ── */
    #tapHint{color:#fff!important;text-shadow:0 2px 3px rgba(120,60,20,.55);}
    #timer{color:#4a2c14;letter-spacing:0;gap:8px;}
    #timer .wv{white-space:nowrap;}
    #timer .wbar{display:block;width:60px;height:10px;border-radius:99px;background:#fbe8d6;overflow:hidden;}
    #timer .wbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffb86b,#ff6b8a);transition:width .25s;}
    #banner{position:absolute;left:0;right:0;top:17%;text-align:center;z-index:4;pointer-events:none;opacity:0;padding:0 16px;}
    #banner .pill{display:inline-block;background:rgba(255,255,255,.95);border-radius:26px;padding:10px 26px 12px;box-shadow:0 6px 0 rgba(140,70,30,.28);}
    #banner b{display:block;font-family:"Baloo 2";font-weight:800;font-size:38px;color:#e2621a;line-height:1.05;}
    #banner span{display:block;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#8a6f52;margin-top:2px;}
    #banner span:empty{display:none;}
    #banner.in{animation:bannerIn 1.9s ease both;}
    @keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px)}}
    @keyframes bannerFade{0%,100%{opacity:0}15%,80%{opacity:1}}
    #revHearts{display:flex;justify-content:center;gap:8px;}
    #revHearts .wdot{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#f3e3cf;color:#b08d63;font-family:"Baloo 2";font-weight:800;font-size:17px;}
    #revHearts .wdot.on{background:#58cc02;box-shadow:0 3px 0 #46a302;}
    #revHearts .wdot svg{width:20px;height:20px;}
    @media (prefers-reduced-motion: reduce){ #banner.in{animation-name:bannerFade;} }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div class="hudpill"><svg viewBox="0 0 64 64" style="width:19px;height:19px;vertical-align:-4px"><path d="M32 4C18 4 11 16 11 27c0 12 11 19 17 26h8c6-7 17-14 17-26C53 16 46 4 32 4Z" fill="#ff6b6b"/><path d="M32 4c-6 0-10 12-10 23 0 12 5 19 7 26h6c2-7 7-14 7-26C42 16 38 4 32 4Z" fill="#fff4dd"/><path d="M32 4c-2 0-4 12-4 23 0 12 2 19 3 26h2c1-7 3-14 3-26C36 16 34 4 32 4Z" fill="#ffd43b"/><rect x="25" y="53" width="14" height="9" rx="3" fill="#b5875a"/></svg> <b id="score">0</b></div>
      <div id="hudspacer"></div>
      <div id="timer" class="hudpill"></div>
    </div>
    <div id="flash"></div>
    <div id="tapHint">Tap to float up! Fly through the gaps!</div>
    <div id="banner" aria-live="polite"><div class="pill"><b id="bnBig"></b><span id="bnSmall"></span></div></div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="cardWrap">
      <img class="peek" src="/coach/echo/echo-star.svg" alt="" />
      <div class="ovlCard">
        <h2 id="needTitle">This game needs a ticket!</h2>
        <p>Say your sound 5 times to fill it up</p>
        <button class="act-pill" id="goCharge"><svg viewBox="0 0 64 64" style="width:18px;height:18px;vertical-align:-3px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg> Fill my ticket!</button>
        <button class="cream-pill" id="needHome">Back home</button>
      </div>
    </div>
  </div>

  <div class="ovl" id="revOvl">
    <div class="cardWrap">
      <img class="peek" src="/coach/echo/echo-listening.svg" alt="" />
      <div class="ovlCard">
        <h2 id="revTitle">Say it!</h2>
        <p id="revHearts"></p>
        <div class="act-mic revMic" role="img" aria-label="Microphone"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
        <p id="revListen">Get ready…</p>
        <button class="cream-pill" id="revDone">I'm done playing</button>
      </div>
    </div>
  </div>

  <div class="ovl" id="endOvl">
    <div class="cardWrap">
      <img class="peek" src="/coach/echo/echo-celebrate.svg" alt="" />
      <div class="ovlCard">
        <p class="eyebrow" id="endGame">Flappy Glide</p>
        <h2 id="endTitle">Great round!</h2>
        <div class="stars" id="endEmoji" aria-hidden="true"><svg class="endStar" viewBox="0 0 64 64" style="width:42px;height:42px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c" stroke="#f0b400" stroke-width="2" stroke-linejoin="round"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg><svg class="endStar" viewBox="0 0 64 64" style="width:54px;height:54px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c" stroke="#f0b400" stroke-width="2" stroke-linejoin="round"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg><svg class="endStar" viewBox="0 0 64 64" style="width:42px;height:42px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c" stroke="#f0b400" stroke-width="2" stroke-linejoin="round"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg></div>
        <div class="endPic" id="endPic" aria-hidden="true"></div>
        <p id="endSub"></p>
        <div class="statRow" id="endStats"><span class="statPill" id="endScore"></span><span class="statPill" id="endCoins"></span></div>
        <button class="act-pill" id="endCharge">Next</button>
        <button class="act-pill" id="endAgain" style="display:none;"></button>
        <button class="cream-pill" id="endHome">Back to games</button>
      </div>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script>
    // Check access before any game resources start. The earned speech token
    // remains a separate requirement; a catalog unlock never creates one.
    var gameEntryAllowed=false;
    (function () {
      var S=window.Sona, q=new URLSearchParams(location.search);
      if(!S)return;
      var earned=q.get("from")==="charge";
      if(!S.gameAccess("glide",{run:q.get("daily")==="1",earned:earned}).allowed){S.gameBounce("glide");return;}
      if(!earned){location.replace("/today.html");return;}
      gameEntryAllowed=true;
    })();
  </script>
  <script>
    if(gameEntryAllowed){
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    // ── the mic and this game's own sounds never overlap (24 Sep 2026) ──
    // On an iPhone a page holding the mic runs as a phone call: the volume
    // buttons change CALL volume and every chime is processed like a call.
    // So no game sound plays while the keep-playing mic is open (a sound
    // asked for then is dropped; the game is paused behind the card anyway),
    // none waits on a mic request that hasn't settled, none plays in the
    // first SETTLE_MS after the mic closes (the phone switches back in
    // silence, not under a chime), and the mic never opens until QUIET_MS
    // after the last sound began: the longest chime ("complete") rings about
    // 0.6 s and the rest covers speaker and Bluetooth delay, so a chime's
    // tail can never answer the card for the child.
    var SETTLE_MS=200, QUIET_MS=900, quietUntil=0, micClosedAt=-1e9;
    var rv={st:null,pending:0,gen:0,raf:0,t:0,ctx:null,src:null,floor:-1};   // floor: the room's quiet level, measured once per page (see listenFor)
    function sfx(n){
      if(rv.st) return;
      if(rv.pending){ setTimeout(function(){ sfx(n); },60); return; }
      var wait=micClosedAt+SETTLE_MS-performance.now();
      if(wait>0){ quietUntil=Math.max(quietUntil,performance.now()+wait+QUIET_MS); setTimeout(function(){ sfx(n); },wait); return; }
      quietUntil=Math.max(quietUntil,performance.now()+QUIET_MS);
      try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){}
    }

    // ---- charge gate + daily plumbing ----
    var SELF="arcade-glide.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ try{sessionStorage.removeItem("sona.play.active");}catch(e){} location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ var _t=sessionStorage.getItem("sona.play.token"); if(_t===SELF||_t==="1"){ tok=true; sessionStorage.setItem("sona.play.active",SELF); sessionStorage.removeItem("sona.play.token"); } else if(sessionStorage.getItem("sona.play.active")===SELF){ tok=true; } }catch(e){}
    if(!tok){ try{ $("needTitle").textContent="Flappy Glide needs a ticket!"; }catch(e){} $("needOvl").classList.add("show"); }

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    // ---- game state ----
    var playing=true, score=0;
    var BESTK="sona.best.glide", BEST=0; try{ BEST=parseInt(localStorage.getItem(BESTK)||"0",10)||0; }catch(e){}
    var REV=3, reviveWait=false;   // say-the-sound cards: one on each cloud rest
    // The say-it card's line keeps its words; only the practice sound's
    // letters turn orange (the family's redesign brief, 28 Sep 2026: orange
    // means the sound and nothing else). Sona.soundMark decides which letters.
    function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function sayMark(){ return (window.Sona&&Sona.soundMark)?Sona.soundMark(SAYTXT,SND):'<b class="snd">'+esc(SAYTXT)+'</b>'; }
    function markSay(t){
      var q="\u201C"+SAYTXT+"\u201D", i=t.indexOf(q);
      return i<0?esc(t):esc(t.slice(0,i))+"\u201C"+sayMark()+"\u201D"+esc(t.slice(i+q.length));
    }

    // ── the flight: three legs, a cloud rest between, then a fireworks landing (27 Sep 2026) ──
    // The round Travis said yes to for Fruit Slice, as a balloon flight, with
    // what the review of the older games found: the hardest of the six (a
    // steady tap about every half-second, with hedges almost back to back, and
    // a bump that stopped play). The balloon now floats and sinks slowly (a
    // tap about every second holds it level), the gaps are wider and further
    // apart, a hedge is a soft bounce back into the gap and never the card,
    // and after two bumps in a leg the gaps open wider and the hedges slow.
    // The say-it card waits on a cloud between legs; after the third the
    // balloon lands in fireworks, so every flight ends in a win. Stars float
    // in the gaps to catch. (Hold-to-rise, the review's other idea, changes the
    // control, so it waits for Travis.)
    var LEGS=[{goal:6},{goal:7},{goal:8}];
    var leg=0, legGot=0, phase="fly", bumps=0, landing=null, finaleDone=false, echoT=-1e9, sparks=[];
    var G=H*0.00028, FLAP=-H*0.0072, VMAX=H*0.0058;   // floaty: a tap about every second holds it level
    var py=H*0.45, vy=0, px=W*0.32;
    var gates=[], gapBase=H*0.46, gapH=gapBase, gspeed0=W*0.0026, gspeed=gspeed0, gateEvery=2900, gateMs=2000;
    var falling={on:false,t0:0}, mercyT=0;
    var RUNNER="🦊";
    var BUDDYIMG=(function(){ try{ var c=S.characterById((S.getProfile()||{}).character||"fox"); if(c&&c.svg){ var im=new Image(); im.src="data:image/svg+xml;utf8,"+encodeURIComponent(c.svg); return im; } }catch(e){} return null; })();
    function drawBuddy(x,y,sz){ if(BUDDYIMG&&BUDDYIMG.complete&&BUDDYIMG.naturalWidth){ ctx.drawImage(BUDDYIMG,x-sz/2,y-sz/2,sz,sz); return true; } return false; }
    try{ var c=S.characterById((S.getProfile()||{}).character||"fox"); if(c&&c.emoji)RUNNER=c.emoji; }catch(e){}

    function spawnGate(){
      var cy=H*(0.32+Math.random()*0.34);
      gates.push({x:W+70,cy:cy,passed:false,star:Math.random()<0.7,gold:leg>0&&Math.random()<0.15,got:false});
    }
    function startLeg(i){
      leg=i; legGot=0; phase="fly"; bumps=0; gapH=gapBase; gspeed=gspeed0*(1+0.1*i); gateMs=gateEvery-900; gates=[]; landing=null;
      py=H*0.45; vy=0; mercyT=performance.now(); hud();
      banner("Leg "+(i+1),"Fly through "+LEGS[i].goal+" gaps!");
    }
    function endLeg(){
      phase="rest"; hud();
      var last=leg===LEGS.length-1;
      landing={y:H+80,ty:H*0.64,big:last,t0:performance.now()};   // a cloud floats up under the balloon
      banner(last?"Landing time!":"Rest on a cloud!", last?"What a flight!":"Leg "+(leg+1)+" done!"); sfx("complete"); echoT=performance.now();
      setTimeout(function(){
        if(window.__ended||!playing) return;
        if(last){ finaleDone=true; phase="done"; hud(); fireworks(); setTimeout(endRound,2000); }
        else sayCard("Say \u201C"+SAYTXT+"\u201D to fly on!","none");
      },2200);
    }
    function fireworks(){
      try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      var cols=["#ff6b8a","#ffd43b","#69db7c","#4dabf7","#b197fc"];
      for(var b=0;b<4;b++){ var cx=W*(0.2+b*0.2), cy=H*(0.2+(b%2)*0.12);
        for(var k=0;k<22;k++){ var a=k/22*6.28, v=2+Math.random()*3; sparks.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1+b*0.15,c:cols[(b+k)%5]}); } }
      echoT=performance.now();
    }

    // ── the HUD: this leg's gaps, then the landing ──
    function hud(){
      var t=$("timer");
      if(phase==="done"||(phase==="rest"&&leg===LEGS.length-1)){ t.innerHTML='<span class="wv">Landing!</span>'; t.setAttribute("aria-label","The landing"); return; }
      var L=LEGS[leg], got=phase==="rest"?L.goal:Math.min(legGot,L.goal);
      t.innerHTML='<span class="wv">Leg '+(leg+1)+'</span><span class="wbar"><i style="width:'+Math.round(got/L.goal*100)+'%"></i></span>';
      t.setAttribute("aria-label","Leg "+(leg+1)+" of 3: "+got+" of "+L.goal+" gaps");
    }
    var TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    function legDots(){ var s=""; for(var i=0;i<LEGS.length;i++) s+='<span class="wdot'+(i<=leg?' on':'')+'">'+(i<=leg?TICK:String(i+1))+'</span>'; return s; }
    function banner(big,small){ var b=$("banner"); $("bnBig").textContent=big; $("bnSmall").textContent=small||""; b.classList.remove("in"); void b.offsetWidth; b.classList.add("in"); }

    // ── the say-it card, on a cloud between legs ──
    function sayCard(title,snd){
      if(!playing) return;
      playing=false; gates=[]; if(snd!=="none") sfx(snd||"tap");
      if(REV>0 && CAN_LISTEN){
        $("revTitle").innerHTML=markSay(title||("Say \u201C"+SAYTXT+"\u201D to keep playing!"));
        $("revHearts").innerHTML=legDots();
        reviveWait=true; $("revOvl").classList.add("show"); openReviveMic();
      } else { endRound(); }
    }
    // The card's old name, from when a hedge opened it. Kept because the
    // quiet-mic suites open the card through it.
    function crash(){ sayCard(); }
    function doRevive(){
      reviveWait=false; REV--; hud();
      $("revOvl").classList.remove("show");
      // the mic has just closed: sfx() holds this chime SETTLE_MS
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      py=H*0.45; vy=0; mercyT=performance.now(); playing=true;
      if(phase==="rest") startLeg(leg+1);
      draw(); // the gated rAF died on the card — restart it
    }
    $("revDone").onclick=function(){ closeReviveMic(); reviveWait=false; $("revOvl").classList.remove("show"); endRound(); };

    function flap(){
      if(!playing||falling.on||phase!=="fly")return;
      vy=FLAP; sfx("tap"); $("tapHint").style.display="none";
    }
    cv.addEventListener("pointerdown",flap);
    window.addEventListener("keydown",function(e){ if(e.key===" "||e.key==="ArrowUp") flap(); });
    function flash(t){ var f=$("flash"); f.textContent=t; f.style.opacity=1; f.style.transform="scale(1.15)"; setTimeout(function(){f.style.opacity=0;f.style.transform="scale(1)";},600); }
    // a hedge is a soft bounce back towards the gap, never a stop; two in a
    // leg and the gaps open wider and the hedges slow down
    function bump(g){
      mercyT=performance.now(); bumps++;
      vy=(py<g.cy?1:-1)*H*0.004; py+=(py<g.cy?1:-1)*10;
      flash("Boing!"); sfx("drop");
      if(bumps>=2){ gapH=Math.min(H*0.6,gapH*1.12); gspeed=Math.max(gspeed0*0.8,gspeed*0.9); }
    }
    function startFall(){ falling={on:true,t0:performance.now()}; flash("WHOOOA!"); sfx("tap"); }
    var BAL=new Image(), BALOK=false;
    BAL.onload=function(){ BALOK=true; };
    BAL.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 100 125"><path d="M50 4 C24 4 12 24 12 42 C12 62 30 74 40 84 L60 84 C70 74 88 62 88 42 C88 24 76 4 50 4" fill="#fa5252"/><path d="M50 4 C36 4 28 24 28 42 C28 62 38 74 42 84 L50 84 Z" fill="#ff8787"/><path d="M50 4 C60 4 68 24 68 42 C68 62 60 74 56 84 L50 84 Z" fill="#ffd43b"/><path d="M50 4 C46 4 42 24 42 42 C42 62 46 74 48 84 L52 84 C54 74 58 62 58 42 C58 24 54 4 50 4" fill="#fff" opacity=".22"/><path d="M40 84 L37 96 M60 84 L63 96 M50 84 L50 96" stroke="#8a5a2e" stroke-width="2.5"/><rect x="34" y="96" width="32" height="22" rx="6" fill="#a97044"/><rect x="34" y="96" width="32" height="8" rx="4" fill="#c08a5a"/><path d="M38 104 h24 M38 111 h24" stroke="#8a5a2e" stroke-width="2" opacity=".6"/></svg>');
    var COLW=74;
    var ECHO=new Image(); ECHO.src="/coach/echo/echo-celebrate.svg";
    var lastT=performance.now();
    function cloudShape(x,y,w){ ctx.beginPath(); ctx.ellipse(x,y,w*0.5,w*0.16,0,0,7); ctx.ellipse(x-w*0.22,y-w*0.08,w*0.2,w*0.14,0,0,7); ctx.ellipse(x+w*0.12,y-w*0.12,w*0.24,w*0.17,0,0,7); ctx.fill(); }
    function star5(x,y,r){ ctx.beginPath(); for(var k=0;k<10;k++){ var rr2=k%2?r*0.45:r, a=-Math.PI/2+k*Math.PI/5; ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2); } ctx.closePath(); ctx.fill(); }
    function draw(){
      var now=performance.now(), dt=Math.min(100,now-lastT), i; lastT=now;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle="rgba(255,255,255,.35)";
      for(i=0;i<5;i++){ var cx=((i*173-now*0.02*(1+i*0.2))%(W+140)+W+140)%(W+140)-70; var cy2=H*0.12+i*H*0.14; ctx.beginPath(); ctx.ellipse(cx,cy2,52,20,0,0,7); ctx.fill(); }
      // the next hedge on the leg's beat; the leg ends when its gaps are flown
      if(playing&&phase==="fly"&&!falling.on){
        gateMs+=dt;
        var toSpawn=LEGS[leg].goal-legGot-gates.filter(function(g){ return !g.passed; }).length;
        if(gateMs>=gateEvery&&toSpawn>0){ spawnGate(); gateMs=0; }
        if(legGot>=LEGS[leg].goal) endLeg();
      }
      for(i=gates.length-1;i>=0;i--){ var g=gates[i];
        g.x-=gspeed;   // the hedges drift on by, even while the balloon rests
        if(g.x<-90){ gates.splice(i,1); continue; }
        var topH=g.cy-gapH/2, botY=g.cy+gapH/2;
        ctx.fillStyle="#2f9e44";
        rr(g.x-COLW/2,-12,COLW,topH+12,18); ctx.fill();
        rr(g.x-COLW/2,botY,COLW,H-botY+12,18); ctx.fill();
        ctx.fillStyle="#5cbf6a";
        rr(g.x-COLW/2-5,topH-16,COLW+10,18,10); ctx.fill();
        rr(g.x-COLW/2-5,botY-2,COLW+10,18,10); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.25)";
        for(var di=0;di<3;di++){ ctx.beginPath(); ctx.arc(g.x-COLW/4+di*(COLW/4), topH-30-((di%2)*14), 3.2, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(g.x-COLW/4+di*(COLW/4), botY+30+((di%2)*14), 3.2, 0, 7); ctx.fill(); }
        // a star floats in the gap: fly through it to catch it
        if(g.star&&!g.got){ ctx.fillStyle=g.gold?"#ffd21c":"#fff6b8"; if(g.gold){ ctx.globalAlpha=0.5+0.5*Math.sin(now/120); ctx.beginPath(); ctx.arc(g.x,g.cy,24,0,7); ctx.fill(); ctx.globalAlpha=1; ctx.fillStyle="#ffd21c"; } star5(g.x,g.cy,g.gold?16:12);
          if(Math.abs(g.x-px)<26&&Math.abs(g.cy-py)<46){ g.got=true; score+=g.gold?3:1; $("score").textContent=score; sfx(g.gold?"reward":"star"); if(g.gold){ flash("GOLDEN STAR! +3"); echoT=now; }
            for(var k=0;k<10;k++){ var a=Math.random()*6.28; sparks.push({x:g.x,y:g.cy,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,life:1,c:g.gold?"#ffd21c":"#fff6b8"}); } } }
        if(!g.passed && g.x<px-COLW/2){ g.passed=true; legGot++; score++; $("score").textContent=score; hud(); if(legGot%3===0) echoT=now; }
        if(phase==="fly"&&!falling.on && now-mercyT>900 && Math.abs(g.x-px)<(COLW/2+22) && (py<topH+22||py>botY-22)) bump(g);
      }
      // the cloud rest, or the landing, floats up under the balloon
      if(landing){ landing.y+=(landing.ty-landing.y)*0.05; ctx.fillStyle="#ffffff"; cloudShape(px+10,landing.y+40,landing.big?W*0.9:W*0.5); }
      if(!falling.on){
        if(phase==="fly"){ vy=Math.min(VMAX,vy+G); py+=vy;
          if(py<44){ py=44; vy=0; }
          if(py>H-120){ py=H-120; vy=FLAP*0.6; } }   // soft bounce off the ground — no floor deaths
        else if(landing){ py+=(landing.y-20-py)*0.08; vy=0; }
      }
      if(falling.on){
        var ft=(now-falling.t0)/1100;
        if(ft>=1){ falling.on=false; mercyT=now; py=H*0.45; vy=0; flash("Back in the sky!"); }
        else{ ctx.save(); ctx.translate(px,py+ft*ft*320); ctx.rotate(ft*10); ctx.globalAlpha=1-ft*0.4; ctx.fillStyle="#000"; ctx.textAlign="center"; ctx.textBaseline="middle";
          if(BALOK){ ctx.drawImage(BAL,-40,-78,80,100); if(!drawBuddy(0,6,34)){ ctx.font="34px sans-serif"; ctx.fillText(RUNNER,0,16); } } else if(!drawBuddy(0,-6,52)){ ctx.font="50px sans-serif"; ctx.fillText(RUNNER,0,0); }
          ctx.restore(); }
      } else {
        var blink=(now-mercyT<900)&&phase==="fly"&&(((now/120)|0)%2===0);
        if(!blink){
          ctx.fillStyle="#000"; ctx.textAlign="center"; ctx.textBaseline="middle";
          var bob=Math.sin(now/300)*3;
          ctx.save(); ctx.translate(px,py+bob); ctx.rotate(Math.max(-0.22,Math.min(0.34,vy*0.02)));
          if(BALOK){ ctx.drawImage(BAL,-40,-78,80,100); if(!drawBuddy(0,6,34)){ ctx.font="34px sans-serif"; ctx.fillText(RUNNER,0,16); } }
          else { ctx.font="34px sans-serif"; ctx.fillText("🎈",0,-40); if(!drawBuddy(0,10,52)){ ctx.font="50px sans-serif"; ctx.fillText(RUNNER,0,0); } }
          ctx.restore();
        }
      }
      // Echo flies alongside
      if(ECHO.complete&&ECHO.naturalWidth){ var hp=(now-echoT)/700, ey=hp>=0&&hp<1?-Math.sin(hp*Math.PI)*22:Math.sin(now/420)*6, es=Math.min(56,W*0.13);
        ctx.drawImage(ECHO,px-es*1.9,py-es*1.6+ey,es,es*1.07); }
      // stars caught, and the landing's fireworks
      for(i=sparks.length-1;i>=0;i--){ var s=sparks[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.life-=0.02; if(s.life<=0){ sparks.splice(i,1); continue; }
        ctx.globalAlpha=Math.min(1,s.life); ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(s.x,s.y,3,0,7); ctx.fill(); ctx.globalAlpha=1; }
      requestAnimationFrame(playing?draw:function(){});
    }
    function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    startLeg(0); draw();

    // ── "Say your sound to keep playing": the only time this game listens ──
    // (24 Sep 2026) STAR MODE is gone. It held the mic open for the whole
    // game so a shout could fire a power-up, which kept an iPhone in
    // phone-call audio from the first frame to the last. The mic now opens
    // only while the keep-playing card shows, after the quiet window above,
    // and closes before the revive chime. Loudness and sound-shape numbers
    // only: nothing is recorded, nothing leaves the device, and a revive is
    // play, never practice data.
    var SND="R", SAYTXT="rrrr", CAN_LISTEN=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
    (function(){
      var snd=""; try{ snd=sessionStorage.getItem("sona.boost.sound")||""; }catch(e){}
      if(!snd){ try{ snd=((S&&S.getProfile&&S.getProfile().focusSounds)||["R"])[0]; }catch(e){ snd="R"; } }
      SND=String(snd).toUpperCase(); SAYTXT=(S&&S.soundSay)?S.soundSay(SND):"rrrr";
    })();
    function listenNote(t){ try{ $("revListen").textContent=t; }catch(e){} }
    function closeReviveMic(){
      rv.gen++; clearTimeout(rv.t); if(rv.raf)cancelAnimationFrame(rv.raf); rv.raf=0;
      try{ if(rv.src)rv.src.disconnect(); }catch(e){} rv.src=null;
      if(rv.st){ try{ rv.st.getTracks().forEach(function(t){t.stop();}); }catch(e){} rv.st=null; micClosedAt=performance.now(); }
      listenNote("Get ready…");
    }
    // A request that was already late when it settled asks again if the card
    // is still up and on screen (24 Sep 2026). The phone can be locked while
    // it is asking: the ask made on the way back finds that request still
    // pending and stands down, so without this the card waited on "Get
    // ready…" for good and only "I'm done playing" got the child out.
    function askAgain(){ if(reviveWait&&!document.hidden&&!rv.st) openReviveMic(); }
    function openReviveMic(){
      if(!reviveWait||rv.st||rv.pending||document.hidden) return;
      var wait=quietUntil-performance.now();
      if(wait>0){ clearTimeout(rv.t); rv.t=setTimeout(openReviveMic,wait); return; }
      var gen=++rv.gen; rv.pending++;
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
        rv.pending--;
        // the card closed (or the page hid) while the phone was asking: this
        // stream is already late, so it goes straight back
        if(gen!==rv.gen||!reviveWait||document.hidden){ try{ st.getTracks().forEach(function(t){t.stop();}); }catch(e){} micClosedAt=performance.now(); askAgain(); return; }
        rv.st=st; listenFor(st,gen);
      }).catch(function(){
        rv.pending--;
        // a request cut short by the page hiding asks again on the way back
        if(gen!==rv.gen||!reviveWait||document.hidden){ askAgain(); return; }
        // no microphone: the card can't hear anyone, so the round ends kindly
        reviveWait=false; $("revOvl").classList.remove("show"); endRound();
      });
    }
    // ── what counts as the child on the card (24 Sep 2026) ──
    // The bar a sound must clear is 3.5× the room's quiet level, and that
    // level is the page's, not the card's: rv.floor is the 20th-percentile
    // loudness of the quietest FLOOR_MS the card's mic has heard on this
    // page, and it only ever goes DOWN. The first cut of this change
    // averaged the first 450 ms of every card instead, and a card that says
    // "Say rrrr!" opens its mic exactly when an eager child is already
    // saying it: their own voice became the "room", the bar landed above
    // it, and nothing they said could answer the card. So: a low
    // percentile, which a voice filling most of the stretch can't lift;
    // only-down, so nothing a child says ever raises it and one quiet
    // breath (or a later card) mends a floor a talking child set; and the
    // last HEARD_MS of frames are judged against the CURRENT floor, so a
    // try said before that breath still counts the moment it comes. The
    // 0.05 minimum, the 6-frame burst and the family check are unchanged.
    // "I'm listening…" shows only once there is a floor to listen against.
    var FLOOR_MS=450, HEARD_MS=3000;
    function p20(list){ var a=list.slice().sort(function(x,y){ return x-y; }); return a[Math.floor((a.length-1)*0.2)]; }
    function listenFor(st,gen){
      var an, td, fd, binHz, heard=[], said=false;
      try{
        if(!rv.ctx){ var AC=window.AudioContext||window.webkitAudioContext; rv.ctx=new AC(); }
        if(rv.ctx.state==="suspended") rv.ctx.resume();
        rv.src=rv.ctx.createMediaStreamSource(st); an=rv.ctx.createAnalyser(); an.fftSize=512; rv.src.connect(an);
        td=new Uint8Array(an.fftSize); fd=new Uint8Array(an.frequencyBinCount); binHz=rv.ctx.sampleRate/an.fftSize;
      }catch(e){ closeReviveMic(); reviveWait=false; $("revOvl").classList.remove("show"); endRound(); return; }
      // family check: the burst must SOUND like the target's family (voiced
      // vs hiss) to fire — a scream or an S can't revive an R kid. Shape
      // numbers only; nothing recorded (see Sona.frameShape).
      function famOK(shp){ if(!shp||!shp.m) return true; var cent=shp.fm/shp.m, high=shp.hm/shp.m, fam=(window.Sona&&Sona.soundFamily)?Sona.soundFamily(SND):"any"; if(fam==="low") return !(cent>1800&&high>0.22); if(fam==="hiss") return !(cent<1100&&high<0.10); return true; }
      (function tick(){
        if(gen!==rv.gen) return;
        var now=performance.now();
        // belt and braces: nothing plays while this mic is open, but if a
        // sound ever did, its frames would be dropped: never judged, never
        // part of the floor, never joined to a burst after it
        if(now<quietUntil){ heard=[]; rv.raf=requestAnimationFrame(tick); return; }
        an.getByteTimeDomainData(td);
        var sum=0; for(var i=0;i<td.length;i++){ var d=(td[i]-128)/128; sum+=d*d; }
        var shape=null; if(window.Sona&&Sona.frameShape){ an.getByteFrequencyData(fd); shape=Sona.frameShape(fd,binHz); }
        heard.push({t:now,r:Math.sqrt(sum/td.length),s:shape});
        while(now-heard[0].t>HEARD_MS) heard.shift();
        if(now-heard[0].t>=FLOOR_MS){
          var w=[]; for(var k=heard.length-1;k>=0&&now-heard[k].t<=FLOOR_MS;k--) w.push(heard[k].r);
          var q=p20(w); if(rv.floor<0||q<rv.floor) rv.floor=q;
        }
        if(rv.floor>=0){
          if(!said){ said=true; listenNote("I'm listening…"); }
          var thr=Math.max(0.05,rv.floor*3.5), voiced=0, shp=null;
          for(var j=0;j<heard.length;j++){ var f=heard[j];
            if(f.r>thr){ voiced++;
              if(f.s){ if(!shp)shp={m:0,fm:0,hm:0}; shp.m+=f.s.m; shp.fm+=f.s.fm; shp.hm+=f.s.hm; }
              if(voiced>=6){ if(!famOK(shp)){ voiced=0; shp=null; } else { closeReviveMic(); doRevive(); return; } } }
            else { voiced=0; shp=null; } }
        }
        rv.raf=requestAnimationFrame(tick);
      })();
    }
    // lock/app-switch fires visibilitychange, NOT pagehide — a mic left open
    // there stays lit in a pocket. Coming back to the card listens again.
    if(window.Sona&&Sona.onBackground) Sona.onBackground(closeReviveMic); else window.addEventListener("pagehide",closeReviveMic);
    document.addEventListener("visibilitychange",function(){ if(!document.hidden&&reviveWait) openReviveMic(); });

    // ---- round over ----
    // ── the Great round card (the family's redesign brief, 28 Sep 2026) ──
    // It was one star, one line and Echo, with "no stat rows or coin
    // counters". The brief asks for the game's name, three stars, what the
    // round earned in the game's own unit, the coins the round already
    // awarded (the coin maths is unchanged; the card only says it) and one
    // next step. The stars are not a grade: every round with points gets all
    // three and a round with none gets "Good try!" and no stars, so there is
    // never an empty star to fall short of. "Next" follows the arcade chain
    // (slice → tiles → stack → run → glide → slice) and shows only when that
    // game opens for this family (Sona.gameAccess); otherwise "Back to games"
    // stands alone and takes the teal. A flight that landed says so under
    // "Great round!", inside the title (the landing's own line, 27 Sep 2026).
    var NEXT="slice";
    function gameName(k,fb){ try{ var a=S.gameAct(k); if(a&&a.name) return a.name; }catch(e){} return fb; }
    function nextOpen(){ try{ return !!S.gameAct(NEXT)&&S.gameAccess(NEXT).allowed; }catch(e){ return false; } }
    function endCard(o){
      $("endGame").textContent=gameName("glide","Flappy Glide");
      var t=$("endTitle"); t.textContent=o.title;
      if(o.finale){ var f=document.createElement("span"); f.className="finale"; f.textContent=o.finale; t.appendChild(f); }
      $("endEmoji").style.display=o.stars?"":"none";
      $("endPic").innerHTML=o.pic||"";
      $("endSub").textContent=o.line||""; $("endSub").style.display=o.line?"":"none";
      $("endScore").textContent=o.stat||""; $("endScore").style.display=o.stat?"":"none";
      var c=$("endCoins"); c.style.display=o.coins>0?"":"none";
      if(o.coins>0){ c.innerHTML=((S&&S.icon)?S.icon("coin",20):"")+"+"+o.coins; c.setAttribute("aria-label",o.coins+" coins"); }
      $("endStats").style.display=(o.stat||o.coins>0)?"":"none";
      var next=!!o.buttons&&!o.again&&nextOpen();
      $("endCharge").style.display=next?"":"none"; if(next) $("endCharge").textContent="Next: "+gameName(NEXT,"");
      var ea=$("endAgain"); ea.style.display=o.again?"":"none"; if(o.again){ ea.textContent=o.again; ea.onclick=backToCharge; }
      $("endHome").style.display=o.buttons?"":"none"; $("endHome").className=(next||o.again)?"cream-pill":"act-pill";
    }
    // the score is the gaps flown plus the stars caught (a golden one is
    // three), so it is said as both, in the flight's own words
    function pointsSaid(n){ return n+" stars and gaps"; }
    function bankAndContinue(){ S.finishGameTurn("glide",score); location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      closeReviveMic();
      if(window.__ended)return; window.__ended=true;
      S.finishGameTurn("glide",isDaily?score:null);
      playing=false; reviveWait=false; phase="done";
      var isBest=score>BEST; if(isBest){ BEST=score; try{ localStorage.setItem(BESTK,String(BEST)); }catch(e){} }
      var coins=Math.min(10,(score/3)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        endCard({title:score===0?"Good try!":"Great round!", stars:score>0, stat:score?pointsSaid(score):"", coins:coins,
          line:score===0?"On to the next game…":"Banking your score…"});
        $("endOvl").classList.add("show");
        setTimeout(bankAndContinue,1400);
        return;
      }
      if(score===0){
        // gentle zero tier: encouraging copy, happy Echo, one warm "again" button
        endCard({title:"Good try! Wanna go again?", buttons:true, again:"Yes! Play again"});
        $("endOvl").classList.add("show");
        return;
      }
      // a landed flight: its line replaces Echo's, as it did the title
      // A landed flight leads with its own win, like the other four rounds;
      // "Great round!" is for a flight the child ended early.
      endCard({title:finaleDone?"What a flight!":"Great round!", stars:true, stat:pointsSaid(score), coins:coins, buttons:true,
        finale:finaleDone?"You landed with fireworks!":"",
        line:finaleDone?"":isBest?"NEW BEST! We flew SO far!":"What a flight, little glider!"});
      $("endOvl").classList.add("show");
    }
    $("endCharge").onclick=function(){ location.href=isDaily?"/charge.html?daily=1":(nextOpen()?"/charge.html?game=arcade-"+NEXT+".html":"/today.html#play"); };
    $("endHome").onclick=function(){ S.finishGameTurn("glide"); location.href="/today.html#play"; };
    $("close").onclick=function(){ closeReviveMic(); S.finishGameTurn("glide"); if(playing){ playing=false; } if(isDaily){ bankAndContinue(); return; } location.href="/today.html#play"; };
    }
  </script>
