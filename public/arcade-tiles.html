<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Piano Tiles</title>
  <link href="/fonts.css" rel="stylesheet">
  <meta name="theme-color" content="#231a4d" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;}
    html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#231a4d,#2f2266 40%,#43318c 72%,#54409e);}
    #app{position:fixed;inset:0;max-width:560px;margin:0 auto;overscroll-behavior:none;touch-action:manipulation;}
    canvas{position:absolute;inset:0;width:100%;height:100%;}
    #flash{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:32px;color:#ffd21c;opacity:0;transition:opacity .12s, transform .3s;z-index:4;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.3);}
    /* ── designed HUD kit (handoff section 4) ── */
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;z-index:5;}
    #close{border:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#b08d63;font-size:19px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 4px 0 rgba(20,12,50,.5);}
    .hudpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:9px 14px;box-shadow:0 4px 0 rgba(20,12,50,.5);font-family:"Baloo 2";font-weight:800;font-size:16px;color:#4a2c14;}
    #score{flex:none;}
    #hudspacer{flex:1;}
    #timer{color:#ff5c74;letter-spacing:1px;}
    /* ── warm-card overlays (handoff section 5) ── */
    .ovl{position:fixed;inset:0;z-index:50;background:rgba(30,22,50,.55);display:none;align-items:center;justify-content:center;padding:24px;}
    .ovl.show{display:flex;}
    .ovlCard{background:#fff6e9;border-radius:28px;padding:58px 20px 22px;width:100%;max-width:330px;text-align:center;box-shadow:0 18px 40px rgba(30,22,50,.45);position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;}
    .ovlEcho{position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:106px;height:106px;filter:drop-shadow(0 8px 12px rgba(30,22,50,.3));}
    .ovl .big{font-size:56px;line-height:1;}
    .ovl h2{font-family:"Baloo 2";font-weight:800;font-size:24px;color:#4a2c14;line-height:1.18;}
    .ovl h2 b{color:#7048c9;}
    .ovl p{color:#b08d63;font-weight:800;font-size:14.5px;max-width:270px;}
    .statRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .statPill{background:#fff;border-radius:99px;padding:8px 15px;font-family:"Baloo 2";font-weight:800;font-size:14.5px;color:#4a2c14;box-shadow:0 3px 0 rgba(120,80,20,.12);}
    .btn{border:none;border-radius:20px;padding:15px 30px;font-family:"Baloo 2";font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 6px 0 #ef6f23;cursor:pointer;transition:transform .05s;margin-top:4px;width:100%;}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #46a302;}
    .btn.blue{background:linear-gradient(180deg,#5cc6ff,#1cb0f6);box-shadow:0 6px 0 #1480c0;}
    .btn.blue:active{box-shadow:0 2px 0 #1480c0;}
    .btn.ghost{background:none;box-shadow:none;color:#b08d63;text-transform:none;font-size:13px;width:auto;padding:8px;}
    /* Echo speaks the win: bubble with a tail toward the leap; numbers fade in later */
    #endTitle{position:relative;background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 6px 16px rgba(74,44,20,.12);display:inline-block;}
    #endTitle:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:#fff;border-radius:3px;}
    #endSub.later{display:block!important;opacity:0;font-size:12.5px;color:var(--muted,#b08d63);transition:opacity .5s ease;margin-top:2px;}
    #endSub.later.in{opacity:1;}
    /* ── end-overlay celebration: star drop + Echo leap (Duolingo-ABC three-element stack) ── */
    #endOvl .ovlCard{padding-top:24px;}
    .endStar{animation:starDrop .35s cubic-bezier(.3,1.6,.5,1) both;}
    @keyframes starDrop{0%{transform:translateY(-64px) scale(.4);opacity:0}70%{transform:translateY(6px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
    .echoWin{position:relative;width:100%;height:96px;overflow:hidden;pointer-events:none;}
    .echoWin img{position:absolute;left:50%;bottom:-40px;width:118px;margin-left:-59px;filter:drop-shadow(0 6px 8px rgba(30,22,50,.18));animation:echoLeap .5s cubic-bezier(.3,1.4,.5,1) both,echoHop 1.5s ease-in-out .6s infinite;}
    @keyframes echoLeap{0%{transform:translateY(110px)}100%{transform:translateY(0)}}
    @keyframes echoHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px) rotate(-5deg)}}
    @media (prefers-reduced-motion: reduce){ .endStar,.echoWin img{animation:none;} }
    /* ── the round's HUD, banner and card (27 Sep 2026) ── */
    #timer{color:#4a2c14;letter-spacing:0;gap:8px;}
    #timer .wv{white-space:nowrap;}
    #timer .wbar{display:block;width:64px;height:10px;border-radius:99px;background:#e9e2f6;overflow:hidden;}
    #timer .wbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4dabf7,#ff6b8a);transition:width .25s;}
    #banner{position:absolute;left:0;right:0;top:17%;text-align:center;z-index:4;pointer-events:none;opacity:0;padding:0 16px;}
    #banner .pill{display:inline-block;background:rgba(255,255,255,.95);border-radius:26px;padding:10px 26px 12px;box-shadow:0 6px 0 rgba(20,10,60,.4);}
    #banner b{display:block;font-family:"Baloo 2";font-weight:800;font-size:38px;color:#43318c;line-height:1.05;}
    #banner span{display:block;font-family:"Baloo 2";font-weight:800;font-size:17px;color:#8a6f52;margin-top:2px;}
    #banner span:empty{display:none;}
    #banner.in{animation:bannerIn 1.9s ease both;}
    @keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px)}}
    @keyframes bannerFade{0%,100%{opacity:0}15%,80%{opacity:1}}
    #revHearts{display:flex;justify-content:center;gap:8px;}
    #revHearts .wdot{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#f3e3cf;color:#b08d63;font-family:"Baloo 2";font-weight:800;font-size:17px;}
    #revHearts .wdot.on{background:#58cc02;box-shadow:0 3px 0 #46a302;}
    #revHearts .wdot svg{width:20px;height:20px;}
    @media (prefers-reduced-motion: reduce){ #banner.in{animation-name:bannerFade;} }
  </style>
  <link href="/crafted-games.css" rel="stylesheet">
</head>
<body data-crafted="tiles">
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="top">
      <button id="close">✕</button>
      <div class="hudpill"><svg viewBox="0 0 64 64" style="width:19px;height:19px;vertical-align:-4px"><rect x="8" y="14" width="48" height="36" rx="6" fill="#fff" stroke="#d8cfec" stroke-width="2"/><line x1="20" y1="14" x2="20" y2="50" stroke="#d8cfec" stroke-width="2.5"/><line x1="32" y1="14" x2="32" y2="50" stroke="#d8cfec" stroke-width="2.5"/><line x1="44" y1="14" x2="44" y2="50" stroke="#d8cfec" stroke-width="2.5"/><rect x="16" y="14" width="8" height="19" rx="2" fill="#2f2266"/><rect x="40" y="14" width="8" height="19" rx="2" fill="#2f2266"/></svg> <b id="score">0</b></div>
      <div id="hudspacer"></div>
      <div id="timer" class="hudpill"></div>
    </div>
    <div id="flash"></div>
    <div id="banner" aria-live="polite"><div class="pill"><b id="bnBig"></b><span id="bnSmall"></span></div></div>
  </div>

  <div class="ovl" id="needOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-welcome.webp" alt="" />
      <h2 id="needTitle">This game needs a ticket!</h2>
      <p>Say your sound 5 times to fill it up</p>
      <button class="btn" id="goCharge"><svg viewBox="0 0 64 64" style="width:18px;height:18px;vertical-align:-3px"><path d="M36 4 14 36h13l-5 24 24-34H33Z" fill="#ffd21c" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.5" fill="#fff" opacity=".9"/></svg> Fill my ticket!</button>
      <button class="btn ghost" id="needHome">Back home</button>
    </div>
  </div>

  <div class="ovl" id="revOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-welcome.webp" alt="" />
      <h2 id="revTitle">Say it!</h2>
      <p id="revHearts" style="font-size:26px;"></p>
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#ffa05a,#ff8a3d);box-shadow:0 4px 0 #ef6f23,0 0 0 10px rgba(255,138,61,.14);display:flex;align-items:center;justify-content:center;margin:2px 0;"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
      <p id="revListen" style="font-size:13px;">Get ready…</p>
      <button class="btn ghost" id="revDone">I'm done playing</button>
    </div>
  </div>

  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <div class="big endStar" id="endEmoji"><svg viewBox="0 0 64 64" style="width:56px;height:56px"><path d="M32 5l8.2 18.6L60 25.8 44.9 39.2 49.8 59 32 48.4 14.2 59l4.9-19.8L4 25.8l19.8-2.2Z" fill="#ffd21c"/><circle cx="25" cy="21" r="3" fill="#fff" opacity=".85"/></svg></div>
      <h2 id="endTitle">Great round!</h2>
      <p id="endSub"></p>
      <div class="echoWin"><img src="/assets/crafted/echo-welcome.webp" alt="" /></div>
      <button class="btn blue" id="endCharge">WOOHOO! Next →</button>
      <button class="btn" id="endAgain" style="display:none;"></button>
      <button class="btn ghost" id="endHome">Back home</button>
    </div>
  </div>


  <script src="/sona.js"></script>
  <script>
    // Check access before any game resources start. The earned speech token
    // remains a separate requirement; a catalog unlock never creates one.
    var gameEntryAllowed=false;
    (function () {
      var S=window.Sona, q=new URLSearchParams(location.search);
      if(!S)return;
      var earned=q.get("from")==="charge";
      if(!S.gameAccess("tiles",{run:q.get("daily")==="1",earned:earned}).allowed){S.gameBounce("tiles");return;}
      if(!earned){location.replace("/today.html");return;}
      gameEntryAllowed=true;
    })();
  </script>
  <script>
    if(gameEntryAllowed){
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    // ── the mic and this game's own sounds never overlap (24 Sep 2026) ──
    // On an iPhone a page holding the mic runs as a phone call: the volume
    // buttons change CALL volume and every chime is processed like a call.
    // So no game sound plays while the keep-playing mic is open (a sound
    // asked for then is dropped; the game is paused behind the card anyway),
    // none waits on a mic request that hasn't settled, none plays in the
    // first SETTLE_MS after the mic closes (the phone switches back in
    // silence, not under a chime), and the mic never opens until QUIET_MS
    // after the last sound began: the longest chime ("complete") rings about
    // 0.6 s and the rest covers speaker and Bluetooth delay, so a chime's
    // tail can never answer the card for the child.
    var SETTLE_MS=200, QUIET_MS=900, quietUntil=0, micClosedAt=-1e9;
    var rv={st:null,pending:0,gen:0,raf:0,t:0,ctx:null,src:null,floor:-1};   // floor: the room's quiet level, measured once per page (see listenFor)
    function sfx(n){
      if(rv.st) return;
      if(rv.pending){ setTimeout(function(){ sfx(n); },60); return; }
      var wait=micClosedAt+SETTLE_MS-performance.now();
      if(wait>0){ quietUntil=Math.max(quietUntil,performance.now()+wait+QUIET_MS); setTimeout(function(){ sfx(n); },wait); return; }
      quietUntil=Math.max(quietUntil,performance.now()+QUIET_MS);
      try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){}
    }

    // ---- charge gate + daily plumbing (same pattern as every arcade game) ----
    var SELF="arcade-tiles.html";
    var isDaily=qp.get("daily")==="1";
    function backToCharge(){ try{sessionStorage.removeItem("sona.play.active");}catch(e){} location.href="/charge.html?"+(isDaily?"daily=1":("game="+SELF)); }
    $("goCharge").onclick=backToCharge; $("needHome").onclick=function(){location.href="/today.html";};
    var tok=false; try{ var _t=sessionStorage.getItem("sona.play.token"); if(_t===SELF||_t==="1"){ tok=true; sessionStorage.setItem("sona.play.active",SELF); sessionStorage.removeItem("sona.play.token"); } else if(sessionStorage.getItem("sona.play.active")===SELF){ tok=true; } }catch(e){}
    if(!tok){ try{ $("needTitle").textContent="Piano Tiles needs a ticket!"; }catch(e){} $("needOvl").classList.add("show"); }

    var cv=$("cv"), ctx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function fit(){ var r=$("app").getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
    fit(); window.addEventListener("resize",fit);

    // ---- the music: C-major pentatonic so ANY order sounds like a song ----
    var NOTES=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
    // The notes follow Sona's Sound setting like every other game sound (24
    // Sep 2026). They ignored the slider and mute, so Settings' "Muted — the
    // games are silent" was false here, and at 0.22 they rang ~6 dB over every
    // chime. Same rule as sfxVol() in sona.js (not exported, so mirrored):
    // sound off is silent, otherwise the slider, 0.6 when never set.
    var actx=null;
    function noteVol(){ try{ var p=(S&&S.getProfile)?S.getProfile():{}; if(p.soundOn===false)return 0; var v=p.volume!=null?Number(p.volume):0.6; return isFinite(v)?Math.max(0,Math.min(1,v)):0.6; }catch(e){ return 0.6; } }
    function tone(f,dur,gain){
      // the same guard as sfx(): never over the keep-playing mic, never under
      // the phone's switch back from it (a dropped note there is one tap)
      if(rv.st||rv.pending||performance.now()<micClosedAt+SETTLE_MS) return;
      var v=noteVol(); if(!v) return;
      try{
        if(!actx){var AC=window.AudioContext||window.webkitAudioContext;actx=new AC();}
        if(actx.state==="suspended")actx.resume();
        var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
        o.type="triangle"; o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime((gain||0.10)*v,t+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.5));
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+(dur||0.5)+0.05);
        quietUntil=Math.max(quietUntil,performance.now()+QUIET_MS);
      }catch(e){}
    }

    // ---- game state ----
    var LANES=4, playing=true, score=0, comboN=0;
    var BESTK="sona.best.tiles", BEST=0; try{ BEST=parseInt(localStorage.getItem(BESTK)||"0",10)||0; }catch(e){}
    var REV=3, reviveWait=false;   // say-the-sound cards: one between songs

    // ── the round: three songs, then a grand finale (27 Sep 2026) ──
    // The round Travis said yes to for Fruit Slice ("a clear goal... It always
    // ends in a win. Missing is OK... The talking moves to between waves"),
    // for the piano, with what the review of the older games asked for: tiles
    // that play songs a child knows, a missed tile that fades while the song
    // plays on (and the next ones slow down and wait), the first tiles waiting
    // at the keys until tapped, the same speed on every screen (a tile took
    // 2.2 s to fall on a small iPhone and 0.5 s on a big iPad), the say-it
    // card between songs, and a finale whose tiles all wait for the child, so
    // every round ends in a win.
    var HZ={C:261.63,D:293.66,E:329.63,F:349.23,G:392.00,A:440.00,B:493.88};
    var LANE_OF={C:0,D:0,E:1,F:1,G:2,A:3,B:3};   // the tune's shape: higher notes further right
    var SONGS=[
      {name:"Twinkle Twinkle", notes:"CCGGAAG FFEEDDC", beat:760, fall:2.5},
      {name:"Mary Had a Little Lamb", notes:"EDCDEEE DDD EGG", beat:700, fall:2.3},
      {name:"Row, Row, Row Your Boat", notes:"CCCDE EDEFG", beat:660, fall:2.1},
      {name:"Ode to Joy", notes:"EEFGGFED CCDEEDD", beat:620, fall:2.2, finale:true}
    ];
    var song=0, songIx=0, songMs=0, nextAt=900, phase="song", missRun=0, waitLeft=3, finaleDone=false;
    var tiles=[], sparks=[], keyGlow=[-1e9,-1e9,-1e9,-1e9], echoT=-1e9;
    var HITY=function(){ return H-140; };   // the top of the keys
    function songNotes(i){ return SONGS[i].notes.replace(/ /g,""); }
    // pixels a second, so a tile takes the song's fall time on every screen
    function speedPx(){ return (HITY()+90)/(SONGS[song].fall*(missRun>=2?1.3:1)); }
    function spawn(){
      var s=SONGS[song], ch=songNotes(song).charAt(songIx++);
      tiles.push({lane:LANE_OF[ch],y:-90,h:88,hit:false,gone:false,note:HZ[ch],
        wait:!!s.finale||waitLeft>0||missRun>=2, gold:!s.finale&&song>0&&songIx>2&&Math.random()<0.12});
      if(waitLeft>0) waitLeft--;
    }
    function startSong(i){
      song=i; songIx=0; songMs=0; nextAt=900; phase="song"; missRun=0; hud();
      banner(SONGS[i].finale?"Grand finale!":"Song "+(i+1), SONGS[i].name);
    }
    function endSong(){
      phase="break"; hud();
      var last=song===SONGS.length-1, next=song+1;
      setTimeout(function(){
        if(window.__ended||!playing) return;
        banner(last?"Bravo!":"You played it!", last?"What a concert!":SONGS[song].name);
        sfx("complete"); echoT=performance.now();
        setTimeout(function(){
          if(window.__ended||!playing) return;
          if(last){ finaleDone=true; endRound(); }
          else if(SONGS[next].finale) startSong(next);   // the finale follows the third song straight away
          else sayCard("Say \u201C"+SAYTXT+"\u201D for song "+(next+1)+"!","none");
        },1700);
      },600);
    }

    // ── the HUD: this song's notes, the say-it card's songs ──
    function hud(){
      var t=$("timer"), s=SONGS[song], n=songNotes(song).length, got=phase==="break"?n:Math.min(n,songIx-tiles.filter(function(q){ return !q.hit&&!q.gone; }).length);
      t.innerHTML='<span class="wv">'+(s.finale?"Finale":"Song "+(song+1))+'</span><span class="wbar"><i style="width:'+Math.round(Math.max(0,got)/n*100)+'%"></i></span>';
      t.setAttribute("aria-label",(s.finale?"Grand finale":"Song "+(song+1)+" of 3")+": "+s.name);
    }
    var TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    function songDots(){ var s=""; for(var i=0;i<3;i++) s+='<span class="wdot'+(i<=song?' on':'')+'">'+(i<=song?TICK:String(i+1))+'</span>'; return s; }
    function banner(big,small){ var b=$("banner"); $("bnBig").textContent=big; $("bnSmall").textContent=small||""; b.classList.remove("in"); void b.offsetWidth; b.classList.add("in"); }
    function flash(t){ var f=$("flash"); f.textContent=t; f.style.opacity=1; f.style.transform="scale(1.15)"; setTimeout(function(){f.style.opacity=0;f.style.transform="scale(1)";},600); }

    // ── the say-it card, between songs ──
    function sayCard(title,snd){
      if(!playing) return;
      playing=false; tiles=[]; if(snd!=="none") sfx(snd||"tap");
      if(REV>0 && CAN_LISTEN){
        $("revTitle").textContent=title||("Say \u201C"+SAYTXT+"\u201D to keep playing!");
        $("revHearts").innerHTML=songDots();
        reviveWait=true; $("revOvl").classList.add("show"); openReviveMic();
      } else { endRound(); }
    }
    // The card's old name, from when a missed tile opened it. Kept because
    // the quiet-mic suites open the card through it.
    function crash(){ sayCard(); }
    function doRevive(){
      reviveWait=false; REV--; hud();
      $("revOvl").classList.remove("show");
      // the mic has just closed: sfx() holds this chime SETTLE_MS
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      playing=true;
      if(phase==="break") startSong(song+1);
    }
    $("revDone").onclick=function(){ closeReviveMic(); reviveWait=false; $("revOvl").classList.remove("show"); endRound(); };

    var LCOL=["#ff6b8a","#4dabf7","#69db7c","#ffd43b"];

    // ---- input: tap a lane when a tile is over the keys ----
    function laneAt(x){ return Math.max(0,Math.min(LANES-1,(x/(W/LANES))|0)); }
    var shakeT=0;
    cv.addEventListener("pointerdown",function(e){
      if(!playing)return;
      var r=cv.getBoundingClientRect(), x=(e.clientX-r.left), lane=laneAt(x);
      var zoneTop=HITY()-96, zoneBot=HITY()+70, best=null;
      for(var i=0;i<tiles.length;i++){ var t=tiles[i];
        if(t.lane===lane&&!t.hit&&!t.gone&&t.y+t.h>zoneTop&&t.y<zoneBot){ if(!best||t.y>best.y)best=t; } }
      keyGlow[lane]=performance.now();
      if(best){
        best.hit=true; comboN++; missRun=0;
        score+=best.gold?3:1; $("score").textContent=score; hud();
        tone(best.note,0.5,0.10);   // one note: the song's own
        var fin=!!SONGS[song].finale, lw=W/LANES;
        for(var k=0;k<(fin?22:best.gold?16:8);k++){ var a=Math.random()*6.28, v=(fin?3:2)+Math.random()*(fin?5:3);
          sparks.push({x:best.lane*lw+lw/2,y:fin?best.y:HITY()-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(fin?4:2),life:1,c:best.gold?"#ffd21c":fin?LCOL[(Math.random()*4)|0]:LCOL[best.lane]}); }
        if(best.gold){ flash("GOLDEN NOTE! +3"); echoT=performance.now(); }
        else if(comboN%8===0){ flash(comboN+" NOTE STREAK!"); echoT=performance.now(); }
      } else {
        comboN=0; shakeT=performance.now(); tone(130.8,0.18,0.025); // soft low thud, never a death
      }
    });

    // ---- draw ----
    var ECHO=new Image(); ECHO.src="/assets/crafted/echo-welcome.webp";
    var lastT=performance.now();
    function draw(){
      var now=performance.now(), dt=Math.min(100,now-lastT), i, l; lastT=now;
      // the song: its next tile on the beat, and none while a tile waits
      if(playing&&phase==="song"){
        var notes=songNotes(song), waiting=tiles.some(function(t){ return t.wait&&!t.hit&&!t.gone; });
        if(!waiting) songMs+=dt;
        if(songIx<notes.length&&songMs>=nextAt&&!waiting){ spawn(); nextAt=songMs+SONGS[song].beat*(missRun>=2?1.3:1); }
        if(songIx>=notes.length&&!tiles.some(function(t){ return !t.hit&&!t.gone; })) endSong();
      }
      ctx.clearRect(0,0,W,H);
      // concert spotlight (design 4: Piano Tiles)
      var sp=ctx.createRadialGradient(W/2,0,10,W/2,0,H*0.85);
      sp.addColorStop(0,"rgba(255,255,255,.10)"); sp.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=sp; ctx.fillRect(0,0,W,H);
      var lw=W/LANES, hitY=HITY();
      // lanes
      for(l=0;l<LANES;l++){ ctx.fillStyle="rgba(255,255,255,"+(l%2?0.03:0.05)+")"; ctx.fillRect(l*lw,0,lw,H); }
      for(l=1;l<LANES;l++){ ctx.fillStyle="rgba(255,255,255,.08)"; ctx.fillRect(l*lw-1,0,2,H); }
      // hit bar — the keys run all the way to the screen bottom, no dead band
      ctx.fillStyle="rgba(255,255,255,.12)";
      ctx.fillRect(0,hitY-8,W,H-(hitY-8));
      // piano keys with hard shadows; a tapped key lights up in its lane's colour
      for(l=0;l<LANES;l++){
        var kx=l*lw+5, kw=lw-10, glow=Math.max(0,1-(now-keyGlow[l])/260);
        ctx.fillStyle="rgba(0,0,0,.28)"; rr(kx,hitY-4,kw,H-(hitY-4)+12,10); ctx.fill();
        var ivory=ctx.createLinearGradient(kx,0,kx+kw,0);ivory.addColorStop(0,"#dccaab");ivory.addColorStop(.15,"#fff9e9");ivory.addColorStop(.85,"#fff5db");ivory.addColorStop(1,"#cfb98e");
        ctx.fillStyle=ivory;rr(kx,hitY-8,kw,H-(hitY-8)+12,10);ctx.fill();
        if(glow>0){ ctx.globalAlpha=glow*0.75; ctx.fillStyle=LCOL[l]; rr(kx,hitY-8,kw,H-(hitY-8)+12,10); ctx.fill(); ctx.globalAlpha=1; }
        ctx.strokeStyle="#ffffff99";ctx.lineWidth=2;rr(kx+2,hitY-6,kw-4,H-(hitY-8)+8,8);ctx.stroke();
        ctx.fillStyle="#26233f";rr(kx+kw*.66,hitY-8,kw*.30,40,5);ctx.fill();
        ctx.fillStyle="#4d4967";rr(kx+kw*.69,hitY-6,kw*.24,32,3);ctx.fill();
      }
      // screen shake on miss-tap
      var sh=now-shakeT<180 ? Math.sin(now/14)*4 : 0, fall=speedPx()*dt/1000;
      // tiles
      for(i=tiles.length-1;i>=0;i--){ var t=tiles[i];
        if(t.hit){ t.h-=10; t.y+=5; if(t.h<=6){ tiles.splice(i,1); continue; } }
        else if(t.gone){ t.fade=(t.fade==null?1:t.fade)-0.06; t.y+=fall; if(t.fade<=0){ tiles.splice(i,1); continue; } }
        else {
          t.y+=fall;
          var rest=hitY-t.h+40;   // a waiting tile stops on its key
          if(t.wait&&t.y>rest) t.y=rest;
          // a tile that slips past just fades; the song plays on
          if(!t.wait&&t.y>hitY+70){ t.gone=true; if(playing&&phase==="song"){ missRun++; comboN=0; } }
        }
        var x=t.lane*lw+6+sh, w=lw-12;
        ctx.globalAlpha=t.gone?Math.max(0,t.fade)*0.45:1;
        ctx.save();ctx.shadowColor="rgba(17,8,40,.35)";ctx.shadowOffsetY=4;ctx.shadowBlur=5;
        ctx.fillStyle=t.hit?"#fff":t.gold?"#ffd21c":LCOL[t.lane];rr(x,t.y,w,t.h,14);ctx.fill();ctx.shadowColor="transparent";
        var tileLight=ctx.createLinearGradient(0,t.y,0,t.y+t.h);tileLight.addColorStop(0,"rgba(255,255,255,.4)");tileLight.addColorStop(.55,"rgba(255,255,255,.02)");tileLight.addColorStop(1,"rgba(39,12,62,.2)");ctx.fillStyle=tileLight;rr(x,t.y,w,t.h,14);ctx.fill();
        ctx.strokeStyle="rgba(255,249,222,.6)";ctx.lineWidth=1.2;if(t.h>5){rr(x+2,t.y+2,w-4,t.h-4,12);ctx.stroke();}ctx.restore();
        if(!t.hit&&t.wait&&!t.gone&&t.y>=hitY-t.h+39){ ctx.strokeStyle="rgba(255,255,255,"+(0.55+0.45*Math.sin(now/140))+")"; ctx.lineWidth=4; rr(x-3,t.y-3,w+6,t.h+6,16); ctx.stroke();
          ctx.fillStyle="#fff"; ctx.font="800 18px 'Baloo 2',sans-serif"; ctx.textAlign="center"; ctx.fillText("Tap!",x+w/2,t.y-12); }
        if(!t.hit){ ctx.fillStyle="rgba(69,31,91,.70)"; ctx.font="800 24px 'Baloo 2',sans-serif"; ctx.textAlign="center"; ctx.fillText(t.gold?"★":"♪",x+w/2,t.y+t.h/2+9); }
        ctx.globalAlpha=1;
      }
      // sparkles over a played note; fireworks in the finale
      for(i=sparks.length-1;i>=0;i--){ var s=sparks[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=0.12; s.life-=0.025; if(s.life<=0){ sparks.splice(i,1); continue; }
        ctx.globalAlpha=s.life; ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(s.x,s.y,3+2*s.life,0,7); ctx.fill(); ctx.globalAlpha=1; }
      // Echo dances in the corner
      if(ECHO.complete&&ECHO.naturalWidth){ var hp=(now-echoT)/700, ey=hp>=0&&hp<1?-Math.sin(hp*Math.PI)*22:Math.sin(now/300)*2, es=Math.min(64,W*0.15);
        ctx.drawImage(ECHO,W-es-12,78+ey,es,es*1.07); }
      requestAnimationFrame(draw);
    }
    function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    startSong(0);
    draw();

    // ── "Say your sound to keep playing": the only time this game listens ──
    // (24 Sep 2026) STAR MODE is gone. It held the mic open for the whole
    // game so a shout could fire a power-up, which kept an iPhone in
    // phone-call audio from the first frame to the last. The mic now opens
    // only while the keep-playing card shows, after the quiet window above,
    // and closes before the revive chime. Loudness and sound-shape numbers
    // only: nothing is recorded, nothing leaves the device, and a revive is
    // play, never practice data.
    var SND="R", SAYTXT="rrrr", CAN_LISTEN=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
    (function(){
      var snd=""; try{ snd=sessionStorage.getItem("sona.boost.sound")||""; }catch(e){}
      if(!snd){ try{ snd=((S&&S.getProfile&&S.getProfile().focusSounds)||["R"])[0]; }catch(e){ snd="R"; } }
      SND=String(snd).toUpperCase(); SAYTXT=(S&&S.soundSay)?S.soundSay(SND):"rrrr";
    })();
    function listenNote(t){ try{ $("revListen").textContent=t; }catch(e){} }
    function closeReviveMic(){
      rv.gen++; clearTimeout(rv.t); if(rv.raf)cancelAnimationFrame(rv.raf); rv.raf=0;
      try{ if(rv.src)rv.src.disconnect(); }catch(e){} rv.src=null;
      if(rv.st){ try{ rv.st.getTracks().forEach(function(t){t.stop();}); }catch(e){} rv.st=null; micClosedAt=performance.now(); }
      listenNote("Get ready…");
    }
    // A request that was already late when it settled asks again if the card
    // is still up and on screen (24 Sep 2026). The phone can be locked while
    // it is asking: the ask made on the way back finds that request still
    // pending and stands down, so without this the card waited on "Get
    // ready…" for good and only "I'm done playing" got the child out.
    function askAgain(){ if(reviveWait&&!document.hidden&&!rv.st) openReviveMic(); }
    function openReviveMic(){
      if(!reviveWait||rv.st||rv.pending||document.hidden) return;
      var wait=quietUntil-performance.now();
      if(wait>0){ clearTimeout(rv.t); rv.t=setTimeout(openReviveMic,wait); return; }
      var gen=++rv.gen; rv.pending++;
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
        rv.pending--;
        // the card closed (or the page hid) while the phone was asking: this
        // stream is already late, so it goes straight back
        if(gen!==rv.gen||!reviveWait||document.hidden){ try{ st.getTracks().forEach(function(t){t.stop();}); }catch(e){} micClosedAt=performance.now(); askAgain(); return; }
        rv.st=st; listenFor(st,gen);
      }).catch(function(){
        rv.pending--;
        // a request cut short by the page hiding asks again on the way back
        if(gen!==rv.gen||!reviveWait||document.hidden){ askAgain(); return; }
        // no microphone: the card can't hear anyone, so the round ends kindly
        reviveWait=false; $("revOvl").classList.remove("show"); endRound();
      });
    }
    // ── what counts as the child on the card (24 Sep 2026) ──
    // The bar a sound must clear is 3.5× the room's quiet level, and that
    // level is the page's, not the card's: rv.floor is the 20th-percentile
    // loudness of the quietest FLOOR_MS the card's mic has heard on this
    // page, and it only ever goes DOWN. The first cut of this change
    // averaged the first 450 ms of every card instead, and a card that says
    // "Say rrrr!" opens its mic exactly when an eager child is already
    // saying it: their own voice became the "room", the bar landed above
    // it, and nothing they said could answer the card. So: a low
    // percentile, which a voice filling most of the stretch can't lift;
    // only-down, so nothing a child says ever raises it and one quiet
    // breath (or a later card) mends a floor a talking child set; and the
    // last HEARD_MS of frames are judged against the CURRENT floor, so a
    // try said before that breath still counts the moment it comes. The
    // 0.05 minimum, the 6-frame burst and the family check are unchanged.
    // "I'm listening…" shows only once there is a floor to listen against.
    var FLOOR_MS=450, HEARD_MS=3000;
    function p20(list){ var a=list.slice().sort(function(x,y){ return x-y; }); return a[Math.floor((a.length-1)*0.2)]; }
    function listenFor(st,gen){
      var an, td, fd, binHz, heard=[], said=false;
      try{
        if(!rv.ctx){ var AC=window.AudioContext||window.webkitAudioContext; rv.ctx=new AC(); }
        if(rv.ctx.state==="suspended") rv.ctx.resume();
        rv.src=rv.ctx.createMediaStreamSource(st); an=rv.ctx.createAnalyser(); an.fftSize=512; rv.src.connect(an);
        td=new Uint8Array(an.fftSize); fd=new Uint8Array(an.frequencyBinCount); binHz=rv.ctx.sampleRate/an.fftSize;
      }catch(e){ closeReviveMic(); reviveWait=false; $("revOvl").classList.remove("show"); endRound(); return; }
      // family check: the burst must SOUND like the target's family (voiced
      // vs hiss) to fire — a scream or an S can't revive an R kid. Shape
      // numbers only; nothing recorded (see Sona.frameShape).
      function famOK(shp){ if(!shp||!shp.m) return true; var cent=shp.fm/shp.m, high=shp.hm/shp.m, fam=(window.Sona&&Sona.soundFamily)?Sona.soundFamily(SND):"any"; if(fam==="low") return !(cent>1800&&high>0.22); if(fam==="hiss") return !(cent<1100&&high<0.10); return true; }
      (function tick(){
        if(gen!==rv.gen) return;
        var now=performance.now();
        // belt and braces: nothing plays while this mic is open, but if a
        // sound ever did, its frames would be dropped: never judged, never
        // part of the floor, never joined to a burst after it
        if(now<quietUntil){ heard=[]; rv.raf=requestAnimationFrame(tick); return; }
        an.getByteTimeDomainData(td);
        var sum=0; for(var i=0;i<td.length;i++){ var d=(td[i]-128)/128; sum+=d*d; }
        var shape=null; if(window.Sona&&Sona.frameShape){ an.getByteFrequencyData(fd); shape=Sona.frameShape(fd,binHz); }
        heard.push({t:now,r:Math.sqrt(sum/td.length),s:shape});
        while(now-heard[0].t>HEARD_MS) heard.shift();
        if(now-heard[0].t>=FLOOR_MS){
          var w=[]; for(var k=heard.length-1;k>=0&&now-heard[k].t<=FLOOR_MS;k--) w.push(heard[k].r);
          var q=p20(w); if(rv.floor<0||q<rv.floor) rv.floor=q;
        }
        if(rv.floor>=0){
          if(!said){ said=true; listenNote("I'm listening…"); }
          var thr=Math.max(0.05,rv.floor*3.5), voiced=0, shp=null;
          for(var j=0;j<heard.length;j++){ var f=heard[j];
            if(f.r>thr){ voiced++;
              if(f.s){ if(!shp)shp={m:0,fm:0,hm:0}; shp.m+=f.s.m; shp.fm+=f.s.fm; shp.hm+=f.s.hm; }
              if(voiced>=6){ if(!famOK(shp)){ voiced=0; shp=null; } else { closeReviveMic(); doRevive(); return; } } }
            else { voiced=0; shp=null; } }
        }
        rv.raf=requestAnimationFrame(tick);
      })();
    }
    // lock/app-switch fires visibilitychange, NOT pagehide — a mic left open
    // there stays lit in a pocket. Coming back to the card listens again.
    if(window.Sona&&Sona.onBackground) Sona.onBackground(closeReviveMic); else window.addEventListener("pagehide",closeReviveMic);
    document.addEventListener("visibilitychange",function(){ if(!document.hidden&&reviveWait) openReviveMic(); });

    // ---- round over ----
    function bankAndContinue(){ S.finishGameTurn("tiles",score); location.href="/charge.html?daily=1&banked="+score; }
    function endRound(){
      closeReviveMic();
      if(window.__ended)return; window.__ended=true;
      S.finishGameTurn("tiles",isDaily?score:null);
      playing=false; reviveWait=false; phase="done";
      var isBest=score>BEST; if(isBest){ BEST=score; try{ localStorage.setItem(BESTK,String(BEST)); }catch(e){} }
      var coins=Math.min(10,(score/5)|0);
      try{ if(coins&&S&&S.addCoins)S.addCoins(coins); }catch(e){}
      sfx("complete"); try{ if(S&&S.confetti)S.confetti(); }catch(e){}
      if(isDaily){
        if(score===0){ $("endEmoji").style.opacity=".25"; } // gentle zero tier: dim the star, keep it warm
        $("endTitle").textContent=score===0?"Good try!":("+"+score+" points!");
        $("endSub").textContent=score===0?"On to the next game…":"Banking your score…";
        $("endCharge").style.display="none"; $("endAgain").style.display="none"; $("endHome").style.display="none";
        $("endOvl").classList.add("show");
        setTimeout(bankAndContinue,1400);
        return;
      }
      if(score===0){
        // gentle zero tier: encouraging copy, dimmed star, happy Echo, one warm "again" button
        $("endEmoji").style.opacity=".25";
        $("endTitle").textContent="Good try! Wanna go again?";
        $("endSub").className=""; $("endSub").style.display="none";
        $("endCharge").style.display="none";
        var ea=$("endAgain"); ea.textContent="Yes! Play again"; ea.style.display=""; ea.onclick=backToCharge;
        $("endOvl").classList.add("show");
        return;
      }
      // one reward per moment: star + one line + Echo — no stat rows or coin counters here
      $("endTitle").textContent=finaleDone?"Bravo! You played four songs!":score>=30?"You\u2019re a piano star! My feathers were dancing!":"What beautiful music we made!";
      var _es=$("endSub"); _es.textContent=score+" notes · Best: "+BEST; _es.className="later";
      setTimeout(function(){ _es.classList.add("in"); },1000);
      $("endOvl").classList.add("show");
    }
    $("endCharge").onclick=function(){ location.href=isDaily?"/charge.html?daily=1":(S.gameAccess("stack").allowed?"/charge.html?game=arcade-stack.html":"/activities.html"); };
    $("endHome").onclick=function(){ S.finishGameTurn("tiles"); location.href="/today.html#play"; };
    $("close").onclick=function(){ closeReviveMic(); S.finishGameTurn("tiles"); if(playing){ playing=false; } if(isDaily){ bankAndContinue(); return; } location.href="/today.html#play"; };
    }
  </script>
