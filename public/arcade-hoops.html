<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Hoops</title>
  <link href="/fonts.css" rel="stylesheet">
  <link href="/action.css" rel="stylesheet">
  <link href="/sayplay.css" rel="stylesheet">
  <meta name="theme-color" content="#fff3e0" />
  <!--
    Hoops: the first Say & Play game rebuilt as a real game (suggested ages
    5-8; Travis, 26 Sep 2026: "if its basketball, we want them shooting a
    hoop"). Say the word, get a basketball, flick it into a hoop that glides
    side to side; a miss comes back to flick again; eight baskets win.
    Written by hand, not by tools/gameart/build.mjs: the court is drawn and
    played in /hoops.js, and every word turn, the mic and its quiet rules are
    /sayplay.js's, as in every Say & Play game. Its start card is the same
    teal "Let's play" pill the builder writes (tools/gameart/page.mjs), by hand.
  -->
  <style>
    :root{--top:#fff3e0;--bottom:#f0d2a8;}
    /* the court is taller than a picture scene: the ball needs room to fly */
    #stageWrap.court{width:min(100%,calc(58dvh * .79));background:#FFE9C8;}
    #court{display:block;width:100%;aspect-ratio:440/560;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;}
    #courtEcho{position:absolute;left:3%;bottom:2%;width:16%;max-width:74px;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(90,50,15,.25));}
    #courtEcho.hop{animation:echoHop .9s cubic-bezier(.3,1.5,.5,1);}
    @keyframes echoHop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-34%) rotate(-10deg)}60%{transform:translateY(0) rotate(6deg)}80%{transform:translateY(-10%)}}
    @media (prefers-reduced-motion: reduce){ #courtEcho.hop{animation:none;} }
  </style>
  <link href="/crafted-games.css" rel="stylesheet">
  <link href="/crafted-hoops.css" rel="stylesheet">
</head>
<body data-phase="boot" data-crafted="hoops">
  <div id="app">
    <div id="top">
      <button id="close" aria-label="Back">✕</button>
      <span class="hudpill"><span id="ttl">Hoops</span></span>
      <span id="spacer"></span>
      <span class="hudpill" id="dots" role="img" aria-label="0 of 8"></span>
    </div>
    <div id="stageWrap" class="court">
      <canvas id="court" role="img" aria-label="A basketball court. The hoop glides from side to side. Say the word to get the ball, then flick it up into the hoop."></canvas>
      <img id="courtEcho" src="/assets/crafted/echo-welcome.webp" alt="" />
    </div>
    <div id="turnPanel" aria-live="polite">
      <div id="picBox"><span id="pic"></span></div>
      <div id="word"></div>
      <button id="hear" aria-label="Hear it again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="#1cb0f6"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1cb0f6" stroke-width="2.2" stroke-linecap="round"/></svg><span>Hear it</span></button>
      <div id="listenRow">
        <span id="echoWrap"><img id="echoFace" src="/assets/crafted/echo-welcome.webp" alt="Echo" /></span>
        <span id="micState"></span>
        <span id="cheer"></span>
        <button id="micBtn" hidden aria-label="Listen again"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <div class="ovl" id="startOvl">
    <div class="ovlCard">
      <h2 id="startTitle">Hoops</h2>
      <p>Say the word to get the ball. Then swipe up to shoot it into the hoop!</p>
      <p class="small" id="startSound"></p>
      <button id="startBtn" class="act-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z" fill="#fff"/></svg><span>Let's play</span></button>
    </div>
  </div>
  <div class="ovl" id="primer">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-welcome.webp" alt="" />
      <h2>Let Echo hear you!</h2>
      <p>Say each word to get the ball.</p>
      <p class="small" id="micPromise"></p>
      <button class="btn" id="primerYes">Turn on Echo's ears</button>
      <button class="ghost" id="primerNo">Not now</button>
    </div>
  </div>
  <div class="ovl" id="pauseOvl">
    <div class="ovlCard">
      <img class="ovlEcho" src="/assets/crafted/echo-welcome.webp" alt="" />
      <h2>Paused</h2>
      <button class="btn" id="resume">Keep playing</button>
    </div>
  </div>
  <div class="ovl" id="endOvl">
    <div class="ovlCard">
      <img class="ovlEcho endStar" src="/assets/crafted/echo-welcome.webp" alt="" />
      <h2 id="endTitle"></h2>
      <p id="endSub"></p>
      <button class="btn" id="again">Play again</button>
      <button class="ghost" id="goHome">Back home</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script src="/crafted-words.js"></script>
  <script src="/sayplay.js"></script>
  <script src="/hoops.js"></script>
  <script>
    // The court's own sounds, made on the phone and played through the
    // engine, so they wait for a closed mic like every chime.
    function hoopsNoise(ctx, vol, dur, f0, f1, gain) {
      var n = Math.round(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.6);
      var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime;
      src.buffer = buf; bp.type = "bandpass"; bp.Q.value = 1.1;
      bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(gain * vol, t); src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t); src.stop(t + dur + 0.02);
    }
    function hoopsTone(ctx, vol, f, dur, gain, type, fEnd) {
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain * vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    SayPlay.start({
      key: "hoops", title: "Hoops",
      steps: [[], [], [], [], [], [], [], []], finale: [],
      done: { title: "Hoops star!", sub: "Eight words, eight baskets. What a shooter!" },
      play: window.Hoops,
      sounds: {
        swish: function (ctx, vol) { hoopsNoise(ctx, vol, 0.42, 4200, 1300, 0.5); hoopsTone(ctx, vol, 1046.5, 0.25, 0.06, "sine"); },
        clank: function (ctx, vol) { hoopsTone(ctx, vol, 1180, 0.22, 0.12, "triangle"); hoopsTone(ctx, vol, 1790, 0.18, 0.06, "sine"); },
        bounce: function (ctx, vol) { hoopsTone(ctx, vol, 150, 0.16, 0.3, "sine", 70); },
        whoosh: function (ctx, vol) { hoopsNoise(ctx, vol, 0.28, 700, 2600, 0.28); },
      },
      soundMs: { swish: 450, clank: 250, bounce: 200, whoosh: 300 },
    });
  </script>
</body>
</html>
