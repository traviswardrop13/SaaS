<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Sound Rocket</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b1437" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --muted:#9fb3d6; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:#0b1437;color:#eaf2ff;}
    #app{height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}

    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;z-index:6;}
    #close{border:none;background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;line-height:1;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;color:#fff;}
    .stat.count{margin-left:auto;}

    /* the climbing world: one tall scene, scrolled by the camera */
    #stage{flex:1;position:relative;overflow:hidden;}
    #world{position:absolute;left:0;right:0;bottom:0;height:500%;transition:transform 1.3s cubic-bezier(.45,0,.25,1);
      background:linear-gradient(to top,
        #eafaff 0%, #cdeffd 7%, #9bd8ff 16%, #6fc0ff 26%,
        #4a93ec 40%, #356bd6 52%, #2a4aa0 64%, #1a2c6b 76%, #101a44 88%, #0a1130 100%);}
    #ground{position:absolute;left:0;right:0;bottom:0;height:3.2%;background:linear-gradient(180deg,#86d873,#4fae46);}
    #ground:before{content:"";position:absolute;top:-7px;left:0;right:0;height:10px;background:#9be086;border-radius:50%;}
    .cloud{position:absolute;background:#fff;border-radius:99px;opacity:.96;box-shadow:24px 6px 0 -4px #fff, -22px 8px 0 -6px #fff;}
    .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.8s ease-in-out infinite;}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
    #moon{position:absolute;left:50%;transform:translateX(-50%);bottom:95.5%;width:118px;height:118px;border-radius:50%;
      background:radial-gradient(circle at 38% 34%,#ffffff,#e3e9f4 55%,#c4cddd);box-shadow:0 0 44px rgba(220,232,255,.45);}
    #moon:after{content:"";position:absolute;top:30%;left:26%;width:16px;height:16px;border-radius:50%;background:rgba(150,165,195,.4);box-shadow:34px 22px 0 -3px rgba(150,165,195,.35),12px 44px 0 -5px rgba(150,165,195,.3);}

    /* rocket stays on screen; the world scrolls past it */
    #rocketWrap{position:absolute;bottom:33%;left:50%;transform:translateX(-50%);width:120px;display:flex;flex-direction:column;align-items:center;z-index:5;}
    #rocketWrap.boost{animation:boost .12s linear infinite;}
    @keyframes boost{0%{transform:translateX(-50%) translateY(-9px) rotate(-1.4deg)}100%{transform:translateX(-50%) translateY(-12px) rotate(1.4deg)}}
    #rocketSvg,#rocketArt{width:92px;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
    #flame{width:32px;height:0;margin-top:-4px;border-radius:0 0 50% 50%/0 0 100% 100%;
      background:linear-gradient(180deg,#fff3b0,#ff9600 55%,#ff4b4b);transition:height .12s linear,opacity .12s;opacity:0;
      clip-path:polygon(20% 0,80% 0,100% 60%,50% 100%,0 60%);}
    #flame.on{animation:flick .09s infinite alternate;}
    @keyframes flick{from{transform:scaleX(.85)}to{transform:scaleX(1.15)}}

    /* altitude rail */
    #rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:14px;z-index:6;}
    .tick{display:flex;align-items:center;justify-content:flex-end;gap:7px;}
    .tick .tl{font-size:10.5px;font-weight:800;color:#fff;opacity:.55;text-shadow:0 1px 3px rgba(0,0,0,.5);}
    .tick .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.65);}
    .tick.on .tl{opacity:1;}
    .tick.on .dot{background:#ffd400;border-color:#fff;box-shadow:0 0 10px #ffd400;}

    /* Leo */
    #leoWrap{position:absolute;left:10px;bottom:34%;width:78px;z-index:5;pointer-events:none;}
    #leoWrap.react{animation:pop .55s ease;}
    #leo{width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));}
    @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.14) translateY(-8px)}60%{transform:scale(.96)}100%{transform:scale(1)}}

    /* bottom */
    #bottom{padding:8px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;
      background:linear-gradient(180deg,rgba(10,16,40,0),rgba(10,16,40,.62));z-index:6;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:15px;color:#fff;min-height:20px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.4);}
    #fuelWrap{width:min(86vw,320px);}
    #fuelTop{display:flex;justify-content:space-between;font-family:"Baloo 2";font-weight:800;font-size:12px;color:#dce8ff;margin-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.4);}
    #fuel{height:16px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;}
    #fuelFill{height:100%;width:0;background:linear-gradient(90deg,#58cc02,#ffd400,#ff7a00);border-radius:99px;transition:width .12s linear;}
    #sayCard{background:rgba(255,255,255,.96);border-radius:18px;padding:8px 22px;display:flex;align-items:center;gap:12px;}
    #sayCard b{font-family:"Baloo 2";font-weight:800;font-size:26px;color:var(--blue-d);}
    #hear{border:none;background:none;cursor:pointer;font-size:22px;}
    .mic{width:90px;height:90px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 30%,#5cc6ff,#1cb0f6 60%,#1597d4);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d),inset 0 3px 7px rgba(255,255,255,.45);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);}
    .mic.rec{animation:pulse 1.4s infinite;} .mic svg{width:40px;height:40px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:40px;} .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 16px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}

    /* win */
    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#0a1130,#1a2c6b);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;}
    #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));animation:pop .6s ease;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:31px;color:#fff;margin-top:10px;}
    #win .reward{background:rgba(255,255,255,.12);border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:22px;color:#fff;margin-top:18px;}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    #win a{margin-top:14px;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none;}
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat">Isolation</span>
      <span class="stat count"><span id="count">0</span>/<span id="goal">4</span></span>
    </div>

    <div id="stage">
      <div id="world">
        <div id="moon"></div>
        <!-- stars + clouds injected by JS -->
        <div id="ground"></div>
      </div>
      <div id="rail"></div>
      <div id="leoWrap"><img id="leo" src="/coach/leo.png" alt="Leo" /></div>
      <div id="rocketWrap">
        <img id="rocketArt" alt="" style="display:none;" />
        <svg id="rocketSvg" viewBox="0 0 80 150" fill="none">
          <path d="M40 8 C55 26 60 50 60 86 L20 86 C20 50 25 26 40 8 Z" fill="#f4f6fb" stroke="#cfd8ea" stroke-width="2"/>
          <path d="M40 8 C47 18 51 28 53 40 L27 40 C29 28 33 18 40 8 Z" fill="#ff6b6b"/>
          <circle cx="40" cy="54" r="11" fill="#bfe3ff" stroke="#7fb6dd" stroke-width="3"/>
          <path d="M20 86 L7 112 L20 104 Z" fill="#ff6b6b"/>
          <path d="M60 86 L73 112 L60 104 Z" fill="#ff6b6b"/>
          <path d="M20 86 L60 86 L54 108 L26 108 Z" fill="#eef2f8" stroke="#cfd8ea" stroke-width="2"/>
        </svg>
        <div id="flame"></div>
      </div>
    </div>

    <div id="bottom">
      <div id="prompt">Say your sound to launch!</div>
      <div id="fuelWrap"><div id="fuelTop"><span>FUEL</span><span id="fuelPct">0%</span></div><div id="fuel"><div id="fuelFill"></div></div></div>
      <div id="sayCard"><b id="sayText">rrr</b><button id="hear" title="Hear it"><svg viewBox="0 0 24 24" fill="none" stroke="#1597d4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;display:block;"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
      <button class="mic" id="micBtn" title="Say it">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div id="win">
    <img class="leoWin" src="/coach/poses/leo-celebrate.png" alt="Leo celebrating" onerror="this.onerror=null;this.src='/coach/leo.png';" />
    <h1 id="winTitle">You reached the Moon! 🌙</h1>
    <div class="reward"><span id="winCount">0</span><small>space boosts</small></div>
    <div class="reward" id="winUnlock" style="color:var(--orange-d);background:rgba(255,200,0,.16);"></div>
    <button class="btn" id="again">Fly again</button>
    <a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var profile = (window.Sona ? Sona.getProfile() : { focusSounds:["R"], voiceId:"", volume:0.8 });
    var params = new URLSearchParams(location.search);
    var SOUND = (params.get("sound") || (profile.focusSounds && profile.focusSounds[0]) || "R").toUpperCase();
    if(!(window.Sona && Sona.WORDS && Sona.WORDS[SOUND])) SOUND="R";
    var SAYIT = { R:"rrr", S:"sss", L:"lll", K:"k, k, k", G:"g, g, g", F:"fff", SH:"shh", CH:"ch, ch", TH:"th, th", Z:"zzz", V:"vvv", J:"j, j" };
    var SAY = SAYIT[SOUND] || SOUND.toLowerCase();
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    // farther destinations as levels climb: Moon → Mars → Saturn (same game, longer trip)
    var DEST = DIFF<=3 ? { title:"You reached the Moon! 🌙", color:"radial-gradient(circle at 38% 34%,#ffffff,#e3e9f4 55%,#c4cddd)",
        way:["Land","the Sky","above the clouds","Space","the Moon"], rail:["Land","Sky","Clouds","Space","Moon"] }
      : DIFF<=6 ? { title:"You landed on Mars! 🔴", color:"radial-gradient(circle at 38% 34%,#ffd2a8,#e8794a 55%,#b8472a)",
        way:["Land","the Sky","above the clouds","Space","deep space","Mars"], rail:["Land","Sky","Clouds","Space","Deep","Mars"] }
      : { title:"You orbited Saturn! 🪐", color:"radial-gradient(circle at 38% 34%,#fff0c2,#e8c878 55%,#c89a4a)",
        way:["Land","the Sky","above the clouds","Space","into orbit","deep space","Saturn"], rail:["Land","Sky","Clouds","Space","Orbit","Deep","Saturn"] };
    var WAYPOINTS = DEST.way;
    var RAIL = DEST.rail;
    var GOAL = WAYPOINTS.length - 1; // legs of the journey

    /* build the tall world: stars (upper bands), clouds (low-mid band), altitude rail */
    (function(){
      var w=$("world"), html="";
      for(var i=0;i<46;i++){ var x=Math.random()*100, y=58+Math.random()*40, d=(Math.random()*2.8).toFixed(2); html+='<span class="star" style="left:'+x+'%;bottom:'+y+'%;animation-delay:'+d+'s;"></span>'; }
      // a fluffy cloud layer around the "above the clouds" altitude
      var clouds=[[18,30,40],[64,33,30],[40,37,52],[80,40,34],[10,42,30]];
      clouds.forEach(function(c){ html+='<span class="cloud" style="left:'+c[0]+'%;bottom:'+c[1]+'%;width:'+c[2]+'px;height:'+(c[2]*0.42)+'px;"></span>'; });
      $("moon").insertAdjacentHTML("afterend", html);
      var r=$("rail"); RAIL.forEach(function(name,i){ var t=document.createElement("div"); t.className="tick"+(i===0?" on":""); t.id="tick"+i; t.innerHTML='<span class="tl">'+name+'</span><span class="dot"></span>'; r.appendChild(t); });
      var mn=$("moon"); if(mn&&DEST.color)mn.style.background=DEST.color;
    })();
    function markRail(level){ for(var i=0;i<=level;i++){ var t=$("tick"+i); if(t)t.classList.add("on"); } }

    /* art auto-upgrade (rocket art drops in from /coach/rocket/rocket.png) */
    (function(){ var im=new Image(); im.onload=function(){ var a=$("rocketArt"); a.src="/coach/rocket/rocket.png"; a.style.display="block"; $("rocketSvg").style.display="none"; }; im.src="/coach/rocket/rocket.png"; })();

    /* audio */
    var audioCtx=null;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    function playPCM(b){ return new Promise(function(res){ try{ var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start(); }catch(e){res();} }); }
    var speaking=false;
    function say(t){ return new Promise(function(res){ if(!t||speaking)return res(); speaking=true; fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){return b?playPCM(new Uint8Array(b)):null;}).catch(function(){}).finally(function(){speaking=false;res();}); }); }
    function whoosh(){ try{ var ctx=getCtx(),dur=1.0,n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5); var s=ctx.createBufferSource();s.buffer=buf; var f=ctx.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(260,ctx.currentTime);f.frequency.exponentialRampToValueAtTime(2400,ctx.currentTime+dur);f.Q.value=.7; var g=ctx.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8)*0.5; s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(); }catch(e){} }

    /* Leo */
    var LEO={ idle:"/coach/leo.png", cheer:"/coach/poses/leo-celebrate.png", listen:"/coach/poses/leo-listen.png" };
    Object.keys(LEO).forEach(function(k){ var im=new Image(); im.src=LEO[k]; });
    function setLeo(s){ var el=$("leo"); if(el&&LEO[s]) el.src=LEO[s]; }
    function leoReact(){ var w=$("leoWrap"); if(!w)return; w.classList.remove("react"); void w.offsetWidth; w.classList.add("react"); }

    var micStream=null;
    function setFlame(p){ var f=$("flame"); f.style.height=(p*46)+"px"; f.style.opacity=p>0.02?"1":"0"; f.classList.toggle("on",p>0.02); }
    function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

    var fuel=0;
    function setFuel(p){ fuel=Math.max(0,Math.min(100,p)); $("fuelFill").style.width=fuel+"%"; $("fuelPct").textContent=Math.round(fuel)+"%"; setFlame(fuel/100); }

    function fuelPhase(){
      return new Promise(function(resolve){
        var done=false, raf=null, src=null, micBtn=$("micBtn"), ico=micBtn.querySelector("svg"), bars=null, voicedEver=false;
        micBtn.classList.add("rec");
        function finish(){ if(done)return; done=true; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} micBtn.classList.remove("rec"); micBtn.onclick=null; if(bars)bars.remove(); if(ico)ico.style.display=""; resolve(); }
        micBtn.onclick=function(){ setFuel(fuel+13); if(fuel>=100) finish(); }; // tap fallback
        try{
          if(micStream){
            var ctx=getCtx(); src=ctx.createMediaStreamSource(micStream); var an=ctx.createAnalyser(); an.fftSize=512; src.connect(an);
            var fd=new Uint8Array(an.frequencyBinCount), td=new Uint8Array(an.fftSize);
            bars=document.createElement("div"); bars.className="wavebars"; for(var b=0;b<7;b++)bars.appendChild(document.createElement("i")); if(ico)ico.style.display="none"; micBtn.appendChild(bars);
            var t0=performance.now(), nSum=0, nN=0, thr=0;
            (function tick(){ if(done)return;
              an.getByteFrequencyData(fd); [].forEach.call(bars.children,function(el,k){ el.style.height=(8+fd[2+k*3]/255*30)+"px"; });
              an.getByteTimeDomainData(td); var sum=0; for(var i=0;i<td.length;i++){var x=(td[i]-128)/128;sum+=x*x;} var rms=Math.sqrt(sum/td.length), now=performance.now();
              if(now-t0<300){ nSum+=rms; nN++; }
              else{ if(!thr) thr=Math.min(0.12,Math.max(0.02,(nSum/Math.max(1,nN))*3));
                if(rms>thr){ if(!voicedEver){ voicedEver=true; $("prompt").textContent="Keep going! 🚀"; } setFuel(fuel+0.9); }
                else { setFuel(fuel-0.12); }
                if(fuel>=100){ finish(); return; }
              }
              raf=requestAnimationFrame(tick);
            })();
          }
        }catch(e){}
        setTimeout(function(){ if(!done){ setFuel(100); finish(); } }, 15000); // never stuck
      });
    }

    // fly up one altitude band — the world scrolls, the rocket holds on screen
    function climbTo(level){
      return new Promise(function(resolve){
        whoosh(); if(window.Sona&&Sona.sfx&&Sona.sfx.complete)Sona.sfx.complete();
        setLeo("cheer"); leoReact();
        var fl=$("flame"); setFlame(1); fl.classList.add("on");
        var rw=$("rocketWrap"); rw.classList.add("boost");
        $("world").style.transform="translateY("+((level/GOAL)*80)+"%)";
        markRail(level);
        if(level>=GOAL && window.Sona&&Sona.confetti) Sona.confetti();
        setTimeout(function(){ rw.classList.remove("boost"); setFlame(0); resolve(); }, 1300);
      });
    }

    var done=0; // legs completed
    async function run(){
      for(done=0; done<GOAL; ){
        setFuel(0);
        var target=WAYPOINTS[done+1];
        $("sayText").textContent=SAY; setLeo("listen");
        $("prompt").textContent="Listen to Leo…";
        await say("Say "+SAY+" to fly to "+target+"!");
        $("prompt").textContent="Say "+SAY+" to fly to "+target+"!";
        await fuelPhase();
        $("prompt").textContent="Whoosh — up to "+target+"! 🚀";
        await climbTo(done+1);
        done++; $("count").textContent=done;
        if(window.Sona&&Sona.addCoins)Sona.addCoins(5);
        setLeo("idle");
        await wait(450);
      }
      finishGame();
    }

    function finishGame(){
      var earned=20;
      if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{ var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}"); GS[SOUND]=GS[SOUND]||{}; GS[SOUND].rocket={done:true}; GS.lastPlayDay=new Date().toISOString().slice(0,10); localStorage.setItem("sona.games.v1",JSON.stringify(GS)); }catch(e){}
      $("winCount").textContent=done;
      $("winUnlock").textContent="+"+earned+" 🪙";
      var _wt=$("winTitle"); if(_wt)_wt.textContent=DEST.title;
      $("win").classList.add("show");
      if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win"));
      if(window.Sona){ Sona.confetti&&Sona.confetti(); Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin(); }
    }

    function startGame(){
      $("win").classList.remove("show");
      $("world").style.transition="none"; $("world").style.transform="translateY(0)"; void $("world").offsetWidth; $("world").style.transition="";
      RAIL.forEach(function(_,i){ var t=$("tick"+i); if(t) t.classList.toggle("on", i===0); });
      setFuel(0); $("count").textContent="0"; $("goal").textContent=GOAL; setLeo("idle");
      run();
    }

    (async function(){
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      $("hear").onclick=function(){ say(SAY); };
      $("again").onclick=startGame;
      if(window.Sona&&Sona.music) Sona.music.start();
      startGame();
    })();

    // return to this sound's ladder (Sound → ladder → games)
    (function(){ var lad="/map.html";
      var c=$("close"); if(c) c.onclick=function(){ location.href=lad; };
      Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){ a.setAttribute("href",lad); });
    })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  </script>
</body>
</html>
