<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Sound Rocket</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b1437" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --ink:#eaf2ff; --muted:#9fb3d6; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:#0b1437;color:var(--ink);}
    #app{height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}

    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;z-index:5;}
    #close{border:none;background:none;color:#6f86b8;font-size:24px;font-weight:800;cursor:pointer;line-height:1;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;color:#fff;}
    .stat.count{margin-left:auto;}

    /* sky stage */
    #stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#0b1437 0%,#16235c 55%,#27408b 100%);}
    .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.85;animation:tw 2.6s ease-in-out infinite;}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
    #ground{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(180deg,#3a2a5e,#241a3d);}
    #pad{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:120px;height:14px;border-radius:8px;background:#4a5b86;box-shadow:0 6px 0 0 #2c3960;}

    #rocketWrap{position:absolute;bottom:66px;left:50%;transform:translateX(-50%);width:120px;display:flex;flex-direction:column;align-items:center;z-index:3;}
    #rocketWrap.idle{animation:hover 2.4s ease-in-out infinite;}
    @keyframes hover{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
    #rocketWrap.launch{transition:transform 1.3s cubic-bezier(.5,0,.7,.4),opacity 1.3s ease;transform:translateX(-50%) translateY(-118vh) rotate(2deg);opacity:.2;}
    #rocketSvg,#rocketArt{width:96px;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));}
    #flame{width:34px;height:0;margin-top:-4px;border-radius:0 0 50% 50%/0 0 100% 100%;
      background:linear-gradient(180deg,#fff3b0,#ff9600 55%,#ff4b4b);filter:blur(.5px);transition:height .12s linear,opacity .12s;opacity:0;
      clip-path:polygon(20% 0,80% 0,100% 60%,50% 100%,0 60%);}
    #flame.on{animation:flick .09s infinite alternate;}
    @keyframes flick{from{transform:scaleX(.9)}to{transform:scaleX(1.12)}}

    /* bottom */
    #bottom{padding:8px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;
      background:linear-gradient(180deg,rgba(11,20,55,0),rgba(11,20,55,.6));z-index:5;}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:15px;color:#cfe0ff;min-height:20px;text-align:center;}
    #fuelWrap{width:min(86vw,320px);}
    #fuelTop{display:flex;justify-content:space-between;font-family:"Baloo 2";font-weight:800;font-size:12px;color:#bcd0f4;margin-bottom:4px;}
    #fuel{height:16px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;}
    #fuelFill{height:100%;width:0;background:linear-gradient(90deg,#58cc02,#ffd400,#ff7a00);border-radius:99px;transition:width .12s linear;}
    #sayCard{background:rgba(255,255,255,.95);border-radius:18px;padding:8px 22px;display:flex;align-items:center;gap:12px;}
    #sayCard b{font-family:"Baloo 2";font-weight:800;font-size:26px;color:var(--blue-d);}
    #hear{border:none;background:none;cursor:pointer;font-size:22px;}
    .mic{width:92px;height:92px;border-radius:50%;border:none;background:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);}
    .mic.rec{animation:pulse 1.4s infinite;} .mic svg{width:40px;height:40px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:40px;} .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 16px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}

    /* Leo */
    #leoWrap{position:absolute;left:10px;bottom:74px;width:84px;z-index:4;animation:hover 3s ease-in-out infinite;pointer-events:none;}
    #leoWrap.react{animation:pop .55s ease;}
    #leo{width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));}
    @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.14) translateY(-8px)}60%{transform:scale(.96)}100%{transform:scale(1)}}

    /* win */
    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#0b1437,#27408b);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;}
    #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));animation:pop .6s ease;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:32px;color:#fff;margin-top:10px;}
    #win .reward{background:rgba(255,255,255,.12);border-radius:18px;padding:14px 22px;font-family:"Baloo 2";font-weight:800;font-size:24px;color:#fff;margin-top:18px;}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    #win a{margin-top:14px;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none;}
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat">🔊 Isolation</span>
      <span class="stat count">🚀 <span id="count">0</span>/<span id="goal">3</span></span>
    </div>

    <div id="stage">
      <div id="leoWrap"><img id="leo" src="/coach/leo.png" alt="Leo" /></div>
      <div id="rocketWrap" class="idle">
        <img id="rocketArt" alt="" style="display:none;" />
        <svg id="rocketSvg" viewBox="0 0 80 150" fill="none">
          <path d="M40 8 C55 26 60 50 60 86 L20 86 C20 50 25 26 40 8 Z" fill="#f4f6fb" stroke="#cfd8ea" stroke-width="2"/>
          <path d="M40 8 C47 18 51 28 53 40 L27 40 C29 28 33 18 40 8 Z" fill="#ff6b6b"/>
          <circle cx="40" cy="54" r="11" fill="#bfe3ff" stroke="#7fb6dd" stroke-width="3"/>
          <path d="M20 86 L7 112 L20 104 Z" fill="#ff6b6b"/>
          <path d="M60 86 L73 112 L60 104 Z" fill="#ff6b6b"/>
          <path d="M20 86 L60 86 L54 108 L26 108 Z" fill="#eef2f8" stroke="#cfd8ea" stroke-width="2"/>
        </svg>
        <div id="flame"></div>
      </div>
      <div id="pad"></div>
      <div id="ground"></div>
    </div>

    <div id="bottom">
      <div id="prompt">Say your sound to fuel the rocket!</div>
      <div id="fuelWrap"><div id="fuelTop"><span>FUEL</span><span id="fuelPct">0%</span></div><div id="fuel"><div id="fuelFill"></div></div></div>
      <div id="sayCard"><b id="sayText">rrr</b><button id="hear" title="Hear it">🔊</button></div>
      <button class="mic" id="micBtn" title="Say it">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div id="win">
    <img class="leoWin" src="/coach/poses/leo-celebrate.png" alt="Leo celebrating" onerror="this.onerror=null;this.src='/coach/leo.png';" />
    <h1 id="winTitle">Blast off! 🚀</h1>
    <div class="reward"><span id="winCount">0</span><small>rockets launched</small></div>
    <div class="reward" id="winUnlock" style="color:var(--orange-d);background:rgba(255,200,0,.16);"></div>
    <button class="btn" id="again">Launch again</button>
    <a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var profile = (window.Sona ? Sona.getProfile() : { focusSounds:["R"], voiceId:"", volume:0.8 });
    var params = new URLSearchParams(location.search);
    var SOUND = (params.get("sound") || (profile.focusSounds && profile.focusSounds[0]) || "R").toUpperCase();
    if(!(window.Sona && Sona.WORDS && Sona.WORDS[SOUND])) SOUND="R";
    var SAYIT = { R:"rrr", S:"sss", L:"lll", K:"k, k, k", G:"g, g, g", F:"fff", SH:"shh", CH:"ch, ch", TH:"th, th", Z:"zzz", V:"vvv", J:"j, j" };
    var SAY = SAYIT[SOUND] || SOUND.toLowerCase();
    var GOAL = 3;

    /* stars */
    (function(){ var s=$("stage"),html=""; for(var i=0;i<40;i++){ var x=Math.random()*100, y=Math.random()*70, d=(Math.random()*2.6).toFixed(2); html+='<span class="star" style="left:'+x+'%;top:'+y+'%;animation-delay:'+d+'s;"></span>'; } s.insertAdjacentHTML("afterbegin",html); })();

    /* art auto-upgrade */
    (function(){ var im=new Image(); im.onload=function(){ var a=$("rocketArt"); a.src="/coach/rocket/rocket.png"; a.style.display="block"; $("rocketSvg").style.display="none"; }; im.src="/coach/rocket/rocket.png"; })();
    (function(){ var im=new Image(); im.onload=function(){ var s=$("stage"); s.style.backgroundImage="url(/coach/rocket/bg.png)"; s.style.backgroundSize="cover"; s.style.backgroundPosition="center bottom"; }; im.src="/coach/rocket/bg.png"; })();

    /* audio */
    var audioCtx=null;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    function playPCM(b){ return new Promise(function(res){ try{ var c=getCtx(),n=b.byteLength>>1,ab=c.createBuffer(1,n,24000),ch=ab.getChannelData(0),dv=new DataView(b.buffer,b.byteOffset,b.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=c.createBufferSource();s.buffer=ab;s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1;var g=c.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8);s.connect(g);g.connect(c.destination);s.onended=res;s.start(); }catch(e){res();} }); }
    var speaking=false;
    function say(t){ return new Promise(function(res){ if(!t||speaking)return res(); speaking=true; fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){return b?playPCM(new Uint8Array(b)):null;}).catch(function(){}).finally(function(){speaking=false;res();}); }); }
    function whoosh(){ try{ var ctx=getCtx(),dur=0.9,n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.6); var s=ctx.createBufferSource();s.buffer=buf; var f=ctx.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(280,ctx.currentTime);f.frequency.exponentialRampToValueAtTime(2400,ctx.currentTime+dur);f.Q.value=.7; var g=ctx.createGain();g.gain.value=(profile.volume!=null?profile.volume:0.8)*0.5; s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(); }catch(e){} }

    /* Leo */
    var LEO={ idle:"/coach/leo.png", cheer:"/coach/poses/leo-celebrate.png", listen:"/coach/poses/leo-listen.png" };
    Object.keys(LEO).forEach(function(k){ var im=new Image(); im.src=LEO[k]; });
    function setLeo(s){ var el=$("leo"); if(el&&LEO[s]) el.src=LEO[s]; }
    function leoReact(){ var w=$("leoWrap"); if(!w)return; w.classList.remove("react"); void w.offsetWidth; w.classList.add("react"); }

    var micStream=null;
    function setFlame(p){ var f=$("flame"); f.style.height=(p*46)+"px"; f.style.opacity=p>0.02?"1":"0"; f.classList.toggle("on",p>0.02); }
    function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

    var fuel=0;
    function setFuel(p){ fuel=Math.max(0,Math.min(100,p)); $("fuelFill").style.width=fuel+"%"; $("fuelPct").textContent=Math.round(fuel)+"%"; setFlame(fuel/100); }

    function fuelPhase(){
      return new Promise(function(resolve){
        var done=false, raf=null, src=null, micBtn=$("micBtn"), ico=micBtn.querySelector("svg"), bars=null, voicedEver=false;
        micBtn.classList.add("rec");
        function finish(){ if(done)return; done=true; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} micBtn.classList.remove("rec"); micBtn.onclick=null; if(bars)bars.remove(); if(ico)ico.style.display=""; resolve(); }
        micBtn.onclick=function(){ setFuel(fuel+13); if(fuel>=100) finish(); }; // tap fallback
        try{
          if(micStream){
            var ctx=getCtx(); src=ctx.createMediaStreamSource(micStream); var an=ctx.createAnalyser(); an.fftSize=512; src.connect(an);
            var fd=new Uint8Array(an.frequencyBinCount), td=new Uint8Array(an.fftSize);
            bars=document.createElement("div"); bars.className="wavebars"; for(var b=0;b<7;b++)bars.appendChild(document.createElement("i")); if(ico)ico.style.display="none"; micBtn.appendChild(bars);
            var t0=performance.now(), nSum=0, nN=0, thr=0;
            (function tick(){ if(done)return;
              an.getByteFrequencyData(fd); [].forEach.call(bars.children,function(el,k){ el.style.height=(8+fd[2+k*3]/255*30)+"px"; });
              an.getByteTimeDomainData(td); var sum=0; for(var i=0;i<td.length;i++){var x=(td[i]-128)/128;sum+=x*x;} var rms=Math.sqrt(sum/td.length), now=performance.now();
              if(now-t0<300){ nSum+=rms; nN++; }
              else{ if(!thr) thr=Math.min(0.12,Math.max(0.02,(nSum/Math.max(1,nN))*3));
                if(rms>thr){ if(!voicedEver){ voicedEver=true; $("prompt").textContent="Keep going — almost there! 🚀"; } setFuel(fuel+0.9); }
                else { setFuel(fuel-0.12); }
                if(fuel>=100){ finish(); return; }
              }
              raf=requestAnimationFrame(tick);
            })();
          }
        }catch(e){}
        // never get stuck: after 15s, top off and launch with whatever they did
        setTimeout(function(){ if(!done){ setFuel(100); finish(); } }, 15000);
      });
    }

    function launch(){
      return new Promise(function(resolve){
        whoosh(); if(window.Sona&&Sona.sfx&&Sona.sfx.complete)Sona.sfx.complete();
        setLeo("cheer"); leoReact();
        var r=$("rocketWrap"); r.classList.remove("idle"); r.classList.add("launch");
        if(window.Sona&&Sona.confetti)Sona.confetti();
        setTimeout(resolve, 1350);
      });
    }
    function resetRocket(){ var r=$("rocketWrap"); r.classList.remove("launch"); void r.offsetWidth; r.style.transition="none"; r.style.transform="translateX(-50%)"; r.style.opacity="1"; void r.offsetWidth; r.style.transition=""; r.classList.add("idle"); setFuel(0); }

    var launched=0;
    async function run(){
      for(launched=0; launched<GOAL; ){
        resetRocket();
        $("sayText").textContent=SAY; setLeo("listen");
        $("prompt").textContent="Listen to Leo…";
        await say("Say "+SAY+" to fuel the rocket!");
        $("prompt").textContent="Say "+SAY+" to fuel up!";
        await fuelPhase();
        $("prompt").textContent="Blast off! 🚀";
        await launch();
        launched++; $("count").textContent=launched;
        if(window.Sona&&Sona.addCoins)Sona.addCoins(5);
        setLeo("idle");
        await wait(450);
      }
      finishGame();
    }

    function finishGame(){
      var earned=15;
      if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{ var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}"); GS[SOUND]=GS[SOUND]||{}; GS[SOUND].rocket={done:true}; GS.lastPlayDay=new Date().toISOString().slice(0,10); localStorage.setItem("sona.games.v1",JSON.stringify(GS)); }catch(e){}
      $("winCount").textContent=launched;
      $("winUnlock").textContent="+"+earned+" 🪙";
      $("win").classList.add("show");
      if(window.Sona){ Sona.confetti&&Sona.confetti(); Sona.sfx&&Sona.sfx.coin&&Sona.sfx.coin(); }
    }

    function startGame(){ $("win").classList.remove("show"); setFuel(0); $("count").textContent="0"; $("goal").textContent=GOAL; setLeo("idle"); run(); }

    (async function(){
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      $("hear").onclick=function(){ say(SAY); };
      $("again").onclick=startGame;
      if(window.Sona&&Sona.music) Sona.music.start();
      startGame();
    })();

    // return to this sound's ladder (Sound → ladder → games)
    (function(){ var lad="/ladder.html?sound="+SOUND;
      var c=$("close"); if(c) c.onclick=function(){ location.href=lad; };
      Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){ a.setAttribute("href",lad); });
    })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  </script>
</body>
</html>
