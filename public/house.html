<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Level Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#58a7e0" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",sans-serif;user-select:none;}
    html,body{height:100%;overflow:hidden;background:#9fc7e8;}
    /* room: art drops in at /coach/rooms/<key>.png; until then the house's
       city sky + a soft emoji watermark stand in */
    #room{position:fixed;inset:0;max-width:560px;margin:0 auto;background-size:cover;background-position:center bottom;overflow:hidden;}
    #wm{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:230px;opacity:.13;pointer-events:none;}
    #top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;z-index:6;}
    #back{border:none;background:#fff;width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 4px 10px rgba(15,40,70,.18);}
    #title{flex:1;text-align:center;background:rgba(255,255,255,.94);border-radius:16px;padding:8px 14px;box-shadow:0 4px 10px rgba(15,40,70,.14);}
    #title b{display:block;font-family:"Baloo 2";font-weight:800;font-size:19px;color:#243b53;line-height:1.1;}
    #title span{font-weight:800;font-size:12.5px;color:#7a8ca0;}
    #spacer{width:46px;}
    #trophy{position:absolute;left:50%;transform:translateX(-50%);top:calc(78px + env(safe-area-inset-top));font-size:44px;filter:drop-shadow(0 5px 6px rgba(120,70,0,.35));z-index:2;pointer-events:none;}
    svg#path{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
    .puck{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:none;cursor:pointer;z-index:3;font-family:"Baloo 2";font-weight:800;font-size:24px;transition:transform .08s;}
    .puck:active{transform:translate(-50%,-50%) scale(.94);}
    .puck.done{background:#ffd21c;box-shadow:0 5px 0 #d9a400,0 8px 14px rgba(15,40,70,.22);color:#7a5b00;}
    .puck.done .st{display:block;font-size:11.5px;letter-spacing:1px;margin-top:-3px;}
    .puck.cur{background:#58cc02;box-shadow:0 6px 0 #46a302,0 10px 18px rgba(15,40,70,.28);color:#fff;animation:bob 1.1s ease-in-out infinite;}
    .puck.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid rgba(255,255,255,.85);animation:pulse 1.1s ease-in-out infinite;}
    .puck.lock{background:#c7d2dd;box-shadow:0 5px 0 #9fadba;color:#8595a5;font-size:19px;}
    @keyframes bob{0%,100%{transform:translate(-50%,-52%);}50%{transform:translate(-50%,-46%);}}
    @keyframes pulse{0%,100%{opacity:.9;}50%{opacity:.35;}}
    #goalPlate{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-radius:16px;padding:9px 20px;text-align:center;box-shadow:0 6px 14px rgba(15,40,70,.16);z-index:5;}
    #goalPlate b{font-family:"Baloo 2";font-weight:800;font-size:16px;color:#243b53;}
    #toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));background:#243b53;color:#fff;font-weight:800;font-size:14px;border-radius:99px;padding:9px 18px;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none;white-space:nowrap;}
  </style>
</head>
<body>
  <div id="room">
    <div id="wm"></div>
    <div id="top">
      <button id="back">←</button>
      <div id="title"><b id="tName"></b><span id="tSub"></span></div>
      <div id="spacer"></div>
    </div>
    <div id="trophy">🏆</div>
    <svg id="path"></svg>
    <div id="goalPlate"><b id="goalTxt"></b></div>
    <div id="toast"></div>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona, qp=new URLSearchParams(location.search);
    function sfx(n){ try{ if(S&&S.sfx&&S.sfx[n])S.sfx[n](); }catch(e){} }

    // which house? (same keys as the city + the coach/city panels)
    var HOUSES={
      slice:{ name:"Fruit Slice",   emo:"🍉", game:"arcade-slice.html", sky:"linear-gradient(180deg,#ff8787,#ffc9c9 70%,#ffe3e3)" },
      tiles:{ name:"Piano Tiles",   emo:"🎹", game:"arcade-tiles.html", sky:"linear-gradient(180deg,#b197fc,#d0bfff 70%,#e5dbff)" },
      stack:{ name:"Block Stacker", emo:"🧱", game:"arcade-stack.html", sky:"linear-gradient(180deg,#4dabf7,#a5d8ff 70%,#d0ebff)" },
      run:  { name:"Sound Sprint",  emo:"🏃", game:"arcade-run.html",   sky:"linear-gradient(180deg,#69db7c,#b2f2bb 70%,#d3f9d8)" },
      glide:{ name:"Flappy Glide",  emo:"🎈", game:"arcade-glide.html", sky:"linear-gradient(180deg,#74a9e0,#a8c9ec 60%,#ffd7a8)" }
    };
    var KEY=(qp.get("g")||"slice").toLowerCase();
    if(!HOUSES[KEY]) KEY="slice";
    var H=HOUSES[KEY];

    $("room").style.background=H.sky;
    $("wm").textContent=H.emo;
    $("tName").textContent=H.name;
    $("back").onclick=function(){ sfx("tap"); location.href="/today.html"; };
    // room art drop-in: /coach/rooms/<key>.png paints the whole room
    (function(){ var im=new Image(); im.onload=function(){ $("room").style.background="url("+im.src+") center bottom / cover no-repeat"; $("wm").style.display="none"; }; im.src="/coach/rooms/"+KEY+".png"; })();

    // ── the path: 10 pucks, serpentine bottom → top, one screen, no scroll ──
    var N=(S&&S.HOUSE_LEVELS)||10;
    var prog=(S&&S.houseProg)?S.houseProg(KEY):{stars:{},unlocked:1};
    var doneCount=0; for(var i=1;i<=N;i++){ if((prog.stars[i]|0)>0) doneCount++; }
    $("tSub").textContent=doneCount+" of "+N+" levels done";
    var tgt=(S&&S.houseTarget)?S.houseTarget(KEY,prog.unlocked):10;
    var allDone=doneCount>=N;
    $("goalTxt").textContent=allDone ? "House complete! 🏆 Replay for ⭐⭐⭐"
      : "Level "+prog.unlocked+" · Goal "+tgt+" "+H.emo;

    // serpentine positions (percent of room): rows of 3 from the bottom
    function pos(n){
      var r=Math.floor((n-1)/3), c=(n-1)%3;
      var xs=(r%2===0)?[22,50,78]:[78,50,22];
      return { x:xs[c], y:80-r*17.5 };
    }
    var room=$("room"), svg=$("path");
    function draw(){
      var W=room.clientWidth, Hh=room.clientHeight;
      svg.setAttribute("viewBox","0 0 "+W+" "+Hh);
      var d="";
      for(var n=1;n<=N;n++){ var p=pos(n); var x=p.x*W/100, y=p.y*Hh/100; d+=(n===1?"M":" L")+x+" "+y; }
      var tp=pos(N); d+=" L"+(W/2)+" "+(tp.y*Hh/100-70); // path runs on to the trophy
      svg.innerHTML='<path d="'+d+'" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 24" />';
      // trophy sits where the path ends
      $("trophy").style.top=(tp.y*Hh/100-96)+"px"; $("trophy").style.left=(W/2)+"px"; $("trophy").style.transform="translateX(-50%)";
    }
    draw(); window.addEventListener("resize",draw);

    function toast(t){ var el=$("toast"); el.textContent=t; el.style.opacity=1; clearTimeout(toast._t); toast._t=setTimeout(function(){ el.style.opacity=0; },1400); }

    for(var n=1;n<=N;n++){ (function(n){
      var p=pos(n), b=document.createElement("button");
      var st=prog.stars[n]|0;
      b.className="puck "+(st>0?"done":(n===prog.unlocked?"cur":"lock"));
      b.style.left=p.x+"%"; b.style.top=p.y+"%";
      b.innerHTML=st>0 ? (n+'<span class="st">'+"⭐⭐⭐".slice(0,st)+"</span>") : (n===prog.unlocked?n:"🔒");
      b.onclick=function(){
        if(st===0&&n!==prog.unlocked){ sfx("tap"); toast("Finish the glowing level first! ✨"); return; }
        sfx("correct");
        location.href="/charge.html?game="+H.game+"&lvl="+n;
      };
      room.appendChild(b);
    })(n); }
  </script>
</body>
</html>
