<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Rev Racer</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --orange:#ff9600; --orange-d:#e08600; --red:#ff4b4b; --ink:#3c3c3c; --muted:#777; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;overflow:hidden;}
    body{background:linear-gradient(180deg,#bfe9ff 0%,#dff4ff 55%,#cdeffd 100%);color:var(--ink);}
    #app{height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}

    #top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 4px;}
    #close{border:none;background:none;color:#8fbfe0;font-size:24px;font-weight:800;cursor:pointer;line-height:1;}
    .stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border-radius:99px;padding:7px 14px;font-family:"Baloo 2";font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(20,120,200,.12);}
    .stat.gate{color:var(--blue-d);} .stat.light{margin-left:auto;font-size:18px;}

    /* track */
    #track{flex:1;position:relative;overflow:hidden;}
    .cloud{position:absolute;font-size:34px;opacity:.85;animation:drift 9s linear infinite;}
    @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-120vw)}}
    #road{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,#6b7280,#4b5563);}
    #road:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:#7c8898;}
    #lane{position:absolute;left:0;right:0;top:48%;height:6px;background:repeating-linear-gradient(90deg,#ffe14d 0 34px,transparent 34px 64px);animation:lane .5s linear infinite;}
    @keyframes lane{0%{background-position:0 0}100%{background-position:-64px 0}}
    #finish{position:absolute;bottom:0;height:42%;width:18px;right:4%;
      background:repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0/14px 14px;opacity:.9;border-radius:3px;}
    #kart{position:absolute;bottom:14%;left:6%;transition:left .9s cubic-bezier(.3,.8,.4,1);display:flex;flex-direction:column;align-items:center;}
    #kart .leo{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));}
    #kart .leo.cheer{animation:kartPop .6s ease;}
    @keyframes kartPop{0%{transform:scale(1)}30%{transform:scale(1.2) translateY(-8px) rotate(-6deg)}60%{transform:scale(.95)}100%{transform:scale(1)}}
    #win .leoWin{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(20,90,160,.25));animation:kartPop .6s ease;}
    #kart .car{font-size:46px;margin-top:-12px;}
    #kart.zoom .car{animation:shake .25s linear infinite;}
    @keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
    #dust{position:absolute;bottom:16%;font-size:22px;opacity:0;}
    #kart{z-index:4;}
    /* rival racers — the player has to beat them to the finish */
    .rival{position:absolute;left:6%;transition:left 1s linear;z-index:2;pointer-events:none;}
    .rival .body{display:block;width:46px;height:19px;border-radius:11px 13px 7px 7px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.18);}
    .rival .body:before{content:"";position:absolute;top:-7px;left:12px;right:10px;height:10px;border-radius:7px 6px 0 0;background:rgba(255,255,255,.5);}
    .rival .body i{position:absolute;bottom:-5px;width:11px;height:11px;border-radius:50%;background:#222;box-shadow:inset 0 0 0 3px #555;}
    .rival .body i.l{left:5px;} .rival .body i.r{right:5px;}

    /* traffic light */
    #signal{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#222;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 16px rgba(0,0,0,.3);}
    #signal .bulb{width:26px;height:26px;border-radius:50%;background:#444;}
    #signal .r.on{background:var(--red);box-shadow:0 0 14px var(--red);}
    #signal .y.on{background:#ffd400;box-shadow:0 0 14px #ffd400;}
    #signal .g.on{background:var(--green);box-shadow:0 0 16px var(--green);}

    /* RPM gauge */
    #rpmWrap{position:absolute;bottom:46%;left:50%;transform:translateX(-50%);width:200px;text-align:center;}
    #rpmTxt{font-family:"Baloo 2";font-weight:800;color:var(--blue-d);font-size:15px;margin-bottom:5px;}
    #rpm{height:18px;background:#e6eef6;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.1);}
    #rpm span{display:block;height:100%;width:0;background:linear-gradient(90deg,#58cc02,#ffd400,#ff7a00);border-radius:99px;transition:width .18s ease;}

    /* bottom */
    #bottom{padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.7));}
    #prompt{font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--blue-d);min-height:20px;}
    #wordCard{background:#fff;border:2px solid #e5e5e5;border-bottom-width:4px;border-radius:20px;padding:10px 24px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(20,120,200,.1);min-height:64px;}
    #wordEmoji{font-size:38px;line-height:1;} #wordText{font-family:"Baloo 2";font-weight:800;font-size:32px;color:var(--blue-d);line-height:1;}
    #hear{border:none;background:none;cursor:pointer;font-size:22px;}
    .mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 var(--blue-d);transition:transform .05s;}
    .mic:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--blue-d);}
    .mic.rec{animation:pulse 1.4s infinite;}
    .mic svg{width:42px;height:42px;fill:#fff;}
    .wavebars{display:flex;gap:4px;align-items:center;justify-content:center;height:42px;}
    .wavebars i{width:6px;height:8px;background:#fff;border-radius:99px;transition:height .07s linear;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,176,246,.45),0 6px 0 0 var(--blue-d)}70%{box-shadow:0 0 0 18px rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}100%{box-shadow:0 0 0 0 rgba(28,176,246,0),0 6px 0 0 var(--blue-d)}}

    /* win */
    #win{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#bfe9ff,#cdeffd);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
    #win.show{display:flex;}
    #win h1{font-family:"Baloo 2";font-weight:800;font-size:34px;color:var(--blue-d);margin-top:10px;}
    #win .rewards{display:flex;gap:14px;margin-top:18px;}
    #win .reward{background:#fff;border-radius:18px;padding:14px 20px;font-family:"Baloo 2";font-weight:800;font-size:24px;color:var(--blue-d);box-shadow:0 6px 16px rgba(20,120,200,.12);}
    #win .reward small{display:block;font-family:"Nunito";font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
    #win .unlock{margin-top:16px;font-weight:800;color:var(--orange-d);}
    #win .btn{margin-top:22px;border:none;border-radius:16px;padding:15px 44px;font-family:"Baloo 2";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 0 var(--green-d);cursor:pointer;}
    #win .btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--green-d);}
    #win a{margin-top:14px;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none;}
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <button id="close" onclick="location.href='/play.html'">✕</button>
      <span class="stat gate">🏁 <span id="gateNum">0</span>/<span id="gateTot">3</span></span>
      <span class="stat light" id="speedTag">🏎️</span>
    </div>

    <div id="track">
      <span class="cloud" style="top:12%;left:80%;">☁️</span>
      <span class="cloud" style="top:22%;left:120%;animation-delay:3s;">☁️</span>
      <span class="cloud" style="top:8%;left:160%;animation-delay:6s;">⛅</span>
      <div id="signal"><div class="bulb r on"></div><div class="bulb y"></div><div class="bulb g"></div></div>
      <div id="rpmWrap"><div id="rpmTxt">REV YOUR ENGINE!</div><div id="rpm"><span id="rpmFill"></span></div></div>
      <div id="road"></div>
      <div id="lane"></div>
      <div id="finish"></div>
      <div class="rival" id="r1" style="bottom:30%;"><span class="body" style="background:linear-gradient(180deg,#ff9a5c,#e8643a);"><i class="l"></i><i class="r"></i></span></div>
      <div class="rival" id="r2" style="bottom:3%;"><span class="body" style="background:linear-gradient(180deg,#9b7bff,#7a55e0);"><i class="l"></i><i class="r"></i></span></div>
      <span id="dust">💨</span>
      <div id="kart"><img class="leo" src="/coach/leo.png" alt="Leo" /><span class="car">🏎️</span></div>
    </div>

    <div id="bottom">
      <div id="prompt">Say your sound to rev up!</div>
      <div id="wordCard"><span id="wordEmoji">🔊</span><span id="wordText">R</span><button id="hear" title="Hear it"><svg viewBox="0 0 24 24" fill="none" stroke="#1597d4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;display:block;"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
      <button class="mic" id="micBtn" title="Say it">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 18v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div id="win">
    <img class="leoWin" src="/coach/poses/leo-celebrate.png" alt="Leo celebrating" onerror="this.onerror=null;this.src='/coach/leo.png';" />
    <h1 id="winTitle">You won the race!</h1>
    <div class="rewards">
      <div class="reward"><span id="winReps">0</span><small>sound reps</small></div>
      <div class="reward"><span id="winStars">0</span><small>clean words</small></div>
    </div>
    <div class="unlock" id="winUnlock"></div>
    <button class="btn" id="again">Race again</button>
    <a href="/play.html">Done for now →</a>
  </div>

  <script src="/sona.js"></script>
  <script>
    var profile = (window.Sona ? Sona.getProfile() : { focusSounds:["R"], voiceId:"", volume:0.8 });
    var params = new URLSearchParams(location.search);
    var SOUND = (params.get("sound") || (profile.focusSounds && profile.focusSounds[0]) || "R").toUpperCase();
    if(!(window.Sona && Sona.WORDS && Sona.WORDS[SOUND])) SOUND="R";
    var POOL = (window.Sona && Sona.WORDS && Sona.WORDS[SOUND]) ? Sona.WORDS[SOUND].filter(function(w){return w.i;}) : [{w:"rabbit",e:"🐰"}];
    var SAYIT = { R:"rrr", S:"sss", L:"lll", K:"k, k, k", G:"g, g, g", F:"fff", SH:"shh", CH:"ch, ch", TH:"th, th" };
    var REV_NEED = 5;     // say the sound 5x to launch (massed practice burst)
    var GATES = 3;        // word gates after launch (distributed practice)
    // Strict: a gate only opens on a clean rep (SpeechAce "great" rating). Wrong → try again.

    var $=function(id){return document.getElementById(id);};
    var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
    var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};

    /* audio */
    var audioCtx=null;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    function vroom(p){ try{ var ctx=getCtx(); var o=ctx.createOscillator(),g=ctx.createGain(); o.type="sawtooth"; o.frequency.setValueAtTime(110+(p||0)*220,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(60+(p||0)*120,ctx.currentTime+0.25); g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.12,ctx.currentTime+0.03); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.3); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.32); }catch(e){} }
    function playPCM(bytes){ return new Promise(function(res){ try{ var ctx=getCtx(); var n=bytes.byteLength>>1; var ab=ctx.createBuffer(1,n,24000); var ch=ab.getChannelData(0); var dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=ctx.createBufferSource(); s.buffer=ab; s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1; var g=ctx.createGain(); g.gain.value=(profile.volume!=null?profile.volume:0.8); s.connect(g); g.connect(ctx.destination); s.onended=res; s.start(); }catch(e){res();} }); }
    var speaking=false;
    function say(text){ return new Promise(function(res){ if(!text){return res();} if(speaking){return res();} speaking=true; fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){ if(b) return playPCM(new Uint8Array(b)); }).catch(function(){}).finally(function(){speaking=false;res();}); }); }

    /* mic */
    var micStream=null, useSpeechAce=false, tapRev=null;
    function norm(s){return (s||"").toLowerCase().replace(/[^a-z]/g,"");}
    function matchText(t,w){t=norm(t);w=norm(w);if(!t)return false;if(t.indexOf(w)>=0||w.indexOf(t)>=0)return true;var i=0;while(i<Math.min(t.length,w.length)&&t[i]===w[i])i++;return i>=3;}

    // REV PHASE: count repetitions of the sound (onset detection). Fills the gauge.
    function revPhase(){
      return new Promise(function(resolve){
        var reps=0, done=false, NEED=REV_NEED;
        $("prompt").textContent="Say "+SOUND+" to rev up!  ("+SOUND+"… "+SOUND+"… "+SOUND+"!)";
        $("micBtn").classList.add("rec");
        function setRpm(p){ $("rpmFill").style.width=Math.round(p*100)+"%"; }
        function addRep(){ if(done)return; reps++; vroom(reps/NEED); setRpm(Math.min(1,reps/NEED)); $("rpmTxt").textContent="VROOM! "+reps+"/"+NEED; if(reps>=NEED){ finish(); } }
        tapRev=addRep; $("micBtn").onclick=function(){ addRep(); };
        var raf=null,src=null;
        function finish(){ if(done)return; done=true; if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} $("micBtn").classList.remove("rec"); tapRev=null; $("micBtn").onclick=null; resolve(reps); }
        try{
          if(micStream){
            var ctx=getCtx(); src=ctx.createMediaStreamSource(micStream); var an=ctx.createAnalyser(); an.fftSize=512; src.connect(an);
            var fd=new Uint8Array(an.frequencyBinCount), td=new Uint8Array(an.fftSize);
            var bars=document.createElement("div"); bars.className="wavebars"; for(var b=0;b<7;b++)bars.appendChild(document.createElement("i"));
            var ico=$("micBtn").querySelector("svg"); if(ico)ico.style.display="none"; $("micBtn").appendChild(bars);
            var t0=performance.now(),nSum=0,nN=0,thr=0,state="below",up=0,dn=0;
            (function tick(){ if(done)return;
              an.getByteFrequencyData(fd); [].forEach.call(bars.children,function(el,k){var v=fd[2+k*3]/255;el.style.height=(8+v*30)+"px";});
              an.getByteTimeDomainData(td); var sum=0; for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;}
              var rms=Math.sqrt(sum/td.length), now=performance.now();
              if(now-t0<300){ nSum+=rms; nN++; }
              else{
                if(!thr) thr=Math.min(0.13, Math.max(0.02,(nSum/Math.max(1,nN))*3));
                if(state==="below"){ if(rms>thr){ up++; if(up>=2){ state="above"; up=0; addRep(); } } else up=0; }
                else { if(rms<thr*0.6){ dn++; if(dn>=3){ state="below"; dn=0; } } else dn=0; }
              }
              raf=requestAnimationFrame(tick); })();
          }
        }catch(e){}
        // never get stuck: after 16s, launch with whatever they did (min 1)
        setTimeout(function(){ if(!done){ if(reps<1){reps=1;setRpm(1);} finish(); } }, 16000);
      });
    }

    // GATE PHASE: say one word; the kart only advances on a clean rep (strict). Returns the recording.
    function recordTurn(maxMs){
      maxMs=maxMs||8000;
      return new Promise(function(resolve){
        var done=false,chunks=[],rec=null,sr=null,transcript="";var stopWave=function(){};
        var spoke=false,lastVoice=0,micBtn=$("micBtn");
        var finish=function(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} micBtn.classList.remove("rec"); stopWave(); setTimeout(function(){ var blob=chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null; resolve({transcript:transcript,blob:blob}); },150); };
        try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
        try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++){for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript;}finish();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
        var wraf=null,msrc=null,bars=null,ico=micBtn.querySelector("svg");
        try{ if(micStream){ var ctx=getCtx(); msrc=ctx.createMediaStreamSource(micStream); var an=ctx.createAnalyser(); an.fftSize=512; msrc.connect(an);
          var data=new Uint8Array(an.frequencyBinCount),tdv=new Uint8Array(an.fftSize);
          bars=document.createElement("div"); bars.className="wavebars"; for(var b=0;b<7;b++)bars.appendChild(document.createElement("i"));
          if(ico)ico.style.display="none"; micBtn.appendChild(bars);
          var t0=performance.now(),nSum=0,nN=0,thr=0,voiced=0;
          (function tick(){ if(done)return; an.getByteFrequencyData(data); [].forEach.call(bars.children,function(el,k){var v=data[2+k*3]/255;el.style.height=(8+v*30)+"px";});
            an.getByteTimeDomainData(tdv); var sum=0; for(var k=0;k<tdv.length;k++){var d=(tdv[k]-128)/128;sum+=d*d;} var rms=Math.sqrt(sum/tdv.length),now=performance.now();
            if(now-t0<300){nSum+=rms;nN++;} else { if(!thr)thr=Math.min(0.09,Math.max(0.012,(nSum/Math.max(1,nN))*2.6)); if(rms>thr){voiced++;lastVoice=now;if(voiced>=2&&!spoke){spoke=true;$("prompt").textContent="Zoom! 🏎️";}}else if(rms<thr*0.7)voiced=0; if(spoke&&now-lastVoice>=1000){finish();return;} }
            wraf=requestAnimationFrame(tick); })();
        } }catch(e){}
        stopWave=function(){ if(wraf)cancelAnimationFrame(wraf); try{msrc&&msrc.disconnect();}catch(e){} if(bars)bars.remove(); if(ico)ico.style.display=""; };
        micBtn.classList.add("rec"); micBtn.onclick=finish;
        setTimeout(function(){ if(!done)finish(); }, maxMs);
      });
    }
    // Strict scoring: returns {score, pass}. "pass" = a clean (great) rep of the word.
    async function scoreWord(word,res){
      if(useSpeechAce && res.blob){ try{ var fd=new FormData(); fd.append("audio",new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"})); fd.append("text",word.w); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode","full"); var r=await fetch("/api/score",{method:"POST",body:fd}); var j=await r.json(); if(j&&j.ok&&typeof j.score==="number")return { score:j.score, pass:j.rating==="great" }; }catch(e){} }
      if(res.transcript){ var ok=matchText(res.transcript,word.w); return { score: ok?85:30, pass: ok }; }
      return { score:70, pass:true };
    }

    /* game */
    var progress=0, gateIdx=0, totalReps=0, cleanWords=0, queue=[];
    var RDUR=[24,34], raceStart=0; // seconds each rival takes to finish from GO
    function startRivals(){ raceStart=performance.now(); ["r1","r2"].forEach(function(id,i){ var el=$(id); if(!el)return; el.style.transition="left "+RDUR[i]+"s linear"; el.style.left="88%"; }); }
    function resetRivals(){ ["r1","r2"].forEach(function(id){ var el=$(id); if(!el)return; el.style.transition="none"; el.style.left="6%"; void el.offsetWidth; }); }
    function setKart(p){ $("kart").style.left=(6+p*0.82*100/100*84)+"%"; } // 6%..~90%
    function kartTo(pct){ $("kart").style.left=pct+"%"; }
    function showWord(w){ $("wordEmoji").style.display=""; $("wordEmoji").textContent=w.e||"⭐"; $("wordText").textContent=w.w; }
    function showSound(){ $("wordEmoji").style.display="none"; $("wordText").textContent=SOUND; }

    function lights(state){
      $("signal").querySelector(".r").className="bulb r"+(state==="r"?" on":"");
      $("signal").querySelector(".y").className="bulb y"+(state==="y"?" on":"");
      $("signal").querySelector(".g").className="bulb g"+(state==="g"?" on":"");
    }

    async function run(){
      // REV (massed practice)
      lights("r"); showSound(); kartTo(6);
      $("hear").onclick=function(){ say(SAYIT[SOUND]||SOUND); };
      await say("Say "+SOUND+" to rev your engine!");
      var reps=await revPhase(); totalReps+=reps;
      // GO!
      lights("y"); await new Promise(function(r){setTimeout(r,300);});
      lights("g"); $("prompt").textContent="GREEN LIGHT — GO! 🏎️💨"; $("rpmTxt").textContent="GOOO!";
      $("kart").classList.add("zoom"); $("dust").style.left="4%"; $("dust").style.opacity="1";
      if(window.Sona&&Sona.sfx)Sona.sfx.correct&&Sona.sfx.correct(); vroom(1);
      startRivals(); // the other racers take off — beat them to the finish!
      $("rpmWrap").style.display="none";
      progress=0.25; kartTo(28);
      await new Promise(function(r){setTimeout(r,900);});
      $("kart").classList.remove("zoom"); $("dust").style.opacity="0";

      // GATES (distributed practice) — strict: must say each word right to pass the gate.
      queue=shuffle(POOL); $("gateTot").textContent=GATES;
      for(gateIdx=0; gateIdx<GATES; gateIdx++){
        var w=queue[gateIdx%queue.length];
        $("gateNum").textContent=gateIdx;
        showWord(w); $("hear").onclick=(function(ww){return function(){say(ww.w);};})(w);
        await say(w.w);
        var passed=false;
        while(!passed){
          $("prompt").textContent="Say the word to zoom!";
          var res=await recordTurn(); var sa=await scoreWord(w,res);
          if(sa.pass){
            passed=true; cleanWords++;
            if(window.Sona&&Sona.sfx)Sona.sfx.correct&&Sona.sfx.correct();
            var kl=document.querySelector("#kart .leo"); if(kl){ kl.src="/coach/poses/leo-celebrate.png"; kl.classList.remove("cheer"); void kl.offsetWidth; kl.classList.add("cheer"); setTimeout(function(){ kl.src="/coach/leo.png"; kl.classList.remove("cheer"); }, 700); }
            vroom(1); $("prompt").textContent="Nice one! 🏎️";
          } else {
            if(window.Sona&&Sona.sfx)Sona.sfx.tap&&Sona.sfx.tap();
            $("prompt").textContent="Try again!";
            await say(w.w); // re-model the same word
          }
        }
        progress=0.25+ (gateIdx+1)/GATES*0.7;
        kartTo(28 + (gateIdx+1)/GATES*60);
        $("gateNum").textContent=gateIdx+1;
        await new Promise(function(r){setTimeout(r,750);});
      }
      finishGame();
    }

    function finishGame(){
      kartTo(92);
      // placement vs the rivals (they race from GO over RDUR seconds)
      var elapsed=(performance.now()-raceStart)/1000;
      var beaten=RDUR.filter(function(d){return d<=elapsed;}).length;
      var place=beaten+1;
      ["r1","r2"].forEach(function(id,i){ var el=$(id); if(!el)return; var p=Math.min(1,elapsed/RDUR[i]); el.style.transition="none"; el.style.left=(6+p*82)+"%"; });
      var medal=place===1?"🥇":place===2?"🥈":"🥉";
      var ptxt=place===1?"1st place!":place===2?"2nd place!":"3rd place!";
      $("winReps").textContent=totalReps;
      $("winStars").textContent=cleanWords;
      var bonus=place===1?20:place===2?10:0;
      var earned=20 + totalReps*2 + cleanWords*3 + bonus;
      if(window.Sona&&Sona.addCoins)Sona.addCoins(earned);
      try{ var GS=JSON.parse(localStorage.getItem("sona.games.v1")||"{}"); GS[SOUND]=GS[SOUND]||{}; GS[SOUND].racer={done:true}; GS.lastPlayDay=new Date().toISOString().slice(0,10); localStorage.setItem("sona.games.v1",JSON.stringify(GS)); }catch(e){}
      $("winTitle").textContent=(place===1?"You won the race! ":"Race done! ")+medal;
      $("winUnlock").textContent=ptxt+"  ·  +"+earned+" 🪙";
      $("win").classList.add("show");
      if(window.Sona){ Sona.confetti&&Sona.confetti(); Sona.sfx&&Sona.sfx.complete&&Sona.sfx.complete(); }
    }

    function startGame(){
      $("win").classList.remove("show"); $("rpmWrap").style.display=""; $("rpmFill").style.width="0%";
      progress=0; gateIdx=0; totalReps=0; cleanWords=0; $("gateNum").textContent="0";
      resetRivals();
      run();
    }

    (async function(){
      try{ var r=await fetch("/api/score"); var j=await r.json(); useSpeechAce=!!(j&&j.hasKey); }catch(e){ useSpeechAce=false; }
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      $("again").onclick=startGame;
      startGame();
    })();
    // return to this sound's ladder (Sound → ladder → games)
    (function(){ var lad="/ladder.html?sound="+SOUND;
      var c=document.getElementById("close"); if(c) c.onclick=function(){ location.href=lad; };
      Array.prototype.forEach.call(document.querySelectorAll('a[href="/play.html"]'),function(a){ a.setAttribute("href",lad); });
    })();
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });
  </script>
</body>
</html>
