<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona — Worlds</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root{--blue:#1cb0f6;--blue-d:#1597d4;--green:#58cc02;--green-d:#46a302;--amber:#ffb703;--amber-d:#e08600;--ink:#16384f;--muted:#6b86a3;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;}
    body{background:linear-gradient(180deg,#eaf6ff,#dff1ff 40%,#eafbe4);color:var(--ink);display:flex;justify-content:center;}
    #app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));}
    .top{display:flex;align-items:center;gap:10px;}
    .top h1{font-family:"Baloo 2";font-weight:800;font-size:24px;flex:1;}
    .stars{background:#fff;border-radius:99px;padding:6px 13px;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--amber-d);box-shadow:0 3px 0 rgba(20,90,150,.1);}
    .lead{color:var(--muted);font-weight:700;font-size:13.5px;margin:4px 0 14px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .house{position:relative;border:none;cursor:pointer;border-radius:22px;overflow:hidden;padding:0;text-align:left;
      box-shadow:0 10px 0 -2px rgba(20,90,150,.12),0 16px 30px -16px rgba(20,90,150,.5);transition:transform .08s;}
    .house:active{transform:translateY(3px) scale(.985);}
    .house .scene{height:118px;position:relative;display:flex;align-items:center;justify-content:center;}
    .house .emoji{font-size:58px;filter:drop-shadow(0 6px 8px rgba(15,50,80,.25));}
    .house .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
    .house .meta{background:#fff;padding:10px 12px 12px;}
    .house .nm{font-family:"Baloo 2";font-weight:800;font-size:16px;line-height:1;}
    .house .pr{display:flex;align-items:center;gap:6px;margin-top:7px;}
    .house .bar{flex:1;height:8px;border-radius:99px;background:#e9eff5;overflow:hidden;}
    .house .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7be23a);border-radius:99px;}
    .house .pct{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;}
    .house .st{position:absolute;top:9px;right:10px;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 9px;font-family:"Baloo 2";font-weight:800;font-size:12px;color:var(--amber-d);box-shadow:0 2px 6px rgba(20,90,150,.18);}
    .nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e8eef4;display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:9;}
    .nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#9fb0c0;text-decoration:none;}
    .nav a .ni{font-size:21px;} .nav a.on{color:var(--blue-d);}
    /* toast on returning from a game */
    #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);z-index:20;background:#fff;border-radius:22px;padding:22px 30px;text-align:center;box-shadow:0 18px 44px rgba(20,60,90,.4);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
    #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
    #toast .big{font-size:34px;letter-spacing:3px;} #toast h3{font-family:"Baloo 2";font-weight:800;font-size:19px;margin-top:6px;} #toast p{font-weight:800;color:var(--amber-d);font-size:14px;margin-top:3px;}
  </style>
</head>
<body>
  <div id="app">
    <div class="top"><h1>Choose a game 🎮</h1><span class="stars" id="starTot">⭐ 0</span></div>
    <p class="lead">Pick a game to practice. Each one plays a little differently — replay your favorites anytime!</p>
    <div class="grid" id="grid"></div>
  </div>
  <div id="toast"><div class="big" id="tStars">★★★</div><h3 id="tTitle">Level clear!</h3><p id="tSub"></p></div>
  <div class="nav">
    <a href="/today.html"><span class="ni">🏠</span>Today</a>
    <a class="on" href="/map.html"><span class="ni">🎮</span>Play</a>
    <a href="/progress.html"><span class="ni">📈</span>Progress</a>
  </div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona;
    var WORLDS=(S&&S.WORLDS)?S.WORLDS:[];
    var PER=(S&&S.LEVELS_PER_WORLD)?S.LEVELS_PER_WORLD:10;
    function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

    var grid=$("grid");
    WORLDS.forEach(function(w){
      var cleared=(S&&S.worldCleared)?S.worldCleared(w.id):0;
      var stars=(S&&S.worldStars)?S.worldStars(w.id):0;
      var pct=Math.round(cleared/PER*100);
      var b=document.createElement("button"); b.className="house";
      b.innerHTML=
        '<div class="scene" style="background:'+(w.sky||"#cfe8fb")+';">'+
          '<span class="emoji">'+(w.theme||"🎮")+'</span>'+
          '<img class="art" alt="" />'+
          '<span class="st">⭐ '+stars+'</span>'+
        '</div>'+
        '<div class="meta"><div class="nm">'+esc(w.name||w.id)+'</div>'+
          '<div class="pr"><div class="bar"><span style="width:'+pct+'%"></span></div><span class="pct">'+cleared+'/'+PER+'</span></div>'+
        '</div>';
      // house art auto-upgrades the moment /coach/worlds/<id>.png exists
      (function(card){ var im=new Image(); im.onload=function(){ var a=card.querySelector(".art"); var e=card.querySelector(".emoji"); a.src=im.src; a.style.display="block"; if(e)e.style.display="none"; }; im.src="/coach/worlds/"+w.id+".png"; })(b);
      b.onclick=function(){ if(S&&S.sfx&&S.sfx.tap)S.sfx.tap(); location.href="/world.html?w="+encodeURIComponent(w.id); };
      grid.appendChild(b);
    });
    if(S&&S.totalStars) $("starTot").textContent="⭐ "+S.totalStars();

    // returning from a game (e.g. via exit) → award the star + celebrate here too
    (function(){
      var res=(S&&S.campaignResolve)?S.campaignResolve():null;
      if(!res) return;
      if(S&&S.totalStars)$("starTot").textContent="⭐ "+S.totalStars();
      var t=$("toast");
      $("tStars").textContent="★★★".slice(0,res.stars)+"☆☆☆".slice(0,3-res.stars);
      $("tTitle").textContent=res.stars>=3?"Perfect! 3 stars!":(res.improved?"New best!":"Level clear!");
      $("tSub").textContent=Math.round(res.acc*100)+"% accurate";
      setTimeout(function(){ t.classList.add("show"); if(S.confetti)S.confetti(); },350);
      setTimeout(function(){ t.classList.remove("show"); },3000);
    })();
  </script>
</body>
</html>
