<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — World</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    :root{--blue:#1cb0f6;--blue-d:#1597d4;--green:#58cc02;--green-d:#46a302;--amber:#ffb703;--amber-d:#e08600;--ink:#16384f;--muted:#6b86a3;--trail:#c79a5b;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;}
    html,body{height:100%;}
    body{color:var(--ink);display:flex;justify-content:center;background:#cfe8fb;}
    #app{position:relative;width:100%;max-width:480px;min-height:100vh;}
    #bg{position:fixed;inset:0;max-width:480px;margin:0 auto;background-size:cover;background-position:center bottom;z-index:0;}
    .bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
      background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.78) 70%,rgba(255,255,255,0));}
    .back{border:none;background:rgba(255,255,255,.9);width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;color:var(--blue-d);cursor:pointer;box-shadow:0 3px 8px rgba(20,90,150,.18);}
    .bar .ttl{flex:1;}
    .bar b{font-family:"Baloo 2";font-weight:800;font-size:19px;display:block;line-height:1;}
    .bar span{font-size:12px;font-weight:800;color:var(--muted);}
    .bar .stars{background:#fff;border-radius:99px;padding:6px 12px;font-family:"Baloo 2";font-weight:800;font-size:14px;color:var(--amber-d);box-shadow:0 3px 0 rgba(20,90,150,.1);}
    .path{position:relative;z-index:1;padding:14px 0 40px;display:flex;flex-direction:column;align-items:center;}
    .path:before{content:"";position:absolute;top:70px;bottom:96px;left:50%;width:7px;transform:translateX(-50%);
      background:repeating-linear-gradient(var(--trail) 0 14px,transparent 14px 26px);border-radius:99px;opacity:.9;z-index:0;}
    .node{position:relative;z-index:1;margin:13px 0;display:flex;flex-direction:column;align-items:center;}
    .node .pin{display:flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:50%;background:#fff;
      font-size:30px;border:4px solid var(--c,#1cb0f6);box-shadow:0 6px 0 rgba(20,90,150,.2),0 10px 16px rgba(20,90,150,.22);cursor:pointer;transition:transform .06s;}
    .node .pin:active{transform:translateY(3px);}
    .node.boss .pin{width:74px;height:74px;border-color:#f5b500;background:linear-gradient(180deg,#fff,#fff6dc);font-size:34px;}
    .node.locked .pin{background:#e9eef4;border-color:#c2ccd6;color:#aab6c2;box-shadow:0 5px 0 rgba(20,90,150,.12);cursor:default;}
    .node .stars{display:flex;gap:2px;margin-top:6px;background:rgba(255,255,255,.85);border-radius:99px;padding:2px 7px;box-shadow:0 2px 6px rgba(20,90,150,.16);}
    .node.locked .stars{display:none;}
    .node .stars i{font-size:11px;filter:grayscale(1);opacity:.45;} .node .stars i.on{filter:none;opacity:1;}
    .node.cur .pin{animation:bob 1.3s ease-in-out infinite;box-shadow:0 6px 0 rgba(20,90,150,.2),0 0 0 6px rgba(28,176,246,.18);}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .node .leo{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:30px;animation:bob 1.5s ease-in-out infinite;filter:drop-shadow(0 4px 5px rgba(0,0,0,.2));}
    .node.pop .pin{animation:pop .6s ease;} @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.25) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
    .prize{position:relative;z-index:1;margin:6px 0 4px;display:flex;flex-direction:column;align-items:center;}
    .prize .chest{width:88px;height:88px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:46px;
      background:linear-gradient(160deg,#ffd33d,#ff9f1c);box-shadow:0 8px 0 #e08a13,0 14px 24px rgba(224,138,19,.4);}
    .prize.locked .chest{background:#e3e9f0;box-shadow:0 8px 0 #c4cedb;filter:grayscale(.4);}
    .prize .cap{margin-top:8px;font-family:"Baloo 2";font-weight:800;font-size:13px;color:#fff;background:rgba(18,40,60,.55);padding:5px 13px;border-radius:99px;}
    #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);z-index:30;background:#fff;border-radius:22px;padding:22px 30px;text-align:center;box-shadow:0 18px 44px rgba(20,60,90,.4);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
    #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
    #toast .big{font-size:34px;letter-spacing:3px;} #toast h3{font-family:"Baloo 2";font-weight:800;font-size:19px;margin-top:6px;} #toast p{font-weight:800;color:var(--amber-d);font-size:14px;margin-top:3px;}
  </style>
</head>
<body>
  <div id="app">
    <div id="bg"></div>
    <div class="bar">
      <button class="back" id="back">←</button>
      <div class="ttl"><b id="wname">World</b><span id="wsub"></span></div>
      <span class="stars" id="wstars">⭐ 0</span>
    </div>
    <div class="path" id="path"></div>
  </div>
  <div id="toast"><div class="big" id="tStars">★★★</div><h3 id="tTitle">Level clear!</h3><p id="tSub"></p></div>

  <script src="/sona.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var S=window.Sona;
    var W=(new URLSearchParams(location.search)).get("w")||"";
    var world=(S&&S.worldById)?S.worldById(W):null;
    if(!world){ location.replace("/map.html"); }
    var levels=(S&&S.worldLevels)?S.worldLevels(W):[];
    function lbl(s){return (S&&S.soundLabel)?S.soundLabel(s):s;}
    function meta(g){return (S&&S.gameMeta)?S.gameMeta(g):{icon:"🎮",c:"#1cb0f6"};}
    var OFF=[0,-64,58,-40,64,-58,40,-64,58,0];
    function starsRow(n){var h="";for(var i=0;i<3;i++)h+='<i class="'+(i<n?"on":"")+'">⭐</i>';return '<div class="stars">'+h+'</div>';}

    if(world){
      document.body.style.background=world.sky||"#cfe8fb";
      $("wname").textContent=(world.theme||"")+" "+(world.name||W);
      $("wsub").textContent=(S&&S.campaignSounds?("practicing "+S.campaignSounds().map(lbl).join(" · ")):"");
      $("wstars").textContent="⭐ "+((S&&S.worldStars)?S.worldStars(W):0);
      (function(){var im=new Image();im.onload=function(){$("bg").style.backgroundImage="url("+im.src+")";};im.src="/coach/worlds/"+W+"-bg.png";})();

      var curIdx=-1;
      for(var k=0;k<levels.length;k++){ if(S.levelUnlocked(levels[k]) && S.levelStars(levels[k].id)===0){ curIdx=k; break; } }
      var allDone=levels.every(function(l){return S.levelStars(l.id)>0;});

      var path=$("path");
      var pr=document.createElement("div"); pr.className="prize"+(allDone?"":" locked");
      pr.innerHTML='<div class="chest">'+(allDone?"🏆":"🎁")+'</div><div class="cap">'+(allDone?"World complete!":"Clear all "+levels.length+" to win!")+'</div>';
      path.appendChild(pr);

      for(var i=levels.length-1;i>=0;i--){
        (function(l,idx){
          var open=S.levelUnlocked(l), st=S.levelStars(l.id), m=meta(l.game), isCur=(idx===curIdx);
          var node=document.createElement("button");
          node.className="node"+(l.boss?" boss":"")+(open?"":" locked")+(isCur?" cur":"");
          node.dataset.id=l.id;
          node.style.transform="translateX("+(OFF[idx%OFF.length])+"px)";
          var face=open?(l.boss?"👑":m.icon):"🔒";
          node.innerHTML=(isCur?'<span class="leo">🦁</span>':'')+'<span class="pin" style="--c:'+m.c+'">'+face+'</span>'+starsRow(st);
          node.onclick=function(){
            if(S&&S.sfx&&S.sfx.tap)S.sfx.tap();
            if(!open){ var p=node.querySelector(".pin"); p.animate&&p.animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(0)"}],{duration:200}); return; }
            S.campaignLaunch(l);
            var game="/"+String(l.game).replace(/^\//,"")+"?sound="+encodeURIComponent(l.sound)+"&diff="+(l.diff||1);
            location.href="/model.html?sound="+encodeURIComponent(l.sound)+"&next="+encodeURIComponent(game);
          };
          path.appendChild(node);
        })(levels[i],i);
      }
    }
    $("back").onclick=function(){ if(S&&S.sfx&&S.sfx.tap)S.sfx.tap(); location.href="/map.html"; };

    requestAnimationFrame(function(){
      var res=(S&&S.campaignResolve)?S.campaignResolve():null;
      var cur=document.querySelector(".node.cur")||document.querySelector('.node[data-id]');
      if(cur)cur.scrollIntoView({block:"center"});
      if(res){
        $("wstars").textContent="⭐ "+((S&&S.worldStars)?S.worldStars(W):0);
        var el=document.querySelector('.node[data-id="'+res.id+'"]');
        if(el){ el.classList.add("pop"); var sr=el.querySelector(".stars"); if(sr){sr.innerHTML="";for(var i=0;i<3;i++){var ii=document.createElement("i");if(i<res.stars)ii.className="on";ii.textContent="⭐";sr.appendChild(ii);} } }
        var t=$("toast");
        $("tStars").textContent="★★★".slice(0,res.stars)+"☆☆☆".slice(0,3-res.stars);
        $("tTitle").textContent=res.stars>=3?"Perfect! 3 stars!":(res.improved?"New best!":"Level clear!");
        $("tSub").textContent=Math.round(res.acc*100)+"% accurate";
        setTimeout(function(){ t.classList.add("show"); if(S.confetti)S.confetti(); if(S.sfx&&S.sfx.complete)S.sfx.complete(); },300);
        setTimeout(function(){ t.classList.remove("show"); location.reload(); },2600);
      }
    });
  </script>
</body>
</html>
