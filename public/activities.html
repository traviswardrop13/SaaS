<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sona — Play library</title>
  <script>
    // Keep saved library links, preview state and locked-game notices working.
    // The library is Home's Arcade since 22 Oct 2026 (STORY1), so an old link
    // opens it: view=arcade is added only when the address names no view and
    // no locked game (?locked= opens the Arcade by itself); the rest of the
    // address and its # part are kept exactly.
    var q = location.search;
    if (!/[?&](?:view|locked)=/.test(q)) q = (q ? q + "&" : "?") + "view=arcade";
    location.replace("/today.html" + q + location.hash);
  </script>
</head>
<body><a href="/today.html?view=arcade">Open the Play library</a></body>
</html>
