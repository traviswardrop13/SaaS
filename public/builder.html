<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — Block Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1cb0f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root{ --blue:#1cb0f6; --blue-d:#1597d4; --green:#58cc02; --green-d:#46a302; --ink:#16384f; }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;}
    html,body{height:100%;}
    body{background:linear-gradient(180deg,#bfe7ff 0%,#d9f2ff 34%,#eafaf0 62%,#d2efbf 100%);display:flex;justify-content:center;overflow:hidden;}
    #app{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;}
    header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;}
    #close{width:38px;height:38px;border:none;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(20,90,150,.18);color:#3a6b86;font-size:22px;font-weight:800;cursor:pointer;}
    .htitle{font-family:"Baloo 2";font-weight:800;font-size:18px;color:var(--ink);}
    .count{margin-left:auto;font-family:"Baloo 2";font-weight:800;font-size:15px;color:var(--blue-d);background:#fff;border-radius:99px;padding:5px 12px;box-shadow:0 3px 8px rgba(20,90,150,.14);}
    /* tower */
    #stage{flex:1;position:relative;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;padding:8px 16px 0;overflow:hidden;}
    #ground{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(180deg,#9fe06a,#7fce4e);}
    .tower{display:flex;flex-direction:column-reverse;align-items:center;position:relative;z-index:2;margin-bottom:26px;}
    .block{width:120px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:5px;
      box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 3px 6px rgba(0,0,0,.12);animation:drop .45s cubic-bezier(.3,1.4,.5,1);}
    @keyframes drop{0%{transform:translateY(-220px) rotate(-6deg);opacity:0;}70%{transform:translateY(0) rotate(2deg);}100%{transform:translateY(0) rotate(0);opacity:1;}}
    #topper{font-size:34px;opacity:0;transition:opacity .4s;}
    #topper.show{opacity:1;animation:bob 2s ease-in-out infinite;}
    @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
    .leoSide{position:absolute;left:10px;bottom:26px;width:80px;height:80px;object-fit:contain;z-index:3;filter:drop-shadow(0 6px 8px rgba(20,90,160,.25));}
    .leoSide.react{animation:cheer .5s ease;}
    @keyframes cheer{0%{transform:scale(1);}50%{transform:scale(1.14) rotate(-4deg);}100%{transform:scale(1);}}
    /* word card + mic */
    .panel{padding:10px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;}
    #wordCard{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 18px;box-shadow:0 6px 16px -8px rgba(20,90,150,.5);}
    #wEmoji{font-size:34px;} #wText{font-family:"Baloo 2";font-weight:800;font-size:24px;color:var(--ink);}
    #prompt{font-weight:800;font-size:15px;color:var(--ink);min-height:22px;margin-top:10px;}
    #micline{margin-top:8px;height:18px;}
    #micline.live #micText{color:var(--green-d);}
    #micText{font-weight:800;font-size:13px;color:#8aa0b5;}
    .mic{margin-top:8px;width:74px;height:74px;border-radius:50%;border:none;background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d);font-size:32px;cursor:pointer;}
    .mic.rec{animation:mglow 1.1s ease-in-out infinite;}
    @keyframes mglow{0%,100%{box-shadow:0 6px 0 var(--blue-d),0 0 0 0 rgba(28,176,246,.5);}50%{box-shadow:0 6px 0 var(--blue-d),0 0 0 15px rgba(28,176,246,0);}}
    #hear{margin-top:8px;background:none;border:none;color:var(--blue-d);font-weight:800;font-size:13px;cursor:pointer;}
    /* win */
    #win{position:fixed;inset:0;background:rgba(12,28,46,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:24px;}
    #win.show{display:flex;}
    .wcard{background:#fff;border-radius:22px;padding:26px 22px;max-width:340px;text-align:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);}
    .wcard .big{font-size:54px;} .wcard h2{font-family:"Baloo 2";font-weight:800;font-size:23px;color:var(--ink);margin-top:6px;}
    .wcard p{color:#6b86a3;font-weight:700;margin-top:6px;}

    /* ═══════════════════════════════════════════════════════════════════
       VISUAL POLISH LAYER — additive, CSS-only. Mirrors the shared Sona
       design system (sona-drift / sona-floatY / sona-glow look in
       /public/sona.css) so Block Builder speaks the same visual language
       as the rest of the app. Animates transform/opacity (box-shadow used
       sparingly for glows); never touches game logic or the DOM. All depth
       rides on ::before/::after + background layers of EXISTING nodes.
       NOTE: JS sets each .block background inline (COLORS[]) — we never
       fight that; blocks only gain a shared grounding shadow.
       ═══════════════════════════════════════════════════════════════════ */

    /* Reused scenery keyframes (same names/values as /public/sona.css). */
    @keyframes sona-drift{from{transform:translateX(0)}to{transform:translateX(-130vw)}}
    @keyframes sona-floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes sona-twinkle{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.1)}}

    /* ── SKY ── a brighter, construction-yard sky painted on #stage::before:
       a warm sun glow up high, two soft distant hills sitting just above the
       grass strip, and a couple of gentle floating "balloon" dots. z-index:0
       keeps it behind the tower (z-index:2), Leo (z-index:3) and #ground. */
    #stage::before{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        /* soft floating accent shapes (drift handled by ::after clouds; these
           gently bob with the whole layer feel via sona-floatY below) */
        radial-gradient(13px 13px at 22% 30%, rgba(255,170,90,.30) 0 60%, rgba(255,170,90,0) 64%),
        radial-gradient(10px 10px at 84% 22%, rgba(124,189,255,.34) 0 60%, rgba(124,189,255,0) 64%),
        /* warm sun glow, upper-right */
        radial-gradient(64% 46% at 82% -8%, rgba(255,222,150,.55), rgba(255,222,150,0) 62%),
        radial-gradient(52% 36% at 14% 0%, rgba(255,180,120,.18), rgba(255,180,120,0) 58%),
        /* two distant rolling hills resting just above the ground band */
        radial-gradient(40% 22% at 22% 100%, #9bd96f 0 60%, rgba(155,217,111,0) 63%),
        radial-gradient(48% 26% at 74% 100%, #8ad05c 0 60%, rgba(138,208,92,0) 63%);
      animation:sona-floatY 9s ease-in-out infinite;will-change:transform;
    }
    /* ── DRIFTING CLOUDS ── soft CSS puffs scrolling slowly across the sky
       via the shared sona-drift, giving the build screen calm, alive depth.
       Lives on #stage::after, still behind the tower (tree order + z-index). */
    #stage::after{
      content:"";position:absolute;top:6%;left:0;width:260vw;height:42%;z-index:0;pointer-events:none;opacity:.78;
      background:
        radial-gradient(42px 18px at 10% 26%, #fff 0 60%, rgba(255,255,255,0) 64%),
        radial-gradient(60px 24px at 28% 50%, rgba(255,255,255,.94) 0 60%, rgba(255,255,255,0) 64%),
        radial-gradient(36px 16px at 50% 20%, rgba(255,255,255,.85) 0 60%, rgba(255,255,255,0) 64%),
        radial-gradient(66px 26px at 72% 42%, #fff 0 60%, rgba(255,255,255,0) 64%),
        radial-gradient(44px 18px at 92% 26%, rgba(255,255,255,.9) 0 60%, rgba(255,255,255,0) 64%);
      animation:sona-drift 60s linear infinite;will-change:transform;
    }
    /* Keep the tower group above the new sky layers and give the stack a
       soft contact shadow so it feels planted on the grass (no transform →
       safe alongside the JS .block drop animation). */
    .tower{filter:drop-shadow(0 6px 7px rgba(20,90,160,.16));}
    /* keep the grass strip above the z:0 sky layers, below the tower/Leo */
    #ground{z-index:1;box-shadow:0 -2px 6px rgba(40,120,40,.18),inset 0 2px 0 rgba(255,255,255,.25);}

    /* ── TOWER TOPPER (the 🚩 flag) ── once the tower is finished it gets a
       gentle celebratory glow halo behind it; bob keeps running from base CSS. */
    #topper{position:relative;}
    #topper.show{filter:drop-shadow(0 4px 10px rgba(255,180,60,.6));}
    #topper.show::before{content:"";position:absolute;left:50%;top:54%;width:64px;height:64px;
      transform:translate(-50%,-50%);border-radius:50%;z-index:-1;pointer-events:none;
      background:radial-gradient(closest-side, rgba(255,214,120,.55), rgba(255,214,120,0) 72%);
      animation:sona-twinkle 2.4s ease-in-out infinite;will-change:opacity,transform;}

    /* ── COUNT PILL (progress) ── flat white → a bright blue gradient chip
       with rounded corners and a soft glow, so progress reads as a reward. */
    #count{
      color:#fff;
      background:linear-gradient(180deg,#56b8ff,var(--blue));
      box-shadow:0 3px 8px rgba(20,110,200,.32),inset 0 1px 0 rgba(255,255,255,.45);
    }

    /* ── WORD CARD ── a touch more lift + a top sheen so the prompt pops. */
    #wordCard{box-shadow:0 8px 18px -8px rgba(20,90,150,.5),inset 0 1px 0 rgba(255,255,255,.7);
      background:linear-gradient(180deg,#ffffff,#f4fbff);}

    /* ── MIC ── breathing glow while IDLE (mirrors the shared glow-pulse).
       Each keyframe preserves the chunky 3D base shadow so the button keeps
       its depth. The existing .rec state keeps its stronger active pulse. */
    .mic{animation:micBreath 2.6s ease-in-out infinite;will-change:box-shadow;}
    @keyframes micBreath{
      0%,100%{box-shadow:0 6px 0 var(--blue-d),0 0 0 0 rgba(28,176,246,0);}
      50%{box-shadow:0 6px 0 var(--blue-d),0 0 0 11px rgba(28,176,246,.16);}
    }
    .mic:active{transform:translateY(3px);box-shadow:0 3px 0 var(--blue-d);}
    .mic.rec{animation:mglow 1.1s ease-in-out infinite;}  /* keep active pulse on top */

    /* ── WIN SCREEN ── a soft celebratory radial wash behind the card and a
       juicier entrance pop on the card itself (scale + settle). */
    #win{position:fixed;}
    #win::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(58% 44% at 50% 32%, rgba(255,214,140,.5), rgba(255,214,140,0) 70%);}
    #win.show .wcard{animation:winPop .5s cubic-bezier(.2,1.35,.4,1) both;}
    @keyframes winPop{0%{transform:scale(.78);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
    #win .wcard{box-shadow:0 20px 50px -18px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.5) inset;}
    #win .wcard .big{animation:bob 2s ease-in-out infinite;will-change:transform;}

    /* Accessibility: calm every loop for reduced-motion users / battery. */
    @media (prefers-reduced-motion: reduce){
      #stage::before,#stage::after,#topper.show::before,.mic,.mic.rec,#win.show .wcard,#win .wcard .big,#topper.show{
        animation:none !important;}
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <button id="close" title="Back">‹</button>
      <span class="htitle">Build the tower! 🧱</span>
      <span id="rungBadge" style="font-family:'Baloo 2';font-weight:800;font-size:11px;color:#3a6b86;background:rgba(255,255,255,.7);border-radius:99px;padding:3px 9px;margin-left:6px;white-space:nowrap;"></span>
      <span class="count" id="count">0 / 0</span>
    </header>
    <div id="stage">
      <img class="leoSide" id="leo" src="/coach/leo.png" alt="Leo" onerror="this.style.display='none';" />
      <div id="ground"></div>
      <div class="tower" id="tower"><div id="topper">🚩</div></div>
    </div>
    <div class="panel">
      <div id="wordCard"><span id="wEmoji">🧱</span><span id="wText">…</span></div>
      <div id="prompt">Say the word to add a block!</div>
      <div id="micline"><span id="micText"></span></div>
      <button class="mic" id="mic" title="Say it">🎤</button><br/>
      <button id="hear">🔊 Hear it</button>
    </div>
  </div>

  <div id="win"><div class="wcard">
    <div class="big">🏰</div><h2 id="winTitle">You built it!</h2>
    <p id="winSub"></p>
  </div></div>

  <script src="/sona.js"></script>
  <script src="/gamecontent.js"></script>
  <script>
    var $=function(id){return document.getElementById(id);};
    var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
    var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
    var profile=(window.Sona?Sona.getProfile():{focusSounds:["R"],voiceId:"",volume:0.8});
    var params=new URLSearchParams(location.search);
    var SOUND=(params.get("sound")||(profile.focusSounds&&profile.focusSounds[0])||"R").toUpperCase();
    if(!(window.Sona&&Sona.WORDS&&Sona.WORDS[SOUND])) SOUND="R";
    // ── SLP CONTENT LADDER ── serve the child's CURRENT rung for this sound
    //    (isolation→syllable→word→phrase→sentence) instead of always WORD level.
    var RUNG=(window.Sona&&Sona.rungOf)?Sona.rungOf(SOUND):2; if(RUNG>5)RUNG=5;
    var ITEMS=(window.Sona&&Sona.ladderContent)?Sona.ladderContent(SOUND,RUNG):[];
    if(RUNG>=5 && (!ITEMS.length || (ITEMS[0]&&ITEMS[0].q))){ RUNG=4; ITEMS=Sona.ladderContent(SOUND,4); } // arcade can't do conversation -> use sentences
    if(!ITEMS.length){ ITEMS=((window.Sona&&Sona.wordsFor)?Sona.wordsFor(SOUND):[]).map(function(w){return {t:w.w,say:w.w,display:w.w,e:w.e,word:w.w,level:"word",mode:"full"};}); }
    // POOL is now the ladder ITEMS (same game mechanic, rung-aware content).
    var POOL=ITEMS;
    var DIFF=(window.Sona&&Sona.diff)?Sona.diff():1;
    // ── 10 DISTINCT LEVELS ── Build Site journey: sandbox → cottage → house →
    //    tower → bridge → skyscraper → castle → ... → grand opening (boss).
    //    KNOB: `blocks` = tower height = how many words to say (length/challenge),
    //    gentle (5) at L1 up to a tall-but-fair 14 at L10. SCENE = the structure
    //    you're building that day (distinct bg + accent + ambient props).
    var LEVELS=[
      {name:"Sandbox",     bg:"linear-gradient(180deg,#fff0c2 0%,#ffe39a 46%,#f6d27a 100%)", accent:"#e9a13b", props:["🪣","⛏️","🌤️"], blocks:5},
      {name:"Cottage",     bg:"linear-gradient(180deg,#cdeffd 0%,#e6f7e2 58%,#cfe9b4 100%)", accent:"#5cb85c", props:["🏡","🌷","🐝"], blocks:6},
      {name:"Garden Wall", bg:"linear-gradient(180deg,#c5ecff 0%,#e9f6d6 56%,#bfe49a 100%)", accent:"#7bbf3a", props:["🧱","🌻","🦋"], blocks:7},
      {name:"Town House",  bg:"linear-gradient(180deg,#bfe0ff 0%,#dbeeff 60%,#cbe0c2 100%)", accent:"#1cb0f6", props:["🏠","🪟","🐦"], blocks:8},
      {name:"River Bridge",bg:"linear-gradient(180deg,#aee0ff 0%,#cdeeff 52%,#8fd0ef 100%)", accent:"#2ea7c9", props:["🌉","🚤","🌊"], blocks:9},
      {name:"Lighthouse",  bg:"linear-gradient(180deg,#ffd9a8 0%,#ffc08a 44%,#7fb6d6 100%)", accent:"#ff8a3d", props:["🗼","🌅","🕊️"], blocks:10},
      {name:"Skyscraper",  bg:"linear-gradient(180deg,#9fd0ff 0%,#bfe1ff 50%,#cfd9e6 100%)", accent:"#3b7fd6", props:["🏙️","✈️","☁️"], blocks:11},
      {name:"Castle",      bg:"linear-gradient(180deg,#cdb8ff 0%,#e2d3ff 54%,#bca4e6 100%)", accent:"#8b5cf6", props:["🏰","🛡️","🚩"], blocks:12},
      {name:"Sky City",    bg:"linear-gradient(180deg,#ffc8e6 0%,#d6c8ff 48%,#aecdff 100%)", accent:"#d65cc0", props:["🌆","🎈","🌈"], blocks:13},
      {name:"Grand Opening",bg:"radial-gradient(120% 100% at 50% 0%,#fff1b8 0%,#ffd36b 30%,#ff9ec4 64%,#9b7bff 100%)", accent:"#ffb000", props:["🏆","🎆","🎉"], blocks:14}
    ];
    var L=LEVELS[Math.min(9,Math.max(0,DIFF-1))];
    var GOAL=Math.min(14,L.blocks);               // taller tower as levels climb (longer game)
    var COLORS=["#ff7a6e","#ffb24d","#ffd45e","#7dd470","#62bdff","#9b7bff","#ff8fb0"];
    // Paint THIS level's scene on the real stage element + tint accents.
    (function(){
      var stage=document.getElementById("stage")||document.body;
      if(L.bg) stage.style.background=L.bg;
      if(L.accent){
        try{ document.documentElement.style.setProperty("--blue",L.accent);
             document.documentElement.style.setProperty("--blue-d",L.accent); }catch(e){}
      }
      // PER-LEVEL ART-DROP OVERRIDE: drop /coach/builder/lvl<N>.png to replace
      // the CSS scene with real art (cover). Falls back to bg.png, then CSS.
      function tryArt(src,next){ var im=new Image();
        im.onload=function(){ stage.style.backgroundImage="url("+im.src+")"; stage.style.backgroundSize="cover"; stage.style.backgroundPosition="center"; };
        im.onerror=function(){ if(next)next(); };
        im.src=src; }
      tryArt("/coach/builder/lvl"+DIFF+".png",function(){ tryArt("/coach/builder/bg.png",null); });
      // Faint ambient props drifting on the existing sky layer feel.
      if(L.props&&L.props.length){
        var amb=document.createElement("div");
        amb.style.cssText="position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;";
        for(var i=0;i<L.props.length;i++){ var s=document.createElement("span");
          s.textContent=L.props[i];
          s.style.cssText="position:absolute;font-size:30px;opacity:.30;top:"+(10+i*22)+"%;left:"+(12+i*34)+"%;animation:sona-floatY "+(7+i*2)+"s ease-in-out infinite;";
          amb.appendChild(s); }
        stage.insertBefore(amb, stage.firstChild);
      }
    })();
    var placed=0, queue=[], current=null;
    var correct=0, total=0; // round mastery tracking for Sona.recordRung
    $("count").textContent="0 / "+GOAL;
    try{ var rb=$("rungBadge"); if(rb) rb.textContent="Practicing: "+((window.Sona&&Sona.rungLabel)?Sona.rungLabel(RUNG):""); }catch(e){}

    var audioCtx=null;
    function getCtx(){ if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
    function playPCM(bytes){ return new Promise(function(res){ try{ var ctx=getCtx(); var n=bytes.byteLength>>1; var ab=ctx.createBuffer(1,n,24000); var ch=ab.getChannelData(0); var dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); for(var i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768; var s=ctx.createBufferSource(); s.buffer=ab; s.playbackRate.value=(window.Sona&&Sona.VOICE_PITCH)||1; var g=ctx.createGain(); g.gain.value=(profile.volume!=null?profile.volume:0.8); s.connect(g); g.connect(ctx.destination); s.onended=res; s.start(); }catch(e){res();} }); }
    var speaking=false;
    function say(text){ return new Promise(function(res){ if(!text||speaking){return res();} speaking=true; fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,voice:profile.voiceId||""})}).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(b){ if(b) return playPCM(new Uint8Array(b)); }).catch(function(){}).finally(function(){speaking=false;res();}); }); }
    function setLeo(s){ var L={idle:"/coach/leo.png",cheer:"/coach/poses/leo-celebrate.png"}; var el=$("leo"); if(el&&L[s])el.src=L[s]; }
    function leoReact(){ var el=$("leo"); if(!el)return; el.classList.remove("react"); void el.offsetWidth; el.classList.add("react"); }
    function sfx(n){ try{ if(window.Sona&&Sona.sfx&&Sona.sfx[n])Sona.sfx[n](); }catch(e){} }

    var micStream=null, useSpeechAce=false;
    function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
    function matchText(t,w){ t=norm(t); w=norm(w); if(!t)return false; return t.indexOf(w)>=0||w.indexOf(t)>=0; }
    function recordTurn(maxMs){ maxMs=maxMs||7000; return new Promise(function(resolve){
      var done=false,chunks=[],rec=null,sr=null,transcript="",spoke=false,lastV=0,raf=null,src=null;
      $("micline").classList.add("live"); $("micText").textContent="Say it!"; $("mic").classList.add("rec");
      function fin(){ if(done)return; done=true; try{rec&&rec.state!=="inactive"&&rec.stop();}catch(e){} try{sr&&sr.stop();}catch(e){} if(raf)cancelAnimationFrame(raf); try{src&&src.disconnect();}catch(e){} $("micline").classList.remove("live"); $("micText").textContent=""; $("mic").classList.remove("rec"); setTimeout(function(){resolve({transcript:transcript,blob:chunks.length?new Blob(chunks,{type:(rec&&rec.mimeType)||"audio/webm"}):null,spoke:spoke});},120); }
      try{ if(micStream&&window.MediaRecorder){ rec=new MediaRecorder(micStream); rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(); } }catch(e){}
      try{ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ sr=new SR(); sr.lang="en-US"; sr.interimResults=false; sr.maxAlternatives=3; sr.onresult=function(ev){for(var i=0;i<ev.results.length;i++)for(var k=0;k<ev.results[i].length;k++)transcript+=" "+ev.results[i][k].transcript; fin();}; sr.onerror=function(){}; sr.start(); } }catch(e){}
      try{ if(micStream){ var ctx=getCtx(); src=ctx.createMediaStreamSource(micStream); var an=ctx.createAnalyser(); an.fftSize=512; src.connect(an); var td=new Uint8Array(an.fftSize); var t0=performance.now(),nS=0,nN=0,thr=0,vms=0,lt=0;
        (function tick(){ if(done)return; an.getByteTimeDomainData(td); var sum=0; for(var i=0;i<td.length;i++){var d=(td[i]-128)/128;sum+=d*d;} var rms=Math.sqrt(sum/td.length),now=performance.now();
          if(now-t0<450){nS+=rms;nN++;lt=now;} else { if(!thr)thr=Math.max(0.05,(nS/Math.max(1,nN))*3.2); var dt=now-lt;lt=now; if(rms>thr){vms+=dt;lastV=now;if(vms>=250)spoke=true;}else if(rms<thr*0.65)vms=Math.max(0,vms-dt*0.5); if(spoke&&now-lastV>=800){fin();return;} }
          raf=requestAnimationFrame(tick); })(); } }catch(e){}
      setTimeout(fin,maxMs); }); }
    var lastFb="";
    async function scoreWord(word,res){ lastFb="";
      var scoreText=word.t||word.w; var mode=word.mode||"full";
      if(useSpeechAce && res.blob){ try{ var fd=new FormData(); fd.append("audio",new File([res.blob],"a.webm",{type:res.blob.type||"audio/webm"})); fd.append("text",scoreText); fd.append("targetSound",SOUND); fd.append("userId","child"); fd.append("mode",mode); var r=await fetch("/api/score",{method:"POST",body:fd}); var j=await r.json(); if(j&&j.ok&&j.rating){ lastFb=j.feedback||""; return j.rating==="great"; } }catch(e){} }
      if(res.transcript) return matchText(res.transcript,scoreText);
      return false;
    }

    // Default emoji/icon when an item has none (isolation/syllable/sentence).
    var ICON=(window.Sona&&Sona.soundEmoji&&Sona.soundEmoji(SOUND))||"🧱";
    // CYCLE through ITEMS (modulo): refill the queue from a shuffle whenever
    // empty, so short rungs (isolation = 1 item) still feed enough turns.
    function nextWord(){ if(!queue.length) queue=shuffle(POOL.length?POOL:[{t:SOUND,say:SOUND,display:SOUND,mode:"full"}]); return queue.pop(); }
    function showWord(w){ current=w; $("wEmoji").textContent=w.e||ICON; $("wText").textContent=w.display||w.t||w.w||""; }
    function addBlock(w){
      var b=document.createElement("div"); b.className="block"; b.style.background=COLORS[placed%COLORS.length];
      b.textContent=w.e||ICON; $("tower").appendChild(b);
      placed++; $("count").textContent=placed+" / "+GOAL;
    }

    async function attempt(){
      $("mic").onclick=null;
      setLeo("idle");
      var res=await recordTurn();
      var ok=await scoreWord(current,res);
      total++; if(ok)correct++;
      if(window.Sona&&Sona.logAttempt)Sona.logAttempt({game:"builder",sound:SOUND,pass:ok,word:current.t||current.w});
      if(ok){
        sfx("correct"); setLeo("cheer"); leoReact();
        addBlock(current);
        $("prompt").textContent=pick(["Nice block!","Up it goes!","Strong!","Keep building!"]);
        if(placed>=GOAL){ return finishGame(); }
        if(placed===Math.ceil(GOAL/2)){ $("prompt").textContent="Halfway up! 🙌"; }
        await new Promise(function(r){ setTimeout(r,650); });
        round();
      } else {
        sfx("tap"); setLeo("idle");
        $("prompt").textContent=(window.Sona&&Sona.coachLine)?Sona.coachLine(SOUND,lastFb):"Let's try again!";
        await say(lastFb||("Let's try "+(current.say||current.t||current.w)+" again."));
        setTimeout(attempt,300); // same word again
      }
    }
    async function round(){
      showWord(nextWord());
      var lvl=current.level||"word";
      // Sound-coaching at the lowest rungs: model the sound the way an SLP
      // would; at word+ just present the word/phrase/sentence.
      if(lvl==="isolation"||lvl==="syllable"){
        $("prompt").textContent="Say the sound to add a block!";
        var cue=(window.Sona&&Sona.repeatCue)?Sona.repeatCue(SOUND):(current.say||current.t);
        await say(cue);
      } else {
        $("prompt").textContent="Say it to add a block!";
        await say(current.say||current.t||current.w);
      }
      attempt();
    }
    function finishGame(){
      // Record this round's mastery at the served rung; encouraging gating in
      // Sona advances the ladder at ~80% and never regresses.
      try{ window.Sona&&Sona.recordRung&&Sona.recordRung(SOUND,RUNG,correct/Math.max(1,total)); }catch(e){}
      try{ var bigEl=document.querySelector("#win .big"); if(bigEl&&L.props&&L.props[0]) bigEl.textContent=L.props[0]; }catch(e){}
      $("topper").classList.add("show");
      sfx("complete"); if(window.Sona){ Sona.confetti&&Sona.confetti(); Sona.addCoins&&Sona.addCoins(10); }
      $("winSub").textContent="A "+GOAL+"-block tower! +10 🪙";
      setTimeout(function(){ $("win").classList.add("show"); if(window.Sona&&Sona.sessionButtons)Sona.sessionButtons($("win")); }, 700);
    }

    $("hear").onclick=function(){ if(current) say(current.say||current.t||current.w); };
    $("mic").onclick=function(){ attempt(); };
    $("close").onclick=function(){ location.href="/map.html"; };
    window.addEventListener("pagehide",function(){ try{ if(micStream)micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} });

    (async function(){
      try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micStream=null; }
      try{ var r=await fetch("/api/score"); var j=await r.json(); useSpeechAce=!!(j&&j.hasKey); }catch(e){ useSpeechAce=false; }
      if(window.Sona&&Sona.music) Sona.music.start();
      round();
    })();
  </script>
</body>
