<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sona — practice path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sona.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    /* inside a sound house: bright playroom tinted with the house's colors */
    :root{ --ring:#4db6ff; --ringD:#2f9be4; --wallA:#fff3ee; --wallB:#ffe4dc; --wm:rgba(77,182,255,.13); }
    body{background:linear-gradient(180deg,var(--wallA),var(--wallB)) fixed;}
    /* giant letter on the wall */
    #wm{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;
      font-family:"Baloo 2";font-weight:800;font-size:min(80vw,430px);line-height:1;color:var(--wm);}
    /* party bunting along the top */
    #bunting{position:fixed;top:0;left:0;right:0;z-index:0;pointer-events:none;}
    .wrap{position:relative;z-index:1;max-width:560px;}

    header.unit{display:flex;align-items:center;gap:12px;padding:14px 2px 4px;}
    .backbtn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;cursor:pointer;font-size:20px;color:var(--ring);
      box-shadow:0 4px 0 0 rgba(15,39,66,.14);display:flex;align-items:center;justify-content:center;transition:transform .05s;flex:0 0 auto;}
    .backbtn:active{transform:translateY(3px);box-shadow:0 1px 0 0 rgba(15,39,66,.14);}
    .unitTitle{flex:1;text-align:center;}
    .unitTitle b{display:inline-block;font-family:"Baloo 2";font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;
      color:#fff;background:var(--ring);padding:8px 20px;border-radius:99px;box-shadow:0 4px 0 0 var(--ringD);}
    .unitTitle span{display:block;font-weight:800;font-size:12.5px;color:var(--muted);margin-top:7px;letter-spacing:.03em;}
    .coinsPill{display:flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:8px 14px;flex:0 0 auto;
      font-family:"Baloo 2";font-weight:800;color:#e08600;font-size:15px;box-shadow:0 4px 0 0 rgba(15,39,66,.14);}

    /* the step path */
    .path{margin-top:30px;padding-bottom:36px;}
    .path:before{background:repeating-linear-gradient(rgba(16,36,58,.16) 0 10px,transparent 10px 24px);top:0;bottom:46px;}
    .node{margin-bottom:36px;}
    .node .bubble{width:104px;height:104px;font-size:40px;background:#fff;color:var(--ring);
      border:5px solid var(--ring);box-shadow:0 7px 0 0 rgba(15,39,66,.14);}
    .node .bubble:active{box-shadow:0 2px 0 0 rgba(15,39,66,.14);}
    .node.cur .bubble{box-shadow:0 0 0 8px rgba(255,255,255,.75),0 7px 0 0 rgba(15,39,66,.14);}
    .node.done .bubble{background:linear-gradient(160deg,#ffd95e,#ffb627);border-color:#e0a51c;color:#7a5600;}
    .node.locked .bubble{background:#f3ede2;border-color:#ddd2bc;color:#bfae90;cursor:default;}
    .node .label{color:var(--ink);font-family:"Baloo 2";font-size:15px;}
    .node.chest .bubble{font-size:46px;}
    .node.chest.ready .bubble{background:linear-gradient(160deg,#ffd33d,#ff9f1c);border-color:#cf8c12;}
    .leoToken{top:-48px;font-size:0;}
    .leoToken img{width:48px;height:48px;object-fit:contain;}
  </style>
</head>
<body>
  <div id="wm">R</div>
  <svg id="bunting" viewBox="0 0 600 64" preserveAspectRatio="xMidYMin slice" height="64"></svg>

  <div class="wrap">
    <header class="unit">
      <button class="backbtn" id="back" title="Back">←</button>
      <div class="unitTitle"><b id="uTitle">R SOUND</b><span id="uSub">3 steps to the prize!</span></div>
      <span class="coinsPill">🪙 <span id="coins">0</span></span>
    </header>

    <div class="path" id="path"></div>
  </div>

  <div id="prize" class="cele">
    <div class="box">
      <div class="big">🎁</div>
      <h2 id="przTitle">You did it!</h2>
      <p id="przMsg">You finished every step!</p>
      <button class="btn" id="przClose" style="margin-top:18px;">Collect +25 🪙</button>
    </div>
  </div>

  <script src="/sona.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var p = Sona.getProfile();
    var name = (p.childName || "").trim();
    var SOUNDS = (p.focusSounds && p.focusSounds.length) ? p.focusSounds : ["R", "S", "L", "K"];
    var SOUND = (params.get("sound") || SOUNDS[0] || "R").toUpperCase();
    var st = Sona.stageOf(SOUND); // 0..3
    var claimed = Sona.chestClaimed(SOUND);

    // theme the room with this sound's house colors
    var idx = Math.max(0, SOUNDS.indexOf(SOUND));
    var TH = Sona.HOUSE_PALETTE[idx % Sona.HOUSE_PALETTE.length];
    var rootSt = document.documentElement.style;
    rootSt.setProperty("--ring", TH.roof); rootSt.setProperty("--ringD", TH.roofD);
    rootSt.setProperty("--wallA", TH.wallA); rootSt.setProperty("--wallB", TH.wallB);
    rootSt.setProperty("--wm", TH.wm);
    document.getElementById("wm").textContent = SOUND;

    // bunting flags in the room's colors
    (function () {
      var colors = [TH.roof, TH.body, "#ffd14a", "#6ecb63", "#ff6b9a"];
      var svg = '<path d="M0 8 H600" stroke="rgba(16,36,58,.18)" stroke-width="3"/>';
      for (var x = 6, k = 0; x < 600; x += 46, k++) {
        svg += '<path d="M' + x + ' 8 h36 l-18 38 z" fill="' + colors[k % colors.length] + '" opacity=".92"/>';
      }
      document.getElementById("bunting").innerHTML = svg;
    })();

    document.getElementById("uTitle").textContent = SOUND + " SOUND";
    document.getElementById("uSub").textContent = claimed ? "Prize collected — keep practicing!" : (st >= 3 ? "Open your prize!" : (3 - st) + " step" + (3 - st === 1 ? "" : "s") + " to the prize!");
    document.getElementById("coins").textContent = Sona.getCoins();
    document.getElementById("back").onclick = function () { location.href = "/home.html"; };

    var STEPS = [
      { label: "Say the sound", icon: SOUND },
      { label: "Syllables", icon: (SOUND.toLowerCase() + "a·" + SOUND.toLowerCase() + "o") },
      { label: "Words", icon: { R: "🐰", S: "☀️", L: "🦁", K: "🐱", G: "🐐", F: "🐟", SH: "👟", CH: "🧀", TH: "👍" }[SOUND] || "⭐" },
    ];
    var BUDDY = Sona.characterById(p.character);

    var pathEl = document.getElementById("path");
    STEPS.forEach(function (s, i) {
      var done = st > i, open = st >= i, current = open && !done;
      var node = document.createElement("div");
      node.className = "node" + (done ? " done" : "") + (open ? "" : " locked") + (current ? " cur" : "");
      node.style.transform = "translateX(" + Math.round(Math.sin((i + 1) * 1.7) * 70) + "px)";
      var face = done ? "✓" : (open ? s.icon : "🔒");
      var small = (typeof face === "string" && face.length > 2) ? ' style="font-size:24px;"' : "";
      node.innerHTML =
        (current ? '<div class="leoToken">' + (BUDDY.img ? '<img src="' + BUDDY.img + '" alt=""/>' : BUDDY.emoji) + '</div>' : "") +
        '<button class="bubble"' + small + ">" + face + "</button>" +
        '<div class="label">' + s.label + "</div>" +
        '<div class="lvl">Level ' + (i + 1) + "</div>";
      if (open) node.querySelector(".bubble").onclick = function () {
        if (window.Sona) Sona.sfx.tap();
        location.href = "/lesson.html?sound=" + encodeURIComponent(SOUND) + "&stage=" + i + (name ? "&name=" + encodeURIComponent(name) : "");
      };
      pathEl.appendChild(node);
    });

    // the prize chest at the end of this sound's path
    var ready = st >= 3 && !claimed;
    var chest = document.createElement("div");
    chest.className = "node chest " + (ready ? "ready cur" : (claimed ? "done" : "locked"));
    chest.style.transform = "translateX(" + Math.round(Math.sin(4 * 1.7) * 70) + "px)";
    chest.innerHTML = '<button class="bubble">' + (claimed ? "⭐" : (ready ? "🎁" : "🔒")) + '</button><div class="label">' + (claimed ? "Collected!" : "Prize") + "</div>";
    if (ready) chest.querySelector(".bubble").onclick = openChest;
    pathEl.appendChild(chest);

    function openChest() {
      if (!Sona.claimChest(SOUND)) return;
      Sona.addCoins(25);
      Sona.sfx.reward();
      Sona.confetti({ count: 220, duration: 3200 });
      document.getElementById("przTitle").textContent = "You mastered " + SOUND + "!";
      document.getElementById("przMsg").textContent = (name ? name + ", you" : "You") + " finished every step. Amazing!";
      document.getElementById("prize").classList.add("show");
    }
    document.getElementById("przClose").onclick = function () {
      document.getElementById("prize").classList.remove("show");
      location.reload();
    };
  </script>
</body>
</html>
