<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon: bold orange background with a friendly lion-mascot face.
       Filled corner-to-corner; iOS adds the rounded mask itself. -->
  <rect width="1024" height="1024" fill="#f97316"/>

  <!-- Mane (slightly darker, with tufts around) -->
  <g transform="translate(512 512)">
    <circle r="380" fill="#ea580c"/>
    <g fill="#c2410c">
      <!-- 12 tufts evenly around the mane -->
      <circle cx="380" cy="0" r="60"/>
      <circle cx="329" cy="190" r="60"/>
      <circle cx="190" cy="329" r="60"/>
      <circle cx="0" cy="380" r="60"/>
      <circle cx="-190" cy="329" r="60"/>
      <circle cx="-329" cy="190" r="60"/>
      <circle cx="-380" cy="0" r="60"/>
      <circle cx="-329" cy="-190" r="60"/>
      <circle cx="-190" cy="-329" r="60"/>
      <circle cx="0" cy="-380" r="60"/>
      <circle cx="190" cy="-329" r="60"/>
      <circle cx="329" cy="-190" r="60"/>
    </g>

    <!-- Face -->
    <circle r="280" fill="#fef3c7"/>

    <!-- Cheeks -->
    <ellipse cx="-160" cy="60" rx="48" ry="30" fill="#fbcfe8"/>
    <ellipse cx="160" cy="60" rx="48" ry="30" fill="#fbcfe8"/>

    <!-- Eyes -->
    <circle cx="-100" cy="-50" r="34" fill="#1f2937"/>
    <circle cx="100" cy="-50" r="34" fill="#1f2937"/>
    <circle cx="-90" cy="-62" r="12" fill="#ffffff"/>
    <circle cx="110" cy="-62" r="12" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M-22 30 L22 30 L0 70 Z" fill="#c2410c"/>

    <!-- Mouth — friendly smile -->
    <path
      d="M-70 120 Q0 180 70 120"
      stroke="#7c2d12"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
