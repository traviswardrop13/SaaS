      <circle cx="-280" cy="0" r="44"/>
      <circle cx="-242" cy="-140" r="44"/>
      <circle cx="-140" cy="-242" r="44"/>
      <circle cx="0" cy="-280" r="44"/>
      <circle cx="140" cy="-242" r="44"/>
