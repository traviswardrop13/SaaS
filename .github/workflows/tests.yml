name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  suites:
    runs-on: ubuntu-latest
    # 45, not 25 (25 Sep 2026): the battery drives real audio through the
    # practice screen and the eight games, and on this runner it takes about
    # 27-30 minutes. At 25 the job was cancelled mid-run on main (#143) and
    # on #146, which reads as neither pass nor fail. One job, same name, so
    # a required check keeps matching.
    # 75, not 45 (2 Oct 2026): it had grown to 43 minutes on main, and the
    # say-it card's suite (sayitcardtest) took it past 45 on #190, cancelled
    # mid-sayplaytest with every check so far passing. Room to grow, still a
    # cap on a hung run.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The suites drive the real pages in headless Chromium; playwright is
      # their only dependency and is installed standalone (app deps untouched).
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-all.mjs
