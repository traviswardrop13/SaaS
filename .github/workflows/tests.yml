name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The suites drive the real pages in headless Chromium; playwright is
      # their only dependency and is installed standalone (app deps untouched).
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-all.mjs
