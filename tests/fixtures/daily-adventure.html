<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e9">
  <title>Sona — {{title}} test host</title>
  <link href="/fonts.css" rel="stylesheet"><link href="/sayplay.css" rel="stylesheet"><link href="/daily-adventures/{{key}}.css" rel="stylesheet">
  <style>
    /* The real story player will supply this shared full-screen shell. */
    html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--cream);}
    #app{position:fixed;inset:0;width:100%;height:100%;max-width:620px;min-height:0;margin:auto;padding:0;overflow:hidden;display:block;isolation:isolate;}
    #dailyCanvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;}
    #top{position:absolute;z-index:5;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;gap:8px;pointer-events:none;}
    #top button{pointer-events:auto;}#close{display:grid;place-items:center;background:var(--cream-card);color:var(--cream-ink);box-shadow:0 4px 0 var(--cream-line);}#close svg{width:22px;height:22px;}
    .hudpill{background:var(--cream-card);box-shadow:0 4px 0 var(--cream-line);color:var(--cream-ink);}#ttl{font-size:16px;}#dots{gap:6px;padding:13px 12px;}#dots i{width:8px;height:8px;}#dots i.on{background:var(--act);}
    #dailyBanner{position:absolute;z-index:3;top:calc(74px + env(safe-area-inset-top));left:16px;right:16px;width:fit-content;max-width:calc(100% - 32px);margin:0 auto;padding:8px 14px 7px;background:var(--cream-card);border-radius:20px;box-shadow:0 3px 0 var(--cream-line);color:var(--cream-ink);font-family:"Baloo 2",sans-serif;font-size:clamp(17px,4.6vw,21px);font-weight:800;line-height:1.15;text-align:center;pointer-events:none;}
    #dailyControls{position:absolute;z-index:4;inset:0;pointer-events:none;}#dailyHelp{position:absolute;z-index:5;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);min-height:54px;min-width:145px;max-width:calc(100% - 28px);padding:8px 18px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:auto;}#dailyHelp img{width:34px;height:39px;object-fit:contain;flex:none;}
    #turnPanel{position:absolute;z-index:8;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));margin:0;background:var(--cream-card);box-shadow:0 5px 0 var(--cream-line),0 10px 45px rgba(48,35,21,.25);}#turnPanel.yay{box-shadow:0 5px 0 var(--cream-line);}
    #hear{background:var(--cream);color:var(--act-d);box-shadow:0 3px 0 var(--cream-line);min-width:44px;min-height:44px;}#hear svg{width:24px;height:24px;}
    body[data-phase=play] #turnPanel,body[data-phase=finale] #turnPanel,body[data-phase=end] #turnPanel,body[data-phase=ready] #turnPanel,body[data-phase=boot] #turnPanel{visibility:hidden;pointer-events:none;}
    body:not([data-phase=play]) #dailyControls{visibility:hidden;pointer-events:none;}
    .ovl{padding:20px;}.ovlCard{max-height:calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;}button:focus-visible{outline:4px solid var(--act-d);outline-offset:4px;}
    @media(max-width:359px){#ttl{font-size:14px;padding:9px 10px;}#top{gap:7px;}#dots{gap:5px;padding:13px 10px;}#dots i{width:7px;height:7px;}#dailyBanner{font-size:17px;padding:7px 12px;}}
    @media(max-height:640px){#dailyBanner{top:calc(69px + env(safe-area-inset-top));}#dailyHelp{bottom:calc(14px + env(safe-area-inset-bottom));min-height:48px;}#startOvl .ovlCard{gap:7px;padding:16px;}#startTitle{font-size:27px;}#startBtn{min-height:50px;font-size:21px;margin:2px 0 6px;}}
    @media(orientation:landscape) and (max-height:500px){#app{max-width:900px;}#top{padding-top:calc(8px + env(safe-area-inset-top));}#dailyBanner{top:calc(61px + env(safe-area-inset-top));font-size:16px;padding:5px 11px;}#dailyHelp{bottom:calc(9px + env(safe-area-inset-bottom));min-height:44px;}#turnPanel{left:auto;right:12px;width:calc(100% - 120px);max-width:370px;bottom:calc(12px + env(safe-area-inset-bottom));padding:8px;}#picBox{width:44px;height:44px;}#word{font-size:26px;}#listenRow{min-height:36px;}#echoWrap,#echoFace{height:34px;width:34px;}#micState{font-size:16px;}#startOvl .ovlCard{max-width:450px;gap:5px;}#startOvl .ovlEcho{display:none;}#startBtn{min-height:45px;font-size:20px;padding:8px 23px;}}
  </style>
</head>
<body data-phase="boot" data-fixture-game="{{key}}">
  <!-- Local browser fixture only. The test server supplies its catalog entry. -->
  <main id="app">
    <canvas id="dailyCanvas" role="img" aria-label="{{canvasLabel}}"></canvas>
    <header id="top"><button id="close" type="button" aria-label="Back to games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button><span class="hudpill" id="ttl">{{title}}</span><span id="spacer"></span><span class="hudpill" id="dots" role="img" aria-label="{{progressLabel}}"></span></header>
    <div id="dailyBanner" role="status" aria-live="polite">{{banner}}</div>
    <div id="dailyControls"><button id="dailyHelp" class="act-pill" type="button" disabled aria-label="{{helpLabel}}"><img src="/assets/crafted/echo-wave.webp" alt=""><span>{{helpText}}</span></button></div>
    <section id="turnPanel" aria-live="polite"><div id="picBox"><span id="pic"></span></div><div id="word"></div><button id="hear" class="cream-pill" type="button" aria-label="Hear the word again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Zm12 0a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Hear it</span></button><div id="listenRow"><span id="echoWrap"><img id="echoFace" src="/assets/crafted/echo-welcome.webp" alt="Echo"></span><span id="micState"></span><span id="cheer"></span><button id="micBtn" type="button" hidden aria-label="Listen again"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div></section>
  </main>
  <div class="ovl" id="startOvl"><div class="ovlCard"><img class="ovlEcho" src="/assets/crafted/echo-wave.webp" alt=""><h1 id="startTitle">{{title}}</h1><p>{{startCopy}}</p><p>{{helpCopy}}</p><p class="small" id="startSound"></p><button id="startBtn" class="act-pill" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" fill="currentColor"/></svg><span>Let's play</span></button></div></div>
  <div class="ovl" id="primer"><div class="ovlCard"><img class="ovlEcho" src="/assets/crafted/echo-listen.webp" alt=""><h2>Let Echo hear you!</h2><p>{{primerCopy}}</p><p class="small" id="micPromise"></p><button class="btn" id="primerYes" type="button">Turn on Echo's ears</button><button class="ghost" id="primerNo" type="button">Not now</button></div></div>
  <div class="ovl" id="pauseOvl"><div class="ovlCard"><img class="ovlEcho" src="/assets/crafted/echo-think.webp" alt=""><h2>A little break</h2><p>{{pauseCopy}}</p><button class="btn" id="resume" type="button">Keep playing</button></div></div>
  <div class="ovl" id="endOvl"><div class="ovlCard"><img class="ovlEcho endStar" src="/assets/crafted/echo-cheer.webp" alt=""><h2 id="endTitle"></h2><p id="endSub"></p><button class="btn" id="again" type="button">Play again</button><button class="ghost" id="goHome" type="button">Back to games</button></div></div>
  <script src="/sona.js"></script><script src="/crafted-words.js"></script><script src="/sayplay.js"></script><script src="/daily-adventures/{{key}}.js"></script><script src="/daily-adventures/stories.js"></script><script src="/daily-adventures/narration.js"></script>
  <script>
    (function () {
      var game = {{config}}, controller = window.DailyAdventureGames && window.DailyAdventureGames[game.key];
      if (!controller) { document.body.setAttribute("data-fixture-error", "controller-missing"); return; }
      var play = controller;
      if (window.__dailyNarrationFixture) {
        var stories = window.DailyAdventureStories || [], story = null;
        for (var j = 0; j < stories.length; j++) if (stories[j].key === game.key) { story = stories[j]; break; }
        if (!story || !window.DailyAdventureNarration || !window.DailyAdventureNarration.wrap) { document.body.setAttribute("data-fixture-error", "narration-missing"); return; }
        var style = document.createElement("link"); style.rel = "stylesheet"; style.href = "/daily-adventures/narration.css"; document.head.appendChild(style);
        play = window.DailyAdventureNarration.wrap(story, controller);
      }
      var count = Sona.playStyle() === "simple" ? 5 : 8, steps = [];
      for (var i = 0; i < count; i++) steps.push([]);
      SayPlay.start({key:game.key,title:game.title,intro:game.intro,steps:steps,finale:[],done:game.done,play:play,sounds:controller.sounds,soundMs:controller.soundMs});
    })();
  </script>
</body>
</html>
